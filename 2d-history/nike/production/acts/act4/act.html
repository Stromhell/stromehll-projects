<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}@font-face{font-family:SourceSerif;src:url(../../../../shared/fonts/SourceSerif4.ttf)}body{margin:0;background:#000}</style></head>

<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';

const airShoe = (c, x, y, s, glow, win) => { NK.shoe(c, x, y, s, { col: '#f4f0e6', accent: OR, mark: 'swoosh', air: true, window: win }); if (glow > 0) { c.save(); c.globalAlpha = glow * (.6 + .3 * Math.sin(glow * 20)); const gx = x - 90 * s, gy = y - 30 * s; const g = c.createRadialGradient(gx, gy, 0, gx, gy, 70 * s); g.addColorStop(0, 'rgba(140,220,255,.9)'); g.addColorStop(1, 'rgba(140,220,255,0)'); c.fillStyle = g; c.beginPath(); c.arc(gx, gy, 70 * s, 0, 7); c.fill(); c.restore(); } };

window.SHOTS = [
  // 1 Prefontaine leads the pack; the crowd fades to a quiet memorial plaque
  { plate: 'track_trials', cam: { z: [1.1, 1.16], x: [1280, 1320], y: [860, 860] }, bed: [['crowd_loop', .45]],

        (c, lt) => K.card(c, "HONOURED AT NIKE'S HQ", lt, { at: tH, x: 960, y: 860, px: 42, rot: -2 })];

      if (b > .95) { c.lineWidth = 3; c.setLineDash([12, 8]); c.beginPath(); c.moveTo(-330, 60); c.quadraticCurveTo(-340, -80, -150, -110); c.lineTo(220, -60); c.quadraticCurveTo(340, -30, 330, 60); c.closePath(); c.stroke(); c.setLineDash([]); c.beginPath(); c.moveTo(-340, 60); c.lineTo(340, 60); c.lineTo(340, 140); c.lineTo(-340, 140); c.closePath(); c.stroke(); const gl = .5 + .5 * Math.sin(lt * 4); c.fillStyle = `rgba(160,230,255,${.3 + .4 * gl * K.seg(lt, S.tA, S.tA + .5)})`; c.beginPath(); c.roundRect(-220, 74, 440, 52, 24); c.fill(); c.stroke(); c.font = '30px Oswald'; c.fillStyle = '#d8ecff'; c.textAlign = 'center'; c.fillText('PRESSURISED AIR', 0, 190); c.fillText('SOLE · CROSS-SECTION', 0, -220); } c.restore();
      R.figure(c, { x: 1700, y: 1020, s: 1.6, ...RUDY, facing: -1, pose: 'present', t: lt, mood: 'happy', talk: lt > S.tB && lt < S.tB + 4 }); },

      S.D.over = [(c, lt) => K.card(c, 'FRANK RUDY · AEROSPACE ENGINEER', lt, { at: tR, x: 600, y: 900, px: 40, rot: -2 }), (c, lt) => K.card(c, 'OTHERS SAID NO', lt, { at: tT, x: 400, y: 160, px: 44, rot: -4, fill: '#ffd0c0' })];
      S.D.sfx = [[S.tB, 'paper', .45], [tT, 'stamp', .35], [S.tA, 'hum_loop', .2], [S.tA, 'riser', .3]]; } },

  { draw: (c, lt, u, S) => { backdrop('office_day', .45, 10)(c); const g = K.seg(lt, S.tL, S.tL + 1); airShoe(c, 960, 600, 2.4 * E.back(K.seg(lt, .1, .7)), g, false);
      const st = pop(lt, S.tL + .5, .3); if (st > 0) { c.save(); c.translate(1380, 380); c.rotate(-.12); c.scale(1.6 - .6 * st, 1.6 - .6 * st); c.globalAlpha = st; c.strokeStyle = '#c83a2a'; c.lineWidth = 8; c.strokeRect(-200, -60, 400, 120); K.outlined(c, 'NIKE AIR', 0, 0, 74, { fill: '#c83a2a' }); c.restore(); } },
    bed: [['hum_loop', .25]],
    init: S => { S.tL = A.at(S, 'air-cushioned', 3); const tV = A.at(S, 'most valuable', 7);
      S.D.over = [(c, lt) => K.dateTag(c, '1978', lt, { at: .3 }), (c, lt) => K.card(c, 'NIKE SAID YES', lt, { at: .4, x: 420, y: 200, px: 50, rot: -4 }), (c, lt) => K.card(c, 'ONE OF FOOTWEAR\'S BIGGEST NAMES', lt, { at: tV, x: 960, y: 860, px: 42, rot: 2 })];
      S.D.sfx = [[.4, 'pop', .4], [S.tL, 'whoosh_soft', .4], [S.tL + .2, 'hum_loop', .2], [S.tL + .5, 'stamp', .55], [tV, 'chime', .35]]; } },
  // 4 1980 IPO: the ticker scrolls; Knight's jaw drops
  { plate: 'trading', cam: { z: [1.12, 1.2], x: [1280, 1280], y: [860, 860] }, bed: [['trading_loop', .4]],

      S.D.sfx = [[.2, 'trading_loop', .2], [tP, 'chime', .5], [S.tR, 'coins_cascade', .45]]; } },

  { draw: (c, lt, u, S) => { backdrop('workshop', .5, 9)(c); const cut = K.seg(lt, S.tC, S.tC + 1.4); airShoe(c, 860, 620, 2.3, cut, cut > .98);
      if (cut > 0 && cut < 1) { const kx = 860 - 110 + cut * 300; c.save(); c.translate(kx, 700); c.rotate(-.6); c.fillStyle = '#c8c8cc'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.moveTo(0, 0); c.lineTo(30, -16); c.lineTo(30, 0); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#e8b44a'; c.fillRect(30, -10, 110, 22); c.strokeRect(30, -10, 110, 22); c.restore(); }
      R.figure(c, { x: 1600, y: 1020, s: 1.6, ...HATFIELD, facing: -1, pose: lt > S.tC + 1.4 ? 'present' : 'think', t: lt, mood: 'happy' }); },
    bed: [['hum_loop', .25]],
    init: S => { const tH = A.at(S, 'Tinker Hatfield', 2); const tA = A.at(S, 'architect', 4); S.tC = A.at(S, 'cut a window', 6.5); const tM = A.at(S, 'Air Max', 10);
      S.D.over = [(c, lt) => K.dateTag(c, '1987', lt, { at: .3 }), (c, lt) => K.card(c, 'TINKER HATFIELD', lt, { at: tH, x: 1560, y: 200, px: 48, rot: 3 }), (c, lt) => K.card(c, 'TRAINED AS AN ARCHITECT', lt, { at: tA, x: 1560, y: 310, px: 36, rot: -2 }), (c, lt) => K.title(c, 'AIR MAX', lt, { at: tM, x: 860, y: 230, px: 110, fill: '#ffe0c0' })];
      S.D.sfx = [[S.tC, 'scrape', .4], [S.tC + 1.4, 'chime', .45], [tM, 'stamp', .5]]; } },
  // 6 map: designs fly from Oregon to contract factories in Asia; Vietnam lights up
  { plate: 'worldmap', cam: { z: [1.1, 1.3], x: [1280, 1600], y: [640, 640], ease: E.io }, bed: [['wind_loop', .3]],
    live: [(c, lt, u, S) => { const P0 = ll(-122.7, 45.5); const T = [[106, 16, 'VIETNAM', '#c83a2a'], [113, 30, 'CHINA', '#e8a040'], [110, -7, 'INDONESIA', '#e8a040']];
      const pin = (p, a, col) => { if (a <= 0) return; c.save(); c.translate(p[0], p[1]); c.scale(a, a); c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.arc(0, -34, 16, 0, 7); c.moveTo(-10, -26); c.lineTo(0, 0); c.lineTo(10, -26); c.fill(); c.stroke(); c.restore(); };
      pin(P0, pop(lt, .3), '#1f5aa8');
      T.forEach((t, k) => { const f = K.seg(lt, S.tF + k * .5, S.tF + k * .5 + 2.2), P1 = ll(-170, 45.5 - k * 3), P2 = ll(190, 40 - k * 6), P3 = ll(t[0], t[1]); const a = Math.min(1, f * 2), b = Math.max(0, f * 2 - 1);
        c.save(); c.strokeStyle = 'rgba(200,58,42,.85)'; c.lineWidth = 6; c.setLineDash([16, 10]); c.lineDashOffset = -lt * 30; if (a > 0) { c.beginPath(); c.moveTo(...P0); c.lineTo(P0[0] + (P1[0] - P0[0]) * a, P0[1] + (P1[1] - P0[1]) * a); c.stroke(); } if (b > 0) { c.beginPath(); c.moveTo(...P2); c.lineTo(P2[0] + (P3[0] - P2[0]) * b, P2[1] + (P3[1] - P2[1]) * b); c.stroke(); } c.restore();
        if (f >= 1) { pin(P3, pop(lt, S.tF + k * .5 + 2.2), t[3]); if (k === 0) { const h = K.seg(lt, S.tV, S.tV + .6); if (h > 0) { c.save(); c.globalAlpha = .45 * h * (.7 + .3 * Math.sin(lt * 5)); c.fillStyle = '#ff6a40'; c.beginPath(); c.arc(P3[0], P3[1] - 10, 70, 0, 7); c.fill(); c.restore(); } } } }); }],
    init: S => { const tD = A.at(S, 'designs shoes', 2.4); S.tF = A.at(S, 'contract factories', 4.6); S.tV = A.at(S, 'Vietnam', 10);

  // 7 a kid at the shop window; a thought bubble of himself winning a race
  { plate: 'shoe_shop', cam: { z: [1.12, 1.22], x: [1280, 1240], y: [860, 840], ease: E.io }, bed: [['city_loop', .2]],

        (c, lt) => K.card(c, 'ANYONE CAN COPY A SHOE', lt, { at: tC, x: 1500, y: 200, px: 42, rot: 3 }), (c, lt) => K.card(c, 'NOT A FEELING', lt, { at: tF, x: 1500, y: 310, px: 52, rot: -3, fill: '#ffe0c0' })];
      S.D.sfx = [[S.tB, 'whoosh_soft', .4], [S.tB + 1, 'run_steps', .3], [S.tB + 3, 'crowd_cheer', .4], [tF, 'chime', .45]]; } },
];
const _build = A.build; A.build = () => { const T2 = window.TIMING; K.setWords(T2.words); T2.shots.forEach((S, i) => { const D = window.SHOTS[i]; if (!D) return; D.live = D.live || []; D.front = D.front || []; D.over = D.over || []; S.D = D; S.vo_start = S.vo_start ?? S.start; if (D.init) D.init(S); }); _build(); };

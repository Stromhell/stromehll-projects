<!doctype html><html><head><meta charset="utf-8"><title>NK act 7 - The Years Fly</title>
<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}@font-face{font-family:SourceSerif;src:url(../../../../shared/fonts/SourceSerif4.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/rig_v5.js"></script><script src="../../../../shared/rig_leo.js"></script><script>window.RIGSTYLE = "gumball";</script><script src="../../../../shared/kit.js"></script><script src="../../../../shared/anim.js"></script>

<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
for (const n of ['office_day', 'office', 'track_trials', 'shoe_shop', 'suburb', 'park']) K.load(n, PL + n + '.jpg');
const SW = 1920, SH = 1080, INK = NK.INK, OR = NK.ORANGE, TE = NK.TEAL;
const pop = (lt, at, d = .45) => E.back(K.seg(lt, at, at + d));
const backdrop = (name, b = .6, blur = 8) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${b})`; const s2 = 1.06 * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 720 * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); c.restore(); K.screen(c); };
const star = (c, x, y, r, col) => { c.save(); c.translate(x, y); c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); for (let k = 0; k < 10; k++) { const a = k * Math.PI / 5 - Math.PI / 2, rr = k % 2 ? r * .42 : r; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } c.closePath(); c.fill(); c.stroke(); c.restore(); };
const disc = (c, x, y, r, col) => { c.save(); c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); c.stroke(); c.restore(); };
const flame = (c, x, y, s, lt) => { c.save(); c.translate(x, y); c.scale(s, s); for (const [col, k] of [['#e8502a', 1], ['#f2a030', .7], ['#ffe070', .4]]) { c.fillStyle = col; c.beginPath(); c.moveTo(-60 * k, 0); for (let i = 0; i <= 6; i++) { const xx = -60 * k + i * 20 * k, h = (120 + 50 * Math.sin(lt * 9 + i * 1.7)) * k; c.quadraticCurveTo(xx + 10 * k, -h, xx + 20 * k, -h * .3); } c.lineTo(60 * k, 0); c.closePath(); c.fill(); } c.restore(); };

window.SHOTS = [
  // 1 the timeline scrolls: 1996 golf, 2003 Converse, 2003 an 18-year-old in a jersey
  { draw: (c, lt, u, S) => { backdrop('office_day', .4, 10)(c); const sc = -Math.min(1, lt / (S.dur || 15)) * 700; c.save(); c.translate(sc, 0); c.strokeStyle = '#f4f0e6'; c.lineWidth = 8; c.beginPath(); c.moveTo(100, 640); c.lineTo(2700, 640); c.stroke();
      const items = [[S.t1, 560, '1996', 'TIGER WOODS SIGNS', (x) => { disc(c, x, 470, 70, '#f8f8f4'); c.fillStyle = 'rgba(0,0,0,.25)'; for (let k = 0; k < 12; k++) { c.beginPath(); c.arc(x - 40 + (k % 4) * 26, 440 + Math.floor(k / 4) * 26, 6, 0, 7); c.fill(); } }], [S.t2, 1260, '2003', 'BUYS CONVERSE · ~$305M', (x) => { disc(c, x, 470, 80, '#1a1a1a'); star(c, x, 470, 56, '#f4f0e6'); }], [S.t3, 1960, '2003', 'LEBRON JAMES, 18', (x) => { R.figure(c, { x, y: 590, s: .9, costume: 'shirt', look: Object.assign(RIG6.lookFrom({ costume: 'shirt', hair: 'bald', seed: 120 }), { topCol: '#f4f0e6', legs: '#f4f0e6' }), pose: 'cheer', t: lt, mood: 'happy', facing: 1 }); }]];
      items.forEach(([at, x, yr, lbl, icon]) => { const a = pop(lt, at); if (a <= 0) return; c.save(); c.globalAlpha = Math.min(1, a); disc(c, x, 640, 18, OR); icon(x); K.outlined(c, yr, x, 740, 70, { fill: '#ffe0c0' }); c.font = '36px Anton'; c.fillStyle = '#f4f0e6'; c.textAlign = 'center'; c.fillText(lbl, x, 810); c.restore(); }); c.restore(); },
    bed: [['office_loop', .2]],
    init: S => { S.dur = S.end - S.start; S.t1 = A.at(S, 'Tiger Woods', 3); S.t2 = A.at(S, 'Converse', 7); S.t3 = A.at(S, 'LeBron', 11);
      S.D.over = [(c, lt) => K.title(c, 'THE YEARS FLY', lt, { at: .2, y: 180, px: 90, fill: '#ffe8c8', until: S.t1 + 2 })];
      S.D.sfx = [[.2, 'whoosh', .4], [S.t1, 'pop', .45], [S.t2, 'pop', .45], [S.t2 + .3, 'coins', .3], [S.t3, 'pop', .45], [S.t3 + .2, 'crowd_cheer', .25]]; } },
  // 2 2015: LIFETIME stamped on a contract; 2016: Shoe Dog slides onto the shelf
  { draw: (c, lt, u, S) => { backdrop('office', .45, 9)(c); NK.paper(c, 660, 540, 640, 760, -.03); c.save(); c.fillStyle = INK; c.font = '40px Anton'; c.textAlign = 'center'; c.fillText('ENDORSEMENT DEAL', 660, 250); c.strokeStyle = 'rgba(40,40,60,.4)'; c.lineWidth = 4; for (let k = 0; k < 9; k++) { c.beginPath(); c.moveTo(420, 320 + k * 50); c.lineTo(900 - (k % 3) * 60, 320 + k * 50); c.stroke(); } c.restore();
      const st = pop(lt, S.tL, .3); if (st > 0) { c.save(); c.translate(660, 560); c.rotate(-.18); c.scale(1.7 - .7 * st, 1.7 - .7 * st); c.globalAlpha = st; c.strokeStyle = '#c83a2a'; c.lineWidth = 10; c.strokeRect(-250, -70, 500, 140); K.outlined(c, 'LIFETIME', 0, 0, 96, { fill: '#c83a2a' }); c.restore(); }
      c.save(); c.fillStyle = '#6a4a2e'; c.strokeStyle = INK; c.lineWidth = 6; c.fillRect(1120, 700, 640, 30); c.strokeRect(1120, 700, 640, 30); [['#3a5a7a', 70], ['#7a3a3a', 60], ['#4a6a3a', 80], ['#8a6a2a', 64]].forEach(([col, w], i) => { c.fillStyle = col; c.fillRect(1160 + i * 90, 470, w, 230); c.strokeRect(1160 + i * 90, 470, w, 230); }); c.restore();
      const b = E.out(K.seg(lt, S.tB, S.tB + .8)); if (b > 0) { c.save(); c.translate(1640 + (1 - b) * 500, 700); c.fillStyle = '#f2ead8'; c.strokeStyle = INK; c.lineWidth = 6; c.fillRect(-60, -300, 120, 300); c.strokeRect(-60, -300, 120, 300); c.save(); c.translate(0, -150); c.rotate(-Math.PI / 2); c.fillStyle = INK; c.font = '44px Anton'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('SHOE DOG', 0, 0); c.restore(); NK.swoosh(c, 0, -40, 50, OR); c.restore(); } },
    bed: [['office_loop', .2]],
    init: S => { S.tL = A.at(S, 'lifetime deal', 2); const tR = A.at(S, 'billion', 4.4); S.tB = A.at(S, 'Shoe Dog', 7);
      S.D.over = [(c, lt) => K.dateTag(c, lt < S.tB - .3 ? '2015' : '2016', lt, { at: .3 }), (c, lt) => K.card(c, 'LEBRON · REPORTEDLY $1B+', lt, { at: tR, x: 1440, y: 300, px: 40, rot: -2 }), (c, lt) => K.card(c, "KNIGHT'S MEMOIR: A BESTSELLER", lt, { at: S.tB + .6, x: 1440, y: 830, px: 36, rot: 2 })];
      S.D.sfx = [[S.tL, 'stamp', .6], [tR, 'coins', .35], [S.tB, 'scrape', .4], [S.tB + .8, 'thud', .3]]; } },
  // 3 2017: runners bounce on springy shoes; the rulebook slams shut
  { plate: 'track_trials', cam: { z: [1.08, 1.12], x: [1280, 1280], y: [860, 860] }, bed: [['crowd_loop', .35]],
    figs: [0, 1, 2].map(k => ({ costume: ['shirt', 'shirtsleeves', 'school'][k], hair: ['short', 'bald', 'curly'][k], seed: 130 + k, s: 1.6, y: 1330 - k * 40, mood: 'happy', anim: (o, lt) => { const w = R.walkX(lt, -400 - k * 300, 2900, .2, 5.5, o.s); o.x = w.x; o.t = w.phase; o.pose = 'run'; o.facing = 1; o.y = 1330 - k * 40 - Math.abs(Math.sin(lt * 5 + k)) * 60; } })),
    live: [(c, lt) => { for (let k = 0; k < 3; k++) { const w = R.walkX(lt, -400 - k * 300, 2900, .2, 5.5, 1.6); const yy = 1330 - k * 40, lift = Math.abs(Math.sin(lt * 5 + k)) * 60; c.save(); c.strokeStyle = '#c8c8cc'; c.lineWidth = 6; c.beginPath(); for (let i = 0; i <= 8; i++) { const x = w.x + (i % 2 ? 16 : -16), y = yy - lift + i * lift / 8; i ? c.lineTo(x, y) : c.moveTo(x, y); } if (lift > 6) c.stroke(); c.restore(); } }],
    init: S => { const tV = A.at(S, 'Vaporfly', 1.2); const tR = A.at(S, 'new rules', 6.5);
      S.D.over = [(c, lt) => K.dateTag(c, '2017', lt, { at: .3 }), (c, lt) => K.card(c, 'VAPORFLY', lt, { at: tV, x: 470, y: 230, px: 56, rot: -3 }), (c, lt) => { const a = pop(lt, tR - .4); if (a <= 0) return; const sh = K.seg(lt, tR, tR + .3); c.save(); c.translate(1500, 400); c.scale(a, a); c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(-210, -150, 440, 320); c.fillStyle = '#1f3a6a'; c.strokeStyle = INK; c.lineWidth = 6; c.fillRect(-220, -160, 440, 320); c.strokeRect(-220, -160, 440, 320); c.fillStyle = '#f4f0e6'; c.fillRect(-220 + 440 * (1 - sh) * .5, -160, 8, 320); K.outlined(c, 'SHOE RULES', 0, -30, 56, { fill: '#fff' }); c.font = '30px Oswald'; c.fillStyle = '#f4f0e6'; c.textAlign = 'center'; c.fillText('NEW LIMITS ON SHOE TECH', 0, 60); c.restore(); }];
      S.D.sfx = [[.4, 'pop', .3], [1, 'pop', .3], [tV, 'whoosh', .4], [tR, 'door_slam', .5]]; } },
  // 4 2018: split screen: shoes burning on the left; a queue at the till on the right
  { draw: (c, lt, u, S) => { c.save(); c.beginPath(); c.rect(0, 0, 960, SH); c.clip(); backdrop('suburb', .5, 6)(c); NK.shoe(c, 480, 820, 1.4, { col: '#f4f0e6', accent: OR, mark: 'swoosh' }); if (lt > S.tB) flame(c, 480, 870, 2.4 * Math.min(1, (lt - S.tB) * 2), lt); c.restore();
      c.save(); c.beginPath(); c.rect(960, 0, 960, SH); c.clip(); backdrop('shoe_shop', .7, 4)(c); for (let k = 0; k < 5; k++) { R.figure(c, { x: 1060 + k * 170, y: 1040 - (k % 2) * 20, s: 1.15, costume: ['shirt', 'dress', 'school', 'shirtsleeves', 'office'][k], hair: ['short', 'long', 'curly', 'swept', 'bun'][k], seed: 140 + k, facing: 1, pose: k === 4 && lt > S.tO ? 'carry' : 'stand', t: lt, mood: 'happy' }); } c.restore();
      c.save(); c.fillStyle = '#f4f0e6'; c.fillRect(954, 0, 12, SH); c.restore(); },
    bed: [['fire_loop', .25], ['city_loop', .2]],
    init: S => { const tA = A.at(S, 'Kaepernick', 3); S.tB = A.at(S, 'burned', 5); S.tO = A.at(S, 'bought more', 7.5); const tW = A.at(S, 'awards', 9.5);
      S.D.over = [(c, lt) => K.dateTag(c, '2018', lt, { at: .3 }), (c, lt) => K.card(c, 'JUST DO IT AT 30 · COLIN KAEPERNICK AD', lt, { at: tA, x: 960, y: 110, px: 36, rot: -1 }), (c, lt) => K.card(c, 'SOME BURNED THEIR SHOES', lt, { at: S.tB, x: 480, y: 260, px: 40, rot: -3 }), (c, lt) => K.card(c, 'OTHERS BOUGHT MORE', lt, { at: S.tO, x: 1440, y: 260, px: 40, rot: 3 }), (c, lt) => K.card(c, 'MAJOR AD AWARDS', lt, { at: tW, x: 1440, y: 370, px: 36, rot: -2 })];
      S.D.sfx = [[tA, 'pop', .35], [S.tB, 'fire_loop', .3], [S.tO, 'coins', .4], [S.tO + .3, 'chime', .3], [tW, 'crowd_cheer', .3]]; } },
  // 5 2019: a lone runner crosses the line; the clock stops at 1:59:40
  { plate: 'park', cam: { z: [1.08, 1.14], x: [1280, 1300], y: [840, 840] }, bed: [['crowd_loop', .4]],
    figs: [{ costume: 'shirt', hair: 'bald', seed: 150, s: 1.9, y: 1360, mood: 'happy', anim: (o, lt, u, S) => { const w = R.walkX(lt, -300, 1500, .2, S.tF - .2, o.s); o.x = w.x; o.t = w.phase; o.pose = lt > S.tF ? 'cheer' : 'run'; o.facing = 1; } }],
    live: [(c, lt, u, S) => { const br = lt > S.tF; c.save(); c.strokeStyle = '#f4f0e6'; c.lineWidth = 8; c.beginPath(); c.moveTo(1640, 1100); c.lineTo(1640, 1480); c.stroke(); c.fillStyle = '#c8102e'; if (!br) c.fillRect(1640, 1180, 30, 8); else { c.save(); c.translate(1640, 1184); c.rotate(.6); c.fillRect(0, -4, 140, 8); c.restore(); } c.restore(); }],
    init: S => { const tK = A.at(S, 'Kipchoge', 1.6); S.tF = A.at(S, 'under two hours', 5); const tN = A.at(S, "didn't count", 8);
      S.D.over = [(c, lt) => K.dateTag(c, '2019', lt, { at: .3 }), (c, lt) => K.card(c, 'ELIUD KIPCHOGE · NIKE PROTOTYPES', lt, { at: tK, x: 520, y: 200, px: 38, rot: -3 }), (c, lt) => { const a = K.seg(lt, .2, .6); if (a <= 0) return; const tt = lt < S.tF ? 7140 + (lt - .2) * 60 / Math.max(1, S.tF - .2) * (40 / 60) * 60 / 60 * 0 + Math.min(40, (lt - .2) / (S.tF - .2) * 40) : 7180; const h = Math.floor(tt / 3600), m = Math.floor(tt % 3600 / 60), s2 = Math.floor(tt % 60); c.save(); c.globalAlpha = a; c.translate(1460, 230); c.fillStyle = '#0c0f0c'; c.strokeStyle = '#e8b44a'; c.lineWidth = 6; c.beginPath(); c.roundRect(-230, -70, 460, 140, 14); c.fill(); c.stroke(); c.font = '96px "Courier New", monospace'; c.fillStyle = lt > S.tF ? '#7ef08a' : '#ff6a40'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(h + ':' + String(m).padStart(2, '0') + ':' + String(s2).padStart(2, '0'), 0, 4); c.restore(); }, (c, lt) => K.card(c, 'NOT AN OFFICIAL RECORD', lt, { at: tN, x: 1460, y: 380, px: 38, rot: 2 })];
      S.D.sfx = [[.2, 'run_steps', .45], [S.tF, 'crowd_cheer', .55], [S.tF, 'chime', .4], [tN, 'pop', .35]]; } },
];
const _build = A.build; A.build = () => { const T2 = window.TIMING; K.setWords(T2.words); T2.shots.forEach((S, i) => { const D = window.SHOTS[i]; if (!D) return; D.live = D.live || []; D.front = D.front || []; D.over = D.over || []; S.D = D; S.vo_start = S.vo_start ?? S.start; if (D.init) D.init(S); }); _build(); };
A.build(); K.boot();
</script></body></html>

      for (const d of [-1, 1]) { c.save(); c.translate(d * 440, 0); c.rotate(-tilt); c.lineWidth = 3; c.beginPath(); c.moveTo(0, 0); c.lineTo(-120, 200); c.moveTo(0, 0); c.lineTo(120, 200); c.stroke(); c.lineWidth = 6; c.beginPath(); c.ellipse(0, 210, 150, 34, 0, 0, Math.PI); c.fill(); c.stroke(); c.beginPath(); c.moveTo(-150, 210); c.lineTo(150, 210); c.stroke(); K.outlined(c, d < 0 ? 'CRITICS' : 'SUPPORTERS', 0, 290, 46, { fill: d < 0 ? '#ffd0c0' : '#d8ffd0' }); c.restore(); } c.restore(); },
    bed: [['hum_loop', .2]],
    init: S => { const tC = A.at(S, 'Critics', .6), tS = A.at(S, 'Supporters', 3), tA = A.at(S, 'still goes on', 6.5);
      S.D.over = [(c, lt) => K.card(c, '"NOT ENOUGH"', lt, { at: tC + .3, x: 400, y: 200, px: 44, rot: -3 }), (c, lt) => K.card(c, '"FASTER THAN MOST"', lt, { at: tS + .3, x: 1520, y: 200, px: 44, rot: 3 }), (c, lt) => K.card(c, 'STILL ARGUED TODAY', lt, { at: tA, x: 960, y: 1000, px: 42, rot: -2 })];
      S.D.sfx = [[tC, 'creak', .35], [tS, 'creak', .35], [tA, 'pop', .35]]; } },
];
const _build = A.build; A.build = () => { const T2 = window.TIMING; K.setWords(T2.words); T2.shots.forEach((S, i) => { const D = window.SHOTS[i]; if (!D) return; D.live = D.live || []; D.front = D.front || []; D.over = D.over || []; S.D = D; S.vo_start = S.vo_start ?? S.start; if (D.init) D.init(S); }); _build(); };

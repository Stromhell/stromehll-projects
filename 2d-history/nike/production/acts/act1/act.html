<!doctype html><html><head><meta charset="utf-8"><title>NK act 1 - The Coach and the Runner</title>
<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}@font-face{font-family:SourceSerif;src:url(../../../../shared/fonts/SourceSerif4.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/rig_v5.js"></script><script src="../../../../shared/rig_leo.js"></script><script>window.RIGSTYLE = "gumball";</script><script src="../../../../shared/kit.js"></script><script src="../../../../shared/anim.js"></script>

<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
for (const n of ['track_rain', 'workshop', 'worldmap', 'kobe_office', 'office_day']) K.load(n, PL + n + '.jpg');

// a simple 4-engine prop/jet airliner icon (screen or world), facing left
const plane = (c, x, y, s, rot = 0) => { c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s); c.fillStyle = '#f4f2ec'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.ellipse(0, 0, 90, 16, 0, 0, 7); c.fill(); c.stroke(); c.beginPath(); c.moveTo(10, 0); c.lineTo(40, -70); c.lineTo(60, -70); c.lineTo(45, 0); c.lineTo(60, 70); c.lineTo(40, 70); c.closePath(); c.fill(); c.stroke(); c.beginPath(); c.moveTo(70, 0); c.lineTo(88, -30); c.lineTo(96, -30); c.lineTo(92, 0); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#c83a2a'; c.fillRect(-60, -4, 110, 5); c.restore(); };

window.SHOTS = [
  // 1 rainy cinder track: Bowerman with a stopwatch; runners splash past
  { plate: 'track_rain', cam: { z: [1.12, 1.2], x: [1280, 1320], y: [880, 880] }, bed: [['rain_loop', .7]],

      { costume: 'shirt', hair: 'short', seed: 11, s: 1.75, y: 1360, walk: { x0: -200, x1: 2800, t0: .4, dur: 4.2, pose: 'run' }, mood: 'worried' },

        const x = K.seg(lt, S.tL, S.tL + .4); if (x > 0) { c.save(); c.strokeStyle = '#ff7a5a'; c.lineWidth = 12; c.lineCap = 'round'; c.beginPath(); c.moveTo(1060, 320); c.lineTo(1060 + 420 * x, 320 + 220 * x); c.moveTo(1480, 320); c.lineTo(1480 - 420 * x, 320 + 220 * x); c.stroke(); c.restore(); } }

      S.D.over = [(c, lt) => K.badge(c, "BOWERMAN'S MATHS", lt, { at: .3 })]; S.D.sfx = [[S.t1, 'scrape', .3], [S.tM, 'scrape', .3], [S.tP, 'thud', .35], [S.tL, 'scrape', .4]]; } },

  { plate: 'track_rain', cam: { z: [1.25, 1.3], x: [1180, 1200], y: [900, 900] }, bed: [['rain_loop', .5]],

      S.D.over = [(c, lt) => K.card(c, 'PHIL KNIGHT', lt, { at: tK, x: 520, y: 230, px: 60, rot: -4 }), (c, lt) => K.card(c, 'GOOD, NOT GREAT', lt, { at: tG, x: 520, y: 340, px: 40, rot: 2, until: S.tL }), (c, lt) => K.card(c, 'BUT HE LISTENED', lt, { at: S.tL, x: 520, y: 340, px: 44, rot: 2 })];
      S.D.sfx = [[tK, 'pop', .45], [tG, 'tick', .35], [S.tL, 'chime', .4]]; } },
  // 5 the Stanford paper: CAMERAS / SHOES, Japan beating Germany
  { draw: (c, lt, u, S) => { backdrop('office_day', .55, 9)(c); NK.paper(c, 960, 520, 1180, 780, -.012);
      c.save(); c.fillStyle = INK; c.font = '40px SourceSerif, serif'; c.textAlign = 'center'; c.fillText('Stanford Graduate School of Business, 1962', 960, 200); c.font = 'italic 30px SourceSerif, serif'; c.fillText('P. Knight — "Can Japanese sports shoes do to German sports shoes', 960, 250); c.fillText('what Japanese cameras did to German cameras?"', 960, 290); c.restore();
      c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(960, 330); c.lineTo(960, 870); c.stroke();
      const col = (x, title, a, b, at) => { const k = K.seg(lt, at, at + .5); if (k <= 0) return; c.save(); c.globalAlpha = k; K.outlined(c, title, x, 380, 60); c.fillStyle = INK; c.font = '44px Anton'; c.textAlign = 'center'; c.fillText(a, x, 520); c.fillText(b, x, 760);
        const ar = K.seg(lt, at + .8, at + 1.4); if (ar > 0) { c.strokeStyle = '#c83a2a'; c.lineWidth = 10; c.lineCap = 'round'; c.beginPath(); c.moveTo(x, 715); c.lineTo(x, 715 - 140 * ar); c.stroke(); c.beginPath(); c.moveTo(x - 24, 715 - 140 * ar + 30); c.lineTo(x, 715 - 140 * ar); c.lineTo(x + 24, 715 - 140 * ar + 30); c.stroke(); } c.restore(); };
      col(670, 'CAMERAS', 'GERMANY', 'JAPAN', S.tC); col(1250, 'SHOES', 'GERMANY (ADIDAS)', 'JAPAN?', S.tS); },
    bed: [['office_loop', .25]],
    init: S => { S.tC = A.at(S, 'cameras', 6.5); S.tS = A.at(S, 'Japanese running shoes', 3); S.D.over = [(c, lt) => K.dateTag(c, '1962', lt, { at: .3 })]; S.D.sfx = [[.3, 'paper', .4], [S.tS, 'pop', .4], [S.tC, 'pop', .4], [S.tC + .8, 'whoosh_soft', .3]]; } },
  // 6 a plane over the Pacific to Kobe; Onitsuka makes the Tiger
  { plate: 'worldmap', cam: { z: [1.15, 1.35], x: [1280, 1500], y: [620, 600], ease: E.io }, bed: [['wind_loop', .3]],
    live: [(c, lt, u, S) => { const P0 = ll(-122.7, 45.5), P1 = ll(-170, 47), P2 = ll(190, 42), P3 = ll(135.2, 34.7), f = K.seg(lt, S.tF, S.tF + 3.2);
      const pin = (p, a, col) => { if (a <= 0) return; c.save(); c.translate(p[0], p[1]); c.scale(a, a); c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.arc(0, -34, 16, 0, 7); c.moveTo(-10, -26); c.lineTo(0, 0); c.lineTo(10, -26); c.fill(); c.stroke(); c.restore(); };
      pin(P0, pop(lt, .3), '#1f5aa8'); c.save(); c.strokeStyle = 'rgba(160,40,30,.8)'; c.lineWidth = 5; c.setLineDash([14, 10]);
      const a = Math.min(1, f * 2), b = Math.max(0, f * 2 - 1); c.beginPath(); c.moveTo(...P0); c.lineTo(P0[0] + (P1[0] - P0[0]) * a, P0[1] + (P1[1] - P0[1]) * a); c.stroke(); if (b > 0) { c.beginPath(); c.moveTo(...P2); c.lineTo(P2[0] + (P3[0] - P2[0]) * b, P2[1] + (P3[1] - P2[1]) * b); c.stroke(); } c.restore();
      if (f > 0 && f < 1) { const p = f < .5 ? [P0[0] + (P1[0] - P0[0]) * a, P0[1] + (P1[1] - P0[1]) * a] : [P2[0] + (P3[0] - P2[0]) * b, P2[1] + (P3[1] - P2[1]) * b]; plane(c, p[0], p[1] - 10, .55, f < .5 ? .02 : .05); }
      pin(P3, pop(lt, S.tF + 3.2), '#c83a2a'); if (lt > S.tF + 3.4) { NK.shoe(c, P3[0] - 40, P3[1] + 210, .8 * pop(lt, S.tT), { col: '#f4f0e6', accent: '#c83a2a', mark: 'tiger' }); } }],

      S.D.sfx = [[.3, 'pop', .35], [S.tF, 'whoosh', .4], [S.tF + 3.2, 'pop', .45], [S.tT, 'chime', .4]]; } },
  // 7 Kobe office: which company? Knight sweats; a blue ribbon pops in a thought bubble
  { plate: 'kobe_office', cam: { z: [1.12, 1.22], x: [1280, 1200], y: [860, 860] }, bed: [['hum_loop', .3]],

      S.D.sfx = [[S.tQ, 'tick', .35], [S.tN, 'heartbeat', .35], [S.tB - .6, 'pop', .5], [S.tB + 1, 'chime', .4]]; } },

      S.D.sfx = [[.2, 'hit', .5], [S.tS, 'scrape', .4], [tW, 'stamp', .45]]; } },
];
const _build = A.build; A.build = () => { const T2 = window.TIMING; K.setWords(T2.words); T2.shots.forEach((S, i) => { const D = window.SHOTS[i]; if (!D) return; D.live = D.live || []; D.front = D.front || []; D.over = D.over || []; S.D = D; S.vo_start = S.vo_start ?? S.start; if (D.init) D.init(S); }); _build(); };

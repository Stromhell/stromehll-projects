<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
const SW = 1920, SH = 1080, INK = TW.INK, RED = TW.RED, pop = TW.pop, fade = TW.fade;
const backdrop = (name, b = .5, blur = 8) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${b})`; const s2 = 1.06 * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 720 * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); c.restore(); K.screen(c); };
const CARRY = () => ({ shL: 30, elL: -75, shR: 35, elR: -75 });
const endTitle = (secs) => { const T = window.TIMING; const last = T.shots[T.shots.length - 1]; T.shots.push({ i: T.shots.length, start: last.end, end: last.end + secs, vo_start: last.end, vo_end: last.end, text: '' }); T.dur = last.end + secs; };
// CP act 0 (v3) - Cold open: Key Largo 2019 night crash (from a distance), the Miami verdict, phone fine vs showroom tablet, title.
// Plates: night_road (side-on, road y 1150, T-junction x 1790+), courtroom (floor 1180), rain_street, showroom, title.
for (const n of ['night_road', 'courtroom', 'rain_street', 'showroom', 'title']) K.load(n, PL + n + '.jpg');
const rr = TW.rr, txt = TW.txt, clamp = K.clamp;
const lerp = (a, b, u) => a + (b - a) * u;
// ---- windscreen (motorway plate): glass outline, rain, spray, tail-light smear, condensation, wipers
const glass = (c) => { c.beginPath(); c.moveTo(350, 108); c.lineTo(2210, 108); c.lineTo(2425, 975); c.lineTo(130, 975); c.closePath(); };
const rain = (c, lt, n = 110) => { c.save(); glass(c); c.clip(); c.strokeStyle = 'rgba(210,220,235,.32)'; c.lineWidth = 2.5;
  for (let k = 0; k < n; k++) { const x = 160 + (k * 977) % 2260, y = 100 + ((k * 131 + lt * 1500) % 900); c.beginPath(); c.moveTo(x, y); c.lineTo(x - 8, y + 44); c.stroke(); }
  for (let k = 0; k < 70; k++) { const x = 220 + (k * 613) % 2140, y = 140 + (k * 293) % 800, a = .25 + .2 * Math.sin(lt * 1.3 + k); c.fillStyle = `rgba(230,236,245,${a})`; c.beginPath(); c.arc(x, y + ((lt * 18 + k * 7) % 30), 3 + (k % 3), 0, 7); c.fill(); }
  c.restore(); };
const traffic = (c, lt) => { // red tail-light smears + lorry spray
  const p = .8 + .2 * Math.sin(lt * 3);
  for (const [x, y, r] of [[1500, 728, 120], [1630, 728, 120], [850, 712, 70], [905, 712, 70], [1125, 680, 60], [1185, 680, 60], [1010, 640, 40]]) { TW.glow(c, x, y, r, '255,40,30', .55 * p); c.save(); c.globalAlpha = .18 * p; c.fillStyle = '#ff3a2a'; c.fillRect(x - 6, y, 12, 120 + r * .6); c.restore(); }
  c.save(); glass(c); c.clip();
  for (let k = 0; k < 16; k++) { const ph = (lt * .6 + k / 16) % 1, x = 1565 + Math.sin(k * 2.1) * 140 * ph, y = 760 - 90 * ph; c.fillStyle = `rgba(220,225,235,${.16 * (1 - ph)})`; c.beginPath(); c.ellipse(x, y, 60 + 140 * ph, 26 + 40 * ph, 0, 0, 7); c.fill(); }
  c.restore(); };
const fog = (c, a) => { if (a <= 0) return; c.save(); glass(c); c.clip(); const g = c.createRadialGradient(1280, 560, 120 + 600 * (1 - a), 1280, 560, 1500); g.addColorStop(0, 'rgba(205,212,222,0)'); g.addColorStop(.35, `rgba(205,212,222,${.55 * a})`); g.addColorStop(1, `rgba(215,220,228,${.92 * a})`); c.fillStyle = g; c.fillRect(0, 0, 2560, 1000);
  c.fillStyle = `rgba(200,208,218,${.25 * a})`; for (let k = 0; k < 40; k++) { c.beginPath(); c.arc(200 + (k * 547) % 2200, 130 + (k * 197) % 820, 30 + (k % 5) * 12, 0, 7); c.fill(); } c.restore(); };
const wipers = (c, lt, sp = 2.6) => { const a = -.06 - 1.5 * (.5 - .5 * Math.cos(lt * sp));
  for (const [px, py, L] of [[760, 985, 860], [1600, 985, 800]]) { c.save(); c.translate(px, py); c.rotate(-a - (px > 1000 ? .05 : 0)); c.lineCap = 'round';
    c.strokeStyle = INK; c.lineWidth = 20; c.beginPath(); c.moveTo(0, 0); c.lineTo(-L, 0); c.stroke(); c.strokeStyle = '#2a2a30'; c.lineWidth = 12; c.stroke();
    c.strokeStyle = '#111'; c.lineWidth = 9; c.beginPath(); c.moveTo(-L * .25, -6); c.lineTo(-L, -6); c.stroke(); c.fillStyle = '#3a3a40'; c.beginPath(); c.arc(0, 0, 18, 0, 7); c.fill(); c.restore(); } };
const dashTop = (c) => { const g = c.createLinearGradient(0, 975, 0, 1060); g.addColorStop(0, '#2a2622'); g.addColorStop(1, '#141210'); c.fillStyle = g; c.beginPath(); c.moveTo(0, 990); c.quadraticCurveTo(1280, 960, 2560, 990); c.lineTo(2560, 1060); c.lineTo(0, 1060); c.fill(); c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 992); c.quadraticCurveTo(1280, 962, 2560, 992); c.stroke(); };
// Dave's arm (sleeve from off-frame elbow ex,ey to the hand at hx,hy). o.point: index finger out; o.grip: curled on a rim
const arm = (c, ex, ey, hx, hy, s = 1, o = {}) => { const ang = Math.atan2(hy - ey, hx - ex), L = Math.hypot(hx - ex, hy - ey);
  c.save(); c.translate(ex, ey); c.rotate(ang); c.lineCap = 'round';
  c.strokeStyle = INK; c.lineWidth = 92 * s; c.beginPath(); c.moveTo(0, 0); c.lineTo(L - 50 * s, 0); c.stroke();
  const g = c.createLinearGradient(0, -40 * s, 0, 40 * s); g.addColorStop(0, '#3a4a6e'); g.addColorStop(1, '#1a2238'); c.strokeStyle = g; c.lineWidth = 82 * s; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 8 * s; c.beginPath(); c.moveTo(20, -24 * s); c.lineTo(L - 70 * s, -24 * s); c.stroke();
  c.fillStyle = '#9aa0a8'; c.strokeStyle = INK; c.lineWidth = 4; rr(c, L - 62 * s, -38 * s, 20 * s, 76 * s, 6); c.fill(); c.stroke();
  c.translate(L, 0); const skin = '#f0c6a2', sd = '#d29e7a'; c.fillStyle = skin; c.strokeStyle = INK; c.lineWidth = 4;
  if (o.point) { c.beginPath(); rr(c, 10 * s, -10 * s, 62 * s, 20 * s, 10 * s); c.fill(); c.stroke(); c.fillStyle = '#f6dcc6'; c.beginPath(); c.ellipse(64 * s, -2 * s, 6 * s, 5 * s, 0, 0, 7); c.fill(); c.fillStyle = skin; }
  c.beginPath(); c.ellipse(0, 0, 44 * s, 34 * s, 0, 0, 7); c.fill(); c.stroke();
  c.strokeStyle = sd; c.lineWidth = 3; for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(18 * s, (-14 + k * 12) * s); c.lineTo(34 * s, (-12 + k * 12) * s); c.stroke(); }
  c.fillStyle = skin; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.ellipse(-2 * s, (o.point ? -30 : -28) * s, 18 * s, 11 * s, -.5, 0, 7); c.fill(); c.stroke();
  c.restore(); };
const meterOv = (v) => (c, lt) => CP.eyesMeter(c, 178, 96, .62, typeof v === 'function' ? v(lt) : v);
const keyf = (lt, K0) => { // piecewise keyframes [[t,x,y]] -> {x,y} with ease
  if (lt <= K0[0][0]) return { x: K0[0][1], y: K0[0][2] }; for (let i = 1; i < K0.length; i++) { const [t1, x1, y1] = K0[i], [t0, x0, y0] = K0[i - 1]; if (lt <= t1) { const u = E.io(clamp((lt - t0) / Math.max(.01, t1 - t0))); return { x: lerp(x0, x1, u), y: lerp(y0, y1, u) }; } }
  const L = K0[K0.length - 1]; return { x: L[1], y: L[2] }; };
const WH = { x: 2030, y: 1330, s: 7.5 }; // steering wheel (right-hand drive)
const wheelAndRight = (c, lt, turn = 0) => { CP.analogDial(c, WH.x, 1105, 118, .62 + .02 * Math.sin(lt * 3), 'MPH'); CP.steering(c, WH.x, WH.y, WH.s, lt, { turn }); arm(c, 2640, 1760, WH.x + 300 * Math.cos(turn), WH.y + 300 * Math.sin(turn) - 10, 1.25); };

const beam = (c, x, y, s, a = 1) => { c.save(); c.globalCompositeOperation = 'screen'; const fx = x + 480 * s, fy = y - 150 * s, g = c.createLinearGradient(fx, 0, fx + 900 * s, 0); g.addColorStop(0, `rgba(255,245,200,${.42 * a})`); g.addColorStop(1, 'rgba(255,245,200,0)'); c.fillStyle = g; c.beginPath(); c.moveTo(fx, fy - 14 * s); c.lineTo(fx + 900 * s, fy - 120 * s); c.lineTo(fx + 900 * s, y + 10); c.lineTo(fx, fy + 14 * s); c.closePath(); c.fill(); TW.glow(c, fx, fy, 70 * s, '255,245,210', .6 * a); c.restore(); };

  CP.shadow(c, x, y, 120, .4); c.fillStyle = '#3a2414'; c.strokeStyle = INK; c.lineWidth = 4; for (const lx of [-80, 70]) { c.fillRect(x + lx, y - 170, 12, 170); c.strokeRect(x + lx, y - 170, 12, 170); } c.fillStyle = '#e8e0d0'; rr(c, x - 100, y - 186, 200, 20, 4); c.fill(); c.stroke();
  c.save(); c.translate(x - 30, y - 186); c.rotate(-.06); c.fillStyle = '#b08a3a'; rr(c, -46, -128, 92, 120, 6); c.fill(); c.stroke(); const g = c.createLinearGradient(0, -116, 0, -20); g.addColorStop(0, '#e8d6b8'); g.addColorStop(1, '#c8b494'); c.fillStyle = g; c.fillRect(-34, -116, 68, 96); c.fillStyle = 'rgba(255,240,220,.6)'; c.beginPath(); c.arc(0, -70, 22, 0, 7); c.fill(); c.restore();
  for (let k = 0; k < 5; k++) { const fx = x + 30 + k * 12, fh = 60 + (k % 2) * 16; c.strokeStyle = '#3a6a2a'; c.lineWidth = 3; c.beginPath(); c.moveTo(x + 50, y - 188); c.lineTo(fx, y - 186 - fh); c.stroke(); c.fillStyle = ['#f4f0ea', '#f2d0d8', '#fff', '#f4e8a0', '#f2d0d8'][k]; c.beginPath(); c.arc(fx, y - 186 - fh, 11, 0, 7); c.fill(); }
  c.fillStyle = '#f4ecd8'; c.strokeStyle = INK; c.lineWidth = 3; rr(c, x + 72, y - 236, 18, 50, 3); c.fill(); c.stroke();
  if (lit > 0) { const f = 1 + .12 * Math.sin(lt * 11) + .06 * Math.sin(lt * 23); c.save(); c.globalAlpha = lit; TW.glow(c, x + 81, y - 252, 120, '255,200,110', .45 * f); c.fillStyle = '#ffd27a'; c.beginPath(); c.ellipse(x + 81, y - 252, 7 * f, 15 * f, Math.sin(lt * 3) * .1, 0, 7); c.fill(); c.fillStyle = '#fff6d8'; c.beginPath(); c.ellipse(x + 81, y - 248, 3, 7, 0, 0, 7); c.fill(); c.restore(); } };

window.SHOTS = [
  // 0.00 Key Largo 2019, night: a white saloon glides along the mangrove road on Autopilot; inset: phone slides off the seat, the driver's hand reaches down; meter ticks up

    init: S => { const tK = A.at(S, 'Key', 1.5), tN = A.at(S, 'nine', 4.3), tAp = A.at(S, 'Autopilot.', 7.1), tDr = A.at(S, 'drops', 8.6), tRe = A.at(S, 'reaches', 9.9);
      const cx = lt => 520 + 660 * E.sine(clamp(lt / (S.end - S.start)));
      S.D.live = [(c, lt) => { blinker(c, lt); for (let k = 0; k < 6; k++) { const ph = (lt * .05 + k / 6) % 1; c.fillStyle = `rgba(200,255,180,${.5 * Math.sin(ph * Math.PI)})`; c.beginPath(); c.arc(200 + k * 260 + 40 * Math.sin(lt + k), 900 - 80 * Math.sin(lt * .7 + k), 4, 0, 7); c.fill(); } },
        (c, lt) => { const x = cx(lt); beam(c, x, 1150, .95); c.save(); CP.car(c, x, 1150, .95, { kind: 'tesla_like', col: CARCOL, t: lt, speed: 900, lights: true, interior: true }); c.restore();
          // tail-light glow + autopilot glow in the cabin

      S.D.over = [(c, lt) => K.card(c, 'KEY LARGO, FLORIDA · APRIL 2019', lt, { at: tK, x: 600, y: 230, px: 56, rot: -2 }),
        (c, lt) => K.card(c, 'JUST AFTER 9 PM', lt, { at: tN, x: 470, y: 330, px: 50, rot: 2, bg: '#1c2a4a', color: '#f2ead8' }),
        (c, lt) => K.card(c, 'TESLA MODEL S · AUTOPILOT ON', lt, { at: tAp - .3, x: 1380, y: 105, px: 50, rot: 2, bg: '#7ac8ff' }),
        (c, lt) => { // cabin inset: the phone slides off the seat, a hand goes down after it

          TW.glow(c, X - 60, Y - 120, 260, '120,200,255', .3); c.fillStyle = '#1a1c22'; c.fillRect(X - R, Y - 90, R * 2, 40); CP.dashTablet(c, X - 150, Y - 190, 170, lt, { page: 'home', glow: .8 });
          c.fillStyle = '#2a2420'; rr(c, X - 30, Y - 10, 260, 90, 20); c.fill(); c.fillStyle = '#3a322c'; rr(c, X - 30, Y - 10, 260, 20, 10); c.fill(); c.fillStyle = '#0a0a0e'; c.fillRect(X - R, Y + 120, R * 2, 120);
          const fall = E.inn(K.seg(lt, tDr, tDr + .8)), px = lerp(X + 80, X - 10, fall), py = lerp(Y - 22, Y + 150, fall); c.save(); c.translate(px, py); c.rotate(fall * 1.7); c.fillStyle = '#16161c'; c.strokeStyle = '#555'; c.lineWidth = 2; rr(c, -16, -30, 32, 58, 6); c.fill(); c.stroke(); c.fillStyle = '#4a9aff'; rr(c, -12, -25, 24, 46, 3); c.fill(); c.restore();
          const reach = E.io(K.seg(lt, tRe - .3, tRe + .9)); arm(c, X - 260, Y - 260, lerp(X - 120, X - 30, reach), lerp(Y - 120, Y + 120, reach), .7, { point: reach > .5 });

  // 0.01 the road ends at a T: stop sign and flashing light slide past; the saloon runs straight through; impact as a white flash far off; debris, dust, then blue lights. No figures.
  { plate: 'night_road', cam: { z: [1.28, 1.0], x: [1500, 1280], y: [900, 720] }, bed: [['night_loop', .3]], light: { dir: 1, key: 'rgba(90,120,200,.12)' },
    init: S => { const tT = A.at(S, 'T-junction.', 2.0), tDs = A.at(S, 'stop.', 4.0), tSx = A.at(S, 'sixty', 5.6), tSt = A.at(S, 'straight', 7.4), tH = A.at(S, 'hits', 8.6), tCo = A.at(S, 'couple', 11.4);
      const XS = 2330, XI = 1786, cs = .55; const cx = lt => lt < tH ? XI - (XI - 1290) * (1 - lt / tH) * (1 - .15 * Math.sin(lt / tH * Math.PI)) : XI + 40 * E.out(K.seg(lt, tH, tH + .5));

      const debris = []; for (let k = 0; k < 34; k++) debris.push([Math.cos(k * 2.4) * (200 + (k * 37) % 300), -260 - (k * 53) % 380, 6 + k % 9, (k % 3) ? '#c8ccd4' : '#2a2c30']);

// CP act 1 - How the tablet ate the dashboard: 2012 launch stage, phone logic, features pile up and the screen swallows them, eyes off the road.
// Plates: stage_blue, card, design_studio, motorway.

const lerp = (a, b, u) => a + (b - a) * u;

const glass = (c) => { c.beginPath(); c.moveTo(350, 108); c.lineTo(2210, 108); c.lineTo(2425, 975); c.lineTo(130, 975); c.closePath(); };
const rain = (c, lt, n = 110) => { c.save(); glass(c); c.clip(); c.strokeStyle = 'rgba(210,220,235,.32)'; c.lineWidth = 2.5;
  for (let k = 0; k < n; k++) { const x = 160 + (k * 977) % 2260, y = 100 + ((k * 131 + lt * 1500) % 900); c.beginPath(); c.moveTo(x, y); c.lineTo(x - 8, y + 44); c.stroke(); }
  for (let k = 0; k < 70; k++) { const x = 220 + (k * 613) % 2140, y = 140 + (k * 293) % 800, a = .25 + .2 * Math.sin(lt * 1.3 + k); c.fillStyle = `rgba(230,236,245,${a})`; c.beginPath(); c.arc(x, y + ((lt * 18 + k * 7) % 30), 3 + (k % 3), 0, 7); c.fill(); }
  c.restore(); };

  const p = .8 + .2 * Math.sin(lt * 3);
  for (const [x, y, r] of [[1500, 728, 120], [1630, 728, 120], [850, 712, 70], [905, 712, 70], [1125, 680, 60], [1185, 680, 60], [1010, 640, 40]]) { TW.glow(c, x, y, r, '255,40,30', .55 * p); c.save(); c.globalAlpha = .18 * p; c.fillStyle = '#ff3a2a'; c.fillRect(x - 6, y, 12, 120 + r * .6); c.restore(); }
  c.save(); glass(c); c.clip();
  for (let k = 0; k < 16; k++) { const ph = (lt * .6 + k / 16) % 1, x = 1565 + Math.sin(k * 2.1) * 140 * ph, y = 760 - 90 * ph; c.fillStyle = `rgba(220,225,235,${.16 * (1 - ph)})`; c.beginPath(); c.ellipse(x, y, 60 + 140 * ph, 26 + 40 * ph, 0, 0, 7); c.fill(); }
  c.restore(); };
const fog = (c, a) => { if (a <= 0) return; c.save(); glass(c); c.clip(); const g = c.createRadialGradient(1280, 560, 120 + 600 * (1 - a), 1280, 560, 1500); g.addColorStop(0, 'rgba(205,212,222,0)'); g.addColorStop(.35, `rgba(205,212,222,${.55 * a})`); g.addColorStop(1, `rgba(215,220,228,${.92 * a})`); c.fillStyle = g; c.fillRect(0, 0, 2560, 1000);
  c.fillStyle = `rgba(200,208,218,${.25 * a})`; for (let k = 0; k < 40; k++) { c.beginPath(); c.arc(200 + (k * 547) % 2200, 130 + (k * 197) % 820, 30 + (k % 5) * 12, 0, 7); c.fill(); } c.restore(); };
const wipers = (c, lt, sp = 2.6) => { const a = -.06 - 1.5 * (.5 - .5 * Math.cos(lt * sp));
  for (const [px, py, L] of [[760, 985, 860], [1600, 985, 800]]) { c.save(); c.translate(px, py); c.rotate(-a - (px > 1000 ? .05 : 0)); c.lineCap = 'round';
    c.strokeStyle = INK; c.lineWidth = 20; c.beginPath(); c.moveTo(0, 0); c.lineTo(-L, 0); c.stroke(); c.strokeStyle = '#2a2a30'; c.lineWidth = 12; c.stroke();
    c.strokeStyle = '#111'; c.lineWidth = 9; c.beginPath(); c.moveTo(-L * .25, -6); c.lineTo(-L, -6); c.stroke(); c.fillStyle = '#3a3a40'; c.beginPath(); c.arc(0, 0, 18, 0, 7); c.fill(); c.restore(); } };
const dashTop = (c) => { const g = c.createLinearGradient(0, 975, 0, 1060); g.addColorStop(0, '#2a2622'); g.addColorStop(1, '#141210'); c.fillStyle = g; c.beginPath(); c.moveTo(0, 990); c.quadraticCurveTo(1280, 960, 2560, 990); c.lineTo(2560, 1060); c.lineTo(0, 1060); c.fill(); c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 992); c.quadraticCurveTo(1280, 962, 2560, 992); c.stroke(); };
// Dave's arm (sleeve from off-frame elbow ex,ey to the hand at hx,hy). o.point: index finger out; o.grip: curled on a rim

  c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 8 * s; c.beginPath(); c.moveTo(20, -24 * s); c.lineTo(L - 70 * s, -24 * s); c.stroke();

  c.fillStyle = skin; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.ellipse(-2 * s, (o.point ? -30 : -28) * s, 18 * s, 11 * s, -.5, 0, 7); c.fill(); c.stroke();

const meterOv = (v) => (c, lt) => CP.eyesMeter(c, 178, 96, .62, typeof v === 'function' ? v(lt) : v);

const flyBtn = (c, x, y, k, u, w, h, label, col = '#d8d2c2') => { if (u < 0) { c.save(); c.translate(x, y); c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 3; rr(c, -w / 2, -h / 2, w, h, 8); c.fill(); c.stroke(); if (label) txt(c, label, 0, 1, h * .5, INK, 'center', 'Anton'); c.restore(); return; }
  if (u > 1.6) return; const vx = Math.sin(k * 2.7) * 520, vy = -700 - 300 * Math.abs(Math.cos(k * 1.9)); c.save(); c.globalAlpha = 1 - K.seg(u, 1.1, 1.6); c.translate(x + vx * u, y + vy * u + 1400 * u * u); c.rotate(u * (4 + k % 3) * (k % 2 ? 1 : -1)); c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 3; rr(c, -w / 2, -h / 2, w, h, 8); c.fill(); c.stroke(); if (label) txt(c, label, 0, 1, h * .5, INK, 'center', 'Anton'); c.restore(); };
const crowd = (c, lt, flash) => { for (let k = 0; k < 22; k++) { const x = 60 + k * 118 + (k % 3) * 20, y = 1340 + (k % 2) * 50 + Math.sin(lt * 2 + k) * 6;

  if (k % 2 === 0) { const px = x + 40, py = y - 140 + Math.sin(lt * 3 + k) * 8; c.strokeStyle = '#0a0e1c'; c.lineWidth = 26; c.lineCap = 'round'; c.beginPath(); c.moveTo(x + 30, y + 40); c.lineTo(px, py + 30); c.stroke(); c.fillStyle = '#111'; rr(c, px - 22, py - 38, 44, 76, 6); c.fill(); c.fillStyle = '#6ab0ff'; rr(c, px - 17, py - 32, 34, 62, 4); c.fill();
    const f = flash ? Math.max(0, Math.sin(lt * 7 + k * 2.3)) ** 12 : 0; if (f > .05) TW.glow(c, px, py - 20, 160, '255,255,255', .9 * f); } } };

window.SHOTS = [

  { plate: 'stage_blue', cam: { z: [1.18, 1.0], x: [1280, 1280], y: [760, 720] }, bed: [['crowd_loop', .2], ['hum_loop', .1]], light: { dir: 1, key: 'rgba(120,170,255,.16)' },
    init: S => { const tR = A.at(S, 'Rewind', 2.1), t12 = A.at(S, '2012.', 2.9), tT = A.at(S, 'Tesla', 3.3), tTo = A.at(S, 'touchscreen', 6.8), tMi = A.at(S, 'middle', 8.1), tW = A.at(S, 'world', 10.4);

          for (const bx of [700, 1860]) TW.glow(c, bx, 120, 380, '90,150,255', .2 + .1 * Math.sin(lt * 1.5 + bx));

          if (lt > tMi) TW.glow(c, carX(lt) + 40, 760, 140, '120,200,255', .5 + .15 * Math.sin(lt * 4)); }];
      S.D.front = [(c, lt) => crowd(c, lt, lt > tTo - .5)];
      S.D.over = [(c, lt) => K.card(c, '2012', lt, { at: t12, x: 260, y: 110, px: 70, rot: -3 }), (c, lt) => K.card(c, 'TESLA MODEL S', lt, { at: tT, x: 1580, y: 110, px: 56, rot: 2, bg: '#ffd24a' })];
      S.D.sfx = [[tR, 'whoosh', .35], [t12, 'stamp', .3], [tT, 'drone', .2], [tTo, 'swell', .3], [tW, 'crowd_cheer', .4], [tW + .2, 'camera_shutter', .4], [tW + .9, 'camera_shutter', .3]]; } },
  // 1.01 phone logic: keypad phone sheds its buttons like popcorn and becomes a smartphone; arrow; the button dash does the same
  { plate: 'card', cam: { z: [1.0, 1.05], x: [1280, 1280], y: [720, 730] }, bed: [['hum_loop', .1]],
    init: S => { const tL = A.at(S, 'logic', .5), tP = A.at(S, 'Phones', 1.8), tLo = A.at(S, 'lost', 3.9), tSu = A.at(S, 'surely', 5.5), tC = A.at(S, 'cars', 6.0);

      const dkeys = [[1660, 830, 'A/C'], [1980, 830, 'DEMIST'], [1660, 900, 'RECIRC'], [1980, 900, 'REAR'], [1560, 820, ''], [1820, 820, ''], [2100, 820, '']];

          const m = E.io(K.seg(lt, tLo + .3, tLo + 1.0));

          if (m > 0) { c.save(); c.globalAlpha = m; TW.phone(c, PX, PY, 2.45, (cc) => { cc.fillStyle = '#1e3a5a'; cc.fillRect(-52, -100, 104, 200); for (let k = 0; k < 8; k++) { cc.fillStyle = `hsl(${k * 45},60%,55%)`; rr(cc, -42 + (k % 3) * 30, -86 + Math.floor(k / 3) * 34, 22, 22, 5); cc.fill(); } }); c.restore(); if (lt > tLo + 1) TW.sparkle(c, PX + 140, PY - 260, lt * 2, 1.2); }

          if (sc > 0) { c.save(); c.globalAlpha = sc; CP.dashTablet(c, TX - 220, TOP - 290, 440, lt, { page: 'home' });

<!doctype html><html><head><meta charset="utf-8"><title>CP act 2 - The 70 mph test</title>
<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}@font-face{font-family:SourceSerif;src:url(../../../../shared/fonts/SourceSerif4.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/rig_v5.js"></script><script src="../../../../shared/rig_leo.js"></script><script>window.RIGSTYLE = "gumball";</script><script src="../../../../shared/kit.js"></script><script src="../../../../shared/anim.js"></script>
<script src="../../tw_kit.js"></script><script src="../../xu_kit.js"></script><script src="../../jh_kit.js"></script><script src="../../pr_kit.js"></script><script src="../../cp_kit.js"></script>
<script src="timing.js"></script>
<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
const SW = 1920, SH = 1080, INK = TW.INK, RED = TW.RED, pop = TW.pop, fade = TW.fade;
const backdrop = (name, b = .5, blur = 8) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${b})`; const s2 = 1.06 * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 720 * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); c.restore(); K.screen(c); };
const CARRY = () => ({ shL: 30, elL: -75, shR: 35, elR: -75 });
const endTitle = (secs) => { const T = window.TIMING; const last = T.shots[T.shots.length - 1]; T.shots.push({ i: T.shots.length, start: last.end, end: last.end + secs, vo_start: last.end, vo_end: last.end, text: '' }); T.dur = last.end + secs; };
// CP act 2: The 70 mph test
for (const n of ['airfield', 'showroom', 'motorway', 'design_studio', 'boardroom']) K.load(n, PL + n + '.jpg');
// ---------- act-local helpers ----------
const METER = (m0, m1, a0 = 0, a1 = 1) => (c, lt, u) => CP.eyesMeter(c, 170, 96, .8, K.lerp(m0, m1, E.io(K.clamp((u - a0) / Math.max(.01, a1 - a0)))));
const NAME = (c, lt, at, x, y, name, sub, until = 99) => { const a = pop(lt, at, .4) * (1 - K.seg(lt, until - .3, until)); if (a <= 0) return; c.save(); c.translate(x, y); c.scale(a, a); c.rotate(-.025); c.font = '40px Anton'; const w = Math.max(c.measureText(name).width, sub ? 300 : 0) + 44, h = sub ? 92 : 62;
  c.fillStyle = 'rgba(0,0,0,.35)'; TW.rr(c, -w / 2 + 6, -h / 2 + 8, w, h, 10); c.fill(); c.fillStyle = PR.GOLD || '#f4c430'; c.strokeStyle = INK; c.lineWidth = 5; TW.rr(c, -w / 2, -h / 2, w, h, 10); c.fill(); c.stroke();
  TW.txt(c, name, 0, sub ? -h / 2 + 30 : 2, 40, INK, 'center', 'Anton'); if (sub) TW.txt(c, sub, 0, h / 2 - 22, 24, '#3a2a10', 'center', 'Oswald'); c.restore(); };
const SRC = (c, lt, at, x, y, text) => { const a = pop(lt, at, .35); if (a <= 0) return; c.save(); c.translate(x, y); c.scale(a, a); c.font = '26px Oswald'; const w = c.measureText(text).width + 30; c.fillStyle = 'rgba(10,14,20,.82)'; TW.rr(c, -w / 2, -22, w, 44, 8); c.fill(); TW.txt(c, text, 0, 1, 26, '#e8e4d8', 'center', 'Oswald'); c.restore(); };
const ARM = (c, x0, y0, x1, y1, col = '#3a4a6a') => { c.save(); c.lineCap = 'round'; c.strokeStyle = INK; c.lineWidth = 92; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); c.strokeStyle = col; c.lineWidth = 82; c.stroke();
  const a = Math.atan2(y1 - y0, x1 - x0); c.translate(x1, y1); c.rotate(a); c.fillStyle = '#e8b48a'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.ellipse(46, 0, 44, 34, 0, 0, 7); c.fill(); c.stroke(); c.beginPath(); c.ellipse(96, -6, 34, 11, 0, 0, 7); c.fill(); c.stroke(); c.restore(); };
const rain = (c, lt, n = 60) => { c.strokeStyle = 'rgba(200,215,235,.35)'; c.lineWidth = 2; for (let k = 0; k < n; k++) { const x = (k * 431) % 2560, y = ((k * 211) + lt * 900) % 1000; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 6, y + 30); c.stroke(); } };
const dust = (x0, x1, y0, y1, n = 18, col = '255,255,255') => (c, lt) => { for (let k = 0; k < n; k++) { const u = (lt * .05 + k * .137) % 1, x = x0 + ((k * 397) % 1000) / 1000 * (x1 - x0) + Math.sin(lt * .7 + k) * 20, y = y1 - u * (y1 - y0); c.fillStyle = `rgba(${col},${.25 * Math.sin(u * Math.PI)})`; c.beginPath(); c.arc(x, y, 3, 0, 7); c.fill(); } };
const STOPWATCH = (c, x, y, s, lt) => { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = '#c8ccd4'; c.strokeStyle = INK; c.lineWidth = 3; c.fillRect(-6, -40, 12, 10); c.beginPath(); c.arc(0, 0, 30, 0, 7); c.fill(); c.stroke(); c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, 23, 0, 7); c.fill(); c.strokeStyle = '#c8262e'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.sin(lt * 6) * 19, -Math.cos(lt * 6) * 19); c.stroke(); c.restore(); };
const speedLines = (c, lt, x0, x1, y0, y1, n = 14) => { c.strokeStyle = 'rgba(255,255,255,.45)'; c.lineWidth = 4; for (let k = 0; k < n; k++) { const y = y0 + (k * 97) % (y1 - y0), L = 120 + (k * 53) % 160, x = x1 - ((lt * 2200 + k * 337) % (x1 - x0 + L)); c.beginPath(); c.moveTo(x, y); c.lineTo(x + L, y); c.stroke(); } };
// motorway interior base: dashboard body, wheel, dog
const CABIN = (dash, opts = {}) => (c, lt) => { const t = lt;
  const g = c.createLinearGradient(0, 990, 0, 1440); g.addColorStop(0, '#2a2c32'); g.addColorStop(1, '#121318'); c.fillStyle = g; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.moveTo(0, 1010); c.quadraticCurveTo(1280, 960, 2560, 1010); c.lineTo(2560, 1440); c.lineTo(0, 1440); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.08)'; c.fillRect(0, 1000, 2560, 8);
  dash(c, t); CP.steering(c, 700, 1230, 6.2, t, { turn: Math.sin(t * .6) * .05 + (opts.turn ? opts.turn(t) : 0) }); };
const lurch = (lt, at) => { const d = lt - at; return d > 0 && d < .8 ? Math.sin(d * 40) * 26 * (1 - d / .8) : 0; };

window.SHOTS = [
  // 2.0 Swedish airfield at dawn: test cars roll into a line, tester with clipboard and stopwatch
  { plate: 'airfield', cam: { z: [1.05, 1.12], x: [1180, 1360], y: [760, 760] }, bed: [['birds_loop', .12], ['wind_loop', .08]], light: { dir: 1, key: 'rgba(255,190,200,.16)' },
    init: S => { const tS = A.at(S, 'Swedish', 1.3), tV = A.at(S, 'Vi', 2.4), tM = A.at(S, 'measure', 4.6), FL = 1300;
      const KINDS = ['estate2005', 'saloon_ev', 'tesla_like', 'suv_screen', 'mission_s', 'saloon_ev'], COLS = ['#3a5a7a', null, null, null, '#8a8e96', '#2a4a3a'];
      S.D.figs = [{ x: 560, y: FL, s: 1.6, ...CP.TESTER({ helmet: false }), facing: 1, mood: 'focus', hold: { near: CP.clipboardHold }, talk: [tM, tM + 1.6],
        anim: (o, lt) => { o.arms = () => lt > tM ? { shR: 70, elR: -60 } : { shR: 25, elR: -40 }; } }];
      S.D.live = [(c, lt) => { TW.glow(c, 1400, 380, 900, '255,170,190', .16 + .03 * Math.sin(lt)); },
        (c, lt) => { KINDS.forEach((k, i) => { const xt = 1000 + i * 260, a = E.out(K.seg(lt, tS - .8 + i * .35, tS + 1.4 + i * .35)), x = xt + (1 - a) * 1500, sp = a < 1 ? 600 : 0; CP.shadow(c, x, 1080, 140); CP.car(c, x, 1080, .26, { kind: k, col: COLS[i] || undefined, t: lt, speed: sp, dir: -1 }); }); }];
      S.D.front = [(c, lt) => { if (lt > tM) STOPWATCH(c, 700, 960, 1.4, lt - tM); }];
      S.D.over = [(c, lt) => NAME(c, lt, tV, 960, 140, 'VI BILÄGARE', 'Swedish car magazine · 2022'), dust(0, 1920, 200, 900, 14)];
      S.D.sfx = [[tS - .8, 'whoosh_soft', .2], [tV, 'pop', .2], [tM, 'tick', .25]]; } },

  // 2.1 test car at ~70 mph down the runway; four task checklist ticks off word by word
  { plate: 'airfield', cam: { z: [1.12, 1.2], x: [1240, 1300], y: [900, 900] }, bed: [['wind_loop', .14], ['drone', .06]], light: { dir: 1 },
    init: S => { const t12 = A.at(S, 'twelve', 1.0), tS = A.at(S, 'seventy', 2.6), tJ = A.at(S, 'jobs.', 5.6), tR = A.at(S, 'radio,', 7.0), tH = A.at(S, 'heating,', 8.6), tT = A.at(S, 'trip', 10.4), tD = A.at(S, 'dim', 12.2);
      const ticks = [tR, tH, tT, tD], items = ['CHANGE THE RADIO', 'ADJUST THE HEATING', 'RESET TRIP COMPUTER', 'DIM THE DASHBOARD'];
      S.D.live = [(c, lt) => { const x = 1240 + Math.sin(lt * .8) * 60; CP.shadow(c, x, 1290, 600); CP.car(c, x, 1290, 1.1, { kind: 'tesla_like', t: lt, speed: 2200, lights: true });
          // helmeted driver silhouette in the side glass
          c.save(); c.translate(x - 40, 1290 - 255); c.fillStyle = '#d8dce4'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.arc(0, 0, 34, 0, 7); c.fill(); c.stroke(); c.fillStyle = '#1a2a3a'; c.fillRect(4, -10, 28, 16); c.restore(); },
        (c, lt) => speedLines(c, lt, 0, 2560, 1120, 1360, 12)];
      S.D.front = [(c, lt) => { for (let k = 0; k < 6; k++) { const u = ((lt * 1.4 + k / 6) % 1); c.fillStyle = `rgba(160,150,140,${.35 * (1 - u)})`; c.beginPath(); c.arc(1240 - 560 - u * 500, 1270 - u * 40, 30 + u * 60, 0, 7); c.fill(); } }];
      S.D.over = [METER(0, 120, .35, 1),
        (c, lt) => NAME(c, lt, t12, 400, 300, '12 CARS', '~110 KM/H (70 MPH)'),
        (c, lt) => { if (lt < tS) return; CP.analogDial(c, 400, 520, 90, .7 + Math.sin(lt * 3) * .02, 'KM/H'); },
        (c, lt) => { const a = pop(lt, tJ - .3, .4); if (a <= 0) return; c.save(); c.translate(1560, 360); c.scale(a, a); c.rotate(.02);
          c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(-282, -212, 580, 440); c.fillStyle = '#f6eedc'; c.strokeStyle = INK; c.lineWidth = 5; c.fillRect(-290, -220, 580, 440); c.strokeRect(-290, -220, 580, 440);
          TW.txt(c, '4 SIMPLE TASKS', 0, -170, 48, INK, 'center', 'Anton'); c.fillStyle = INK; c.fillRect(-250, -136, 500, 4);
          items.forEach((it, i) => { const y = -90 + i * 80, d = K.seg(lt, ticks[i], ticks[i] + .3); c.strokeStyle = INK; c.lineWidth = 4; c.strokeRect(-250, y - 22, 44, 44); TW.txt(c, it, -186, y, 32, d > 0 ? '#2a6a3a' : INK, 'left', 'Oswald');
            if (d > 0) { c.strokeStyle = '#2a8a3a'; c.lineWidth = 9; c.beginPath(); c.moveTo(-244, y); c.lineTo(-244 + 14 * Math.min(1, d * 2), y + 14 * Math.min(1, d * 2)); if (d > .5) c.lineTo(-230 + 30 * (d - .5) * 2, y + 14 - 40 * (d - .5) * 2); c.stroke(); } }); c.restore(); }];
      S.D.sfx = [[t12, 'whoosh', .25], [tJ - .3, 'paper', .2], ...ticks.map(t => [t, 'tick', .3])]; } },

  // 2.2 winner: 2005 estate on the showroom turntable, rosette, button dash with nodding dog; 10 s / 306 m
  { plate: 'showroom', cam: { z: [1.08, 1.16], x: [1280, 1280], y: [820, 800] }, bed: [['hum_loop', .08], ['crowd_loop', .05]], light: { dir: -1 },
    init: S => { const tW = A.at(S, 'winner?', .6), tV = A.at(S, 'Volvo', 2.2), tB = A.at(S, 'buttons.', 4.6), tT = A.at(S, 'ten', 6.6), tM = A.at(S, 'metres', 8.6);
      S.D.live = [(c, lt) => { const r = Math.sin(lt * .4) * .02; TW.glow(c, 1280, 700, 800, '255,240,200', .18);
          for (const x of [900, 1660]) { c.save(); c.globalCompositeOperation = 'screen'; const g = c.createLinearGradient(x, 0, x, 1150); g.addColorStop(0, 'rgba(255,240,200,.0)'); g.addColorStop(1, 'rgba(255,240,200,.18)'); c.fillStyle = g; c.beginPath(); c.moveTo(x - 30, 0); c.lineTo(x + 30, 0); c.lineTo(x + 260, 1150); c.lineTo(x - 260, 1150); c.fill(); c.restore(); }
          CP.shadow(c, 1280, 1140, 520); c.save(); c.translate(1280, 1140); c.scale(1 - Math.abs(r), 1); CP.car(c, 0, 0, 1.05, { kind: 'estate2005', col: '#3a5a7a', t: lt }); c.restore();
          // rosette pinned on the door
          const a = pop(lt, tW, .5); if (a > 0) { c.save(); c.translate(1300, 960); c.scale(a, a); c.fillStyle = '#c8262e'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(-20, 30); c.lineTo(-40, 120); c.lineTo(-10, 100); c.lineTo(0, 30); c.moveTo(20, 30); c.lineTo(40, 120); c.lineTo(10, 100); c.lineTo(0, 30); c.fill(); c.stroke();
            c.fillStyle = '#f4c430'; for (let k = 0; k < 16; k++) { c.beginPath(); c.arc(Math.cos(k * .39) * 52, Math.sin(k * .39) * 52, 16, 0, 7); c.fill(); } c.beginPath(); c.arc(0, 0, 52, 0, 7); c.fill(); c.stroke(); TW.txt(c, '1st', 0, 2, 40, INK, 'center', 'Anton'); c.restore(); } }];
      S.D.over = [(c, lt, u) => CP.eyesMeter(c, 170, 96, .8, lt < tT ? 0 : 306 * E.io(K.seg(lt, tT, tM + .4))),
        (c, lt) => NAME(c, lt, tV - .2, 960, 120, '2005 VOLVO V70', '17 years old · covered in buttons'),
        (c, lt) => { const a = pop(lt, tB - .4, .4); if (a <= 0) return; c.save(); c.translate(1470, 220); c.scale(a * .6, a * .6); CP.dashOld(c, 0, 0, 640, lt, { press: Math.floor(lt * 2) % 2 }); CP.dog(c, 560, 4, 2.4, lt, 'nod', { t0: tB }); c.restore(); },
        (c, lt) => { if (lt < tT) return; const a = pop(lt, tT, .4); c.save(); c.translate(300, 480); c.scale(a, a); PR.counter(c, 0, 0, 1, 0, 10, tT, tT + 1, lt, { pre: '', suf: ' s' }); c.restore(); },
        (c, lt) => SRC(c, lt, tM, 300, 590, 'Source: Vi Bilägare test, 2022')];
      S.D.sfx = [[tW, 'crowd_cheer', .2], [tW, 'pop', .2], [tB - .4, 'pop', .15], [tT, 'tick', .3], [tM, 'chime', .25]]; } },

  // 2.3 slowest: all-screen SUV; meter spins past 1,400 m, football pitches unroll in a row
  { plate: 'airfield', cam: { z: [1.15, 1.08], x: [1300, 1260], y: [860, 820] }, bed: [['wind_loop', .14], ['tension', .1]], light: { dir: 1 },
    init: S => { const tSl = A.at(S, 'slowest', .4), tMG = A.at(S, 'MG', 1.0), tF = A.at(S, 'Forty-five', 4.6), tK = A.at(S, 'kilometres', 7.2), tBl = A.at(S, 'blind.', 9.6);
      S.D.live = [(c, lt) => { const x = 1280 + Math.sin(lt * .7) * 50; CP.shadow(c, x, 1290, 600); CP.car(c, x, 1290, 1.1, { kind: 'suv_screen', t: lt, speed: 2200, lights: true });
          c.save(); c.translate(x - 20, 1290 - 300); c.globalCompositeOperation = 'screen'; TW.glow(c, 0, 0, 120, '90,170,255', .5 + .2 * Math.sin(lt * 4)); c.restore(); },
        (c, lt) => speedLines(c, lt, 0, 2560, 1120, 1360, 12)];
      S.D.over = [(c, lt) => CP.eyesMeter(c, 170, 96, .8 * (1 + .06 * Math.sin(lt * 10) * K.seg(lt, tF, tK)), lt < tF ? 306 : K.lerp(306, 1400, E.io(K.seg(lt, tF, tK + .6)))),
        (c, lt) => NAME(c, lt, tMG, 960, 130, 'MG MARVEL R', 'all-screen electric SUV'),
        (c, lt) => { const a = pop(lt, tF, .4); if (a <= 0) return; c.save(); c.translate(1640, 130); c.scale(a, a); PR.counter(c, 0, 0, .8, 10, 44.9, tF, tF + 1.4, lt, { pre: '', suf: ' s', dec: 1 }); c.restore(); },
        (c, lt) => { // 14 pitches end to end (about 1.4 km)
          const n = 14, u = K.seg(lt, tK - .6, tK + 2.2); if (u <= 0) return; const w = 118, x0 = 960 - n * w / 2, y = 330;
          for (let k = 0; k < n; k++) { const a = K.clamp(u * n - k); if (a <= 0) break; c.save(); c.translate(x0 + k * w, y); c.fillStyle = k % 2 ? '#3a8a3a' : '#4a9a44'; c.strokeStyle = '#fff'; c.lineWidth = 3; c.fillRect(0, 0, w * a, 80); c.strokeRect(4, 4, w * a - 8, 72); if (a > .6) { c.beginPath(); c.moveTo(w / 2, 4); c.lineTo(w / 2, 76); c.stroke(); c.beginPath(); c.arc(w / 2, 40, 14, 0, 7); c.stroke(); } c.restore(); }
          if (u > .3) TW.txt(c, '≈ 14 FOOTBALL PITCHES OF ROAD', 960, 450, 40, '#fff', 'center', 'Anton'); },
        (c, lt) => { if (lt > tBl - .2) { const a = pop(lt, tBl - .2, .3); c.save(); c.translate(1640, 560); c.scale(a, a); c.rotate(-.06); K.card(c, 'HALF BLIND', 1, { at: 0, x: 0, y: 0, px: 46 }); c.restore(); } },
        (c, lt) => SRC(c, lt, tF + .4, 1640, 230, 'Vi Bilägare: 44.9 s · ~1.4 km')];
      S.D.sfx = [[tMG, 'pop', .2], [tF, 'alarm', .12], [tF, 'riser', .2], [tK, 'whoosh', .2], [tBl, 'hit', .2]]; } },

  // 2.4 Tesla-like: glovebox in a screen menu; gear slider; wrong swipe, car lurches back into a bin
  { plate: 'motorway', cam: { z: [1.05, 1.1], x: [1280, 1320], y: [760, 780] }, bed: [['rain_loop', .1], ['hum_loop', .08]], light: { dir: 1 },
    init: S => { const tT = A.at(S, 'Teslas,', 1.6), tG = A.at(S, 'glovebox', 2.6), tMe = A.at(S, 'menu', 3.8), tGe = A.at(S, 'gears', 5.6), tU = A.at(S, 'up', 7.6), tR = A.at(S, 'reverse.', 9.4);
      let D = { x: 1360, y: 640, w: 900 };
      S.D.live = [(c, lt) => { const j = lurch(lt, tR); c.save(); c.translate(0, j); rain(c, lt); c.restore(); },
        (c, lt) => { const j = lurch(lt, tR); c.save(); c.translate(j * .5, j);
          CABIN((cc, t) => { CP.dashTablet(cc, D.x, D.y, D.w, t, { page: lt > tMe ? 'menu' : 'home', t0: tMe, slide: K.seg(lt, tMe, tMe + .5) });
            if (lt > tMe + .3 && lt < tGe) { cc.fillStyle = 'rgba(80,170,255,.9)'; TW.rr(cc, D.x + 300, D.y + 230, 520, 70, 12); cc.fill(); TW.txt(cc, 'OPEN GLOVEBOX  >', D.x + 560, D.y + 266, 36, '#fff', 'center', 'Oswald'); }
            if (lt > tGe) { const a = E.out(K.seg(lt, tGe, tGe + .4)); cc.save(); cc.globalAlpha = a; cc.fillStyle = '#0c1420'; TW.rr(cc, D.x + 40, D.y + 70, 160, 460, 20); cc.fill(); ['P', 'R', 'N', 'D'].forEach((g, i) => TW.txt(cc, g, D.x + 120, D.y + 120 + i * 110, 52, '#a8c0d8', 'center', 'Anton'));
              const gy = lt < tU ? 2 : lt < tR - .6 ? 3 : 1, pos = D.y + 120 + gy * 110; cc.fillStyle = '#3a8aff'; TW.rr(cc, D.x + 64, pos - 44, 112, 88, 16); cc.fill(); TW.txt(cc, ['P', 'R', 'N', 'D'][gy], D.x + 120, pos, 56, '#fff', 'center', 'Anton'); cc.restore(); }
            CP.dog(cc, 1160, 1000, 3.2, lt, lt > tT ? 'shake' : 'idle', { t0: tT }); }, {})(c, lt);
          // driver's hand: taps the menu, then swipes the gear strip
          const hx = lt < tGe ? D.x + 520 : D.x + 120, hy = lt < tGe ? D.y + 300 : D.y + 120 + (lt < tU ? 220 : lt < tR - .6 ? 330 - 110 * K.seg(lt, tU, tU + .3) * 0 : 110) + 20;
          const reach = K.seg(lt, tG - .4, tG + .2) * (1 - K.seg(lt, tR + 1, tR + 1.6));
          ARM(c, 2300, 1500, K.lerp(2300, hx, reach), K.lerp(1500, hy, reach), '#2e3e5e'); c.restore(); }];
      S.D.over = [METER(306, 420, .3, .9),
        (c, lt) => NAME(c, lt, tG, 760, 140, 'GLOVEBOX: SCREEN MENU', null, tGe),
        (c, lt) => { if (lt > tU - .2 && lt < tR + 1.2) { const up = lt < tR - .6; c.save(); c.translate(1160, 300); TW.txt(c, up ? 'SWIPE UP = DRIVE' : 'SWIPE DOWN = REVERSE', 0, 0, 44, up ? '#9af0a8' : '#ff8a7a', 'center', 'Anton'); c.restore(); } },
        (c, lt) => { // rear inset: the car rolls back into a wheelie bin
          const a = pop(lt, tR - .2, .35); if (a <= 0) return; c.save(); c.translate(1560, 470); c.scale(a, a); c.fillStyle = '#f6eedc'; c.strokeStyle = INK; c.lineWidth = 5; c.fillRect(-250, -150, 500, 300); c.strokeRect(-250, -150, 500, 300); c.save(); c.beginPath(); c.rect(-245, -145, 490, 290); c.clip();

// a red campaign line drawn along points (world), progress u
const route = (c, pts, u, w = 12, col = 'rgba(178,34,30,.88)') => { if (u <= 0) return; const L = []; let tot = 0; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(d); tot += d; } let rem = tot * Math.min(1, u); c.save(); c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(...pts[0]); let end = pts[0]; for (let i = 1; i < pts.length && rem > 0; i++) { const f = Math.min(1, rem / L[i - 1]); end = [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f]; c.lineTo(...end); rem -= L[i - 1]; } c.stroke(); const a = Math.atan2(end[1] - (pts[Math.max(0, pts.length - 2)][1]), end[0] - pts[Math.max(0, pts.length - 2)][0]); c.restore(); return end; };

const wagon = (c, x, y, ang) => { c.save(); c.translate(x, y); c.rotate(ang); c.fillStyle = '#8a6038'; c.strokeStyle = INK; c.lineWidth = 3; c.fillRect(-34, -14, 68, 28); c.strokeRect(-34, -14, 68, 28); c.fillStyle = '#3a2a1e'; c.fillRect(-26, -20, 10, 6); c.fillRect(16, -20, 10, 6); c.fillRect(-26, 14, 10, 6); c.fillRect(16, 14, 10, 6); c.restore(); };
const parch = (c) => { c.save(); c.filter = 'blur(5px) brightness(.8)'; const s2 = 1.1 * 1920 / 2560; c.setTransform(s2, 0, 0, s2, 960 - 1280 * s2, 540 - 720 * s2); c.drawImage(K.imgs.map_europe, 0, 0, 2560, 1440); c.restore(); c.setTransform(1, 0, 0, 1, 0, 0); };

  c.fillStyle = '#d8c49a'; c.strokeStyle = INK; c.lineWidth = 8; c.beginPath(); c.arc(cx, cy, r, 0, 7); c.fill(); c.stroke(); c.lineWidth = 4; c.beginPath(); c.arc(cx, cy, r - 40, 0, 7); c.stroke(); for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + Math.PI / 4; c.fillStyle = '#8a6a3a'; c.fillRect(cx + Math.cos(a) * r - 20, cy + Math.sin(a) * r - 20, 40, 40); }

  { plate: 'city_dusk', cam: { z: [1.12, 1.18], x: [1280, 1260], y: [940, 940], ease: E.io }, bed: [['wind_loop', .35], ['drone', .2]],

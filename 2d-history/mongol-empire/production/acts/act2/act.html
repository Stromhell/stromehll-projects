<script>

{ const T = window.TIMING, L = T.shots[T.shots.length - 1]; L.end += 1.4; T.dur = L.end; }

  if (fist) { c.fillStyle = '#f4c7a1'; c.beginPath(); c.arc(10, -34, 12, 0, 7); c.fill(); c.stroke(); c.fillStyle = RED; c.beginPath(); c.arc(10, -36, 6, 0, 7); c.fill(); } c.restore(); };

const river = (y0, y1) => (c, lt) => { c.save(); const g = c.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, '#5a86a8'); g.addColorStop(1, '#2e5878'); c.fillStyle = g; c.beginPath(); c.moveTo(0, y0); for (let x = 0; x <= 2560; x += 80) c.lineTo(x, y0 + Math.sin(x * .004) * 18); c.lineTo(2560, y1); c.lineTo(0, y1); c.closePath(); c.fill(); c.strokeStyle = '#3a5a3a'; c.lineWidth = 8; c.beginPath(); for (let x = 0; x <= 2560; x += 80) c.lineTo(x, y0 + Math.sin(x * .004) * 18); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 3; for (let k = 0; k < 30; k++) { const x = ((k * 173 + lt * 40) % 2700) - 70, y = y0 + 40 + (k * 61 % (y1 - y0 - 50)); c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + 30, y - 6, x + 60, y); c.stroke(); } c.restore(); };
const reeds = (x0, x1, y, h, col = '#3a5a32') => (c, lt) => { c.save(); c.strokeStyle = col; c.lineCap = 'round'; for (let k = 0; k < (x1 - x0) / 14; k++) { const x = x0 + k * 14 + (k * 7 % 9), hh = h * (.6 + (k * 13 % 10) / 25), sw = Math.sin(lt * 1.3 + k * .7) * 10; c.lineWidth = 5; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + sw * .3, y - hh * .5, x + sw, y - hh); c.stroke(); if (k % 4 === 0) { c.fillStyle = '#5a3a22'; c.beginPath(); c.ellipse(x + sw, y - hh - 10, 6, 16, 0, 0, 7); c.fill(); } } c.restore(); };

const banner = (c, x, y, name, col, fall, s = 1) => { c.save(); c.translate(x, y); c.rotate(E.io(fall) * 1.45 * (x < 1280 ? -1 : 1)); c.scale(s, s); c.globalAlpha *= 1 - .4 * fall; c.strokeStyle = '#3a2a1a'; c.lineWidth = 12; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -560); c.stroke();
  c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.moveTo(6, -540); c.lineTo(230, -520 + Math.sin(c.lt || 0) * 6); c.lineTo(200, -440); c.lineTo(230, -360); c.lineTo(6, -380); c.closePath(); c.fill(); c.stroke(); c.save(); c.translate(110, -455); c.font = '34px Anton'; c.fillStyle = '#f2e6c8'; c.textAlign = 'center'; c.fillText(name, 0, 12); c.restore(); c.restore(); };

  c.fillStyle = '#d8d0c0'; c.fillRect(-90, -632, 180, 22); for (let k = 0; k < 9; k++) { const tx = -80 + k * 20, sw = Math.sin(lt * 2.4 + k * .7) * 14; c.fillStyle = '#f4f0e8'; c.strokeStyle = 'rgba(29,23,18,.55)'; c.lineWidth = 2; c.beginPath(); c.moveTo(tx - 8, -612); c.quadraticCurveTo(tx + sw, -520, tx + sw * 1.6, -420); c.quadraticCurveTo(tx + 8 + sw, -520, tx + 8, -612); c.closePath(); c.fill(); c.stroke(); } c.restore(); };

  c.fillStyle = showBack ? '#f2e2b0' : '#e8dcc8'; c.strokeStyle = INK; c.lineWidth = 6; c.fillRect(-260, -340, 520, 680); c.strokeRect(-260, -340, 520, 680); c.strokeStyle = showBack ? GOLD : '#8a7a62'; c.lineWidth = 4; c.strokeRect(-240, -320, 480, 640);
  c.save(); c.beginPath(); c.rect(-240, -320, 480, 470); c.clip(); c.fillStyle = showBack ? '#b8221e' : '#5a6a7a'; c.fillRect(-240, -320, 480, 470); R.figure(c, { x: 0, y: 380, s: 1.6, look, hat, pose: showBack ? 'point' : 'stand', facing: 1, t: lt, mood: showBack ? 'happy' : 'neutral' }); c.restore();

const ruleIcon = (c, x, y, kind, a, crossU) => { if (a <= 0) return; c.save(); c.translate(x, y); c.scale(a, a); c.fillStyle = '#efe2c0'; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.arc(0, 0, 120, 0, 7); c.fill(); c.stroke(); c.lineWidth = 5;
  if (kind === 'sheep') { c.fillStyle = '#fff'; for (let k = 0; k < 7; k++) { c.beginPath(); c.arc(-40 + (k % 4) * 26, -14 + Math.floor(k / 4) * 24, 22, 0, 7); c.fill(); c.stroke(); } c.fillStyle = '#3a2a20'; c.beginPath(); c.ellipse(56, -10, 18, 24, .3, 0, 7); c.fill(); c.fillRect(-40, 30, 8, 40); c.fillRect(30, 30, 8, 40); }
  else if (kind === 'rope') { c.strokeStyle = '#a07a4a'; c.lineWidth = 12; c.beginPath(); c.arc(-10, -10, 46, 0, 7); c.stroke(); c.beginPath(); c.moveTo(30, 20); c.quadraticCurveTo(60, 60, 30, 80); c.stroke(); }
  else { c.strokeStyle = '#6a6a72'; c.lineWidth = 12; for (let k = 0; k < 4; k++) { c.beginPath(); c.ellipse(-60 + k * 40, -10 + (k % 2) * 10, 26, 16, k % 2 ? 0 : .5, 0, 7); c.stroke(); } }
  c.restore(); if (crossU > 0) { c.save(); c.strokeStyle = RED; c.lineWidth = 16; c.lineCap = 'round'; const d = 90; c.beginPath(); c.moveTo(x - d, y - d); c.lineTo(x - d + 2 * d * Math.min(1, crossU * 2), y - d + 2 * d * Math.min(1, crossU * 2)); if (crossU > .5) { const v = (crossU - .5) * 2; c.moveTo(x + d, y - d); c.lineTo(x + d - 2 * d * v, y - d + 2 * d * v); } c.stroke(); c.restore(); } };

    init: S => { const tT = A.at(S, 'Tatars', 3.4), tG = A.at(S, 'Toghrul', 4.8), tJ = A.at(S, 'Jamukha', 6.6);

  // 3 decimal army: 10, 100, 1,000, 10,000 tokens, each layer zooming out
  { draw: (c, lt, u, S) => { c.fillStyle = '#e8dcc0'; c.fillRect(0, 0, 1920, 1080); K.parchment(c, 60, 60, 1800, 960); const st = S.stg.filter(t => lt > t).length; const zz = st <= 1 ? 1 : E.io(K.seg(lt, S.stg[st - 1], S.stg[st - 1] + 1.2));
      const n = [0, 10, 100, 1000, 10000][st], prevN = [0, 10, 10, 100, 1000][st]; const cols = st <= 1 ? 10 : st === 2 ? 20 : st === 3 ? 50 : 125; const cell = 1600 / cols; const cell0 = 1600 / ([10, 10, 10, 20, 50][st]); const cc = cell0 + (cell - cell0) * zz; const shown = Math.floor(prevN + (n - prevN) * zz);

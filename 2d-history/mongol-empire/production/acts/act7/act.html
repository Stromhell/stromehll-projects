  c.beginPath(); c.moveTo(-170, -40); c.lineTo(170, -60); c.lineTo(130, 20); c.lineTo(-140, 20); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#3a2414'; c.fillRect(-150, -36, 300, 10);

  c.restore(); };
const waves = (y, amp = 14, col = 'rgba(40,60,80,.85)') => (c, lt) => { c.save(); c.fillStyle = col; c.beginPath(); c.moveTo(0, y); for (let x = 0; x <= 2560; x += 40) c.lineTo(x, y + Math.sin(x * .012 + lt * 2.4) * amp + Math.sin(x * .03 - lt * 3) * amp * .4); c.lineTo(2560, 1440); c.lineTo(0, 1440); c.closePath(); c.fill(); c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 4; c.beginPath(); for (let x = 0; x <= 2560; x += 40) c.lineTo(x, y + Math.sin(x * .012 + lt * 2.4) * amp + Math.sin(x * .03 - lt * 3) * amp * .4); c.stroke(); c.restore(); };

const along = (pts, u) => { let tot = 0; const L = []; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(d); tot += d; } let rem = tot * Math.max(0, Math.min(1, u)); for (let i = 1; i < pts.length; i++) { if (rem <= L[i - 1]) { const f = rem / L[i - 1]; return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f, Math.atan2(pts[i][1] - pts[i - 1][1], pts[i][0] - pts[i - 1][0])]; } rem -= L[i - 1]; } const e = pts[pts.length - 1]; return [e[0], e[1], 0]; };

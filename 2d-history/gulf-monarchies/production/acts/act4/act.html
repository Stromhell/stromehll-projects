<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
const SW = 1920, SH = 1080, INK = TW.INK, RED = TW.RED, pop = TW.pop, fade = TW.fade;
const backdrop = (name, b = .5, blur = 8) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${b})`; const s2 = 1.06 * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 720 * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); c.restore(); K.screen(c); };
const CARRY = () => ({ shL: 30, elL: -75, shR: 35, elR: -75 });
const endTitle = (secs) => { const T = window.TIMING; const last = T.shots[T.shots.length - 1]; T.shots.push({ i: T.shots.length, start: last.end, end: last.end + secs, vo_start: last.end, vo_end: last.end, text: '' }); T.dur = last.end + secs; };
// GM act 4 - The Deal: 1971 independence, oil boom $3 -> $30, the rentier deal, state jobs, no tax no vote, foreign workers, kafala, too much to lose.
// ---- act helpers
const rr = TW.rr, txt = TW.txt;
// plate with stand-in: if plates/<n>.jpg is missing the shot draws <alt> instead (switches automatically once painted)
const LD = (n, alt) => { const im = K.load(n, PL + n + '.jpg'); if (alt) { if (!K.imgs[alt]) K.load(alt, PL + alt + '.jpg'); im.onerror = () => { K.imgs[n] = K.imgs[alt]; }; } };

const tag = (c, x, y, s, lt, at, o) => GM.ntag(c, x, y, s, K.seg(lt, at, at + .4), o);

const gbox = (c, x, y, w, h, col, lab) => { c.save(); c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(x - w / 2 + 6, y - h + 6, w, h); c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 4; c.fillRect(x - w / 2, y - h, w, h); c.strokeRect(x - w / 2, y - h, w, h);
  c.fillStyle = '#e2b23a'; c.fillRect(x - 7, y - h, 14, h); c.strokeRect(x - 7, y - h, 14, h); txt(c, lab, x, y - h / 2, Math.min(30, w * .2), '#fff', 'center', 'Anton'); c.restore(); };
// bar chart panel (screen space)
const bars = (c, x, y, w, title, rows, lt) => { const h = 70 + rows.length * 74; c.save(); c.fillStyle = 'rgba(0,0,0,.3)'; rr(c, x + 8, y + 10, w, h, 14); c.fill(); c.fillStyle = '#f6efe2'; c.strokeStyle = INK; c.lineWidth = 5; rr(c, x, y, w, h, 14); c.fill(); c.stroke();
  txt(c, title, x + w / 2, y + 36, 30, INK, 'center', 'Anton'); rows.forEach(([lab, v, at, col], i) => { const u = E.out(K.seg(lt, at, at + 1.2)), yy = y + 80 + i * 74, bw = w - 250; txt(c, lab, x + 20, yy + 22, 26, INK, 'left', 'Oswald');
    c.fillStyle = '#ddd2bc'; c.fillRect(x + 150, yy, bw, 44); c.fillStyle = col || '#c8282e'; c.fillRect(x + 150, yy, bw * v / 100 * u, 44); c.strokeRect(x + 150, yy, bw, 44); txt(c, Math.round(v * u) + '%', x + w - 52, yy + 22, 30, INK, 'center', 'Anton'); }); c.restore(); };

  c.fillRect(x - w / 2, fy - top, w, top); c.strokeRect(x - w / 2, fy - top, w, top); c.fillStyle = R.shadeHex(col, .15); c.fillRect(x - w / 2 - 12, fy - top - 16, w + 24, 18); c.strokeRect(x - w / 2 - 12, fy - top - 16, w + 24, 18); c.restore(); };
const beam = (c, x0, y0, x1, y1) => { c.save(); c.strokeStyle = INK; c.lineWidth = 22; c.lineCap = 'butt'; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); c.strokeStyle = '#c0582a'; c.lineWidth = 15; c.stroke(); c.restore(); };

const pump = (c, x, fy, s, lt) => { const a = Math.sin(lt * 2) * .25; c.save(); c.translate(x, fy); c.scale(s, s); c.strokeStyle = INK; c.lineWidth = 6; c.fillStyle = '#3a2a22'; c.beginPath(); c.moveTo(-60, 0); c.lineTo(0, -180); c.lineTo(60, 0); c.stroke();
  c.save(); c.translate(0, -180); c.rotate(a); c.fillStyle = '#4a3a30'; c.fillRect(-150, -14, 260, 28); c.strokeRect(-150, -14, 260, 28); c.beginPath(); c.moveTo(-150, -30); c.quadraticCurveTo(-190, 0, -150, 30); c.lineTo(-150, -30); c.fill(); c.stroke(); c.restore();
  c.beginPath(); c.moveTo(-150, -180 - Math.sin(a) * 150); c.lineTo(-150, 0); c.stroke(); c.restore(); };
const tanker = (c, x, y, s) => { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = '#2a1e26'; c.beginPath(); c.moveTo(-160, 0); c.lineTo(160, 0); c.lineTo(140, 24); c.lineTo(-150, 24); c.fill(); c.fillRect(100, -30, 40, 30); c.fillRect(-120, -8, 200, 8); c.restore(); };

for (const n of ['construction', 'labour_camp', 'ministry', 'office', 'card']) K.load(n, PL + n + '.jpg');

const FC = 1260, FL = 1250, SC = 1.7;

window.SHOTS = [
  // 4.00 oil field at sunset: 1971 independence tags, the price board rolls $3 -> $30, a young citizen cheers, tankers on the horizon
  { plate: 'oil_field', cam: { z: [1.12, 1.28], x: [1250, 1330], y: [760, 800] }, bed: [['wind_loop', .14], ['hum_loop', .05]], light: { dir: -1, key: 'rgba(255,170,90,.18)' },

          pump(c, 520, FC, 1.2, lt); pump(c, 2280, FC - 60, .8, lt + 1.3);
          // price board on legs
          c.save(); c.fillStyle = '#2a2a2a'; c.fillRect(1640, 640, 20, FC - 640); c.fillRect(2160, 640, 20, FC - 640); c.strokeStyle = INK; c.lineWidth = 6; c.fillStyle = '#1e1e24'; rr(c, 1560, 330, 700, 340, 16); c.fill(); c.stroke();
          txt(c, 'OIL · PER BARREL', 1910, 380, 34, '#e8b44a', 'center', 'Anton'); const u = E.io(K.seg(lt, t72 + .3, t30)), yr = Math.round(1972 + 10 * u), v = 3 + 27 * u;
          txt(c, '$' + v.toFixed(0), 1910, 520, 150, '#7ee07a', 'center', 'Anton'); txt(c, String(yr), 1910, 625, 40, '#f4efe2', 'center', 'Oswald'); c.restore(); GM.barrel(c, 1400, FC, 1.0); GM.barrel(c, 1480, FC + 10, 1.0); }];

  // 4.01 ministry counter: a clerk hands a citizen gift boxes one by one: NO TAX, JOB, HEALTH, SCHOOL, POWER, LAND
  { plate: 'ministry', cam: { z: [1.3, 1.42], x: [1240, 1290], y: [860, 880] }, bed: [['office_loop', .12]], light: { dir: 1, key: 'rgba(230,230,255,.1)' },
    init: S => { const tD = A.at(S, 'deal.', 2.0), ws = [['tax.', 3.0, 'NO TAX', '#4a7ab0'], ['job,', 4.4, 'JOB', '#3a8a5a'], ['healthcare,', 6.6, 'HEALTH', '#c8282e'], ['education,', 7.6, 'SCHOOL', '#8a4ab0'], ['power,', 8.4, 'POWER', '#d08a2a'], ['land.', 9.2, 'LAND', '#6a5038']].map(([w, d, l, col]) => [A.at(S, w, d), l, col]);

          let y = FL; ws.forEach(([t, l, col], i) => { const u = E.io(K.seg(lt, t - .4, t + .1)); if (u <= 0) return; const w = 170 - i * 8, h = 80; const ty = y; const x = CX - 150 + (SX - (CX - 150)) * u, yy = (FL - 280) + (ty - (FL - 280)) * u - Math.sin(u * Math.PI) * 120;

      S.D.sfx = [[.3, 'pop', .2], [tT, 'tick', .3], [tT + .2, 'riser', .15], [tN, 'tick', .3], [tS, 'stamp', .3]]; } },

    init: S => { const tP = A.at(S, 'price?', .8), tS = A.at(S, 'say', 1.6), tNt = A.at(S, 'taxation,', 4.2), tO = A.at(S, 'American', 6.2), tF = A.at(S, 'flipped', 7.4);

          // the slogan sign on a post, rotating 180 deg on 'flipped'
          const u = E.io(K.seg(lt, tF - .1, tF + .6)); c.fillStyle = '#5a4430'; c.fillRect(470, 560, 18, FL - 560); c.strokeRect(470, 560, 18, FL - 560); c.save(); c.translate(480, 520); c.rotate(u * Math.PI); c.fillStyle = '#f6efe2'; rr(c, -360, -110, 720, 220, 12); c.fill(); c.stroke();

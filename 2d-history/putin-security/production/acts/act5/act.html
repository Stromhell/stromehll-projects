<!doctype html><html><head><meta charset="utf-8"><title>PU act 5 - Three Offices, One Man</title>
<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}@font-face{font-family:SourceSerif;src:url(../../../../shared/fonts/SourceSerif4.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/rig_v5.js"></script><script src="../../../../shared/rig_leo.js"></script><script>window.RIGSTYLE = "alium";</script><script src="../../../../shared/kit.js"></script><script src="../../../../shared/anim.js"></script>
<script src="../../pu_kit.js"></script>
<script src="timing.js"></script>
<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
for (const n of ['office_a', 'office_b', 'office_c', 'map_russia']) K.load(n, PL + n + '.jpg');
const SW = 1920, SH = 1080, INK = '#1d1712', RED = '#d42a20', GOLD = '#e8b44a';
const pop = (lt, at, d = .45) => E.back(K.seg(lt, at, at + d));
const plateAt = (c, name, px, py, sx, sy, z) => { const s2 = z * 1920 / 2560; c.setTransform(s2, 0, 0, s2, sx - px * s2, sy - py * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); return s2; };
const backdrop = (name, dim = .55, blur = 6) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${1 - dim})`; plateAt(c, name, 1280, 720, 960, 540, 1.08); c.restore(); c.setTransform(1, 0, 0, 1, 0, 0); };
// label with a leader line (screen)
const callout = (c, x, y, tx, ty, txt, a, col = GOLD) => { if (a <= 0) return; c.save(); c.globalAlpha = Math.min(1, a); c.strokeStyle = col; c.lineWidth = 4; c.beginPath(); c.arc(x, y, 12, 0, 7); c.stroke(); c.beginPath(); c.moveTo(x, y); c.lineTo(tx, ty); c.stroke(); c.restore(); c.save(); c.globalAlpha = Math.min(1, a); K.outlined(c, txt, tx, ty - 26, 40, { fill: col }); c.restore(); };
const OFF = ['office_a', 'office_b', 'office_c'];
// a plate shown inside a framed screen/photo: plate point (px,py) at screen centre (cx,cy), clip w x h
const framed = (c, name, cx, cy, w, h, z, px = 1280, py = 720, a = 1, bezel = '#15151a') => { if (a <= 0) return; c.save(); c.globalAlpha = Math.min(1, a); c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(cx - w / 2 + 14, cy - h / 2 + 16, w + 20, h + 20); c.fillStyle = bezel; c.beginPath(); c.roundRect(cx - w / 2 - 14, cy - h / 2 - 14, w + 28, h + 28, 12); c.fill(); c.save(); c.beginPath(); c.rect(cx - w / 2, cy - h / 2, w, h); c.clip(); plateAt(c, name, px, py, cx, cy, z); c.restore(); c.setTransform(1, 0, 0, 1, 0, 0); c.restore(); };
// map of a framed plate point to screen
const fpt = (cx, cy, z, px, py, qx, qy) => { const s2 = z * 1920 / 2560; return [cx + (qx - px) * s2, cy + (qy - py) * s2]; };
const ring = (c, x, y, r, a, col = RED) => { if (a <= 0) return; c.save(); c.globalAlpha = Math.min(1, a); c.strokeStyle = col; c.lineWidth = 6; c.beginPath(); c.arc(x, y, r * (1.4 - .4 * Math.min(1, a)), 0, 7); c.stroke(); c.restore(); };
const drone = (c, x, y, s, t) => { c.save(); c.translate(x, y); c.scale(s, s); c.strokeStyle = INK; c.lineWidth = 6; c.fillStyle = '#3a3a40'; c.beginPath(); c.moveTo(-50, -10); c.lineTo(50, -10); c.stroke(); c.beginPath(); c.roundRect(-24, -20, 48, 26, 8); c.fill(); c.stroke(); for (const sx of [-50, 50]) { c.fillStyle = 'rgba(40,40,48,.5)'; c.beginPath(); c.ellipse(sx, -16, 30 * Math.abs(Math.cos(t * 30)) + 6, 5, 0, 0, 7); c.fill(); } c.restore(); };
const house = (c, x, y, s) => { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = '#f1e8d8'; c.strokeStyle = INK; c.lineWidth = 5; c.fillRect(-90, -80, 180, 80); c.strokeRect(-90, -80, 180, 80); c.fillStyle = '#b4562a'; c.beginPath(); c.moveTo(-110, -78); c.lineTo(0, -150); c.lineTo(110, -78); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#2a3440'; for (const wx of [-60, 30]) c.fillRect(wx, -60, 30, 30); c.fillStyle = '#6a4a2a'; c.fillRect(-15, -50, 30, 50); c.restore(); };
const coast = (c, lt) => { const g = c.createLinearGradient(0, 0, 0, 640); g.addColorStop(0, '#1e2a48'); g.addColorStop(.6, '#7a5a6a'); g.addColorStop(1, '#e09a6a'); c.fillStyle = g; c.fillRect(0, 0, 1920, 640); c.fillStyle = 'rgba(255,220,170,.5)'; c.beginPath(); c.arc(420, 560, 70, 0, 7); c.fill();
  c.fillStyle = 'rgba(255,240,220,.08)'; for (let k = 0; k < 6; k++) { c.beginPath(); c.ellipse(200 + k * 330 + 20 * Math.sin(lt * .2 + k), 160 + (k % 3) * 70, 220, 26, 0, 0, 7); c.fill(); }
  const sg = c.createLinearGradient(0, 600, 0, 1080); sg.addColorStop(0, '#5a6a8a'); sg.addColorStop(1, '#1a2a44'); c.fillStyle = sg; c.fillRect(0, 600, 1920, 480); c.strokeStyle = 'rgba(255,210,160,.35)'; c.lineWidth = 3; for (let k = 0; k < 40; k++) { const y = 620 + (k * 37) % 440, x = (k * 211 + lt * 20 * (1 + k % 3)) % 2100 - 100; c.beginPath(); c.moveTo(x, y); c.lineTo(x + 40 + (k % 4) * 20, y); c.stroke(); }
  c.fillStyle = '#3a4a3a'; c.beginPath(); c.moveTo(700, 1080); c.quadraticCurveTo(900, 560, 1300, 600); c.quadraticCurveTo(1700, 560, 1920, 640); c.lineTo(1920, 1080); c.closePath(); c.fill(); c.fillStyle = '#2a3a2c'; c.beginPath(); c.moveTo(820, 1080); c.quadraticCurveTo(1100, 700, 1500, 720); c.quadraticCurveTo(1800, 700, 1920, 760); c.lineTo(1920, 1080); c.closePath(); c.fill();
  [[900, 690, 1], [960, 640, 1.1], [1440, 640, 1.2], [1520, 660, .9], [1700, 620, 1.3], [1800, 650, 1]].forEach(([x, y, s]) => { c.fillStyle = '#1e2a1e'; c.beginPath(); c.ellipse(x, y - 70 * s, 22 * s, 80 * s, 0, 0, 7); c.fill(); c.fillStyle = 'rgba(120,150,110,.25)'; c.beginPath(); c.ellipse(x - 6 * s, y - 90 * s, 8 * s, 50 * s, 0, 0, 7); c.fill(); }); };
const camIcon = (c, x, y, s, lt) => { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = '#2a2a30'; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.roundRect(-110, -70, 180, 140, 14); c.fill(); c.stroke(); c.beginPath(); c.moveTo(70, -30); c.lineTo(130, -60); c.lineTo(130, 60); c.lineTo(70, 30); c.closePath(); c.fill(); c.stroke(); c.fillStyle = `rgba(220,40,30,${.6 + .4 * Math.sin(lt * 6)})`; c.beginPath(); c.arc(-80, -40, 12, 0, 7); c.fill(); c.strokeStyle = '#5a5a64'; c.lineWidth = 6; c.beginPath(); c.moveTo(-20, 70); c.lineTo(-70, 220); c.moveTo(-20, 70); c.lineTo(30, 220); c.moveTo(-20, 70); c.lineTo(-20, 220); c.stroke(); c.restore(); };
const PVT = [['NOVO-OGARYOVO', 37.2, 55.72, -200, 40], ['VALDAI', 33.3, 57.9, 0, -60], ['SOCHI', 39.7, 43.6, 0, 70]].map(([n, lo, la, dx, dy]) => { const [x, y] = PU.xy(lo, la); return { n, x, y, dx, dy }; });

window.SHOTS = [
  // 1 the video meeting from "Novo-Ogaryovo"
  { draw: (c, lt, u, S) => { backdrop('office_b', .78, 10)(c); framed(c, 'office_a', 960, 470, 1280, 720, .62 + .02 * lt, 1280, 760); c.save(); c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(320, 776, 1280, 54); c.font = '34px Oswald'; c.fillStyle = '#fff'; c.textAlign = 'left'; c.fillText('VIDEO MEETING · NOVO-OGARYOVO', 340, 815); c.fillStyle = `rgba(220,40,30,${.6 + .4 * Math.sin(lt * 5)})`; c.beginPath(); c.arc(1520, 802, 12, 0, 7); c.fill(); c.font = '30px Anton'; c.fillStyle = '#fff'; c.fillText('LIVE', 1538, 814); c.restore(); },
    bed: [['hum_loop', .3]],
    init: S => { const tW = A.at(S, 'invasion', 1.2); S.D.over = [(c, lt) => K.badge(c, 'SINCE THE FULL-SCALE INVASION, 2022', lt, { at: tW })]; S.D.sfx = [[.4, 'chime', .4], [tW, 'pop', .35]]; } },
  // 2 a room every Russian knows
  { plate: 'office_a', cam: { z: [1.02, 1.1], x: [1280, 1280], y: [720, 740] }, bed: [['hum_loop', .3]],
    live: [(c, lt, u, S) => { callout(c, 1300, 1000, 1700, 1180, 'THE DESK', pop(lt, S.t1)); callout(c, 860, 360, 560, 300, 'WOOD PANELS', pop(lt, S.t2)); callout(c, 1580, 520, 2020, 500, 'THE FLAGS', pop(lt, S.t3)); }],
    init: S => { S.t1 = A.at(S, 'desk', 1.4); S.t2 = A.at(S, 'wood panels', 2.4); S.t3 = A.at(S, 'flags', 3.4); S.D.sfx = [[S.t1, 'pop', .4], [S.t2, 'pop', .4], [S.t3, 'pop', .4]]; } },
  // 3 the door handles sit at different heights
  { draw: (c, lt, u, S) => { backdrop('office_a', .75, 10)(c); OFF.forEach((n, i) => framed(c, n, 400 + i * 560, 470, 480, 620, 1.3, 400, 760, pop(lt, .3 + i * .25), '#efe6d2')); OFF.forEach((n, i) => { const [x, y] = fpt(400 + i * 560, 470, 1.3, 400, 760, 532, S.hy[i]); ring(c, x, y, 34, pop(lt, S.tH + i * .3)); });
      const a = K.seg(lt, S.tH + 1, S.tH + 1.6); if (a > 0) { c.save(); c.globalAlpha = a; c.setLineDash([18, 12]); c.strokeStyle = GOLD; c.lineWidth = 4; const [, y0] = fpt(400, 470, 1.3, 400, 760, 532, S.hy[0]); c.beginPath(); c.moveTo(140, y0); c.lineTo(1780, y0); c.stroke(); c.restore(); } ['CLIP 1', 'CLIP 2', 'CLIP 3'].forEach((t, i) => K.outlined(c, t, 400 + i * 560, 860, 40, { fill: '#fffaf0' })); },
    bed: [['hum_loop', .3]],
    init: S => { S.hy = [752, 700, 780]; S.tH = A.at(S, 'door handles', 2.4); const tJ = A.at(S, 'journalists', .6); S.D.over = [(c, lt) => K.badge(c, 'JOURNALISTS COMPARED THE FOOTAGE', lt, { at: tJ })]; S.D.sfx = [[.3, 'camera_shutter', .35], [S.tH, 'pop', .4], [S.tH + .3, 'pop', .4], [S.tH + .6, 'pop', .4]]; } },
  // 4 spot the difference: thermostat, panels, vents, TV stands
  { draw: (c, lt, u, S) => { backdrop('office_c', .75, 10)(c); OFF.forEach((n, i) => framed(c, n, 360 + i * 600, 330, 540, 304, .28, 1280, 720, 1, '#efe6d2')); S.items.forEach(([t, at, qx, qy], k) => { const a = pop(lt, at); if (a <= 0) return; c.save(); c.globalAlpha = Math.min(1, a); c.font = '46px Anton'; c.fillStyle = '#fffaf0'; c.strokeStyle = INK; c.lineWidth = 8; c.textAlign = 'left'; c.strokeText('✗ ' + t, 420 + (k % 2) * 620, 610 + Math.floor(k / 2) * 90); c.fillStyle = k % 2 ? '#ffd88a' : '#fffaf0'; c.fillText('✗ ' + t, 420 + (k % 2) * 620, 610 + Math.floor(k / 2) * 90); c.restore(); if (qx) OFF.forEach((n, i) => { const [x, y] = fpt(360 + i * 600, 330, .28, 1280, 720, qx[i], qy[i]); ring(c, x, y, 26, a); }); }); },
    bed: [['hum_loop', .3]],
    init: S => { S.items = [['THERMOSTAT MOVES', A.at(S, 'thermostat', .6), [1848, 1772, 1612], [640, 640, 700]], ['PANELS DON\'T LINE UP', A.at(S, 'wall panels', 2)], ['VENTS DIFFER', A.at(S, 'vents', 3.6)], ['TV STANDS DON\'T MATCH', A.at(S, 'TV stands', 4.4), [2300, 2300, 2400], [880, 880, 880]]]; S.D.sfx = S.items.map(r => [r[1], 'pop', .4]); } },
  // 5 near-copies at other residences
  { plate: 'map_russia', cam: { z: [1.1, 1.18], x: [1000, 1000], y: [800, 840], ease: E.io }, bed: [['wind_loop', .2], ['hum_loop', .2]],
    live: [(c, lt, u, S) => { c.save(); c.fillStyle = 'rgba(10,16,40,.25)'; c.fillRect(0, 0, 2560, 1440); c.restore(); PVT.forEach((p, i) => { const a = pop(lt, S.at[i]); if (a <= 0) return; PU.dot(c, p.x, p.y, p.n, Math.min(1, a), p.dx, p.dy); c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.restore(); }); }],
    init: S => { S.at = [.4, A.at(S, 'Valdai', 3), A.at(S, 'Sochi', 4)]; const tC = A.at(S, 'near-copies', 1.4); S.D.over = [(c, lt) => K.card(c, 'NEAR-COPIES OF THE OFFICE\n(REPORTEDLY)', lt, { at: tC, x: 440, y: 200, px: 44, rot: -3 }), (c, lt) => OFF.forEach((n, i) => { const a = pop(lt, S.at[i] + .2); framed(c, n, 1560, 210 + i * 230, 300, 169, .16, 1280, 720, a, '#efe6d2'); if (a > 0) { c.save(); c.globalAlpha = Math.min(1, a); K.outlined(c, PVT[i].n, 1560, 210 + i * 230 + 124, 30, { fill: '#fffaf0' }); c.restore(); } })];
      S.D.sfx = [[tC, 'pop', .4]].concat(S.at.map(t => [t, 'pop', .4])); } },
  // 6 record here, look like you're there
  { draw: (c, lt, u, S) => { backdrop('office_c', .7, 8)(c); camIcon(c, 360, 520, 1.3, lt); framed(c, 'office_c', 1180, 440, 1040, 585, .5, 1280, 760); c.save(); c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(660, 676, 1040, 50); c.font = '32px Oswald'; c.fillStyle = '#fff'; c.textAlign = 'left'; c.fillText('NOVO-OGARYOVO', 680, 712); c.restore(); const q = pop(lt, S.tE); if (q > 0) { c.save(); c.globalAlpha = Math.min(1, q); K.outlined(c, '?', 960, 712, 70, { fill: RED }); c.restore(); } },
    bed: [['hum_loop', .3]],
    init: S => { S.tE = A.at(S, 'somewhere else', 5); const tR = A.at(S, 'reading', .8); S.D.over = [(c, lt) => K.badge(c, "ROZHDESTVENSKY'S READING", lt, { at: tR }), (c, lt) => K.card(c, 'REALLY: SOMEWHERE ELSE', lt, { at: S.tE + .2, x: 1180, y: 860 - 40, px: 44, rot: -2 })]; S.D.sfx = [[.4, 'camera_shutter', .4], [S.tE, 'hit', .4]]; } },
  // 7 no location, no target
  { plate: 'map_russia', cam: { z: [1.1, 1.14], x: [1000, 1000], y: [820, 820] }, bed: [['tension', .3]],
    live: [(c, lt) => { c.save(); c.fillStyle = 'rgba(40,0,0,.3)'; c.fillRect(0, 0, 2560, 1440); c.restore(); PVT.forEach(p => PU.dot(c, p.x, p.y, p.n, 1, p.dx, p.dy)); const i = Math.floor(lt * .9) % 3, j = (i + 1) % 3, f = E.io((lt * .9) % 1); const x = PVT[i].x + (PVT[j].x - PVT[i].x) * f + 30 * Math.sin(lt * 3), y = PVT[i].y + (PVT[j].y - PVT[i].y) * f + 20 * Math.cos(lt * 2.4); c.save(); c.strokeStyle = RED; c.lineWidth = 6; c.beginPath(); c.arc(x, y, 70, 0, 7); c.moveTo(x - 110, y); c.lineTo(x - 30, y); c.moveTo(x + 30, y); c.lineTo(x + 110, y); c.moveTo(x, y - 110); c.lineTo(x, y - 30); c.moveTo(x, y + 30); c.lineTo(x, y + 110); c.stroke(); c.restore(); }],
    init: S => { const tT = A.at(S, 'target', 1.6); S.D.over = [(c, lt) => K.card(c, 'NO LOCATION,\nNO TARGET', lt, { at: tT, x: 1500, y: 520, px: 54, rot: 3 })]; S.D.sfx = [[.3, 'tension', .3], [tT, 'hit', .4]]; } },
  // 8 avoiding the Sochi summer house: drones
  { draw: (c, lt, u, S) => { coast(c, lt); house(c, 1180, 640, 1.5); K.outlined(c, 'SOCHI SUMMER HOUSE', 1180, 720, 40, { fill: '#fffaf0' }); for (let k = 0; k < 3; k++) { const a = K.seg(lt, S.tD + k * .5, S.tD + k * .5 + 3); if (a <= 0) continue; drone(c, -150 + (700 + k * 260) * E.out(a), 220 + k * 90 + 10 * Math.sin(lt * 4 + k), .9, lt); } const st = pop(lt, S.tA); if (st > 0) { c.save(); c.translate(520, 780); c.rotate(-.1); c.scale(st, st); c.strokeStyle = RED; c.lineWidth = 10; c.strokeRect(-230, -60, 460, 120); c.font = '64px Anton'; c.fillStyle = RED; c.textAlign = 'center'; c.fillText('STAYS AWAY', 0, 24); c.restore(); } },
    bed: [['wind_loop', .3]],
    init: S => { S.tD = A.at(S, 'drones', 3); S.tA = A.at(S, 'stayed away', 1.6); S.D.over = [(c, lt) => K.badge(c, 'REPORTS SAY', lt, { at: .3 })]; S.D.sfx = [[S.tA, 'stamp', .5], [S.tD, 'drone', .45]]; } },
];
const _build = A.build; A.build = () => { const T2 = window.TIMING; K.setWords(T2.words); T2.shots.forEach((S, i) => { const D = window.SHOTS[i]; if (!D) return; D.live = D.live || []; D.front = D.front || []; D.over = D.over || []; S.D = D; S.vo_start = S.vo_start ?? S.start; if (D.init) D.init(S); }); _build(); };
A.build(); K.boot();
</script></body></html>

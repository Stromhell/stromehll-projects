<!doctype html><html><head><meta charset="utf-8"><title>PU ending - All That Security</title>
<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}@font-face{font-family:SourceSerif;src:url(../../../../shared/fonts/SourceSerif4.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/rig_v5.js"></script><script src="../../../../shared/rig_leo.js"></script><script>window.RIGSTYLE = "alium";</script><script src="../../../../shared/kit.js"></script><script src="../../../../shared/anim.js"></script>
<script src="../../pu_kit.js"></script>
<script src="timing.js"></script>
<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
for (const n of ['long_table', 'moscow_road', 'office_a', 'birch_rail', 'airfield']) K.load(n, PL + n + '.jpg');
const SW = 1920, SH = 1080, INK = '#1d1712', RED = '#d42a20', GOLD = '#e8b44a';
const pop = (lt, at, d = .45) => E.back(K.seg(lt, at, at + d));
const plateAt = (c, name, px, py, sx, sy, z) => { const s2 = z * 1920 / 2560; c.setTransform(s2, 0, 0, s2, sx - px * s2, sy - py * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); return s2; };
const backdrop = (name, dim = .55, blur = 6) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${1 - dim})`; plateAt(c, name, 1280, 720, 960, 540, 1.08); c.restore(); c.setTransform(1, 0, 0, 1, 0, 0); };
// label with a leader line (screen)
const callout = (c, x, y, tx, ty, txt, a, col = GOLD) => { if (a <= 0) return; c.save(); c.globalAlpha = Math.min(1, a); c.strokeStyle = col; c.lineWidth = 4; c.beginPath(); c.arc(x, y, 12, 0, 7); c.stroke(); c.beginPath(); c.moveTo(x, y); c.lineTo(tx, ty); c.stroke(); c.restore(); c.save(); c.globalAlpha = Math.min(1, a); K.outlined(c, txt, tx, ty - 26, 40, { fill: col }); c.restore(); };
const GUARD = { costume: 'suit', hair: 'short', hairCol: '#1a1414', seed: 2, glasses: true }, GUARD2 = { costume: 'suit', hair: 'bald', hairCol: '#2a2420', seed: 5 }, DEFECT = { costume: 'leather', hair: 'short', hairCol: '#4a3428', seed: 13 };
// round portrait frame with the stylised bust (no likeness)
const portrait = (c, x, y, r, a, bg = '#3a4a5a', col = '#0e0c10', lab) => { if (a <= 0) return; c.save(); c.translate(x, y); c.scale(a, a); c.fillStyle = 'rgba(0,0,0,.4)'; c.beginPath(); c.arc(8, 10, r + 12, 0, 7); c.fill(); c.fillStyle = '#d8b060'; c.beginPath(); c.arc(0, 0, r + 12, 0, 7); c.fill(); c.fillStyle = bg; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); c.save(); c.beginPath(); c.arc(0, 0, r, 0, 7); c.clip(); PU.silhouette(c, 0, r * 1.05, r / 150, col); c.restore(); if (lab) K.outlined(c, lab, 0, r + 60, 36, { fill: '#fffaf0' }); c.restore(); };
const shield = (c, x, y, s, a, txt) => { if (a <= 0) return; c.save(); c.translate(x, y); c.scale(s * a, s * a); c.fillStyle = '#2a3a5a'; c.strokeStyle = '#d8b060'; c.lineWidth = 5; c.beginPath(); c.moveTo(0, -70); c.lineTo(60, -50); c.quadraticCurveTo(60, 30, 0, 70); c.quadraticCurveTo(-60, 30, -60, -50); c.closePath(); c.fill(); c.stroke(); c.font = '26px Anton'; c.fillStyle = '#d8b060'; c.textAlign = 'center'; c.fillText('★', 0, 8); if (txt) { c.font = '28px Anton'; c.fillStyle = '#fffaf0'; c.fillText(txt, 0, 110); } c.restore(); };
const icon = (c, x, y, a, txt, col, draw) => { if (a <= 0) return; c.save(); c.translate(x, y); c.scale(a, a); c.fillStyle = 'rgba(0,0,0,.4)'; c.beginPath(); c.arc(6, 8, 96, 0, 7); c.fill(); c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.arc(0, 0, 90, 0, 7); c.fill(); c.stroke(); draw(c); c.restore(); K.outlined(c, txt, x, y + 140, 38, { fill: '#fffaf0' }); };
const crowd = (c, lt, n, y0, sc, a) => { if (a <= 0) return; c.save(); c.globalAlpha = Math.min(1, a); for (let k = 0; k < n; k++) { const x = (k * 157) % 2700 - 70, y = y0 + (k % 4) * 40, s = sc * (1 + (k % 4) * .12), b = Math.sin(lt * 3 + k) * 6; c.fillStyle = ['#1a1820', '#24202a', '#2c2630'][k % 3]; c.beginPath(); c.ellipse(x, y - 120 * s + b, 34 * s, 40 * s, 0, 0, 7); c.fill(); c.beginPath(); c.roundRect(x - 50 * s, y - 80 * s + b, 100 * s, 200 * s, 30 * s); c.fill(); if (k % 5 === 0) { c.fillStyle = '#ffd88a'; c.beginPath(); c.arc(x + 40 * s, y - 100 * s + b, 8 * s, 0, 7); c.fill(); } if (k % 7 === 2) { c.fillStyle = '#efe6d2'; c.fillRect(x - 60 * s, y - 330 * s + b, 120 * s, 70 * s); c.fillStyle = '#5a3a20'; c.fillRect(x - 4 * s, y - 260 * s + b, 8 * s, 120 * s); } } c.restore(); };
const stamp = (c, x, y, txt, lt, at, rot = -.15, px = 86, col = RED) => { const st = K.seg(lt, at, at + .35); if (st <= 0) return; c.save(); c.translate(x, y); c.rotate(rot); const z = 1 + 1.3 * (1 - E.out(st)); c.scale(z, z); c.globalAlpha = Math.min(1, st * 2); c.font = px + 'px Anton'; const w = c.measureText(txt).width; c.strokeStyle = col; c.lineWidth = 10; c.strokeRect(-w / 2 - 30, -px * .75, w + 60, px * 1.3); c.fillStyle = col; c.textAlign = 'center'; c.fillText(txt, 0, px * .32); c.restore(); };
const caseIcon = (c, x, y, s) => { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = '#2a2a30'; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.roundRect(-110, -80, 220, 150, 14); c.fill(); c.stroke(); c.strokeStyle = '#8a8a90'; c.lineWidth = 8; c.beginPath(); c.roundRect(-40, -110, 80, 40, 12); c.stroke(); c.fillStyle = GOLD; c.fillRect(-16, -20, 32, 36); c.restore(); };

const framed = (c, name, cx, cy, w, h, z, px = 1280, py = 720, a = 1, bezel = '#15151a') => { if (a <= 0) return; c.save(); c.globalAlpha = Math.min(1, a); c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(cx - w / 2 + 14, cy - h / 2 + 16, w + 20, h + 20); c.fillStyle = bezel; c.beginPath(); c.roundRect(cx - w / 2 - 14, cy - h / 2 - 14, w + 28, h + 28, 12); c.fill(); c.save(); c.beginPath(); c.rect(cx - w / 2, cy - h / 2, w, h); c.clip(); plateAt(c, name, px, py, cx, cy, z); c.restore(); c.setTransform(1, 0, 0, 1, 0, 0); c.restore(); };
const recapTile = (c, x, y, a, lab, plate, draw) => { if (a <= 0) return; framed(c, plate, x, y, 420 * a, 236 * a, .22 * a, 1280, 900, 1, '#efe6d2'); c.save(); c.beginPath(); c.rect(x - 210 * a, y - 118 * a, 420 * a, 236 * a); c.clip(); c.translate(x, y); c.scale(a * 1.4, a * 1.4); draw(c); c.restore(); c.save(); c.globalAlpha = Math.min(1, a); K.outlined(c, lab, x, y + 175, 36, { fill: '#fffaf0' }); c.restore(); };
window.SHOTS = [
  // 1 the whole system, tile by tile
  { draw: (c, lt, u, S) => { backdrop('office_a', .78, 10)(c); const T = [['ARMOURED CAR', 'moscow_road', S.at[0], cc => PU.limo(cc, 0, 60, .3, 0, 1)], ['FOUR LOOKALIKE PLANES', 'airfield', S.at[1], cc => { for (let k = 0; k < 4; k++) PU.jet(cc, -90 + k * 60, 20 + k * 12, .12, -1); }], ['NO-TIMETABLE TRAIN', 'birch_rail', S.at[2], cc => PU.train(cc, 140, 70, .18, 3, { top: '#9aa0a6', bot: '#5a6068', stripe: '#c8302a', nose: '#7a8088' })], ['THREE COPIED OFFICES', 'office_a', S.at[3], cc => {}], ['A DECOY OR TWO', 'airfield', S.at[4], cc => { PU.silhouette(cc, -40, 70, .4, '#0e0c10'); PU.silhouette(cc, 40, 70, .4, '#3a3a48'); }]];
      T.forEach(([lab, pl, at, d], i) => recapTile(c, i < 3 ? 420 + i * 540 : 690 + (i - 3) * 540, i < 3 ? 260 : 640, pop(lt, at), lab, pl, d)); },
    bed: [['hum_loop', .3], ['swell', .2]],
    init: S => { S.at = [A.at(S, 'armoured car', 1.4), A.at(S, 'planes', 2.4), A.at(S, 'train', 3.4), A.at(S, 'office', 4.4), A.at(S, 'decoy', 5.4)]; S.D.over = [(c, lt) => K.badge(c, 'THE SYSTEM', lt, { at: .3 })]; S.D.sfx = S.at.map(t => [t, 'pop', .4]); } },
  // 2 one of the most protected lives on earth
  { plate: 'long_table', cam: { z: [1.05, 1.5], x: [1280, 1290], y: [760, 700], ease: E.io }, bed: [['hum_loop', .3], ['drone', .2]],
    live: [(c) => PU.silhouette(c, 1290, 726, .3)],
    init: S => { S.D.over = [(c, lt) => K.title(c, 'ONE OF THE MOST PROTECTED\nLIVES ON EARTH', lt, { at: .6, y: 160, px: 70, fill: GOLD })]; S.D.sfx = [[.6, 'swell', .35]]; } },
  // 3 the one thing it cannot buy: the feeling of being safe
  { draw: (c, lt, u, S) => { c.fillStyle = '#060608'; c.fillRect(0, 0, 1920, 1080); const a = 1 - .6 * K.seg(lt, S.tF, S.tF + 2.5); c.save(); c.globalAlpha = a; c.filter = 'blur(6px) brightness(.5)'; plateAt(c, 'long_table', 1280, 760, 960, 540, 1.6); c.restore(); c.setTransform(1, 0, 0, 1, 0, 0); PU.silhouette(c, 960, 1080, 1.4, '#0a080c'); const g = c.createRadialGradient(960, 540, 200, 960, 540, 1000); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.85)'); c.fillStyle = g; c.fillRect(0, 0, 1920, 1080); },
    bed: [['heartbeat', .3], ['drone', .2]],
    init: S => { S.tF = A.at(S, 'feeling', 4); S.D.over = [(c, lt) => K.card(c, 'THE ONE THING IT\nCANNOT BUY HIM', lt, { at: A.at(S, 'one thing', 2), x: 480, y: 260, px: 44, rot: -3 }), (c, lt) => K.title(c, 'FEELING SAFE', lt, { at: S.tF, y: 420, px: 110, fill: '#fffaf0' })]; S.D.sfx = [[S.tF, 'hit', .4]]; } },
];
const _build = A.build; A.build = () => { const T2 = window.TIMING; K.setWords(T2.words); T2.shots.forEach((S, i) => { const D = window.SHOTS[i]; if (!D) return; D.live = D.live || []; D.front = D.front || []; D.over = D.over || []; S.D = D; S.vo_start = S.vo_start ?? S.start; if (D.init) D.init(S); }); _build(); };
A.build(); K.boot();
</script></body></html>

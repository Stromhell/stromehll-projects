<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}@font-face{font-family:SourceSerif;src:url(../../../../shared/fonts/SourceSerif4.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/rig_v5.js"></script><script src="../../../../shared/rig_leo.js"></script><script>window.RIGSTYLE = "alium";</script><script src="../../../../shared/kit.js"></script><script src="../../../../shared/anim.js"></script>

<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';

const pop = (lt, at, d = .45) => E.back(K.seg(lt, at, at + d));
const plateAt = (c, name, px, py, sx, sy, z) => { const s2 = z * 1920 / 2560; c.setTransform(s2, 0, 0, s2, sx - px * s2, sy - py * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); return s2; };

const callout = (c, x, y, tx, ty, txt, a, col = GOLD) => { if (a <= 0) return; c.save(); c.globalAlpha = Math.min(1, a); c.strokeStyle = col; c.lineWidth = 4; c.beginPath(); c.arc(x, y, 12, 0, 7); c.stroke(); c.beginPath(); c.moveTo(x, y); c.lineTo(tx, ty); c.stroke(); c.restore(); c.save(); c.globalAlpha = Math.min(1, a); K.outlined(c, txt, tx, ty - 26, 40, { fill: col }); c.restore(); };

// round portrait frame with the stylised bust (no likeness)

const shield = (c, x, y, s, a, txt) => { if (a <= 0) return; c.save(); c.translate(x, y); c.scale(s * a, s * a); c.fillStyle = '#2a3a5a'; c.strokeStyle = '#d8b060'; c.lineWidth = 5; c.beginPath(); c.moveTo(0, -70); c.lineTo(60, -50); c.quadraticCurveTo(60, 30, 0, 70); c.quadraticCurveTo(-60, 30, -60, -50); c.closePath(); c.fill(); c.stroke(); c.font = '26px Anton'; c.fillStyle = '#d8b060'; c.textAlign = 'center'; c.fillText('★', 0, 8); if (txt) { c.font = '28px Anton'; c.fillStyle = '#fffaf0'; c.fillText(txt, 0, 110); } c.restore(); };

  // 3 the inner circle: security men around him
  { draw: (c, lt, u, S) => { backdrop('office_a', .75, 10)(c); portrait(c, 960, 470, 130, pop(lt, .3)); for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2 - Math.PI / 2, x = 960 + Math.cos(a) * 380, y = 470 + Math.sin(a) * 280; const p = pop(lt, S.tS + k * .18); if (p > 0) { c.save(); c.globalAlpha = .6 * Math.min(1, p); c.strokeStyle = '#d8b060'; c.lineWidth = 4; c.beginPath(); c.moveTo(960, 470); c.lineTo(x, y); c.stroke(); c.restore(); } shield(c, x, y, 1, p); } },

  // 4 who wants him gone: jailed critics, rivals, the country he invaded
  { draw: (c, lt, u, S) => { backdrop('map_russia', .7, 8)(c); portrait(c, 960, 460, 120, 1); const L = [['JAILED CRITICS', '#6a6a7a', S.t1, 400, 330, cc => { cc.strokeStyle = '#1a1a1a'; cc.lineWidth = 8; for (let k = -2; k <= 2; k++) { cc.beginPath(); cc.moveTo(k * 26, -60); cc.lineTo(k * 26, 60); cc.stroke(); } }], ['RIVALS', '#8a5a3a', S.t2, 1520, 330, cc => { cc.fillStyle = '#efe6d2'; cc.beginPath(); cc.moveTo(-40, 40); cc.lineTo(0, -50); cc.lineTo(40, 40); cc.closePath(); cc.fill(); }], ['UKRAINE', '#2a5aa8', S.t3, 960, 860 - 150, cc => { cc.fillStyle = '#ffd500'; cc.fillRect(-60, 0, 120, 40); cc.fillStyle = '#0057b7'; cc.fillRect(-60, -40, 120, 40); }]];
      L.forEach(([t, col, at, x, y, d]) => { icon(c, x, y, pop(lt, at), t, col, d); const p = K.seg(lt, at + .3, at + 1); if (p > 0) { c.save(); c.strokeStyle = RED; c.lineWidth = 6; c.setLineDash([14, 10]); c.beginPath(); c.moveTo(x, y); c.lineTo(x + (960 - x) * .55 * p, y + (460 - y) * .55 * p); c.stroke(); c.restore(); } }); },

    init: S => { S.t1 = A.at(S, 'critics', 1.6); S.t2 = A.at(S, 'rivals', 2.6); S.t3 = A.at(S, 'invaded', 3.6); S.D.over = [(c, lt) => K.card(c, 'MANY WANT HIM GONE', lt, { at: .4, x: 960, y: 150, px: 52, rot: -2 })]; S.D.sfx = [[.4, 'pop', .35], [S.t1, 'pop', .4], [S.t2, 'pop', .4], [S.t3, 'pop', .4]]; } },
  // 5 the very long table, 2022
  { plate: 'long_table', cam: { z: [1.05, 1.12], x: [1280, 1280], y: [760, 740], ease: E.io }, bed: [['hum_loop', .3]],

    init: S => { S.tM = A.at(S, 'metres away', 3.4); S.D.over = [(c, lt) => K.dateTag(c, '2022 MEETINGS', lt, { at: .3 }), (c, lt) => K.card(c, 'GUESTS SAT\nMETRES AWAY', lt, { at: S.tM, x: 1560, y: 260, px: 50, rot: 3 })]; S.D.sfx = [[.3, 'pop', .3], [S.tM, 'scrape', .4]]; } },
  // 6 meals: own chefs, own ingredients, tested first
  { draw: (c, lt, u, S) => { backdrop('office_b', .7, 8)(c); const a = pop(lt, .3); if (a > 0) { c.save(); c.translate(760, 600); c.scale(a, a); c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(10, 90, 300, 40, 0, 0, 7); c.fill(); c.fillStyle = '#f2f0ea'; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.ellipse(0, 80, 280, 36, 0, 0, 7); c.fill(); c.stroke(); const lift = E.out(K.seg(lt, S.t3, S.t3 + .6)) * 120; const g = c.createLinearGradient(-200, 0, 200, 0); g.addColorStop(0, '#9aa0a8'); g.addColorStop(.5, '#e8ecf0'); g.addColorStop(1, '#8a9098'); c.fillStyle = g; c.beginPath(); c.ellipse(0, 70 - lift, 210, 190, 0, Math.PI, 0); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#c8ccd2'; c.beginPath(); c.arc(0, -124 - lift, 18, 0, 7); c.fill(); c.stroke(); c.restore(); }
      [['OWN CHEFS', S.t1], ['OWN INGREDIENTS', S.t2], ['TESTED BEFORE HE EATS', S.t3]].forEach(([t, at], i) => { const p = pop(lt, at); if (p <= 0) return; c.save(); c.globalAlpha = Math.min(1, p); c.font = '52px Anton'; c.textAlign = 'left'; c.lineWidth = 8; c.strokeStyle = INK; c.strokeText('✓ ' + t, 1160, 380 + i * 110); c.fillStyle = '#fffaf0'; c.fillText('✓ ' + t, 1160, 380 + i * 110); c.restore(); }); },

  { plate: 'airfield', cam: { z: [1.1, 1.14], x: [1280, 1300], y: [820, 820], ease: E.io }, bed: [['wind_loop', .45]],
    live: [(c) => PU.jet(c, 1720, 1010, 1.6, -1), (c, lt) => { const W = R.walkX(lt, 300, 700, 0, 3.4, 1.3), x = W.x; R.figure(c, { x, y: 1330, s: 1.3, ...GUARD, facing: 1, pose: W.moving ? 'walk' : 'stand', t: W.moving ? W.phase : lt, walkPhase: W.phase, mood: 'focus' }); caseIcon(c, x + 60, 1200, .55); }],
    init: S => { const tR = A.at(S, 'Reports', .3); S.D.over = [(c, lt) => K.card(c, 'REPORTS: ON FOREIGN TRIPS,\nGUARDS TAKE HIS WASTE HOME', lt, { at: tR + .4, x: 960, y: 230, px: 42, rot: -2 }), (c, lt) => K.card(c, 'SO NO ONE CAN STUDY\nHIS HEALTH', lt, { at: A.at(S, 'health', 3.4), x: 1500, y: 520, px: 40, rot: 3 })]; S.D.sfx = [[.3, 'footsteps', .35], [tR + .4, 'pop', .35]]; } },
  // 8 access is the currency: close rings hold power, far rings hold none
  { draw: (c, lt, u, S) => { backdrop('office_a', .78, 10)(c); [[420, '#4a3a2a', 'NONE'], [290, '#6a5030', ''], [170, '#a07a3a', 'POWER']].forEach(([r, col, t], i) => { const p = E.out(K.seg(lt, .3 + i * .3, 1 + i * .3)); if (p <= 0) return; c.save(); c.globalAlpha = .85; c.fillStyle = col; c.strokeStyle = '#d8b060'; c.lineWidth = 4; c.beginPath(); c.ellipse(960, 520, r * p * 1.4, r * p, 0, 0, 7); c.fill(); c.stroke(); c.restore(); }); portrait(c, 960, 520, 90, pop(lt, .9)); const a = pop(lt, S.tP); if (a > 0) { c.save(); c.globalAlpha = Math.min(1, a); K.outlined(c, 'REACH HIM = POWER', 960, 220, 46, { fill: GOLD }); c.restore(); } const b = pop(lt, S.tN); if (b > 0) { c.save(); c.globalAlpha = Math.min(1, b); K.outlined(c, "CAN'T REACH HIM = NONE", 1560, 860, 42, { fill: '#ffd8d0' }); c.restore(); } },
    bed: [['hum_loop', .3]],
    init: S => { S.tP = A.at(S, 'hold power', 3.4); S.tN = A.at(S, 'hold none', 4.6); S.D.over = [(c, lt) => K.badge(c, "ROZHDESTVENSKY'S VIEW", lt, { at: A.at(S, 'Rozhdestvensky', 1.6) }), (c, lt) => K.card(c, 'ACCESS IS\nTHE CURRENCY', lt, { at: .6, x: 380, y: 520, px: 46, rot: -3 })]; S.D.sfx = [[.3, 'swell', .3], [S.tP, 'pop', .4], [S.tN, 'pop', .4]]; } },

  { draw: (c, lt, u, S) => { backdrop('office_b', .75, 10)(c); for (let k = 0; k < 3; k++) portrait(c, 560 + k * 400, 470, 130, pop(lt, k === 1 ? .5 : S.tD + k * .25), '#3a4a5a', ['#0e0c10', '#16141a', '#0e0c10'][k], k === 1 ? '?' : ''); stamp(c, 960, 800, 'KREMLIN DENIES · NO PUBLIC PROOF', lt, S.tK, -.05, 50); },

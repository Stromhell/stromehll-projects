<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}@font-face{font-family:SourceSerif;src:url(../../../../shared/fonts/SourceSerif4.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/rig_v5.js"></script><script src="../../../../shared/rig_leo.js"></script><script>window.RIGSTYLE = "gumball";</script><script src="../../../../shared/kit.js"></script><script src="../../../../shared/anim.js"></script>
<script src="../../../../prime/production/tw_kit.js"></script><script src="../../../../prime/production/pr_kit.js"></script><script src="../../g6_kit.js"></script>
<script src="timing.js"></script>
<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
const SW = 1920, SH = 1080, INK = TW.INK, RED = TW.RED, pop = TW.pop, fade = TW.fade;
const backdrop = (name, b = .5, blur = 8) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${b})`; const s2 = 1.06 * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 720 * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); c.restore(); K.screen(c); };
const CARRY = () => ({ shL: 30, elL: -75, shR: 35, elR: -75 });
const endTitle = (secs) => { const T = window.TIMING; const last = T.shots[T.shots.length - 1]; T.shots.push({ i: T.shots.length, start: last.end, end: last.end + secs, vo_start: last.end, vo_end: last.end, text: '' }); T.dur = last.end + secs; };
// G6 act 5 - Chapter 3: Money. Dre'Quan's club / Boobie Ike, Cal + the antiques dealer, Brian -> Raul, the one-vault plan,
// three banks in one day, the Cartel Heist, the vault opens + Mr & Mrs Walker, Valentina's warning (TOMMY jar full).
// Plates: neon_club, bedroom, antiques_shop, cafe_int, leonida_map, rain_street, vault, rooftop_bar, hotel_balcony.
for (const n of ['neon_club', 'bedroom', 'antiques_shop', 'cafe_int', 'leonida_map', 'rain_street', 'vault', 'rooftop_bar', 'hotel_balcony']) K.load(n, PL + n + '.jpg');
const rr = TW.rr, txt = TW.txt, GOLD = G6.GOLD;
// ---------- act helpers ----------
// word anchor with a proportional fallback (real timing replaces the estimate)
const at = (S, w) => { const ws = S.text.split(/\s+/), n = s => s.toLowerCase().replace(/[^a-z0-9']/g, ''), k = Math.max(0, ws.findIndex(x => n(x) === n(w.split(' ')[0]))); return A.at(S, w, (S.vo_start - S.start) + (S.vo_end - S.vo_start) * k / ws.length); };
// gold name tag (world space), pointer tip at x,y
const ntag = (c, name, x, y, lt, t0, px = 40, until = 999) => { const a = pop(lt, t0, .4), o = 1 - K.seg(lt, until - .3, until); if (a <= 0 || o <= 0) return; c.save(); c.globalAlpha = o; c.translate(x, y); c.scale(a, a); c.font = `${px}px Anton`;
  const w = c.measureText(name).width + px * .9, h = px * 1.45; c.fillStyle = 'rgba(0,0,0,.35)'; rr(c, -w / 2 + 6, -h - 12, w, h, 10); c.fill(); c.fillStyle = GOLD; c.strokeStyle = INK; c.lineWidth = 4; rr(c, -w / 2, -h - 18, w, h, 10); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(-14, -19); c.lineTo(0, 0); c.lineTo(14, -19); c.closePath(); c.fill(); c.stroke(); c.fillRect(-12, -24, 24, 7); txt(c, name, 0, -h / 2 - 16, px, INK, 'center', 'Anton'); c.restore(); };
// speech bubble that pops in at t0 and out at t1 (centre x,y; tail [dx,dy] to the speaker's mouth)
const say = (c, x, y, lt, t0, t1, text, o = {}) => { const a = pop(lt, t0, .35) * (1 - K.seg(lt, t1 - .3, t1)); if (a > 0.01) G6.bubble(c, x, y, a * (o.s || 1), text, o); };
const card = (c, s, lt, t0, o = {}) => K.card(c, s, lt, Object.assign({ at: t0 }, o));
// a cut inside a shot: from `t0` a second scene (own plate or bg fn, own camera, figures) wipes in over the shot (rect = inset panel)
const cut = (t0, o) => (c, lt, u, S) => { if (lt < t0) return; const R2 = o.rect || [0, 0, SW, SH], d = (o.t1 ?? (S.end - S.start)) - t0, u2 = K.clamp((lt - t0) / d), w = E.io(K.clamp((lt - t0) / .4));
  if (o.t1 != null && lt > o.t1) return; const S2 = o._S || (o._S = { D: { light: o.light || {} }, start: S.start, end: S.end });
  c.save(); c.beginPath(); c.rect(R2[0], R2[1], R2[2] * w, R2[3]); c.clip(); c.translate(R2[0], R2[1]); c.scale(R2[2] / SW, R2[3] / SH);
  const M = c.getTransform(); const m = K.camAt(o.cam || {}, u2); c.transform(m.sc, 0, 0, m.sc, m.tx, m.ty);
  if (o.plate) c.drawImage(K.imgs[o.plate], 0, 0, 2560, 1440); if (o.bg) o.bg(c, lt);
  for (const L of o.live || []) { c.save(); L(c, lt, u2, S2); c.restore(); }
  for (const f of (o.figs || []).slice().sort((a, b) => a.y - b.y)) { c.save(); A.figure(c, f, lt, u2, S2); c.restore(); }
  for (const L of o.front || []) { c.save(); L(c, lt, u2, S2); c.restore(); }
  c.setTransform(M); c.restore();
  c.save(); if (o.rect) { c.strokeStyle = '#f6efdc'; c.lineWidth = 10; c.strokeRect(R2[0], R2[1], R2[2] * w, R2[3]); c.strokeStyle = INK; c.lineWidth = 4; c.strokeRect(R2[0] - 5, R2[1] - 5, R2[2] * w + 10, R2[3] + 10); }
  else if (w < 1) { c.fillStyle = '#fff'; c.fillRect(SW * w - 6, 0, 12, SH); } c.restore(); };
const sweat = (c, x, y, lt, s = 1) => { for (let k = 0; k < 3; k++) { const p = (lt * .9 + k / 3) % 1; c.save(); c.globalAlpha = 1 - p; c.fillStyle = '#8ad0ff'; c.strokeStyle = INK; c.lineWidth = 2; c.beginPath(); const xx = x + (k - 1) * 26 * s, yy = y + p * 60 * s; c.moveTo(xx, yy - 12 * s); c.quadraticCurveTo(xx + 8 * s, yy, xx, yy + 6 * s); c.quadraticCurveTo(xx - 8 * s, yy, xx, yy - 12 * s); c.fill(); c.stroke(); c.restore(); } };
const neon = (c, lt, x, y, r, col) => TW.glow(c, x, y, r, col, .25 + .12 * Math.sin(lt * 9) * (Math.sin(lt * 23) > .7 ? 0 : 1));
const sparks = (c, x, y, lt, n = 14) => { for (let k = 0; k < n; k++) { const p = (lt * 2.2 + k * .37) % 1, a = k * 2.4; c.fillStyle = `rgba(255,${200 + (k % 3) * 20},120,${1 - p})`; c.fillRect(x + Math.cos(a) * p * 90, y + Math.sin(a) * p * 70 + p * p * 60, 6, 6); } TW.glow(c, x, y, 70, '255,220,150', .6 + .3 * Math.sin(lt * 30)); };
const cafeChair = (c, x, fy, seatY, facing) => { c.save(); c.strokeStyle = INK; c.lineWidth = 4; c.fillStyle = '#2f5a44'; const bx = x - facing * 62; rr(c, bx - 10, seatY - 170, 20, 175, 6); c.fill(); c.stroke(); rr(c, x - 70, seatY, 140, 22, 6); c.fill(); c.stroke();
  c.fillStyle = '#1e2a24'; for (const dx of [-60, 52]) { c.fillRect(x + dx, seatY + 20, 9, fy - seatY - 20); c.strokeRect(x + dx, seatY + 20, 9, fy - seatY - 20); } c.restore(); };
const table = (c, x, fy, topY, w = 300, col = '#f4efe4') => { c.save(); c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(x, fy, w * .45, 16, 0, 0, 7); c.fill(); c.fillStyle = '#3a3a40'; c.strokeStyle = INK; c.lineWidth = 4; c.fillRect(x - 10, topY, 20, fy - topY); c.strokeRect(x - 10, topY, 20, fy - topY); c.fillRect(x - 70, fy - 10, 140, 10);
  c.fillStyle = col; c.beginPath(); c.ellipse(x, topY, w / 2, 24, 0, 0, 7); c.fill(); c.stroke(); c.restore(); };
const desk = (c, x, fy, topY, w) => { c.save(); c.fillStyle = '#6a4a32'; c.strokeStyle = INK; c.lineWidth = 4; rr(c, x - w / 2, topY, w, 26, 4); c.fill(); c.stroke(); c.fillStyle = '#4a3222'; for (const dx of [-w / 2 + 14, w / 2 - 34]) { c.fillRect(x + dx, topY + 26, 20, fy - topY - 26); c.strokeRect(x + dx, topY + 26, 20, fy - topY - 26); } c.restore(); };
const MASK = (c, hx, hy) => G6.mask(c, hx + 12, hy + 4, 1.62);
const trolley = (c, x, fy, n, lt) => { c.save(); c.strokeStyle = INK; c.lineWidth = 5; c.fillStyle = '#9aa0a8'; c.fillRect(x - 170, fy - 70, 340, 16); c.strokeRect(x - 170, fy - 70, 340, 16); c.beginPath(); c.moveTo(x + 170, fy - 62); c.lineTo(x + 200, fy - 180); c.stroke();
  for (const dx of [-140, 140]) { c.fillStyle = '#1a1a1e'; c.beginPath(); c.arc(x + dx, fy - 18, 18, 0, 7); c.fill(); c.stroke(); } c.restore(); for (let k = 0; k < n; k++) G6.duffel(c, x - 90 + k * 100, fy - 70, .85, { cash: k % 2 === 0 }); };

window.SHOTS = [
  // 5.0 neon club front: Jason + Lucia walk up, Dre'Quan waves them in ('my club'); HE DOESN'T; the camera tilts up to Boobie Ike on the balcony;
  // a flat key drops to Jason; then Ike hands down a package: SELL FOR ME.
  { plate: 'neon_club', bed: [['city_loop', .2], ['night_loop', .1]], light: { dir: 1, key: 'rgba(255,90,200,.22)' },
    init: S => { const tV = at(S, 'Vice'), tD = at(S, "Dre'Quan"), tR = at(S, 'runs'), tN = at(S, "doesn't."), tO = at(S, 'owner'), tI = at(S, 'Boobie'), tF = at(S, 'flats'), tL = at(S, 'lends'), tSe = at(S, 'sell'), dur = S.end - S.start;
      const uI = (tI - .4) / dur, uS = (tSe - .6) / dur;
      S.D.cam = { z: [1.38, 1.45], x: [1240, 1440], y: [960, 820], ease: u => .3 * u + .7 * E.io(K.clamp((u - uI) / .12)) };
      S.D.figs = [{ x: 0, y: 1330, s: 1.25, ...G6.JASON(), mood: 'neutral', walk: { x0: 300, x1: 940, t0: .2, dur: 3.2 }, anim: (o, lt) => { if (lt > tN) o.mood = 'worried'; if (lt > tSe) { o.pose = 'carry'; o.hold = { near: cc => G6.packages(cc, 0, 30, .55, 2) }; o.mood = 'sad'; } } },
        { x: 0, y: 1330, s: 1.25, ...G6.LUCIA(), mood: 'happy', walk: { x0: 120, x1: 720, t0: .5, dur: 3.2 }, anim: (o, lt) => { if (lt > tN) { o.mood = 'smug'; o.facing = 1; } if (lt > tO) o.mood = 'worried'; } },
        { x: 1560, y: 1330, s: 1.25, ...G6.DREQUAN(), facing: -1, mood: 'happy', talk: [tD, tN], anim: (o, lt) => { o.pose = lt > tD - .3 && lt < tN ? 'wave' : lt > tN && lt < tO + 1 ? 'shrug' : 'stand'; if (lt > tN) o.mood = 'worried'; } },
        { x: 1860, y: 800, s: .62, ...G6.IKE(), facing: -1, mood: 'smug', anim: (o, lt) => { o.pose = lt > tL && lt < tSe ? 'present' : lt > tSe ? 'point' : 'stand'; } }];
      S.D.live = [(c, lt, u) => { neon(c, lt, 1280, 650, 420, '255,80,200'); TW.glow(c, 1280, 1000, 300, '255,120,220', .18);
          // balcony slab + glass rail on the club wall (Ike stands on it)
          c.save(); c.fillStyle = '#2a2034'; c.strokeStyle = INK; c.lineWidth = 4; c.fillRect(1660, 800, 420, 26); c.strokeRect(1660, 800, 420, 26); c.fillStyle = '#1a1424'; for (const bx of [1690, 2040]) { c.beginPath(); c.moveTo(bx, 826); c.lineTo(bx + 20, 826); c.lineTo(bx + 10, 880); c.closePath(); c.fill(); } c.restore();
          TW.glow(c, 1870, 700, 220, '255,230,170', .2);
          // JACK OF HEARTS sign in the neon box
          c.save(); c.globalAlpha = .85 + .15 * Math.sin(lt * 11); txt(c, 'JACK OF HEARTS', 1280, 662, 54, '#ffd0f0', 'center', 'Anton'); c.restore(); },
        (c, lt) => { // palm sway + passing car lights on the road
          for (let k = 0; k < 4; k++) { const x = (lt * 260 + k * 900) % 3200 - 300; TW.glow(c, x, 1120 + (k % 2) * 30, 90, k % 2 ? '255,80,80' : '255,240,200', .35); } }];
      S.D.front = [(c, lt) => { c.save(); c.strokeStyle = 'rgba(220,240,255,.55)'; c.fillStyle = 'rgba(160,200,255,.16)'; c.lineWidth = 3; c.fillRect(1660, 690, 420, 110); c.strokeRect(1660, 690, 420, 110); c.lineWidth = 6; c.strokeStyle = '#c8ccd4'; c.beginPath(); c.moveTo(1660, 690); c.lineTo(2080, 690); c.stroke(); c.restore(); },
        (c, lt) => ntag(c, "DRE'QUAN", 1560, 880, lt, tD - .1, 34, tO), (c, lt) => ntag(c, 'BOOBIE IKE', 1860, 560, lt, tI, 30),
        (c, lt) => say(c, 1300, 700, lt, tD + .2, tN, 'MY CLUB!', { px: 40, tail: [180, 120] }),
        (c, lt) => { if (lt < tF) return; for (let k = 0; k < 5; k++) { const a = pop(lt, tF + k * .15, .3); if (a <= 0) continue; const x = 1500 + k * 120, y = 470; c.save(); c.translate(x, y); c.scale(a, a); c.fillStyle = ['#f4a0c8', '#a0d8f4', '#f4e0a0', '#c8f4a0', '#e0c0f4'][k]; c.strokeStyle = INK; c.lineWidth = 3; c.fillRect(-36, -60, 72, 60); c.strokeRect(-36, -60, 72, 60); c.beginPath(); c.moveTo(-44, -60); c.lineTo(0, -96); c.lineTo(44, -60); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#ffe9a0'; c.fillRect(-20, -46, 14, 14); c.fillRect(6, -46, 14, 14); c.restore(); } },
        (c, lt) => { const u = K.seg(lt, tL, tL + 1.3); if (u <= 0 || u >= 1) return; const x = K.lerp(1830, 980, u), y = K.lerp(720, 1000, u) - Math.sin(u * Math.PI) * 160; c.save(); c.translate(x, y); c.rotate(u * 9); c.strokeStyle = GOLD; c.lineWidth = 8; c.beginPath(); c.arc(0, 0, 14, 0, 7); c.moveTo(14, 0); c.lineTo(50, 0); c.lineTo(50, 12); c.stroke(); c.restore(); }];
      S.D.over = [(c, lt) => card(c, 'CHAPTER 3: MONEY', lt, .2, { x: 400, y: 130, px: 58, rot: -2, until: tO }), (c, lt) => card(c, 'VICE CITY', lt, tV, { x: 1560, y: 120, px: 40, rot: 2, until: tI }),
        (c, lt) => { if (lt < tF - .2) TW.stamp(c, "HE DOESN'T", 520, 330, lt, tN, { px: 70 }); }, (c, lt) => card(c, 'FLATS ALL OVER THE CITY', lt, tF, { x: 520, y: 250, px: 40, rot: -2, until: tSe }),
        (c, lt) => card(c, 'RENT = SELL FOR HIM', lt, tSe - .2, { x: 1320, y: 150, px: 46, rot: 2, bg: G6.RED, color: '#fff' })];
      S.D.sfx = [[.3, 'footsteps', .3], [tD, 'pop', .25], [tN, 'stamp', .4], [tI - .3, 'whoosh_soft', .3], [tI, 'swell', .2], [tF, 'pop', .2], [tL, 'whoosh', .25], [tL + 1.3, 'coins', .25], [tSe, 'thud', .3]]; } },

  // 5.1 Cal's room: laptop DECRYPTING -> ERROR, sweat; 'who did you get this from?' | cut: antiques shop, the dealer lifts the statue to the lamp; IF IT'S REAL; he walks off with it; Lucia's calls ring out.
  { plate: 'bedroom', cam: { z: [1.55, 1.7], x: [1760, 1840], y: [940, 960] }, bed: [['hum_loop', .12], ['night_loop', .08]], light: { dir: 1, key: 'rgba(150,180,255,.22)' },
    init: S => { const tC = at(S, 'Cal'), tCr = at(S, 'crack'), tG = at(S, 'gives'), tM = at(S, 'Military-grade'), tW = at(S, 'who'), tA = at(S, 'antiques'), tB = at(S, 'bronze'), tX = at(S, 'extremely'), tR = at(S, 'real.'), tK = at(S, 'keeps'), tSt = at(S, 'stops');
      const FY = 1300, CS = 1.9, DX = 2200, prog = lt => lt < tG ? .62 * K.seg(lt, tC + .5, tG) : .62;
      S.D.figs = [{ x: 1960, y: FY, s: CS, ...G6.CAL(), pose: 'sit', facing: 1, mood: 'focus', anim: (o, lt) => { o.arms = () => ({ shR: 62 + 4 * Math.sin(lt * 14), elR: -40, shL: 50 - 4 * Math.sin(lt * 13), elL: -46, handR: 'open', handL: 'open' }); if (lt > tG) { o.mood = 'worried'; o.facing = lt > tW - .3 ? -1 : 1; if (lt > tW - .3) o.pose = 'sit', o.arms = () => ({ shR: 30, elR: -100, shL: 20, elL: -20, handR: 'open' }); } } },
        { x: 0, y: FY + 20, s: CS, ...G6.JASON(), mood: 'neutral', walk: { x0: 900, x1: 1440, t0: .3, dur: 2.4 }, anim: (o, lt) => { if (lt > tG) o.mood = 'worried'; if (lt > tW + .6) o.pose = 'shrug'; } }];
      S.D.live = [(c, lt) => { TW.glow(c, 1800, 360, 380, '120,160,255', .18); TW.chair(c, 1960, FY, FY - 63 * CS, 1, '#3a4a6a'); desk(c, DX + 40, FY, FY - 250, 330); }];
      S.D.front = [(c, lt) => { const p = prog(lt); G6.laptopProgress(c, DX + 40, FY - 250, 1.2, p, lt > tG ? 'ERROR' : 'DECRYPTING'); G6.drive(c, DX + 170, FY - 266, 1.1, lt); if (lt > tG) { TW.glow(c, DX + 40, FY - 340, 140, '255,60,60', .3 + .2 * Math.sin(lt * 10)); sweat(c, 1990, FY - 600, lt, 1.2); } },
        (c, lt) => ntag(c, 'CAL', 1975, FY - 640, lt, tC, 34, tA), (c, lt) => say(c, 1690, 820, lt, tW, tA, 'WHO DID YOU|GET THIS FROM?', { px: 36, tail: [250, -20] })];
      S.D.over = [(c, lt) => card(c, 'MILITARY-GRADE ENCRYPTION', lt, tM, { x: 560, y: 140, px: 44, rot: -2, until: tA, bg: G6.RED, color: '#fff' }),
        cut(tA - .2, { plate: 'antiques_shop', cam: { z: [1.55, 1.65], x: [1500, 1600], y: [880, 900] }, light: { dir: 1, key: 'rgba(255,200,120,.25)' },
          figs: [{ x: 1250, y: 1290, s: 1.9, ...G6.LUCIA(), facing: 1, mood: 'happy', anim: (o, lt) => { if (lt > tK) o.mood = 'worried'; if (lt > tSt) { o.pose = 'present'; o.hold = { near: cc => G6.phone(cc, 0, 20, 1.25, Math.floor(K.clamp((lt - tSt) / 2) * 9), { buzz: lt }) }; o.mood = 'angry'; } } },
            { x: 1720, y: 1290, s: 1.9, ...G6.DEALER(), facing: -1, mood: 'focus', anim: (o, lt) => { if (lt < tK + .3) { o.arms = () => ({ shR: 120, elR: -20, handR: 'open', shL: 0, elL: -10 }); o.hold = { near: cc => G6.statue(cc, 0, 6, 1.25, { glow: lt > tB ? 1 : .3 }) }; if (lt > tX) o.mood = 'smug'; }
              else { const u = K.seg(lt, tK + .3, tK + 3.2); o.x = K.lerp(1720, 2900, u); o.pose = u > 0 && u < 1 ? 'walk' : 'stand'; o.facing = 1; o.t = lt; o.pose === 'walk' && (o.walkPhase = lt * 5.4); o.hold = { far: cc => G6.statue(cc, 0, 6, 1.25) }; o.mood = 'smug'; } } }],
          live: [(c, lt) => { TW.glow(c, 2020, 780, 240, '255,200,110', .4 + .05 * Math.sin(lt * 3)); TW.glow(c, 660, 820, 200, '255,200,110', .3); }],
          front: [(c, lt) => ntag(c, 'ANTIQUES DEALER', 1720, 640, lt, tA + .2, 30, tR), (c, lt) => say(c, 1490, 700, lt, tB, tK, 'A BRONZE VENUS.|EXTREMELY VALUABLE...', { px: 32, tail: [200, 60] }), (c, lt) => { if (lt > tB) TW.sparkle(c, 1800, 690, lt * 2, .9, '255,220,150'); }] }),
        (c, lt) => TW.stamp(c, "IF IT'S REAL", 1460, 200, lt, tR, { px: 66, col: GOLD }), (c, lt) => card(c, 'NOT ANSWERING', lt, tSt + .4, { x: 520, y: 170, px: 42, rot: -3, bg: G6.RED, color: '#fff' })];
      S.D.sfx = [[tC, 'whoosh_soft', .2], [tCr, 'typing', .3], [tG, 'alarm', .15], [tM, 'stamp', .3], [tA - .2, 'whoosh', .3], [tB, 'chime', .3], [tR, 'stamp', .35], [tK + .4, 'footsteps', .25], [tK + 1.6, 'door_slam', .25], [tSt + .2, 'phone_ring', .3], [tSt + 1.4, 'phone_ring', .25]]; } },

  // 5.2 a cafe table: Brian (retired) slides a napkin: RAUL. Pan to Raul at the counter; TEST, DECOYS; his phone flashes a photo of Lucia breaking into a car.
  { plate: 'cafe_int', cam: { z: [1.45, 1.5], x: [1150, 1750], y: [930, 930] }, bed: [['office_loop', .08], ['city_loop', .06]], light: { dir: -1, key: 'rgba(255,240,210,.22)' },
    init: S => { const tB = at(S, 'Brian'), tRt = at(S, 'retired'), tRa = at(S, 'Raul.'), tBk = at(S, 'bank'), tT = at(S, 'tests'), tDc = at(S, 'decoys'), tSc = at(S, 'scores'), tP = at(S, 'photo'), tJ = at(S, 'just'), FY = 1360, CS = 1.9;

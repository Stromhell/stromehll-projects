<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/rig_v5.js"></script><script src="../../../../shared/rig_leo.js"></script><script>window.RIGSTYLE = "gumball";</script><script src="../../../../shared/kit.js"></script><script src="../../../../shared/anim.js"></script>
<script src="../../../../prime/production/tw_kit.js"></script><script src="../../../../prime/production/pr_kit.js"></script><script src="../../g6_kit.js"></script>

<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
const SW = 1920, SH = 1080, INK = TW.INK, RED = TW.RED, pop = TW.pop, fade = TW.fade;
const backdrop = (name, b = .5, blur = 8) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${b})`; const s2 = 1.06 * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 720 * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); c.restore(); K.screen(c); };
const CARRY = () => ({ shL: 30, elL: -75, shR: 35, elR: -75 });
const endTitle = (secs) => { const T = window.TIMING; const last = T.shots[T.shots.length - 1]; T.shots.push({ i: T.shots.length, start: last.end, end: last.end + secs, vo_start: last.end, vo_end: last.end, text: '' }); T.dur = last.end + secs; };
// G6 act 6 - Chapter 4: Vice City, Baby. Abe Gonzalez (WALK AWAY? #1), the kidnap job, Gallo traced, why the bag made them the fall guys,
// KG's gym + Nate 'Juicy', the airport cash swap, the runway (Nate), the moving plane, Raul's boat: Valentina sold them (TRUST board X), SHOOT?, a trap.
// Plates: boardroom, slaughterhouse_dusk, coastguard_base, chart, gym, airport_cargo, runway_dusk, keys_bay_day, boat_cabin.
for (const n of ['boardroom', 'slaughterhouse_dusk', 'coastguard_base', 'chart', 'gym', 'airport_cargo', 'runway_dusk', 'keys_bay_day', 'boat_cabin']) K.load(n, PL + n + '.jpg');
const rr = TW.rr, txt = TW.txt, GOLD = G6.GOLD;
// ---------- act helpers ----------
// word anchor with a proportional fallback (real timing replaces the estimate)
const at = (S, w) => { const ws = S.text.split(/\s+/), n = s => s.toLowerCase().replace(/[^a-z0-9']/g, ''), k = Math.max(0, ws.findIndex(x => n(x) === n(w.split(' ')[0]))); return A.at(S, w, (S.vo_start - S.start) + (S.vo_end - S.vo_start) * k / ws.length); };
// gold name tag (world space), pointer tip at x,y
const ntag = (c, name, x, y, lt, t0, px = 40, until = 999) => { const a = pop(lt, t0, .4), o = 1 - K.seg(lt, until - .3, until); if (a <= 0 || o <= 0) return; c.save(); c.globalAlpha = o; c.translate(x, y); c.scale(a, a); c.font = `${px}px Anton`;
  const w = c.measureText(name).width + px * .9, h = px * 1.45; c.fillStyle = 'rgba(0,0,0,.35)'; rr(c, -w / 2 + 6, -h - 12, w, h, 10); c.fill(); c.fillStyle = GOLD; c.strokeStyle = INK; c.lineWidth = 4; rr(c, -w / 2, -h - 18, w, h, 10); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(-14, -19); c.lineTo(0, 0); c.lineTo(14, -19); c.closePath(); c.fill(); c.stroke(); c.fillRect(-12, -24, 24, 7); txt(c, name, 0, -h / 2 - 16, px, INK, 'center', 'Anton'); c.restore(); };
// speech bubble that pops in at t0 and out at t1 (centre x,y; tail [dx,dy] to the speaker's mouth)
const say = (c, x, y, lt, t0, t1, text, o = {}) => { const a = pop(lt, t0, .35) * (1 - K.seg(lt, t1 - .3, t1)); if (a > 0.01) G6.bubble(c, x, y, a * (o.s || 1), text, o); };
const card = (c, s, lt, t0, o = {}) => K.card(c, s, lt, Object.assign({ at: t0 }, o));
// a cut inside a shot: from `t0` a second scene (own plate or bg fn, own camera, figures) wipes in over the shot (rect = inset panel)
const cut = (t0, o) => (c, lt, u, S) => { if (lt < t0) return; const R2 = o.rect || [0, 0, SW, SH], d = (o.t1 ?? (S.end - S.start)) - t0, u2 = K.clamp((lt - t0) / d), w = E.io(K.clamp((lt - t0) / .4));
  if (o.t1 != null && lt > o.t1) return; const S2 = o._S || (o._S = { D: { light: o.light || {} }, start: S.start, end: S.end });
  c.save(); c.beginPath(); c.rect(R2[0], R2[1], R2[2] * w, R2[3]); c.clip(); c.translate(R2[0], R2[1]); c.scale(R2[2] / SW, R2[3] / SH);
  const M = c.getTransform(); const m = K.camAt(o.cam || {}, u2); c.transform(m.sc, 0, 0, m.sc, m.tx, m.ty);
  if (o.plate) c.drawImage(K.imgs[o.plate], 0, 0, 2560, 1440); if (o.bg) o.bg(c, lt);
  for (const L of o.live || []) { c.save(); L(c, lt, u2, S2); c.restore(); }
  for (const f of (o.figs || []).slice().sort((a, b) => a.y - b.y)) { c.save(); A.figure(c, f, lt, u2, S2); c.restore(); }
  for (const L of o.front || []) { c.save(); L(c, lt, u2, S2); c.restore(); }
  c.setTransform(M); c.restore();
  c.save(); if (o.rect) { c.strokeStyle = '#f6efdc'; c.lineWidth = 10; c.strokeRect(R2[0], R2[1], R2[2] * w, R2[3]); c.strokeStyle = INK; c.lineWidth = 4; c.strokeRect(R2[0] - 5, R2[1] - 5, R2[2] * w + 10, R2[3] + 10); }
  else if (w < 1) { c.fillStyle = '#fff'; c.fillRect(SW * w - 6, 0, 12, SH); } c.restore(); };
const sweat = (c, x, y, lt, s = 1) => { for (let k = 0; k < 3; k++) { const p = (lt * .9 + k / 3) % 1; c.save(); c.globalAlpha = 1 - p; c.fillStyle = '#8ad0ff'; c.strokeStyle = INK; c.lineWidth = 2; c.beginPath(); const xx = x + (k - 1) * 26 * s, yy = y + p * 60 * s; c.moveTo(xx, yy - 12 * s); c.quadraticCurveTo(xx + 8 * s, yy, xx, yy + 6 * s); c.quadraticCurveTo(xx - 8 * s, yy, xx, yy - 12 * s); c.fill(); c.stroke(); c.restore(); } };
const neon = (c, lt, x, y, r, col) => TW.glow(c, x, y, r, col, .25 + .12 * Math.sin(lt * 9) * (Math.sin(lt * 23) > .7 ? 0 : 1));
const sparks = (c, x, y, lt, n = 14) => { for (let k = 0; k < n; k++) { const p = (lt * 2.2 + k * .37) % 1, a = k * 2.4; c.fillStyle = `rgba(255,${200 + (k % 3) * 20},120,${1 - p})`; c.fillRect(x + Math.cos(a) * p * 90, y + Math.sin(a) * p * 70 + p * p * 60, 6, 6); } TW.glow(c, x, y, 70, '255,220,150', .6 + .3 * Math.sin(lt * 30)); };
const cafeChair = (c, x, fy, seatY, facing) => { c.save(); c.strokeStyle = INK; c.lineWidth = 4; c.fillStyle = '#2f5a44'; const bx = x - facing * 62; rr(c, bx - 10, seatY - 170, 20, 175, 6); c.fill(); c.stroke(); rr(c, x - 70, seatY, 140, 22, 6); c.fill(); c.stroke();
  c.fillStyle = '#1e2a24'; for (const dx of [-60, 52]) { c.fillRect(x + dx, seatY + 20, 9, fy - seatY - 20); c.strokeRect(x + dx, seatY + 20, 9, fy - seatY - 20); } c.restore(); };
const table = (c, x, fy, topY, w = 300, col = '#f4efe4') => { c.save(); c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(x, fy, w * .45, 16, 0, 0, 7); c.fill(); c.fillStyle = '#3a3a40'; c.strokeStyle = INK; c.lineWidth = 4; c.fillRect(x - 10, topY, 20, fy - topY); c.strokeRect(x - 10, topY, 20, fy - topY); c.fillRect(x - 70, fy - 10, 140, 10);
  c.fillStyle = col; c.beginPath(); c.ellipse(x, topY, w / 2, 24, 0, 0, 7); c.fill(); c.stroke(); c.restore(); };
const desk = (c, x, fy, topY, w) => { c.save(); c.fillStyle = '#6a4a32'; c.strokeStyle = INK; c.lineWidth = 4; rr(c, x - w / 2, topY, w, 26, 4); c.fill(); c.stroke(); c.fillStyle = '#4a3222'; for (const dx of [-w / 2 + 14, w / 2 - 34]) { c.fillRect(x + dx, topY + 26, 20, fy - topY - 26); c.strokeRect(x + dx, topY + 26, 20, fy - topY - 26); } c.restore(); };
const MASK = (c, hx, hy) => G6.mask(c, hx + 12, hy + 4, 1.62);
const trolley = (c, x, fy, n, lt) => { c.save(); c.strokeStyle = INK; c.lineWidth = 5; c.fillStyle = '#9aa0a8'; c.fillRect(x - 170, fy - 70, 340, 16); c.strokeRect(x - 170, fy - 70, 340, 16); c.beginPath(); c.moveTo(x + 170, fy - 62); c.lineTo(x + 200, fy - 180); c.stroke();
  for (const dx of [-140, 140]) { c.fillStyle = '#1a1a1e'; c.beginPath(); c.arc(x + dx, fy - 18, 18, 0, 7); c.fill(); c.stroke(); } c.restore(); for (let k = 0; k < n; k++) G6.duffel(c, x - 90 + k * 100, fy - 70, .85, { cash: k % 2 === 0 }); };

const police = (c, lt, x, y, r, a = 1) => { const ph = Math.floor(lt * 4) % 2; TW.glow(c, x, y, r, ph ? '255,40,40' : '40,90,255', .45 * a); TW.glow(c, x + 200, y, r * .8, ph ? '40,90,255' : '255,40,40', .35 * a); };
const TRUST = ['VALENTINA', 'ABE', 'MATTIA', 'GALLO'];
// trust board in betrayal order; the X slams onto VALENTINA (row 0) as xs animates 0 -> 1 from t0
const trustVal = (c, x, y, s, lt, t0) => G6.trust(c, x, y, s, TRUST, K.clamp((lt - t0) / .6), lt);
const curls = (lt, sp = 3) => ({ shR: 20, elR: -60 - 60 * (.5 + .5 * Math.sin(lt * sp)), handR: 'fist', shL: 10, elL: -20 });
const bell = (c) => { c.fillStyle = '#3a3a44'; c.strokeStyle = INK; c.lineWidth = 2; c.fillRect(-4, 2, 8, 30); c.fillRect(-12, -2, 24, 10); c.strokeRect(-12, -2, 24, 10); c.fillRect(-12, 28, 24, 10); c.strokeRect(-12, 28, 24, 10); };

window.SHOTS = [
  // 6.0 Abe's glass office over the bay: ABE GONZALEZ; Jason sent out; 'give up your guy'; $500,000 for a TV story; WALK AWAY? #1 stamps.
  { plate: 'boardroom', cam: { z: [1.28, 1.4], x: [1260, 1300], y: [880, 900] }, bed: [['office_loop', .1], ['hum_loop', .06]], light: { dir: 1, key: 'rgba(200,220,255,.2)' },
    init: S => { const tA = at(S, 'Abe'), tN = at(S, 'Nothing'), tSe = at(S, 'sends'), tG = at(S, 'give'), tSc = at(S, 'scared'), tId = at(S, 'identity,'), tH = at(S, 'half'), tTV = at(S, 'TV.'), FY = 1390, CS = 1.8;
      S.D.figs = [{ x: 760, y: FY, s: CS, ...G6.ABE(), pose: 'sit', facing: 1, mood: 'smug', talk: [tN, 99], anim: (o, lt) => { if (lt > tN && lt < tSe) o.arms = () => ({ shR: 110, elR: -30, handR: 'open', shL: 100, elL: -30, handL: 'open' }); if (lt > tSe && lt < tSe + 1.5) o.pose = 'sit', o.arms = () => ({ shR: 92, elR: -4, handR: 'point' }); if (lt > tG) o.lean = 8; if (lt > tH) o.arms = () => ({ shR: 70, elR: -20, handR: 'open' }); } },
        { x: 1700, y: FY, s: CS, ...G6.LUCIA(), pose: 'sit', facing: -1, mood: 'neutral', anim: (o, lt) => { if (lt > tG) o.mood = 'shocked'; if (lt > tSc) o.mood = 'angry'; } },
        { x: 2150, y: FY, s: CS, ...G6.JASON(), facing: -1, mood: 'neutral', walk: { x0: 2150, x1: 2950, t0: tSe + .5, dur: 2.6 }, anim: (o, lt) => { if (lt > tSe) o.mood = 'worried'; } }];
      S.D.live = [(c, lt) => { for (let k = 0; k < 12; k++) TW.glow(c, 1500 + (k * 97) % 900, 300 + (k * 53) % 300, 40, '255,230,160', .15 + .15 * Math.sin(lt * 2 + k)); TW.chair(c, 760, FY, FY - 63 * CS, 1, '#e8dcc0'); TW.chair(c, 1700, FY, FY - 63 * CS, -1, '#2a2a34'); }];
      S.D.front = [(c, lt) => ntag(c, 'ABE GONZALEZ', 790, FY - 520, lt, tA, 38), (c, lt) => say(c, 1200, 640, lt, tN + .2, tSe, 'NOTHING HAPPENS IN|VICE CITY WITHOUT ME.', { px: 32, tail: [-280, 140] }),
        (c, lt) => say(c, 1220, 600, lt, tG, tH, 'GIVE UP YOUR GUY.|SAY HE SCARED YOU.', { px: 36, tail: [-300, 150] })];
      S.D.over = [(c, lt) => card(c, 'CHAPTER 4: VICE CITY, BABY', lt, .2, { x: 520, y: 120, px: 50, rot: -2, until: tSe }), (c, lt) => card(c, 'NO NEW IDENTITY NEEDED', lt, tId - .5, { x: 1400, y: 120, px: 36, rot: 2, until: tTV + 3 }),
        (c, lt) => { if (lt < tH) return; G6.counter(c, 1400, 250, .8, 0, 500000, tH, tH + 1.2, lt, { pre: '$' }); }, (c, lt) => card(c, 'FOR HER STORY ON TV', lt, tTV - .3, { x: 1400, y: 360, px: 34, rot: -2 }),
        (c, lt) => { const a = pop(lt, tTV - .4, .4); if (a > 0) G6.walkAway(c, 470, 300, .6 * a, 1, tTV + .2, lt); }];
      S.D.sfx = [[tA, 'pop', .25], [tN, 'swell', .15], [tSe + .5, 'footsteps', .25], [tSe + 2.6, 'door_slam', .3], [tG, 'tension', .25], [tH, 'coins', .3], [tTV - .4, 'whoosh', .25], [tTV + .2, 'stamp', .45]]; } },

  // 6.1 close on Lucia: NO. Straight away. -> cut to the dusk-to-dawn barn: protecting a TV boss's family; a child's trainer in the dirt; Abe's voice on the phone; Jason + Lucia walk the child out as dawn rises.
  { plate: 'slaughterhouse_dusk', cam: { z: [1.35, 1.45], x: [1500, 1620], y: [820, 840] }, bed: [['night_loop', .15], ['wind_loop', .08]], light: { dir: -1, key: 'rgba(255,190,140,.25)' },
    init: S => { const tNo = at(S, 'no.'), tSt = at(S, 'Straight'), tSo = at(S, 'So'), tP = at(S, 'protecting'), tK = at(S, 'kidnapped'), tH = at(S, 'How'), tB = at(S, 'Bring'), tF = at(S, 'forget'), FY = 1020, FS = 1.05, dur = S.end - S.start;
      const wk = { t0: tK + .4, dur: Math.max(5, dur - tK - 1) };
      S.D.figs = [{ x: 0, y: FY, s: FS, ...G6.JASON(), mood: 'focus', walk: { x0: 1320, x1: 1720, ...wk } }, { x: 0, y: FY + 6, s: FS * .95, ...PR.KID(3), mood: 'sad', walk: { x0: 1220, x1: 1610, ...wk }, anim: (o, lt) => { if (lt > tB) o.mood = 'happy'; } },
        { x: 0, y: FY + 10, s: FS, ...G6.LUCIA(), mood: 'focus', walk: { x0: 1080, x1: 1480, ...wk }, anim: (o, lt) => { if (lt > tF) o.mood = 'angry'; } }];
      S.D.live = [(c, lt, u) => { TW.glow(c, 1370, 720, 260, '255,200,120', .35 + .05 * Math.sin(lt * 7)); const d = K.seg(lt, tK, S.end - S.start); TW.glow(c, 2200, 360, 900, '255,200,150', .35 * d); c.fillStyle = `rgba(255,190,140,${.12 * d})`; c.fillRect(0, 0, 2560, 1440);
          // child's trainer in the dirt by the door
          c.save(); c.translate(1600, 1060); c.rotate(-.15); c.fillStyle = '#e8503a'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(-30, 0); c.quadraticCurveTo(-30, -24, 0, -22); c.lineTo(10, -10); c.quadraticCurveTo(34, -8, 34, 0); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#fff'; c.fillRect(-30, -2, 64, 6); c.restore(); if (lt > tK && lt < tK + 2) TW.glow(c, 1600, 1050, 80, '255,255,220', .5); }];
      S.D.over = [cut(0, { t1: tSo, plate: 'boardroom', cam: { z: [1.7, 1.75], x: [1600, 1620], y: [980, 980] }, light: { dir: 1, key: 'rgba(200,220,255,.2)' }, live: [(c) => TW.chair(c, 1700, 1390, 1390 - 63 * 1.8, -1, '#2a2a34')],
          figs: [{ x: 1700, y: 1390, s: 1.8, ...G6.LUCIA(), pose: 'sit', facing: -1, mood: 'angry', talk: [0, 99], anim: (o, lt) => { if (lt > tNo) o.arms = () => ({ shR: 100, elR: -20, handR: 'open', shL: 90, elL: -20, handL: 'open' }); } }],
          front: [(c, lt) => say(c, 1380, 720, lt, tNo - .1, 99, 'NO.' + (lt > tSt ? '|STRAIGHT AWAY.' : ''), { px: 56, tail: [220, 140] })] }),
        (c, lt) => card(c, "PROTECT A TV BOSS'S FAMILY", lt, tP, { x: 560, y: 130, px: 40, rot: -2, until: tH }), (c, lt) => card(c, 'FIND A KIDNAPPED CHILD', lt, tK, { x: 600, y: 230, px: 40, rot: 2, until: tH - .1 }),
        (c, lt) => { const a = pop(lt, tH - .2, .4); if (a <= 0) return; G6.phone(c, 240, 330, 2.4 * a, 0, { buzz: lt }); txt(c, 'ABE', 240, 250, 28 * a, '#fff', 'center', 'Anton'); G6.bubble(c, 640, 300, .8 * a, 'HOW MANY KIDS HAVE|YOU LOST SO FAR?', { px: 38, tail: [-300, 40] }); },
        (c, lt) => card(c, '"BRING THIS ONE BACK,\nOR FORGET YOURS."', lt, tB, { x: 1460, y: 170, px: 44, rot: 2, bg: GOLD })];
      S.D.sfx = [[tNo, 'pop', .3], [tSo - .1, 'whoosh', .3], [tP, 'pop', .2], [tK, 'tension', .3], [tH - .2, 'phone_ring', .3], [tK + .6, 'footsteps', .25], [tB, 'swell', .25], [tF, 'thud', .3]]; } },

  // 6.2 the port at night: Raul's tech guy's trace -> GIORGIO GALLO (portrait), Mattia's boss; his cargo ships with SEIZED banners; callback card TONNES, ON CARGO SHIPS.
  { plate: 'coastguard_base', cam: { z: [1.55, 1.3], x: [1000, 1280], y: [820, 800] }, bed: [['ocean_loop', .15], ['wind_loop', .08]], light: { dir: -1, key: 'rgba(200,220,255,.2)' },
    init: S => { const tT = at(S, 'traces'), tGG = at(S, 'Giorgio'), tM = at(S, "Mattia's"), tSh = at(S, 'shipping'), tDr = at(S, 'drugs,'), tSz = at(S, 'seized'), tR = at(S, 'Remember'), tTo = at(S, 'Tonnes,'), tTh = at(S, 'This'), FY = 1330;
      const ship = (c, x, y, L, lt, k) => { c.save(); c.translate(x, y); c.fillStyle = '#2a3242'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.moveTo(-L / 2, -70); c.lineTo(L / 2 + 30, -70); c.lineTo(L / 2, 0); c.lineTo(-L / 2 + 20, 0); c.closePath(); c.fill(); c.stroke();
        for (let j = 0; j < 7; j++) { c.fillStyle = ['#c84a3a', '#3a7ac8', '#d8a03a', '#3a9a5a'][(j + k) % 4]; c.fillRect(-L / 2 + 50 + j * (L - 170) / 7, -120, (L - 190) / 7, 50); c.strokeRect(-L / 2 + 50 + j * (L - 170) / 7, -120, (L - 190) / 7, 50); }
        c.fillStyle = '#e8e4dc'; c.fillRect(L / 2 - 110, -180, 70, 110); c.strokeRect(L / 2 - 110, -180, 70, 110); c.restore(); TW.glow(c, x + L / 2 - 75, y - 150, 50, '255,230,150', .4);
        const b = pop(lt, tSz + k * .3, .4); if (b > 0) { c.save(); c.translate(x - 40, y - 150); c.scale(b, b); c.rotate(Math.sin(lt * 3 + k) * .05); c.fillStyle = '#f6efdc'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(-130, -26); c.quadraticCurveTo(0, -26 + Math.sin(lt * 5 + k) * 8, 130, -26); c.lineTo(130, 26); c.quadraticCurveTo(0, 26 + Math.sin(lt * 5 + k) * 8, -130, 26); c.closePath(); c.fill(); c.stroke(); txt(c, 'SEIZED', 0, 2, 40, G6.RED, 'center', 'Anton'); c.restore(); } };
      S.D.figs = [{ x: 900, y: FY, s: 1.55, ...G6.JASON(), facing: -1, mood: 'focus', anim: (o, lt) => { if (lt > tTo) o.mood = 'shocked'; } }, { x: 1150, y: FY, s: 1.55, ...G6.LUCIA(), facing: -1, mood: 'focus', anim: (o, lt) => { if (lt > tSz) o.pose = 'point'; } }];
      S.D.live = [(c, lt) => { ship(c, 430, 800, 600, lt, 0); ship(c, 2350, 790, 520, lt, 1); for (let k = 0; k < 18; k++) { const x = (k * 151 + lt * 12) % 2560, y = 820 + (k * 37) % 120; c.fillStyle = `rgba(220,235,255,${.2 + .2 * Math.sin(lt * 2 + k)})`; c.fillRect(x, y, 24, 3); } police(c, lt, 1180, 760, 160, .7); }];

<body><canvas id="c" width="1920" height="1080"></canvas>

<script src="../../../../prime/production/tw_kit.js"></script><script src="../../../../prime/production/pr_kit.js"></script><script src="../../g6_kit.js"></script>

<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
const SW = 1920, SH = 1080, INK = TW.INK, RED = TW.RED, pop = TW.pop, fade = TW.fade;
const backdrop = (name, b = .5, blur = 8) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${b})`; const s2 = 1.06 * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 720 * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); c.restore(); K.screen(c); };
const CARRY = () => ({ shL: 30, elL: -75, shR: 35, elR: -75 });
const endTitle = (secs) => { const T = window.TIMING; const last = T.shots[T.shots.length - 1]; T.shots.push({ i: T.shots.length, start: last.end, end: last.end + secs, vo_start: last.end, vo_end: last.end, text: '' }); T.dur = last.end + secs; };
// G6 act 2 - Chapter 1, Just Like Paradise: early release to J. Duval's address, Jason in the Keys, Brian/Cal/Donny, the King Fishers,
// the broker ("they move tonnes on cargo ships"), "it's taken care of", the jetty talk, the prison phone call, the tag and the half-mile circle.
// Plates: interview_room, keys_bay_day (also graded to night with a drawn jetty), stilt_porch, beach_bar, diner_ext, prison_corridor, leonida_map.
for (const n of ['interview_room', 'keys_bay_day', 'stilt_porch', 'beach_bar', 'diner_ext', 'prison_corridor', 'leonida_map']) K.load(n, PL + n + '.jpg');
const rr = TW.rr, txt = TW.txt, GOLD = G6.GOLD;
// ---- act helpers
const ntag = (c, name, x, y, lt, at, opts = {}) => { const a = pop(lt, at, .4), o = 1 - K.seg(lt, (opts.until ?? 999) - .3, opts.until ?? 999); if (a <= 0 || o <= 0) return; const px = opts.px ?? 40; c.save(); c.globalAlpha = o; c.translate(x, y); c.scale(a, a); c.font = `${px}px Anton`;
  const w = c.measureText(name).width + px * .9, h = px * 1.45; c.fillStyle = 'rgba(0,0,0,.35)'; rr(c, -w / 2 + 6, -h - 12, w, h, 10); c.fill(); c.fillStyle = opts.col || GOLD; c.strokeStyle = INK; c.lineWidth = 4; rr(c, -w / 2, -h - 18, w, h, 10); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(-14, -19); c.lineTo(0, 0); c.lineTo(14, -19); c.closePath(); c.fill(); c.stroke(); c.fillRect(-12, -24, 24, 7); txt(c, name, 0, -h / 2 - 16, px, INK, 'center', 'Anton'); c.restore(); };
const flash = (t0) => (c, lt) => { if (lt < t0) return; const u = 1 - K.seg(lt, t0, t0 + .35); if (u > 0) { c.fillStyle = `rgba(255,255,255,${.85 * u})`; c.fillRect(0, 0, SW, SH); } };
const paper = (cc) => { cc.save(); cc.rotate(-.15); cc.fillStyle = '#f6f2e6'; cc.strokeStyle = INK; cc.lineWidth = 2.5; cc.fillRect(-22, 2, 44, 58); cc.strokeRect(-22, 2, 44, 58); cc.strokeStyle = 'rgba(40,40,60,.5)'; cc.lineWidth = 1.5; for (let k = 0; k < 5; k++) { cc.beginPath(); cc.moveTo(-15, 12 + k * 9); cc.lineTo(15, 12 + k * 9); cc.stroke(); } cc.restore(); };
const HANDSET = { near: cc => { cc.fillStyle = '#1e1e24'; cc.strokeStyle = INK; cc.lineWidth = 2; rr(cc, -9, -6, 18, 62, 8); cc.fill(); cc.stroke(); } };
const EAR = () => ({ shR: -20, elR: -150, handR: 'fist', shL: 15, elL: -30 });
// sea glints over a band
const glints = (x, y, w, h, n = 30, col = '255,255,255') => (c, lt) => { for (let k = 0; k < n; k++) { const px = x + (k * 157) % w, py = y + (k * 61) % h, a = .2 + .4 * Math.max(0, Math.sin(lt * 2.2 + k)); c.fillStyle = `rgba(${col},${a})`; c.fillRect(px, py, 24, 3); } };
// night grade over the whole plate (world space)
const night = (a = .62) => (c) => { c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = `rgba(30,45,110,${a})`; c.fillRect(0, 0, 2560, 1440); c.restore(); TW.glow(c, 1900, 200, 260, '220,230,255', .35); c.fillStyle = '#eef0fa'; c.beginPath(); c.arc(1900, 200, 40, 0, 7); c.fill(); };
// wooden jetty across the bottom of the bay plate, top deck at y
const jetty = (y) => (c, lt) => { c.save(); c.fillStyle = '#3a2a1e'; for (let x = 60; x < 2560; x += 300) c.fillRect(x, y, 34, 1440 - y); c.fillStyle = '#6a4a30'; c.fillRect(0, y - 30, 2560, 46); c.strokeStyle = 'rgba(20,12,8,.7)'; c.lineWidth = 3; for (let x = 0; x < 2560; x += 90) { c.beginPath(); c.moveTo(x, y - 30); c.lineTo(x, y + 16); c.stroke(); }
  c.fillStyle = 'rgba(255,230,180,.12)'; c.fillRect(0, y - 30, 2560, 6); c.restore(); };
const crate = (c, x, y, w, h) => { G6.shadow(c, x, y, w * .7, .4); c.save(); c.fillStyle = '#8a6a44'; c.strokeStyle = INK; c.lineWidth = 4; c.fillRect(x - w / 2, y - h, w, h); c.strokeRect(x - w / 2, y - h, w, h); c.beginPath(); c.moveTo(x - w / 2, y - h); c.lineTo(x + w / 2, y); c.stroke(); c.restore(); };
const seaplane = (c, x, y, s, t, dir = 1) => { c.save(); c.translate(x, y); c.scale(s * dir, s); c.strokeStyle = INK; c.lineWidth = 3; c.fillStyle = '#f2f2f4'; c.beginPath(); c.ellipse(0, 0, 90, 20, 0, 0, 7); c.fill(); c.stroke(); c.fillStyle = '#d8382e'; c.fillRect(-90, -4, 180, 6);
  c.fillStyle = '#e8e8ec'; c.fillRect(-30, -30, 80, 10); c.strokeRect(-30, -30, 80, 10); c.beginPath(); c.moveTo(-90, -4); c.lineTo(-110, -40); c.lineTo(-92, -40); c.lineTo(-70, -8); c.fill(); c.stroke(); c.fillStyle = '#7ab8e0'; c.fillRect(30, -12, 26, 10);
  c.strokeStyle = '#2a2a30'; c.beginPath(); c.moveTo(-20, 18); c.lineTo(-24, 40); c.moveTo(30, 18); c.lineTo(34, 40); c.stroke(); c.fillStyle = '#d8382e'; c.strokeStyle = INK; c.beginPath(); c.ellipse(0, 44, 70, 8, 0, 0, 7); c.fill(); c.stroke();
  c.fillStyle = 'rgba(60,60,70,.6)'; c.beginPath(); c.ellipse(92, 0, 4, 26 * Math.abs(Math.sin(t * 40)) + 4, 0, 0, 7); c.fill(); c.restore(); };
// container ship silhouette (side), bottom centre at the waterline; s=1: 600 long
const cargoShip = (c, x, y, s, col = '#c84a3a') => { c.save(); c.translate(x, y); c.scale(s, s); c.strokeStyle = INK; c.lineWidth = 4; c.fillStyle = '#2a3a5a'; c.beginPath(); c.moveTo(-300, -60); c.lineTo(300, -60); c.lineTo(270, 0); c.lineTo(-280, 0); c.closePath(); c.fill(); c.stroke();
  const cols = [col, '#3a8ac8', '#e8b43a', '#4aa86a']; for (let r = 0; r < 2; r++) for (let k = 0; k < 8; k++) { c.fillStyle = cols[(k + r) % 4]; c.fillRect(-250 + k * 56, -110 - r * 46, 52, 44); c.strokeRect(-250 + k * 56, -110 - r * 46, 52, 44); }
  c.fillStyle = '#f2f2f4'; c.fillRect(-290, -170, 50, 110); c.strokeRect(-290, -170, 50, 110); c.restore(); };
const CAST_BROKER = () => G6.look('banker', { skin: '#c89070', hair: 'bald', hairCol: '#2a1e16', streak: '#3a2a20', top: 'shirt', topCol: '#e8a04a', legs: '#e8dcc0', cuff: '#d8ccb0', shoes: '#7a4a2a', sole: '#3a2416', seed: 700 }, { chain: true }, { openCollar: true, shades: 'aviator', tash: '#2a1e16' });
const LUCIA_BUMP = () => { const L = G6.LUCIA(); L.look = Object.assign({}, L.look, { g6: Object.assign({}, L.look.g6 || {}, { belly: true }) }); return L; };
// figure that keeps its pose but walks off along a line from tW (anim helper)
const walkOff = (o, lt, x0, x1, tW, dur) => { if (lt < tW) return; const w = RIG.walkX(lt, x0, x1, tW, dur, o.s); if (!w) return; o.x = w.x; o.t = w.phase; o.walkPhase = w.phase; o.pose = lt < tW + dur ? 'walk' : 'stand'; o.facing = Math.sign(x1 - x0); o.arms = null; };

window.SHOTS = [
  // 2.00 interview room: the counsellor offers early release with a tag; the address line reads J. DUVAL; a red RECORD stamp
  { plate: 'interview_room', cam: { z: [1.3, 1.4], x: [1260, 1300], y: [1000, 1020] }, bed: [['hum_loop', .15]], light: { dir: 1, key: 'rgba(230,240,255,.2)' },
    init: S => { const tOv = A.at(S, 'overcrowded', 1.2), tCo = A.at(S, 'counsellor', 2.4), tEa = A.at(S, 'early', 3.6), tTag = A.at(S, 'tag.', 5.6), tAd = A.at(S, 'address.', 7.6), tJD = A.at(S, 'Duval', 9.6), tRec = A.at(S, 'record', 11.2);
      S.D.figs = [{ x: 700, y: 1345, s: 1.8, ...G6.COUNSELLOR(), facing: 1, mood: 'neutral', seed: 41, anim: (o, lt) => { o.talk = lt > tCo && lt < tJD + 2; if (lt > tEa) { o.pose = 'present'; o.hold = { near: paper }; o.mood = 'happy'; } if (lt > tRec) o.mood = 'worried'; } },
        { x: 1880, y: 1345, s: 1.8, ...G6.LUCIA_PRISON(), facing: -1, mood: 'sad', seed: 14, anim: (o, lt) => { o.lean = Math.sin(lt * 1.1) * 1.5; if (lt > tEa) o.mood = 'shocked'; if (lt > tTag + .5) o.mood = 'happy'; if (lt > tRec) o.mood = 'worried'; } }];
      S.D.live = [(c, lt) => { TW.glow(c, 1280, 600, 420, '240,245,255', .22 + .03 * Math.sin(lt * 30)); }];
      S.D.over = [(c, lt) => K.card(c, 'PRISON: OVERCROWDED', lt, { at: tOv - .2, until: tEa + .5, x: 960, y: 110, px: 48, rot: -2 }),
        (c, lt) => { const a = pop(lt, tEa - .2, .45); if (a <= 0) return; c.save(); c.translate(960, 250); c.scale(a, a); c.rotate(-.02); c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(-252, -142, 520, 300); c.fillStyle = '#f6f2e6'; c.strokeStyle = INK; c.lineWidth = 5; c.fillRect(-260, -150, 520, 300); c.strokeRect(-260, -150, 520, 300);
          txt(c, 'EARLY RELEASE', -100, -112, 40, INK, 'center', 'Anton'); txt(c, 'CONDITION: ELECTRONIC TAG', -100, -62, 24, '#3a3a4a', 'center', 'Oswald'); txt(c, 'ADDRESS: J. DUVAL', -100, -10, 32, INK, 'center', 'Anton');
          if (lt > tTag) { c.save(); c.translate(-100, 70); c.scale(pop(lt, tTag, .35), pop(lt, tTag, .35)); G6.ankleTag(c, 0, 0, 1.3, lt); c.restore(); }
          const pc = K.seg(lt, tAd, tAd + .8); if (pc > 0) { c.strokeStyle = G6.RED; c.lineWidth = 5; c.beginPath(); c.ellipse(-100, -10, 170, 36, -.04, 0, Math.PI * 2 * pc); c.stroke(); }
          c.fillStyle = '#d8dce4'; c.fillRect(110, -120, 130, 160); c.strokeRect(110, -120, 130, 160); c.fillStyle = '#8a8e96'; c.beginPath(); c.arc(175, -55, 34, 0, 7); c.fill(); c.fillRect(135, -20, 80, 60); txt(c, 'JASON DUVAL', 175, 70, 24, INK, 'center', 'Anton');
          c.restore(); if (lt > tRec) TW.stamp(c, 'RECORD', 1120, 330, lt, tRec, { px: 64 }); },
        (c, lt) => K.card(c, 'THE FATHER: JASON DUVAL', lt, { at: tJD - .2, x: 960, y: 470, px: 38, rot: 2, bg: GOLD })];
      S.D.sfx = [[tOv, 'office_loop', .1], [tCo, 'pop', .2], [tEa, 'paper', .35], [tTag, 'tick', .3], [tAd, 'scrape', .25], [tJD, 'chime', .2], [tRec, 'stamp', .45]]; } },
  // 2.01 the Leonida Keys: turquoise sea, Jason sitting on a small boat surrounded by packages; a seaplane drones over; camera pulls out
  { plate: 'keys_bay_day', cam: { z: [1.65, 1.15], x: [1000, 1280], y: [800, 820] }, bed: [['ocean_loop', .25], ['birds_loop', .08]], light: { dir: 1, key: 'rgba(255,240,200,.25)' },
    init: S => { const tJ = A.at(S, 'Jason', .3), tLK = A.at(S, 'Leonida', 1.8), tFl = A.at(S, 'Florida', 4.2), tBo = A.at(S, 'boat', 6.2), tSea = A.at(S, 'sea', 7.6), tPk = A.at(S, 'packages', 8.8);
      const W = 1160, BS = 4, bob = lt => Math.sin(lt * 2.2) * 4 * BS, DECK = W - 44 * BS;
      S.D.figs = [{ x: 760, y: DECK, s: 1.8, ...G6.JASON(), pose: 'sit', facing: 1, mood: 'neutral', seed: 11, anim: (o, lt) => { o.y = DECK + bob(lt); if (lt > tPk) { o.mood = 'smug'; o.arms = () => ({ shR: 30, elR: -100, shL: 30, elL: -100 }); } } }];
      S.D.live = [glints(0, 900, 2560, 500, 60), (c, lt) => { const sx = -600 + (lt - tSea + 3) * 380; seaplane(c, sx, 260 + Math.sin(lt) * 10, 2.2, lt, 1); G6.boat(c, 1280, W, BS, lt, { col: '#2a8a9a' }); c.save(); c.translate(0, bob(lt));
          crate(c, 760, DECK, 150, 63 * 1.8); G6.packages(c, 1060, DECK, 2.2, 6); G6.packages(c, 1180, DECK, 2.2, 4); G6.packages(c, 560, DECK, 1.8, 3); c.restore(); }];
      S.D.over = [(c, lt) => K.card(c, 'MEANWHILE…', lt, { at: tJ - .2, until: tLK, x: 960, y: 110, px: 48, rot: -2 }), (c, lt) => K.card(c, 'LEONIDA KEYS', lt, { at: tLK, x: 960, y: 110, px: 64, rot: 2, bg: G6.TEAL, color: '#fff' }),
        (c, lt) => K.card(c, '= THE GAME\'S FLORIDA KEYS', lt, { at: tFl, x: 1300, y: 230, px: 34, rot: -3 }), (c, lt) => K.card(c, 'PACKAGES OF DRUGS', lt, { at: tPk, x: 1150, y: 420, px: 40, rot: 3, bg: GOLD })];
      S.D.sfx = [[tJ, 'whoosh_soft', .3], [tLK, 'chime', .25], [tSea - 3, 'drone', .3], [tBo, 'creak', .25], [tPk, 'thud', .25]]; } },
  // 2.02 Brian's stilt-house porch: Jason lives here rent-free; name tags BRIAN, CAL, DONNY slide in one by one
  { plate: 'stilt_porch', cam: { z: [1.28, 1.36], x: [1380, 1460], y: [980, 1000] }, bed: [['ocean_loop', .15], ['birds_loop', .1]], light: { dir: -1, key: 'rgba(255,200,140,.25)' },
    init: S => { const tBr = A.at(S, 'Brian,', .9), tOld = A.at(S, 'old-school', 1.6), tRent = A.at(S, 'rent-free.', 4.4), tCal = A.at(S, 'Cal,', 5.6), tCon = A.at(S, 'conspiracy', 7.6), tDo = A.at(S, 'Donny,', 9.4), tSp = A.at(S, 'seaplane.', 10.6);
      S.D.figs = [{ x: 640, y: 1365, s: 1.85, ...G6.JASON(), facing: 1, mood: 'neutral', seed: 11, anim: (o, lt) => { o.arms = () => ({ shR: 15, elR: -95, shL: 15, elL: -95 }); if (lt > tRent) o.mood = 'smug'; } },
        { x: 1080, y: 1365, s: 1.75, ...G6.CAL(), facing: 1, mood: 'focus', seed: 51, anim: (o, lt) => { if (lt > tCal) { o.mood = 'worried'; o.talk = lt < tDo; o.pose = 'point'; } if (lt > tDo) o.pose = 'stand'; } },
        { x: 1600, y: 1365, s: 1.9, ...G6.BRIAN(), facing: -1, mood: 'happy', seed: 52, anim: (o, lt) => { if (lt > tBr && lt < tBr + 2) o.pose = 'wave'; if (lt > tRent - .3 && lt < tCal) { o.pose = 'present'; } } },
        { x: 2150, y: 1365, s: 1.85, ...G6.DONNY(), facing: -1, mood: 'neutral', seed: 53, anim: (o, lt) => { if (lt > tDo) { o.mood = 'happy'; o.pose = lt < tSp + .4 ? 'wave' : 'point'; } } }];
      S.D.live = [glints(300, 820, 1350, 200, 30, '255,220,160'), (c, lt) => { TW.glow(c, 1230, 780, 260, '255,190,110', .3 + .03 * Math.sin(lt)); if (lt > tSp - 1.5) seaplane(c, 300 + (lt - tSp + 1.5) * 260, 560, 1.1, lt, 1); }];
      S.D.front = [(c, lt) => ntag(c, 'BRIAN', 1600, 760, lt, tBr), (c, lt) => ntag(c, 'CAL', 1080, 800, lt, tCal), (c, lt) => ntag(c, 'DONNY', 2150, 775, lt, tDo)];
      S.D.over = [(c, lt) => K.card(c, 'OLD-SCHOOL SMUGGLER', lt, { at: tOld, until: tCal, x: 1380, y: 120, px: 40, rot: 2 }), (c, lt) => K.card(c, 'RENT: £0', lt, { at: tRent - .2, until: tCal + 1, x: 420, y: 170, px: 44, rot: -3, bg: GOLD }),
        (c, lt) => { const a = pop(lt, tCon - .3, .35) * (1 - K.seg(lt, tDo - .2, tDo + .1)); if (a > 0) G6.bubble(c, 760, 160, .85 * a, "IT'S ALL|CONNECTED!", { px: 40, thought: true }); },
        (c, lt) => K.card(c, 'FLIES THE SEAPLANE', lt, { at: tSp - .3, x: 1460, y: 130, px: 40, rot: -2, bg: G6.TEAL, color: '#fff' })];
      S.D.sfx = [[tBr, 'pop', .25], [tRent, 'coins', .2], [tCal, 'pop', .25], [tCon, 'tension', .2], [tDo, 'pop', .25], [tSp - 1.5, 'drone', .3]]; } },
  // 2.03 the jetty at night: Donny skims a brick, the King Fishers grab him, Jason gets him out and takes their cash
  { plate: 'keys_bay_day', cam: { z: [1.3, 1.36], x: [1320, 1400], y: [1000, 1010] }, bed: [['ocean_loop', .18], ['night_loop', .15]], light: { dir: 1, key: 'rgba(170,190,255,.2)' },
    init: S => { const tSk = A.at(S, 'skims', 1.0), tKF = A.at(S, 'King', 4.2), tGr = A.at(S, 'grab', 5.6), tJ = A.at(S, 'Jason', 6.4), tOut = A.at(S, 'out,', 7.4), tCash = A.at(S, 'cash', 9.4), tDr = A.at(S, 'drugs', 12.4), tMo = A.at(S, 'money.', 14.0);
      const FL = 1330, tLv = tDr - .3, BRICK = { near: cc => G6.packages(cc, 0, 34, .9, 1) };
      S.D.figs = [{ x: 1500, y: FL, s: 1.85, ...G6.DONNY(), facing: 1, mood: 'smug', seed: 53, anim: (o, lt) => { if (lt > tSk) o.hold = BRICK; if (lt > tGr) { o.mood = 'shocked'; o.arms = () => ({ shR: 160, elR: -20, shL: 160, elL: -20, handR: 'open', handL: 'open' }); } if (lt > tOut) { o.arms = null; o.mood = 'worried'; } walkOff(o, lt, 1500, -500, tLv + .3, 4); } },
        { x: 0, y: FL, s: 1.85, ...G6.JASON(), facing: 1, mood: 'angry', seed: 11, walk: { x0: -300, x1: 1150, t0: tJ - 1.2, dur: 2.2 }, anim: (o, lt) => { if (lt > tCash) o.hold = { far: cc => G6.duffel(cc, 0, 92, 1, { cash: true }) }; walkOff(o, lt, 1150, -700, tLv, 4); } },
        { x: 0, y: FL, s: 1.85, ...G6.GUNMAN(0), facing: -1, mood: 'angry', seed: 61, walk: { x0: 2900, x1: 1770, t0: tKF - .4, dur: 2.2 }, anim: (o, lt) => { if (lt > tGr + .4 && lt < tOut) o.pose = 'point'; if (lt > tLv) { o.mood = 'shocked'; o.pose = 'point'; } } },
        { x: 0, y: FL, s: 1.9, ...G6.GUNMAN(1), facing: -1, mood: 'angry', seed: 62, walk: { x0: 3150, x1: 2050, t0: tKF - .2, dur: 2.2 }, anim: (o, lt) => { if (lt > tLv) { o.mood = 'angry'; o.arms = () => ({ shR: 172, elR: 0, handR: 'fist' }); } } }];
      S.D.live = [night(), glints(0, 900, 2560, 330, 40, '200,210,255'), jetty(FL), (c, lt) => { G6.packages(c, 1610, FL, 1.8, 6); if (lt < tCash) G6.duffel(c, 1290, FL, 1.4, { cash: true }); TW.glow(c, 1700, 700, 320, '255,200,130', .25); c.fillStyle = '#3a2a1e'; c.fillRect(1690, 700, 14, FL - 700); TW.glow(c, 1697, 700, 60, '255,220,150', .7); }];

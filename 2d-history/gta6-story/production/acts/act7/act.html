<script src="../../../../shared/rig_v5.js"></script><script src="../../../../shared/rig_leo.js"></script><script>window.RIGSTYLE = "gumball";</script><script src="../../../../shared/kit.js"></script><script src="../../../../shared/anim.js"></script>
<script src="../../../../prime/production/tw_kit.js"></script><script src="../../../../prime/production/pr_kit.js"></script><script src="../../g6_kit.js"></script>

<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
const SW = 1920, SH = 1080, INK = TW.INK, RED = TW.RED, pop = TW.pop, fade = TW.fade;
const backdrop = (name, b = .5, blur = 8) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${b})`; const s2 = 1.06 * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 720 * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); c.restore(); K.screen(c); };
const CARRY = () => ({ shL: 30, elL: -75, shR: 35, elR: -75 });
const endTitle = (secs) => { const T = window.TIMING; const last = T.shots[T.shots.length - 1]; T.shots.push({ i: T.shots.length, start: last.end, end: last.end + secs, vo_start: last.end, vo_end: last.end, text: '' }); T.dur = last.end + secs; };
// G6 act 7 - Chapter 4 ends / Chapter 5: everything frozen, Gallo at the rooftop bar, the penthouse, 20 tonnes, Chapter 5 card, Niko Bellic, the double heist.
// Plates: bedroom (motel room), rooftop_bar, hotel_balcony (penthouse terrace), boardroom (penthouse), coastguard_base, office (Gallo's office).
for (const n of ['bedroom', 'rooftop_bar', 'hotel_balcony', 'boardroom', 'coastguard_base', 'office']) K.load(n, PL + n + '.jpg');
// ================= act helpers =================
const rr = TW.rr, txt = TW.txt, glow = TW.glow;
const NAMES = ['VALENTINA', 'ABE', 'MATTIA', 'GALLO']; // betrayal order: X's stamp in this order
// name tag (world space): gold tile with a pointer, x,y = pointer tip
const ntag = (c, name, x, y, lt, at, opts = {}) => { const a = pop(lt, at, .4), o = 1 - K.seg(lt, (opts.until ?? 999) - .3, opts.until ?? 999); if (a <= 0 || o <= 0) return; const px = opts.px ?? 40; c.save(); c.globalAlpha = o; c.translate(x, y); c.scale(a, a); c.font = `${px}px Anton`;
  const w = c.measureText(name).width + px * .9, h = px * 1.45; c.fillStyle = 'rgba(0,0,0,.35)'; rr(c, -w / 2 + 6, -h - 12, w, h, 10); c.fill(); c.fillStyle = opts.col || G6.GOLD; c.strokeStyle = INK; c.lineWidth = 4; rr(c, -w / 2, -h - 18, w, h, 10); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(-14, -19); c.lineTo(0, 0); c.lineTo(14, -19); c.closePath(); c.fill(); c.stroke(); c.fillRect(-12, -24, 24, 7); txt(c, name, 0, -h / 2 - 16, px, INK, 'center', 'Anton'); c.restore(); };
// small TRUST board, top right (screen). xs number or fn(lt); hi = row index to ring
const trustOv = (xs, from = 0, hi = -1, hiAt = 0) => (c, lt) => { if (lt < from) return; c.save(); c.globalAlpha = K.seg(lt, from, from + .4); const v = typeof xs === 'function' ? xs(lt) : xs; G6.trust(c, 1790, 150, .36, NAMES, v, lt);
  if (hi >= 0 && lt > hiAt) { const y = 150 + (-62 + 70 * hi) * .36, p = .6 + .4 * Math.sin(lt * 7); c.strokeStyle = `rgba(255,70,60,${p})`; c.lineWidth = 4; rr(c, 1790 - 64, y - 14, 128, 26, 6); c.stroke(); glow(c, 1790, y, 90, '255,60,50', .35 * p); } c.restore(); };
// draw a rig figure inside a layer, only between t0 and t1 (for cuts inside a shot)
const figL = (f, t0 = -99, t1 = 999) => (c, lt, u, S) => { if (lt >= t0 && lt < t1) A.figure(c, f, lt, u, S); };
// screen-space speech bubble between at and until
const bub = (text, x, y, at, until = 99, o = {}) => (c, lt) => { const a = pop(lt, at, .35) * (1 - K.seg(lt, until - .25, until)); if (a > 0) G6.bubble(c, x, y, (o.s ?? .8) * a, text, o); };
const card = (t, at, x, y, o = {}) => (c, lt) => K.card(c, t, lt, Object.assign({ at, x, y, px: 44 }, o));
const night = (a = .5) => (c) => { c.save(); c.fillStyle = `rgba(10,16,46,${a})`; c.fillRect(0, 0, 2560, 1440); c.restore(); };
const shimmer = (c, lt, x0, x1, y0, y1, n = 40, col = '255,220,180') => { for (let k = 0; k < n; k++) { const x = x0 + (k * 157) % (x1 - x0), y = y0 + (k * 61) % (y1 - y0), a = .15 + .35 * Math.max(0, Math.sin(lt * 2 + k)); c.fillStyle = `rgba(${col},${a})`; c.fillRect(x + Math.sin(lt + k) * 8, y, 22, 3); } };
const lamp = (c, x, y, lt, r = 120, col = '255,210,140') => glow(c, x, y, r * (1 + .05 * Math.sin(lt * 9 + x)), col, .45);
// coast guard sniffer dog, bottom centre, faces +x (o.facing -1 flips). s=1: 110 long, 70 tall. o.walk swings legs, o.sniff 0..1 lowers the head
const dog = (c, x, y, s, t, o = {}) => { G6.shadow(c, x, y, 60 * s); c.save(); c.translate(x, y); c.scale(s * (o.facing || 1), s); c.strokeStyle = INK; c.lineWidth = 3; c.lineCap = 'round'; const sw = o.walk ? Math.sin(t * 11) : 0, sn = o.sniff || 0;
  for (const [lx, ph] of [[-30, 0], [-22, Math.PI], [24, Math.PI], [32, 0]]) { const a = sw * .4 * Math.cos(ph); c.strokeStyle = INK; c.lineWidth = 9; c.beginPath(); c.moveTo(lx, -34); c.lineTo(lx + Math.sin(a) * 26, -2); c.stroke(); c.strokeStyle = '#b8864a'; c.lineWidth = 5.5; c.stroke(); }
  c.lineWidth = 3; c.strokeStyle = INK; c.beginPath(); c.moveTo(-40, -46); c.quadraticCurveTo(-62, -60 + Math.sin(t * 14) * 8, -58, -78 + Math.sin(t * 14) * 10); c.lineWidth = 7; c.stroke(); c.strokeStyle = '#c89a5a'; c.lineWidth = 4; c.stroke();
  c.fillStyle = '#c89a5a'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.ellipse(0, -44, 44, 17, 0, 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#f07a1e'; rr(c, -24, -60, 46, 30, 6); c.fill(); c.stroke(); c.fillStyle = '#f4f4f4'; c.fillRect(-24, -48, 46, 5); c.fillStyle = '#f2c14a'; c.fillRect(-4, -62, 8, 6);
  const hx = 50, hy = -62 + sn * 26; c.fillStyle = '#c89a5a'; c.beginPath(); c.moveTo(34, -52); c.lineTo(hx - 6, hy + 6); c.lineTo(hx + 4, hy + 12); c.lineTo(40, -38); c.closePath(); c.fill();
  c.beginPath(); c.arc(hx, hy, 14, 0, 7); c.fill(); c.stroke(); c.beginPath(); c.ellipse(hx + 14, hy + 5, 11, 7, .2, 0, 7); c.fill(); c.stroke(); c.fillStyle = INK; c.beginPath(); c.arc(hx + 24, hy + 3, 3.5, 0, 7); c.fill(); c.beginPath(); c.arc(hx + 4, hy - 3, 2.6, 0, 7); c.fill();
  c.fillStyle = '#8a5a2a'; c.beginPath(); c.ellipse(hx - 7, hy + 2, 6, 12, .3, 0, 7); c.fill(); c.stroke(); c.restore(); };
// executive desk, front view; x centre, top y, floor y
const desk = (c, x, top, floor, w = 620, col = '#5a3a24') => { c.save(); G6.shadow(c, x, floor, w * .55); c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 5; c.fillRect(x - w / 2 + 20, top + 20, w - 40, floor - top - 22); c.strokeRect(x - w / 2 + 20, top + 20, w - 40, floor - top - 22);
  c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(x - w / 2 + 40, top + 50, w / 2 - 60, floor - top - 70); c.fillRect(x + 20, top + 50, w / 2 - 60, floor - top - 70); c.fillStyle = RIG.shadeHex(col, .2); rr(c, x - w / 2, top, w, 26, 6); c.fill(); c.stroke();
  c.fillStyle = '#d8b46a'; for (const dx of [-w / 4, w / 4]) { c.beginPath(); c.arc(x + dx, top + 90, 6, 0, 7); c.fill(); } c.restore(); };
const glass = (c, x, y, s = 1, col = '#e8a43a') => { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = col; c.globalAlpha = .85; c.fillRect(-9, -14, 18, 12); c.globalAlpha = 1; c.strokeStyle = INK; c.lineWidth = 2; c.strokeRect(-10, -26, 20, 26); c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(-7, -24, 3, 20); c.restore(); };
// searchlight cone from x,y at angle a (radians), length L
const beam = (c, x, y, a, L = 1400, w = .16, al = .22) => { c.save(); c.globalCompositeOperation = 'screen'; const g = c.createRadialGradient(x, y, 10, x, y, L); g.addColorStop(0, `rgba(255,250,220,${al})`); g.addColorStop(1, 'rgba(255,250,220,0)'); c.fillStyle = g; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a - w) * L, y + Math.sin(a - w) * L); c.lineTo(x + Math.cos(a + w) * L, y + Math.sin(a + w) * L); c.closePath(); c.fill(); c.restore(); };
// red X over something (world)
const bigX = (c, x, y, r, lt, at) => { const u = K.seg(lt, at, at + .3); if (u <= 0) return; const sc = 1 + (1 - E.out(u)) * 1.2; c.save(); c.translate(x, y); c.scale(sc, sc); c.globalAlpha = u; c.lineCap = 'round'; for (const [w, col] of [[r * .3, 'rgba(0,0,0,.35)'], [r * .22, '#d8282e']]) { c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(-r, -r); c.lineTo(r, r); c.moveTo(r, -r); c.lineTo(-r, r); c.stroke(); } c.restore(); };
const PHONE = (n = 0) => ({ near: cc => G6.phone(cc, 0, 22, 1.25, n) });

window.SHOTS = [
  // 7.00 motel room: the jar shatters, the card frosts over, WANTED on TV, Abe hangs up, Valentina's bill. TRUST: Abe gets his X (xs 3 -> 4)
  { plate: 'bedroom', cam: { z: [1.32, 1.45], x: [1240, 1300], y: [880, 870] }, bed: [['night_loop', .2], ['hum_loop', .06]], light: { dir: 1, key: 'rgba(150,180,255,.18)' },
    init: S => { const tG = A.at(S, 'goes', 1.2), tA = A.at(S, 'Accounts', 2.0), tN = A.at(S, 'news', 4.6), tAb = A.at(S, 'Abe', 5.2), tK = A.at(S, 'know', 6.0), tD = A.at(S, 'dead', 7.6), tV = A.at(S, 'bill', 9.6);
      const coins = Array.from({ length: 16 }, (_, k) => ({ dx: (k * 37) % 120 - 60, vy: -80 - (k * 23) % 140, rest: 1250 + (k * 29) % 70, vx: ((k * 53) % 200 - 100) }));
      S.D.figs = [{ x: 820, y: 1330, s: 2.1, ...G6.JASON(), facing: 1, mood: 'neutral', hold: PHONE(0), anim: (o, lt) => { const up = E.io(K.seg(lt, tAb - .8, tAb - .2)); o.arms = () => ({ shR: 20 + 35 * up, elR: -40 - 35 * up, handR: 'open' }); if (lt > tAb) o.mood = 'worried'; if (lt > tD) o.mood = 'shocked'; o.lean = lt > tD ? -4 : 0; } },
        { x: 1360, y: 1340, s: 2.0, ...G6.LUCIA(), facing: -1, mood: 'worried', hold: { near: cc => { const f = K.seg(S._lt || 0, tA, tA + .8); cc.save(); cc.translate(0, 26); cc.rotate(.1); cc.fillStyle = '#2a5aa0'; cc.strokeStyle = INK; cc.lineWidth = 2; rr(cc, -22, -14, 44, 28, 4); cc.fill(); cc.stroke(); cc.fillStyle = '#f2c14a'; cc.fillRect(-16, -6, 9, 7);
          cc.fillStyle = `rgba(225,245,255,${.85 * f})`; rr(cc, -22, -14, 44, 28, 4); cc.fill(); cc.strokeStyle = `rgba(255,255,255,${f})`; cc.lineWidth = 1.2; for (let k = 0; k < 6; k++) { cc.beginPath(); cc.moveTo(-18 + k * 7, -12); cc.lineTo(-14 + k * 7, -4); cc.lineTo(-19 + k * 7, 4); cc.stroke(); } cc.restore(); } },
          anim: (o, lt) => { S._lt = lt; const up = E.io(K.seg(lt, tA - .3, tA + .3)) * (1 - E.io(K.seg(lt, tN - .2, tN + .4))); o.arms = () => ({ shR: 18 + 62 * up, elR: -30 - 50 * up, handR: 'open' }); if (lt > tN) o.facing = 1; if (lt > tAb) o.facing = -1; if (lt > tV) { o.facing = 1; o.mood = 'angry'; } } }];
      S.D.live = [(c, lt) => { for (let k = 0; k < 18; k++) { const a = .3 + .4 * Math.max(0, Math.sin(lt * 1.5 + k * 2.1)); c.fillStyle = `rgba(255,220,140,${a})`; c.fillRect(1640 + (k * 83) % 420, 330 + (k * 47) % 300, 10, 14); }
        glow(c, 2020, 1180, 520, '120,150,255', lt > tN ? .22 + .06 * Math.sin(lt * 13) : .05);
        // jar on the nightstand: cracks and empties; coins spill to the floor
        const dr = K.seg(lt, tG, tG + 1.1); G6.jar(c, 1790, 893, 2.3, .9 * (1 - dr), { crack: lt > tG });
        if (lt > tG) for (const q of coins) { const tt = lt - tG; let x = 1790 + q.dx * .4 + q.vx * Math.min(tt, .9), y = 840 + q.vy * tt + 900 * tt * tt; if (y > q.rest) y = q.rest; c.fillStyle = '#e8b43a'; c.strokeStyle = INK; c.lineWidth = 1.5; c.beginPath(); c.ellipse(x, y, 9, y >= q.rest ? 4 : 8, tt * 6, 0, 7); c.fill(); c.stroke(); }
        if (lt > tG && lt < tG + .5) glow(c, 1790, 820, 160, '255,255,255', .5 * (1 - (lt - tG) / .5)); },
        (c, lt) => { G6.wantedTV(c, 1990, 1345, 1.45, lt); if (lt < tN) { c.fillStyle = '#0a0c12'; c.fillRect(1816, 1067, 348, 215); c.fillStyle = `rgba(200,210,230,${.06 + .04 * Math.sin(lt * 40)})`; for (let k = 0; k < 30; k++) c.fillRect(1816 + (k * 97 + lt * 900) % 340, 1067 + (k * 53) % 210, 6, 2); } }];
      S.D.front = [];
      S.D.over = [card('ACCOUNTS FROZEN', tA, 620, 150, { bg: '#cfe8f8', px: 52, rot: -3 }), card('ON THE NEWS', tN, 1300, 120, { px: 34, rot: 3, until: tAb + .2 }),
        bub("I DON'T|KNOW YOU.", 330, 250, tAb, tD - .1, { tail: [140, 140] }), bub("YOU'RE ALREADY|DEAD.", 330, 250, tD, tV - .1, { tail: [140, 140] }),
        card("VALENTINA'S BILL:\nPAY UP", tV, 1180, 170, { bg: '#f4d6d0', px: 38, rot: 4 }), trustOv(lt => 1 + K.clamp((lt - tK) / .5), tAb - .5)];
      S.D.sfx = [[tG, 'hit', .45], [tG + .1, 'coins_cascade', .4], [tA, 'stamp', .35], [tN, 'alarm', .12], [tAb - .9, 'phone_ring', .3], [tK, 'stamp', .4], [tD, 'tension', .3], [tV, 'paper', .4]]; } },

  // 7.01 rooftop bar: texts from Mattia's number, Lucia walks in with the statue, the chair turns: GIORGIO GALLO
  { plate: 'rooftop_bar', cam: { z: [1.28, 1.42], x: [1150, 1300], y: [880, 900] }, bed: [['night_loop', .15], ['city_loop', .12]], light: { dir: 1, key: 'rgba(255,170,220,.18)' },
    init: S => { const tM = A.at(S, 'messages', .6), tMi = A.at(S, 'miss', 2.0), tB = A.at(S, 'Bring', 2.6), tL = A.at(S, 'Lucia', 5.4), tW = A.at(S, 'Waiting', 8.1), tI = A.at(S, "isn't", 8.8), tGi = A.at(S, 'Giorgio', 10.5);
      const turn = tW + .6;
      S.D.figs = [{ x: 1260, y: 1340, s: 2.0, ...G6.LUCIA(), mood: 'focus', walk: { x0: 180, x1: 1260, t0: tL + .1, dur: 2.6 }, hold: { far: cc => G6.statue(cc, 0, 70, 1.25) }, anim: (o, lt) => { if (lt > tI) o.mood = 'worried'; if (lt > tGi) o.mood = 'shocked'; } },
        { x: 1600, y: 1330, s: 2.0, ...G6.GALLO(), pose: 'sit', facing: 1, mood: 'smug', anim: (o, lt) => { if (lt > turn) { o.facing = -1; o.talk = lt > tGi && lt < tGi + 1.4; } } }];
      S.D.live = [(c, lt) => { for (let k = 0; k < 40; k++) { const x = 40 + k * 64, y = 120 + Math.sin(k * .5) * 30 + k * 2; c.fillStyle = `rgba(255,230,160,${.5 + .5 * Math.sin(lt * 3 + k)})`; c.beginPath(); c.arc(x, y, 5, 0, 7); c.fill(); }
        shimmer(c, lt, 80, 2500, 640, 820, 50, '255,140,220'); const f = .8 + .2 * Math.sin(lt * 17) * Math.sin(lt * 5); glow(c, 900, 1120, 260, '255,150,60', .45 * f); for (let k = 0; k < 6; k++) { c.fillStyle = `rgba(255,${150 + k * 15},60,.8)`; c.beginPath(); c.ellipse(780 + k * 50, 1110 - Math.abs(Math.sin(lt * 9 + k)) * 18, 10, 22, 0, 0, 7); c.fill(); }
        TW.chair(c, 1600, 1330, 1330 - 63 * 2.0, lt > turn ? -1 : 1, '#e8e2d4'); }];
      S.D.front = [(c, lt) => ntag(c, 'GIORGIO GALLO', 1610, 860, lt, tGi, { px: 40 })];
      S.D.over = [(c, lt) => { const a = pop(lt, tM - .2, .4) * (1 - K.seg(lt, tL - .5, tL)); if (a <= 0) return; c.save(); c.translate(330, 420); c.scale(a, a); c.rotate(-.04); c.fillStyle = 'rgba(0,0,0,.35)'; rr(c, -150, -270, 310, 540, 36); c.fill(); c.fillStyle = '#18181e'; c.strokeStyle = INK; c.lineWidth = 6; rr(c, -160, -280, 310, 540, 36); c.fill(); c.stroke();
          c.fillStyle = '#eef0f4'; rr(c, -142, -250, 274, 470, 16); c.fill(); c.fillStyle = '#d8dce4'; c.fillRect(-142, -250, 274, 60); txt(c, 'MATTIA', -5, -220, 30, INK, 'center', 'Anton');
          const m = (t, s, y) => { const b = pop(lt, t, .3); if (b <= 0) return; c.save(); c.translate(-20, y); c.scale(b, b); c.fillStyle = '#3a8ad0'; rr(c, -100, -32, 220, 64, 18); c.fill(); txt(c, s, 10, 0, 28, '#fff', 'center', 'Anton'); c.restore(); };
          m(tMi - .2, 'DID YOU MISS ME?', -130); m(tB, 'BRING MY THINGS.', -40); m(tB + 1.2, 'ROOFTOP BAR. 10PM', 50); c.restore(); },
        card('NOT MATTIA...', tI, 900, 140, { px: 40, rot: -3, until: tGi + .2 })];
      S.D.sfx = [[tM, 'phone_ring', .3], [tMi, 'pop', .3], [tB, 'pop', .3], [tB + 1.2, 'pop', .25], [tL - .3, 'footsteps', .35], [tI, 'tension', .3], [turn, 'creak', .45], [tGi, 'swell', .3]]; } },

  // 7.02 penthouse terrace: Gallo with the statue ("2,000 years old"), the helicopter flies them in, Mattia alive with palms up. TRUST: ring on MATTIA
  { plate: 'hotel_balcony', cam: { z: [1.3, 1.42], x: [1180, 1120], y: [860, 880] }, bed: [['wind_loop', .15], ['ocean_loop', .12]], light: { dir: 1, key: 'rgba(255,190,140,.22)' },
    init: S => { const tH = A.at(S, 'holds', .4), tT = A.at(S, 'thousand', 1.8), tSt = A.at(S, 'stole', 3.2), tF = A.at(S, 'flown', 5.4), tM = A.at(S, 'Mattia', 8.0), tAp = A.at(S, 'apologising', 9.4), tNP = A.at(S, 'Nothing', 10.6);
      S.D.figs = [{ x: 1000, y: 1330, s: 2.05, ...G6.GALLO(), facing: 1, mood: 'smug', hold: { near: cc => G6.statue(cc, 0, 64, 1.25, { glow: .6 }) }, anim: (o, lt) => { const up = E.io(K.seg(lt, tH - .3, tH + .3)); o.arms = () => ({ shR: 25 + 55 * up, elR: -60 - 30 * up, handR: 'open' }); o.talk = lt > tT - .2 && lt < tSt + 1.4; if (lt > tSt) o.mood = 'angry'; if (lt > tNP) o.mood = 'smug'; } },
        { x: 1500, y: 1340, s: 2.0, ...G6.LUCIA(), facing: -1, mood: 'worried', anim: (o, lt) => { if (lt > tSt) o.pose = 'shrug'; if (lt > tSt + 1.2) o.pose = 'stand'; if (lt > tM) { o.mood = 'shocked'; o.facing = -1; } } },
        { x: 1760, y: 1350, s: 2.1, ...G6.JASON(), facing: -1, mood: 'neutral', anim: (o, lt) => { if (lt > tM) o.mood = 'angry'; } },
        { x: 560, y: 1330, s: 2.0, ...G6.MATTIA(), facing: 1, mood: 'sad', walk: { x0: -200, x1: 560, t0: tM - 1.2, dur: 2.2 }, anim: (o, lt) => { if (lt > tM + 1.1) o.pose = 'shrug'; o.talk = lt > tAp && lt < tNP + 1.5; } }];

<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
const SW = 1920, SH = 1080, INK = TW.INK, RED = TW.RED, pop = TW.pop, fade = TW.fade;
const backdrop = (name, b = .5, blur = 8) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${b})`; const s2 = 1.06 * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 720 * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); c.restore(); K.screen(c); };
const CARRY = () => ({ shL: 30, elL: -75, shR: 35, elR: -75 });
const endTitle = (secs) => { const T = window.TIMING; const last = T.shots[T.shots.length - 1]; T.shots.push({ i: T.shots.length, start: last.end, end: last.end + secs, vo_start: last.end, vo_end: last.end, text: '' }); T.dur = last.end + secs; };
// ===== JH act 7: The File =====
const D2 = Math.PI / 180, rr = TW.rr, txt = TW.txt;
// prop held upright in a hand: a2 = shoulder + elbow angle of that arm
const held = (a2, fn) => (ctx, t) => { ctx.save(); ctx.rotate(a2 * D2); fn(ctx, t); ctx.restore(); };
// highlighted name tag (screen space)
const nameTag = (c, s, x, y, lt, at, opts = {}) => { const a = pop(lt, at, .4), o = 1 - K.seg(lt, (opts.until ?? 999) - .3, opts.until ?? 999); if (a <= 0 || o <= 0) return; const px = opts.px ?? 40; c.save(); c.globalAlpha = o; c.translate(x, y); c.rotate(opts.rot ?? -.02); c.scale(a, a); c.font = `${px}px Anton`; const w = c.measureText(s).width + 44, h = px * 1.45;
  c.fillStyle = 'rgba(0,0,0,.35)'; rr(c, -w / 2 + 6, -h / 2 + 8, w, h, 10); c.fill(); c.fillStyle = JH.GOLD; c.strokeStyle = INK; c.lineWidth = 4; rr(c, -w / 2, -h / 2, w, h, 10); c.fill(); c.stroke(); txt(c, s, 0, 3, px, INK, 'center', 'Anton');
  if (opts.sub) { c.font = '28px Oswald'; const w2 = c.measureText(opts.sub).width + 26; c.fillStyle = 'rgba(20,16,14,.82)'; rr(c, -w2 / 2, h / 2 + 6, w2, 40, 8); c.fill(); txt(c, opts.sub, 0, h / 2 + 27, 28, '#f6efe2', 'center', 'Oswald'); } c.restore(); };
// shield badge (screen or world): label, colours
const shield = (c, x, y, s, label, col, opts = {}) => { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.moveTo(8, -128); c.lineTo(118, -80); c.lineTo(100, 66); c.lineTo(8, 140); c.lineTo(-84, 66); c.lineTo(-104, -80); c.closePath(); c.fill();
  c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 7; c.beginPath(); c.moveTo(0, -136); c.lineTo(112, -88); c.lineTo(94, 58); c.lineTo(0, 132); c.lineTo(-94, 58); c.lineTo(-112, -88); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = opts.inner || 'rgba(255,255,255,.14)'; c.beginPath(); c.arc(0, -14, 64, 0, 7); c.fill(); if (opts.star) { c.fillStyle = JH.GOLD; c.beginPath(); for (let k = 0; k < 10; k++) { const r = k % 2 ? 22 : 54, a = -Math.PI / 2 + k * Math.PI / 5; c.lineTo(Math.cos(a) * r, -14 + Math.sin(a) * r); } c.closePath(); c.fill(); c.strokeStyle = INK; c.lineWidth = 3; c.stroke(); }
  txt(c, label, 0, opts.star ? 86 : -12, opts.star ? 40 : 56, opts.tc || '#f6efe2', 'center', 'Anton'); c.restore(); };
// a half shield (left or right half), for the split badge
const halfShield = (c, x, y, s, side, label, col) => { c.save(); c.translate(x, y); c.beginPath(); if (side < 0) c.rect(-200 * s, -200 * s, 200 * s, 400 * s); else c.rect(0, -200 * s, 200 * s, 400 * s); c.clip(); shield(c, 0, 0, s, '', col); c.restore(); txt(c, label, x + side * 52 * s, y - 12 * s, 46 * s, '#f6efe2', 'center', 'Anton'); };
// jet engine front view with spinning fan (screen or world)
const engine = (c, x, y, r, lt) => { c.save(); c.translate(x, y); c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.arc(8, 10, r * 1.08, 0, 7); c.fill(); c.fillStyle = '#c8ccd4'; c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.arc(0, 0, r * 1.08, 0, 7); c.fill(); c.stroke(); c.fillStyle = '#2a2e36'; c.beginPath(); c.arc(0, 0, r * .92, 0, 7); c.fill();
  c.save(); c.rotate(lt * 2.4); for (let k = 0; k < 18; k++) { c.rotate(Math.PI * 2 / 18); c.fillStyle = k % 2 ? '#9aa2b0' : '#8a92a0'; c.beginPath(); c.moveTo(0, -r * .2); c.quadraticCurveTo(r * .35, -r * .5, r * .12, -r * .9); c.lineTo(-r * .08, -r * .9); c.quadraticCurveTo(r * .05, -r * .5, -r * .1, -r * .2); c.closePath(); c.fill(); } c.restore();
  c.fillStyle = '#e8ecf2'; c.beginPath(); c.arc(0, 0, r * .2, 0, 7); c.fill(); c.stroke(); c.fillStyle = INK; c.beginPath(); c.moveTo(0, -r * .06); c.quadraticCurveTo(r * .12, 0, 0, r * .06); c.fill(); c.restore(); };
// steaming dish on the dinner table (world)
const dish = (c, x, y, lt, k) => { c.fillStyle = 'rgba(0,0,0,.2)'; c.beginPath(); c.ellipse(x + 4, y + 6, 64, 14, 0, 0, 7); c.fill(); c.fillStyle = '#f4f1ea'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.ellipse(x, y, 62, 14, 0, 0, 7); c.fill(); c.stroke(); c.fillStyle = ['#c86a2a', '#6a9a3a', '#b8402a'][k % 3]; c.beginPath(); c.ellipse(x, y - 4, 36, 9, 0, Math.PI, 0); c.fill();
  for (let j = 0; j < 3; j++) { const life = (lt * .5 + j / 3 + k * .2) % 1; c.strokeStyle = `rgba(255,255,255,${.35 * (1 - life)})`; c.lineWidth = 4; c.beginPath(); c.moveTo(x - 14 + j * 14, y - 12); c.quadraticCurveTo(x - 24 + j * 14 + Math.sin(lt * 2 + j) * 10, y - 40 - life * 40, x - 10 + j * 14, y - 60 - life * 70); c.stroke(); } };
// dining chair, side view; back on the far side from the table (back = -1 left, 1 right). seatY = seat top
const dChair = (c, x, floorY, seatY, back) => { c.save(); c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(x, floorY, 110, 14, 0, 0, 7); c.fill(); c.strokeStyle = INK; c.lineWidth = 5; c.fillStyle = '#5a2a1a';
  const bx = x + back * 80; c.fillRect(bx - 10, seatY - 250, 20, floorY - seatY + 250); c.strokeRect(bx - 10, seatY - 250, 20, floorY - seatY + 250); rr(c, bx - 16, seatY - 262, 32, 40, 8); c.fill(); c.stroke();
  c.fillRect(x - back * 70 - 9, seatY + 20, 18, floorY - seatY - 20); c.strokeRect(x - back * 70 - 9, seatY + 20, 18, floorY - seatY - 20); c.fillStyle = '#7a3a22'; rr(c, x - 95, seatY, 190, 28, 8); c.fill(); c.stroke(); c.restore(); };
// prison bars dropping over the frame (screen): u 0 up .. 1 down
const bars = (c, u) => { if (u <= 0) return; const dy = (1 - E.out(u)) * -1100; c.save(); c.translate(0, dy); c.fillStyle = 'rgba(10,10,14,.35)'; c.fillRect(0, -40, 1920, 1120); for (let k = 0; k < 11; k++) { const x = 40 + k * 184; c.fillStyle = '#3a3e46'; c.fillRect(x, -40, 34, 1120); c.fillStyle = 'rgba(255,255,255,.22)'; c.fillRect(x + 5, -40, 7, 1120); c.strokeStyle = INK; c.lineWidth = 4; c.strokeRect(x, -40, 34, 1120); }
  c.fillStyle = '#3a3e46'; c.fillRect(0, 60, 1920, 34); c.strokeRect(-4, 60, 1928, 34); c.fillRect(0, 820, 1920, 34); c.strokeRect(-4, 820, 1928, 34); c.restore(); };
// a file photo (silhouette only, no likeness) with caption
const filePhoto = (c, x, y, s, cap, opts = {}) => { c.save(); c.translate(x, y); c.rotate(opts.rot ?? 0); c.scale(s, s); c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(-122, -152, 256, 330); c.fillStyle = '#f7f3e8'; c.strokeStyle = INK; c.lineWidth = 5; c.fillRect(-130, -160, 260, 330); c.strokeRect(-130, -160, 260, 330);
  c.fillStyle = '#9aa0aa'; c.fillRect(-106, -136, 212, 220); c.fillStyle = opts.sil || '#3a3e48'; c.beginPath(); c.arc(0, -56, 46, 0, 7); c.fill(); if (opts.hair) { c.beginPath(); c.ellipse(0, -40, 60, 70, 0, Math.PI, 0); c.fill(); c.fillRect(-60, -40, 22, 90); c.fillRect(38, -40, 22, 90); } c.beginPath(); c.ellipse(0, 76, 86, 64, 0, Math.PI, 0); c.fill();
  txt(c, cap, 0, 122, 30, INK, 'center', 'Anton'); if (opts.sub) txt(c, opts.sub, 0, 154, 22, '#5a5248', 'center', 'Oswald'); c.restore(); };
// campaign poster (world)
const poster = (c, x, y, w, h, l1, l2, col) => { c.save(); c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(x + 8, y + 10, w, h); c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 4; c.fillRect(x, y, w, h); c.strokeRect(x, y, w, h); c.fillStyle = '#f6efe2'; c.fillRect(x + 10, y + h * .62, w - 20, 6);
  txt(c, l1, x + w / 2, y + h * .32, Math.min(46, w * .2), '#fff', 'center', 'Anton'); txt(c, l2, x + w / 2, y + h * .8, Math.min(30, w * .13), '#fff', 'center', 'Oswald'); c.restore(); };

for (const n of ['stage_blue', 'white_house_night', 'sec_room', 'rain_street', 'office', 'gov_corridor', 'chip']) K.load(n, PL + n + '.jpg');
// framed inset of another plate (screen space)
const inset = (c, name, x, y, w, h, a, opts = {}) => { if (a <= 0) return; c.save(); c.translate(x, y); c.scale(a, a); c.rotate(opts.rot ?? .02); c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(-w / 2 + 10, -h / 2 + 12, w + 16, h + 16); c.fillStyle = '#f6efe2'; c.fillRect(-w / 2 - 8, -h / 2 - 8, w + 16, h + 16 + (opts.cap ? 50 : 0)); c.strokeStyle = INK; c.lineWidth = 4; c.strokeRect(-w / 2 - 8, -h / 2 - 8, w + 16, h + 16 + (opts.cap ? 50 : 0));
  const sx = opts.sx ?? 0, sy = opts.sy ?? 0, sw = opts.sw ?? 2560, sh2 = opts.sh ?? 1440; c.drawImage(K.imgs[name], sx, sy, sw, sh2, -w / 2, -h / 2, w, h); if (opts.cap) txt(c, opts.cap, 0, h / 2 + 30, 34, INK, 'center', 'Anton'); c.restore(); };
const rain = (n = 90, sp = 1400) => (c, lt) => { c.strokeStyle = 'rgba(190,210,240,.35)'; c.lineWidth = 2; for (let k = 0; k < n; k++) { const x = (k * 293.7 + lt * 120) % 2700 - 70, y = (k * 151.3 + lt * sp) % 1500 - 60; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 8, y + 34); c.stroke(); } };
const coverSign = (c, lt) => { c.fillStyle = '#14161e'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.moveTo(830, 786); c.lineTo(1730, 786); c.lineTo(1700, 864); c.lineTo(860, 864); c.closePath(); c.fill(); c.stroke(); const f = .85 + .15 * Math.sin(lt * 23) * Math.sin(lt * 5); TW.glow(c, 1280, 826, 360, '255,120,170', .25 * f); txt(c, 'XINYI TOWER', 1280, 828, 52, `rgba(255,190,220,${f})`, 'center', 'Anton'); };
const puddles = (c, lt) => { for (let k = 0; k < 6; k++) { const x = 200 + k * 420, ph = (lt * .8 + k * .37) % 1; c.strokeStyle = `rgba(200,220,255,${.3 * (1 - ph)})`; c.lineWidth = 2; c.beginPath(); c.ellipse(x, 1330 + (k % 2) * 40, 20 + ph * 60, 5 + ph * 12, 0, 0, 7); c.stroke(); } };

window.SHOTS = [
  // 7.01 the target: Jensen on a keynote stage; a red ring tightens round him; the screen shows a roadmap; a dashed line runs to the White House
  { plate: 'stage_blue', cam: { z: [1.18, 1.32], x: [1280, 1280], y: [690, 710] }, bed: [['crowd_loop', .1], ['hum_loop', .08]], light: { dir: 1, key: 'rgba(150,190,255,.26)' },
    init: S => { const tA = A.at(S, 'According', .6), tW = A.at(S, 'wants', 3.2), tO = A.at(S, 'one man', 4.8), tN = A.at(S, 'Nvidia', 8.2), tP = A.at(S, 'president', 11.3), tAl = A.at(S, 'allowed', 12.7);
      S.D.figs = [{ x: 1280, y: 905, s: 1.0, ...JH.JENSEN(), facing: 1, mood: 'happy', anim: (o, lt) => { if (lt > tN - .3 && lt < tP - .5) o.pose = 'present'; if (lt > tP - .3) { o.pose = 'point'; o.talk = true; } } }];
      S.D.live = [(c, lt) => { // the stage screen: a roadmap arrow drawing on at "Nvidia"
          const u = E.out(K.seg(lt, tN - .2, tN + 1.6)); c.save(); c.fillStyle = 'rgba(10,20,50,.35)'; c.fillRect(520, 125, 1520, 615); TW.glow(c, 1280, 430, 700, '120,170,255', .12 + .04 * Math.sin(lt * 2));
          if (u > 0) { c.globalAlpha = Math.min(1, u * 2); c.strokeStyle = JH.GREEN; c.lineWidth = 14; c.lineCap = 'round'; c.beginPath(); c.moveTo(640, 690); for (let k = 0; k <= 40 * u; k++) c.lineTo(640 + k * 30, 690 - k * k * .12); c.stroke();
            ['2026', '2027', '2028'].forEach((y2, k) => { if (u > .3 + k * .25) { const x = 900 + k * 330; c.fillStyle = '#e8f0ff'; const yy = 690 - ((x - 640) / 30) ** 2 * .12; c.beginPath(); c.arc(x, yy, 16, 0, 7); c.fill(); txt(c, y2, x + 50, yy + 36, 32, '#cfe0ff', 'center', 'Oswald'); } }); } c.restore(); },
        (c, lt) => { for (let k = 0; k < 14; k++) { const x = 60 + k * 190, y = 1250 + (k % 3) * 60, f = Math.sin(lt * 3 + k * 1.7); if (f > .2) TW.glow(c, x, y, 30, '255,255,255', .4 * f); } }];
      S.D.front = [(c, lt) => { JH.target(c, 1280, 760, lt, tW, { r0: 520, r1: 230, d: 2.2 }); if (lt > tW + 2.2) JH.target(c, 1280, 760, 99, 0, { r0: 230 + 8 * Math.sin(lt * 4), r1: 230 + 8 * Math.sin(lt * 4) }); }];
      S.D.over = [(c, lt) => JH.src(c, 'THE NEW YORK TIMES', 420, 90, lt, tA), (c, lt) => K.card(c, 'THE TARGET', lt, { at: tW, x: 300, y: 200, px: 56, rot: -3 }),
        (c, lt) => nameTag(c, 'JENSEN HUANG', 960, 790, lt, tO, { px: 48, sub: 'NVIDIA CEO' }),
        (c, lt) => K.card(c, 'KNOWS WHERE NVIDIA IS GOING', lt, { at: tN, x: 360, y: 330, px: 34, rot: 2 }),

          inset(c, 'white_house_night', 1580, 260, 420, 236, a, { cap: 'TALKS TO THE PRESIDENT', sx: 200, sy: 200, sw: 2160, sh: 1215 }); },
        (c, lt) => K.card(c, "WHO'S ALLOWED TO BUY ITS CHIPS", lt, { at: tAl, x: 1560, y: 520, px: 34, rot: -2 })];
      S.D.sfx = [[tA, 'pop', .2], [tW, 'riser', .2], [tW + 2, 'hit', .2], [tO, 'stamp', .3], [tN, 'whoosh_soft', .25], [tP - .3, 'pop', .25], [tAl, 'tick', .25]]; } },

  // 7.02 the surveillance room: waveforms pulse on the wall screens; ALICE HUANG's profile card; a year-long bar fills; an arrow runs to Beijing; ASSESSED: RECRUITED
  { plate: 'sec_room', cam: { z: [1.0, 1.12], x: [1280, 1280], y: [720, 760] }, bed: [['hum_loop', .14], ['typing', .05]], light: { dir: 1, key: 'rgba(255,120,120,.18)' },
    init: S => { const tY = A.at(S, 'year', 1.4), tUS = A.at(S, 'intelligence', 2.1), tAl = A.at(S, 'Alice', 3.7), tE = A.at(S, 'electronic', 5.0), tD = A.at(S, 'decide', 6.7), tF = A.at(S, 'funnelling', 7.5), tB = A.at(S, 'Beijing', 9.1), tR = A.at(S, 'recruited', 11.3);
      S.D.figs = [{ x: 620, y: 1330, s: 1.5, ...JH.AGENT(0), facing: 1, mood: 'focus', anim: (o, lt) => { if (lt > tD - .2 && lt < tB) o.pose = 'point'; o.talk = lt > tD && lt < tF + .8; } },
        { x: 1960, y: 1340, s: 1.5, ...JH.WOMAN(0), facing: -1, mood: 'focus', anim: (o, lt) => { if (lt > tR - .3) o.pose = 'think'; } }];

          c.strokeStyle = `rgba(255,120,110,${.9 * on})`; c.lineWidth = 4; c.beginPath(); for (let x = x0; x <= x1; x += 6) { const v = Math.sin(x * .05 + lt * (6 + k)) * Math.sin(x * .013 + lt * 1.3 + k) * 70 * (.5 + .5 * Math.sin(lt * 2 + k)); x === x0 ? c.moveTo(x, 372 + v) : c.lineTo(x, 372 + v); } c.stroke();
          txt(c, ['INTERCEPT 01', 'INTERCEPT 02', 'INTERCEPT 03'][k], x0 + 24, 256, 26, `rgba(255,200,190,${on})`, 'left', 'Oswald'); if (Math.sin(lt * 5 + k) > 0) { c.fillStyle = `rgba(255,60,50,${on})`; c.beginPath(); c.arc(x1 - 34, 254, 9, 0, 7); c.fill(); } c.restore(); TW.glow(c, (x0 + x1) / 2, 372, 360, '255,80,70', .1 * on); }); }];
      S.D.over = [(c, lt) => K.card(c, 'UNDER SURVEILLANCE', lt, { at: tE, x: 330, y: 110, px: 50, rot: -2 }), (c, lt) => K.card(c, 'US INTELLIGENCE', lt, { at: tUS, x: 1600, y: 110, px: 40, rot: 2 }),
        (c, lt) => nameTag(c, 'ALICE HUANG', 960, 330, lt, tAl, { px: 46 }),
        (c, lt) => { JH.profile(c, 960, 560, lt, tAl, 'ALICE HUANG', ['MEGASPEED', 'WIRETAP · EMAIL · PHONE', ''], { w: 520, head: 'SUBJECT FILE', step: .6 }); if (lt > tR) TW.stamp(c, 'ASSESSED: RECRUITED BY MSS', 960, 640, lt, tR, { px: 40, rot: -.07 }); },
        (c, lt) => { const u = E.out(K.seg(lt, tY - .2, tD)); if (lt < tY - .3) return; c.save(); c.fillStyle = 'rgba(14,10,12,.8)'; rr(c, 560, 790, 800, 56, 12); c.fill(); c.fillStyle = '#c8282e'; rr(c, 566, 796, 788 * u, 44, 10); c.fill(); txt(c, 'ABOUT 1 YEAR', 960, 819, 32, '#fff', 'center', 'Anton'); c.restore(); },
        (c, lt) => { const u = E.out(K.seg(lt, tF, tB + .2)); if (u <= 0) return; c.save(); c.strokeStyle = JH.GOLD; c.lineWidth = 7; c.setLineDash([16, 10]); c.lineDashOffset = -lt * 50; c.beginPath(); c.moveTo(1230, 520); c.quadraticCurveTo(1500, 380, 1230 + 380 * u, 520 - 200 * u); c.stroke(); c.restore(); if (u > .9) K.card(c, 'BEIJING', lt, { at: tB, x: 1660, y: 300, px: 48, rot: 3, bg: '#c8282e', color: '#fff' }); },

      S.D.sfx = [[tY, 'tick', .2], [tAl, 'pop', .25], [tE, 'alarm', .08], [tD, 'tick', .25], [tF, 'whoosh_soft', .25], [tB, 'pop', .25], [tR, 'stamp', .4]]; } },

  // 7.03 Taiwan: Alice walks a wet street at night, a man tails her at a distance; Singapore: an interview-room door opens, RELEASED; Singapore's line
  { plate: 'rain_street', cam: { z: [1.7, 1.75], x: [900, 1800], y: [1000, 990] }, bed: [['rain_loop', .2], ['city_loop', .08]], light: { dir: -1, key: 'rgba(255,210,170,.22)' },

<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';

const SW = 1920, SH = 1080, INK = '#2a1a22', GOLD = '#e8b44a', RED = '#d0201a', GREEN = '#3f9a4a';
const pop = (lt, at, d = .45) => E.back(K.seg(lt, at, at + d));
const plateAt = (c, name, px, py, sx, sy, z) => { const s2 = z * 1920 / 2560; c.setTransform(s2, 0, 0, s2, sx - px * s2, sy - py * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); return s2; };

// seated figure on an office chair (chair drawn behind, so nothing floats)

  c.save(); c.translate(o.x - (o.facing ?? 1) * 10, 0); c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(0, o.y + 4, 110, 16, 0, 0, 7); c.fill(); c.strokeStyle = INK; c.lineWidth = 5; c.fillStyle = '#2a2a30';
  c.beginPath(); c.roundRect(-80 - (o.facing ?? 1) * 30, hip - 10, 160, 30, 10); c.fill(); c.stroke(); c.beginPath(); c.roundRect(-(o.facing ?? 1) * 95 - 18, hip - 210, 36, 210, 12); c.fill(); c.stroke(); c.fillRect(-8, hip + 20, 16, o.y - hip - 40); c.strokeRect(-8, hip + 20, 16, o.y - hip - 40);
  for (const dx of [-70, 0, 70]) { c.beginPath(); c.moveTo(0, o.y - 22); c.lineTo(dx, o.y - 6); c.stroke(); c.beginPath(); c.arc(dx, o.y - 6, 8, 0, 7); c.fill(); } c.restore();
  R.figure(c, Object.assign({}, o, { t: lt })); };

const backdrop = (name, dim = .55, blur = 6) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${1 - dim})`; plateAt(c, name, 1280, 720, 960, 540, 1.05); c.restore(); c.setTransform(1, 0, 0, 1, 0, 0); };

const tile = (c, x, y, txt, a, col = '#7ac8ff', s = 1) => { if (a <= 0) return; c.save(); c.translate(x, y); c.scale(a * s, a * s); c.shadowColor = col; c.shadowBlur = 24; c.fillStyle = 'rgba(10,20,40,.85)'; c.strokeStyle = col; c.lineWidth = 4; c.beginPath(); c.roundRect(-80, -34, 160, 68, 10); c.fill(); c.stroke(); c.shadowBlur = 0; c.font = '32px Anton'; c.fillStyle = col; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(txt, 0, 2); c.restore(); };
// padlocked door set into the ice (world)
const lockDoor = (c, x, y, txt, a, lt) => { if (a <= 0) return; c.save(); c.translate(x, y); c.scale(a, a); c.fillStyle = 'rgba(8,24,40,.8)'; c.strokeStyle = '#bfe4ff'; c.lineWidth = 5; c.beginPath(); c.roundRect(-70, -110, 140, 200, [60, 60, 6, 6]); c.fill(); c.stroke();
  c.fillStyle = '#e8b44a'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.roundRect(-26, -6, 52, 44, 6); c.fill(); c.stroke(); c.strokeStyle = '#c9a040'; c.lineWidth = 8; c.beginPath(); c.arc(0, -8, 16, Math.PI, 0); c.stroke(); c.fillStyle = INK; c.beginPath(); c.arc(0, 14, 6, 0, 7); c.fill();

  c.fillStyle = '#6a4630'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.moveTo(-120, -40); c.lineTo(110, -40); c.quadraticCurveTo(90, 10, 60, 14); c.lineTo(-90, 14); c.quadraticCurveTo(-118, 0, -120, -40); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#8a5e40'; c.fillRect(-116, -40, 222, 10); c.restore(); };

const codes = ['1A1zP1eP5QGefi2DMPTfTL5SLmv7Divf', 'bc1qxy2kgdygjrsqtzq2n0yrf2493p83k', '3J98t1WpEZ73CNmQviecrnyiWrnqRhWN', '1BvBMSEYstWetqTFn5Au4m4GFg7xJaNV', 'bc1q9h7garjhd2kk8wz0n4ytq2f6x9e8p', '1Hz96kJKF2HLPGY15JWLB5m9qGNxvt8t', '3FZbgi29cpjq2GjdwV8eyHuJJnkLtktZ', 'bc1qa5wkgaew2dkv56kfvj49j0av5nml4'];
const scroll = (c, x, y, w, u, lt, hi = -1, hiA = 0) => { const h = 760 * E.out(u); if (h <= 2) return; c.save(); c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(x - w / 2 + 14, y + 14, w, h); const g = c.createLinearGradient(x - w / 2, 0, x + w / 2, 0); g.addColorStop(0, '#d8c8a0'); g.addColorStop(.5, '#f2e8cc'); g.addColorStop(1, '#d8c8a0'); c.fillStyle = g; c.fillRect(x - w / 2, y, w, h); c.strokeStyle = INK; c.lineWidth = 4; c.strokeRect(x - w / 2, y, w, h);
  c.beginPath(); c.rect(x - w / 2, y, w, h); c.clip(); c.font = '26px Oswald'; c.textAlign = 'left'; for (let k = 0; k < 16; k++) { const ly = y + 50 + k * 46 - (lt * 8 % 46); const i = k % codes.length, j = (k + 3) % codes.length; if (k === hi) { c.fillStyle = `rgba(255,214,90,${.55 * hiA})`; c.fillRect(x - w / 2 + 10, ly - 30, w - 20, 42); } c.fillStyle = '#3a2a1a'; c.fillText(codes[i].slice(0, 14) + '…  →  ' + codes[j].slice(0, 14) + '…   ' + (0.1 + (k * 37 % 90) / 10).toFixed(2) + ' BTC', x - w / 2 + 30, ly); } c.restore();

// browser window frame (screen)

const stars = (c, x, y, n, sz = 26, a = 1) => { c.save(); c.globalAlpha *= a; for (let k = 0; k < 5; k++) { c.save(); c.translate(x + k * sz * 2.1, y); c.beginPath(); for (let q = 0; q < 10; q++) { const r = q % 2 ? sz * .45 : sz, an = -Math.PI / 2 + q * Math.PI / 5; c.lineTo(Math.cos(an) * r, Math.sin(an) * r); } c.closePath(); c.fillStyle = k < n ? GOLD : '#cfc6b4'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke(); c.restore(); } c.restore(); };
// plain brown parcel (screen or world)
const parcel = (c, x, y, s = 1, rot = 0) => { c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s); c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(-56, -36, 124, 84); c.fillStyle = '#c8a070'; c.strokeStyle = INK; c.lineWidth = 4; c.fillRect(-62, -44, 124, 84); c.strokeRect(-62, -44, 124, 84); c.fillStyle = '#e8d8b0'; c.fillRect(-14, -44, 28, 84); c.fillStyle = '#fbf8f0'; c.fillRect(14, -30, 40, 26); c.restore(); };
const sellerCard = (c, x, y, name, n, a, dy = 0, fade = 1) => { if (a <= 0) return; c.save(); c.translate(x, y + dy); c.scale(a * 1.5, a * 1.5); c.globalAlpha = fade; c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(-196, -110, 404, 236); c.fillStyle = '#fbf8f0'; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.roundRect(-206, -120, 412, 236, 16); c.fill(); c.stroke(); parcel(c, -120, -10, .9); c.font = '36px Anton'; c.fillStyle = INK; c.textAlign = 'left'; c.fillText(name, -40, -50); stars(c, -26, 10, n, 20); c.font = '26px Oswald'; c.fillStyle = '#6a5a4a'; c.fillText(n >= 4 ? '“arrived fast”' : '“never came”', -40, 80); c.restore(); };
const vault = (c, x, y, s, open, lt) => { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(-150, -150, 320, 320); c.fillStyle = '#7a8088'; c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.roundRect(-160, -160, 320, 320, 20); c.fill(); c.stroke(); c.save(); c.translate(-160, 0); c.scale(1 - .85 * open, 1); c.fillStyle = '#9aa0a8'; c.beginPath(); c.roundRect(10, -140, 300, 280, 14); c.fill(); c.stroke(); c.translate(160, 0); c.rotate(lt * (open ? 0 : .4)); c.strokeStyle = '#3a3e46'; c.lineWidth = 10; c.beginPath(); c.arc(0, 0, 60, 0, 7); c.stroke(); for (let k = 0; k < 4; k++) { c.rotate(Math.PI / 2); c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 80); c.stroke(); } c.restore(); c.font = '40px Anton'; c.fillStyle = '#fffaf0'; c.textAlign = 'center'; c.fillText('ESCROW', 0, 220); c.restore(); };

const SENATOR = { costume: 'suit', hair: 'swept', hairCol: '#c8c4bc', seed: 31, glasses: true };
const paper = (c, x, y, s, rot, head, sub, a) => { if (a <= 0) return; c.save(); c.translate(x, y); c.rotate(rot); c.scale(s * a, s * a); c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(-250, -310, 520, 640); c.fillStyle = '#f2ecdc'; c.strokeStyle = INK; c.lineWidth = 4; c.fillRect(-260, -320, 520, 640); c.strokeRect(-260, -320, 520, 640); c.font = '28px SourceSerif'; c.fillStyle = INK; c.textAlign = 'center'; c.fillText(sub, 0, -270); c.fillRect(-230, -255, 460, 4); c.font = '58px Anton'; head.split('\n').forEach((t, i) => c.fillText(t, 0, -180 + i * 64)); c.fillStyle = 'rgba(42,26,34,.3)'; for (let k = 0; k < 9; k++) { c.fillRect(-230, -20 + k * 34, 210, 10); c.fillRect(20, -20 + k * 34, 210, 10); } c.restore(); };

window.SHOTS = [
  // 1 a street corner at night: two risks
  { plate: 'alley', cam: { z: [1.12, 1.2], x: [1500, 1560], y: [820, 840], ease: E.io }, bed: [['rain_loop', .6], ['city_loop', .2]],

    init: S => { const tR = A.at(S, 'rob', 3.6); S.tP = A.at(S, 'police', 5.2);
      S.D.over = [(c, lt) => K.card(c, 'RISK 1: ROBBED', lt, { at: tR, x: 440, y: 240, px: 56, rot: -4 }), (c, lt) => K.card(c, 'RISK 2: POLICE', lt, { at: S.tP, x: 1480, y: 240, px: 56, rot: 3 })];
      S.D.sfx = [[.3, 'footsteps', .3], [tR, 'hit', .45], [S.tP, 'alarm', .3]]; } },
  // 2 the hidden market dressed like a normal online shop
  { draw: (c, lt, u, S) => { backdrop('office', .6)(c); browser(c, 260, 140, 1400, 800, pop(lt, .3, .6)); if (lt > .5) { c.save(); c.font = '52px Anton'; c.fillStyle = INK; c.textAlign = 'left'; c.fillText('HIDDEN MARKET', 320, 290); for (let k = 0; k < 6; k++) { const a = pop(lt, .8 + k * .18); if (a <= 0) continue; const x = 320 + (k % 3) * 440, y = 360 + Math.floor(k / 3) * 280; c.save(); c.translate(x, y); c.globalAlpha = Math.min(1, a); c.fillStyle = '#fffdf6'; c.strokeStyle = '#c8bca8'; c.lineWidth = 3; c.fillRect(0, 0, 400, 240); c.strokeRect(0, 0, 400, 240); parcel(c, 90, 110, .9); stars(c, 190, 80, 3 + (k % 3), 14); c.fillStyle = '#d8cfbe'; c.fillRect(190, 120, 170, 14); c.fillRect(190, 150, 120, 14); c.restore(); } c.restore(); } },
    bed: [['hum_loop', .3]],

  { draw: (c, lt, u, S) => { backdrop('office', .6)(c); wallet(c, 300, 560, 'BUYER', 1); wallet(c, 1620, 560, 'SELLER', 1); const open = E.io(K.seg(lt, S.tC + .6, S.tC + 1.2)); vault(c, 960, 520, .9, open, lt);

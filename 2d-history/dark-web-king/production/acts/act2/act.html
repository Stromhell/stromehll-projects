<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}@font-face{font-family:SourceSerif;src:url(../../../../shared/fonts/SourceSerif4.ttf)}body{margin:0;background:#000}</style></head>

  c.save(); c.translate(o.x - (o.facing ?? 1) * 10, 0); c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(0, o.y + 4, 110, 16, 0, 0, 7); c.fill(); c.strokeStyle = INK; c.lineWidth = 5; c.fillStyle = '#2a2a30';
  c.beginPath(); c.roundRect(-80 - (o.facing ?? 1) * 30, hip - 10, 160, 30, 10); c.fill(); c.stroke(); c.beginPath(); c.roundRect(-(o.facing ?? 1) * 95 - 18, hip - 210, 36, 210, 12); c.fill(); c.stroke(); c.fillRect(-8, hip + 20, 16, o.y - hip - 40); c.strokeRect(-8, hip + 20, 16, o.y - hip - 40);

const book = (c, x, y, open, col, title, glow, lt) => { c.save(); c.translate(x, y); if (glow) { const g = c.createRadialGradient(0, 0, 20, 0, 0, 420); g.addColorStop(0, `rgba(255,220,130,${.45 * glow})`); g.addColorStop(1, 'rgba(255,220,130,0)'); c.fillStyle = g; c.fillRect(-420, -420, 840, 840); }
  const w = 260; c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 5; if (open < .02) { c.fillRect(-w / 2, -170, w, 340); c.strokeRect(-w / 2, -170, w, 340); c.font = '34px Anton'; c.fillStyle = '#f2e6c8'; c.textAlign = 'center'; title.split('\n').forEach((t, i) => c.fillText(t, 0, -40 + i * 44)); }

  { draw: (c, lt, u, S) => { backdrop('office', .7)(c); const m = E.io(K.seg(lt, S.tF, S.tF + 1.2)); DW.onion(c, 620 + 340 * m, 520, .9 * (1 - .5 * m), 5, lt); c.save(); c.globalAlpha = 1 - m; DW.bigCoin(c, 1300 - 340 * m, 520, 110, 1); c.restore();
      const a = K.seg(lt, S.tF + 1, S.tF + 1.6); if (a > 0) { c.save(); c.globalAlpha = a; c.shadowColor = GOLD; c.shadowBlur = 40; c.strokeStyle = GOLD; c.lineWidth = 8; c.beginPath(); c.roundRect(560, 760, 800, 150, 20); c.stroke(); c.font = '84px Anton'; c.fillStyle = '#ffe6a0'; c.textAlign = 'center'; c.fillText('HIDDEN MARKET', 960, 868); c.restore(); } },

          c.strokeStyle = 'rgba(30,30,60,.8)'; c.lineWidth = 3; for (let l = 0; l < 12; l++) { c.beginPath(); for (let x = -220; x < 200 - (l % 3) * 50; x += 6) c.lineTo(x, -250 + l * 40 + Math.sin(x * .2 + l) * 5 + Math.sin(x * .05) * 3); c.stroke(); } c.font = '40px Anton'; c.fillStyle = INK; c.textAlign = 'center'; c.fillText('JOURNAL · 2010', 0, -280); c.restore(); },

];

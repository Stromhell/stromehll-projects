<!doctype html><html><head><meta charset="utf-8"><title>AH act 5 - beads and a flute</title>
<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}@font-face{font-family:SourceSerif;src:url(../../../../shared/fonts/SourceSerif4.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/rig_v5.js"></script><script src="../../../../shared/rig_leo.js"></script><script>window.RIGSTYLE = "leo";</script><script src="../../../../shared/kit.js"></script><script src="../../../../shared/anim.js"></script>
<script src="timing.js"></script>
<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/', INK = '#2b1e16', CREAM = '#f6eedc', GOLD = '#e8b44a', RED = '#c8402e', GREEN = '#3f7a3a';
for (const n of ['camp_shade', 'cape_map', 'europe_map', 'ice_night']) K.load(n, PL + n + '.jpg');
{ const T = window.TIMING, L = T.shots[T.shots.length - 1]; L.end += 1.8; T.dur = L.end; }
const pop = (lt, at, d = .45) => E.back(K.seg(lt, at, at + d));
const font = (px, fam = 'Anton') => `${px}px ${fam}, Oswald, sans-serif`;
const spear = (x, y, k) => (c) => { if (k <= 0) return; c.save(); c.translate(x, y); c.scale(k, k); c.fillStyle = 'rgba(30,18,8,.35)'; c.beginPath(); c.ellipse(-30, 4, 70, 12, 0, 0, 7); c.fill(); c.fillStyle = '#7a5a34'; c.beginPath(); c.ellipse(0, 2, 26, 9, 0, 0, 7); c.fill(); c.rotate(-.12); c.strokeStyle = R.INK; c.lineWidth = 15; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -470); c.stroke(); c.strokeStyle = '#8a5a32'; c.lineWidth = 9; c.stroke(); c.fillStyle = '#6a6458'; c.strokeStyle = R.INK; c.lineWidth = 3; c.beginPath(); c.moveTo(-17, -460); c.lineTo(0, -540); c.lineTo(17, -460); c.closePath(); c.fill(); c.stroke(); c.strokeStyle = '#c8a878'; c.lineWidth = 4; for (let k2 = 0; k2 < 4; k2++) { c.beginPath(); c.moveTo(-8, -450 + k2 * 7); c.lineTo(8, -446 + k2 * 7); c.stroke(); } c.restore(); };
const hide = (x, y, w, k, col = '#8b5e3a') => (c) => { if (k <= 0) return; c.save(); c.translate(x, y); c.scale(k, k); c.fillStyle = 'rgba(30,18,8,.3)'; c.beginPath(); c.ellipse(0, 6, w * .55, w * .1, 0, 0, 7); c.fill(); c.fillStyle = col; c.strokeStyle = R.INK; c.lineWidth = 3; c.beginPath(); c.moveTo(-w / 2, 0); c.quadraticCurveTo(-w * .4, -w * .2, -w * .1, -w * .16); c.quadraticCurveTo(w * .2, -w * .26, w * .48, -w * .08); c.quadraticCurveTo(w * .55, 0, w * .4, w * .04); c.quadraticCurveTo(0, w * .1, -w / 2, 0); c.fill(); c.stroke();
  c.strokeStyle = 'rgba(40,20,8,.35)'; c.lineWidth = 2; for (let j = 0; j < 14; j++) { const hx = -w * .4 + j * w * .06; c.beginPath(); c.moveTo(hx, -w * .1); c.lineTo(hx + 6, -w * .02); c.stroke(); } c.restore(); };
const firePit = (x, y, k = 1) => (c) => { c.save(); c.translate(x, y); c.scale(k, k); c.fillStyle = 'rgba(20,10,4,.45)'; c.beginPath(); c.ellipse(0, 4, 70, 16, 0, 0, 7); c.fill(); c.fillStyle = '#1a120c'; c.beginPath(); c.ellipse(0, 0, 46, 11, 0, 0, 7); c.fill();
  c.lineCap = 'round'; for (const [a, b2, col] of [[-.3, .3, '#5a3a22'], [.4, -.2, '#6a4628'], [3, 2.8, '#4a2e18']]) { c.strokeStyle = R.INK; c.lineWidth = 15; c.beginPath(); c.moveTo(Math.cos(a) * -48, -4 + Math.sin(a) * 6); c.lineTo(Math.cos(b2) * 40, -12); c.stroke(); c.strokeStyle = col; c.lineWidth = 10; c.stroke(); }
  for (let k2 = 0; k2 < 11; k2++) { const an = k2 / 11 * Math.PI * 2; const sx = Math.cos(an) * 62, sy = Math.sin(an) * 15 + 2; c.fillStyle = k2 % 2 ? '#7a7064' : '#8f8678'; c.strokeStyle = R.INK; c.lineWidth = 2.5; c.beginPath(); c.ellipse(sx, sy, 15, 9, 0, 0, 7); c.fill(); c.stroke(); } c.restore(); };
// the band: hunter (our 'you'), a woman, an elder, a younger man
const HUNTER = { costume: 'hide', hair: 'long', beard: true, seed: 3 };
const WOMAN = { costume: 'hideW', hair: 'bun', hairCol: '#2a1a10', seed: 5 };
const ELDER = { costume: 'hide', hair: 'bald', beard: true, seed: 8 };
const YOUNG = { costume: 'hideBare', hair: 'curly', seed: 9 };
const FIRE = [1075, 1308];
const camp = () => [firePit(FIRE[0], FIRE[1], .7), (c, lt) => A.fire(FIRE[0], FIRE[1] - 6, .42, { glow: 220 })(c, lt), A.smoke(FIRE[0], FIRE[1] - 48, 1)];
// eating: near hand comes up to the mouth now and then
const eat = (ph = 0) => (o, lt) => { const r = Math.max(0, Math.sin(lt * 1.6 + ph)); if (r > .2) o.arms = (t, P) => ({ shR: K.lerp(P.shR, 70, r), elR: K.lerp(P.elR, -150, r) }); };
// skewer of meat / pile of nuts (world)
const skewer = (x, y, k) => (c) => { if (k <= 0) return; c.save(); c.translate(x, y); c.scale(k, k); c.strokeStyle = '#6a4a2a'; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.moveTo(-40, 10); c.lineTo(40, -40); c.stroke(); for (let i = 0; i < 3; i++) { c.fillStyle = ['#8a3a22', '#9a4a2a', '#7a321e'][i]; c.strokeStyle = INK; c.lineWidth = 2.5; c.beginPath(); c.ellipse(-16 + i * 20, -2 - i * 12, 15, 11, -.5, 0, 7); c.fill(); c.stroke(); } c.restore(); };
const nuts = (x, y, k) => (c) => { if (k <= 0) return; c.save(); c.translate(x, y); c.scale(k, k); c.fillStyle = 'rgba(30,18,8,.3)'; c.beginPath(); c.ellipse(0, 4, 50, 10, 0, 0, 7); c.fill(); c.fillStyle = '#9a7a4a'; c.strokeStyle = INK; c.lineWidth = 2.5; c.beginPath(); c.ellipse(0, 0, 46, 12, 0, 0, 7); c.fill(); c.stroke(); for (let i = 0; i < 12; i++) { c.fillStyle = i % 2 ? '#8a5a2a' : '#b07a3a'; c.beginPath(); c.ellipse(-30 + (i % 6) * 12, -6 - Math.floor(i / 6) * 8, 7, 5, 0, 0, 7); c.fill(); c.stroke(); } c.restore(); };
// speech bubble (world) with an icon drawer
const bubble = (x, y, at, until, draw, label) => (c, lt) => { const p = pop(lt, at) * (1 - K.seg(lt, until - .3, until)); if (p <= 0) return; c.save(); c.translate(x, y); c.scale(p, p); c.fillStyle = CREAM; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.roundRect(-110, -150, 220, 130, 24); c.fill(); c.stroke(); c.beginPath(); c.moveTo(-20, -22); c.lineTo(-6, 18); c.lineTo(14, -22); c.closePath(); c.fill(); c.stroke(); c.fillStyle = CREAM; c.fillRect(-18, -26, 30, 8);
  c.save(); c.translate(0, -105); draw(c, lt); c.restore(); c.fillStyle = INK; c.font = font(26, 'Oswald'); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(label, 0, -46); c.restore(); };
const drop = (c) => { c.fillStyle = '#4a8ac0'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(0, -30); c.bezierCurveTo(-24, 0, -18, 22, 0, 22); c.bezierCurveTo(18, 22, 24, 0, 0, -30); c.fill(); c.stroke(); c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.ellipse(-7, 6, 4, 8, -.3, 0, 7); c.fill(); };
const hooves = (c) => { c.fillStyle = '#5a3a20'; for (const [x, y] of [[-40, 8], [-12, -6], [16, 8], [44, -6]]) { c.beginPath(); c.ellipse(x - 5, y, 5, 9, -.2, 0, 7); c.ellipse(x + 5, y, 5, 9, .2, 0, 7); c.fill(); } };
// drying rack with meat strips (world)
const meatRack = (x, y, k, n) => (c, lt) => { if (k <= 0) return; c.save(); c.translate(x, y); c.scale(k, k); c.fillStyle = 'rgba(30,18,8,.3)'; c.beginPath(); c.ellipse(0, 6, 150, 16, 0, 0, 7); c.fill(); c.strokeStyle = INK; c.lineWidth = 12; c.lineCap = 'round'; c.beginPath(); c.moveTo(-120, 0); c.lineTo(-110, -200); c.moveTo(120, 0); c.lineTo(110, -200); c.moveTo(-130, -190); c.lineTo(130, -190); c.stroke(); c.strokeStyle = '#7a5434'; c.lineWidth = 7; c.stroke();
  for (let i = 0; i < n; i++) { const sx = -95 + i * 32, sw = Math.sin(lt * 1.3 + i) * .05; c.save(); c.translate(sx, -186); c.rotate(sw); c.fillStyle = i % 2 ? '#8a3a22' : '#a04a2a'; c.strokeStyle = INK; c.lineWidth = 2.5; c.beginPath(); c.moveTo(-9, 0); c.lineTo(9, 0); c.lineTo(7, 70 + (i % 3) * 14); c.lineTo(-6, 76 + (i % 3) * 14); c.closePath(); c.fill(); c.stroke(); c.restore(); } c.restore(); };
// basket held in hand (hand-local)
const basket = { near: (c) => { c.rotate(0); c.fillStyle = '#b08a4a'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(-34, 14); c.lineTo(34, 14); c.lineTo(26, 60); c.lineTo(-26, 60); c.closePath(); c.fill(); c.stroke(); c.strokeStyle = 'rgba(60,40,20,.5)'; c.lineWidth = 2; for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(-30 + k * 3, 24 + k * 10); c.lineTo(30 - k * 3, 24 + k * 10); c.stroke(); } c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.arc(0, 14, 30, Math.PI, 0); c.stroke(); } };
const hammerstone = { near: (c) => { c.fillStyle = '#8a8478'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.ellipse(0, 16, 16, 12, .3, 0, 7); c.fill(); c.stroke(); } };
const scraper = { near: (c) => { c.fillStyle = '#6a6458'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(-18, 10); c.lineTo(18, 10); c.lineTo(12, 30); c.lineTo(-12, 30); c.closePath(); c.fill(); c.stroke(); } };
// stone flakes popping off at a point (world)
const flakes = (x, y, t0, t1, rate = 1.6) => (c, lt) => { if (lt < t0 || lt > t1 + 1) return; for (let k = 0; k < 10; k++) { const ph = ((lt - t0) * rate + k / 10) % 1; if (lt > t1 && ph < .1) continue; const a = -1.6 + (k % 5 - 2) * .35, d = ph * 90; c.fillStyle = `rgba(200,195,180,${1 - ph})`; c.strokeStyle = `rgba(43,30,22,${1 - ph})`; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x + Math.cos(a) * d, y + Math.sin(a) * d + ph * ph * 60); c.lineTo(x + Math.cos(a) * d + 8, y + Math.sin(a) * d + ph * ph * 60 + 3); c.lineTo(x + Math.cos(a) * d + 2, y + Math.sin(a) * d + ph * ph * 60 + 8); c.closePath(); c.fill(); c.stroke(); } };
// spear shaft lying on the ground with a stone point (world)
const shaft = (x, y, k, sharp) => (c) => { c.save(); c.translate(x, y); c.scale(k, k); c.fillStyle = 'rgba(30,18,8,.3)'; c.beginPath(); c.ellipse(0, 4, 200, 10, 0, 0, 7); c.fill(); c.rotate(-.04); c.strokeStyle = INK; c.lineWidth = 12; c.lineCap = 'round'; c.beginPath(); c.moveTo(-200, 0); c.lineTo(170, 0); c.stroke(); c.strokeStyle = '#8a6a3e'; c.lineWidth = 7; c.stroke();
  c.fillStyle = sharp ? '#b8b0a0' : '#8a8478'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(160, -12); c.lineTo(160 + 40 + sharp * 26, 0); c.lineTo(160, 12); c.closePath(); c.fill(); c.stroke(); if (sharp > .5) { c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 2; c.beginPath(); c.moveTo(168, -6); c.lineTo(190 + sharp * 20, -1); c.stroke(); } c.restore(); };
// screen-space checklist card
const checklist = (c, lt, x, y, rows) => { const n = rows.filter(r => lt > r[1]).length; if (!n) return; const a = K.seg(lt, rows[0][1], rows[0][1] + .3); c.save(); c.globalAlpha = a; c.translate(x, y); c.rotate(-.03); const w = 470, h = 70 + rows.length * 66; c.fillStyle = 'rgba(20,12,6,.35)'; c.fillRect(10, 12, w, h); c.fillStyle = CREAM; c.fillRect(0, 0, w, h); c.strokeStyle = INK; c.lineWidth = 5; c.strokeRect(0, 0, w, h);
  rows.forEach(([txt, at], i) => { const yy = 60 + i * 66; c.strokeStyle = INK; c.lineWidth = 3; c.strokeRect(30, yy - 22, 40, 40); c.fillStyle = INK; c.font = font(38, 'Caveat'); c.textBaseline = 'middle'; c.fillText(txt, 90, yy); const p = K.seg(lt, at, at + .3); if (p > 0) { c.strokeStyle = GREEN; c.lineWidth = 8; c.lineCap = 'round'; c.beginPath(); c.moveTo(34, yy); c.lineTo(34 + 14 * Math.min(1, p * 2), yy + 14 * Math.min(1, p * 2)); if (p > .5) c.lineTo(48 + 30 * (p - .5) * 2, yy + 14 - 34 * (p - .5) * 2); c.stroke(); } }); c.restore(); };
// screen-space sun-arc dial: dawn -> early afternoon
const sunArc = (c, lt, at, x, y) => { const a = K.seg(lt, at, at + .4); if (a <= 0) return; const u = E.io(K.seg(lt, at + .3, at + 2.6)); c.save(); c.globalAlpha = a; c.translate(x, y); c.fillStyle = 'rgba(20,12,6,.55)'; c.beginPath(); c.roundRect(-300, -230, 600, 340, 20); c.fill(); c.strokeStyle = 'rgba(246,238,220,.6)'; c.lineWidth = 4; c.setLineDash([12, 10]); c.beginPath(); c.arc(0, 20, 220, Math.PI, 0); c.stroke(); c.setLineDash([]);
  c.fillStyle = 'rgba(246,238,220,.85)'; c.font = font(26, 'Oswald'); c.textAlign = 'center'; c.fillText('DAWN', -220, 50); c.fillText('DUSK', 220, 50); const an = Math.PI + u * Math.PI * .62, sx = Math.cos(an) * 220, sy = 20 + Math.sin(an) * 220; const g = c.createRadialGradient(sx, sy, 0, sx, sy, 70); g.addColorStop(0, 'rgba(255,220,120,.9)'); g.addColorStop(1, 'rgba(255,200,80,0)'); c.fillStyle = g; c.beginPath(); c.arc(sx, sy, 70, 0, 7); c.fill(); c.fillStyle = '#ffd25a'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.arc(sx, sy, 26, 0, 7); c.fill(); c.stroke();
  if (u > .95) { c.fillStyle = GOLD; c.font = font(34, 'Anton'); c.fillText('EARLY AFTERNOON', 0, 92); } c.restore(); };

// ---------- act 3: the persistence hunt ----------
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const plateAt = (c, name, px, py, sx, sy, z) => { const s2 = z * 1920 / 2560; c.setTransform(s2, 0, 0, s2, sx - px * s2, sy - py * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); return s2; };
const hoursClock = (lt, at) => (c) => { const a = pop(lt, at, .5); if (a <= 0) return; const x = 170, y = 170; c.save(); c.translate(x, y); c.scale(a, a); c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.arc(6, 8, 110, 0, 7); c.fill(); c.fillStyle = '#f6eedc'; c.beginPath(); c.arc(0, 0, 110, 0, 7); c.fill(); c.strokeStyle = R.INK; c.lineWidth = 7; c.stroke();
  for (let k = 0; k < 12; k++) { const an = k / 12 * Math.PI * 2; c.lineWidth = k % 3 ? 3 : 6; c.beginPath(); c.moveTo(Math.cos(an) * 84, Math.sin(an) * 84); c.lineTo(Math.cos(an) * 98, Math.sin(an) * 98); c.stroke(); } const sp = (lt - at) * 2.4; c.lineCap = 'round'; c.lineWidth = 9; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(sp / 12 - 1.57) * 52, Math.sin(sp / 12 - 1.57) * 52); c.stroke(); c.lineWidth = 6; c.strokeStyle = '#b8241c'; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(sp - 1.57) * 80, Math.sin(sp - 1.57) * 80); c.stroke(); c.fillStyle = R.INK; c.beginPath(); c.arc(0, 0, 9, 0, 7); c.fill(); c.restore(); };
const parchBg = (c) => { K.parchment(c, 0, 0, 1920, 1080); c.save(); c.globalAlpha = .08; c.strokeStyle = INK; c.lineWidth = 2; for (let i = 0; i < 60; i++) { const x = (i * 337) % 1920, y = (i * 191) % 1080; c.beginPath(); c.moveTo(x, y); c.lineTo(x + 40, y + 3); c.stroke(); } c.restore(); };
const LEE = { costume: 'shirt', hair: 'short', hairCol: '#5a3a22', glasses: true, seed: 21 };
const GATH = { costume: 'hideW', hair: 'bun', hairCol: '#1a120c', seed: 15 };
const GATH2 = { costume: 'hideW', hair: 'curly', hairCol: '#1a120c', seed: 17 };
const MAN = { costume: 'hide', hair: 'short', hairCol: '#1a120c', seed: 19 };
// notebook in hand (hand-local, +y along forearm)
const NOTE = (c) => { c.save(); c.rotate(-.9); c.translate(8, 30); c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(-24, -30, 52, 66); c.fillStyle = '#efe6cc'; c.strokeStyle = INK; c.lineWidth = 3; c.fillRect(-28, -34, 52, 66); c.strokeRect(-28, -34, 52, 66); c.fillStyle = '#6a3a24'; c.fillRect(-28, -34, 52, 9); c.strokeStyle = 'rgba(60,40,30,.45)'; c.lineWidth = 1.5; for (let k = 0; k < 5; k++) { c.beginPath(); c.moveTo(-22, -14 + k * 10); c.lineTo(18, -14 + k * 10); c.stroke(); } c.restore(); };
// gathering bag on the shoulder side
const BAG = (c) => { c.save(); c.translate(0, 34); c.fillStyle = '#8a6438'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(-26, 0); c.quadraticCurveTo(-30, 50, 0, 56); c.quadraticCurveTo(30, 50, 26, 0); c.closePath(); c.fill(); c.stroke(); c.strokeStyle = 'rgba(40,20,8,.35)'; c.lineWidth = 2; for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(-20 + k * 12, 8); c.lineTo(-16 + k * 12, 46); c.stroke(); } c.restore(); };
// 1960s Land Rover, side view (local: x centre, y = ground)
const landRover = (c, x, y, s, wr) => { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = 'rgba(30,18,8,.35)'; c.beginPath(); c.ellipse(0, 4, 300, 22, 0, 0, 7); c.fill();
  const body = '#7d8a68', dark = '#5b6649', light = '#9aa684'; c.strokeStyle = INK; c.lineWidth = 6; c.lineJoin = 'round';
  // canvas tilt at the back
  c.fillStyle = '#c8b48a'; c.beginPath(); c.moveTo(-270, -150); c.lineTo(-270, -300); c.quadraticCurveTo(-260, -320, -230, -322); c.lineTo(-20, -322); c.quadraticCurveTo(0, -320, 4, -300); c.lineTo(4, -150); c.closePath(); c.fill(); c.stroke(); c.strokeStyle = 'rgba(60,40,20,.35)'; c.lineWidth = 3; for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(-220 + k * 55, -318); c.lineTo(-220 + k * 55, -152); c.stroke(); } c.strokeStyle = INK; c.lineWidth = 6;
  // tub + cab
  c.fillStyle = body; c.beginPath(); c.moveTo(-290, -40); c.lineTo(-290, -160); c.lineTo(20, -160); c.lineTo(40, -290); c.lineTo(150, -290); c.lineTo(160, -170); c.lineTo(290, -160); c.lineTo(300, -40); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = light; c.fillRect(-286, -158, 300, 16); c.fillStyle = dark; c.fillRect(-286, -60, 584, 20);
  c.fillStyle = '#a8c0c8'; c.beginPath(); c.moveTo(52, -276); c.lineTo(140, -276); c.lineTo(148, -186); c.lineTo(42, -186); c.closePath(); c.fill(); c.stroke(); c.fillStyle = 'rgba(255,255,255,.4)'; c.beginPath(); c.moveTo(60, -270); c.lineTo(90, -270); c.lineTo(70, -192); c.lineTo(52, -192); c.fill();
  c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.moveTo(30, -170); c.lineTo(30, -50); c.moveTo(150, -170); c.lineTo(150, -50); c.stroke(); c.fillStyle = INK; c.fillRect(120, -120, 22, 7);
  // bonnet + spare wheel + grille
  c.fillStyle = '#2a2a26'; c.beginPath(); c.ellipse(225, -170, 50, 14, 0, 0, 7); c.fill(); c.stroke(); c.fillStyle = '#d8d4c0'; c.beginPath(); c.arc(292, -112, 15, 0, 7); c.fill(); c.lineWidth = 3; c.stroke();
  // wheels
  for (const wx of [-190, 200]) { c.fillStyle = '#2a2a26'; c.lineWidth = 6; c.beginPath(); c.arc(wx, -40, 62, 0, 7); c.fill(); c.stroke(); c.fillStyle = '#9aa684'; c.beginPath(); c.arc(wx, -40, 30, 0, 7); c.fill(); c.lineWidth = 3; c.stroke(); c.strokeStyle = '#3a3a34'; c.lineWidth = 4; for (let k = 0; k < 5; k++) { const a = wr + k * 1.2566; c.beginPath(); c.moveTo(wx + Math.cos(a) * 10, -40 + Math.sin(a) * 10); c.lineTo(wx + Math.cos(a) * 26, -40 + Math.sin(a) * 26); c.stroke(); } c.strokeStyle = INK; }
  c.fillStyle = 'rgba(255,240,210,.18)'; c.fillRect(-286, -158, 584, 30); c.restore(); };
// sepia grade in screen space
const sepia = (k = 1) => (c, lt) => { c.save(); c.globalCompositeOperation = 'color'; c.fillStyle = `rgba(150,110,60,${.85 * k})`; c.fillRect(0, 0, 1920, 1080); c.globalCompositeOperation = 'multiply'; const g = c.createRadialGradient(960, 540, 300, 960, 540, 1150); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, `rgba(90,60,30,${.6 * k})`); c.fillStyle = g; c.fillRect(0, 0, 1920, 1080); c.restore(); c.save(); c.globalAlpha = .07 * k; c.fillStyle = '#fff'; for (let i = 0; i < 40; i++) { const x = (i * 577 + Math.floor(lt * 24) * 131) % 1920; c.fillRect(x, 0, 2, 1080); } c.restore(); };
// red X

  const tw = Math.sin(lt * 18) * .25 * (u < 1 ? 1 : 0); c.save(); c.translate(0, -70); c.rotate(-.35 + tw); c.fillStyle = '#6a6a72'; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.moveTo(-6, -10); c.lineTo(0, 6); c.lineTo(6, -10); c.lineTo(14, -230); c.lineTo(-14, -230); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#8a6438'; c.fillRect(-26, -330, 52, 110); c.strokeRect(-26, -330, 52, 110); c.restore();

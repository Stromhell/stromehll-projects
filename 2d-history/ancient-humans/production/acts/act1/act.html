const redRing = (c, x, y, r, a) => { if (a <= 0) return; c.save(); c.strokeStyle = `rgba(220,50,40,${a})`; c.lineWidth = 7; c.beginPath(); c.arc(x, y, r * (1 + (1 - a) * .25), 0, 7); c.stroke(); c.fillStyle = `rgba(230,60,40,${a * .25})`; c.fill(); c.restore(); };
// Upright (or lying) skeleton. x = centre, y = feet. H = total height. o: stock, worn, decay, rot (0..1 fake turn), hi {teeth,spine,knees} 0..1 highlights, out {} gets key points
function skeleton(c, x, y, H, o = {}) {
  const U = H / 7.4, st = o.stock ?? 1, sx = Math.cos((o.turn ?? 0) * Math.PI * 2) * .25 + .75, worn = !!o.worn;

    c.fillStyle = worn && i % 3 === 1 ? '#d6c49a' : BONE; c.beginPath(); c.roundRect(vx - w / 2, vy - h / 2, w, h, h * .35); c.fill(); c.stroke(); }

    c.fillStyle = BONE; for (let f = 0; f < 4; f++) { c.beginPath(); c.roundRect(wx - U * .12 + f * U * .06 * sd, wy + U * .05, U * .05, U * (.24 + (f === 1 || f === 2 ? .06 : 0)), U * .03); c.fill(); c.stroke(); } }
  // neck
  for (let i = 0; i < 3; i++) { c.beginPath(); c.roundRect(neckX - U * .1, neckY - i * U * .14 - U * .05, U * .2, U * .11, U * .04); c.fill(); c.stroke(); }

  c.beginPath(); c.ellipse(kx, ky - U * .15, U * .62, U * .6, 0, 0, 7); c.fill(); c.stroke();

  c.beginPath(); c.moveTo(kx, ky + U * .1); c.lineTo(kx - U * .07, ky + U * .25); c.lineTo(kx + U * .07, ky + U * .25); c.closePath(); c.fill();

}
// leader-line label that draws on (world coords)
function tag(c, lt, at, txt, ax, ay, lx, ly, opts = {}) { const a = K.seg(lt, at, at + .45); if (a <= 0) return; const out = 1 - K.seg(lt, (opts.until ?? 99) - .3, opts.until ?? 99); c.save(); c.globalAlpha = out;
  c.strokeStyle = opts.col || '#fff6dc'; c.lineWidth = 4; c.setLineDash([]); c.beginPath(); c.moveTo(ax, ay); c.lineTo(ax + (lx - ax) * a, ay + (ly - ay) * a); c.stroke(); c.fillStyle = opts.col || '#fff6dc'; c.beginPath(); c.arc(ax, ay, 7, 0, 7); c.fill();
  if (a > .6) { const b = E.back(K.seg(lt, at + .25, at + .6)); c.translate(lx, ly); c.scale(b, b); c.font = K.font(opts.px || 40, 'Oswald'); const w = c.measureText(txt).width + 36; const dx = opts.left ? -w : 0; c.fillStyle = 'rgba(29,23,18,.9)'; c.fillRect(dx, -30, w, 60); c.fillStyle = opts.col || '#e9b54a'; c.fillRect(opts.left ? -6 : dx, -30, 6, 60); c.fillStyle = '#fff6dc'; c.textBaseline = 'middle'; c.fillText(txt, dx + 18, 2); }
  c.restore(); }
// swinging hanging tag (world coords)
function hangTag(c, lt, at, x, y, txt, col, flipAt, txt2, col2) { const a = pop(lt, at, .5); if (a <= 0) return; const sw = Math.sin((lt - at) * 4) * Math.exp(-(lt - at) * .9) * .35; const f = flipAt != null ? K.seg(lt, flipAt, flipAt + .4) : 0, fl = Math.cos(f * Math.PI);

  const show = f < .5 ? txt : txt2, cc = f < .5 ? col : col2; c.font = K.font(show.length > 2 ? 40 : 76); const w = Math.max(110, c.measureText(show).width + 50), h = show.length > 2 ? 78 : 110;

// leather diary, screen coords. pages: (c, side, x, y, w, h) callbacks. turn 0..1 animates a page flip right->left.
function diary(c, cx, cy, s, left, right, turn = 0, nextRight) { const W2 = 620 * s, H2 = 760 * s; c.save();
  c.fillStyle = 'rgba(10,6,2,.45)'; c.beginPath(); c.roundRect(cx - W2 - 34 * s + 18, cy - H2 / 2 - 20 * s + 24, W2 * 2 + 68 * s, H2 + 40 * s, 22 * s); c.fill();

  c.strokeStyle = 'rgba(230,180,120,.35)'; c.lineWidth = 2; c.setLineDash([8, 7]); c.beginPath(); c.roundRect(cx - W2 - 22 * s, cy - H2 / 2 - 8 * s, W2 * 2 + 44 * s, H2 + 16 * s, 16 * s); c.stroke(); c.setLineDash([]);

const museumCam = { z: [1.05, 1.12], x: [1280, 1290], y: [640, 640] };

window.SHOTS = [

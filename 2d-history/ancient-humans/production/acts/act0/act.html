const bushHat = (c, hx, hy, hr) => { c.fillStyle = '#b89a62'; c.strokeStyle = R.INK; c.lineWidth = 2.5; c.beginPath(); c.ellipse(hx, hy - hr * .55, hr * 1.35, hr * .22, 0, 0, 7); c.fill(); c.stroke(); c.beginPath(); c.moveTo(hx - hr * .7, hy - hr * .6); c.quadraticCurveTo(hx - hr * .65, hy - hr * 1.35, hx, hy - hr * 1.32); c.quadraticCurveTo(hx + hr * .65, hy - hr * 1.35, hx + hr * .7, hy - hr * .6); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#5a3e22'; c.fillRect(hx - hr * .7, hy - hr * .78, hr * 1.4, hr * .16); };

// wall calendar UI that fills with blocks phrase by phrase
const calendar = (S) => { const tags = [['where to be', ['COMMUTE', 'STANDUP', 'MEETING', 'SCHOOL RUN']], ['what to finish', ['REPORT', 'EMAILS', 'DEADLINE', 'SLIDES', 'INVOICES']], ['how many hours', ['SHIFT', 'SHIFT', 'OVERTIME', 'CALL', 'CALL', 'TRAFFIC']]];
  const blocks = []; let k = 0; for (const [ph, names] of tags) { const t0 = A.at(S, ph, 1 + k * .4); names.forEach((n, j) => blocks.push({ t: t0 + j * .22, n, col: ['#d9534f', '#e0a43a', '#5b8bd0', '#7a9a52', '#9a6ac0'][(k + j) % 5], i: blocks.length })); k++; }

const mammoth = (c, x, y, s) => { c.save(); c.translate(x, y); c.scale(s, s); const ink = '#2a1a0e';

const textbook = (c, lt) => { c.save(); K.screen(c); c.fillStyle = '#e9dcbc'; c.fillRect(0, 0, 1920, 1080); for (let k = 0; k < 60; k++) { c.fillStyle = `rgba(120,90,50,${.03 + (k % 5) * .01})`; c.beginPath(); c.arc((k * 337) % 1920, (k * 211) % 1080, 60 + (k * 13) % 120, 0, 7); c.fill(); }

  c.globalCompositeOperation = 'multiply'; c.fillStyle = 'rgba(0,0,0,.08)'; for (let yy = by; yy < by + bh; yy += 7) for (let xx = bx + (yy % 14 ? 3 : 0); xx < bx + bw; xx += 7) { c.beginPath(); c.arc(xx, yy, 1.6, 0, 7); c.fill(); } c.restore();
  c.strokeStyle = '#3a2a1a'; c.lineWidth = 4; c.strokeRect(bx, by, bw, bh); c.fillStyle = '#3a2a1a'; c.font = 'italic 30px SourceSerif'; c.fillText('Fig. 12.  Early man, locked in a daily struggle to survive.', bx, by + bh + 46); c.restore(); };
const stamp = (lt, at) => (c) => { const p = K.seg(lt, at, at + .18); if (p <= 0) return; const sc = 1.8 - .8 * E.out(p); c.save(); c.translate(1300, 300); c.rotate(-.18); c.scale(sc, sc); c.globalAlpha = Math.min(1, p * 2) * .92; c.strokeStyle = '#b8241c'; c.lineWidth = 10; c.strokeRect(-330, -70, 660, 140); c.lineWidth = 3; c.strokeRect(-316, -56, 632, 112); c.fillStyle = '#b8241c'; c.font = '78px Anton'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('THE OFFICIAL STORY', 0, 4); c.restore(); };
const tear = (lt, at) => (c) => { const p = E.inn(K.seg(lt, at, at + 1.1)); if (p >= 1) return; if (lt < at) { textbook(c, lt); return; } const jag = []; for (let k = 0; k <= 24; k++) jag.push([960 + Math.sin(k * 2.7) * 26 + (k % 2 ? 14 : -14), k * 45]);
  for (const side of [-1, 1]) { c.save(); c.translate(side * p * 1100, p * 120); c.rotate(side * p * .12); c.beginPath(); if (side < 0) { c.moveTo(0, 0); for (const [x, y] of jag) c.lineTo(x, y); c.lineTo(0, 1080); } else { c.moveTo(1920, 0); for (const [x, y] of jag) c.lineTo(x, y); c.lineTo(1920, 1080); } c.closePath(); c.save(); c.clip(); textbook(c, lt); c.restore(); c.strokeStyle = '#fff8e6'; c.lineWidth = 6; c.beginPath(); for (const [x, y] of jag) c.lineTo(x, y); c.stroke(); c.restore(); } };

  c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(-92, 6, 190, 62); c.fillStyle = '#f6eedc'; c.beginPath(); c.moveTo(-95, 10); c.lineTo(-75, 0); c.lineTo(95, 0); c.lineTo(95, 60); c.lineTo(-75, 60); c.lineTo(-95, 50); c.closePath(); c.fill(); c.strokeStyle = R.INK; c.lineWidth = 3; c.stroke(); c.fillStyle = '#2a7a3a'; c.font = '34px Anton'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(txt, 6, 31); c.restore(); };
const hoursClock = (lt, at) => (c) => { const a = pop(lt, at, .5); if (a <= 0) return; const x = 170, y = 170; c.save(); c.translate(x, y); c.scale(a, a); c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.arc(6, 8, 110, 0, 7); c.fill(); c.fillStyle = '#f6eedc'; c.beginPath(); c.arc(0, 0, 110, 0, 7); c.fill(); c.strokeStyle = R.INK; c.lineWidth = 7; c.stroke();
  for (let k = 0; k < 12; k++) { const an = k / 12 * Math.PI * 2; c.lineWidth = k % 3 ? 3 : 6; c.beginPath(); c.moveTo(Math.cos(an) * 84, Math.sin(an) * 84); c.lineTo(Math.cos(an) * 98, Math.sin(an) * 98); c.stroke(); } const sp = (lt - at) * 2.4; c.lineCap = 'round'; c.lineWidth = 9; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(sp / 12 - 1.57) * 52, Math.sin(sp / 12 - 1.57) * 52); c.stroke(); c.lineWidth = 6; c.strokeStyle = '#b8241c'; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(sp - 1.57) * 80, Math.sin(sp - 1.57) * 80); c.stroke(); c.fillStyle = R.INK; c.beginPath(); c.arc(0, 0, 9, 0, 7); c.fill(); c.restore(); };
const spear = (x, y, k) => (c) => { if (k <= 0) return; c.save(); c.translate(x, y); c.scale(k, k); c.fillStyle = 'rgba(30,18,8,.35)'; c.beginPath(); c.ellipse(-30, 4, 70, 12, 0, 0, 7); c.fill(); c.fillStyle = '#7a5a34'; c.beginPath(); c.ellipse(0, 2, 26, 9, 0, 0, 7); c.fill(); c.rotate(-.12); c.strokeStyle = R.INK; c.lineWidth = 15; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -470); c.stroke(); c.strokeStyle = '#8a5a32'; c.lineWidth = 9; c.stroke(); c.fillStyle = '#6a6458'; c.strokeStyle = R.INK; c.lineWidth = 3; c.beginPath(); c.moveTo(-17, -460); c.lineTo(0, -540); c.lineTo(17, -460); c.closePath(); c.fill(); c.stroke(); c.strokeStyle = '#c8a878'; c.lineWidth = 4; for (let k2 = 0; k2 < 4; k2++) { c.beginPath(); c.moveTo(-8, -450 + k2 * 7); c.lineTo(8, -446 + k2 * 7); c.stroke(); } c.restore(); };

  c.strokeStyle = 'rgba(40,20,8,.35)'; c.lineWidth = 2; for (let j = 0; j < 14; j++) { const hx = -w * .4 + j * w * .06; c.beginPath(); c.moveTo(hx, -w * .1); c.lineTo(hx + 6, -w * .02); c.stroke(); } c.restore(); };

  c.lineCap = 'round'; for (const [a, b2, col] of [[-.3, .3, '#5a3a22'], [.4, -.2, '#6a4628'], [3, 2.8, '#4a2e18']]) { c.strokeStyle = R.INK; c.lineWidth = 15; c.beginPath(); c.moveTo(Math.cos(a) * -48, -4 + Math.sin(a) * 6); c.lineTo(Math.cos(b2) * 40, -12); c.stroke(); c.strokeStyle = col; c.lineWidth = 10; c.stroke(); }

<!doctype html><html><head><meta charset="utf-8"><title>RP act kit_test - kit</title>
<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}@font-face{font-family:SourceSerif;src:url(../../../../shared/fonts/SourceSerif4.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/rig_v5.js"></script><script src="../../../../shared/rig_leo.js"></script><script>window.RIGSTYLE = "gumball";</script><script src="../../../../shared/kit.js"></script><script src="../../../../shared/anim.js"></script>
<script src="../../tw_kit.js"></script><script src="../../xu_kit.js"></script><script src="../../jh_kit.js"></script><script src="../../pr_kit.js"></script><script src="../../rp_kit.js"></script>
<script src="timing.js"></script>
<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
const SW = 1920, SH = 1080, INK = TW.INK, RED = TW.RED, pop = TW.pop, fade = TW.fade;
const backdrop = (name, b = .5, blur = 8) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${b})`; const s2 = 1.06 * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 720 * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); c.restore(); K.screen(c); };
const CARRY = () => ({ shL: 30, elL: -75, shR: 35, elR: -75 });
const endTitle = (secs) => { const T = window.TIMING; const last = T.shots[T.shots.length - 1]; T.shots.push({ i: T.shots.length, start: last.end, end: last.end + secs, vo_start: last.end, vo_end: last.end, text: '' }); T.dur = last.end + secs; };
// RP kit test sheet: shot 0 = cast line-up, shot 1 = props.
for (const n of ['office', 'boardroom']) K.load(n, PL + n + '.jpg');
const lab = (c, s, x, y) => { c.save(); c.font = '26px Oswald'; c.fillStyle = 'rgba(0,0,0,.6)'; const w = c.measureText(s).width + 16; c.fillRect(x - w / 2, y - 16, w, 32); TW.txt(c, s, x, y, 26, '#fff', 'center', 'Oswald'); c.restore(); };
const KINDS = ['kid', 'teen', 'cedric', 'vamp', 'casual', 'crook', 'suit', 'tux', 'bat', 'toga', 'parka', 'cloak', 'host'];
const C1 = [...KINDS.map(k => ['ROB ' + k, RP.ROB(k)]), ['TUX bow0', RP.ROB('tux', { bow: 0 })]];
const C2 = [['HEYMAN', RP.HEYMAN()], ['HEYMAN old', RP.HEYMAN(true)], ...[0, 1, 2, 3, 4, 5].map(k => ['DIR' + k, RP.DIR(k)]), ...[0, 1, 2, 3].map(k => ['CRITIC' + k, RP.CRITIC(k)]), ...[0, 1, 2, 3].map(k => ['EXEC' + k, RP.EXEC(k)]), ['HANSEN', RP.HANSEN()]];
const row = (L, y, s) => L.map(([n, l], i) => ({ x: 120 + i * (2320 / (L.length - 1)), y, s, ...l, facing: 1, mood: i % 3 ? 'neutral' : 'happy', _n: n }));
const F1 = row(C1, 760, 1.6), F2 = row(C2, 1400, 1.25);
window.SHOTS = [
  { plate: 'office', cam: { z: [1, 1], x: [1280, 1280], y: [720, 720] }, sub: 'off', live: [(c) => { c.fillStyle = 'rgba(255,255,255,.25)'; c.fillRect(0, 0, 2560, 1440); }, (c, lt) => RP.cape(c, F1[8].x, F1[8].y, 1.6, lt)], figs: [...F1, ...F2],
    front: [(c) => { [...F1, ...F2].forEach(f => lab(c, f._n, f.x, f.y + 26)); }] },
  { plate: 'boardroom', cam: { z: [1, 1], x: [1280, 1280], y: [720, 720] }, sub: 'off', figs: [],
    live: [(c) => { c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(0, 0, 2560, 1440); }],
    front: [(c, lt) => { const t = lt + 2; RP.bowtie(c, 300, 300, 2, t, 1); RP.score(c, 600, 400, 2, 2); RP.score(c, 760, 400, 2, 9); RP.board(c, 1100, 300, 1.5, .3); RP.board(c, 1600, 300, 1.5, .9);
      RP.scroll(c, 400, 600, 260, 600, 1); RP.oo7(c, 1200, 800, 1.5); }] },
];
SHOTS.push(Object.assign({}, SHOTS[0], { cam: { z: [2.4, 2.4], x: [700, 700], y: [520, 520] } }), Object.assign({}, SHOTS[0], { cam: { z: [2.4, 2.4], x: [1900, 1900], y: [520, 520] } }), Object.assign({}, SHOTS[0], { cam: { z: [4, 4], x: [1560, 1560], y: [560, 560] } }));
const _build = A.build; A.build = () => { const T2 = window.TIMING; K.setWords(T2.words); T2.shots.forEach((S, i) => { const D = window.SHOTS[i]; if (!D) return; D.live = D.live || []; D.front = D.front || []; D.over = D.over || []; S.D = D; S.vo_start = S.vo_start ?? S.start; if (D.init) D.init(S); }); _build(); };
A.build(); K.boot();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><title>RP act 7 - Why Hollywood keeps calling</title>
<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}@font-face{font-family:SourceSerif;src:url(../../../../shared/fonts/SourceSerif4.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/rig_v5.js"></script><script src="../../../../shared/rig_leo.js"></script><script>window.RIGSTYLE = "gumball";</script><script src="../../../../shared/kit.js"></script><script src="../../../../shared/anim.js"></script>
<script src="../../tw_kit.js"></script><script src="../../xu_kit.js"></script><script src="../../jh_kit.js"></script><script src="../../pr_kit.js"></script><script src="../../rp_kit.js"></script>
<script src="timing.js"></script>
<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
const SW = 1920, SH = 1080, INK = TW.INK, RED = TW.RED, pop = TW.pop, fade = TW.fade;
const backdrop = (name, b = .5, blur = 8) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${b})`; const s2 = 1.06 * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 720 * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); c.restore(); K.screen(c); };
const CARRY = () => ({ shL: 30, elL: -75, shR: 35, elR: -75 });
const endTitle = (secs) => { const T = window.TIMING; const last = T.shots[T.shots.length - 1]; T.shots.push({ i: T.shots.length, start: last.end, end: last.end + secs, vo_start: last.end, vo_end: last.end, text: '' }); T.dur = last.end + secs; };
// RP act 7 - Why Hollywood keeps calling: the directors, both lanes, producer + internet, trust.
// Plates: boardroom, road (stand-in rain_street), office (stand-in for arthouse producer scene), stage_blue (cinema).
// STAND-INS: swap the values in P once road / arthouse plates exist.
const P = { board: 'boardroom', road: 'rain_street', prod: 'office', cine: 'stage_blue' };
for (const n of new Set(Object.values(P))) K.load(n, PL + n + '.jpg');
const rr = TW.rr, txt = TW.txt;
// ---- name tag (world space): gold tile with a pointer
const ntag = (c, name, x, y, lt, at, opts = {}) => { const a = pop(lt, at, .4), o = 1 - K.seg(lt, (opts.until ?? 999) - .3, opts.until ?? 999); if (a <= 0 || o <= 0) return; const px = opts.px ?? 40; c.save(); c.globalAlpha = o; c.translate(x, y); c.scale(a, a); c.font = `${px}px Anton`;
  const w = c.measureText(name).width + px * .9, h = px * 1.45; c.fillStyle = 'rgba(0,0,0,.35)'; rr(c, -w / 2 + 6, -h - 12, w, h, 10); c.fill(); c.fillStyle = opts.col || JH.GOLD; c.strokeStyle = INK; c.lineWidth = 4; rr(c, -w / 2, -h - 18, w, h, 10); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(-14, -19); c.lineTo(0, 0); c.lineTo(14, -19); c.closePath(); c.fill(); c.stroke(); c.fillRect(-12, -24, 24, 7); txt(c, name, 0, -h / 2 - 16, px, INK, 'center', 'Anton'); c.restore(); };
// DOUBTERS vs BELIEVERS scoreboard, screen space top-left
const BOARD = v => (c, lt) => RP.board(c, 200, 95, .8, typeof v === 'function' ? v(lt) : v);
const flashes = (c, lt, n = 30, y0 = 280, h = 560) => { for (let k = 0; k < n; k++) { const ph = (lt * .5 + k * .37) % 1; if (ph < .25) TW.glow(c, (k * 397) % 2560, y0 + (k * 131) % h, 70, '255,255,255', .45 * Math.sin(ph / .25 * Math.PI)); } };
const rain = (c, lt, n = 140) => { c.save(); c.strokeStyle = 'rgba(200,215,235,.3)'; c.lineWidth = 2; for (let k = 0; k < n; k++) { const x = (k * 173 + lt * 300) % 2700 - 70, y = (k * 97 + lt * 1400) % 1500 - 60; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 10, y + 40); c.stroke(); } c.restore(); };
const dust = (c, lt, n = 40, col = '255,240,210') => { for (let k = 0; k < n; k++) { const x = (k * 263 + lt * 12 * (1 + k % 3)) % 2560, y = (k * 151 + Math.sin(lt * .7 + k) * 40) % 1300 + 60; c.fillStyle = `rgba(${col},${.12 + .1 * Math.sin(lt * 2 + k)})`; c.fillRect(x, y, 4, 4); } };
// coat stand with a hanger holding a small bow tie (running device)
const coatStand = (c, x, y, lt, s = 1) => { c.save(); c.strokeStyle = '#3a2a1e'; c.lineWidth = 12 * s; c.lineCap = 'round'; c.beginPath(); c.moveTo(x, y); c.lineTo(x, y - 420 * s); c.moveTo(x - 60 * s, y); c.lineTo(x + 60 * s, y); c.moveTo(x, y - 400 * s); c.lineTo(x - 50 * s, y - 440 * s); c.moveTo(x, y - 400 * s); c.lineTo(x + 50 * s, y - 440 * s); c.stroke();
  const sw = Math.sin(lt * 1.3) * .05; c.translate(x + 50 * s, y - 440 * s); c.rotate(sw); c.strokeStyle = '#bbb'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 16 * s); c.moveTo(-40 * s, 46 * s); c.lineTo(0, 16 * s); c.lineTo(40 * s, 46 * s); c.lineTo(-40 * s, 46 * s); c.stroke(); RP.bowtie(c, 0, 58 * s, 1.1 * s, 0, .5 + .5 * Math.sin(lt * 2)); c.restore(); };
const easeV = (lt, t0, a, b, d = .8) => a + (b - a) * E.io(K.seg(lt, t0, t0 + d));
const signPost = (c, x, y, w, label, col, a) => { if (a <= 0) return; c.save(); c.globalAlpha = a; c.fillStyle = '#5a5e66'; c.strokeStyle = INK; c.lineWidth = 4; c.fillRect(x - 8, y, 16, 1130 - y); c.strokeRect(x - 8, y, 16, 1130 - y); c.fillStyle = col; rr(c, x - w / 2, y - 120, w, 120, 12); c.fill(); c.stroke(); c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 3; rr(c, x - w / 2 + 10, y - 110, w - 20, 100, 8); c.stroke(); txt(c, label, x, y - 60, 52, '#fff', 'center', 'Anton'); c.restore(); };
const reel = (c, x, y, s, lt) => { c.save(); c.translate(x, y); c.scale(s, s); c.rotate(lt * 1.5); c.fillStyle = '#2a2a30'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.arc(0, 0, 60, 0, 7); c.fill(); c.stroke(); c.fillStyle = '#9a9aa4'; for (let k = 0; k < 5; k++) { c.beginPath(); c.arc(Math.cos(k * 1.257) * 32, Math.sin(k * 1.257) * 32, 13, 0, 7); c.fill(); } c.restore(); };
const DIRS = [['NOLAN ×2', 2], ['VILLENEUVE', 1], ['REEVES', 0], ['BONG JOON HO', 5], ['EGGERS', 4], ['THE SAFDIES', 3]];

window.SHOTS = [
  // 7.00 boardroom: the great directors walk in one by one and all point at Rob
  { plate: P.board, cam: { z: [1.15, 1.28], x: [1280, 1360], y: [960, 1000] }, bed: [['office_loop', .08], ['hum_loop', .06]], light: { dir: 1, key: 'rgba(255,230,200,.12)' },
    init: S => { const tW = A.at(S, 'why', .9), tO = A.at(S, 'one', 3.6), tD = A.at(S, 'directors.', 4.4), tP = A.at(S, 'picking', 11.7), tM = A.at(S, 'man.', 12.9);
      const ws = ['Nolan', 'Villeneuve', 'Reeves', 'Bong', 'Eggers', 'Safdies.'].map((w, i) => A.at(S, w, 5 + i * .9));
      S.D.figs = [{ x: 2080, y: 1400, s: 1.9, ...RP.ROB('casual'), facing: -1, mood: 'neutral', anim: (o, lt) => { if (lt > tD) o.mood = 'happy'; if (lt > tP + .4) { o.pose = 'shrug'; o.mood = 'smug'; } } },
        ...DIRS.map(([n, k], i) => ({ x: 380 + (5 - i) * 250, y: 1400, s: 1.8, ...RP.DIR(k), facing: 1, mood: 'happy', seed: 400 + i, walk: { x0: -150, x1: 380 + (5 - i) * 250, t0: ws[i] - 1.6 - i * .15, dur: 1.5 + i * .15 },
          anim: (o, lt) => { o.lean = Math.sin(lt * 1.5 + i) * 1.5; if (lt > tP - .1 + i * .06) o.pose = 'point'; } }))];

      S.D.front = [(c, lt) => { for (let i = 0; i < 6; i++) { const a = pop(lt, ws[i], .3), o = 1 - K.seg(lt, tP - .4, tP); if (a <= 0 || o <= 0) continue; c.save(); c.globalAlpha = o; ntag(c, DIRS[i][0], 380 + (5 - i) * 250, 820 + (i % 2) * 70, lt, ws[i], { px: 26, col: '#f2ead8' }); c.restore(); } },

      S.D.over = [BOARD(.9), (c, lt) => K.card(c, 'WHY DOES HOLLYWOOD KEEP CALLING?', lt, { at: tW, until: tO, x: 960, y: 150, px: 52, rot: -1 }),
        (c, lt) => K.card(c, 'REASON 1: THE DIRECTORS', lt, { at: tO, until: tP - .2, x: 1180, y: 140, px: 54, rot: 2, bg: JH.GOLD }),
        (c, lt) => K.card(c, 'THE BEST KEEP PICKING HIM', lt, { at: tP - .2, x: 1100, y: 140, px: 50, rot: -2, bg: JH.GOLD })];
      S.D.sfx = [[tW, 'whoosh_soft', .2], [tO, 'chime', .3], ...ws.map(t => [t - .5, 'footsteps', .15]), ...ws.map(t => [t, 'pop', .18]), [tP, 'whoosh', .25], [tM, 'chime', .25]]; } },
  // 7.01 the road: two lanes, SMALL FILMS and BLOCKBUSTERS; Rob in the middle wins both; other stars stuck in one
  { plate: P.road, cam: { z: [1.1, 1.2], x: [1280, 1280], y: [880, 900] }, bed: [['city_loop', .12], ['rain_loop', .08]], light: { dir: -1, key: 'rgba(180,200,255,.12)' },
    init: S => { const tR = A.at(S, 'two', .8), tL = A.at(S, 'lanes.', 2.5), tS = A.at(S, 'small', 3.3), tH = A.at(S, 'hit.', 5.9), tG = A.at(S, 'giant', 6.5), tSt = A.at(S, 'steals', 8.4), tMo = A.at(S, 'Most', 9.6), tOn = A.at(S, 'one.', 11.2);
      S.D.figs = [{ x: 1280, y: 1300, s: 1.9, ...RP.ROB('casual'), facing: 1, mood: 'neutral', anim: (o, lt) => { o.facing = lt < tG ? -1 : 1; if (lt > tS) { o.pose = 'point'; o.mood = 'happy'; } if (lt > tSt) { o.pose = 'cheer'; o.mood = 'smug'; } if (lt > tMo) { o.pose = 'stand'; o.facing = 1; } } },
        { x: 380, y: 1300, s: 1.8, ...RP.EXEC(1), facing: 1, mood: 'neutral', walk: { x0: -200, x1: 380, t0: tMo - 1.4, dur: 1.4 }, anim: (o, lt) => { if (lt > tOn - .3) { o.pose = 'shrug'; o.mood = 'sad'; } } },
        { x: 2200, y: 1300, s: 1.8, ...RP.EXEC(3), facing: -1, mood: 'neutral', walk: { x0: 2750, x1: 2200, t0: tMo - 1.4, dur: 1.4 }, anim: (o, lt) => { if (lt > tOn - .3) { o.pose = 'shrug'; o.mood = 'sad'; } } }];
      S.D.live = [(c, lt) => { // marquee over the painted building sign + lane divider glow
          c.save(); c.fillStyle = '#2a1a12'; c.strokeStyle = INK; c.lineWidth = 5; rr(c, 820, 760, 920, 110, 10); c.fill(); c.stroke(); for (let k = 0; k < 22; k++) { c.fillStyle = (k + Math.floor(lt * 6)) % 3 ? 'rgba(255,220,120,.9)' : 'rgba(255,220,120,.3)'; c.beginPath(); c.arc(845 + k * 41, 772, 6, 0, 7); c.fill(); c.beginPath(); c.arc(845 + k * 41, 858, 6, 0, 7); c.fill(); } txt(c, 'PICTURE HOUSE', 1280, 815, 56, '#ffe0a0', 'center', 'Anton'); c.restore();
          TW.glow(c, 1280, 820, 500, '255,200,120', .18);
          signPost(c, 600, 520, 520, '◀ SMALL FILMS', '#2a7a4a', pop(lt, tL - .4, .4)); signPost(c, 1960, 520, 560, 'BLOCKBUSTERS ▶', '#2a4a9a', pop(lt, tL - .2, .4));
          const sh = K.seg(lt, tS, tH); if (lt > tS) reel(c, 700, 1180, .9 + .3 * sh, lt);
          if (lt > tG) { const g = E.out(K.seg(lt, tG, tG + .8)); TW.glow(c, 1900, 900, 300 + 400 * g, '255,250,220', .35 * g); } }];
      S.D.front = [(c, lt) => rain(c, lt, 80), (c, lt) => TW.stamp(c, 'HIT!', 700, 1000, lt, tH - .2, { px: 80, col: '#3ad06a' })];
      S.D.over = [BOARD(.9), (c, lt) => K.card(c, 'REASON 2: BOTH LANES', lt, { at: tR, x: 960, y: 150, px: 54, rot: -2, bg: JH.GOLD, until: tMo - .2 }),
        (c, lt) => K.card(c, 'STEALS SCENES', lt, { at: tSt, x: 1420, y: 300, px: 46, rot: 3, until: tMo }),
        (c, lt) => K.card(c, 'MOST STARS: ONLY ONE', lt, { at: tMo, x: 960, y: 150, px: 52, rot: 2 })];
      S.D.sfx = [[tR, 'chime', .3], [tL - .4, 'pop', .2], [tL - .2, 'pop', .2], [tS, 'whoosh_soft', .2], [tH - .2, 'stamp', .35], [tG, 'swell', .3], [tSt, 'crowd_cheer', .2], [tMo - 1.4, 'footsteps', .2], [tOn - .3, 'thud', .2]]; } },
  // 7.02 producer: Rob hands a script to two young directors (bow tie on the coat stand); then the internet floods in
  { plate: P.prod, cam: { z: [1.3, 1.4], x: [1250, 1330], y: [960, 990] }, bed: [['office_loop', .12]], light: { dir: 1, key: 'rgba(255,230,200,.12)' },
    init: S => { const tT = A.at(S, 'three', .8), tPr = A.at(S, 'producer', 1.8), tY = A.at(S, 'young', 3.5), tF = A.at(S, 'four', 5.6), tI = A.at(S, 'internet', 6.3), tC = A.at(S, 'chaotic', 7.8), tMe = A.at(S, 'meme', 9.6), tFr = A.at(S, 'free', 10.6);
      const SCRIPT = { near: cc => { cc.fillStyle = '#f6f2e8'; cc.strokeStyle = INK; cc.lineWidth = 3; cc.fillRect(-18, -26, 36, 48); cc.strokeRect(-18, -26, 36, 48); cc.fillStyle = '#c83a2a'; cc.fillRect(-18, -26, 6, 48); } };
      const give = K.seg; 
      S.D.figs = [{ x: 1500, y: 1330, s: 1.9, ...RP.ROB('casual'), facing: -1, mood: 'happy', talk: [tPr, tY + 1.5], anim: (o, lt) => { if (lt > tY && lt < tY + 1.2) { o.pose = 'present'; } o.hold = lt < tY + .8 ? SCRIPT : null; if (lt > tI) { o.pose = 'cheer'; o.mood = 'smug'; } } },
        { x: 980, y: 1330, s: 1.6, ...RP.DIR(4), facing: 1, mood: 'neutral', walk: { x0: 520, x1: 980, t0: tPr - .2, dur: 1.4 }, anim: (o, lt) => { if (lt > tY + .8) { o.hold = SCRIPT; o.mood = 'happy'; } if (lt > tI) o.pose = 'wave'; } },
        { x: 760, y: 1330, s: 1.55, ...RP.DIR(3), facing: 1, mood: 'neutral', walk: { x0: 300, x1: 760, t0: tPr, dur: 1.4 }, anim: (o, lt) => { if (lt > tY + 1) { o.mood = 'happy'; o.pose = 'cheer'; } if (lt > tI) o.pose = 'stand'; } }];
      S.D.live = [(c, lt) => { coatStand(c, 2300, 1330, lt, 1); TW.glow(c, 1300, 700, 700, '255,230,190', .1); }];
      S.D.front = [(c, lt) => ntag(c, 'PRODUCER', 1500, 700, lt, tPr, { px: 38, until: tF }), (c, lt) => ntag(c, 'NEW DIRECTORS', 870, 790, lt, tY, { px: 32, until: tF, col: '#f2ead8' }),
        ];
      S.D.over = [BOARD(.9), (c, lt) => K.card(c, 'REASON 3: PRODUCER', lt, { at: tT, until: tF - .2, x: 960, y: 150, px: 54, rot: -2, bg: JH.GOLD }),
        (c, lt) => K.card(c, 'REASON 4: THE INTERNET ♥ HIM', lt, { at: tF, x: 960, y: 140, px: 52, rot: 2, bg: JH.GOLD }),
        (c, lt) => K.card(c, 'CHAOTIC INTERVIEWS', lt, { at: tC, x: 420, y: 230, px: 38, rot: -3 }), (c, lt) => K.card(c, 'MEMES', lt, { at: tMe, x: 1100, y: 235, px: 40, rot: 3 }),
        (c, lt) => { if (lt < tI - .3) return; for (let k = 0; k < 9; k++) { const a = pop(lt, tI - .2 + k * .12, .3); if (a <= 0) continue; const x = 1480 + (k % 3) * 150, y = 330 + Math.floor(k / 3) * 190 + Math.sin(lt * 2 + k) * 8;
          TW.phone(c, x, y, .55 * a, (p, pw, ph) => { p.fillStyle = ['#3a5a9a', '#9a3a6a', '#2a7a6a'][k % 3]; p.fillRect(0, 0, pw, ph); txt(p, k % 2 ? 'LOL' : '♥', pw / 2, ph / 2, 44, '#fff', 'center', 'Anton'); }); } },
        (c, lt) => TW.stamp(c, 'FREE ADVERTISING', 1000, 790, lt, tFr, { px: 60 })];
      S.D.sfx = [[tT, 'chime', .3], [tPr - .2, 'footsteps', .2], [tY, 'paper', .3], [tF, 'chime', .3], [tI, 'pop', .25], [tI + .3, 'typing', .2], [tC, 'pop', .2], [tMe, 'pop', .2], [tFr, 'stamp', .35]]; } },
  // 7.03 cinema: TRUST; a critic is lukewarm, but the BORING meter never moves
  { plate: P.cine, cam: { z: [1.2, 1.35], x: [1280, 1280], y: [700, 740] }, bed: [['crowd_loop', .05], ['hum_loop', .06]], light: { dir: 1, key: 'rgba(150,180,255,.12)' },
    init: S => { const tB = A.at(S, 'biggest', .8), tTr = A.at(S, 'trust.', 2.3), tMi = A.at(S, 'might', 3.2), tL = A.at(S, 'love', 3.9), tAl = A.at(S, 'almost', 7.1), tBo = A.at(S, 'boring.', 8.0);
      S.D.figs = [{ x: 1640, y: 890, s: 1.6, ...RP.ROB('casual'), facing: -1, mood: 'neutral', anim: (o, lt) => { if (lt > tTr) o.mood = 'happy'; if (lt > tBo) { o.pose = 'wave'; o.mood = 'smug'; } } },
        { x: 900, y: 890, s: 1.55, ...RP.CRITIC(1), facing: 1, mood: 'neutral', anim: (o, lt) => { if (lt > tL) { o.arms = () => ({ shR: 70, elR: -60, handR: 'open' }); o.hold = { near: cc => RP.score(cc, 0, 0, .8, 6) }; } if (lt > tAl) o.mood = 'shocked'; } }];
      S.D.live = [(c, lt) => { const f = .5 + .5 * Math.sin(lt * 9) * Math.sin(lt * 2.3); c.fillStyle = `rgba(200,220,255,${.08 + .06 * f})`; c.fillRect(520, 140, 1520, 600); TW.glow(c, 1280, 450, 800, '150,190,255', .15 + .08 * f);
          // light beam from projector
          c.save(); c.globalAlpha = .1 + .04 * f; c.fillStyle = '#dde8ff'; c.beginPath(); c.moveTo(1280, 1440); c.lineTo(560, 160); c.lineTo(2000, 160); c.closePath(); c.fill(); c.restore(); },
        (c, lt) => { const a = pop(lt, tTr, .4); if (a > 0) { c.save(); c.translate(1280, 560); c.scale(a, a); txt(c, 'TRUST', 0, 0, 200, 'rgba(255,240,200,.9)', 'center', 'Anton'); c.restore(); } }];
      S.D.front = [];
      S.D.over = [BOARD(.9), (c, lt) => K.card(c, 'BIGGEST REASON: TRUST', lt, { at: tB, x: 960, y: 140, px: 54, rot: -2, bg: JH.GOLD }), (c, lt) => K.card(c, 'NOT ALWAYS LOVED…', lt, { at: tMi, x: 560, y: 280, px: 40, rot: -3, until: tAl }),
        (c, lt) => { const a = pop(lt, tAl - .4, .4); if (a <= 0) return; c.save(); c.translate(1700, 600); c.scale(a, a); c.fillStyle = '#1a1a22'; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.arc(0, 0, 110, Math.PI, 0); c.closePath(); c.fill(); c.stroke();
          [['#3ad06a', Math.PI, 1.4 * Math.PI], ['#f5a524', 1.4 * Math.PI, 1.7 * Math.PI], ['#e8463a', 1.7 * Math.PI, 2 * Math.PI]].forEach(([col, a0, a1]) => { c.strokeStyle = col; c.lineWidth = 16; c.beginPath(); c.arc(0, 0, 88, a0, a1); c.stroke(); });
          const ang = Math.PI * (1.04 + .02 * Math.sin(lt * 6)); c.strokeStyle = '#fff'; c.lineWidth = 6; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(ang) * 80, Math.sin(ang) * 80); c.stroke(); txt(c, 'BORING-O-METER', 0, 30, 30, '#fff', 'center', 'Anton'); c.restore(); },
        (c, lt) => K.card(c, '…ALMOST NEVER BORING', lt, { at: tAl, x: 1500, y: 270, px: 44, rot: 2 })];
      S.D.sfx = [[tB, 'chime', .3], [tTr, 'swell', .3], [tL, 'paper', .2], [tAl - .4, 'pop', .25], [tBo, 'tick', .3], [tBo + .3, 'crowd_cheer', .15]]; } },
];
const _build = A.build; A.build = () => { const T2 = window.TIMING; K.setWords(T2.words); T2.shots.forEach((S, i) => { const D = window.SHOTS[i]; if (!D) return; D.live = D.live || []; D.front = D.front || []; D.over = D.over || []; S.D = D; S.vo_start = S.vo_start ?? S.start; if (D.init) D.init(S); }); _build(); };
A.build(); K.boot();

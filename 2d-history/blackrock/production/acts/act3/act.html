<script src="../../../../shared/rig_v5.js"></script><script src="../../../../shared/rig_leo.js"></script><script>window.RIGSTYLE = "alium";</script><script src="../../../../shared/kit.js"></script><script src="../../../../shared/anim.js"></script>

<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
for (const n of ['office88', 'boardroom', 'serverhall', 'skyline']) K.load(n, PL + n + '.jpg');
{ const T = window.TIMING, L = T.shots[T.shots.length - 1]; L.end += 1.6; T.dur = L.end; }
const SW = 1920, SH = 1080, INK = '#1d1712', CREAM = '#f6efe2', GOLD = '#e8b44a', RED = '#d9483b', GREEN = '#4f8a4a', BLUE = '#3f6aa0';
const pop = (lt, at, d = .45) => E.back(K.seg(lt, at, at + d));
const font = (px, fam = 'Anton') => `${px}px ${fam}, Oswald, sans-serif`;
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
const FINK = { costume: 'shirtsleeves', hair: 'swept', hairCol: '#4a3220', seed: 7 };
const DAD = { costume: 'office', hair: 'short', hairCol: '#5a3a22', seed: 12 }, MOM = { costume: 'dress', hair: 'bun', hairCol: '#2a1a12', seed: 13 };
const coin = (c, x, y, r = 16, a = 1) => { c.save(); c.globalAlpha *= a; c.fillStyle = '#b8862a'; c.beginPath(); c.ellipse(x, y + r * .18, r, r * .72, 0, 0, 7); c.fill(); c.fillStyle = GOLD; c.beginPath(); c.ellipse(x, y, r, r * .72, 0, 0, 7); c.fill(); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke(); c.fillStyle = '#fff2c0'; c.font = `bold ${r * .9}px Oswald`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('$', x, y + 1); c.restore(); };
// colour grade in screen space: warm gold drains to cold blue between t0 and t1
const grade = (t0, t1, from = 0) => (c, lt) => { const u = Math.max(from, E.io(K.seg(lt, t0, t1))); c.save(); c.globalCompositeOperation = 'soft-light'; c.fillStyle = `rgba(255,190,80,${.45 * (1 - u)})`; c.fillRect(0, 0, SW, SH); c.globalCompositeOperation = 'multiply'; c.fillStyle = `rgba(90,120,190,${.55 * u})`; c.fillRect(0, 0, SW, SH); c.restore(); };
// red X scribbled over a card area
const redX = (c, x, y, w, h, u) => { if (u <= 0) return; c.save(); c.strokeStyle = RED; c.lineWidth = 14; c.lineCap = 'round'; const a = Math.min(1, u * 2), b = Math.max(0, u * 2 - 1); c.beginPath(); c.moveTo(x - w / 2, y - h / 2); c.lineTo(x - w / 2 + w * a, y - h / 2 + h * a); c.stroke(); if (b > 0) { c.beginPath(); c.moveTo(x + w / 2, y - h / 2); c.lineTo(x + w / 2 - w * b, y - h / 2 + h * b); c.stroke(); } c.restore(); };
// a paper loan document (local coords, centred)
const loanDoc = (c, w = 120, h = 150, title = 'MORTGAGE') => { c.fillStyle = 'rgba(0,0,0,.2)'; c.fillRect(-w / 2 + 6, -h / 2 + 8, w, h); c.fillStyle = '#fbf7ea'; c.strokeStyle = INK; c.lineWidth = 3; c.fillRect(-w / 2, -h / 2, w, h); c.strokeRect(-w / 2, -h / 2, w, h); c.fillStyle = RED; c.font = `bold ${w * .13}px Oswald`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(title, 0, -h / 2 + h * .14); c.strokeStyle = 'rgba(40,40,60,.45)'; c.lineWidth = 2; for (let k = 0; k < 6; k++) { c.beginPath(); c.moveTo(-w * .38, -h * .18 + k * h * .1); c.lineTo(w * .38, -h * .18 + k * h * .1); c.stroke(); } c.strokeStyle = BLUE; c.beginPath(); c.moveTo(-w * .3, h * .38); c.quadraticCurveTo(-w * .1, h * .28, w * .05, h * .4); c.quadraticCurveTo(w * .15, h * .3, w * .3, h * .36); c.stroke(); };
// cash bundle (local coords)
const bundle = (c, s = 1) => { c.save(); c.scale(s, s); c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(-46, -14, 96, 34); for (let k = 0; k < 3; k++) { c.fillStyle = '#7aa864'; c.strokeStyle = INK; c.lineWidth = 3; c.fillRect(-50, -18 - k * 9, 100, 30); c.strokeRect(-50, -18 - k * 9, 100, 30); } c.fillStyle = '#c8b86a'; c.fillRect(-10, -36, 20, 30); c.strokeRect(-10, -36, 20, 30); c.restore(); };
// cardboard office box held in front (hand-local: +y runs along the forearm)
const BOX = (c) => { c.save(); c.rotate(-1.1); c.translate(-46, 22); c.fillStyle = "rgba(0,0,0,.25)"; c.fillRect(-58, -26, 120, 80); c.fillStyle = '#b8864e'; c.strokeStyle = INK; c.lineWidth = 3.5; c.fillRect(-62, -30, 120, 80); c.strokeRect(-62, -30, 120, 80); c.fillStyle = '#9a6c3a'; c.fillRect(-62, -30, 120, 14); c.strokeRect(-62, -30, 120, 14); c.fillStyle = '#f4f0e4'; c.save(); c.translate(-30, -38); c.rotate(-.2); c.fillRect(-14, -14, 28, 22); c.restore(); c.fillStyle = '#3a6a3a'; c.beginPath(); c.arc(28, -46, 16, 0, 7); c.fill(); c.fillStyle = '#6a4a2a'; c.fillRect(20, -36, 16, 10); c.fillStyle = '#d8c8a0'; c.fillRect(-6, -48, 22, 22); c.strokeStyle = INK; c.lineWidth = 2; c.strokeRect(-6, -48, 22, 22); c.restore(); };
const boxArms = (o) => { o.arms = (t, P) => ({ shR: 6 + Math.sin(t * 3) * 2, elR: -95 }); };
// blank notepad in hand
const PAD = (c) => { c.save(); c.rotate(-.9); c.translate(10, 34); c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(-26, -32, 56, 72); c.fillStyle = '#f6efc8'; c.strokeStyle = INK; c.lineWidth = 3; c.fillRect(-30, -36, 56, 72); c.strokeRect(-30, -36, 56, 72); c.fillStyle = '#7a3a2a'; c.fillRect(-30, -36, 56, 10); c.strokeStyle = 'rgba(80,120,170,.4)'; c.lineWidth = 1.5; for (let k = 0; k < 5; k++) { c.beginPath(); c.moveTo(-24, -14 + k * 11); c.lineTo(20, -14 + k * 11); c.stroke(); } c.restore(); };
// rain streaks in screen space
const rain = (n = 260, al = .35) => (c, lt) => { c.save(); c.strokeStyle = `rgba(190,205,235,${al})`; c.lineWidth = 2; c.beginPath(); for (let i = 0; i < n; i++) { const sp = 1400 + (i * 97 % 600), x = (i * 733 % SW) + ((lt * 120) % 40), y = ((i * 389 + lt * sp) % (SH + 80)) - 40; c.moveTo(x, y); c.lineTo(x - 8, y + 34); } c.stroke(); c.restore(); };
// rain splashes on the pavement (world)
const splashes = (c, lt) => { c.save(); c.strokeStyle = 'rgba(200,215,240,.5)'; c.lineWidth = 2; for (let i = 0; i < 40; i++) { const per = .5 + (i % 5) * .13, p = ((lt + i * .37) % per) / per, x = (i * 613) % 2560, y = 1110 + (i * 211) % 320; c.globalAlpha = 1 - p; c.beginPath(); c.ellipse(x, y, 4 + p * 22, 1.5 + p * 6, 0, 0, 7); c.stroke(); } c.restore(); };
// mini rate chart panel in screen space
const rateChart = (c, lt, at, x, y) => { const a = pop(lt, at); if (a <= 0) return; const u = E.out(K.seg(lt, at + .3, at + 1.6)); c.save(); c.translate(x, y); c.scale(a, a); c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(-206, -126, 420, 260); c.fillStyle = '#fffaf0'; c.strokeStyle = INK; c.lineWidth = 6; c.fillRect(-210, -130, 420, 260); c.strokeRect(-210, -130, 420, 260); c.fillStyle = INK; c.font = font(38); c.textAlign = 'left'; c.fillText('RATES', -186, -84);
  c.strokeStyle = 'rgba(40,30,20,.2)'; c.lineWidth = 2; for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(-180, -50 + k * 50); c.lineTo(180, -50 + k * 50); c.stroke(); }
  const pts = [[-170, -40], [-90, -30], [-20, 10], [60, 40], [160, 80]]; c.strokeStyle = RED; c.lineWidth = 8; c.lineJoin = 'round'; c.beginPath(); c.moveTo(...pts[0]); const n = u * (pts.length - 1); for (let k = 1; k <= Math.ceil(n); k++) { const f = Math.min(1, n - k + 1), p = pts[k - 1], q = pts[k]; c.lineTo(p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f); } c.stroke();
  c.fillStyle = INK; c.font = font(30, 'Oswald'); c.fillText('9%', -196, -30); if (u > .9) { c.fillStyle = RED; c.fillText('7%', 172, 92); const b = pop(lt, at + 1.6); c.save(); c.translate(150, -70); c.scale(b, b); c.fillStyle = RED; c.beginPath(); c.moveTo(-22, -30); c.lineTo(22, -30); c.lineTo(22, 0); c.lineTo(40, 0); c.lineTo(0, 40); c.lineTo(-40, 0); c.lineTo(-22, 0); c.closePath(); c.fill(); c.strokeStyle = INK; c.lineWidth = 4; c.stroke(); c.restore(); } c.restore(); };

const P1 = { costume: 'suit', hair: 'short', hairCol: '#2a1a12', glasses: true, seed: 31 }, P2 = { costume: 'office', hair: 'bun', hairCol: '#6a3a1a', seed: 33 }, P3 = { costume: 'shirtsleeves', hair: 'curly', hairCol: '#1a1210', seed: 35 };
const CLIENT = { costume: 'suit', hair: 'short', hairCol: '#8a8a88', seed: 41 };
// boxes being unpacked: a lid flap that opens (world)
const flap = (c, x, y, w, u) => { c.save(); c.translate(x, y); c.rotate(-u * 1.2); c.fillStyle = '#c89a62'; c.fillRect(0, -6, w, 12); c.restore(); };
// risk report sheet (local, centred)
const report = (c, w, h) => { c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(-w / 2 + 8, -h / 2 + 10, w, h); c.fillStyle = '#fbf8ee'; c.strokeStyle = INK; c.lineWidth = 4; c.fillRect(-w / 2, -h / 2, w, h); c.strokeRect(-w / 2, -h / 2, w, h); c.fillStyle = INK; c.font = font(w * .1); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('RISK REPORT', 0, -h * .38);
  const bars = [.5, .8, .35, .95, .6]; bars.forEach((b, i) => { c.fillStyle = b > .9 ? RED : b > .7 ? GOLD : GREEN; c.fillRect(-w * .36 + i * w * .15, h * .3 - b * h * .45, w * .1, b * h * .45); }); c.fillStyle = RED; c.font = font(w * .06, 'Oswald'); c.fillText('WHAT COULD GO WRONG', 0, h * .42); };
// a scenario grid feeding one gauge (screen)
const darkBg = (c) => { const g = c.createLinearGradient(0, 0, 0, SH); g.addColorStop(0, '#101820'); g.addColorStop(1, '#070a0e'); c.fillStyle = g; c.fillRect(0, 0, SW, SH); c.strokeStyle = 'rgba(120,255,160,.06)'; c.lineWidth = 1; for (let x = 0; x < SW; x += 48) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, SH); c.stroke(); } for (let y = 0; y < SH; y += 48) { c.beginPath(); c.moveTo(0, y); c.lineTo(SW, y); c.stroke(); } };
const gauge = (c, x, y, rad, v, lt) => { c.save(); c.translate(x, y); c.lineWidth = 34; c.lineCap = 'butt'; [[GREEN, 0, .5], [GOLD, .5, .75], [RED, .75, 1]].forEach(([col, a, b]) => { c.strokeStyle = col; c.beginPath(); c.arc(0, 0, rad, Math.PI + a * Math.PI, Math.PI + b * Math.PI); c.stroke(); });
  const ang = Math.PI + K.clamp(v) * Math.PI + Math.sin(lt * 9) * .02; c.strokeStyle = CREAM; c.lineWidth = 10; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(ang) * rad * .86, Math.sin(ang) * rad * .86); c.stroke(); c.fillStyle = CREAM; c.beginPath(); c.arc(0, 0, 18, 0, 7); c.fill(); c.fillStyle = CREAM; c.font = font(44); c.textAlign = 'center'; c.fillText('PORTFOLIO RISK', 0, 90); c.restore(); };
// portfolio pie whose slices breathe with a what-if (screen)
const pie = (c, x, y, rad, d) => { const base = [.3, .25, .2, .15, .1], cols = ['#3f6aa0', '#4f8a4a', '#e8b44a', '#b0603a', '#8a6ab0'], names = ['BONDS', 'STOCKS', 'LOANS', 'OIL', 'CASH']; let tot = 0; const v = base.map((b, i) => Math.max(.02, b + (d[i] || 0))); v.forEach(q => tot += q); let a0 = -Math.PI / 2;
  v.forEach((q, i) => { const a1 = a0 + q / tot * Math.PI * 2; c.fillStyle = cols[i]; c.beginPath(); c.moveTo(x, y); c.arc(x, y, rad, a0, a1); c.closePath(); c.fill(); c.strokeStyle = '#0c1016'; c.lineWidth = 6; c.stroke(); const am = (a0 + a1) / 2; c.fillStyle = CREAM; c.font = font(30, 'Oswald'); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(names[i], x + Math.cos(am) * rad * .66, y + Math.sin(am) * rad * .66); a0 = a1; }); };
const whatIf = (c, lt, at, x, y, txt, col) => { const a = pop(lt, at); if (a <= 0) return; c.save(); c.translate(x, y); c.scale(a, a); c.rotate(Math.sin(lt * 1.3 + x) * .03); c.fillStyle = 'rgba(0,0,0,.4)'; c.beginPath(); c.roundRect(-226, -56, 460, 120, 16); c.fill(); c.fillStyle = '#f6efe2'; c.strokeStyle = col; c.lineWidth = 7; c.beginPath(); c.roundRect(-230, -60, 460, 120, 16); c.fill(); c.stroke(); c.fillStyle = col; c.font = font(26, 'Oswald'); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('WHAT IF', 0, -28); c.fillStyle = INK; c.font = font(40); c.fillText(txt, 0, 14); c.restore(); };
// a client building tile (screen)
const tile = (c, x, y, txt, a) => { if (a <= 0) return; c.save(); c.globalAlpha = Math.min(1, a); c.translate(x, y); c.scale(.6 + .4 * Math.min(1, a), .6 + .4 * Math.min(1, a)); c.fillStyle = '#1e2430'; c.strokeStyle = '#88ff99'; c.lineWidth = 4; c.beginPath(); c.roundRect(-150, -46, 300, 92, 14); c.fill(); c.stroke(); c.fillStyle = CREAM; c.font = font(32, 'Oswald'); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(txt, 0, 2); c.restore(); };

window.SHOTS = [
  // 1 1988: the founders unpack in a borrowed office at Blackstone
  { plate: 'office88', cam: { z: [1.05, 1.13], x: [1280, 1300], y: [760, 780] }, bed: [['office_loop', .25]], inSfx: false,
    figs: [{ x: 560, y: 1300, s: 2.15, ...P1, facing: 1, pose: 'carry' }, { x: 900, y: 1300, s: 2.1, ...P2, facing: 1, pose: 'stand' }, { x: 1700, y: 1300, s: 2.2, ...FINK, facing: -1, pose: 'present' }, { x: 2030, y: 1300, s: 2.1, ...P3, facing: -1, pose: 'stand' }],
    init: S => { const tF = A.at(S, 'Fink', 1.0), tS = A.at(S, 'small group', 2.2), tB = A.at(S, 'Blackstone', 5.4);

      S.D.figs[1].anim = (o, lt) => { o.pose = lt > tS ? 'wave' : 'stand'; o.mood = 'happy'; };
      S.D.figs[2].anim = (o, lt) => { o.talk = lt > tF - .2 && lt < tB + 1; o.mood = 'happy'; };

      S.D.over = [(c, lt) => K.card(c, 'LARRY FINK + 7 PARTNERS', lt, { at: tS, x: 960, y: 160, px: 50, rot: -2 }), (c, lt) => K.card(c, 'A DESK INSIDE BLACKSTONE', lt, { at: tB, x: 1300, y: 300, px: 42, rot: 3 }), (c, lt) => K.dateTag(c, '1988 · NEW YORK', lt, { at: .4 })];
      S.D.sfx = [[.3, 'scrape', .4], [tS, 'paper', .4], [tS + .6, 'pop', .35], [tB, 'pop', .4]]; } },
  // 2 the name plate: Blackstone Financial Management painted over with BLACKROCK
  { draw: (c) => { const g = c.createLinearGradient(0, 0, 0, SH); g.addColorStop(0, '#5a3e2a'); g.addColorStop(1, '#2e1e14'); c.fillStyle = g; c.fillRect(0, 0, SW, SH); c.strokeStyle = 'rgba(20,10,6,.4)'; c.lineWidth = 4; for (let x = 0; x < SW; x += 120) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, SH); c.stroke(); } }, bed: [['office_loop', .2]],
    init: S => { const tC = A.at(S, 'new name', 4.2), tB = A.at(S, 'BlackRock', 5.4);
      S.D.over = [(c, lt) => { const z = 1 + lt * .012; c.save(); c.translate(SW / 2, SH / 2 - 20); c.scale(z, z);
          c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(-596, -146, 1200, 300); { const g = c.createLinearGradient(0, -150, 0, 150); g.addColorStop(0, '#e8c878'); g.addColorStop(.5, '#c89a40'); g.addColorStop(1, '#8a6420'); c.fillStyle = g; } c.fillRect(-600, -150, 1200, 300); c.strokeStyle = '#5a4010'; c.lineWidth = 10; c.strokeRect(-584, -134, 1168, 268);
          c.fillStyle = '#2a1a0a'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = font(64, 'SourceSerif'); c.fillText('BLACKSTONE', 0, -50); c.font = font(46, 'SourceSerif'); c.fillText('FINANCIAL MANAGEMENT', 0, 40);
          const u = E.io(K.seg(lt, tC - .2, tC + .9)); if (u > 0) { c.save(); c.beginPath(); c.rect(-560, -120, 1120 * u, 240); c.clip(); c.fillStyle = '#16161a'; c.fillRect(-560, -120, 1120, 240); for (let k = 0; k < 14; k++) { c.fillStyle = 'rgba(255,255,255,.04)'; c.fillRect(-560, -120 + k * 18, 1120, 6); } c.restore(); }
          const b = pop(lt, tB, .5); if (b > 0) { c.save(); c.scale(b, b); c.fillStyle = CREAM; c.font = font(150); c.fillText('BLACKROCK', 0, 8); c.restore(); } c.restore(); },
        (c, lt) => K.dateTag(c, '1992', lt, { at: tB + .4 })];
      S.D.sfx = [[.4, 'thud', .3], [tC - .2, 'scrape', .5], [tB, 'stamp', .55], [tB + .1, 'chime', .35]]; } },
  // 3 the pitch: Fink slides a risk report across the table to a client
  { plate: 'boardroom', cam: { z: [1.2, 1.28], x: [1280, 1300], y: [780, 790] }, bed: [['hum_loop', .3]],
    figs: [{ x: 700, y: 1345, s: 2.3, ...FINK, facing: 1, pose: 'present' }, { x: 1900, y: 1345, s: 2.3, ...CLIENT, facing: -1, pose: 'think' }],
    init: S => { const tP = A.at(S, 'protection', 1.4), tD = A.at(S, 'prediction', 2.6), tW = A.at(S, 'go wrong', 4.6);
      S.D.figs[0].anim = (o, lt) => { o.talk = lt < tW + 1; o.pose = lt > tW - .6 && lt < tW + .8 ? 'reach' : 'present'; o.mood = 'happy'; };
      S.D.figs[1].anim = (o, lt) => { o.mood = lt > tW + .8 ? 'happy' : 'neutral'; o.pose = lt > tW + .8 ? 'stand' : 'think'; };
      S.D.front = [(c, lt) => { const u = E.out(K.seg(lt, tW - .6, tW + .6)); if (u <= 0) return; c.save(); c.translate(900 + u * 380, 1050); c.rotate(-.05 + u * .08); c.transform(1, 0, -.3, .45, 0, 0); report(c, 280, 360); c.restore(); }];
      S.D.over = [(c, lt) => { const a = pop(lt, tP); if (a <= 0) return; c.save(); c.translate(560, 200); c.scale(a, a); K.outlined(c, 'PROTECTION', 0, 0, 80, { fill: GREEN }); c.restore(); },
        (c, lt) => { const a = pop(lt, tD); if (a <= 0) return; c.save(); c.translate(1380, 200); c.scale(a, a); c.globalAlpha = .55; K.outlined(c, 'PREDICTION', 0, 0, 70, { fill: '#a8a29a' }); c.restore(); redX(c, 1380, 200, 460, 90, K.seg(lt, tD + .5, tD + 1)); },
        (c, lt) => K.card(c, 'WE SHOW YOU WHAT COULD GO WRONG', lt, { at: tW + .3, x: 960, y: 360, px: 40, rot: -1 })];
      S.D.sfx = [[tP, 'pop', .4], [tD, 'pop', .3], [tD + .5, 'scrape', .4], [tW - .5, 'paper', .55]]; } },
  // 4 Aladdin: one green-screen workstation, then the camera pulls back into a whole server hall
  { plate: 'serverhall', cam: { z: [1.5, 1.05], x: [1280, 1280], y: [760, 720] }, bed: [['hum_loop', .45]],
    init: S => { const tA = A.at(S, 'Aladdin', 4.4), tX = 2.4;
      S.D.over = [(c, lt) => { const f = 1 - E.io(K.seg(lt, tX, tX + 1.2)); if (f <= 0) return; c.save(); c.globalAlpha = f; const g = c.createLinearGradient(0, 0, 0, SH); g.addColorStop(0, '#2a1e16'); g.addColorStop(1, '#120c08'); c.fillStyle = g; c.fillRect(0, 0, SW, SH); c.fillStyle = '#4a3020'; c.fillRect(0, 800, SW, 280);

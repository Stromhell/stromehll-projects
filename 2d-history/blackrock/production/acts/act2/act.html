<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
for (const n of ['trading', 'suburb', 'kitchen', 'bank_street', 'bank', 'rain_street', 'boardroom']) K.load(n, PL + n + '.jpg');
{ const T = window.TIMING, L = T.shots[T.shots.length - 1]; L.end += 1.6; T.dur = L.end; }
const SW = 1920, SH = 1080, INK = '#1d1712', CREAM = '#f6efe2', GOLD = '#e8b44a', RED = '#d9483b', GREEN = '#4f8a4a', BLUE = '#3f6aa0';
const pop = (lt, at, d = .45) => E.back(K.seg(lt, at, at + d));
const font = (px, fam = 'Anton') => `${px}px ${fam}, Oswald, sans-serif`;
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
const FINK = { costume: 'shirtsleeves', hair: 'swept', hairCol: '#4a3220', seed: 7 };
const DAD = { costume: 'office', hair: 'short', hairCol: '#5a3a22', seed: 12 }, MOM = { costume: 'dress', hair: 'bun', hairCol: '#2a1a12', seed: 13 };
const coin = (c, x, y, r = 16, a = 1) => { c.save(); c.globalAlpha *= a; c.fillStyle = '#b8862a'; c.beginPath(); c.ellipse(x, y + r * .18, r, r * .72, 0, 0, 7); c.fill(); c.fillStyle = GOLD; c.beginPath(); c.ellipse(x, y, r, r * .72, 0, 0, 7); c.fill(); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke(); c.fillStyle = '#fff2c0'; c.font = `bold ${r * .9}px Oswald`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('$', x, y + 1); c.restore(); };
// colour grade in screen space: warm gold drains to cold blue between t0 and t1
const grade = (t0, t1, from = 0) => (c, lt) => { const u = Math.max(from, E.io(K.seg(lt, t0, t1))); c.save(); c.globalCompositeOperation = 'soft-light'; c.fillStyle = `rgba(255,190,80,${.45 * (1 - u)})`; c.fillRect(0, 0, SW, SH); c.globalCompositeOperation = 'multiply'; c.fillStyle = `rgba(90,120,190,${.55 * u})`; c.fillRect(0, 0, SW, SH); c.restore(); };
// red X scribbled over a card area
const redX = (c, x, y, w, h, u) => { if (u <= 0) return; c.save(); c.strokeStyle = RED; c.lineWidth = 14; c.lineCap = 'round'; const a = Math.min(1, u * 2), b = Math.max(0, u * 2 - 1); c.beginPath(); c.moveTo(x - w / 2, y - h / 2); c.lineTo(x - w / 2 + w * a, y - h / 2 + h * a); c.stroke(); if (b > 0) { c.beginPath(); c.moveTo(x + w / 2, y - h / 2); c.lineTo(x + w / 2 - w * b, y - h / 2 + h * b); c.stroke(); } c.restore(); };
// a paper loan document (local coords, centred)
const loanDoc = (c, w = 120, h = 150, title = 'MORTGAGE') => { c.fillStyle = 'rgba(0,0,0,.2)'; c.fillRect(-w / 2 + 6, -h / 2 + 8, w, h); c.fillStyle = '#fbf7ea'; c.strokeStyle = INK; c.lineWidth = 3; c.fillRect(-w / 2, -h / 2, w, h); c.strokeRect(-w / 2, -h / 2, w, h); c.fillStyle = RED; c.font = `bold ${w * .13}px Oswald`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(title, 0, -h / 2 + h * .14); c.strokeStyle = 'rgba(40,40,60,.45)'; c.lineWidth = 2; for (let k = 0; k < 6; k++) { c.beginPath(); c.moveTo(-w * .38, -h * .18 + k * h * .1); c.lineTo(w * .38, -h * .18 + k * h * .1); c.stroke(); } c.strokeStyle = BLUE; c.beginPath(); c.moveTo(-w * .3, h * .38); c.quadraticCurveTo(-w * .1, h * .28, w * .05, h * .4); c.quadraticCurveTo(w * .15, h * .3, w * .3, h * .36); c.stroke(); };
// cash bundle (local coords)

const BOX = (c) => { c.save(); c.rotate(-1.1); c.translate(-46, 22); c.fillStyle = "rgba(0,0,0,.25)"; c.fillRect(-58, -26, 120, 80); c.fillStyle = '#b8864e'; c.strokeStyle = INK; c.lineWidth = 3.5; c.fillRect(-62, -30, 120, 80); c.strokeRect(-62, -30, 120, 80); c.fillStyle = '#9a6c3a'; c.fillRect(-62, -30, 120, 14); c.strokeRect(-62, -30, 120, 14); c.fillStyle = '#f4f0e4'; c.save(); c.translate(-30, -38); c.rotate(-.2); c.fillRect(-14, -14, 28, 22); c.restore(); c.fillStyle = '#3a6a3a'; c.beginPath(); c.arc(28, -46, 16, 0, 7); c.fill(); c.fillStyle = '#6a4a2a'; c.fillRect(20, -36, 16, 10); c.fillStyle = '#d8c8a0'; c.fillRect(-6, -48, 22, 22); c.strokeStyle = INK; c.lineWidth = 2; c.strokeRect(-6, -48, 22, 22); c.restore(); };

  c.strokeStyle = 'rgba(40,30,20,.2)'; c.lineWidth = 2; for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(-180, -50 + k * 50); c.lineTo(180, -50 + k * 50); c.stroke(); }
  const pts = [[-170, -40], [-90, -30], [-20, 10], [60, 40], [160, 80]]; c.strokeStyle = RED; c.lineWidth = 8; c.lineJoin = 'round'; c.beginPath(); c.moveTo(...pts[0]); const n = u * (pts.length - 1); for (let k = 1; k <= Math.ceil(n); k++) { const f = Math.min(1, n - k + 1), p = pts[k - 1], q = pts[k]; c.lineTo(p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f); } c.stroke();
  c.fillStyle = INK; c.font = font(30, 'Oswald'); c.fillText('9%', -196, -30); if (u > .9) { c.fillStyle = RED; c.fillText('7%', 172, 92); const b = pop(lt, at + 1.6); c.save(); c.translate(150, -70); c.scale(b, b); c.fillStyle = RED; c.beginPath(); c.moveTo(-22, -30); c.lineTo(22, -30); c.lineTo(22, 0); c.lineTo(40, 0); c.lineTo(0, 40); c.lineTo(-40, 0); c.lineTo(-22, 0); c.closePath(); c.fill(); c.strokeStyle = INK; c.lineWidth = 4; c.stroke(); c.restore(); } c.restore(); };

window.SHOTS = [
  // 1 1986: the trading floor's gold light drains to cold blue; Fink's grin fades
  { plate: 'trading', cam: { z: [1.08, 1.24], x: [1280, 1290], y: [770, 810] }, bed: [['trading_loop', .35], ['office_loop', .2]], inSfx: false,
    figs: [
      { x: 990, y: 1233, s: 2.3, ...FINK, pose: 'stand', facing: 1, mood: 'happy' },

      { x: 1290, y: 869, s: .98, costume: 'shirtsleeves', hair: 'curly', seed: 4, facing: 1, pose: 'stand' }],
    init: S => { const tY = A.at(S, '1986', 1.0), tW = A.at(S, 'wrong', 2.0);

      S.D.figs[2].anim = (o, lt) => { o.pose = lt > tW + .9 ? 'think' : 'cheer'; o.mood = lt > tW + .9 ? 'worried' : 'happy'; };
      S.D.over = [grade(tW - .4, tW + 1.6), (c, lt) => K.badge(c, 'FIRST BOSTON · NEW YORK', lt, { at: .3 }), (c, lt) => K.dateTag(c, '1986', lt, { at: tY }), (c, lt) => K.title(c, '1986', lt, { at: tY, until: tW + .2, x: 1280, y: 240, px: 150, fill: GOLD })];
      S.D.sfx = [[tY, 'hit', .45], [tW, 'tension', .45], [tW + .1, 'swell', .3]]; } },
  // 2 suburb: the fear (people stop paying) gets crossed out; rates fall; cash flies back out of every house
  { plate: 'suburb', cam: { z: [1.0, 1.07], x: [1280, 1280], y: [730, 760] }, bed: [['birds_loop', .35]],
    init: S => { const tF = A.at(S, 'stopped paying', 2.6), tO = A.at(S, 'opposite', 5.2), tR = A.at(S, 'Rates fell', 6.4), tE = A.at(S, 'paid back early', 7.8), houses = [256, 768, 1280, 1792, 2304];
      const cash = (i) => (c, lt) => { const t0 = tE + i * .18, u = K.seg(lt, t0, t0 + 1.5); if (u <= 0 || u >= 1) return; const hx = houses[i], x = hx + 420 * u, y = 860 - 900 * (u * u) - Math.sin(u * Math.PI) * 120; c.save(); c.translate(x, y); c.rotate(Math.sin(u * 7 + i) * .5); bundle(c, 1.3); c.restore(); };
      S.D.front = houses.map((h, i) => cash(i));
      S.D.over = [(c, lt) => { K.card(c, 'THE FEAR:\nPEOPLE STOP PAYING', lt, { at: tF - .6, x: 520, y: 220, px: 52, rot: -3 }); redX(c, 520, 220, 520, 190, K.seg(lt, tO, tO + .5)); },
        (c, lt) => rateChart(c, lt, tR - .2, 1450, 270),
        (c, lt) => K.card(c, 'PAID BACK EARLY', lt, { at: tE + .3, x: 960, y: 900, px: 60, rot: 2 })];
      S.D.sfx = [[tF - .6, 'pop', .45], [tO, 'scrape', .5], [tR - .2, 'pop', .45], [tR + .4, 'whoosh_soft', .4], [tE, 'coins', .4], [tE + .5, 'whoosh', .35]]; } },
  // 3 kitchen: a family over their loan papers; the loan card fills line by line
  { plate: 'kitchen', cam: { z: [1.12, 1.2], x: [1280, 1300], y: [860, 880] }, bed: [['hum_loop', .35], ['birds_loop', .15]],
    figs: [{ x: 960, y: 1300, s: 2.1, ...DAD, facing: 1, pose: 'stand' }, { x: 1610, y: 1300, s: 2.0, ...MOM, facing: -1, pose: 'stand' }],
    init: S => { const t2 = A.at(S, 'two hundred thousand', 1.4), t9 = A.at(S, 'nine percent', 3.0), t16 = A.at(S, 'sixteen hundred', 5.0), t30 = A.at(S, 'thirty years', 6.2);
      S.D.figs[0].anim = (o, lt) => { o.pose = lt > t2 - .3 && lt < t16 ? 'present' : lt >= t16 ? 'think' : 'stand'; o.mood = lt > t30 ? 'worried' : 'neutral'; };
      S.D.figs[1].anim = (o, lt) => { o.pose = lt > t16 - .2 ? 'think' : 'stand'; o.mood = lt > t16 ? 'worried' : 'neutral'; };
      const table = (c, lt) => { const x = 1285, y = 1150; c.save(); c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(x, y + 250, 470, 34, 0, 0, 7); c.fill(); c.fillStyle = '#6a4228'; c.strokeStyle = INK; c.lineWidth = 5; for (const lx of [-340, 320]) { c.fillRect(x + lx, y + 40, 26, 210); c.strokeRect(x + lx, y + 40, 26, 210); }
        const g = c.createLinearGradient(0, y - 20, 0, y + 50); g.addColorStop(0, '#a87448'); g.addColorStop(1, '#7a4e2e'); c.fillStyle = g; c.beginPath(); c.moveTo(x - 420, y); c.lineTo(x + 420, y); c.lineTo(x + 440, y + 44); c.lineTo(x - 440, y + 44); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#5a3820'; c.fillRect(x - 440, y + 44, 880, 18); c.strokeRect(x - 440, y + 44, 880, 18);
        c.save(); c.translate(x - 30, y + 18); c.transform(1, 0, -.3, .42, 0, 0); loanDoc(c, 180, 220); c.restore(); c.save(); c.translate(x + 200, y + 14); c.transform(1, 0, -.2, .42, 0, 0); c.fillStyle = '#e8e4da'; c.strokeStyle = INK; c.lineWidth = 3; c.fillRect(-50, -60, 100, 120); c.strokeRect(-50, -60, 100, 120); c.restore();
        c.fillStyle = '#f4f0e4'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.roundRect(x - 300, y - 30, 44, 50, 6); c.fill(); c.stroke(); c.beginPath(); c.arc(x - 254, y - 6, 14, -1.2, 1.2); c.stroke(); for (let k = 0; k < 2; k++) { c.strokeStyle = `rgba(255,255,255,${.3 - k * .1})`; c.lineWidth = 4; c.beginPath(); const sx = x - 278 + k * 10, ph = lt * 1.5 + k; c.moveTo(sx, y - 36); c.bezierCurveTo(sx + Math.sin(ph) * 14, y - 70, sx - Math.sin(ph) * 14, y - 100, sx + Math.sin(ph + 1) * 8, y - 130); c.stroke(); } c.restore(); };
      S.D.front = [table];
      const card = (c, lt) => { const a = pop(lt, t2 - .2); if (a <= 0) return; c.save(); c.translate(960, 220); c.scale(a, a); c.rotate(-.02); c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(-326, -136, 660, 290); c.fillStyle = '#fffaf0'; c.strokeStyle = INK; c.lineWidth = 6; c.fillRect(-330, -140, 660, 290); c.strokeRect(-330, -140, 660, 290); c.strokeStyle = 'rgba(200,70,60,.45)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-250, -140); c.lineTo(-250, 150); c.stroke();
        const rows = [['LOAN', '$200,000', t2], ['RATE', '9%', t9], ['PAYMENT', '≈ $1,600 / MONTH', t16], ['TERM', '30 YEARS', t30]]; c.textBaseline = 'middle';
        rows.forEach(([k, v, at], i) => { const b = K.seg(lt, at, at + .3); if (b <= 0) return; const y = -100 + i * 66; c.globalAlpha = b; c.fillStyle = '#7a6a58'; c.font = font(28, 'Oswald'); c.textAlign = 'left'; c.fillText(k, -230, y); c.fillStyle = i === 1 ? RED : INK; c.font = font(46); c.textAlign = 'right'; c.fillText(v, 300, y); c.globalAlpha = 1; }); c.restore(); };
      S.D.over = [card];
      S.D.sfx = [[t2 - .2, 'paper', .5], [t2, 'pop', .4], [t9, 'stamp', .45], [t16, 'coins', .35], [t30, 'tick', .45]]; } },
  // 4 bank street: the 7% banner pulses; the family walks over, the old loan is stamped PAID, and they walk out
  { plate: 'bank_street', cam: { z: [1.0, 1.05], x: [1280, 1290], y: [740, 760] }, bed: [['city_loop', .35], ['birds_loop', .15]],
    figs: [{ x: 600, y: 1170, s: 1.55, ...DAD, facing: 1, pose: 'stand' }, { x: 700, y: 1176, s: 1.5, ...MOM, facing: 1, pose: 'stand' }],
    init: S => { const t7 = A.at(S, 'seven percent', 1.0), tN = A.at(S, 'new loan', 2.4), tP = A.at(S, 'pay off', 3.6), tW = A.at(S, 'walk out', 4.6);
      const walker = (x0, dx) => (o, lt) => { const w1 = K.seg(lt, tN - .5, tP - .1), w2 = K.seg(lt, tW - .3, tW + 2.5), x = x0 + (1800 - x0 + dx) * E.io(w1) + 900 * w2; o.x = x; o.t = lt; const moving = (w1 > 0 && w1 < 1) || (w2 > 0 && w2 < 1); o.pose = moving ? 'walk' : (lt > t7 - .2 && lt < tN - .5 && dx === 0 ? 'point' : 'stand'); o.facing = 1; o.mood = lt > t7 ? 'happy' : 'neutral'; };
      S.D.figs[0].anim = walker(600, 0); S.D.figs[1].anim = walker(700, 110);
      S.D.live = [(c, lt) => { const p = K.seg(lt, t7 - .1, t7 + .3) * (1 - K.seg(lt, tP, tP + .6)); if (p <= 0) return; c.save(); c.globalCompositeOperation = 'screen'; const r = 260 + Math.sin(lt * 8) * 30, g = c.createRadialGradient(1920, 800, 20, 1920, 800, r); g.addColorStop(0, `rgba(255,220,140,${.5 * p})`); g.addColorStop(1, 'rgba(255,220,140,0)'); c.fillStyle = g; c.fillRect(1500, 500, 840, 600); c.restore(); }];
      S.D.over = [(c, lt) => { const a = pop(lt, tP - .5); if (a <= 0) return; const out = 1 - K.seg(lt, tW + .6, tW + 1); if (out <= 0) return; c.save(); c.globalAlpha = out; c.translate(330, 290); c.scale(a * 1.6, a * 1.6); c.rotate(-.06); loanDoc(c, 150, 190, 'OLD LOAN · 9%'); const s = K.seg(lt, tP, tP + .25); if (s > 0) { c.save(); c.rotate(-.35); c.scale(2 - s, 2 - s); c.globalAlpha *= s; c.strokeStyle = RED; c.lineWidth = 6; c.strokeRect(-70, -26, 140, 52); c.fillStyle = RED; c.font = font(42); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('PAID', 0, 2); c.restore(); } c.restore(); },
        (c, lt) => K.card(c, 'SWAP 9% FOR 7%', lt, { at: tN, x: 1480, y: 140, px: 50, rot: 3, until: tW + 1.4 })];
      S.D.sfx = [[t7, 'chime', .45], [tN - .5, 'footsteps', .45], [tP, 'stamp', .6], [tW - .3, 'footsteps', .4], [tW + .4, 'door_slam', .25]]; } },
  // 5 bank hall: the 30-year calendar of interest burns away from the far end
  { plate: 'bank', cam: { z: [1.08, 1.16], x: [1280, 1300], y: [830, 850] }, bed: [['hum_loop', .3]],
    init: S => { const tT = A.at(S, 'thirty years', 1.2), tD = A.at(S, 'disappears', 3.4), x0 = 380, y0 = 1110, L = 1900;
      const burnX = (lt) => x0 + L * (1 - E.io(K.seg(lt, tT + .5, tD + .8)));
      const cal = (c, lt) => { const u = E.out(K.seg(lt, 0, .9)); if (u <= 0) return; const bx = Math.min(burnX(lt), x0 + L * u), sl = (t) => 30 * t; c.save();
        c.fillStyle = 'rgba(0,0,0,.2)'; c.beginPath(); c.moveTo(x0, y0 + 10); c.lineTo(bx, y0 + 10 + sl((bx - x0) / L)); c.lineTo(bx, y0 + 150); c.lineTo(x0, y0 + 110); c.fill();
        c.fillStyle = '#fbf7ea'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.moveTo(x0, y0); c.lineTo(bx, y0 + sl((bx - x0) / L)); c.lineTo(bx, y0 + 100 + 40 * (bx - x0) / L); c.lineTo(x0, y0 + 100); c.closePath(); c.fill(); c.stroke();

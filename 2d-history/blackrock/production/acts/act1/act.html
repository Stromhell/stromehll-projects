const FINK = { costume: 'shirtsleeves', hair: 'swept', hairCol: '#4a3220', seed: 7 };

// gold coin (screen or world)
const coin = (c, x, y, r = 16, a = 1) => { c.save(); c.globalAlpha *= a; c.fillStyle = '#b8862a'; c.beginPath(); c.ellipse(x, y + r * .18, r, r * .72, 0, 0, 7); c.fill(); c.fillStyle = GOLD; c.beginPath(); c.ellipse(x, y, r, r * .72, 0, 0, 7); c.fill(); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke(); c.fillStyle = '#fff2c0'; c.font = `bold ${r * .9}px Oswald`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('$', x, y + 1); c.restore(); };

// paper slips fluttering down (world coords)
const slips = (n, x0, x1, y0, y1, gold = false) => (c, lt) => { for (let i = 0; i < n; i++) { const sp = 60 + (i * 37 % 50), x = x0 + ((i * 271) % (x1 - x0)) + Math.sin(lt * 1.7 + i) * 30, y = y0 + ((i * 113 + lt * sp) % (y1 - y0)); c.save(); c.translate(x, y); c.rotate(Math.sin(lt * 3 + i) * 1.2); c.scale(1, Math.abs(Math.cos(lt * 4 + i))); c.fillStyle = gold ? (i % 3 ? '#f2c24a' : '#fff0b0') : (i % 4 ? '#f4f0e4' : '#f0d890'); c.fillRect(-12, -6, 24, 12); c.restore(); } };

const ledger = (c, x, y, w, h) => { c.fillStyle = 'rgba(10,8,6,.45)'; c.fillRect(x + 14, y + 16, w, h); c.fillStyle = '#f7f1e2'; c.fillRect(x, y, w, h); c.strokeStyle = 'rgba(80,120,170,.35)'; c.lineWidth = 2; for (let yy = y + 90; yy < y + h; yy += 46) { c.beginPath(); c.moveTo(x, yy); c.lineTo(x + w, yy); c.stroke(); } c.strokeStyle = 'rgba(200,70,60,.5)'; c.beginPath(); c.moveTo(x + 90, y); c.lineTo(x + 90, y + h); c.stroke(); c.strokeStyle = INK; c.lineWidth = 6; c.strokeRect(x, y, w, h); };
// blurred trading-floor backdrop for the board shots, with Fink standing on the floor beside the board
const BX = 110, BY = 80, BW = 1330, BH = 820;
const boardShot = (opts = {}) => (c, lt, u, S) => { c.save(); c.filter = 'blur(6px) brightness(.55)'; const s2 = 1.15 * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 760 * s2); c.drawImage(K.imgs.trading, 0, 0, 2560, 1440); c.restore(); K.screen(c);
  const g = c.createLinearGradient(0, 940, 0, SH); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.35)'); c.fillStyle = g; c.fillRect(0, 900, SW, 180);

  ledger(c, BX, BY, BW, BH); };
const finkAtBoard = (pose, extra = {}) => (c, lt) => { R.figure(c, fink(Object.assign({ x: 1690, y: 1050, s: 1.75, pose, facing: -1, t: lt, mood: 'happy' }, extra))); };

      const doc = (i) => (c, lt) => { const t0 = .6 + i * .45, u = K.seg(lt, t0, t0 + 1.4); if (u <= 0 || u >= 1) return; const hx = houses[i], hy = 870, x = hx + (FX - hx) * E.io(u), y = hy + (FY - 60 - hy) * u - Math.sin(u * Math.PI) * 220; c.save(); c.translate(x, y); c.rotate(Math.sin(u * 9 + i) * .4); c.scale(1.5, 1.5); c.fillStyle = '#fbf7ea'; c.strokeStyle = INK; c.lineWidth = 3; c.fillRect(-34, -44, 68, 88); c.strokeRect(-34, -44, 68, 88); c.fillStyle = RED; c.font = 'bold 13px Oswald'; c.textAlign = 'center'; c.fillText('MORTGAGE', 0, -26); c.strokeStyle = 'rgba(40,40,60,.5)'; c.lineWidth = 2; for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(-24, -10 + k * 12); c.lineTo(24, -10 + k * 12); c.stroke(); } c.fillStyle = BLUE; c.beginPath(); c.moveTo(-10, 38); c.lineTo(0, 28); c.lineTo(10, 38); c.fill(); c.restore(); };

    init: S => { const tM = A.at(S, 'hundred million', 1.6), tT = A.at(S, 'thirty years', 3.8), tB = A.at(S, 'back', 5.6);

        c.fillStyle = '#fbf7ea'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y0 + 30); c.lineTo(x1, y0 + 140); c.lineTo(x0, y0 + 100); c.closePath(); c.fill(); c.stroke();
        const n = Math.floor(30 * u); for (let k = 0; k <= n; k++) { const t = k / 30, xx = x0 + 1800 * t, top = y0 + 30 * t, bot = y0 + 100 + 40 * t; c.strokeStyle = 'rgba(40,30,20,.35)'; c.lineWidth = 2; c.beginPath(); c.moveTo(xx, top); c.lineTo(xx, bot); c.stroke(); if (k % 5 === 0) { c.fillStyle = k === 30 ? RED : INK; c.font = `bold ${20 + t * 10}px Oswald`; c.textAlign = 'left'; c.fillText(String(1983 + k), xx + 6, (top + bot) / 2 + 8); } }
        c.fillStyle = '#e8e0cc'; c.beginPath(); c.ellipse(x1, y0 + 85, 26, 58, 0, 0, 7); c.fill(); c.stroke(); c.restore(); };

      S.D.sfx = [[tM, 'coins', .45], [tT, 'paper_tear', .3], [tT + .1, 'whoosh', .45], [tT + .8, 'pop', .5], [tB, 'tick', .4]]; } },

  { draw: boardShot(), bed: [['office_loop', .2]],
    init: S => { const t1 = A.at(S, 'buys those loans', 1.0), t2 = A.at(S, 'pools them', 2.4), t3 = A.at(S, 'sells bonds', 3.4), t4 = A.at(S, 'Investors get the interest', 5.4), t5 = A.at(S, 'cash back today', 7.4);
      S.D.over = [(c, lt) => { c.save(); c.fillStyle = INK; c.font = font(46); c.textAlign = 'center'; c.fillText('MORTGAGE-BACKED BONDS', BX + BW / 2, BY + 66); c.restore();

        const arrow = (x0, y0, x1, y1, at, col = INK, dash) => { const u = E.out(K.seg(lt, at, at + .6)); if (u <= 0) return; const xe = x0 + (x1 - x0) * u, ye = y0 + (y1 - y0) * u; c.save(); c.strokeStyle = col; c.lineWidth = 8; if (dash) { c.setLineDash([18, 12]); c.lineDashOffset = -lt * 60; } c.beginPath(); c.moveTo(x0, y0); c.lineTo(xe, ye); c.stroke(); c.setLineDash([]); const an = Math.atan2(y1 - y0, x1 - x0); c.fillStyle = col; c.beginPath(); c.moveTo(xe, ye); c.lineTo(xe - Math.cos(an - .5) * 30, ye - Math.sin(an - .5) * 30); c.lineTo(xe - Math.cos(an + .5) * 30, ye - Math.sin(an + .5) * 30); c.fill(); c.restore(); };

<body><canvas id="c" width="1920" height="1080"></canvas>

<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
for (const n of ['bank', 'trading', 'newsroom', 'skyline', 'boardroom', 'dawn_tower', 'rain_tower', 'office']) K.load(n, PL + n + '.jpg');
const SW = 1920, SH = 1080, INK = '#1d1712', GOLD = '#e8b44a', RED = '#d9483b', GREEN = '#4f9a4a';
const pop = (lt, at, d = .45) => E.back(K.seg(lt, at, at + d));
const plateAt = (c, name, px, py, sx, sy, z) => { const s2 = z * 1920 / 2560; c.setTransform(s2, 0, 0, s2, sx - px * s2, sy - py * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); return s2; };
const backdrop = (name, dim = .5, blur = 6) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${1 - dim})`; plateAt(c, name, 1280, 720, 960, 540, 1.08); c.restore(); c.setTransform(1, 0, 0, 1, 0, 0); };
const DIMON = { costume: 'suit', hair: 'swept', hairCol: '#3a2a20', seed: 7 }, WEILL = { costume: 'suit80', hair: 'bald', hairCol: '#b8b8b8', glasses: true, seed: 2 };
const KID = { costume: 'shirt', hair: 'short', hairCol: '#3a2a20', seed: 7 };
// framed photo with a figure inside (screen)
const photo = (c, x, y, w, h, a, lt, fig, cap, sepia = true) => { if (a <= 0) return; c.save(); c.translate(x, y); c.scale(a, a); c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(-w / 2 + 12, -h / 2 + 12, w, h); c.fillStyle = '#5a3a22'; c.fillRect(-w / 2, -h / 2, w, h); c.fillStyle = sepia ? '#d8c49a' : '#c8d4dc'; c.fillRect(-w / 2 + 22, -h / 2 + 22, w - 44, h - 90);
  c.save(); c.beginPath(); c.rect(-w / 2 + 22, -h / 2 + 22, w - 44, h - 90); c.clip(); if (sepia) c.filter = 'sepia(.7)'; R.figure(c, Object.assign({ x: 0, y: h / 2 + 120, s: 1.25, pose: 'stand', facing: 1, t: lt, mood: 'neutral' }, fig)); c.restore();
  c.font = '30px Anton'; c.fillStyle = '#f2e6c8'; c.textAlign = 'center'; c.fillText(cap, 0, h / 2 - 26); c.restore(); };
const envelope = (c, x, y, s, rot, txt) => { c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s); c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(-150, -90, 310, 200); c.fillStyle = '#f4ecd8'; c.strokeStyle = INK; c.lineWidth = 5; c.fillRect(-160, -100, 320, 200); c.strokeRect(-160, -100, 320, 200); c.beginPath(); c.moveTo(-160, -100); c.lineTo(0, 10); c.lineTo(160, -100); c.stroke(); if (txt) { c.font = '34px Anton'; c.fillStyle = INK; c.textAlign = 'center'; c.fillText(txt, 0, 70); } c.restore(); };
const letter = (c, x, y, rot, a, head, col) => { if (a <= 0) return; c.save(); c.translate(x, y); c.rotate(rot); c.scale(a, a); c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(-170, -230, 360, 480); c.fillStyle = '#fbf8f0'; c.strokeStyle = INK; c.lineWidth = 5; c.fillRect(-180, -240, 360, 480); c.strokeRect(-180, -240, 360, 480); c.fillStyle = col; c.fillRect(-180, -240, 360, 70); c.font = '34px Anton'; c.fillStyle = '#fff'; c.textAlign = 'center'; c.fillText(head, 0, -192); c.fillStyle = '#bbb'; for (let k = 0; k < 8; k++) c.fillRect(-140, -130 + k * 36, 280 - (k % 3) * 40, 12); c.font = '34px Caveat'; c.fillStyle = '#2a4a9a'; c.fillText('Offer of employment', 0, 200); c.restore(); };
const tower = (c, x, base, names, n, lt, at) => { names.forEach((nm, i) => { const u = pop(lt, at[i] ?? 99, .45); if (u <= 0) return; const y = base - i * 112 - 260 * (1 - E.out(K.seg(lt, at[i], at[i] + .35))); c.save(); c.translate(x, y); c.globalAlpha = Math.min(1, u * 2); c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(-268, -42, 548, 100); c.fillStyle = i % 2 ? '#2f5a8a' : '#3f6aa0'; c.strokeStyle = INK; c.lineWidth = 5; c.fillRect(-280, -54, 560, 100); c.strokeRect(-280, -54, 560, 100); c.font = '48px Anton'; c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(nm, 0, 0); c.restore(); }); };
const spot = (c, x, a) => { c.save(); c.globalAlpha = a; const g = c.createRadialGradient(x, 860, 20, x, 860, 420); g.addColorStop(0, 'rgba(255,240,200,.55)'); g.addColorStop(1, 'rgba(255,240,200,0)'); c.fillStyle = g; c.beginPath(); c.moveTo(x - 60, 0); c.lineTo(x + 60, 0); c.lineTo(x + 340, 1000); c.lineTo(x - 340, 1000); c.closePath(); c.fill(); c.restore(); };

// simple bank building icon (screen)
const bankIcon = (c, x, y, s, a, lab, col = '#d8cdb8') => { if (a <= 0) return; c.save(); c.translate(x, y); c.scale(s * a, s * a); c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(0, 6, 230, 18, 0, 0, 7); c.fill(); c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.moveTo(-220, -260); c.lineTo(0, -380); c.lineTo(220, -260); c.closePath(); c.fill(); c.stroke(); for (let k = -165; k <= 165; k += 66) { c.fillRect(k - 18, -250, 36, 210); c.strokeRect(k - 18, -250, 36, 210); } c.fillRect(-240, -40, 480, 40); c.strokeRect(-240, -40, 480, 40); if (lab) { c.font = '44px Anton'; c.fillStyle = INK; c.textAlign = 'center'; c.fillText(lab, 0, -282); } c.restore(); };
// a flying coin along a curve from (x0,y0) to (x1,y1), progress u
const flyCoin = (c, x0, y0, x1, y1, u, r = 26) => { if (u <= 0 || u >= 1) return; const x = x0 + (x1 - x0) * u, y = y0 + (y1 - y0) * u - Math.sin(u * Math.PI) * 120; JK.coin(c, x, y, r, 1); };
// a stacked balance bar: own capital (gold) on the bottom, borrowed (grey) above; 100 units tall
const stackBar = (c, x, base, own, g, lab, sub) => { const U = 6.2, W = 230; const H = 100 * U * g; c.save(); c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(x - W / 2 + 12, base - H + 12, W, H); const ho = Math.min(H, own * U); c.fillStyle = GOLD; c.strokeStyle = INK; c.lineWidth = 5; c.fillRect(x - W / 2, base - ho, W, ho); c.strokeRect(x - W / 2, base - ho, W, ho); if (H > ho) { c.fillStyle = '#8a92a0'; c.fillRect(x - W / 2, base - H, W, H - ho); c.strokeRect(x - W / 2, base - H, W, H - ho); }
  c.font = '44px Anton'; c.textAlign = 'center'; c.fillStyle = '#fffaf0'; c.fillText(lab, x, base + 56); if (sub && g > .95) { c.font = '34px Anton'; c.fillStyle = '#2a2018'; c.fillText(`$${100 - own} BORROWED`, x, base - H / 2 - 10); c.fillStyle = '#fffaf0'; c.textAlign = 'left'; c.fillText(`$${own} OWN CAPITAL`, x + W / 2 + 24, base - ho / 2 + 12); } c.restore(); };
const board = (name = 'office', dim = .62) => backdrop(name, dim);

const BURRY = { costume: 'suit', hair: 'short', hairCol: '#4a3a2a', glasses: true, seed: 12 }, DANCER = { costume: 'dress', hair: 'long', hairCol: '#2a1a14', seed: 21 }, EXEC = { costume: 'shirt', hair: 'short', hairCol: '#6a4a2a', seed: 15 };
const HOUSES = [240, 760, 1260, 1780, 2260];
const sign = (c, x, y, a, txt = 'SOLD') => { if (a <= 0) return; c.save(); c.translate(x, y); c.scale(1, Math.min(1, a)); c.strokeStyle = '#5a3a20'; c.lineWidth = 8; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -120); c.stroke(); c.fillStyle = '#fbf8f0'; c.strokeStyle = INK; c.lineWidth = 4; c.fillRect(-70, -170, 140, 64); c.strokeRect(-70, -170, 140, 64); c.font = '40px Anton'; c.fillStyle = RED; c.textAlign = 'center'; c.fillText(txt, 0, -122); c.restore(); };
const miniHouse = (c, x, y, s, a, col = '#e8dcc0', lab) => { if (a <= 0) return; c.save(); c.translate(x, y); c.scale(s * a, s * a); c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 5; c.fillRect(-60, -70, 120, 70); c.strokeRect(-60, -70, 120, 70); c.fillStyle = '#7a3a2a'; c.beginPath(); c.moveTo(-76, -68); c.lineTo(0, -130); c.lineTo(76, -68); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#4a5a6a'; c.fillRect(-14, -40, 28, 40); if (lab) { c.font = '30px Anton'; c.fillStyle = '#fffaf0'; c.textAlign = 'center'; c.fillText(lab, 0, 50); } c.restore(); };
const chart = (c, x, y, w, h, pts, u, col, lab) => { c.save(); c.fillStyle = 'rgba(251,248,240,.95)'; c.strokeStyle = INK; c.lineWidth = 5; c.fillRect(x, y, w, h); c.strokeRect(x, y, w, h); c.strokeStyle = '#d8d0c0'; c.lineWidth = 2; for (let k = 1; k < 5; k++) { c.beginPath(); c.moveTo(x + 20, y + k * h / 5); c.lineTo(x + w - 20, y + k * h / 5); c.stroke(); } c.strokeStyle = col; c.lineWidth = 9; c.lineJoin = 'round'; c.beginPath(); const n = pts.length - 1, m = u * n; for (let i = 0; i <= Math.min(n, Math.floor(m) + 1); i++) { const f = Math.min(1, m - (i - 1)); let px = x + 40 + (w - 80) * i / n, py = y + h - 30 - (h - 60) * pts[i]; if (i > 0 && f < 1) { const qx = x + 40 + (w - 80) * (i - 1) / n, qy = y + h - 30 - (h - 60) * pts[i - 1]; px = qx + (px - qx) * f; py = qy + (py - qy) * f; } i ? c.lineTo(px, py) : c.moveTo(px, py); if (f < 1) break; } c.stroke(); c.font = '34px Anton'; c.fillStyle = INK; c.textAlign = 'left'; c.fillText(lab, x + 30, y + 46); c.restore(); };
// capital block: 1 dollar = 56px; own capital, loss eaten from the top, red below zero
const capBlock = (c, x, zero, own, loss, lab) => { const U = 56, W = 260; c.save(); c.strokeStyle = '#fffaf0'; c.lineWidth = 4; c.setLineDash([14, 10]); c.beginPath(); c.moveTo(x - 220, zero); c.lineTo(x + 220, zero); c.stroke(); c.setLineDash([]); const left = own - loss; const hk = Math.max(0, left) * U; c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(x - W / 2 + 12, zero - own * U + 12, W, own * U); c.fillStyle = GOLD; c.strokeStyle = INK; c.lineWidth = 5; if (hk > 0) { c.fillRect(x - W / 2, zero - hk, W, hk); c.strokeRect(x - W / 2, zero - hk, W, hk); }
  const eaten = Math.min(own, loss) * U; if (eaten > 0) { c.save(); c.setLineDash([10, 8]); c.strokeStyle = 'rgba(255,250,240,.5)'; c.strokeRect(x - W / 2, zero - own * U, W, eaten); c.restore(); }
  if (left < 0) { c.fillStyle = RED; c.fillRect(x - W / 2, zero, W, -left * U); c.strokeRect(x - W / 2, zero, W, -left * U); } c.font = '48px Anton'; c.textAlign = 'center'; c.fillStyle = '#fffaf0'; c.fillText(lab, x, zero - own * U - 30); c.font = '60px Anton'; c.fillStyle = left < 0 ? '#ffd8d0' : '#2a2018'; c.fillText((left < 0 ? '−$' : '$') + Math.abs(Math.round(left * 10) / 10), x, left < 0 ? zero - left * U + 80 : zero - Math.max(hk, 70) / 2 + 22); c.restore(); };
const ratioBars = (c, rows, lt) => { rows.forEach(([n, r, at, col], i) => { const a = pop(lt, at); if (a <= 0) return; const y = 260 + i * 170, w = 36 * r * E.out(Math.min(1, a)); c.save(); c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(472, y - 40 + 10, w, 90); c.fillStyle = '#8a92a0'; c.strokeStyle = INK; c.lineWidth = 5; c.fillRect(460, y - 40, w, 90); c.strokeRect(460, y - 40, w, 90); c.fillStyle = GOLD; c.fillRect(460, y - 40, 36, 90); c.strokeRect(460, y - 40, 36, 90); c.font = '48px Anton'; c.fillStyle = '#fffaf0'; c.textAlign = 'right'; c.fillText(n, 430, y + 18); c.textAlign = 'left'; c.fillStyle = col; c.fillText(r + ' : 1', 480 + w, y + 18); c.restore(); }); };
const savanna = (c, x0, w, lt) => { c.save(); c.beginPath(); c.rect(x0, 0, w, 1080); c.clip(); const g = c.createLinearGradient(0, 0, 0, 700); g.addColorStop(0, '#f0b060'); g.addColorStop(1, '#f8dca0'); c.fillStyle = g; c.fillRect(x0, 0, w, 700); c.fillStyle = 'rgba(255,240,200,.8)'; c.beginPath(); c.arc(x0 + w * .7, 420, 90, 0, 7); c.fill(); c.fillStyle = '#c8a050'; c.fillRect(x0, 680, w, 400); c.fillStyle = '#b08a40'; for (let k = 0; k < 30; k++) c.fillRect(x0 + (k * 97) % w, 700 + (k * 61) % 360, 30, 6);
  [[.25, 640, 1], [.82, 660, .8]].forEach(([fx, y, s]) => { const x = x0 + w * fx; c.fillStyle = '#4a3420'; c.fillRect(x - 8 * s, y - 180 * s, 16 * s, 180 * s); c.fillStyle = '#4a6a2a'; c.beginPath(); c.ellipse(x, y - 190 * s, 150 * s, 40 * s, 0, 0, 7); c.fill(); }); c.restore(); };

// speech bubble (screen); tail points down-left or down-right
const bubble = (c, x, y, txt, a, dir = 1, px = 40) => { if (a <= 0) return; c.save(); c.translate(x, y); const s = Math.min(1, a); c.scale(s, s); c.font = px + 'px Anton'; const lines = txt.split('\n'), w = Math.max(...lines.map(l => c.measureText(l).width)) + 60, h = lines.length * px * 1.15 + 40;
  c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.roundRect(-w / 2 + 8, -h / 2 + 10, w, h, 26); c.fill(); c.fillStyle = '#fffaf0'; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.roundRect(-w / 2, -h / 2, w, h, 26); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(-30 * dir, h / 2 - 3); c.lineTo(-70 * dir, h / 2 + 50); c.lineTo(10 * dir, h / 2 - 3); c.closePath(); c.fill(); c.stroke(); c.fillRect(-34 * dir - (dir > 0 ? 0 : -0), h / 2 - 8, 44 * dir, 8);
  c.fillStyle = INK; c.textAlign = 'center'; c.textBaseline = 'middle'; lines.forEach((l, i) => c.fillText(l, 0, -h / 2 + 20 + px * .58 + i * px * 1.15)); c.restore(); };
// a price tag with any price (screen), swings in from the top
const tagAt = (c, x, lt, at, price, sub = 'PER SHARE', col = RED) => { const u = K.seg(lt, at, at + .7); if (u <= 0) return; const t = lt - at, sw = Math.sin(t * 3.4) * Math.exp(-t * .7) * .5, L = 260 + 140 * E.out(u);
  c.save(); c.translate(x, -40); c.rotate(sw); c.strokeStyle = '#e8e0cc'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, L); c.stroke(); c.translate(0, L); c.rotate(-.1);
  c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.moveTo(-150, 30); c.lineTo(0, -20); c.lineTo(170, 30); c.lineTo(170, 290); c.lineTo(-150, 290); c.closePath(); c.fill();
  c.fillStyle = '#f4e8c8'; c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.moveTo(-160, 20); c.lineTo(0, -30); c.lineTo(160, 20); c.lineTo(160, 280); c.lineTo(-160, 280); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#2a2a2a'; c.beginPath(); c.arc(0, 4, 12, 0, 7); c.fill();
  c.fillStyle = col; c.font = (price.length > 2 ? 160 : 190) + 'px Anton'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(price, 0, 150); c.fillStyle = INK; c.font = '34px Oswald'; c.fillText(sub, 0, 252); c.restore(); };
// a stack of glowing mortgage crates (screen)
const crates = (c, x, y, a, lt) => { if (a <= 0) return; c.save(); c.translate(x, y); c.scale(a, a); const g = .5 + .5 * Math.sin(lt * 4); c.shadowColor = `rgba(150,255,120,${.35 + .25 * g})`; c.shadowBlur = 40;
  const rows = [[-300, 0], [-100, 0], [100, 0], [300, 0], [-200, -170], [0, -170], [200, -170], [-100, -340], [100, -340]]; for (const [cx, cy] of rows) { c.fillStyle = '#7a5a34'; c.strokeStyle = INK; c.lineWidth = 6; c.fillRect(cx - 95, cy - 160, 190, 160); c.strokeRect(cx - 95, cy - 160, 190, 160); c.shadowBlur = 0; c.strokeStyle = 'rgba(40,24,10,.6)'; c.lineWidth = 4; c.beginPath(); c.moveTo(cx - 95, cy - 160); c.lineTo(cx + 95, cy); c.moveTo(cx + 95, cy - 160); c.lineTo(cx - 95, cy); c.stroke(); c.fillStyle = '#e8dcc0'; c.fillRect(cx - 60, cy - 105, 120, 50); c.strokeStyle = INK; c.lineWidth = 3; c.strokeRect(cx - 60, cy - 105, 120, 50); c.fillStyle = INK; c.font = '30px Anton'; c.textAlign = 'center'; c.fillText('MBS', cx, cy - 68); c.shadowBlur = 40; }
  c.restore(); };
// a tall tower silhouette with lit windows (world); g grows 0..1
const madison = (c, x, base, g, lit) => { if (g <= 0) return; const H = 1150 * g, w = 300; c.save(); c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(x - w / 2 + 20, base - H + 10, w, H); const gr = c.createLinearGradient(x - w / 2, 0, x + w / 2, 0); gr.addColorStop(0, '#4a5262'); gr.addColorStop(.5, '#8a96aa'); gr.addColorStop(1, '#3a4252'); c.fillStyle = gr; c.strokeStyle = INK; c.lineWidth = 6;
  c.beginPath(); c.moveTo(x - w / 2, base); c.lineTo(x - w / 2, base - H + 160); c.lineTo(x - w / 3, base - H + 80); c.lineTo(x, base - H); c.lineTo(x + w / 3, base - H + 80); c.lineTo(x + w / 2, base - H + 160); c.lineTo(x + w / 2, base); c.closePath(); c.fill(); c.stroke();
  for (let r = 0; r * 26 < H - 190; r++) for (let k = 0; k < 6; k++) { const wx = x - w / 2 + 26 + k * 44, wy = base - 40 - r * 26; c.fillStyle = ((r * 7 + k * 3) % 5 < 3 && lit) ? 'rgba(255,220,140,.9)' : 'rgba(30,36,48,.85)'; c.fillRect(wx, wy, 26, 14); } c.restore(); };
// a two-pan balance (screen); tilt -1..1
const scale2 = (c, x, y, tilt, lab1, lab2, a) => { if (a <= 0) return; c.save(); c.globalAlpha = Math.min(1, a); c.translate(x, y); c.fillStyle = '#c9a040'; c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.moveTo(-90, 360); c.lineTo(90, 360); c.lineTo(20, 300); c.lineTo(20, -10); c.lineTo(-20, -10); c.lineTo(-20, 300); c.closePath(); c.fill(); c.stroke();
  c.save(); c.rotate(tilt * .18); c.fillRect(-520, -30, 1040, 26); c.strokeRect(-520, -30, 1040, 26); c.restore();
  for (const [sx, lab] of [[-1, lab1], [1, lab2]]) { const px = sx * 480 * Math.cos(tilt * .18), py = sx * 480 * Math.sin(tilt * .18); c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.moveTo(px, py - 18); c.lineTo(px - 160, py + 170); c.moveTo(px, py - 18); c.lineTo(px + 160, py + 170); c.stroke(); c.fillStyle = '#e8c870'; c.lineWidth = 6; c.beginPath(); c.ellipse(px, py + 180, 190, 34, 0, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#f4ecd8'; c.fillRect(px - 170, py + 40, 340, 120); c.strokeRect(px - 170, py + 40, 340, 120); c.fillStyle = INK; c.font = '40px Anton'; c.textAlign = 'center'; lab.split('\n').forEach((l, i) => c.fillText(l, px, py + 92 + i * 46)); }
  c.restore(); };
const TRADER = { costume: 'shirt', hair: 'short', hairCol: '#2a2018', seed: 31 }, TRADER2 = { costume: 'suit', hair: 'swept', hairCol: '#6a4a2a', seed: 44 }, STAFF = { costume: 'suit', hair: 'long', hairCol: '#3a2418', seed: 52 };

window.SHOTS = [
  // 1 Bear Stearns, since 1923; $170 a share in January 2007
  { plate: 'bank', cam: { z: [1.08, 1.15], x: [1280, 1290], y: [700, 690], ease: E.io }, bed: [['city_loop', .25]],
    init: S => { const tB = A.at(S, 'Bear Stearns', .3), t23 = A.at(S, '1923', 1.6), tP = A.at(S, 'hundred and seventy', 4);
      S.D.over = [(c, lt) => JK.plaque(c, 960, 196, 'BEAR STEARNS', 1.75, pop(lt, tB), 'WALL STREET · SINCE ' + (lt > t23 ? '1923' : '')), (c, lt) => K.dateTag(c, 'JANUARY 2007', lt, { at: tP - .8 }), (c, lt) => tagAt(c, 1520, lt, tP, '$170', 'A SHARE', GREEN)];
      S.D.sfx = [[tB, 'pop', .4], [t23, 'stamp', .35], [tP, 'chime', .4]]; } },
  // 2 overnight loans rolled over day after day

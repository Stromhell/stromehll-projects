  c.strokeStyle = '#3a2a1a'; c.lineWidth = 4; c.lineCap = 'round'; c.beginPath();

      { y: 1330, s: 1.65, ...DEP(5, '#1d1a18'), facing: -1, mood: 'angry', walk: { x0: 2860, x1: 1560, t0: 1.3, dur: 3 }, anim: (o, lt) => { if (lt > 4.3) o.pose = 'cheer'; } },

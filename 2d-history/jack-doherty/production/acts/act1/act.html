<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
const SW = 1920, SH = 1080, INK = TW.INK, RED = TW.RED, pop = TW.pop, fade = TW.fade;
const backdrop = (name, b = .5, blur = 8) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${b})`; const s2 = 1.06 * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 720 * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); c.restore(); K.screen(c); };
const CARRY = () => ({ shL: 30, elL: -75, shR: 35, elR: -75 });
const endTitle = (secs) => { const T = window.TIMING; const last = T.shots[T.shots.length - 1]; T.shots.push({ i: T.shots.length, start: last.end, end: last.end + secs, vo_start: last.end, vo_end: last.end, text: '' }); T.dur = last.end + secs; };
// JD act 1 - Kicked Out for a Living: 2017 floor-is-lava supermarket video, 15M views, kicked-out titles = ~90M views, the formula + the guard co-star, adult Jack with supercars.
// Plates: supermarket_aisle (x2, different framing; until it is painted the aisle is drawn here over the 'studio' stand-in: set AISLE_PLATE), teen_room, creator_room, lambo_showroom.
const AISLE_PLATE = 'supermarket_aisle', AISLE_SELF = AISLE_PLATE !== 'supermarket_aisle';
for (const n of [AISLE_PLATE, 'teen_room', 'creator_room', 'lambo_showroom']) K.load(n, PL + n + '.jpg');
const rr = TW.rr, txt = TW.txt, GOLD = '#f2c14a';
const ITEMS = ['SUPERMARKET', 'KICK', 'KICK (AGAIN)', 'PGA TOUR', 'SHUFFLE (PAID)'];
const at = (S, w, off = 0) => { const T = (S.text || '').split(/\s+/), i = Math.max(0, T.indexOf(w.split(' ')[0])), vs = (S.vo_start ?? S.start) - S.start, ve = (S.vo_end ?? S.end) - S.start; return A.at(S, w, vs + (ve - vs) * i / Math.max(1, T.length)) + off; };
const dateTag = (c, s, x, y, lt, t0, px = 40) => { const a = E.back(K.seg(lt, t0, t0 + .35)); if (a <= 0) return; c.save(); c.translate(x, y); c.scale(a, a); c.rotate(-.03); c.font = `${px}px Anton`; const w = c.measureText(s).width + 36; c.fillStyle = '#f4ead2'; c.strokeStyle = INK; c.lineWidth = 4; rr(c, -w / 2, -px * .75, w, px * 1.5, 6); c.fill(); c.stroke(); txt(c, s, 0, 0, px, '#8a2a1a', 'center', 'Anton'); c.restore(); };
const ntag = (c, name, x, y, lt, t0, px = 38) => { const a = pop(lt, t0, .4); if (a <= 0) return; c.save(); c.translate(x, y); c.scale(a, a); c.font = `${px}px Anton`; const w = c.measureText(name).width + px * .9, h = px * 1.45; c.fillStyle = 'rgba(0,0,0,.35)'; rr(c, -w / 2 + 6, -h / 2 + 6, w, h, 10); c.fill(); c.fillStyle = GOLD; c.strokeStyle = INK; c.lineWidth = 4; rr(c, -w / 2, -h / 2, w, h, 10); c.fill(); c.stroke(); txt(c, name, 0, 2, px, INK, 'center', 'Anton'); c.restore(); };
const dust = (c, lt, n, col, x0, w, y0, h) => { for (let k = 0; k < n; k++) { const x = x0 + (k * 263 + lt * 14 * (1 + k % 3)) % w, y = y0 + (k * 151 + Math.sin(lt * .7 + k) * 40 + 4000) % h; c.fillStyle = `rgba(${col},${.12 + .1 * Math.sin(lt * 2 + k)})`; c.fillRect(x, y, 5, 5); } };
const unscale = cc => { const m = cc.getTransform(); cc.setTransform(Math.hypot(m.a, m.b), 0, 0, Math.hypot(m.c, m.d), m.e, m.f); };
const HPHONE = (s = 1) => ({ near: cc => { cc.save(); unscale(cc); cc.scale(s, s); cc.fillStyle = '#1a1a22'; cc.strokeStyle = INK; cc.lineWidth = 3; rr(cc, -16, -32, 32, 58, 6); cc.fill(); cc.stroke(); cc.fillStyle = '#9ad8ff'; cc.fillRect(-12, -27, 24, 44); cc.restore(); } });
// hand-driven walk: moves o between x0 and x1 over [t0, t0+d] with leg phase
const goWalk = (o, lt, x0, x1, t0, d, s) => { const u = K.clamp((lt - t0) / d); o.x = x0 + (x1 - x0) * u; if (u > 0 && u < 1) { o.pose = 'walk'; o.t = Math.abs(o.x - x0) / (84 * s) * Math.PI; o.facing = Math.sign(x1 - x0); return true; } return false; };
const FLA = 1250;
// supermarket aisle drawn in code (stand-in until the supermarket_aisle plate exists)
const aisle = (c, lt, lava) => { if (AISLE_SELF) { const g = c.createLinearGradient(0, 0, 0, 1440); g.addColorStop(0, '#d8e0e4'); g.addColorStop(1, '#a8b2b8'); c.fillStyle = g; c.fillRect(0, 0, 2560, 1440);
    for (let k = 0; k < 7; k++) { c.fillStyle = '#f8fbff'; rr(c, 100 + k * 360, 60, 240, 26, 10); c.fill(); TW.glow(c, 220 + k * 360, 80, 200, '255,255,240', .25); }
    c.fillStyle = '#2a7a4a'; c.fillRect(0, 140, 2560, 70); txt(c, 'AISLE 7 · SNACKS & DRINKS', 1280, 176, 44, '#fff', 'center', 'Anton');
    for (let u = 0; u < 6; u++) { const x0 = u * 440; c.fillStyle = '#8a929a'; c.fillRect(x0 + 6, 240, 428, FLA - 240); c.strokeStyle = INK; c.lineWidth = 4; c.strokeRect(x0 + 6, 240, 428, FLA - 240);
      for (let s = 0; s < 5; s++) { const y = 290 + s * 190; c.fillStyle = '#5a626a'; c.fillRect(x0 + 6, y + 140, 428, 18);
        for (let p = 0; p < 9; p++) { const hh = 70 + ((u * 7 + s * 3 + p * 5) % 4) * 18; c.fillStyle = ['#e2342e', '#f2c14a', '#2a8ad8', '#3aa05a', '#e8742a', '#9a4ad0'][(u + s * 2 + p) % 6]; rr(c, x0 + 18 + p * 46, y + 140 - hh, 38, hh, 4); c.fill(); c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 2; c.stroke(); c.fillStyle = 'rgba(255,255,255,.6)'; c.fillRect(x0 + 24 + p * 46, y + 150 - hh * .6, 26, 8); } } }
    c.fillStyle = '#c8ccc8'; c.fillRect(0, FLA, 2560, 190); c.strokeStyle = 'rgba(0,0,0,.12)'; c.lineWidth = 2; for (let k = 0; k < 20; k++) { c.beginPath(); c.moveTo(k * 140, FLA); c.lineTo(k * 140 - 200, 1440); c.stroke(); } c.beginPath(); c.moveTo(0, 1330); c.lineTo(2560, 1330); c.stroke(); }
  if (lava > 0) { const g = c.createLinearGradient(0, FLA, 0, 1440); g.addColorStop(0, `rgba(255,90,20,${.55 * lava})`); g.addColorStop(1, `rgba(200,20,10,${.75 * lava})`); c.fillStyle = g; c.fillRect(0, FLA - 10, 2560, 200);
    for (let k = 0; k < 18; k++) { const ph = (lt * .7 + k / 18) % 1; c.fillStyle = `rgba(255,220,80,${lava * (1 - ph) * .8})`; c.beginPath(); c.arc((k * 149) % 2560, FLA + 60 + (k * 37) % 100 - ph * 40, 8 + ph * 12, 0, 7); c.fill(); } TW.glow(c, 1280, FLA, 1300, '255,90,30', .2 * lava); } };
const pallet = (c, x, top, w = 300) => { WN.shadow(c, x, FLA, w * .7, .4); c.fillStyle = '#b08a5a'; c.strokeStyle = INK; c.lineWidth = 4; c.fillRect(x - w / 2, FLA - 30, w, 30); c.strokeRect(x - w / 2, FLA - 30, w, 30);
  const n = Math.round((FLA - 30 - top) / 70); for (let i = 0; i < n; i++) for (let j = 0; j < 3; j++) { c.fillStyle = ['#c8a070', '#d8b080'][(i + j) % 2]; const bx = x - w / 2 + j * w / 3, by = FLA - 30 - (i + 1) * 70; c.fillRect(bx, by, w / 3, 70); c.strokeRect(bx, by, w / 3, 70); c.fillStyle = '#e2342e'; c.fillRect(bx + 20, by + 26, w / 3 - 40, 12); } };

window.SHOTS = [
  // 1.00 supermarket aisle, June 2017: teen Jack and Ricky hop between pallet stacks over a 'lava' floor; staff run in; they are walked out
  { plate: AISLE_PLATE, cam: { z: [1.15, 1.25], x: [1280, 1330], y: [820, 820] }, bed: [['crowd_loop', .06], ['hum_loop', .08]], light: { dir: 1, key: 'rgba(255,250,230,.08)' },
    init: S => { const tJu = at(S, 'June'), tRi = at(S, 'Ricky'), tFl = at(S, 'floor-is-lava'), tLe = at(S, 'leap'), tSh = at(S, 'shelf'), tSf = at(S, 'staff'), tRu = at(S, 'running,'), tTh = at(S, 'thrown');
      const TOP = FLA - 30 - 70 * 3, P = [620, 1120, 1620], SC = 1.5;
      // hop path: list of [time, pallet index]; jump .5 s arc
      const hop = (o, lt, plan) => { let x = P[plan[0][1]], y = TOP, air = false; for (let i = 1; i < plan.length; i++) { const [t, k] = plan[i], a = K.seg(lt, t, t + .5); if (a <= 0) break; const xa = x, xb = k < 0 ? xa + 220 * Math.sign(k + .5) : P[k], yb = k < 0 ? FLA : TOP; if (a < 1) { x = xa + (xb - xa) * a; y = y + (yb - y) * a - Math.sin(a * Math.PI) * 160; air = true; } else { x = xb; y = yb; } } o.x = x; o.y = y; return air; };
      const jPlan = [[0, 0], [tLe - .3, 1], [tSh, 2], [tSh + 1.2, 1], [tSf + .4, -1]], rPlan = [[0, 1], [tLe, 0], [tSh + .6, 1], [tSh + 1.7, 0], [tSf + .6, -1]];
      const out = tTh - .4;
      S.D.figs = [
        { x: P[0], y: TOP, s: SC, ...JD.JACK('teen'), facing: 1, mood: 'happy', hold: HPHONE(1), anim: (o, lt) => { const air = hop(o, lt, jPlan); o.pose = air ? 'cheer' : lt > tFl ? 'point' : 'wave'; if (lt > tRu) o.mood = 'surprised'; if (goWalk(o, lt, o.x, -300, out, 2.6, SC)) o.mood = 'happy'; } },
        { x: P[1], y: TOP, s: SC, ...JD.RICKY('teen'), facing: -1, mood: 'happy', anim: (o, lt) => { const air = hop(o, lt, rPlan); o.pose = air ? 'cheer' : 'shrug'; if (lt > tRu) o.mood = 'surprised'; goWalk(o, lt, o.x, -500, out + .2, 2.8, SC); } },
        { x: 2000, y: FLA, s: 1.6, ...JD.STAFF(0), facing: -1, mood: 'angry', anim: (o, lt) => { o.x = 2900; o.pose = 'stand'; if (lt > tSf - .6) { const u = K.seg(lt, tSf - .6, tRu + .4); o.x = 2900 - 900 * u; if (u < 1) { o.pose = 'run'; o.t = (2900 - o.x) / 134 * Math.PI; } else o.pose = 'point'; } goWalk(o, lt, 2000, -100, out + .6, 3.2, 1.6); } }];
      S.D.live = [(c, lt) => { aisle(c, lt, K.seg(lt, tFl - .3, tFl + .5)); for (const x of P) pallet(c, x, TOP); dust(c, lt, 20, '255,255,255', 0, 2560, 200, 1000);
          if (lt > tTh) { c.save(); c.globalAlpha = .7; JD.stamp(c, 1280, 600, 1, 'KICKED OUT', K.seg(lt, tTh, tTh + .5)); c.restore(); } }];
      S.D.over = [(c, lt) => dateTag(c, 'JUNE 2017', 240, 110, lt, tJu, 42), (c, lt) => ntag(c, 'RICKY', 900, 230, lt, tRi), (c, lt) => K.card(c, 'FLOOR IS LAVA', lt, { at: tFl, x: 960, y: 110, px: 52, rot: -2, bg: '#e8742a', color: '#fff' }),
        (c, lt) => { if (lt < tTh - .3) return; const u = E.out(K.seg(lt, tTh - .3, tTh + .3)); JD.list(c, 1560 + (1 - u) * 500, 40, .75, ITEMS, K.clamp((lt - tTh - .3) / 1.2), lt); }];
      S.D.sfx = [[tJu, 'pop', .25], [tRi, 'pop', .2], [tFl, 'fire_loop', .15], [tLe - .3, 'whoosh_soft', .25], [tLe + .2, 'thud', .3], [tSh, 'whoosh_soft', .25], [tSh + .5, 'thud', .3], [tSh + 1.2, 'whoosh_soft', .2], [tSf - .6, 'run_steps', .35], [tRu, 'alarm', .12], [tTh, 'stamp', .45], [tTh + .4, 'paper', .3], [out, 'footsteps', .25]]; } },

  // 1.01 teen bedroom: teen Jack at his desk; the view counter rockets to 15,000,000; the KICKED OUT stamp lands and turns gold like a trophy
  { plate: 'teen_room', cam: { z: [1.2, 1.35], x: [1650, 1700], y: [880, 880] }, bed: [['night_loop', .08], ['hum_loop', .06]], light: { dir: 1, key: 'rgba(140,160,255,.1)' },
    init: S => { const tPa = at(S, 'passes'), tVi = at(S, 'views.'), tLe = at(S, 'lesson'), tNi = at(S, 'nine'), tPu = at(S, 'punishment.'), tPr = at(S, 'product.');
      const FL = 1330, CX = 1600, SC = 1.5;
      S.D.figs = [{ x: CX, y: FL, s: SC, ...JD.JACK('teen'), pose: 'sit', facing: 1, mood: 'neutral', arms: () => ({ shR: 60, elR: -60, shL: 50, elL: -60 }), anim: (o, lt) => { o.lean = 8 + Math.sin(lt * 1.4) * 2; if (lt > tVi) { o.mood = 'happy'; o.pose = 'sit'; } if (lt > tLe) o.mood = 'smug'; if (lt > tPr) o.arms = () => ({ shR: 150, elR: -20 + 10 * Math.sin(lt * 6), shL: 50, elL: -60 }); } }];
      S.D.live = [(c, lt) => { TW.chair(c, CX, FL, FL - 63 * SC, 1, '#3a3a50'); },
        (c, lt) => { // laptop glow + monitor flicker
          TW.glow(c, 2120, 820, 300, '140,200,255', .3 + .08 * Math.sin(lt * 7)); for (let k = 0; k < 10; k++) { c.fillStyle = `hsla(${(k * 36 + lt * 120) % 360},80%,60%,.8)`; c.fillRect(2200 + k * 22, 935, 16, 5); } dust(c, lt, 24, '200,210,255', 200, 2200, 200, 1000); }];
      S.D.over = [(c, lt) => { if (lt < tPa - .2) return; JD.counter(c, 760, 230, 110, 15e6 * E.io(K.seg(lt, tPa - .2, tVi + .4)), ''); txt(c, 'VIEWS', 760, 320, 44, '#fff', 'center', 'Anton'); },
        (c, lt) => { if (lt < tPu - .5) return; const g = K.seg(lt, tPr - .1, tPr + .6); c.save(); c.filter = `sepia(${g}) saturate(${1 + 3 * g}) hue-rotate(${-g * 10}deg) brightness(${1 + .5 * g})`; JD.stamp(c, 560, 480, .9, 'KICKED OUT', K.seg(lt, tPu - .5, tPu)); c.restore(); if (g > .5) { TW.sparkle(c, 960, 520, lt * 2, 1.2, '255,230,120'); TW.sparkle(c, 560, 620, lt * 2 + 1, 1, '255,230,120'); } },
        (c, lt) => K.card(c, 'NOT THE PUNISHMENT...', lt, { at: tPu - .4, x: 520, y: 660, px: 36, rot: -2, until: tPr }), (c, lt) => K.card(c, '...THE PRODUCT', lt, { at: tPr, x: 520, y: 680, px: 52, rot: 2, bg: GOLD })];
      S.D.sfx = [[tPa - .2, 'riser', .3], [tPa, 'tick', .2], [tVi, 'crowd_cheer', .2], [tVi + .1, 'chime', .3], [tLe, 'typing', .2], [tNi, 'tick', .2], [tPu - .5, 'stamp', .45], [tPr, 'swell', .3], [tPr + .2, 'chime', .3]]; } },

  // 1.02 creator room (right wall, tighter): a wall of 15 thumbnails; seven light red; counter adds to ~90M
  { plate: 'creator_room', cam: { z: [1.3, 1.4], x: [760, 800], y: [690, 700] }, bed: [['hum_loop', .08]], light: { dir: -1, key: 'rgba(255,80,160,.1)' },
    init: S => { const tSe = at(S, 'Seven'), tBi = at(S, 'biggest'), tSu = at(S, 'supermarket'), tTi = at(S, 'title.'), tUp = at(S, 'uploads'), tNi = at(S, 'ninety');
      const FL = 1250, RED7 = [0, 2, 3, 6, 8, 11, 13];
      S.D.figs = [{ x: 1180, y: FL, s: 1.4, ...JD.JACK(), facing: -1, mood: 'smug', walk: { x0: 1700, x1: 1180, t0: .1, dur: 2 }, anim: (o, lt) => { if (o.pose === 'walk') return; o.pose = lt > tSu ? 'point' : 'present'; if (lt > tNi) { o.pose = 'cheer'; o.mood = 'happy'; } } }];
      S.D.live = [(c, lt) => { c.fillStyle = 'rgba(20,10,30,.6)'; rr(c, 120, 150, 940, 560, 16); c.fill(); c.strokeStyle = '#ff4ab0'; c.lineWidth = 4; c.stroke(); TW.glow(c, 590, 430, 600, '255,80,180', .12);
          for (let i = 0; i < 15; i++) { const cx = 150 + (i % 5) * 180, cy = 175 + Math.floor(i / 5) * 175, r = RED7.indexOf(i), on = r >= 0 && lt > tSe + r * .35; c.fillStyle = `hsl(${(i * 47) % 360},30%,${on ? 25 : 40}%)`; rr(c, cx, cy, 160, 150, 8); c.fill(); c.fillStyle = 'rgba(255,255,255,.4)'; c.beginPath(); c.moveTo(cx + 65, cy + 50); c.lineTo(cx + 100, cy + 70); c.lineTo(cx + 65, cy + 90); c.fill();
            if (on) { c.strokeStyle = '#e2342e'; c.lineWidth = 7; rr(c, cx, cy, 160, 150, 8); c.stroke(); c.fillStyle = '#e2342e'; c.fillRect(cx, cy + 112, 160, 38); txt(c, i % 2 ? 'KICKED OUT' : 'SUPERMARKET', cx + 80, cy + 132, 22, '#fff', 'center', 'Anton'); TW.glow(c, cx + 80, cy + 75, 120, '255,60,60', .2); } } dust(c, lt, 20, '255,180,255', 100, 2000, 100, 1000); }];
      S.D.over = [(c, lt) => K.card(c, '7 OF HIS TOP 15', lt, { at: tBi, x: 1500, y: 140, px: 48, rot: 2, bg: '#e2342e', color: '#fff' }),
        (c, lt) => { if (lt < tUp) return; JD.counter(c, 1500, 330, 110, 9e7 * E.io(K.seg(lt, tUp, tNi + .8)), 'm'); txt(c, 'VIEWS (APPROX.)', 1500, 420, 36, '#fff', 'center', 'Anton'); }];
      S.D.sfx = [[.1, 'footsteps', .2], [tSe, 'pop', .3], [tSe + .35, 'pop', .25], [tSe + .7, 'pop', .25], [tSe + 1.05, 'pop', .25], [tSe + 1.4, 'pop', .25], [tSe + 1.75, 'pop', .25], [tSe + 2.1, 'pop', .25], [tTi, 'tick', .2], [tUp, 'riser', .3], [tNi + .8, 'coins_cascade', .3]]; } },

  // 1.03 aisle again (end-cap, closer): STUNT (Jack dances), REMOVED (guard walks him out), POST (upload); the guard comes back and gets a CO-STAR star
  { plate: AISLE_PLATE, cam: { z: [1.45, 1.55], x: [1500, 1440], y: [880, 890] }, bed: [['crowd_loop', .05], ['hum_loop', .08]], light: { dir: -1, key: 'rgba(255,240,220,.08)' },
    init: S => { const tFo = at(S, 'formula'), tSt = at(S, 'stunt.'), tRe = at(S, 'removed.'), tPo = at(S, 'Post'), tGu = at(S, 'guard'), tVi = at(S, 'villain'), tCo = at(S, 'co-star.');
      const SC = 1.5, GS = 1.5;
      S.D.figs = [{ x: 1380, y: FLA, s: SC, ...JD.JACK(), facing: 1, mood: 'happy', anim: (o, lt) => { o.pose = lt < tSt - .3 ? 'stand' : (Math.floor(lt * 2.5) % 2 ? 'cheer' : 'wave'); o.facing = Math.floor(lt * 1.25) % 2 ? 1 : -1; if (lt > tRe - .6) { o.pose = 'shrug'; o.facing = 1; o.mood = 'smug'; } goWalk(o, lt, 1380, -300, tRe, 2.6, SC); } },
        { x: 2900, y: FLA, s: GS, ...JD.GUARD(0), facing: -1, mood: 'angry', anim: (o, lt) => { o.pose = 'stand'; goWalk(o, lt, 2900, 1700, tSt - .6, 1.4, GS); if (lt > tSt + .8 && lt < tRe) o.pose = 'point'; if (lt >= tRe) goWalk(o, lt, 1700, -150, tRe + .1, 3.0, GS); if (lt > tRe + 3.1) { o.x = -150; if (goWalk(o, lt, -150, 1300, tGu - 1.6, 1.8, GS)) {} else if (lt > tGu) { o.x = 1300; o.facing = 1; o.pose = lt > tCo ? 'cheer' : 'shrug'; o.mood = lt > tCo ? 'happy' : 'neutral'; } } } }];

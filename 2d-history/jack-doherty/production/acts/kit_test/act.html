<!doctype html><html><head><meta charset="utf-8"><title>JD kit test</title>
<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}@font-face{font-family:SourceSerif;src:url(../../../../shared/fonts/SourceSerif4.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/rig_v5.js"></script><script src="../../../../shared/rig_leo.js"></script><script>window.RIGSTYLE = "gumball";</script><script src="../../../../shared/kit.js"></script><script src="../../../../shared/anim.js"></script>
<script src="../../../../whatnot/production/tw_kit.js"></script><script src="../../../../whatnot/production/xu_kit.js"></script><script src="../../../../whatnot/production/jh_kit.js"></script><script src="../../../../whatnot/production/pr_kit.js"></script><script src="../../../../whatnot/production/wn_kit.js"></script>
<script src="../../jd_kit.js"></script>
<script src="timing.js"></script>
<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
const SW = 1920, SH = 1080, INK = TW.INK, RED = TW.RED, pop = TW.pop, fade = TW.fade;
const backdrop = (name, b = .5, blur = 8) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${b})`; const s2 = 1.06 * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 720 * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); c.restore(); K.screen(c); };
const CARRY = () => ({ shL: 30, elL: -75, shR: 35, elR: -75 });
const endTitle = (secs) => { const T = window.TIMING; const last = T.shots[T.shots.length - 1]; T.shots.push({ i: T.shots.length, start: last.end, end: last.end + secs, vo_start: last.end, vo_end: last.end, text: '' }); T.dur = last.end + secs; };
// JD kit test: shot 0 cast, shot 1 props
for (const n of ['chart', 'creator_room']) K.load(n, PL + n + '.jpg');
const lab = (c, s, x, y) => { c.save(); c.font = '22px Oswald'; c.fillStyle = 'rgba(0,0,0,.6)'; const w = c.measureText(s).width + 14; c.fillRect(x - w / 2, y - 14, w, 28); TW.txt(c, s, x, y, 22, '#fff', 'center', 'Oswald'); c.restore(); };
const C1 = [['JACK', JD.JACK()], ['JACK nosun', JD.JACK('nosun')], ['JACK teen', JD.JACK('teen')], ['JACK glove', JD.JACK('glove')], ['RICKY', JD.RICKY()], ['RICKY teen', JD.RICKY('teen')], ['GUARD0', JD.GUARD(0)], ['GUARD1', JD.GUARD(1)], ['STAFF', JD.STAFF()], ['STRANGER', JD.STRANGER()]];
const C2 = [['CEO', JD.CEO()], ['N3ON', JD.N3ON()], ['ARLOVSKI', JD.ARLOVSKI()], ['GOLFER', JD.GOLFER()], ['OFFICIAL', JD.OFFICIAL()], ['POLICE', JD.POLICE()], ['CAMERAMAN', JD.CAMERAMAN()], ['FAN', JD.FAN()], ['ACTOR', JD.ACTOR()], ['OPPONENT', JD.OPPONENT()]];
const row = (L, y, s) => L.map(([n, l], i) => ({ x: 160 + i * (2240 / (L.length - 1)), y, s, ...l, facing: 1, mood: 'neutral', _n: n }));
const F1 = row(C1, 640, 1.0), F2 = row(C2, 1300, 1.0);
const cast = { plate: 'creator_room', cam: { z: [1, 1], x: [1280, 1280], y: [720, 720] }, sub: 'off', figs: [...F1, ...F2], front: [(c) => { [...F1, ...F2].forEach(f => lab(c, f._n, f.x, f.y + 24)); }] };
const props = { plate: 'chart', cam: { z: [1, 1], x: [1280, 1280], y: [720, 720] }, sub: 'off', figs: [],
  front: [(c, lt) => { JD.stamp(c, 500, 300, 1, 'KICKED OUT', 1); JD.list(c, 900, 100, 1, ['SUPERMARKET', 'KICK', 'KICK (AGAIN)', 'PGA TOUR', 'SHUFFLE (PAID)'], 3.5, lt); JD.post(c, 1300, 120, 1, 'Noah', '@ceo', "Yes, it's real. 6-month term. Money well spent.", 241000);
    JD.mclaren(c, 600, 900, 1, lt, 0, 0); JD.mclaren(c, 1500, 900, 1, lt, .05, 1); JD.briefcase(c, 2200, 900, 1, 1); JD.counter(c, 2200, 400, 90, 15e6, 'm'); JD.bandage(c, 2300, 1200, 60); }] };
window.SHOTS = [cast, props];
const z = (base, x, y, zz = 2.4) => Object.assign({}, base, { cam: { z: [zz, zz], x: [x, x], y: [y, y] } });
SHOTS.push(z(cast, 700, 470), z(cast, 1900, 470), z(cast, 700, 1130), z(cast, 1900, 1130));
const _build = A.build; A.build = () => { const T2 = window.TIMING; K.setWords(T2.words); T2.shots.forEach((S, i) => { const D = window.SHOTS[i]; if (!D) return; D.live = D.live || []; D.front = D.front || []; D.over = D.over || []; S.D = D; S.vo_start = S.vo_start ?? S.start; if (D.init) D.init(S); }); _build(); };
A.build(); K.boot();
</script></body></html>

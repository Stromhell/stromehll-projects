const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';

const backdrop = (name, b = .5, blur = 8) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${b})`; const s2 = 1.06 * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 720 * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); c.restore(); K.screen(c); };
const CARRY = () => ({ shL: 30, elL: -75, shR: 35, elR: -75 });

// act-local copies: detailed galloping horse (from act 2's courier steed) and a side-on ship (from act 4), ship gains a furled-sail option for moored ships
const cavHorse = (c, x, y, s, t, col = '#5a3a24', cloth = '#7a1e1e') => {
  const dark = RS.shade(col, -.35), lite = RS.shade(col, .25), p = t * 11, bob = Math.abs(Math.sin(p)) * 8;
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = 'rgba(20,14,8,.34)'; c.beginPath(); c.ellipse(0, 0, 165, 17, 0, 0, 7); c.fill();
  const leg = (hx, hy, ph, near) => { const a = Math.sin(p + ph) * .7, k = Math.max(0, -Math.sin(p + ph)) * .9, fc = near ? col : dark;
    c.save(); c.translate(hx, hy - bob); c.rotate(a);
    c.fillStyle = fc; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.moveTo(-15, 0); c.lineTo(15, 0); c.lineTo(9, 64); c.lineTo(-9, 64); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.arc(0, 64, 10, 0, 7); c.fill(); c.stroke();
    c.translate(0, 64); c.rotate(near ? -k : k); c.beginPath(); c.moveTo(-8, 0); c.lineTo(8, 0); c.lineTo(6, 50); c.lineTo(-6, 50); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = RS.shade(fc, -.2); c.beginPath(); c.arc(0, 50, 8, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#1e1610'; c.beginPath(); c.moveTo(-9, 54); c.lineTo(9, 54); c.lineTo(12, 68); c.lineTo(-12, 68); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-6, 58); c.lineTo(6, 58); c.stroke(); c.restore(); };
  leg(-82, -118, Math.PI, false); leg(72, -118, 0, false);
  c.translate(0, -bob);
  // tail (behind the body), several strands swinging
  for (let k = 0; k < 5; k++) { const sw = Math.sin(t * 9 + k * .5) * 14; c.strokeStyle = k % 2 ? '#2a1a10' : '#3a2418'; c.lineWidth = 12 - k; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-120, -175); c.bezierCurveTo(-160, -175 + k * 4, -200 + sw, -140 + k * 6, -215 + sw * 1.5, -95 + k * 8); c.stroke(); }
  // body silhouette
  c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.moveTo(-122, -178); c.bezierCurveTo(-80, -212, 30, -208, 80, -198); c.bezierCurveTo(110, -190, 130, -160, 118, -128);
  c.quadraticCurveTo(60, -96, 0, -100); c.quadraticCurveTo(-80, -98, -118, -116); c.bezierCurveTo(-150, -132, -150, -165, -122, -178); c.closePath(); c.fill();
  c.save(); c.clip(); const g = c.createLinearGradient(0, -210, 0, -96); g.addColorStop(0, lite); g.addColorStop(.45, col); g.addColorStop(1, dark); c.fillStyle = g; c.fillRect(-160, -220, 300, 130);
  c.strokeStyle = 'rgba(0,0,0,.18)'; c.lineWidth = 4; c.beginPath(); c.arc(-80, -150, 40, -.6, 1.6); c.stroke(); c.beginPath(); c.arc(78, -148, 34, 1.4, 3.6); c.stroke(); c.restore(); c.stroke();
  // neck and head
  c.fillStyle = col; c.beginPath(); c.moveTo(62, -196); c.quadraticCurveTo(105, -262, 140, -290); c.lineTo(170, -270); c.quadraticCurveTo(150, -200, 122, -140); c.closePath(); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(134, -294); c.quadraticCurveTo(168, -314, 196, -284); c.lineTo(224, -248); c.quadraticCurveTo(230, -228, 206, -226); c.lineTo(168, -236); c.quadraticCurveTo(138, -252, 134, -294); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = dark; c.beginPath(); c.ellipse(214, -236, 6, 4, .4, 0, 7); c.fill();
  c.fillStyle = INK; c.beginPath(); c.arc(170, -280, 6, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(172, -282, 2, 0, 7); c.fill();
  c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.moveTo(146, -300); c.lineTo(152, -330); c.lineTo(162, -302); c.closePath(); c.fill(); c.stroke();
  // mane flowing back along the neck
  for (let k = 0; k < 7; k++) { const u2 = k / 6, mx = 145 - 78 * u2, my = -298 + 96 * u2, fl = Math.sin(t * 12 + k) * 6; c.fillStyle = k % 2 ? '#24160e' : '#33200f';
    c.beginPath(); c.moveTo(mx + 8, my - 4); c.quadraticCurveTo(mx - 18, my - 10 + fl, mx - 30, my + 6 + fl); c.quadraticCurveTo(mx - 10, my + 4, mx - 2, my + 12); c.closePath(); c.fill(); }
  // bridle: headstall, browband, noseband, bit ring
  c.strokeStyle = '#2a1408'; c.lineWidth = 5; c.beginPath(); c.moveTo(150, -300); c.lineTo(186, -244); c.stroke(); c.beginPath(); c.moveTo(144, -292); c.lineTo(166, -296); c.stroke();
  c.beginPath(); c.moveTo(196, -260); c.quadraticCurveTo(210, -262, 222, -252); c.stroke(); c.beginPath(); c.moveTo(186, -244); c.lineTo(206, -232); c.stroke();
  c.strokeStyle = '#d8b860'; c.lineWidth = 3; c.beginPath(); c.arc(206, -232, 6, 0, 7); c.stroke();

  c.fillStyle = cloth; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.roundRect(-62, -212, 104, 66, 10); c.fill(); c.stroke(); c.strokeStyle = RS.GOLD; c.lineWidth = 3; c.beginPath(); c.roundRect(-55, -205, 90, 52, 7); c.stroke();
  c.fillStyle = '#4a2a14'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.moveTo(-50, -206); c.quadraticCurveTo(-56, -232, -40, -230); c.quadraticCurveTo(-10, -212, 18, -214); c.quadraticCurveTo(34, -238, 40, -214); c.quadraticCurveTo(0, -198, -50, -206); c.closePath(); c.fill(); c.stroke();
  c.strokeStyle = '#2a1408'; c.lineWidth = 6; c.beginPath(); c.moveTo(0, -150); c.lineTo(6, -104); c.stroke(); c.lineWidth = 3; c.beginPath(); c.moveTo(-4, -205); c.lineTo(36, -146); c.stroke();
  c.strokeStyle = '#9a9a9a'; c.lineWidth = 4; c.beginPath(); c.moveTo(24, -146); c.lineTo(48, -146); c.lineTo(44, -136); c.lineTo(28, -136); c.closePath(); c.stroke();
  // saddlebag on the rump

  c.fillStyle = '#d8b860'; c.fillRect(-3, 8, 6, 10); c.restore();

const dockShip = (c, x, y, s, t, facing = 1, o = {}) => { c.save(); c.translate(x, y + Math.sin(t * 2) * 6 * s); c.rotate(Math.sin(t * 1.6) * .03); c.scale(s * facing, s);
  const hullC = o.hull || '#4a3020';
  // wake and bow wave
  c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(0, 4, 260, 12, 0, 0, 7); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 4; for (let k = 0; k < 3; k++) { const ph = (t * 1.4 + k / 3) % 1; c.globalAlpha = 1 - ph; c.beginPath(); c.moveTo(-200 - ph * 160, 6 + k * 3); c.quadraticCurveTo(-260 - ph * 160, 10, -320 - ph * 200, 4 + k * 4); c.stroke(); } c.globalAlpha = 1;
  c.beginPath(); c.moveTo(210, -4); c.quadraticCurveTo(250, -14, 270, 4); c.stroke();
  // rigging behind the sails: stays from mast tops to bow/stern, shrouds
  c.strokeStyle = 'rgba(30,22,16,.75)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-90, -380); c.lineTo(-215, -100); c.moveTo(60, -390); c.lineTo(330, -128); c.moveTo(-90, -380); c.lineTo(60, -330); for (const mx of [-90, 60]) for (let k = -3; k <= 3; k++) { if (!k) continue; c.moveTo(mx, -330); c.lineTo(mx + k * 14, -66); } c.stroke();
  // hull with stern castle
  const hg = c.createLinearGradient(0, -90, 0, 0); hg.addColorStop(0, RS.shade ? RS.shade(hullC, .18) : hullC); hg.addColorStop(1, RS.shade ? RS.shade(hullC, -.35) : hullC);
  c.fillStyle = hg; c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.moveTo(-235, -105); c.lineTo(-150, -100); c.lineTo(-150, -64); c.lineTo(240, -70); c.lineTo(190, 0); c.lineTo(-190, 0); c.quadraticCurveTo(-225, -40, -235, -105); c.closePath(); c.fill(); c.stroke();
  c.strokeStyle = 'rgba(20,12,8,.45)'; c.lineWidth = 2; for (const py of [-16, -28, -56]) { c.beginPath(); c.moveTo(-205, py); c.lineTo(220 - (py + 70) * .6, py - 2); c.stroke(); }
  c.fillStyle = '#c8a040'; c.fillRect(-200, -48, 400, 8); c.fillStyle = '#e0c060'; c.fillRect(-228, -98, 76, 5);
  // gunports
  for (let k = 0; k < 8; k++) { const gx = -150 + k * 44; c.fillStyle = '#1a120c'; c.fillRect(gx, -40, 20, 16); c.strokeStyle = '#c8a040'; c.lineWidth = 2; c.strokeRect(gx, -40, 20, 16); if (o.guns) { c.fillStyle = '#2a2a2a'; c.fillRect(gx + 4, -34, 14, 5); } }
  // stern windows + lantern
  c.fillStyle = 'rgba(255,214,140,.8)'; for (let k = 0; k < 3; k++) c.fillRect(-222 + k * 22, -90, 14, 12); c.fillStyle = '#c8a040'; c.beginPath(); c.arc(-238, -114, 8, 0, 7); c.fill();
  // bowsprit and jib
  c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.moveTo(225, -68); c.lineTo(335, -130); c.stroke();
  if (!o.furled) { c.fillStyle = '#ece2cc'; c.lineWidth = 3; c.beginPath(); c.moveTo(60, -330); c.lineTo(320, -126); c.quadraticCurveTo(200, -110 + Math.sin(t * 2) * 6, 70, -90); c.closePath(); c.fill(); c.stroke(); }
  // masts, yards, crow's nest
  c.strokeStyle = INK; c.lineWidth = 7; for (const mx of [-90, 60]) { c.beginPath(); c.moveTo(mx, -60); c.lineTo(mx, -390); c.stroke(); }
  // sails with shading and seams
  if (o.furled) { for (const mx of [-90, 60]) for (const [yy, w] of [[-362, 95], [-262, 80], [-170, 66]]) { c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.moveTo(mx - w - 8, yy); c.lineTo(mx + w + 8, yy); c.stroke(); const fg = c.createLinearGradient(0, yy - 4, 0, yy + 16); fg.addColorStop(0, '#f2eadb'); fg.addColorStop(1, '#bfb298'); c.fillStyle = fg; c.lineWidth = 3; c.beginPath(); c.moveTo(mx - w, yy); for (let k = 0; k <= 6; k++) c.quadraticCurveTo(mx - w + (k - .5) * w / 3, yy + 18, mx - w + k * w / 3, yy + 4); c.lineTo(mx + w, yy); c.closePath(); c.fill(); c.stroke(); c.strokeStyle = 'rgba(60,40,20,.6)'; c.lineWidth = 2; for (let k = 1; k < 6; k++) { c.beginPath(); c.moveTo(mx - w + k * w / 3, yy - 2); c.lineTo(mx - w + k * w / 3 + 4, yy + 12); c.stroke(); } } } else
  for (const [mx, h] of [[-90, 300], [60, 320]]) { const sg = c.createLinearGradient(mx - 90, 0, mx + 100, 0); sg.addColorStop(0, '#f6efe0'); sg.addColorStop(1, '#d8ccb2'); c.fillStyle = sg; c.strokeStyle = INK; c.lineWidth = 4; const bulge = 30 + Math.sin(t * 1.3 + mx) * 6;
    c.beginPath(); c.moveTo(mx - 90, -360); c.quadraticCurveTo(mx + bulge, -360 + h / 2, mx - 90, -380 + h); c.lineTo(mx + 80, -380 + h); c.quadraticCurveTo(mx + 90 + bulge, -360 + h / 2, mx + 80, -360); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(120,100,70,.35)'; c.lineWidth = 2; for (let k = 1; k < 4; k++) { const sx = mx - 90 + k * 42; c.beginPath(); c.moveTo(sx, -358); c.quadraticCurveTo(sx + bulge * .9, -360 + h / 2, sx, -382 + h); c.stroke(); }
    c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.moveTo(mx - 100, -362); c.lineTo(mx + 90, -362); c.stroke(); }
  c.fillStyle = '#4a3020'; c.strokeStyle = INK; c.lineWidth = 3; c.fillRect(-106, -330, 32, 14); c.strokeRect(-106, -330, 32, 14);
  c.fillStyle = o.flag || '#c8281e'; c.lineWidth = 3; c.beginPath(); c.moveTo(62, -420); for (let k = 0; k <= 6; k++) c.lineTo(62 + k * 10, -420 + Math.sin(t * 5 + k) * 3); c.lineTo(122, -390 + Math.sin(t * 5 + 6) * 3); for (let k = 6; k >= 0; k--) c.lineTo(62 + k * 10, -390 + Math.sin(t * 5 + k) * 3); c.closePath(); c.fill(); c.stroke();
  c.restore(); };

// ---- 3.02 Waterloo: a painted battlefield (world coords 2560x1440). Static ground/sky cached once; everything else animates.
const WL = (() => {
  const rnd = k => { const x = Math.sin(k * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const blob = (c, x, y, r, rgb, a) => { if (a <= .003 || r <= 1) return; const g = c.createRadialGradient(x - r * .25, y - r * .3, r * .05, x, y, r); g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(.55, `rgba(${rgb},${a * .75})`); g.addColorStop(1, `rgba(${rgb},0)`); c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); };
  const HZ = 750, gy = x => HZ + 12 + Math.sin(x * .004 + 3) * 12, psc = y => Math.max(.16, (y - HZ + 40) / 600);
  const ell = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, 7); };
  // ---------- props ----------
  const wheel = (c, x, y, r, rot = 0, broken = 0) => { c.save(); c.translate(x, y); c.rotate(rot); const n = 12;
    for (let k = 0; k < n; k++) { if (broken && rnd(k + broken) < .35) continue; const a = k / n * Math.PI * 2, L = broken && rnd(k + broken * 3) < .3 ? r * .55 : r * .9; c.strokeStyle = INK; c.lineWidth = r * .16; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * L, Math.sin(a) * L); c.stroke(); c.strokeStyle = '#8a6038'; c.lineWidth = r * .08; c.stroke(); }
    const arc0 = broken ? .9 : 0, arc1 = broken ? Math.PI * 2 - .5 : Math.PI * 2;
    c.lineCap = 'butt'; c.strokeStyle = INK; c.lineWidth = r * .26; c.beginPath(); c.arc(0, 0, r * .92, arc0, arc1); c.stroke(); c.strokeStyle = '#6e4a2a'; c.lineWidth = r * .15; c.stroke(); c.strokeStyle = '#3a3a40'; c.lineWidth = r * .06; c.beginPath(); c.arc(0, 0, r * 1.0, arc0, arc1); c.stroke();
    c.fillStyle = '#4a3020'; c.strokeStyle = INK; c.lineWidth = r * .06; c.beginPath(); c.arc(0, 0, r * .2, 0, 7); c.fill(); c.stroke(); c.fillStyle = '#2e2e34'; c.beginPath(); c.arc(0, 0, r * .09, 0, 7); c.fill(); c.restore(); };
  const cannon = (c, x, y, s, rec) => { const X = x - rec * 34 * s; c.save(); c.fillStyle = 'rgba(10,6,4,.4)'; ell(c, x - 60 * s, y + 4, 230 * s, 20 * s); c.fill(); c.translate(X, y); c.scale(s, s); c.lineJoin = 'round';
    // trail resting on the mud
    c.fillStyle = '#5e3e24'; c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.moveTo(30, -118); c.lineTo(40, -84); c.lineTo(-250, 4); c.lineTo(-270, -10); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(0,0,0,.3)'; c.lineWidth = 4; c.beginPath(); c.moveTo(20, -98); c.lineTo(-250, -6); c.stroke(); c.fillStyle = '#2e2e34'; for (const [px, py] of [[-60, -50], [-140, -26], [-220, -6]]) { c.beginPath(); c.arc(px, py, 6, 0, 7); c.fill(); }
    c.fillStyle = '#3a3a40'; c.fillRect(-268, -14, 22, 20); c.strokeRect(-268, -14, 22, 20);
    // far wheel peeks behind
    c.save(); c.globalAlpha = .9; wheel(c, 18, -84, 70, -rec * .4); c.restore();
    // bronze barrel on its trunnion
    c.save(); c.translate(0, -114); c.rotate(-.06); const g = c.createLinearGradient(0, -28, 0, 28); g.addColorStop(0, '#e2b45e'); g.addColorStop(.35, '#b88a3e'); g.addColorStop(1, '#6a4a22'); c.fillStyle = g; c.strokeStyle = INK; c.lineWidth = 6;
    c.beginPath(); c.moveTo(-82, -27); c.lineTo(168, -17); c.lineTo(168, 17); c.lineTo(-82, 27); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.arc(-94, 0, 14, 0, 7); c.fill(); c.stroke(); c.fillRect(160, -23, 22, 46); c.strokeRect(160, -23, 22, 46);
    c.fillStyle = '#8a6430'; for (const rx of [-50, 30, 120]) { const hh = 27 - (rx + 82) * .04; c.fillRect(rx, -hh - 2, 10, hh * 2 + 4); c.strokeRect(rx, -hh - 2, 10, hh * 2 + 4); }
    c.fillStyle = 'rgba(255,240,200,.35)'; c.fillRect(-70, -20, 220, 5); c.fillStyle = '#140e0a'; ell(c, 182, 0, 4, 12); c.fill(); c.restore();
    wheel(c, 0, -80, 80, -rec * .42); c.restore();
    return { mx: X + 182 * s, my: y - (114 + 11) * s }; };
  const soldier = (c, x, y, s, coat, trou, o = {}) => { c.save(); c.translate(x, y); c.scale(s, s); c.lineWidth = 3.2; c.strokeStyle = INK;
    if (o.gun !== false) { c.strokeStyle = '#4a3020'; c.lineWidth = 5; c.beginPath(); c.moveTo(9, -22); c.lineTo(13, -118); c.stroke(); c.strokeStyle = '#d8dce0'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(13, -118); c.lineTo(14, -142); c.stroke(); c.strokeStyle = INK; c.lineWidth = 3.2; }
    c.fillStyle = trou; c.fillRect(-10, -38, 8, 38); c.fillRect(2, -38, 8, 38); c.fillStyle = '#1a1410'; c.fillRect(-11, -4, 10, 5); c.fillRect(1, -4, 10, 5);
    c.fillStyle = coat; c.beginPath(); c.roundRect(-14, -74, 28, 40, 6); c.fill(); c.stroke(); c.strokeStyle = '#efe9dc'; c.lineWidth = 3; c.beginPath(); c.moveTo(-12, -72); c.lineTo(12, -38); c.moveTo(12, -72); c.lineTo(-12, -38); c.stroke();
    c.fillStyle = '#f4f1ea'; c.strokeStyle = INK; c.lineWidth = 3.2; c.beginPath(); c.arc(0, -86, 13, 0, 7); c.fill(); c.stroke();
    c.fillStyle = o.hat || '#1a1614'; c.beginPath(); c.roundRect(-11, -112, 22, 20, 2); c.fill(); c.stroke(); c.fillStyle = o.plume || '#efe9dc'; c.fillRect(-3, -122, 6, 10); c.restore(); };
  // a flag waving on its pole: paint(c, w, h) draws the cloth in a w*h box

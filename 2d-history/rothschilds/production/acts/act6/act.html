// multi-leg walk: segs [{x0,x1,t0,dur,face}] in order; between legs the figure stands (faceAfter turns it)
const walkPath = (o, lt, segs, s) => { let x = segs[0].x0, fac = segs[0].face ?? Math.sign(segs[0].x1 - segs[0].x0), moving = false, ph = 0;

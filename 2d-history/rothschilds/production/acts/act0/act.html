<!doctype html><html><head><meta charset="utf-8"><title>RS act 0 - cold open</title>
<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}@font-face{font-family:SourceSerif;src:url(../../../../shared/fonts/SourceSerif4.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/rig_v5.js"></script><script src="../../../../shared/rig_leo.js"></script><script>window.RIGSTYLE = "leo";</script><script src="../../../../shared/kit.js"></script><script src="../../../../shared/anim.js"></script>
<script src="../../rs_kit.js"></script>
<script src="timing.js"></script>
<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
for (const n of ['westminster', 'partners_room', 'mansion', 'map_europe']) K.load(n, PL + n + '.jpg');
const T = window.TIMING; const last = T.shots[T.shots.length - 1]; T.shots.push({ i: T.shots.length, start: last.end, end: last.end + 4.4, vo_start: last.end, vo_end: last.end, text: '' }); T.dur = last.end + 4.4;
const SW = 1920, SH = 1080, INK = RS.INK, pop = RS.pop;
// drifting fog strips (world space)
const fogDrift = (y0, y1, al = .16) => (c, lt) => { c.save(); c.filter = 'blur(26px)'; for (let k = 0; k < 9; k++) { const x = ((k * 397 + lt * (30 + k * 6)) % 3200) - 400, y = y0 + (k * 131) % (y1 - y0); c.fillStyle = `rgba(214,214,220,${al})`; c.beginPath(); c.ellipse(x, y, 420, 70, 0, 0, 7); c.fill(); } c.restore(); };
// a telegram pinched in the hand: hold() draws in the forearm frame (+y runs out past the fingers), so the sheet
// starts at the fingers and a thumb is drawn over its edge, so it reads as gripped, never floating beside the hand
const telegram = (c) => { c.save(); c.rotate(.12); c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(-15, 2, 34, 44); c.fillStyle = '#f2e8d2'; c.strokeStyle = INK; c.lineWidth = 2.6; c.beginPath(); c.rect(-18, -2, 34, 44); c.fill(); c.stroke();
  c.strokeStyle = 'rgba(60,40,24,.55)'; c.lineWidth = 1.6; for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(-12, 10 + k * 8); c.lineTo(10 - (k % 2) * 6, 10 + k * 8); c.stroke(); }
  c.fillStyle = '#f0c49c'; c.strokeStyle = INK; c.lineWidth = 2.2; c.beginPath(); c.ellipse(-12, 4, 6, 8, -.3, 0, 7); c.fill(); c.stroke(); c.restore(); };
// gentle idle: breathing sway so nobody freezes in a held pose
const idle = (o, lt, amp = 1.6) => { o.lean = (o.lean || 0) + Math.sin(lt * 1.25 + (o.seed || 0)) * amp; };
// Partners' room plate desk, redrawn over the figures so Disraeli stands BEHIND it (legs hidden), not on it
const DESK = [[860, 866], [1700, 866], [1738, 915], [1738, 935], [1718, 935], [1718, 1250], [842, 1250], [842, 935], [820, 935], [820, 915]];
const deskFront = (c) => { c.save(); c.beginPath(); DESK.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.clip(); c.drawImage(K.imgs.partners_room, 0, 0, 2560, 1440); c.restore();
  // desk-top clutter sitting on the top surface (bottoms on the desk, soft shadows): papers, inkwell, quill, lamp base
  c.save(); c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(1010, 900, 90, 10, 0, 0, 7); c.fill(); c.fillStyle = '#efe4c8'; c.strokeStyle = INK; c.lineWidth = 2.5;
  c.beginPath(); c.moveTo(930, 900); c.lineTo(1080, 900); c.lineTo(1066, 880); c.lineTo(944, 880); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#e4d6b4'; c.beginPath(); c.moveTo(950, 894); c.lineTo(1090, 896); c.lineTo(1078, 876); c.lineTo(962, 875); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(1530, 902, 34, 7, 0, 0, 7); c.fill(); c.fillStyle = '#1e1a22'; c.beginPath(); c.roundRect(1508, 870, 44, 32, 6); c.fill(); c.stroke(); c.fillStyle = '#c8a040'; c.fillRect(1518, 862, 24, 10); c.strokeRect(1518, 862, 24, 10);
  c.strokeStyle = '#f4f0e6'; c.lineWidth = 4; c.beginPath(); c.moveTo(1532, 864); c.quadraticCurveTo(1556, 820, 1590, 800); c.stroke(); c.restore(); };
// a few coin stacks and a banknote bundle resting ON the mansion desk top (y = DT), each with a contact shadow
const DT = 1420 - 256 * .95;
const quill = (c) => { c.save(); c.strokeStyle = '#f4f0e6'; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, 14); c.quadraticCurveTo(8, -20, 26, -44); c.stroke(); c.strokeStyle = INK; c.lineWidth = 2; c.beginPath(); c.moveTo(0, 14); c.lineTo(2, 22); c.stroke(); c.restore(); };
const moneyOnDesk = (c) => { const stack = (x, n) => { c.fillStyle = 'rgba(0,0,0,.32)'; c.beginPath(); c.ellipse(x + 4, DT + 2, 30, 7, 0, 0, 7); c.fill();
    for (let k = 0; k < n; k++) { const y = DT - 4 - k * 7; c.fillStyle = k % 2 ? '#e2b13c' : '#f0c24a'; c.strokeStyle = INK; c.lineWidth = 2; c.beginPath(); c.ellipse(x, y, 22, 6, 0, 0, 7); c.fill(); c.stroke(); }
    c.fillStyle = '#f8dc78'; c.beginPath(); c.ellipse(x, DT - 4 - (n - 1) * 7, 14, 3.4, 0, 0, 7); c.fill(); };
  c.save(); c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(1878, DT + 2, 56, 8, 0, 0, 7); c.fill(); c.fillStyle = '#b8c89a'; c.strokeStyle = INK; c.lineWidth = 2.5;
  for (let k = 0; k < 3; k++) { c.beginPath(); c.rect(1830 + k * 3, DT - 14 - k * 13, 96, 13); c.fill(); c.stroke(); } c.fillStyle = '#c8402e'; c.fillRect(1872, DT - 53, 12, 52); c.strokeRect(1872, DT - 53, 12, 52);
  stack(1786, 6); stack(1818, 9); stack(1800, 3); c.restore(); };

window.SHOTS = [
  // 1 fog over Westminster; a messenger runs across the square to the steps with a telegram
  { plate: 'westminster', cam: { z: [1.02, 1.1], x: [1280, 1300], y: [800, 790] }, bed: [['city_loop', .18], ['wind_loop', .2]],
    figs: [{ x: 1150, y: 1330, s: 1.9, ...RS.MESSENGER, facing: 1, pose: 'run', mood: 'worried', walk: { x0: 260, x1: 1150, t0: .4, dur: 4.2, pose: 'run' }, hold: { near: telegram }, anim: (o, lt, u, S) => { if (lt > 4.6) { o.pose = lt > S.tM + 1.2 && lt < S.tM + 3.6 ? 'shrug' : 'present'; idle(o, lt, 2); } } }],
    live: [fogDrift(820, 1100, .14)], front: [fogDrift(1200, 1420, .1)],
    init: S => { const tS = A.at(S, 'Suez', 3.4), tM = S.tM = A.at(S, 'four million', 8);
      S.D.over = [(c, lt) => K.dateTag(c, 'LONDON · 1875', lt, { at: .4 }), (c, lt) => K.card(c, 'SUEZ CANAL: SHORTCUT TO INDIA', lt, { at: tS, x: 1360, y: 230, px: 46, rot: 3 }),
        (c, lt) => lt > tM - .2 && K.counter(c, 0, 4000000, lt, { at: tM - .2, dur: 1.4, x: 960, y: 420, px: 120, pre: '£' }), (c, lt) => K.card(c, 'FAST', lt, { at: tM + 1.4, x: 1420, y: 520, px: 64, rot: -5 })];
      S.D.sfx = [[.1, 'chime', .4], [.5, 'run_steps', .35], [tS, 'paper', .3], [tM, 'coins', .35], [tM + 1.4, 'stamp', .4]]; } },
  // 2 Disraeli at his desk; he writes, puts the pen down; his secretary takes the note and hurries out
  { plate: 'partners_room', cam: { z: [1.06, 1.12], x: [1280, 1300], y: [820, 830] }, bed: [['hum_loop', .25], ['fire_loop', .15]],
    figs: [{ x: 1280, y: 1150, s: 1.75, ...RS.DISRAELI, facing: 1, pose: 'think', mood: 'focus', shadow: false, hold: { near: quill },
        anim: (o, lt, u, S) => { o.pose = lt < S.tP ? 'think' : 'point'; o.facing = lt < S.tP ? 1 : -1; if (lt > S.tP) o.hold = null; o.talk = lt > S.tP && lt < S.tO + 1; idle(o, lt, 1.4); } },
      { x: 520, y: 1415, s: 2.0, ...RS.SECRETARY, facing: 1, pose: 'present', mood: 'worried', walk: { x0: 520, x1: 520, t0: 0, dur: .1 }, hold: { near: telegram },
        anim: (o, lt, u, S) => { idle(o, lt, 1.6); if (lt > S.tO) { const w = R.walkX(lt, 520, -300, S.tO, 2.2, 2.0); o.x = w.x; o.facing = -1; o.pose = w.moving ? 'walk' : 'present'; o.t = w.phase; } } }],
    live: [(c, lt) => { const f = .8 + .2 * Math.sin(lt * 9) * Math.sin(lt * 5.3 + 1); c.globalCompositeOperation = 'screen'; const g = c.createRadialGradient(1280, 800, 0, 1280, 800, 420); g.addColorStop(0, `rgba(255,160,70,${.32 * f})`); g.addColorStop(1, 'rgba(255,140,60,0)'); c.fillStyle = g; c.fillRect(860, 380, 840, 840); }],
    front: [deskFront],
    init: S => { S.tP = A.at(S, 'sitting', 2.4); S.tO = A.at(S, 'secretary', 4.6);
      S.D.over = [(c, lt) => K.badge(c, 'DISRAELI · PRIME MINISTER', lt, { at: .4 }), (c, lt) => K.card(c, 'PARLIAMENT: NOT SITTING', lt, { at: S.tP - .4, x: 1500, y: 240, px: 46, rot: -3 }), (c, lt) => K.card(c, 'NO VOTE, NO MONEY', lt, { at: S.tP + .8, x: 1460, y: 330, px: 40, rot: 2 }),
        (c, lt) => K.card(c, 'GO TO ONE MAN', lt, { at: S.tO + .4, x: 520, y: 260, px: 50, rot: -4 })];
      S.D.sfx = [[S.tP, 'paper', .35], [S.tO, 'footsteps', .35], [S.tO + 2.2, 'door_slam', .4]]; } },
  // 3 STORY: Lionel peels a grape behind his desk; the secretary asks; the deal is struck with a nod
  { plate: 'mansion', cam: { z: [1.08, 1.16], x: [1280, 1280], y: [880, 890] }, bed: [['fire_loop', .22], ['hum_loop', .2]],
    figs: [{ x: 1640, y: 1300, s: 1.9, ...RS.LIONEL, hat: null, facing: -1, pose: 'present', mood: 'neutral', hold: { near: (c, t) => { c.fillStyle = '#9ac060'; c.strokeStyle = INK; c.lineWidth = 2.5; c.beginPath(); c.arc(4, -10, 9, 0, 7); c.fill(); c.stroke(); } },
        anim: (o, lt, u, S) => { o.mood = lt > S.t3 ? 'happy' : 'neutral'; o.pose = lt > S.t3 ? 'shrug' : 'present'; o.talk = (lt > S.t1 - .1 && lt < S.t1 + 1.4) || (lt > S.t3 - .1 && lt < S.t3 + 1.4); idle(o, lt, 1.4); } },
      { x: 860, y: 1330, s: 1.95, ...RS.SECRETARY, facing: 1, pose: 'present', mood: 'worried', anim: (o, lt, u, S) => { o.mood = lt > S.t3 ? 'happy' : lt > S.t2 ? 'neutral' : 'worried'; o.pose = lt > S.t2 && lt < S.t3 ? 'point' : 'present'; o.talk = lt > S.t2 - .1 && lt < S.t2 + 1.4; idle(o, lt, 1.6); } }],
    front: [(c, lt) => { RS.desk(c, 1640, 1420, .95); RS.ledger(c, 1560, 1132, .45); moneyOnDesk(c); c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(1722, DT + 3, 64, 8, 0, 0, 7); c.fill(); c.fillStyle = '#e8e0d0'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.ellipse(1720, DT - 6, 60, 12, 0, 0, 7); c.fill(); c.stroke(); for (let k = 0; k < 7; k++) { c.fillStyle = '#8ab050'; c.beginPath(); c.arc(1690 + k * 10, DT - 16 - (k % 2) * 8, 10, 0, 7); c.fill(); c.stroke(); } }],
    init: S => { S.t1 = A.at(S, 'security', 2.6); S.t2 = A.at(S, 'British government', 4.6); S.t3 = A.at(S, 'shall', 6.4);
      S.D.over = [(c, lt) => RS.tag(c, 'STORY', lt, .3), (c, lt) => K.card(c, '"WHAT IS YOUR SECURITY?"', lt, { at: S.t1 - .2, x: 1520, y: 300, px: 46, rot: 2, until: S.t2 + .2 }),
        (c, lt) => K.card(c, '"THE BRITISH GOVERNMENT."', lt, { at: S.t2, x: 640, y: 300, px: 46, rot: -2, until: S.t3 + .2 }), (c, lt) => K.card(c, '"THEN YOU SHALL HAVE IT."', lt, { at: S.t3, x: 1460, y: 300, px: 50, rot: 3 })];
      S.D.sfx = [[S.t1, 'paper', .25], [S.t2, 'pop', .25], [S.t3, 'chime', .4], [S.t3 + .5, 'coins', .35]]; } },
  // 4 map of Europe: five gold arrows draw out from Frankfurt; HOW?
  { plate: 'map_europe', cam: { z: [1.0, 1.12], x: [1280, 1180], y: [760, 720] }, bed: [['hum_loop', .3]],
    live: [(c, lt, u, S) => { const F = RS.EU(...RS.CITY.Frankfurt); RS.BROTHERS.forEach(([n, city], i) => { const P = RS.EU(...RS.CITY[city]), at = S.tA + i * .45; if (city === 'Frankfurt') { RS.dot(c, F[0], F[1], lt, at, '', { r: 26 }); return; } RS.arrow(c, F[0], F[1], P[0], P[1], E.out(K.seg(lt, at, at + .9)), { bend: { London: .22, Paris: -.08, Vienna: -.14, Naples: .14 }[city] }); if (lt > at + .9) RS.dot(c, P[0], P[1], lt, at + .9, city.toUpperCase(), { px: 40 }); });
      if (lt > S.tA) K.outlined(c, 'FRANKFURT', F[0], F[1] + 70, 40, { fill: '#fff4dc' }); }],
    init: S => { S.tA = A.at(S, 'One family', .4); const tH = A.at(S, 'How', 5);
      S.D.over = [(c, lt) => K.card(c, 'LENT A SUPERPOWER £4,000,000', lt, { at: S.tA + 1.8, x: 1500, y: 160, px: 42, rot: 2 }), (c, lt) => K.title(c, 'HOW?', lt, { at: tH, y: 140, px: 110 })];
      S.D.sfx = [0, 1, 2, 3, 4].map(i => [S.tA + i * .45, 'whoosh_soft', .3]).concat([[tH, 'hit', .5]]); } },
  // 5 TITLE over the five-arrow crest, stamped in like a wax seal
  { draw: (c, lt) => { c.save(); c.filter = 'blur(10px) brightness(.35)'; const s2 = 1.06 * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 720 * s2); c.drawImage(K.imgs.map_europe, 0, 0, 2560, 1440); c.restore(); K.screen(c);
      const a = E.back(K.seg(lt, .2, .8)); if (a > 0) RS.crest(c, 960, 560, .9 * (1.5 - .5 * a), { glow: .4 * a, spread: E.out(K.seg(lt, .5, 1.3)) }); },
    sub: 'off', inSfx: 'whoosh', bed: [['hum_loop', .2]],
    over: [(c, lt) => K.title(c, 'THE ROTHSCHILDS', lt, { at: 1.0, y: 150, px: 130 }), (c, lt) => K.title(c, 'RICHER THAN KINGS', lt, { at: 1.5, y: 960, px: 80, fill: '#ffe2a0' })], sfx: [[.3, 'stamp', .7], [1.0, 'hit', .8], [1.1, 'swell', .4]] },
];
const _build = A.build; A.build = () => { const T2 = window.TIMING; K.setWords(T2.words); T2.shots.forEach((S, i) => { const D = window.SHOTS[i]; if (!D) return; D.live = D.live || []; D.front = D.front || []; D.over = D.over || []; S.D = D; S.vo_start = S.vo_start ?? S.start; if (D.init) D.init(S); }); _build(); };
A.build(); K.boot();
</script></body></html>

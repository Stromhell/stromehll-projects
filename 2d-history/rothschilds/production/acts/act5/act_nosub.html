<!doctype html><html><head><meta charset="utf-8"><title>RS act 5 - wine, diamonds, oil</title>
<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}@font-face{font-family:SourceSerif;src:url(../../../../shared/fonts/SourceSerif4.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/rig_v5.js"></script><script src="../../../../shared/rig_leo.js"></script><script>window.RIGSTYLE = "leo";</script><script src="../../../../shared/kit.js"></script><script src="../../../../shared/anim.js"></script>
<script src="../../rs_kit.js"></script>
<script src="timing.js"></script>
<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
for (const n of ['vineyard', 'vineyard_dead', 'diamond_mine', 'oil_field', 'partners_room', 'palace_gate']) K.load(n, PL + n + '.jpg');
const SW = 1920, SH = 1080, INK = RS.INK, pop = RS.pop;
const backdrop = (name, b = .5, blur = 8) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${b})`; const s2 = 1.06 * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 720 * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); c.restore(); K.screen(c); };
const bottle = (c, x, y, s, label = 'MOUTON') => { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = 'rgba(30,20,10,.35)'; c.beginPath(); c.ellipse(10, 2, 70, 12, 0, 0, 7); c.fill(); c.fillStyle = '#2a1a22'; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.moveTo(-40, 0); c.lineTo(-40, -200); c.quadraticCurveTo(-40, -250, -14, -270); c.lineTo(-14, -340); c.lineTo(14, -340); c.lineTo(14, -270); c.quadraticCurveTo(40, -250, 40, -200); c.lineTo(40, 0); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#f2e8d2'; c.fillRect(-36, -160, 72, 90); c.strokeRect(-36, -160, 72, 90); c.fillStyle = INK; c.font = '15px SourceSerif'; c.textAlign = 'center'; c.fillText(label, 0, -126); RS.arrows(c, 0, -96, .07, { col: '#8a2a1e', ribbon: false }); c.fillStyle = '#8a2a2a'; c.fillRect(-16, -350, 32, 30); c.restore(); };
const diamond = (c, x, y, s, t) => { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = '#d8f0ff'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(-30, -14); c.lineTo(-16, -30); c.lineTo(16, -30); c.lineTo(30, -14); c.lineTo(0, 30); c.closePath(); c.fill(); c.stroke(); c.beginPath(); c.moveTo(-30, -14); c.lineTo(30, -14); c.moveTo(-10, -14); c.lineTo(0, 30); c.lineTo(10, -14); c.stroke(); const tw = Math.max(0, Math.sin(t * 3 + x)); if (tw > .8) { c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath(); c.moveTo(14, -40); c.lineTo(14, -60); c.moveTo(4, -50); c.lineTo(24, -50); c.stroke(); } c.restore(); };

// ---- vines: one plant on a stake, alive (leaves + grapes) or dead (bare drooping canes, curled leaves that fall) ----
const hsh = n => { const v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
const vine = (c, x, y, s, o) => { const id = o.id, dead = o.dead, lt = o.lt, wilt = dead ? K.seg(lt, 1 + hsh(id) * 3, 9 + hsh(id) * 3) : 0, sw = Math.sin(lt * 1.6 + id) * 2;
  c.save(); c.translate(x, y); c.scale(s, s); c.lineCap = 'round';
  c.fillStyle = 'rgba(30,20,10,.22)'; c.beginPath(); c.ellipse(0, 2, 34, 6, 0, 0, 7); c.fill();
  c.strokeStyle = '#7a6448'; c.lineWidth = 5; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -112); c.stroke();
  c.strokeStyle = INK; c.lineWidth = 11; c.beginPath(); c.moveTo(2, 0); c.bezierCurveTo(-8, -24, 12, -40, 3, -64); c.stroke(); c.strokeStyle = dead ? '#5a4632' : '#4a3424'; c.lineWidth = 7; c.stroke();
  const droop = dead ? 8 + wilt * 34 : 0;
  for (const sd of [-1, 1]) { const ex = sd * 46, ey = -70 + droop; c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.moveTo(3, -64); c.quadraticCurveTo(sd * 26, -80, ex, ey); c.stroke(); c.strokeStyle = dead ? '#6a5236' : '#5a3e26'; c.lineWidth = 3.5; c.stroke();
    if (!dead) { for (let k = 0; k < 3; k++) { const lx = sd * (14 + k * 14) + sw, ly = -82 + k * 3 - (k === 1 ? 8 : 0); c.fillStyle = k % 2 ? '#5a8a3a' : '#6e9e44'; c.strokeStyle = INK; c.lineWidth = 2.5; c.beginPath(); c.moveTo(lx, ly - 14); c.quadraticCurveTo(lx + 14, ly - 10, lx + 10, ly + 4); c.quadraticCurveTo(lx, ly + 12, lx - 10, ly + 4); c.quadraticCurveTo(lx - 14, ly - 10, lx, ly - 14); c.fill(); c.stroke(); }
      if (hsh(id + sd) > .3) { const gx = sd * 24, gy = -64; c.fillStyle = '#4a2a5a'; c.strokeStyle = INK; c.lineWidth = 1.5; for (const [dx, dy] of [[-6, 0], [0, 0], [6, 0], [-3, 6], [3, 6], [0, 12]]) { c.beginPath(); c.arc(gx + dx, gy + dy, 4, 0, 7); c.fill(); c.stroke(); } c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.arc(gx - 1, gy - 1, 1.5, 0, 7); c.fill(); } }
    else for (let k = 0; k < 2; k++) { const key = id * 3 + k + (sd > 0 ? 7 : 0), tf = 3 + hsh(key) * 7, f = K.seg(lt, tf, tf + 1.4); let lx = sd * (20 + k * 18), ly = -76 + droop * (.5 + k * .3);
      if (f > 0) { lx += Math.sin(f * 9 + key) * 10 * (1 - f) + sd * f * 14; ly = ly + (0 - ly) * E.inn(f); }
      c.save(); c.translate(lx, ly); c.rotate((f > 0 ? f * 4 : wilt * 1.2) * sd + sd * .4); c.fillStyle = k ? '#8a5a2a' : '#a0702e'; c.strokeStyle = INK; c.lineWidth = 2.5; c.beginPath(); c.moveTo(0, -9); c.quadraticCurveTo(10, -4, 6, 6); c.quadraticCurveTo(-2, 10, -8, 3); c.quadraticCurveTo(-6, -6, 0, -9); c.fill(); c.stroke(); c.restore(); } }
  c.restore(); };
// rows of vines in perspective, with a wire along the stake tops; filter picks which ones to draw (so near vines can go in front of a figure)
const vineRows = (c, lt, o) => { const { vx, vy, gy, gap, dead } = o; for (let k = 10; k >= 0; k--) { const p = .95 - k * .074; if (p < .2) continue; const y = vy + (gy - vy) * p, s = p * (o.sc || 1); if (o.only && !o.only(y)) continue;
    for (let i = -10; i <= 10; i++) { const x = vx + i * gap * p; if (x < -100 || x > 2660) continue; vine(c, x, y, s, { id: i * 31 + k * 7 + 500, dead, lt }); } }
  if (!o.only || o.only(0)) { c.strokeStyle = 'rgba(60,50,40,.55)'; c.lineWidth = 1.6; for (let i = -10; i <= 10; i++) { c.beginPath(); for (let k = 10; k >= 0; k--) { const p = .95 - k * .074; if (p < .2) continue; const y = vy + (gy - vy) * p; c.lineTo(vx + i * gap * p, y - 104 * p * (o.sc || 1)); } c.stroke(); } } };

// ---- Kimberley-style open pit: stepped terraces, claim walls, cableways with buckets, winding wheel, diggers, tents and spoil heaps ----
const minePit = (c, lt) => { const cx = 1288, cy0 = 1150, N = 7;
  // spoil heaps and tents on the horizon
  for (const [x, w, h] of [[300, 220, 70], [620, 160, 50], [1900, 260, 80], [2300, 180, 55]]) { c.fillStyle = '#9a7650'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(x - w, 676); c.quadraticCurveTo(x - w * .3, 676 - h * 1.3, x, 676 - h); c.quadraticCurveTo(x + w * .4, 676 - h * 1.1, x + w, 676); c.closePath(); c.fill(); c.stroke(); c.fillStyle = 'rgba(255,240,210,.18)'; c.beginPath(); c.ellipse(x - w * .2, 676 - h * .6, w * .3, h * .15, 0, 0, 7); c.fill(); }
  for (const [x, s] of [[880, 1], [960, .8], [1600, .9], [1700, 1.1], [2080, .8]]) { c.save(); c.translate(x, 700); c.scale(s, s); c.fillStyle = '#ece4d0'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(-40, 0); c.lineTo(0, -46); c.lineTo(40, 0); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#3a2a1e'; c.beginPath(); c.moveTo(-8, 0); c.lineTo(0, -20); c.lineTo(8, 0); c.closePath(); c.fill(); c.strokeStyle = '#5a4630'; c.beginPath(); c.moveTo(0, -46); c.lineTo(0, -58); c.stroke(); c.restore(); }
  // terraces: each level lower and smaller; the far wall shows as a darker band
  const lv = k => { const f = k / N; return { rx: 760 - 640 * f, ry: 250 - 212 * f, cy: cy0 - 60 * f + 26 * k * (1 - f * .3) }; };
  for (let k = 0; k <= N; k++) { const a = lv(k), b = lv(Math.max(0, k - 1)); const shade = 1 - k / N;
    if (k) { c.fillStyle = `rgb(${70 + 50 * shade},${48 + 38 * shade},${30 + 26 * shade})`; c.beginPath(); c.ellipse(cx, a.cy - 26, a.rx, a.ry, 0, 0, 7); c.fill(); }
    c.fillStyle = `rgb(${110 + 60 * shade},${80 + 46 * shade},${54 + 32 * shade})`; c.strokeStyle = 'rgba(40,24,12,.6)'; c.lineWidth = 2.5; c.beginPath(); c.ellipse(cx, a.cy, a.rx, a.ry, 0, 0, 7); c.fill(); c.stroke();
    if (k < N) { c.strokeStyle = 'rgba(40,24,12,.35)'; c.lineWidth = 2; for (let j = 0; j < 14; j++) { const t = Math.PI * (1.05 + j / 14 * .9); c.beginPath(); c.moveTo(cx + Math.cos(t) * a.rx * .92, a.cy + Math.sin(t) * a.ry * .92); c.lineTo(cx + Math.cos(t) * a.rx * .99, a.cy + Math.sin(t) * a.ry * .99 + 6); c.stroke(); } } }
  const bot = lv(N); c.fillStyle = '#1e140c'; c.beginPath(); c.ellipse(cx, bot.cy + 4, bot.rx * .7, bot.ry * .7, 0, 0, 7); c.fill();
  // diggers on the terraces (work pose)
  for (const [k, ang, f] of [[2, 3.6, -1], [3, 5.6, 1], [4, 4.2, -1], [5, 5.0, 1], [2, 5.9, 1], [6, 4.6, -1]]) { const a = lv(k); R.figure(c, { x: cx + Math.cos(ang) * a.rx * .8, y: a.cy + Math.sin(ang) * a.ry * .8 + 8, s: .42 - k * .025, ...RS.P({ costume: 'shirtsleeves', topCol: ['#8a6a4a', '#6a5a7a', '#9a5a3a'][k % 3], hair: 'short', seed: 150 + k }), facing: f, pose: 'work', t: lt + k, workSpeed: 5 + k }); }
  // cableways from the rim posts down into the pit, buckets running on them
  const ropes = [[510, 930, cx - 120, bot.cy], [1986, 912, cx + 110, bot.cy - 4], [510, 930, cx - 330, lv(4).cy - 50], [1986, 912, cx + 300, lv(3).cy - 40]];
  ropes.forEach(([x0, y0, x1, y1], r) => { c.strokeStyle = 'rgba(40,30,20,.85)'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo((x0 + x1) / 2, (y0 + y1) / 2 + 30, x1, y1); c.stroke();
    for (let b = 0; b < 2; b++) { const u = (lt * .07 + b * .5 + r * .21) % 1, ux = (1 - u) * (1 - u) * x0 + 2 * (1 - u) * u * (x0 + x1) / 2 + u * u * x1, uy = (1 - u) * (1 - u) * y0 + 2 * (1 - u) * u * ((y0 + y1) / 2 + 30) + u * u * y1;
      c.strokeStyle = INK; c.lineWidth = 2; c.beginPath(); c.moveTo(ux, uy); c.lineTo(ux, uy + 14); c.stroke(); c.fillStyle = '#6a4a2a'; c.beginPath(); c.moveTo(ux - 11, uy + 14); c.lineTo(ux + 11, uy + 14); c.lineTo(ux + 8, uy + 32); c.lineTo(ux - 8, uy + 32); c.closePath(); c.fill(); c.stroke(); } });
  // winding wheel (headgear) on the far rim, spinning
  c.save(); c.translate(1180, 850); c.strokeStyle = INK; c.lineWidth = 7; c.beginPath(); c.moveTo(-60, 60); c.lineTo(0, -90); c.lineTo(60, 60); c.moveTo(-36, 0); c.lineTo(36, 0); c.stroke(); c.strokeStyle = '#6a4a2a'; c.lineWidth = 4; c.stroke();
  c.translate(0, -90); c.rotate(lt * 2); c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.arc(0, 0, 30, 0, 7); c.stroke(); for (let k = 0; k < 6; k++) { c.rotate(Math.PI / 3); c.lineWidth = 3; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 30); c.stroke(); } c.restore();
  c.strokeStyle = 'rgba(40,30,20,.85)'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(1180, 790); c.lineTo(1250, lv(5).cy - 30); c.stroke(); const by = 840 + ((lt * 30) % 160); c.fillStyle = '#6a4a2a'; c.strokeStyle = INK; c.lineWidth = 2; c.beginPath(); c.roundRect(1180 + (by - 790) / (lv(5).cy - 820) * 70 - 9, by, 18, 16, 3); c.fill(); c.stroke();
  // ore cart on the rim
  c.save(); c.translate(1720, 930); c.fillStyle = 'rgba(30,20,10,.3)'; c.beginPath(); c.ellipse(0, 2, 50, 7, 0, 0, 7); c.fill(); c.fillStyle = '#5a4a3a'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(-40, -50); c.lineTo(40, -50); c.lineTo(32, -16); c.lineTo(-32, -16); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#9a7650'; c.beginPath(); c.ellipse(0, -52, 36, 10, 0, Math.PI, 0); c.fill(); for (const wx of [-22, 22]) { c.fillStyle = '#2a2420'; c.beginPath(); c.arc(wx, -10, 10, 0, 7); c.fill(); c.stroke(); } c.restore(); };

// a pair of clasped hands with sleeves and shirt cuffs (no backing box)
const handshake = (c, x, y, s, lt, at) => { const a = pop(lt, at, .45); if (a <= 0) return; const sh = Math.sin(lt * 12) * 6 * (lt < at + 1.2 ? 1 : 0); c.save(); c.translate(x, y + sh); c.scale(s * a, s * a); c.lineJoin = 'round'; const SK = '#eebf9a', SK2 = '#d9a47e';
  for (const [sd, col] of [[-1, '#2a3446'], [1, '#3a2a22']]) { c.save(); c.scale(sd, 1); c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.moveTo(270, -40); c.lineTo(104, -36); c.quadraticCurveTo(92, 0, 104, 38); c.lineTo(270, 44); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 3; for (const fx of [150, 200, 240]) { c.beginPath(); c.moveTo(fx, -38); c.quadraticCurveTo(fx - 12, 0, fx + 4, 40); c.stroke(); }
    c.fillStyle = '#f2f0ea'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.roundRect(76, -32, 32, 64, 6); c.fill(); c.stroke(); c.fillStyle = '#c89a40'; c.beginPath(); c.arc(92, 14, 4.5, 0, 7); c.fill(); c.restore(); }
  // back hand (from the right): palm edge and fingers tucked under
  c.fillStyle = SK2; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.moveTo(80, -28); c.quadraticCurveTo(10, -40, -46, -18); c.quadraticCurveTo(-64, 4, -44, 26); c.quadraticCurveTo(20, 40, 80, 28); c.closePath(); c.fill(); c.stroke();
  // front hand (from the left): palm, four fingers wrapped over, thumb across the top
  c.fillStyle = SK; c.beginPath(); c.moveTo(-80, -30); c.quadraticCurveTo(-20, -36, 18, -24); c.lineTo(18, 32); c.quadraticCurveTo(-30, 40, -80, 30); c.closePath(); c.fill(); c.stroke();
  for (let k = 0; k < 4; k++) { const fy = -22 + k * 14; c.fillStyle = SK; c.beginPath(); c.roundRect(4, fy, 42 - k * 3, 14, 7); c.fill(); c.stroke(); c.strokeStyle = 'rgba(120,70,40,.5)'; c.lineWidth = 2; c.beginPath(); c.moveTo(28 - k, fy + 3); c.lineTo(28 - k, fy + 11); c.stroke(); c.strokeStyle = INK; c.lineWidth = 5; }
  c.fillStyle = SK; c.beginPath(); c.moveTo(-50, -26); c.quadraticCurveTo(-10, -50, 30, -40); c.quadraticCurveTo(40, -34, 30, -28); c.quadraticCurveTo(-6, -26, -36, -14); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#f6dcc6'; c.beginPath(); c.ellipse(28, -36, 6, 4, -.2, 0, 7); c.fill();
  c.restore(); };

// ---- shot 5.06 helpers: a detailed zebra, the Rothschild carriage, the team's motion ----
// zebra side-on facing right, ground at (x, y); ph = gait phase (from distance travelled), amp = 0 standing .. 1 trotting
const zebra = (c, x, y, s, ph, amp, o = {}) => { const W = '#f4f1ea', WD = '#d4cfc6', B = '#1c1816', LEA = '#5a3420', BR = '#d8a840';
  const bob = Math.abs(Math.sin(ph)) * 7 * amp, nod = Math.sin(ph * 2) * 3 * amp + Math.sin((o.idle || 0) * 1.3) * 3;
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = 'rgba(30,20,10,.3)'; c.beginPath(); c.ellipse(8, 2, 165, 16, 0, 0, 7); c.fill();
  const seg = (len, w, near) => { c.lineCap = 'round'; c.strokeStyle = INK; c.lineWidth = w + 6; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, len); c.stroke(); c.strokeStyle = near ? W : WD; c.lineWidth = w; c.stroke();
    c.lineCap = 'butt'; c.strokeStyle = B; c.lineWidth = 4.5; for (let yy = 12; yy < len - 6; yy += 12) { c.beginPath(); c.moveTo(-w / 2, yy); c.lineTo(w / 2, yy + 3); c.stroke(); } };
  const leg = (hx, hy, p, near) => { const a = Math.sin(ph + p) * .45 * amp, k = Math.max(0, -Math.sin(ph + p)) * .95 * amp, front = hx > 0;
    c.save(); c.translate(hx, hy); c.rotate(a); seg(62, 18, near); c.translate(0, 62); c.rotate(front ? k : -k * .6); seg(54, 12, near);
    c.fillStyle = '#2a2018'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.roundRect(-10, 48, 21, 14, 3); c.fill(); c.stroke(); c.restore(); };
  leg(-78, -110 - bob, Math.PI, false); leg(72, -110 - bob, 0, false);
  c.save(); c.translate(0, -bob);
  // tail: white with a black tuft, swishing
  const sw = Math.sin(ph * .5 + (o.idle || 0)) * 10; c.lineCap = 'round'; c.strokeStyle = INK; c.lineWidth = 11; c.beginPath(); c.moveTo(-114, -172); c.quadraticCurveTo(-146, -150, -142 + sw, -104); c.stroke(); c.strokeStyle = W; c.lineWidth = 6; c.stroke();
  c.fillStyle = B; c.beginPath(); c.ellipse(-142 + sw, -94, 9, 18, sw * .02, 0, 7); c.fill();
  // body + stripes + rump chevrons + belly shade
  c.fillStyle = W; c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.ellipse(0, -150, 122, 54, 0, 0, 7); c.fill(); c.stroke();
  c.save(); c.beginPath(); c.ellipse(0, -150, 119, 51, 0, 0, 7); c.clip(); c.strokeStyle = B;
  for (let k = -3; k <= 5; k++) { c.lineWidth = k % 2 ? 10 : 13; c.beginPath(); c.moveTo(k * 21, -212); c.quadraticCurveTo(k * 21 + 12, -150, k * 21 - 6, -94); c.stroke(); }
  for (let k = 0; k < 4; k++) { c.lineWidth = 10; c.beginPath(); c.arc(-118, -150, 28 + k * 20, -.9, .9); c.stroke(); }
  c.fillStyle = 'rgba(90,80,70,.2)'; c.beginPath(); c.ellipse(0, -104, 122, 22, 0, 0, 7); c.fill(); c.restore();
  // neck with stripes
  const neck = () => { c.beginPath(); c.moveTo(88, -184); c.quadraticCurveTo(128, -250, 148, -284); c.lineTo(190, -254); c.quadraticCurveTo(160, -204, 130, -128); c.closePath(); };
  c.fillStyle = W; neck(); c.fill(); c.save(); neck(); c.clip(); c.strokeStyle = B; c.lineWidth = 9; for (let k = 0; k < 6; k++) { const px = 104 + k * 13, py = -150 - k * 24; c.beginPath(); c.moveTo(px - 30, py - 14); c.lineTo(px + 50, py + 26); c.stroke(); } c.restore(); c.strokeStyle = INK; c.lineWidth = 6; neck(); c.stroke();
  // upright banded mane
  c.lineCap = 'round'; c.strokeStyle = INK; c.lineWidth = 24; c.beginPath(); c.moveTo(94, -190); c.quadraticCurveTo(116, -250, 150, -300); c.stroke(); c.strokeStyle = W; c.lineWidth = 17; c.stroke();
  c.setLineDash([6, 7]); c.lineCap = 'butt'; c.strokeStyle = B; c.lineWidth = 17; c.stroke(); c.setLineDash([]);
  // head (nods), stripes, black muzzle, ears, eye, bridle with blinker
  c.save(); c.translate(0, nod);
  c.fillStyle = WD; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.moveTo(140, -298); c.lineTo(138, -330); c.lineTo(154, -302); c.closePath(); c.fill(); c.stroke();
  const head = () => { c.beginPath(); c.ellipse(178, -268, 47, 26, .55, 0, 7); };
  c.fillStyle = W; head(); c.fill(); c.save(); head(); c.clip(); c.strokeStyle = B; c.lineWidth = 6; for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(150 + k * 13, -300 + k * 4); c.lineTo(132 + k * 13, -250 + k * 4); c.stroke(); }

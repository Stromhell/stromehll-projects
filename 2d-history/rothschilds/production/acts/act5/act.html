<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}@font-face{font-family:SourceSerif;src:url(../../../../shared/fonts/SourceSerif4.ttf)}body{margin:0;background:#000}</style></head>

<script>

  // 5.01 rows of vines in late sun, a stone chateau; a cork pops: Mouton 1853, Lafite 1868

        (c, lt) => K.card(c, 'SOUTH AFRICAN DIAMOND FIELDS', lt, { at: tD, x: 560, y: 200, px: 42, rot: -3 }), (c, lt) => K.card(c, 'MERGED INTO DE BEERS · 1888', lt, { at: tB, x: 1380, y: 200, px: 42, rot: 3 }), (c, lt) => K.card(c, 'FINANCE FOR CECIL RHODES', lt, { at: tB + 1, x: 1380, y: 300, px: 38, rot: -2 })];

      S.D.sfx = [[S.tG, 'whoosh', .4], [S.tG + .3, 'creak', .3], [tR, 'footsteps', .3]]; } },

  { draw: (c, lt, u, S) => { backdrop('partners_room', .4, 8)(c); handshake(c, 960, 360, 1.0, lt, .3); const a = pop(lt, .8, .45); if (a > 0) { c.save(); c.translate(960, 720); c.scale(a, a); c.rotate(-.03); c.fillStyle = RS.PAPER; c.strokeStyle = INK; c.lineWidth = 6; c.fillRect(-300, -170, 600, 340); c.strokeRect(-300, -170, 600, 340); c.fillStyle = INK; c.font = '40px Anton'; c.textAlign = 'center'; c.fillText('SALE OF OIL INTERESTS', 0, -110); c.font = '30px Oswald'; c.fillText('PAID IN SHARES', 0, -60); c.fillStyle = 'rgba(40,30,20,.35)'; for (let k = 0; k < 4; k++) c.fillRect(-240, -20 + k * 30, 380 - k * 40, 8); c.restore(); }

    bed: [['hum_loop', .25]],
    init: S => { S.tS = A.at(S, 'Shell', 1.8);
      S.D.over = [(c, lt) => K.dateTag(c, '1911', lt, { at: .4 }), (c, lt) => K.card(c, 'SOLD TO ROYAL DUTCH SHELL', lt, { at: S.tS, x: 480, y: 160, px: 42, rot: -3 })];

    figs: [{ x: 2300, y: 1330, s: 1.9, ...RS.P({ costume: 'suit', topCol: '#9a2a2a', hair: 'short', seed: 120 }), hat: (c, X, Y, r) => { c.fillStyle = '#1a1a1a'; c.strokeStyle = INK; c.lineWidth = 2.5; c.beginPath(); c.roundRect(X - r * .6, Y - r * 2.4, r * 1.2, r * 1.8, r * .5); c.fill(); c.stroke(); }, facing: -1, pose: 'present', mood: 'shocked' }],

      c.save(); c.translate(x - 260, y); c.fillStyle = '#2a1a14'; c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.roundRect(-220, -300, 260, 160, 20); c.fill(); c.stroke(); for (const wx of [-170, 0]) { c.strokeStyle = INK; c.lineWidth = 8; c.beginPath(); c.arc(wx, -60, 60, 0, 7); c.stroke(); for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2 + tt * 5; c.lineWidth = 3; c.beginPath(); c.moveTo(wx, -60); c.lineTo(wx + Math.cos(a) * 56, -60 + Math.sin(a) * 56); c.stroke(); } } c.restore();

<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
for (const n of ['judengasse', 'judengasse_shield', 'judengasse_night', 'partners_room', 'palace_gate', 'exchange_amsterdam', 'map_europe', 'mansion', 'customs_night']) K.load(n, PL + n + '.jpg');
const SW = 1920, SH = 1080, INK = RS.INK, pop = RS.pop;
const backdrop = (name, b = .5, blur = 8) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${b})`; const s2 = 1.06 * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 720 * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); c.restore(); K.screen(c); };
const CARRY = () => ({ shL: 30, elL: -75, shR: 35, elR: -75 });
const D2R = Math.PI / 180, mix = (a, b, k) => a + (b - a) * k;
// a ledger held like a book in the front hand. b = 0 closed (spine in the hand, clutched to the chest), 1 open in both hands.
// The leaf swings open round the spine, so the change takes the 0.35 s blend instead of a snap. u = how much is written.
const drawBook = (c, a2, b, u = 1, skin = '#eebf9a') => { c.save(); c.rotate(a2 * D2R - .06); c.translate(4, 12 - b * 16); const W = 58, H = 76; c.strokeStyle = INK; c.lineWidth = 3; c.lineJoin = 'round';
  const page = (x0) => { c.fillStyle = RS.PAPER; c.fillRect(x0, -H / 2, W, H); c.strokeRect(x0, -H / 2, W, H); c.strokeStyle = 'rgba(60,40,24,.55)'; c.lineWidth = 1.6; for (let k = 0; k < 7; k++) { const w = (W - 16) * Math.max(0, Math.min(1, u * 8 - k)); if (w > 0) { c.beginPath(); c.moveTo(x0 + 8, -H / 2 + 12 + k * 9); c.lineTo(x0 + 8 + w, -H / 2 + 12 + k * 9); c.stroke(); } } c.strokeStyle = INK; c.lineWidth = 3; };
  const cover = (x0) => { c.fillStyle = '#5a2a1e'; c.fillRect(x0, -H / 2 - 3, W + 3, H + 6); c.strokeRect(x0, -H / 2 - 3, W + 3, H + 6); c.strokeStyle = RS.GOLD; c.lineWidth = 2; c.strokeRect(x0 + 8, -H / 2 + 6, W - 13, H - 12); c.strokeStyle = INK; c.lineWidth = 3; };
  c.fillStyle = '#5a2a1e'; c.fillRect(-W - 3, -H / 2 - 3, W + 3, H + 6); c.strokeRect(-W - 3, -H / 2 - 3, W + 3, H + 6); // back board
  if (b > .02) page(-W); else { c.fillStyle = '#efe4c8'; c.fillRect(-W, H / 2 - 2, W - 2, 5); }
  const k = -Math.cos(b * Math.PI); c.save(); c.scale(Math.abs(k) < .02 ? .02 * Math.sign(k || 1) : k, 1); if (k < 0) cover(0); else page(0); c.restore();
  c.fillStyle = '#3a1a12'; c.fillRect(-4, -H / 2 - 4, 8, H + 8); c.strokeRect(-4, -H / 2 - 4, 8, H + 8);
  if (b > .6) { c.globalAlpha = Math.min(1, (b - .6) / .3); c.fillStyle = skin; c.lineWidth = 2.4; c.beginPath(); c.ellipse(-W - 6, 8, 9, 13, 0, 0, 7); c.fill(); c.stroke(); for (let q = 0; q < 3; q++) { c.beginPath(); c.roundRect(-W - 4, -4 + q * 9, 16, 7, 3.5); c.fill(); c.stroke(); } c.globalAlpha = 1; } c.restore(); };
// pose + prop for a figure carrying a ledger: clutched closed under the chest while walking, then (open) eased into both hands
const CLUTCH = { shL: 18, elL: -122 }, OPEN = { shL: 30, elL: -92, shR: 42, elR: -88 };
const holdBook = (cfg = {}) => (o, lt, u, S) => { const ta = typeof cfg.ta === 'function' ? cfg.ta(S) : (cfg.ta ?? 1e9), b = E.io(K.seg(lt, ta, ta + .35));
  const A0 = { shL: mix(CLUTCH.shL, OPEN.shL, b), elL: mix(CLUTCH.elL, OPEN.elL, b) }; if (o.pose !== 'walk' && b > 0) { A0.shR = mix(4, OPEN.shR, b); A0.elR = mix(-10, OPEN.elR, b); }
  o.arms = () => A0; const a2 = A0.shL - A0.elL, w = cfg.write ? K.seg(lt, cfg.write(S)[0], cfg.write(S)[1]) : 1; const sk = (o.look && o.look.skin) || '#eebf9a'; o.hold = { far: (c) => drawBook(c, a2, b, w, sk) }; };
// never a still frame: every standing figure breathes, sways its weight and drifts its arms a little
const idle = (f) => { const a0 = f.anim; f.anim = (o, lt, u, S) => { if (a0) a0(o, lt, u, S); if (o.pose === 'walk' || o.pose === 'run' || o.pose === 'lie') return;
  const ph = (f.seed || 1) * 1.37 + f.x * .003, br = Math.sin(lt * 1.9 + ph), sw = Math.sin(lt * .8 + ph * .7), ar0 = o.arms;
  o.arms = (t, P) => { const Q = Object.assign({}, P, ar0 ? ar0(t, P) : {}); return Object.assign({}, ar0 ? ar0(t, P) : {}, { shL: Q.shL + br * 2, shR: Q.shR - br * 2 + sw * 2.5, elL: Q.elL + sw * 2, elR: Q.elR - br * 2.5, hipL: Q.hipL + sw * 1.2, hipR: Q.hipR + sw * 1.2, bob: (Q.bob || 0) + br * 3, lean: (Q.lean || 0) + sw * 2.2 }); }; }; };
const bale = (c) => { c.save(); c.fillStyle = '#c8b080'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.roundRect(-40, -70, 90, 60, 10); c.fill(); c.stroke(); c.beginPath(); c.moveTo(-40, -40); c.lineTo(50, -40); c.moveTo(5, -70); c.lineTo(5, -10); c.stroke(); c.restore(); };
const tray = (c) => { c.save(); c.fillStyle = '#3a2a5a'; c.strokeStyle = INK; c.lineWidth = 3; c.fillRect(-10, -26, 90, 24); c.strokeRect(-10, -26, 90, 24); for (let k = 0; k < 4; k++) RS.coin(c, 4 + k * 20, -18, 8, k * .5); c.restore(); };
// the street gates closing (world space; gate opening at plate 1210-1350 x, 858-1008 y)
const gateDoors = (u) => (c) => { const gx = 1280, hz = 1008; c.save(); c.fillStyle = '#2a1e16'; c.strokeStyle = INK; c.lineWidth = 3; for (const s of [-1, 1]) { const w = 70 * u; c.fillRect(s < 0 ? gx - 70 : gx + 70 - w, hz - 160, w, 160); c.strokeRect(s < 0 ? gx - 70 : gx + 70 - w, hz - 160, w, 160); } c.restore(); };

// ---- 1.10 helpers: a detailed coach and dark bay horses, adapted from act 5 (carriage, zebra -> horse) ----
// horse side-on facing right, ground at (x, y); ph = gait phase, amp = 0 standing .. 1 trotting
const horse = (c, x, y, s, ph, amp, o = {}) => { const W = o.col || '#5a3822', WD = RS.shade(o.col || '#5a3822', -.3), B = '#1c1410', LEA = '#5a3420', BR = '#d8a840';
  const bob = Math.abs(Math.sin(ph)) * 7 * amp, nod = Math.sin(ph * 2) * 3 * amp + Math.sin((o.idle || 0) * 1.3) * 3;
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = 'rgba(30,20,10,.3)'; c.beginPath(); c.ellipse(8, 2, 165, 16, 0, 0, 7); c.fill();
  const seg = (len, w, near) => { c.lineCap = 'round'; c.strokeStyle = INK; c.lineWidth = w + 6; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, len); c.stroke(); c.strokeStyle = near ? W : WD; c.lineWidth = w; c.stroke();
    c.lineCap = 'butt'; };
  const leg = (hx, hy, p, near) => { const a = Math.sin(ph + p) * .45 * amp, k = Math.max(0, -Math.sin(ph + p)) * .95 * amp, front = hx > 0;
    c.save(); c.translate(hx, hy); c.rotate(a); seg(62, 18, near); c.translate(0, 62); c.rotate(front ? k : -k * .6); seg(54, 12, near);
    c.fillStyle = '#2a2018'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.roundRect(-10, 48, 21, 14, 3); c.fill(); c.stroke(); c.restore(); };
  leg(-78, -110 - bob, Math.PI, false); leg(72, -110 - bob, 0, false);
  c.save(); c.translate(0, -bob);
  // tail: white with a black tuft, swishing
  const sw = Math.sin(ph * .5 + (o.idle || 0)) * 10; c.lineCap = 'round'; for (let k = 0; k < 4; k++) { c.strokeStyle = k ? (k % 2 ? '#2a1a10' : B) : INK; c.lineWidth = k ? 12 - k * 2 : 18; c.beginPath(); c.moveTo(-114, -172); c.quadraticCurveTo(-150 - k * 3, -150, -146 + sw + k * 3, -84 + k * 4); c.stroke(); }
  
  // body + stripes + rump chevrons + belly shade
  c.fillStyle = W; c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.ellipse(0, -150, 122, 54, 0, 0, 7); c.fill(); c.stroke();
  c.save(); c.beginPath(); c.ellipse(0, -150, 119, 51, 0, 0, 7); c.clip(); c.strokeStyle = B;
  c.fillStyle = 'rgba(255,220,180,.16)'; c.beginPath(); c.ellipse(-10, -182, 92, 18, 0, 0, 7); c.fill();
  c.fillStyle = 'rgba(90,80,70,.2)'; c.beginPath(); c.ellipse(0, -104, 122, 22, 0, 0, 7); c.fill(); c.restore();
  // neck with stripes
  const neck = () => { c.beginPath(); c.moveTo(88, -184); c.quadraticCurveTo(128, -250, 148, -284); c.lineTo(190, -254); c.quadraticCurveTo(160, -204, 130, -128); c.closePath(); };
  c.fillStyle = W; neck(); c.fill(); c.save(); neck(); c.clip();  c.restore(); c.strokeStyle = INK; c.lineWidth = 6; neck(); c.stroke();
  // upright banded mane
  c.lineCap = 'round'; c.strokeStyle = INK; c.lineWidth = 24; c.beginPath(); c.moveTo(94, -190); c.quadraticCurveTo(116, -250, 150, -300); c.stroke(); c.strokeStyle = W; c.lineWidth = 17; c.stroke();
  c.strokeStyle = B; c.lineWidth = 15; c.stroke(); for (let k = 0; k < 5; k++) { const mx = 98 + k * 12, my = -196 - k * 22, fl = Math.sin(ph + k) * 4 * amp; c.strokeStyle = B; c.lineWidth = 6; c.beginPath(); c.moveTo(mx, my); c.quadraticCurveTo(mx - 18, my + 8, mx - 22 + fl, my + 26); c.stroke(); }
  // head (nods), stripes, black muzzle, ears, eye, bridle with blinker
  c.save(); c.translate(0, nod);
  c.fillStyle = WD; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.moveTo(140, -298); c.lineTo(138, -330); c.lineTo(154, -302); c.closePath(); c.fill(); c.stroke();
  const head = () => { c.beginPath(); c.ellipse(178, -268, 47, 26, .55, 0, 7); };
  c.fillStyle = W; head(); c.fill(); c.save(); head(); c.clip(); c.fillStyle = '#f2ede4'; c.beginPath(); c.ellipse(176, -284, 6, 14, .55, 0, 7); c.fill();
  c.fillStyle = B; c.beginPath(); c.ellipse(210, -248, 20, 17, .55, 0, 7); c.fill(); c.restore(); c.strokeStyle = INK; c.lineWidth = 6; head(); c.stroke();
  c.fillStyle = W; c.lineWidth = 4; c.beginPath(); c.moveTo(150, -296); c.lineTo(158, -334); c.lineTo(168, -298); c.closePath(); c.fill(); c.stroke(); c.strokeStyle = B; c.lineWidth = 3; c.beginPath(); c.moveTo(157, -326); c.lineTo(158, -334); c.stroke();
  c.strokeStyle = LEA; c.lineWidth = 5; c.beginPath(); c.moveTo(156, -292); c.lineTo(198, -246); c.stroke(); c.beginPath(); c.ellipse(204, -252, 15, 17, .55, 0, 7); c.stroke();
  c.fillStyle = '#1a1214'; c.strokeStyle = INK; c.lineWidth = 2; c.beginPath(); c.roundRect(160, -292, 18, 15, 4); c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(181, -278, 5, 0, 7); c.fill(); c.fillStyle = INK; c.beginPath(); c.arc(182, -278, 3.5, 0, 7); c.fill();
  c.fillStyle = BR; c.beginPath(); c.arc(214, -240, 4, 0, 7); c.fill(); c.restore();
  // harness: collar with brass hames, back pad with terret, girth, breeching, trace
  c.save(); c.translate(124, -196); c.rotate(-.45); c.fillStyle = LEA; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.ellipse(0, 0, 15, 42, 0, 0, 7); c.fill(); c.stroke(); c.strokeStyle = BR; c.lineWidth = 4; c.beginPath(); c.moveTo(-4, -36); c.lineTo(-4, 36); c.stroke(); c.restore();
  c.fillStyle = LEA; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.roundRect(-6, -200, 14, 100, 3); c.fill(); c.stroke();
  c.fillStyle = '#2a1a14'; c.beginPath(); c.roundRect(-24, -216, 50, 22, 7); c.fill(); c.stroke(); c.strokeStyle = BR; c.lineWidth = 4; c.beginPath(); c.arc(2, -222, 6, 0, 7); c.stroke();
  c.strokeStyle = LEA; c.lineWidth = 7; c.beginPath(); c.moveTo(-60, -198); c.quadraticCurveTo(-128, -176, -110, -116); c.stroke();
  c.strokeStyle = INK; c.lineWidth = 8; c.beginPath(); c.moveTo(128, -170); c.lineTo(-40, -158); c.stroke(); c.strokeStyle = LEA; c.lineWidth = 5; c.stroke();
  c.restore();
  leg(-68, -110 - bob, 0, true); leg(82, -110 - bob, Math.PI, true);
  c.restore();
  const P = (lx, ly) => [x + lx * s, y + ly * s];
  return { bit: P(214, -240 - bob + nod), collar: P(124, -172 - bob), back: P(-40, -158 - bob), terret: P(2, -222 - bob) }; };

// spoked carriage wheel (rotates with distance)
const cwheel = (c, x, y, r, ang, far) => { c.save(); c.translate(x, y); c.strokeStyle = INK; c.lineWidth = 9; c.beginPath(); c.arc(0, 0, r, 0, 7); c.stroke(); c.strokeStyle = far ? '#3a2a1a' : '#8a2a22'; c.lineWidth = 5; c.beginPath(); c.arc(0, 0, r - 6, 0, 7); c.stroke();
  c.rotate(ang); for (let k = 0; k < 12; k++) { c.rotate(Math.PI / 6); c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.moveTo(0, 8); c.lineTo(0, r - 8); c.stroke(); c.strokeStyle = far ? '#4a3420' : '#a83a2a'; c.lineWidth = 3; c.stroke(); }
  c.fillStyle = far ? '#3a2a1a' : '#c89a40'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.arc(0, 0, r * .17, 0, 7); c.fill(); c.stroke(); c.fillStyle = INK; c.beginPath(); c.arc(0, 0, 4, 0, 7); c.fill(); c.restore(); };

// the carriage, facing right, local units; (cx, y) = front of the dash on the ground. Driver's box: cushion top at local y -259 centred x -95, footboard at local y -173
const carriage = (c, cx, y, cs, dist) => { const BOD = '#2c1a22', GILT = 'rgba(216,168,64,.85)';
  c.save(); c.translate(cx, y); c.scale(cs, cs);
  c.fillStyle = 'rgba(30,20,10,.3)'; for (const [wx, r] of [[-300, 80], [-40, 62]]) { c.beginPath(); c.ellipse(wx, 2, r * .9, 12, 0, 0, 7); c.fill(); }
  cwheel(c, -286, -86, 78, dist / 78, true); cwheel(c, -28, -68, 60, dist / 60, true);
  c.strokeStyle = INK; c.lineWidth = 11; c.beginPath(); c.moveTo(-300, -80); c.lineTo(-40, -62); c.stroke(); c.strokeStyle = '#3a2416'; c.lineWidth = 6; c.stroke();
  c.fillStyle = '#2a2624'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.ellipse(-300, -112, 46, 12, 0, 0, 7); c.fill(); c.stroke(); c.beginPath(); c.ellipse(-40, -92, 36, 10, 0, 0, 7); c.fill(); c.stroke();
  // box seat base under the driver + iron brackets to the footboard
  c.strokeStyle = INK; c.lineWidth = 7; c.beginPath(); c.moveTo(-60, -110); c.lineTo(-20, -173); c.moveTo(-40, -98); c.lineTo(30, -173); c.stroke();
  c.fillStyle = BOD; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.moveTo(-136, -248); c.lineTo(-62, -248); c.lineTo(-70, -128); c.lineTo(-136, -128); c.closePath(); c.fill(); c.stroke();
  c.strokeStyle = GILT; c.lineWidth = 2.5; c.strokeRect(-128, -236, 54, 96);
  // cabin
  const cab = () => { c.beginPath(); c.moveTo(-392, -334); c.lineTo(-392, -200); c.quadraticCurveTo(-392, -118, -306, -118); c.lineTo(-176, -118); c.quadraticCurveTo(-134, -118, -134, -168); c.lineTo(-134, -334); c.closePath(); };
  c.fillStyle = BOD; cab(); c.fill(); c.save(); cab(); c.clip(); c.fillStyle = 'rgba(255,230,200,.07)'; c.fillRect(-392, -334, 260, 70); c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(-392, -170, 260, 60); c.restore(); c.strokeStyle = INK; c.lineWidth = 6; cab(); c.stroke();
  c.strokeStyle = GILT; c.lineWidth = 3; c.beginPath(); c.roundRect(-352, -322, 160, 196, 14); c.stroke();
  c.fillStyle = '#e8b868'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.roundRect(-336, -308, 128, 84, 10); c.fill(); c.stroke();
  c.fillStyle = '#8a2a2a'; c.beginPath(); c.moveTo(-336, -306); c.quadraticCurveTo(-300, -268, -316, -226); c.lineTo(-336, -226); c.closePath(); c.fill(); c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.moveTo(-262, -304); c.lineTo(-244, -304); c.lineTo(-272, -228); c.lineTo(-290, -228); c.closePath(); c.fill();
  c.fillStyle = '#d8a840'; c.beginPath(); c.arc(-206, -200, 6, 0, 7); c.fill();
  c.fillStyle = 'rgba(216,168,64,.25)'; c.beginPath(); c.arc(-272, -170, 26, 0, 7); c.fill(); c.fillStyle = '#c8281e'; c.strokeStyle = '#d8a840'; c.lineWidth = 3; c.beginPath(); c.moveTo(-286, -186); c.lineTo(-258, -186); c.lineTo(-258, -168); c.quadraticCurveTo(-258, -152, -272, -146); c.quadraticCurveTo(-286, -152, -286, -168); c.closePath(); c.fill(); c.stroke(); c.strokeStyle = '#f2ede4'; c.lineWidth = 2; for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(-282, -180 + k * 8); c.lineTo(-262, -180 + k * 8); c.stroke(); }
  c.fillStyle = '#1a1214'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.roundRect(-404, -356, 284, 26, 8); c.fill(); c.stroke();
  c.strokeStyle = '#3a2a1a'; c.lineWidth = 4; for (let k = 0; k < 6; k++) { c.beginPath(); c.moveTo(-380 + k * 48, -356); c.lineTo(-380 + k * 48, -370); c.stroke(); } c.beginPath(); c.moveTo(-392, -370); c.lineTo(-140, -370); c.stroke();
  // brass coach lamp at the front corner
  c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.moveTo(-128, -300); c.lineTo(-112, -300); c.stroke(); c.fillStyle = '#c89a40'; c.lineWidth = 3; c.beginPath(); c.roundRect(-124, -344, 26, 40, 5); c.fill(); c.stroke(); c.fillStyle = '#fff2c0'; c.fillRect(-119, -336, 16, 22); c.fillStyle = '#c89a40'; c.beginPath(); c.moveTo(-128, -344); c.lineTo(-111, -358); c.lineTo(-94, -344); c.closePath(); c.fill(); c.stroke();
  // cushion and back rail of the driver's box
  c.fillStyle = '#5a1e1e'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.roundRect(-134, -300, 14, 48, 6); c.fill(); c.stroke();
  c.fillStyle = '#8a2a2a'; c.beginPath(); c.roundRect(-142, -262, 94, 18, 8); c.fill(); c.stroke(); c.strokeStyle = 'rgba(255,220,200,.3)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-134, -257); c.lineTo(-58, -257); c.stroke();
  // footboard and curved leather dash
  c.fillStyle = '#3a2416'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.roundRect(-46, -175, 116, 12, 4); c.fill(); c.stroke();
  c.fillStyle = '#1a1214'; c.beginPath(); c.moveTo(64, -170); c.quadraticCurveTo(92, -210, 84, -262); c.lineTo(96, -262); c.quadraticCurveTo(104, -206, 74, -164); c.closePath(); c.fill(); c.stroke();
  // pole and splinter bar to the team
  c.strokeStyle = INK; c.lineWidth = 9; c.beginPath(); c.moveTo(-30, -74); c.lineTo(150, -112); c.stroke(); c.strokeStyle = '#4a2e1a'; c.lineWidth = 5; c.stroke();
  c.fillStyle = '#3a2416'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.roundRect(14, -104, 14, 40, 3); c.fill(); c.stroke();
  // near wheels on top
  cwheel(c, -300, -80, 80, dist / 80, false); cwheel(c, -40, -62, 62, dist / 62, false);
  c.restore();
  return { bar: [cx + 22 * cs, y - 90 * cs] }; };

// ---- 1.06 exchange courtyard detail over the plain plate (plate px): stone courses, shuttered windows, a clock,
// company signboards and lanterns in the arcades, distant traders, a notice board, crates and sacks, pigeons
const exDetail = (c, lt) => { c.save(); c.lineJoin = 'round';
  // stone coursing on the upper wall and the cornice shadow
  c.strokeStyle = 'rgba(60,44,28,.22)'; c.lineWidth = 2; for (let r = 0; r < 10; r++) { const yy = 330 + r * 25; c.beginPath(); c.moveTo(0, yy); c.lineTo(2560, yy); c.stroke(); for (let x = (r % 2) * 60; x < 2560; x += 120) { c.beginPath(); c.moveTo(x, yy); c.lineTo(x, yy + 25); c.stroke(); } }
  let g = c.createLinearGradient(0, 316, 0, 350); g.addColorStop(0, 'rgba(40,28,16,.35)'); g.addColorStop(1, 'rgba(40,28,16,0)'); c.fillStyle = g; c.fillRect(0, 316, 2560, 34);
  g = c.createLinearGradient(0, 600, 0, 640); g.addColorStop(0, 'rgba(40,28,16,.3)'); g.addColorStop(1, 'rgba(40,28,16,0)'); c.fillStyle = g; c.fillRect(0, 600, 2560, 40);

<!doctype html><html><head><meta charset="utf-8"><title>RS act 2 - five arrows</title>
<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}@font-face{font-family:SourceSerif;src:url(../../../../shared/fonts/SourceSerif4.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/rig_v5.js"></script><script src="../../../../shared/rig_leo.js"></script><script>window.RIGSTYLE = "leo";</script><script src="../../../../shared/kit.js"></script><script src="../../../../shared/anim.js"></script>
<script src="../../rs_kit.js"></script>
<script src="timing.js"></script>
<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
for (const n of ['judengasse_shield', 'map_europe', 'partners_room', 'vineyard', 'judengasse_night']) K.load(n, PL + n + '.jpg');
const SW = 1920, SH = 1080, INK = RS.INK, pop = RS.pop;
// slow camera push for hand-drawn shots (no still frames): zoom about the frame centre
const push = (c, u, amt = .05) => { const z = 1 + amt * E.io(u); c.translate(SW / 2, SH / 2); c.scale(z, z); c.translate(-SW / 2, -SH / 2); return z; };
const backdrop = (name, b = .5, blur = 8, z = 1) => (c) => { c.save(); c.filter = `blur(${blur}px) brightness(${b})`; const s2 = 1.06 * z * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 720 * s2); c.drawImage(K.imgs[name], 0, 0, 2560, 1440); c.restore(); K.screen(c); };
const bag = (c) => { c.save(); c.fillStyle = '#5a3a22'; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.roundRect(-30, 0, 70, 50, 8); c.fill(); c.stroke(); c.beginPath(); c.arc(5, 0, 14, Math.PI, 0); c.stroke(); c.restore(); };
const NAMES = RS.BROTHERS.map(b => b[0]);
// 2.05 writing desk seen from above: the letter lies on it (with a drop shadow) instead of floating in front of the bookcase
const DESK = (c, lt) => { c.save(); c.fillStyle = '#4a2c18'; c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.moveTo(60, 250); c.lineTo(1860, 250); c.lineTo(2000, 1140); c.lineTo(-80, 1140); c.closePath(); c.fill();
  c.save(); c.clip(); const g = c.createLinearGradient(0, 250, 0, 1080); g.addColorStop(0, '#5e3a20'); g.addColorStop(1, '#3a2212'); c.fillStyle = g; c.fillRect(-80, 250, 2080, 900);
  c.strokeStyle = 'rgba(20,10,4,.28)'; c.lineWidth = 3; for (let k = 0; k < 16; k++) { const y = 280 + k * 52; c.beginPath(); c.moveTo(-80, y); c.bezierCurveTo(500, y + 10 * Math.sin(k), 1300, y - 12 * Math.cos(k), 2000, y + 4); c.stroke(); }
  c.fillStyle = 'rgba(255,220,160,.06)'; c.fillRect(-80, 250, 2080, 60); c.restore(); c.stroke();
  c.fillStyle = '#2a180c'; c.fillRect(60, 236, 1800, 16); c.strokeRect(60, 236, 1800, 16);
  // inkwell and a closed book on the desk, each with its own contact shadow
  c.fillStyle = 'rgba(10,5,2,.45)'; c.beginPath(); c.ellipse(1610, 650, 90, 22, 0, 0, 7); c.fill(); c.beginPath(); c.ellipse(300, 900, 170, 30, 0, 0, 7); c.fill();
  c.fillStyle = '#1e2030'; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.roundRect(1550, 560, 120, 90, 14); c.fill(); c.stroke(); c.fillStyle = '#0c0c14'; c.beginPath(); c.ellipse(1610, 562, 40, 12, 0, 0, 7); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(1566, 576, 12, 54);
  c.fillStyle = '#6a1e1a'; c.beginPath(); c.roundRect(150, 820, 300, 80, 8); c.fill(); c.stroke(); c.fillStyle = '#e8dcc0'; c.fillRect(160, 880, 280, 12); c.strokeRect(160, 880, 280, 12); c.fillStyle = RS.GOLD; c.fillRect(290, 830, 20, 50);
  c.restore(); };

const REINHAND = [70, -120]; // rider hand position relative to the figure origin, per unit scale (checked on snaps)
// detailed galloping horse for the courier (act-local so the shared RS.horse stays untouched): shaded body, arched neck,
// mane and tail that flow, jointed legs with hooves, saddle-cloth, saddle, stirrup, bridle, and a saddlebag with sealed letters.
// Returns world points for the saddle seat and the bit (reins are drawn after the rider so they reach his hands).
const steed = (c, x, y, s, t) => {
  const col = '#5a3a24', dark = RS.shade(col, -.35), lite = RS.shade(col, .25), p = t * 11, bob = Math.abs(Math.sin(p)) * 8;
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = 'rgba(20,14,8,.34)'; c.beginPath(); c.ellipse(0, 0, 165, 17, 0, 0, 7); c.fill();
  const leg = (hx, hy, ph, near) => { const a = Math.sin(p + ph) * .7, k = Math.max(0, -Math.sin(p + ph)) * .9, fc = near ? col : dark;
    c.save(); c.translate(hx, hy - bob); c.rotate(a);
    c.fillStyle = fc; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.moveTo(-15, 0); c.lineTo(15, 0); c.lineTo(9, 64); c.lineTo(-9, 64); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.arc(0, 2, 16, Math.PI, 0); c.fill(); c.stroke();
    c.translate(0, 64); c.rotate(near ? -k : k); c.beginPath(); c.moveTo(-8, 0); c.lineTo(8, 0); c.lineTo(6, 50); c.lineTo(-6, 50); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.arc(0, 0, 11, 0, 7); c.fill(); c.stroke(); c.beginPath(); c.moveTo(-9, -2); c.lineTo(9, -2); c.lineWidth = 8; c.strokeStyle = fc; c.stroke(); c.strokeStyle = INK; c.lineWidth = 5;
    c.fillStyle = RS.shade(fc, -.2); c.beginPath(); c.arc(0, 50, 8, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#1e1610'; c.beginPath(); c.moveTo(-9, 54); c.lineTo(9, 54); c.lineTo(12, 68); c.lineTo(-12, 68); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-6, 58); c.lineTo(6, 58); c.stroke(); c.restore(); };
  leg(-82, -118, Math.PI, false); leg(72, -118, 0, false);
  c.translate(0, -bob);
  // tail (behind the body), several strands swinging
  for (let k = 0; k < 5; k++) { const sw = Math.sin(t * 9 + k * .5) * 14; c.strokeStyle = k % 2 ? '#2a1a10' : '#3a2418'; c.lineWidth = 12 - k; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-120, -175); c.bezierCurveTo(-160, -175 + k * 4, -200 + sw, -140 + k * 6, -215 + sw * 1.5, -95 + k * 8); c.stroke(); }
  // body silhouette
  c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.moveTo(-122, -178); c.bezierCurveTo(-80, -212, 30, -208, 80, -198); c.bezierCurveTo(110, -190, 130, -160, 118, -128);
  c.quadraticCurveTo(60, -96, 0, -100); c.quadraticCurveTo(-80, -98, -118, -116); c.bezierCurveTo(-150, -132, -150, -165, -122, -178); c.closePath(); c.fill();
  c.save(); c.clip(); const g = c.createLinearGradient(0, -210, 0, -96); g.addColorStop(0, lite); g.addColorStop(.45, col); g.addColorStop(1, dark); c.fillStyle = g; c.fillRect(-160, -220, 300, 130);
  c.strokeStyle = 'rgba(0,0,0,.18)'; c.lineWidth = 4; c.beginPath(); c.arc(-80, -150, 40, -.6, 1.6); c.stroke(); c.beginPath(); c.arc(78, -148, 34, 1.4, 3.6); c.stroke(); c.restore(); c.stroke();
  // neck and head
  c.fillStyle = col; c.beginPath(); c.moveTo(62, -196); c.quadraticCurveTo(105, -262, 140, -290); c.lineTo(170, -270); c.quadraticCurveTo(150, -200, 122, -140); c.closePath(); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(134, -294); c.quadraticCurveTo(168, -314, 196, -284); c.lineTo(224, -248); c.quadraticCurveTo(230, -228, 206, -226); c.lineTo(168, -236); c.quadraticCurveTo(138, -252, 134, -294); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = dark; c.beginPath(); c.ellipse(214, -236, 6, 4, .4, 0, 7); c.fill();
  c.fillStyle = INK; c.beginPath(); c.arc(170, -280, 6, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(172, -282, 2, 0, 7); c.fill();
  c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.moveTo(146, -300); c.lineTo(152, -330); c.lineTo(162, -302); c.closePath(); c.fill(); c.stroke();
  // mane flowing back along the neck
  for (let k = 0; k < 7; k++) { const u2 = k / 6, mx = 145 - 78 * u2, my = -298 + 96 * u2, fl = Math.sin(t * 12 + k) * 6; c.fillStyle = k % 2 ? '#24160e' : '#33200f';
    c.beginPath(); c.moveTo(mx + 8, my - 4); c.quadraticCurveTo(mx - 18, my - 10 + fl, mx - 30, my + 6 + fl); c.quadraticCurveTo(mx - 10, my + 4, mx - 2, my + 12); c.closePath(); c.fill(); }
  // bridle: headstall, browband, noseband, bit ring
  c.strokeStyle = '#2a1408'; c.lineWidth = 5; c.beginPath(); c.moveTo(150, -300); c.lineTo(186, -244); c.stroke(); c.beginPath(); c.moveTo(144, -292); c.lineTo(166, -296); c.stroke();
  c.beginPath(); c.moveTo(196, -260); c.quadraticCurveTo(210, -262, 222, -252); c.stroke(); c.beginPath(); c.moveTo(186, -244); c.lineTo(206, -232); c.stroke();
  c.strokeStyle = '#d8b860'; c.lineWidth = 3; c.beginPath(); c.arc(206, -232, 6, 0, 7); c.stroke();
  // saddle-cloth, saddle, girth, stirrup
  c.fillStyle = '#7a1e1e'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.roundRect(-62, -212, 104, 66, 10); c.fill(); c.stroke(); c.strokeStyle = RS.GOLD; c.lineWidth = 3; c.beginPath(); c.roundRect(-55, -205, 90, 52, 7); c.stroke();
  c.fillStyle = '#4a2a14'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.moveTo(-50, -206); c.quadraticCurveTo(-56, -232, -40, -230); c.quadraticCurveTo(-10, -212, 18, -214); c.quadraticCurveTo(34, -238, 40, -214); c.quadraticCurveTo(0, -198, -50, -206); c.closePath(); c.fill(); c.stroke();
  c.strokeStyle = '#2a1408'; c.lineWidth = 6; c.beginPath(); c.moveTo(0, -150); c.lineTo(6, -104); c.stroke(); c.lineWidth = 3; c.beginPath(); c.moveTo(-4, -205); c.lineTo(36, -146); c.stroke();
  c.strokeStyle = '#9a9a9a'; c.lineWidth = 4; c.beginPath(); c.moveTo(24, -146); c.lineTo(48, -146); c.lineTo(44, -136); c.lineTo(28, -136); c.closePath(); c.stroke();
  // saddlebag on the rump with sealed letters tucked under the flap
  c.save(); c.translate(-95, -178); c.fillStyle = RS.PAPER; c.strokeStyle = INK; c.lineWidth = 3; c.save(); c.rotate(-.18); c.fillRect(-16, -26, 36, 30); c.strokeRect(-16, -26, 36, 30); c.restore();
  c.fillStyle = '#b02020'; c.beginPath(); c.arc(4, -14, 7, 0, 7); c.fill();
  c.fillStyle = '#5a3a22'; c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.roundRect(-30, -6, 62, 58, 8); c.fill(); c.stroke(); c.fillStyle = '#4a2c18'; c.beginPath(); c.roundRect(-32, -8, 66, 22, 6); c.fill(); c.stroke();
  c.fillStyle = '#d8b860'; c.fillRect(-3, 8, 6, 10); c.restore();
  c.restore();
  // near legs in front of the body
  c.save(); c.translate(x, y); c.scale(s, s); leg(-72, -118, Math.PI * .5, true); leg(82, -118, Math.PI * 1.5, true); c.restore();
  return { saddleX: x - 10 * s, saddleY: y - (200 + bob) * s, bitX: x + 206 * s, bitY: y - (232 + bob) * s };
};

// the will: a rolled-open sheet held at its top edge by the hand (hand at origin)
const willDoc = (c) => { c.save(); c.rotate(-.12); c.fillStyle = RS.PAPER; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.roundRect(-8, -14, 56, 76, 4); c.fill(); c.stroke(); c.fillStyle = '#e8d8b0'; c.beginPath(); c.roundRect(-12, -18, 64, 10, 5); c.fill(); c.stroke(); c.strokeStyle = 'rgba(60,40,20,.55)'; c.lineWidth = 2; for (let y = 4; y < 54; y += 9) { c.beginPath(); c.moveTo(0, y); c.lineTo(38, y); c.stroke(); } c.fillStyle = '#b02020'; c.beginPath(); c.arc(30, 52, 6, 0, 7); c.fill(); c.restore(); };
// the brother who goes farthest (rightmost) leads; one speed and a 0.62 s lag keep ~250 px between walkers, so no overlaps
const WALK1 = [0, 1, 2, 3, 4].map(i => ({ x0: 420, x1: 690 + i * 285, t0: .1 + (4 - i) * .62, dur: (270 + i * 285) / 400 }));

window.SHOTS = [
  // 2.01 the five sons walk in one by one and line up, each with a travelling bag
  // walk line y=1330 sits on the painted cobbles; the street spans plate x ~560-1990 there and the camera (zoom 1.95+, i.e. a
  // world width of ~1310 px) shows only that span, so the walk line is street from frame edge to frame edge; feet land at
  // screen y ~900, above the bottom subtitle band; contact shadows drawn under each pair of feet
  { plate: 'judengasse_shield', cam: { z: [1.95, 1.99], x: [1266, 1266], y: [1080, 1080] }, bed: [['city_loop', .15]],
    live: [(c, lt) => WALK1.forEach(w => { const x = R.walkX(lt, w.x0, w.x1, w.t0, w.dur, 1.2).x; c.save(); c.translate(x, 1332); c.scale(1, .2); const g = c.createRadialGradient(0, 0, 0, 0, 0, 74); g.addColorStop(0, 'rgba(15,10,8,.55)'); g.addColorStop(.6, 'rgba(15,10,8,.25)'); g.addColorStop(1, 'rgba(15,10,8,0)'); c.fillStyle = g; c.beginPath(); c.arc(0, 0, 74, 0, 7); c.fill(); c.restore(); })],
    figs: [0, 1, 2, 3, 4].map(i => ({ x: WALK1[i].x1, y: 1330, s: 1.2, ...RS.bro(i, false), facing: 1, walk: WALK1[i], hold: { near: bag },
      anim: (o, lt, u, S) => { if (lt > WALK1[i].t0 + WALK1[i].dur) { o.pose = ['present', 'wave', 'stand', 'present', 'wave'][i]; o.facing = i < 2 ? 1 : -1; o.mood = 'happy'; } } })),
    init: S => { const tC = A.at(S, 'clever', 1.6), tE = A.at(S, 'Europe', 3.4);
      S.D.over = [(c, lt) => K.card(c, '5 BROTHERS', lt, { at: .4, x: 960, y: 200, px: 62, rot: -2 }), (c, lt) => K.card(c, 'SENT ACROSS EUROPE', lt, { at: tE, x: 1460, y: 260, px: 44, rot: 3 })];
      S.D.sfx = [[.3, 'footsteps', .35], [tE, 'whoosh_soft', .3]]; } },
  // 2.02 the five-arrow map: each brother's name lands on his city
  { plate: 'map_europe', cam: { z: [1.0, 1.08], x: [1280, 1240], y: [760, 740] }, bed: [['hum_loop', .3]],
    live: [(c, lt, u, S) => { const F = RS.EU(...RS.CITY.Frankfurt); RS.BROTHERS.forEach(([n, city], i) => { const P = RS.EU(...RS.CITY[city]), at = S.tt[i]; if (lt < at) return;
      if (city !== 'Frankfurt') RS.arrow(c, F[0], F[1], P[0], P[1], E.out(K.seg(lt, at, at + .8)), { bend: { London: .22, Paris: -.08, Vienna: -.14, Naples: .14 }[city] });
      if (lt > at + (city === 'Frankfurt' ? 0 : .8)) RS.dot(c, P[0], P[1], lt, at + (city === 'Frankfurt' ? 0 : .8), n.toUpperCase(), { px: 44, dy: city === 'Paris' ? 60 : -54, dx: city === 'London' ? -60 : 0 }); }); }],
    init: S => { S.tt = NAMES.map((n, i) => A.at(S, n, .4 + i * 1.3));
      S.D.over = [(c, lt) => K.title(c, 'FIVE CAPITALS', lt, { at: S.tt[4] + 1, y: 130, px: 80 })];
      S.D.sfx = S.tt.map(t => [t, 'whoosh_soft', .35]).concat(S.tt.map(t => [t + .8, 'pop', .3])); } },
  // 2.03 the five-arrow crest appears big; then one arrow alone snaps while the bundle holds. CONCORDIA
  { draw: (c, lt, u, S) => { backdrop('map_europe', .35, 10, 1 + .03 * E.io(u))(c); push(c, u, .04); const tSep = S.tSep, tS = S.tS, tB = S.tB;
      // the crest: five arrows tied with a ribbon inside a gold medallion, centre stage, then it slides right
      const a = pop(lt, .3, .5), mv = E.io(K.seg(lt, tSep - .3, tSep + .5)), cx = 960 + 420 * mv, cy = 600 + 30 * mv, sc = 2.1 - .5 * mv;
      if (a > 0) { const shake = lt > tB ? Math.sin(lt * 30) * 5 * (1 - K.seg(lt, tB + .7, tB + 1.0)) : 0;
        const fl = Math.sin(lt * 1.6) * 8, rk = Math.sin(lt * 1.1) * .025; c.save(); c.translate(cx + shake, cy + fl); c.rotate(rk); c.scale(a, a);
        c.fillStyle = 'rgba(20,12,6,.45)'; c.beginPath(); c.ellipse(10, 250 * sc / 2.1 - fl, 200 * sc / 2.1, 26, 0, 0, 7); c.fill();
        c.fillStyle = '#3a2614'; c.strokeStyle = RS.GOLD; c.lineWidth = 14; c.beginPath(); c.arc(0, 0, 210 * sc / 2.1, 0, 7); c.fill(); c.stroke();
        c.strokeStyle = 'rgba(255,230,160,.35)'; c.lineWidth = 4; c.beginPath(); c.arc(0, 0, 186 * sc / 2.1, 0, 7); c.stroke();
        c.translate(0, 18 * sc); RS.arrows(c, 0, 0, sc * .5, { spread: .38 }); c.restore();
        if (lt > tB + .7) K.outlined(c, 'HOLDS', cx, cy - 290, 80, { fill: '#d8f0c0' }); }
      // the single arrow slides in on the left, bends, then cracks in two
      const s1 = E.out(K.seg(lt, tSep, tSep + .6)); if (s1 > 0) { const br = K.seg(lt, tS + .3, tS + .6), bend = K.seg(lt, tS - .2, tS + .3) * .12;
        c.save(); c.translate(560 - 300 * (1 - s1), 600); c.globalAlpha = s1;
        for (const side of [-1, 1]) { c.save(); c.rotate(side * (bend + br * .55)); c.strokeStyle = INK; c.lineWidth = 18; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, 0); c.lineTo(side * 230, 0); c.stroke(); c.strokeStyle = RS.GOLD; c.lineWidth = 11; c.stroke();
          if (side > 0) { c.fillStyle = RS.GOLD; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.moveTo(250, 0); c.lineTo(215, -22); c.lineTo(215, 22); c.closePath(); c.fill(); c.stroke(); }
          else { c.fillStyle = '#c8202a'; for (const d of [-1, 1]) { c.beginPath(); c.moveTo(-230, 0); c.lineTo(-200, d * 26); c.lineTo(-170, d * 26); c.lineTo(-195, 0); c.closePath(); c.fill(); } }
          c.restore(); }
        if (br > 0 && br < 1) { c.strokeStyle = '#fff4c0'; c.lineWidth = 6; for (let k = 0; k < 8; k++) { const an = k * Math.PI / 4, r0 = 20, r1 = 20 + 70 * br; c.beginPath(); c.moveTo(Math.cos(an) * r0, Math.sin(an) * r0); c.lineTo(Math.cos(an) * r1, Math.sin(an) * r1); c.stroke(); } }
        c.restore(); if (lt > tS + .6) K.outlined(c, 'SNAP', 560, 400, 80, { fill: '#ffd0c0' }); } },
    bed: [['hum_loop', .25]],
    init: S => { S.tSep = A.at(S, 'separate', 3.2); S.tS = A.at(S, 'snap', 4.6); S.tB = A.at(S, 'bundled', 5.6);
      S.D.over = [(c, lt) => K.card(c, 'THE FAMILY CREST: FIVE ARROWS', lt, { at: .5, x: 960, y: 130, px: 52, rot: -2 }), (c, lt) => K.card(c, 'CONCORDIA = UNITY', lt, { at: S.tB + .9, x: 960, y: 870, px: 44, rot: 2 })];
      S.D.sfx = [[.3, 'chime', .3], [S.tSep, 'whoosh_soft', .3], [S.tS + .3, 'hit', .45], [S.tB, 'creak', .35], [S.tB + .7, 'chime', .4]]; } },
  // 2.04 a courier gallops along a country road with letters sealed with the five-arrow wax seal
  { plate: 'vineyard', xfade: .4, cam: { z: [1.04, 1.1], x: [1280, 1300], y: [860, 860] }, bed: [['wind_loop', .2], ['gallop_loop', .3]],
    live: [(c, lt) => { const x = -300 + lt * 330, y = 1240; const sd = steed(c, x, y, 1.7, lt);
      const rx = sd.saddleX - 10, ry = sd.saddleY + 110; R.figure(c, { x: rx, y: ry, s: 1.5, ...RS.MESSENGER, facing: 1, pose: 'sit', mood: 'focus', t: lt, arms: () => ({ shR: 60, elR: -60, shL: 50, elL: -60 }) });
      // reins from the bit into the rider's hands
      const hx = rx + REINHAND[0] * 1.5, hy = ry + REINHAND[1] * 1.5; c.strokeStyle = '#2a1408'; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.moveTo(sd.bitX, sd.bitY); c.quadraticCurveTo((sd.bitX + hx) / 2, Math.max(sd.bitY, hy) + 40, hx, hy); c.stroke(); }],
    init: S => { const tL = A.at(S, 'letter', 2.4), tF = A.at(S, 'faster', 5.2);
      S.D.over = [(c, lt) => K.card(c, 'PRIVATE COURIERS', lt, { at: tL, x: 520, y: 220, px: 50, rot: -3 }), (c, lt) => K.card(c, 'FASTER AND SAFER THAN ALMOST ANYONE', lt, { at: tF, x: 1400, y: 220, px: 40, rot: 3 })];

<script>

const SW = 1920, SH = 1080, INK = '#1d1712', CREAM = '#f6efe2', GOLD = '#e8b44a', RED = '#c8402e', GREEN = '#76b900', TAU = Math.PI * 2;

// name tag (screen) with a leader to a point
const tag = (c, lt, at, x, y, tx, ty, name, sub) => { const p = pop(lt, at); if (p <= 0) return; c.save(); c.globalAlpha = Math.min(1, p); c.strokeStyle = CREAM; c.lineWidth = 3; c.setLineDash([8, 6]); c.beginPath(); c.moveTo(tx, ty); c.lineTo(x, y + 30); c.stroke(); c.setLineDash([]); c.translate(x, y); c.scale(p, p); c.font = font(40); const w = Math.max(c.measureText(name).width, 120) + 40; c.fillStyle = 'rgba(10,8,6,.35)'; c.fillRect(-w / 2 + 6, -30, w, 92); c.fillStyle = CREAM; c.fillRect(-w / 2, -36, w, 92); c.strokeStyle = INK; c.lineWidth = 4; c.strokeRect(-w / 2, -36, w, 92); c.fillStyle = GREEN; c.fillRect(-w / 2, -36, w, 10); c.fillStyle = INK; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(name, 0, 0); c.font = font(22, 'Oswald'); c.fillStyle = '#6a5a48'; c.fillText(sub, 0, 36); c.restore(); };
// CRT screen helpers: draw inside the plate's screen rect (world coords) with scanlines + glare
const SCR = [790, 245, 980, 715];
const screen = (fn) => (c, lt, u, S) => { const [x, y, w, h] = SCR; c.save(); c.beginPath(); c.roundRect(x, y, w, h, 40); c.clip(); c.translate(x, y); fn(c, lt, w, h, S); c.restore();
  c.save(); c.beginPath(); c.roundRect(x, y, w, h, 40); c.clip(); c.fillStyle = 'rgba(0,0,0,.18)'; for (let yy = y; yy < y + h; yy += 5) c.fillRect(x, yy, w, 2); const g = c.createRadialGradient(x + w * .3, y + h * .2, 0, x + w * .3, y + h * .2, w * .7); g.addColorStop(0, 'rgba(255,255,255,.13)'); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(x, y, w, h); const v = c.createRadialGradient(x + w / 2, y + h / 2, h * .35, x + w / 2, y + h / 2, w * .7); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); c.fillStyle = v; c.fillRect(x, y, w, h); c.restore();
  c.save(); c.globalCompositeOperation = 'screen'; const gl = c.createRadialGradient(x + w / 2, y + h / 2, 0, x + w / 2, y + h / 2, w); gl.addColorStop(0, 'rgba(120,200,170,.12)'); gl.addColorStop(1, 'rgba(120,200,170,0)'); c.fillStyle = gl; c.fillRect(x - 300, y - 300, w + 600, h + 600); c.restore(); };
// little pixel sprite (screen-local)
const PIX = ['..XXXX..', '.XXXXXX.', '.XOXXOX.', '.XXXXXX.', '..XXXX..', '.XXXXXX.', 'X.XXXX.X', '..X..X..'];
const pixHero = (c, x, y, s, ph) => { c.save(); c.translate(x, y); PIX.forEach((row, j) => [...row].forEach((ch, i) => { if (ch === '.') return; let yy = j; if (j === 7 && ph) { if ((i === 2 && ph === 1) || (i === 5 && ph === 2)) yy -= 1; } c.fillStyle = ch === 'O' ? '#101814' : '#f2c84a'; c.fillRect(i * s, yy * s, s, s); })); c.restore(); };
// a low-poly shaded shape that turns (screen-local), drawn with triangles
const polyShape = (c, cx, cy, rad, ang, tri = true, col = [120, 220, 160]) => { const pts = []; const N = 8, M = 5; for (let j = 0; j <= M; j++) { const la = -Math.PI / 2 + j / M * Math.PI; for (let i = 0; i < N; i++) { const lo = i / N * TAU + ang; pts.push([Math.cos(la) * Math.cos(lo), Math.sin(la), Math.cos(la) * Math.sin(lo)]); } }
  const P = (q) => [cx + q[0] * rad, cy + q[1] * rad]; const faces = []; for (let j = 0; j < M; j++) for (let i = 0; i < N; i++) { const a = pts[j * N + i], b = pts[j * N + (i + 1) % N], d = pts[(j + 1) * N + i], e = pts[(j + 1) * N + (i + 1) % N]; faces.push([a, b, e], [a, e, d]); }
  faces.map(f => ({ f, z: (f[0][2] + f[1][2] + f[2][2]) / 3 })).filter(o => o.z > -.05).sort((p, q) => p.z - q.z).forEach(({ f, z }) => { const n = .45 + .55 * Math.max(0, z * .7 + (f[0][1] + f[1][1] + f[2][1]) / 3 * -.3); c.fillStyle = `rgb(${col.map(v => Math.round(v * n)).join(',')})`; c.beginPath(); f.map(P).forEach(([x, y], k) => k ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.fill(); if (tri) { c.strokeStyle = 'rgba(10,30,20,.8)'; c.lineWidth = 2; c.stroke(); } }); };
// a smooth shape built from curved quad patches (screen-local); 'built' = how many patches are filled so far
const patchShape = (c, cx, cy, rad, ang, built) => { const N = 6, M = 4; const P = (la, lo) => { const x = Math.cos(la) * Math.cos(lo + ang), y = Math.sin(la), z = Math.cos(la) * Math.sin(lo + ang); return [cx + x * rad, cy + y * rad * .92, z]; };
  const g = c.createRadialGradient(cx - rad * .35, cy - rad * .4, rad * .1, cx, cy, rad); g.addColorStop(0, '#d8f0a0'); g.addColorStop(.6, '#76b900'); g.addColorStop(1, '#2a4a00'); let n = 0;
  for (let j = 0; j < M; j++) for (let i = 0; i < N; i++) { const la0 = -Math.PI / 2 + j / M * Math.PI, la1 = la0 + Math.PI / M, lo0 = i / N * TAU, lo1 = lo0 + TAU / N; const mid = P((la0 + la1) / 2, (lo0 + lo1) / 2); if (mid[2] < -.05) continue; n++; const on = K.clamp(built - n + 1);
    if (on <= 0) continue; c.beginPath(); const steps = 8; for (let k = 0; k <= steps; k++) { const p = P(la0, lo0 + (lo1 - lo0) * k / steps); k ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); } for (let k = 0; k <= steps; k++) { const p = P(la0 + (la1 - la0) * k / steps, lo1); c.lineTo(p[0], p[1]); } for (let k = steps; k >= 0; k--) { const p = P(la1, lo0 + (lo1 - lo0) * k / steps); c.lineTo(p[0], p[1]); } for (let k = steps; k >= 0; k--) { const p = P(la0 + (la1 - la0) * k / steps, lo0); c.lineTo(p[0], p[1]); } c.closePath();
    c.save(); c.globalAlpha = on; c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(230,255,200,.55)'; c.lineWidth = 2.5; c.stroke(); c.restore(); } };
// the NV1 board (world coords, centre x,y, width w; turn = rotation about the vertical axis)
const nv1 = (c, x, y, w, turn, dust = 0) => { const k = Math.cos(turn), h = w * .42; c.save(); c.translate(x, y);
  c.fillStyle = 'rgba(20,12,4,.35)'; c.beginPath(); c.ellipse(0, h * .55, w * .55 * Math.max(.25, Math.abs(k)), h * .12, 0, 0, 7); c.fill();
  c.transform(k, Math.sin(turn) * .12, 0, 1, 0, 0); const side = k < 0;
  c.fillStyle = side ? '#1e4a24' : '#2a7a34'; c.strokeStyle = INK; c.lineWidth = 5; c.beginPath(); c.moveTo(-w / 2, -h / 2); c.lineTo(w / 2, -h / 2); c.lineTo(w / 2, h / 2); c.lineTo(-w * .1, h / 2); c.lineTo(-w * .1, h / 2 + 22); c.lineTo(-w * .42, h / 2 + 22); c.lineTo(-w * .42, h / 2); c.lineTo(-w / 2, h / 2); c.closePath(); c.fill(); c.stroke();
  for (let i = 0; i < 14; i++) { c.fillStyle = '#e8c040'; c.fillRect(-w * .41 + i * w * .022, h / 2 + 4, w * .013, 16); }
  if (!side) { c.strokeStyle = 'rgba(232,192,64,.55)'; c.lineWidth = 2; for (let i = 0; i < 18; i++) { const yy = -h / 2 + 20 + i * h / 20; c.beginPath(); c.moveTo(-w * .46, yy); c.lineTo(-w * .2 + (i % 4) * 30, yy); c.lineTo(-w * .15 + (i % 4) * 30, yy + 14); c.stroke(); }
    const chip = (cx, cy, cw, chh, label, col = '#2a2a2e') => { c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 3; c.fillRect(cx - cw / 2, cy - chh / 2, cw, chh); c.strokeRect(cx - cw / 2, cy - chh / 2, cw, chh); c.fillStyle = '#c8c8c8'; for (let i = 0; i < 8; i++) { c.fillRect(cx - cw / 2 + 6 + i * (cw - 12) / 8, cy - chh / 2 - 6, 4, 6); c.fillRect(cx - cw / 2 + 6 + i * (cw - 12) / 8, cy + chh / 2, 4, 6); } if (label) { c.fillStyle = '#e8e8e8'; c.font = font(Math.round(chh * .32), 'Oswald'); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(label, cx, cy); } };
    chip(-w * .05, -h * .04, w * .26, w * .2, 'NV1'); chip(w * .22, -h * .18, w * .1, w * .07, 'AUDIO', '#3a3a40'); for (let i = 0; i < 4; i++) chip(-w * .32 + (i % 2) * w * .1, -h * .22 + Math.floor(i / 2) * h * .3, w * .07, w * .04, '', '#222');
    for (let i = 0; i < 6; i++) { c.fillStyle = i % 2 ? '#c8402e' : '#3a6ac8'; c.beginPath(); c.arc(w * .14 + i * w * .03, h * .3, 7, 0, 7); c.fill(); }
    c.fillStyle = '#b8bcc4'; c.strokeStyle = INK; c.lineWidth = 3; c.fillRect(w * .42, -h * .46, w * .08, h * .92); c.strokeRect(w * .42, -h * .46, w * .08, h * .92); c.fillStyle = '#2a2a2e'; c.fillRect(w * .435, -h * .38, w * .05, h * .18); c.fillRect(w * .435, -h * .05, w * .05, h * .22); c.fillStyle = '#c8a84a'; for (let i = 0; i < 5; i++) c.fillRect(w * .445, -h * .03 + i * h * .04, w * .03, 4); }
  else { c.fillStyle = 'rgba(232,192,64,.3)'; for (let i = 0; i < 40; i++) c.fillRect(-w * .45 + (i * 37) % (w * .9), -h * .4 + (i * 53) % (h * .8), 4, 4); }
  if (dust > 0) { c.fillStyle = `rgba(200,190,170,${.55 * dust})`; c.fillRect(-w / 2, -h / 2, w, h); c.fillStyle = `rgba(230,220,200,${.5 * dust})`; for (let i = 0; i < 260; i++) c.fillRect(-w / 2 + (i * 97) % w, -h / 2 + (i * 61) % h, 3, 3); }
  c.restore(); };
// label with leader line (world)
const leader = (c, lt, at, px, py, lx, ly, txt) => { const p = K.seg(lt, at, at + .5); if (p <= 0) return; c.save(); c.strokeStyle = CREAM; c.lineWidth = 4; c.beginPath(); c.moveTo(px, py); c.lineTo(px + (lx - px) * p, py + (ly - py) * p); c.stroke(); c.fillStyle = CREAM; c.beginPath(); c.arc(px, py, 8, 0, 7); c.fill(); c.strokeStyle = INK; c.lineWidth = 3; c.stroke(); if (p > .6) { const a = pop(lt, at + .3); c.translate(lx, ly); c.scale(a, a); c.font = font(46); const w = c.measureText(txt).width + 36; c.fillStyle = 'rgba(10,8,6,.4)'; c.fillRect(-w / 2 + 6, -30, w, 66); c.fillStyle = INK; c.fillRect(-w / 2, -36, w, 66); c.fillStyle = CREAM; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(txt, 0, 0); } c.restore(); };
// game box with a triangle-mesh cover (world). k = pop scale
const TITLES = ['ROBO RALLY', 'STAR TANK', 'DUNGEON 3D', 'TURBO KART', 'MECH ARENA', 'SKY ACE', 'CAVE RUN', 'NEON RACE', 'FORT BLAST', 'SUB HUNT', 'GOLF PRO', 'DRAGON KEEP', 'ICE HOCKEY', 'JET WING', 'TOMB QUEST', 'RALLY X'];
const COVERS = ['#2a3a7a', '#7a2a2a', '#2a5a3a', '#5a2a6a', '#1e1e2a', '#8a5a1a', '#1a5a6a', '#6a1a3a'];
const gameBox = (c, x, y, k, i, flash = 0) => { if (k <= 0) return; const w = 150, h = 200; c.save(); c.translate(x, y); c.scale(k, k); c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(-w / 2 + 10, -h + 8, w, h); c.fillStyle = COVERS[i % COVERS.length]; c.strokeStyle = INK; c.lineWidth = 3; c.fillRect(-w / 2, -h, w, h); c.strokeRect(-w / 2, -h, w, h); c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(w / 2 - 12, -h, 12, h);
  c.save(); c.beginPath(); c.rect(-w / 2 + 10, -h + 44, w - 30, h - 74); c.clip(); const sx = -w / 2 + 10, sy = -h + 44, cw = w - 30, ch = h - 74; c.strokeStyle = flash > 0 ? `rgba(255,${200 + 55 * flash},80,1)` : 'rgba(200,255,220,.75)'; c.lineWidth = 1.6 + flash * 1.5; const n = 5; for (let a = 0; a <= n; a++) for (let b = 0; b <= n; b++) { const px = sx + a * cw / n + ((a * 7 + b * 3 + i) % 5 - 2) * 3, py = sy + b * ch / n + ((a * 3 + b * 5 + i) % 5 - 2) * 3; c.beginPath(); c.moveTo(px, py); c.lineTo(px + cw / n, py); c.lineTo(px, py + ch / n); c.closePath(); c.stroke(); } c.restore();
  c.fillStyle = '#f6efe2'; c.font = font(20, 'Anton'); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(TITLES[i % TITLES.length], -6, -h + 22); c.fillStyle = 'rgba(255,255,255,.75)'; c.font = font(13, 'Oswald'); c.fillText('FOR WINDOWS 95', -6, -14); c.restore(); };
// shipping/return box (world)
const crate = (c, x, y, w, h, k, label = 'RETURN') => { if (k <= 0) return; c.save(); c.translate(x, y); c.scale(1, k); c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(-w / 2 + 10, -4, w, 12); c.fillStyle = '#b88a52'; c.strokeStyle = INK; c.lineWidth = 4; c.fillRect(-w / 2, -h, w, h); c.strokeRect(-w / 2, -h, w, h); c.fillStyle = 'rgba(255,255,255,.15)'; c.fillRect(-w / 2, -h, w, 10); c.fillStyle = '#d8c8a0'; c.fillRect(-10, -h, 20, h); c.save(); c.translate(0, -h / 2); c.rotate(-.06); c.strokeStyle = RED; c.lineWidth = 5; c.strokeRect(-w * .34, -26, w * .68, 52); c.fillStyle = RED; c.font = font(Math.round(w * .13)); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(label, 0, 2); c.restore(); c.restore(); };
const darkGrid = (c) => { const g = c.createLinearGradient(0, 0, 0, SH); g.addColorStop(0, '#12161e'); g.addColorStop(1, '#0a0c10'); c.fillStyle = g; c.fillRect(0, 0, SW, SH); c.strokeStyle = 'rgba(118,185,0,.08)'; c.lineWidth = 1; for (let x = 0; x < SW; x += 60) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, SH); c.stroke(); } for (let y = 0; y < SH; y += 60) { c.beginPath(); c.moveTo(0, y); c.lineTo(SW, y); c.stroke(); } };
const night = (k = .7) => (c) => { c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = `rgba(40,50,80,${k})`; c.fillRect(0, 0, SW, SH); c.restore(); };
// an empty office chair (world) that fades out: the laid-off desks
const chair = (x, y, a) => (c) => { if (a <= 0) return; c.save(); c.globalAlpha = a; c.translate(x, y); c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(0, 6, 70, 12, 0, 0, 7); c.fill(); c.fillStyle = '#2a2e36'; c.strokeStyle = INK; c.lineWidth = 4; c.fillRect(-50, -120, 100, 20); c.strokeRect(-50, -120, 100, 20); c.fillRect(-46, -250, 92, 120); c.strokeRect(-46, -250, 92, 120); c.fillRect(-5, -100, 10, 90); c.beginPath(); c.moveTo(-50, 0); c.lineTo(50, 0); c.stroke(); c.restore(); };
// the emulator: a big humming cabinet with cables (world)
const emulator = (c, x, y, lt, a) => { if (a <= 0) return; c.save(); c.globalAlpha = a; c.translate(x, y); c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(0, 8, 330, 26, 0, 0, 7); c.fill();
  const g = c.createLinearGradient(-300, 0, 300, 0); g.addColorStop(0, '#2a3038'); g.addColorStop(.5, '#4a525e'); g.addColorStop(1, '#22262e'); c.fillStyle = g; c.strokeStyle = INK; c.lineWidth = 6; c.fillRect(-300, -560, 600, 560); c.strokeRect(-300, -560, 600, 560);
  for (let r = 0; r < 6; r++) { c.fillStyle = '#1a1e24'; c.fillRect(-270, -530 + r * 86, 540, 66); for (let k = 0; k < 14; k++) { const on = Math.sin(lt * (3 + k * .7) + r * 2 + k) > .2; c.fillStyle = on ? (k % 5 ? '#76b900' : '#ffb84a') : '#2a3a20'; c.fillRect(-250 + k * 36, -506 + r * 86, 14, 10); } }
  c.fillStyle = '#d8d2c0'; c.fillRect(-120, -600, 240, 40); c.strokeRect(-120, -600, 240, 40); c.fillStyle = INK; c.font = font(28, 'Oswald'); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('EMULATOR', 0, -580);
  c.strokeStyle = '#1a1a1a'; c.lineWidth = 10; for (let k = 0; k < 5; k++) { c.beginPath(); c.moveTo(300, -80 - k * 70); c.bezierCurveTo(420 + k * 30, -40 - k * 50, 380, 10, 520 + k * 40, 10); c.stroke(); } c.restore(); };
// a stacked chip box (world-ish, local)
const chipBox = (c, x, y, s) => { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = '#76b900'; c.strokeStyle = INK; c.lineWidth = 4; c.fillRect(-50, -36, 100, 72); c.strokeRect(-50, -36, 100, 72); c.fillStyle = '#10140a'; c.fillRect(-50, -36, 100, 18); c.fillStyle = CREAM; c.font = font(20); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('RIVA 128', 0, -26); c.fillStyle = '#1a1e24'; c.fillRect(-22, -6, 44, 30); c.restore(); };

window.SHOTS = [

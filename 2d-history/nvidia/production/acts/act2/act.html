  for (let j = 0; j < M; j++) for (let i = 0; i < N; i++) { const la0 = -Math.PI / 2 + j / M * Math.PI, la1 = la0 + Math.PI / M, lo0 = i / N * TAU, lo1 = lo0 + TAU / N; const mid = P((la0 + la1) / 2, (lo0 + lo1) / 2); if (mid[2] < -.05) continue; n++; const on = K.clamp(built - n + 1);

<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}@font-face{font-family:SourceSerif;src:url(../../../../shared/fonts/SourceSerif4.ttf)}body{margin:0;background:#000}</style></head>

<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/rig_v5.js"></script><script src="../../../../shared/rig_leo.js"></script><script>window.RIGSTYLE = "gumball";</script><script src="../../../../shared/kit.js"></script><script src="../../../../shared/anim.js"></script>
<script src="timing.js"></script>
<script>
const K = KIT, A = ANIM, R = RIG, E = K.E, PL = '../../plates/';
for (const n of ['diner_ext', 'booth', 'dishroom', 'office', 'serverhall', 'chip']) K.load(n, PL + n + '.jpg');
for (const n of ['fg_booth', 'fg_sink']) K.load(n, PL + n + '.png');
const T = window.TIMING; const last = T.shots[T.shots.length - 1]; T.shots.push({ i: T.shots.length + 1, start: last.end, end: last.end + 4.8, vo_start: last.end, vo_end: last.end, text: '' }); T.dur = last.end + 4.8;
const SW = 1920, SH = 1080, CREAM = '#f6efe2', GREEN = '#76b900', GOLD = '#e8b44a', RED = '#d9483b';
const pop = (lt, at, d = .45) => E.back(K.seg(lt, at, at + d));
const font = (px, fam = 'Anton') => `${px}px ${fam}`;
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
const panel = (c, x, y, w, h) => { c.fillStyle = 'rgba(8,10,14,.74)'; rr(c, x, y, w, h, 18); c.fill(); c.strokeStyle = 'rgba(118,185,0,.55)'; c.lineWidth = 2; c.stroke(); };
const sprite = (name) => (c) => c.drawImage(K.imgs[name], 0, 0, 2560, 1440);
const steam = (x, y, w, al = .16, until = 99) => (c, lt) => { const fade = 1 - K.seg(lt, until, until + 1.2); if (fade <= 0) return; for (let k = 0; k < 18; k++) { const life = (lt * .22 + k / 18) % 1, sx = x + Math.sin(k * 2.3 + life * 4) * w * .5 + (k - 9) * w / 18, sy = y - life * 520, rad = 40 + life * 160; const g = c.createRadialGradient(sx, sy, 0, sx, sy, rad); g.addColorStop(0, `rgba(255,255,255,${al * (1 - life) * fade})`); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(sx - rad, sy - rad, rad * 2, rad * 2); } };
const mugSteam = (x, y) => (c, lt) => { for (let k = 0; k < 5; k++) { const life = (lt * .5 + k / 5) % 1, sx = x + Math.sin(life * 6 + k) * 10, sy = y - life * 90, rad = 10 + life * 22; const g = c.createRadialGradient(sx, sy, 0, sx, sy, rad); g.addColorStop(0, `rgba(255,255,255,${.25 * (1 - life)})`); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(sx - rad, sy - rad, rad * 2, rad * 2); } };
// chip outline that "doesn't exist yet": dashed, drawn on
const ghostChip = (at) => (c, lt) => { const p = K.seg(lt, at, at + 1.2); if (p <= 0) return; c.save(); c.translate(1500, 330); c.setLineDash([14, 10]); c.lineDashOffset = -lt * 30; c.strokeStyle = `rgba(118,185,0,${.9})`; c.lineWidth = 5; const L = 4 * 220 * p; c.beginPath(); c.moveTo(-110, -110); const pts = [[110, -110], [110, 110], [-110, 110], [-110, -110]]; let rem = L, px = -110, py = -110; for (const [x, y] of pts) { const d = Math.hypot(x - px, y - py); if (rem <= 0) break; const t = Math.min(1, rem / d); c.lineTo(px + (x - px) * t, py + (y - py) * t); rem -= d; px = x; py = y; } c.stroke();
  if (p >= 1) { for (let k = -3; k <= 3; k++) for (const s of [-1, 1]) { c.beginPath(); c.moveTo(k * 28, s * 110); c.lineTo(k * 28, s * 140); c.moveTo(s * 110, k * 28); c.lineTo(s * 140, k * 28); c.stroke(); } c.setLineDash([]); c.fillStyle = 'rgba(118,185,0,.85)'; c.font = font(64); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 0, 4); }
  c.restore(); if (p >= 1) K.outlined(c, "A CHIP THAT DIDN'T EXIST YET", 1500, 530, 40, { alpha: K.seg(lt, at + 1.2, at + 1.6) }); };
// office lights go out row by row from the back
const lightsOut = (t0, t1, n = 6) => (c, lt) => { const u = K.seg(lt, t0, t1), k = Math.floor(u * n); c.fillStyle = `rgba(4,6,14,${Math.min(.72, k * .12)})`; c.fillRect(0, 0, SW, SH); };
const cashCounter = (S) => { const t0 = A.at(S, 'lost almost', 2.5), t1 = A.at(S, 'running out', 5.4); return (c, lt) => { const a = K.seg(lt, .3, .7); if (a <= 0) return; c.save(); c.globalAlpha = a; panel(c, 1240, 150, 560, 250); c.fillStyle = 'rgba(246,239,226,.7)'; c.font = font(30, 'Oswald'); c.fillText('DAYS OF CASH LEFT', 1280, 205); const u = E.out(K.seg(lt, t0 - .4, t1 + .4)), v = Math.round(365 - (365 - 30) * u); c.fillStyle = v <= 30 ? RED : CREAM; c.font = font(130); c.fillText(String(v), 1280, 350); if (v <= 30) { c.fillStyle = RED; c.font = font(34, 'Oswald'); c.fillText('≈ ONE MONTH', 1560, 340); } c.restore(); }; };
const capBars = (S) => { const tN = A.at(S, 'reason it won', 2.2), tB = A.at(S, 'the bet', 4.2); S.D.sfx.push([tN - .3, 'riser', .5], [tN + 1.1, 'hit', .6]);
  const rows = [{ n: 'APPLE', v: 4.0, c: '#8a8f99' }, { n: 'MICROSOFT', v: 3.9, c: '#4a7ad0' }, { n: 'NVIDIA', v: 5.0, c: GREEN }];
  return (c, lt) => { const a = K.seg(lt, .2, .6); if (a <= 0) return; c.save(); c.globalAlpha = a; panel(c, 260, 160, 1400, 640); c.fillStyle = 'rgba(246,239,226,.7)'; c.font = font(28, 'Oswald'); c.fillText('MARKET VALUE (LATE 2025)', 300, 210);
    rows.forEach((r0, i) => { const y = 260 + i * 170, at = i < 2 ? .5 + i * .3 : tN - .3, u = E.out(K.seg(lt, at, at + (i < 2 ? .8 : 1.6))), w = 1050 * r0.v / 5 * u; c.fillStyle = CREAM; c.font = font(40); c.fillText(r0.n, 300, y + 40); c.fillStyle = 'rgba(246,239,226,.1)'; rr(c, 300, y + 60, 1050, 70, 12); c.fill(); c.fillStyle = r0.c; rr(c, 300, y + 60, Math.max(w, 1), 70, 12); c.fill(); c.fillStyle = '#fff'; c.font = font(44); c.fillText('$' + (r0.v * u).toFixed(1) + 'T', 300 + Math.max(w, 10) + 18, y + 112); });
    c.restore(); if (lt > tB) K.card(c, 'THE BET: ~6 YEARS OF\nALMOST NOTHING', lt, { at: tB + .2, x: 1630, y: 92, px: 40, rot: -3, fam: 'Caveat' }); }; };

window.SHOTS = [
  // 1 teen at the dish sink; steam rises, clears into the $5T counter
  { plate: 'dishroom', cam: { z: [1.18, 1.1], x: [1280, 1280], y: [760, 740] }, bed: [['hum_loop', .35]], inSfx: false,
    figs: [{ x: 1180, y: 1330, s: 2.5, pose: 'work', costume: 'shirt', hair: 'short', facing: 1, mood: 'neutral' }],
    front: [sprite('fg_sink')],
    init: S => { const t5 = A.at(S, 'five trillion', 4.4); S.D.live = [steam(1500, 1080, 300, .2, t5 - 1.2)]; S.D.front.push(steam(1500, 1090, 320, .22, t5 - 1.2));
      S.D.over = [(c, lt) => { const a = K.seg(lt, t5 - 1, t5 - .4); if (a <= 0) return; c.fillStyle = `rgba(6,8,6,${.55 * a})`; c.fillRect(0, 0, SW, SH); K.counter(c, 0, 5, lt, { at: t5 - .8, dur: 1.8, fmt: v => '$' + Math.round(v * 1e3).toLocaleString('en-US') + ',000,000,000', x: SW / 2, y: 330, px: 104, fill: GREEN }); if (lt > t5 + 1) K.badge(c, 'FIRST COMPANY WORTH $5 TRILLION', lt, { at: t5 + 1 }); }];
      S.D.sfx = [[0, 'swell', .35], [.4, 'scrape', .25], [1.6, 'scrape', .2], [t5 - .8, 'coins_cascade', .4], [t5 + 1, 'hit', .55]]; } },
  // 2 night diner, push into the booth window; three engineers argue over coffee
  { plate: 'diner_ext', cam: { z: [1.0, 2.6], x: [1280, 1357], y: [720, 760], ease: E.io }, bed: [['night_loop', .45]], inSfx: 'whoosh_soft',
    init: S => { const tb = A.at(S, 'booth', 2.2); S.D.cam = { z: [1.0, 3.2], x: [1280, 1357], y: [700, 765], ease: t => E.io(Math.min(1, t * (S.end - S.start) / (tb + .4))) };
      const booth = { cam: { z: 1.12, x: 1280, y: 760 } };
      S.D.over = [(c, lt) => K.badge(c, 'SAN JOSE · 1993', lt, { at: .5 }), (c, lt, u) => { const a = E.io(K.seg(lt, tb, tb + .6)); if (a <= 0) return; c.save(); c.globalAlpha = a; const z = 1.1 + .06 * K.seg(lt, tb, S.end - S.start); const s2 = z * SW / 2560; c.setTransform(s2, 0, 0, s2, SW / 2 - 1280 * s2, SH / 2 - 760 * s2); c.drawImage(K.imgs.booth, 0, 0, 2560, 1440);
          const t = lt; [[790, 1, [0, 99]], [1280, 1, [0, 99]], [1790, -1, [0, 99]]].forEach(([x, f], i) => { const talk = Math.floor((t - tb) / 1.3) % 3 === i; const g = talk ? E.sine(K.seg((t - tb) % 1.3, 0, .35)) * (1 - E.sine(K.seg((t - tb) % 1.3, .95, 1.3))) : 0; R.figure(c, { x, y: 1060, s: 2.4, t, pose: 'sit', costume: ['shirtsleeves', 'shirt', 'office'][i], hair: ['curly', 'swept', 'short'][i], beard: i === 2, glasses: i === 1, facing: i === 2 ? -1 : 1, seed: 4 + i, talk, mood: talk ? 'happy' : 'neutral', arms: g > 0 ? ((tt, P) => ({ shR: K.lerp(P.shR, 30, g), elR: K.lerp(P.elR, -110, g) })) : null }); });
          for (const [mx, my] of [[884, 1080], [1393, 1062], [1770, 1072]]) mugSteam(mx, my - 40)(c, lt); c.drawImage(K.imgs.fg_booth, 0, 0, 2560, 1440); c.restore(); if (lt > tb + 1) ghostChip(A.at(S, "didn't exist", 6.5) - .4)(c, lt); }];
      S.D.sfx = [[.3, 'night_loop', .2], [tb, 'door_slam', .25], [tb + .3, 'crowd_loop', .3], [A.at(S, "didn't exist", 6.5), 'chime', .4]]; } },
  // 3 the dark office: wrong chip, lights go out, days of cash run down
  { plate: 'office', cam: { z: [1.1, 1.25], x: [1280, 1280], y: [740, 760] }, bed: [['office_loop', .35], ['tension', .3]],
    init: S => { const tw = A.at(S, 'wrong chip', 2), t0 = A.at(S, 'lost almost', 2.5), t1 = A.at(S, 'running out', 5.4); S.D.over = [lightsOut(t0 - .3, t1 + .5), (c, lt) => K.card(c, 'THE WRONG CHIP', lt, { at: tw, until: t0 + .5, x: 520, y: 220, px: 64, rot: -4 }), cashCounter(S)];
      S.D.sfx = [[tw, 'stamp', .55]]; for (let k = 0; k < 6; k++) S.D.sfx.push([t0 - .3 + (t1 + .8 - t0) * k / 6, 'thud', .3]); S.D.sfx.push([t1, 'heartbeat', .55]); } },
  // 4 market value: Nvidia rockets past Apple and Microsoft
  { plate: 'serverhall', cam: { z: [1.05, 1.12], x: [1280, 1280], y: [720, 720] }, bed: [['hum_loop', .5]],
    over: [A.dim(.45)], init: S => { S.D.over.push(capBars(S)); } },
  // 5 Jensen backlit in the server hall; the quote
  { plate: 'serverhall', cam: { z: [1.15, 1.55], x: [1280, 1280], y: [800, 860], ease: E.io }, bed: [['hum_loop', .5]], inSfx: 'whoosh',
    figs: [{ x: 1280, y: 1300, s: 2.3, pose: 'stand', costume: 'leather', hair: 'swept', glasses: true, facing: 1 }],
    init: S => { const tq = A.at(S, 'will to survive', 5.5), tn = A.at(S, 'Nvidia', 1); S.D.over = [(c, lt) => K.badge(c, 'JENSEN HUANG · CO-FOUNDER & CEO', lt, { at: tn + .6 }), (c, lt) => K.card(c, '"MY WILL TO SURVIVE EXCEEDS\nALMOST EVERYBODY ELSE\'S\nWILL TO KILL ME"', lt, { at: tq, x: 1380, y: 300, px: 52, rot: 2, fam: 'Caveat' })];
      S.D.live = [(c, lt) => { c.save(); c.globalCompositeOperation = 'screen'; const g = c.createRadialGradient(1280, 760, 0, 1280, 760, 700); g.addColorStop(0, 'rgba(140,200,255,.35)'); g.addColorStop(1, 'rgba(140,200,255,0)'); c.fillStyle = g; c.fillRect(580, 60, 1400, 1400); c.restore(); }];
      S.D.sfx = [[tq, 'paper', .5], [tq + .2, 'swell', .4]]; } },
  // 6 TITLE: one chip glowing on a dark table
  { plate: 'chip', cam: { z: [1.18, 1.08], x: [1280, 1280], y: [820, 800] }, bed: [['hum_loop', .4]], inSfx: 'riser',
    live: [(c, lt) => { const p = .5 + .5 * Math.sin(lt * 2.4); c.save(); c.globalCompositeOperation = 'screen'; const g = c.createRadialGradient(1280, 920, 0, 1280, 920, 700); g.addColorStop(0, `rgba(118,185,0,${.25 + .15 * p})`); g.addColorStop(1, 'rgba(118,185,0,0)'); c.fillStyle = g; c.fillRect(580, 220, 1400, 1400); c.restore(); }],
    over: [(c, lt) => K.title(c, 'NVIDIA', lt, { at: .35, y: 210, px: 150, sub: 'THE WRONG CHIP', subPx: 80, subOpts: { fill: GREEN } })], sfx: [[.35, 'hit', .9], [.4, 'swell', .5]] },
];
const _build = A.build; A.build = () => { const T2 = window.TIMING; K.setWords(T2.words); T2.shots.forEach((S, i) => { const D = window.SHOTS[i]; if (!D) return; D.live = D.live || []; D.front = D.front || []; D.over = D.over || []; D.sfx = D.sfx || []; S.D = D; S.vo_start = S.vo_start ?? S.start; if (D.init) D.init(S); }); _build(); };
A.build(); K.boot();
</script></body></html>

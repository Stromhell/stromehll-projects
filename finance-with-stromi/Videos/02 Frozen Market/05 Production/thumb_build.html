<html><head><link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet"></head><body style="margin:0"><canvas id="c" width="1920" height="1080"></canvas><script>
(async()=>{await document.fonts.load('200px Anton');const c=document.getElementById('c'),x=c.getContext('2d');const im=new Image();im.src='c.jpg';await im.decode();
const s=1080/768,w=1376*s;x.drawImage(im,1920-w,0,w,1080);
let g=x.createLinearGradient(0,0,1000,0);g.addColorStop(0,'rgba(4,8,18,.97)');g.addColorStop(0.6,'rgba(4,8,18,.97)');g.addColorStop(0.78,'rgba(4,8,18,.6)');g.addColorStop(1,'rgba(4,8,18,0)');x.fillStyle=g;x.fillRect(0,0,1000,1080);
function txt(t,X,Y,size,fill,rot){x.save();x.translate(X,Y);x.rotate(rot);x.font=size+'px Anton';x.lineJoin='round';
x.shadowColor='rgba(0,0,0,.75)';x.shadowOffsetX=10;x.shadowOffsetY=12;x.lineWidth=size*0.12;x.strokeStyle='#000';x.strokeText(t,0,0);x.shadowColor='transparent';
if(fill==='ice'){const gg=x.createLinearGradient(0,-size,0,0);gg.addColorStop(0,'#ffffff');gg.addColorStop(1,'#8fd8ff');x.fillStyle=gg;}else x.fillStyle=fill;x.fillText(t,0,0);x.restore();}
txt('FROZEN',60,430,300,'ice',-0.035);
x.save();x.translate(75,500);x.rotate(-0.035);x.fillStyle='#e8262b';x.strokeStyle='#000';x.lineWidth=9;x.beginPath();x.rect(0,0,610,120);x.fill();x.stroke();x.font='88px Anton';x.fillStyle='#fff';x.fillText("NOBODY'S BUYING",26,95);x.restore();
txt('SO WHY SO PRICEY?',70,770,92,'#ffd23a',-0.035);
window.done=1;})();
</script></body></html>

<html><head><style>
@import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');
body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000;font-family:Anton,Impact,sans-serif}
#bg{position:absolute;inset:0;background:url(art.jpg) center/cover;filter:saturate(1.15) contrast(1.05)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 45%,transparent 45%,rgba(120,0,0,.45) 100%),linear-gradient(90deg,rgba(0,0,0,.75) 0,rgba(0,0,0,.35) 32%,transparent 45%)}
.logo{position:absolute;border-radius:28px;box-shadow:0 0 0 7px #ff1a1a,0 0 38px 14px rgba(255,20,20,.9),0 0 90px 30px rgba(255,0,0,.55);background:#fff;display:flex;align-items:center;justify-content:center;transform:rotate(var(--r))}
.logo img{display:block}
.alarm{position:absolute;inset:-6px;border-radius:32px;background:rgba(255,0,0,.18);mix-blend-mode:multiply}
#t{position:absolute;left:70px;top:150px;width:760px}
.w{font-size:150px;line-height:1;color:#fff;text-shadow:0 8px 0 #000,0 0 30px rgba(0,0,0,.9);letter-spacing:2px}
.r{font-size:210px;line-height:.95;color:#ff2020;text-shadow:0 8px 0 #000,0 0 40px rgba(255,0,0,.8)}
.box{display:inline-block;margin-top:24px;background:#ffd21a;color:#111;font-size:86px;padding:6px 26px 2px;transform:rotate(-2deg);box-shadow:0 8px 0 #000}
.faa{position:absolute;width:250px;height:250px;border-radius:50%;background:#071a3a;transform:rotate(var(--r));box-shadow:0 0 0 7px #ff1a1a,0 0 38px 14px rgba(255,20,20,.9),0 0 90px 30px rgba(255,0,0,.55);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff}
.faa b{font-size:96px;color:#29b6f6;line-height:1;letter-spacing:4px}.faa i{font-style:normal;font-size:24px;color:#ff4a4a;letter-spacing:2px}
</style></head><body><div id="bg"></div><div id="vig"></div>
<div class="logo" style="left:795px;top:120px;width:230px;height:230px;--r:-8deg;background:#0d2a66"><img src="outlook.webp" style="width:190px"></div>
<div class="logo" style="left:1500px;top:50px;width:370px;height:150px;--r:6deg"><img src="workday.png" style="width:320px"></div>
<div class="faa" style="left:1610px;top:330px;--r:-6deg"><b>FAA</b><i>GROUND STOP</i></div>
<div id="t"><div class="w">EVERYTHING</div><div class="r">BROKE</div><div class="box">IN 48 HOURS</div></div>
</body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Head Office Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1d1b18;--mute:#6b655c;--line:#e4ddd2;--acc:#c2372d;--grn:#3f9b5f;--chip:#efe8dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--card:#1e1c19;--ink:#f1ece4;--mute:#a59d91;--line:#34302a;--acc:#e0574c;--grn:#5cbf7d;--chip:#2a2722}}
:root[data-theme="dark"]{--bg:#141311;--card:#1e1c19;--ink:#f1ece4;--mute:#a59d91;--line:#34302a;--acc:#e0574c;--grn:#5cbf7d;--chip:#2a2722}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:26px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 22px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 16px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
img{width:100%;border-radius:10px;display:block}
ol,ul{margin:0;padding:0;list-style:none}
.titles li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}.titles li:first-child{border-top:0}
.n{width:24px;height:24px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:12px;font-weight:700}
.t{font-weight:600;flex:1;min-width:200px}.c{color:var(--mute);font-size:12px}
.pill{background:var(--acc);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
pre{white-space:pre-wrap;word-break:break-word;font:13px/1.6 Inter,system-ui,sans-serif;margin:0;max-height:420px;overflow:auto}
.chap li{padding:4px 0}code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{background:var(--chip);padding:4px 10px;border-radius:99px;font-size:13px}.tag.const{outline:1px dashed var(--mute)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.meta div{background:var(--chip);border-radius:10px;padding:10px}.meta b{display:block;font-size:12px;color:var(--mute);font-weight:600}
button{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:5px 12px;font:600 12px Inter,sans-serif;cursor:pointer;text-transform:none;letter-spacing:0}
a{color:var(--acc)}
</style></head><body></main><script>
document.querySelectorAll('button[data-copy]').forEach(b=>b.onclick=()=>{const el=document.getElementById(b.dataset.copy);navigator.clipboard&&navigator.clipboard.writeText(el.textContent).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1500)}).catch(()=>{})});
</script></body></html>

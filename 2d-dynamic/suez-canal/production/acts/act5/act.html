<!doctype html><html><head><meta charset="utf-8"><title>SZ act 5 - the iron monsters</title>
<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/vp/engine.js"></script><script src="../../../../shared/vp/cast.js"></script><script src="../../../../shared/vp/scenes.js"></script><script src="../../../../shared/vp/spain.js"></script>
<script src="../../../../shared/kit.js"></script><script src="../../../../shared/vp.js"></script>
<script src="../../../../spain-1-al-andalus/production/es1_sets.js"></script><script src="../../../../spain-1-al-andalus/production/es1_sets_act1.js"></script><script src="../../../../spain-1-al-andalus/production/es1_cast.js"></script>
<script src="../../../../spain-3-civil-war/production/es3_cast.js"></script>
<script src="../../../../japan-comeback/production/jp_cast.js"></script><script src="../../../../japan-comeback/production/jp_sets.js"></script>
<script src="../../sz_sets.js"></script><script src="../../sz_cast.js"></script><script src="../../sz_props.js"></script><script src="../../sz_sets2.js"></script>
<script src="timing.js"></script>
<script>
const K = KIT, E = K.E, Z = S.SZ, C = S.SZC, H1 = S.ES1H, TAU = Math.PI * 2;
const at = VP.at, seg = K.seg, lerp = K.lerp;
{ const T = window.TIMING, L = T.shots[T.shots.length - 1]; T.shots.push({ i: T.shots.length + 1, start: L.end, end: L.end + 4.8, vo_start: L.end, vo_end: L.end, text: '' }); T.dur = L.end + 4.8; }
const SUN = lt => VP.light('studio', lt, { swing: 3, set: { L: [.6, -.9], amb: '#6a5a4a', ambA: .2, rim: '#fff0d0', rimA: .8, tint: '#ffe8c0', tintA: .08 } });
const DUSK = lt => VP.light('studio', lt, { swing: 3, set: { L: [-.7, -.6], amb: '#4a3a5a', ambA: .3, rim: '#ffc890', rimA: .9, tint: '#ffb070', tintA: .14 } });
const shimmer = (c, lt, y0, y1) => { for (let k = 0; k < 18; k++) { const r = S.rng(k + 50), y = y0 + r() * (y1 - y0); c.fillStyle = S.rgba('#fff4dc', .05); c.fillRect(0, y + Math.sin(lt * 3 + k) * 2, 1280, 2); } };
// route on the parchment map: the long way round Africa, and the Suez shortcut
const LONG = [[4, 51.8], [-6, 47], [-11, 40], [-18, 28], [-19, 16], [-12, 5], [4, 0], [10, -14], [14, -30], [19, -37.5], [28, -36], [38, -26], [44, -14], [52, 0], [56, 12], [62, 17], [72, 15], [80, 6], [95, 4], [104, 1.3]];
const HEAT = lt => VP.light('studio', lt, { swing: 2, set: { L: [.2, -1], amb: '#7a5a3a', ambA: .15, rim: '#fff4d8', rimA: .9, tint: '#ffe8b0', tintA: .1 } });
const NIGHT = lt => VP.light('studio', lt, { swing: 6, set: { L: [-.6, -.5], amb: '#1a2040', ambA: .45, rim: '#ffc070', rimA: .9, tint: '#ffb060', tintA: .12 } });
const crew = (c, list, lt, L, y, uu, look = [0, 0]) => list.forEach(([x, ch, k, pose, yy, u2]) => { const Y = yy ?? y, U = u2 ?? uu; S.contact(c, x, Y, U * .5, .35); VP.figure(c, [x, Y], { k: .6, sy: -.2, a: .3, blur: 3 }, cc => S.person(cc, ch, x, Y, U, pose, { blink: S.blinkAt(lt, k), look, time: lt }, L)); });
const night = (c, a = .62) => { c.fillStyle = S.rgba('#0a1030', a); c.fillRect(0, 0, 1280, 720); for (let k = 0; k < 80; k++) { const r = S.rng(k + 5300); c.fillStyle = S.rgba('#ffffff', .3 + r() * .5); c.fillRect(r() * 1280, r() * 250, 1.5, 1.5); } };
const shovel = (c, x, y, a) => { c.save(); c.translate(x, y); c.rotate(a); c.strokeStyle = '#5a3a1e'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 40); c.stroke(); c.fillStyle = '#6a6a6a'; c.beginPath(); c.moveTo(-8, 40); c.lineTo(8, 40); c.lineTo(5, 56); c.lineTo(-5, 56); c.fill(); c.restore(); };

window.SHOTS = [
  // 5.01 WIDE: a giant steam dredger in the channel; the bucket chain loops; mud spills down the chute; black smoke
  { set: 'sz_oldcanal', cam: { z: [1.15, 1.0], x: [700, 640], y: [400, 360], ease: E.io }, bed: [['engine_loop', .3], ['water_loop', .15]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tM = at(Sh, 'machines', 1.2); Sh.tC = at(Sh, 'chutes', Sh.dur - 1.5); },
    draw: (c, lt, u, Sh) => { const L = HEAT(lt);
      c.fillStyle = '#7a5a3a'; c.beginPath(); c.ellipse(330, 392, 150, 34, 0, Math.PI, TAU); c.fill();
      S.szDredger(c, 720, 480, 1.0, lt, { chute: -1 });
      S.szDredger(c, 1180, 470, .55, lt + 1.3, { chute: -1 });
      crew(c, [[200, C.LESSEPS_H, 0, Object.assign(S.idle(lt, 0), { face: 1, shN: 120, elN: 20 })], [300, C.GUEST, 1, Object.assign(S.idle(lt, 1), { face: 1, shN: 30, elN: 60 })]], lt, L, 660, 38, [.7, -.5]); },
    over: [(c, lt, u, Sh) => K.badge(c, 'STEAM DREDGERS', lt, { at: Sh.tM }), (c, lt, u, Sh) => K.card(c, 'MADE IN FRANCE', lt, { at: Sh.tC, x: 1400, y: 900, px: 46, rot: -2 })],
    sfx: [[.2, 'engine_loop', .3], [.8, 'steam', .35], ['machines', 'clank', .4], ['chutes', 'splash', .3]] },

  // 5.02 MED: night; machines along the canal with glowing fireboxes; sparks; reflections in the water
  { set: 'sz_oldcanal', cam: { z: [1.0, 1.1], x: [640], y: [380, 400], ease: E.io }, bed: [['engine_loop', .35], ['fire_loop', .15]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tA = at(Sh, 'armies', 4.5); Sh.tL = at(Sh, 'last years', Sh.dur - 3); },
    draw: (c, lt, u, Sh) => { night(c); const L = NIGHT(lt);
      [[260, .55, 0], [700, .8, 1], [1120, .6, 2]].forEach(([x, s, k]) => { S.szDredger(c, x, 480, s, lt + k, { night: 1, chute: -1 }); c.fillStyle = S.rgba('#ff9040', .25); c.fillRect(x - 40 * s, 490, 30 * s, 40 + Math.sin(lt * 4 + k) * 6);
        for (let j = 0; j < 8; j++) { const q = (lt * .8 + j / 8 + k * .3) % 1; c.fillStyle = S.rgba('#ffc060', 1 - q); c.fillRect(x - 50 * s + Math.sin(j * 3) * 20 * q, 480 - 170 * s - q * 80, 2, 2); } });
      crew(c, [[560, C.FELLAH, 0, Object.assign(S.idle(lt, 0), { face: 1, lean: .2, shN: 90 + 30 * Math.sin(lt * 3), elN: 40, holdN: wr => shovel(c, wr[0], wr[1], .5) })], [860, C.FRSOLD, 1, Object.assign(S.idle(lt, 1), { face: -1, shN: 40, elN: 60 })]], lt, L, 660, 36, [.3, -.3]); },
    over: [(c, lt, u, Sh) => K.card(c, 'DAY AND NIGHT', lt, { at: .8, x: 600, y: 200, px: 52, rot: -2, until: Sh.tL }), (c, lt, u, Sh) => K.card(c, 'MOST DIGGING: MACHINES', lt, { at: Sh.tL + .3, x: 1300, y: 200, px: 50, rot: 2 })],
    sfx: [[.2, 'engine_loop', .35], [.6, 'fire_loop', .2], ['armies', 'clank', .4], ['last years', 'steam', .35]] },

  // 5.03 CU: workers brush sand off a granite stone; the carved winged sun appears again
  { set: 'sz_dunes', cam: (lt, u, Sh) => ({ z: [lerp(1.0, 1.35, E.io(seg(lt, 0, Sh.dur)))], x: [640], y: [lerp(420, 470, E.io(seg(lt, 0, Sh.dur)))] }), bed: [['wind_loop', .2], ['swell', .1]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tD = at(Sh, 'Darius', 3); },
    draw: (c, lt, u, Sh) => { const L = HEAT(lt), q = E.io(seg(lt, .3, Sh.tD + 1));
      S.szStone(c, 640, 640, 1.05, lerp(.75, .12, q), lt, {}); if (q > .6) VP.glow(c, 640, 460, 80, '#ffe0a0', .5 * seg(lt, Sh.tD, Sh.tD + 1));
      [[460, C.FELLAH2, 0, 1], [820, C.FELLAH3, 1, -1]].forEach(([x, ch, k, f]) => { const sw = Math.sin(lt * 4 + k * 2); S.contact(c, x, 660, 20, .35); VP.figure(c, [x, 660], { k: .5, sy: -.2, a: .3, blur: 3 }, cc => S.person(cc, ch, x, 660, 40, Object.assign(S.idle(lt, k), { face: f, lean: .25, shN: 80 + 25 * sw, elN: 50 + 20 * sw, holdN: wr => shovel(cc, wr[0], wr[1], f * (.9 + .2 * sw)) }), { blink: S.blinkAt(lt, k), worry: 0, look: [f * .6, .3], time: lt }, L)); });
      for (let k = 0; k < 20; k++) { const r = S.rng(k + 5400), qq = (lt * 1.3 + r()) % 1; c.fillStyle = S.rgba('#e0c08a', .7 * (1 - qq)); c.beginPath(); c.arc(560 + r() * 160, 480 + qq * 160, 3, 0, TAU); c.fill(); } },
    over: [(c, lt, u, Sh) => K.card(c, "DARIUS'S STONE · FOUND 1866", lt, { at: Sh.tD + .5, x: 960, y: 170, px: 54, rot: -2 })],
    sfx: [[.3, 'brush', .3], [1.4, 'brush', .3], ['Darius', 'chime', .45]] },

  // 5.04 MED: the last earth dam breaks; sea water rushes into the dry Bitter Lakes basin
  { set: 'sz_dunes', cam: (lt, u, Sh) => ({ z: [1.0], x: [lerp(560, 760, E.io(seg(lt, Sh.tB, Sh.dur)))], y: [400], shake: lt > Sh.tB && lt < Sh.tB + .8 ? 4 : 0 }), bed: [['wind_loop', .2]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tB = at(Sh, 'flowed', 1.6); },
    draw: (c, lt, u, Sh) => { const L = HEAT(lt), q = E.out(seg(lt, Sh.tB, Sh.dur));
      c.fillStyle = '#c89a62'; c.beginPath(); c.ellipse(820, 600, 560, 90, 0, 0, TAU); c.fill(); c.fillStyle = '#b8884e'; c.beginPath(); c.ellipse(820, 610, 520, 70, 0, 0, TAU); c.fill();
      c.save(); c.beginPath(); c.ellipse(820, 610, 520, 70, 0, 0, TAU); c.clip(); const wx = lerp(300, 1400, q); const g = c.createLinearGradient(0, 540, 0, 680); g.addColorStop(0, '#5a9ab0'); g.addColorStop(1, '#2a5a72'); c.fillStyle = g; c.beginPath(); c.moveTo(280, 540); c.lineTo(wx, 540); for (let k = 0; k <= 10; k++) c.lineTo(wx + Math.sin(k + lt * 6) * 16, 540 + k * 14); c.lineTo(280, 690); c.fill();
      for (let k = 0; k < 18; k++) { c.fillStyle = S.rgba('#ffffff', .7); c.beginPath(); c.arc(wx - 10 + Math.sin(k * 2 + lt * 8) * 10, 545 + k * 8, 5, 0, TAU); c.fill(); } c.restore();
      if (lt < Sh.tB + .4) { c.fillStyle = '#a07a4a'; c.fillRect(260, 520 - (lt > Sh.tB ? (lt - Sh.tB) * 200 : 0) * 0, 40, 160); }
      for (let k = 0; k < 14; k++) { const r = S.rng(k + 5500), b = seg(lt, Sh.tB, Sh.tB + 1.2); if (b <= 0 || b >= 1) continue; c.fillStyle = S.rgba('#8a6a40', 1 - b); c.beginPath(); c.arc(280 + r() * 60 * b * 4, 560 - b * 200 * r() + b * b * 260, 6, 0, TAU); c.fill(); }
      crew(c, [[140, C.FELLAH, 0, Object.assign(S.idle(lt, 0), { face: 1, shN: lt > Sh.tB ? 150 : 30, elN: 20, shF: lt > Sh.tB ? 150 : 30, elF: 20 })]], lt, L, 520, 26, [.6, .2]); },
    over: [(c, lt) => K.dateTag(c, 'AUGUST 1869', lt, { at: .4 }), (c, lt, u, Sh) => K.badge(c, 'INTO THE BITTER LAKES', lt, { at: Sh.tB + .6 })],
    sfx: [[.4, 'creak', .4], ['flowed', 'splash', .7], ['Bitter Lakes', 'water_loop', .35]] },

  // 5.05 WIDE: 17 Nov 1869; decorated ships parade; Empress Eugenie waves from the Aigle; crowds on the banks
  { set: 'sz_oldcanal', cam: { z: [1.0, 1.05], x: [640], y: [380], ease: E.io }, bed: [['crowd_loop', .3], ['water_loop', .15]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tE = at(Sh, 'Eugenie', 3); Sh.tK = at(Sh, 'Kings', Sh.dur - 3); },
    draw: (c, lt, u, Sh) => { const L = HEAT(lt), base = lerp(-300, 900, seg(lt, 0, Sh.dur + 2));
      for (let k = 2; k >= 0; k--) { const x = base - k * 520; if (x < -400 || x > 1700) continue; S.szYacht(c, x, 476, k ? .7 : .85, 1, lt + k, { hull: k ? '#2a2a40' : '#1a1a20', pennant: k ? '#c82a2a' : '#2a4a9a', funnel: k ? '#e8e0d0' : '#c8a040' }); }
      const ex = base + 10; VP.figure(c, [ex, 476 - 34 * .85], { k: .3, sy: -.15, a: .2, blur: 2 }, cc => S.person(cc, C.EUGENIE, ex, 476 - 40 * .85, 22, Object.assign(S.idle(lt, 0), { face: 1, shN: lt > Sh.tE ? 140 + 20 * Math.sin(lt * 6) : 30, elN: 20 }), { blink: S.blinkAt(lt, 0), smile: 1, look: [.3, .2], time: lt }, L));
      [[90, C.EGMAN, 0], [230, C.GUESTW, 1], [380, C.FELLAH2, 2], [880, C.GUEST, 3], [1020, C.EGWOMAN, 4], [1170, C.FELLAH, 5]].forEach(([x, ch, k]) => { const wv = Math.sin(lt * 5 + k * 1.7); S.contact(c, x, 670, 18, .35); VP.figure(c, [x, 670], { k: .5, sy: -.2, a: .3, blur: 3 }, cc => S.person(cc, ch, x, 670, 34, Object.assign(S.idle(lt, k), { face: k % 2 ? -1 : 1, shN: 120 + 40 * wv, elN: 20, shF: k % 3 === 0 ? 140 - 30 * wv : 20, elF: 20 }), { blink: S.blinkAt(lt, k), smile: 1, look: [0, -.4], time: lt }, L)); });
      for (let k = 0; k < 30; k++) { const r = S.rng(k + 5600), q = (lt * .5 + r()) % 1; c.fillStyle = ['#c82a2a', '#2a4a9a', '#e8b030', '#f0e8d8'][k % 4]; c.save(); c.translate(r() * 1280, q * 720); c.rotate(lt * 3 + k); c.fillRect(-3, -2, 6, 4); c.restore(); } },
    over: [(c, lt) => K.dateTag(c, '17 NOV 1869', lt, { at: .4 }), (c, lt, u, Sh) => K.card(c, 'EMPRESS EUGÉNIE · THE AIGLE', lt, { at: Sh.tE + .3, x: 760, y: 200, px: 48, rot: -2 })],
    sfx: [[.2, 'crowd_loop', .3], [.5, 'horn', .45], ['Eugenie', 'cheer', .45], ['Kings', 'horn', .35]] },

  // 5.06 MED: night; fireworks over the canal; a banquet tent full of guests; the new opera house glowing
  { set: 'sz_nightcamp', cam: { z: [1.0, 1.08], x: [640], y: [360, 380], ease: E.io }, bed: [['crowd_loop', .2], ['waltz', .2]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tP = at(Sh, 'expensive', 3); Sh.tO = at(Sh, 'opera house', Sh.dur - 2.2); },
    draw: (c, lt, u, Sh) => { const L = NIGHT(lt);
      S.szFireworks(c, lt, 6, [100, 40, 1080, 220]);
      const oq = seg(lt, Sh.tO - .3, Sh.tO + .6); if (oq > 0) { c.save(); c.globalAlpha = oq; c.fillStyle = '#e8dcc0'; c.fillRect(940, 300, 260, 140); c.beginPath(); c.arc(1070, 300, 70, Math.PI, TAU); c.fill(); for (let k = 0; k < 6; k++) { c.fillStyle = '#ffd890'; c.fillRect(956 + k * 40, 340, 18, 50); } VP.glow(c, 1070, 360, 220, '#ffd890', .4); c.restore(); }
      [[420, C.GUEST, 0], [520, C.GUESTW, 1], [700, C.ISMAIL, 2], [820, C.GUESTW, 3]].forEach(([x, ch, k]) => { S.contact(c, x, 660, 18, .4); VP.figure(c, [x, 660], { k: .5, sy: -.2, a: .3, blur: 3 }, cc => S.person(cc, ch, x, 660, 34, Object.assign(S.idle(lt, k), { face: k < 2 ? 1 : -1, shN: k === 2 ? 130 : 50, elN: 40, holdN: k === 2 ? null : wr => { cc.fillStyle = S.rgba('#f0e8c0', .8); cc.fillRect(wr[0] - 3, wr[1] - 14, 6, 12); } }), { blink: S.blinkAt(lt, k), smile: 1, look: [0, -.6], time: lt }, L)); }); },
    over: [(c, lt, u, Sh) => K.card(c, 'ISMAIL\'S PARTY', lt, { at: .8, x: 600, y: 840, px: 52, rot: -2 }), (c, lt, u, Sh) => K.badge(c, 'NEW CAIRO OPERA HOUSE · 1869', lt, { at: Sh.tO + .3 })],
    sfx: [[.4, 'firework', .45], [1.9, 'firework', .4], [3.3, 'firework', .4], ['expensive', 'coins', .3], ['opera house', 'swell', .35]] },
];
VP.build(); K.boot();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><title>SZ act 6 - who owns the ditch</title>
<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/vp/engine.js"></script><script src="../../../../shared/vp/cast.js"></script><script src="../../../../shared/vp/scenes.js"></script><script src="../../../../shared/vp/spain.js"></script>
<script src="../../../../shared/kit.js"></script><script src="../../../../shared/vp.js"></script>
<script src="../../../../spain-1-al-andalus/production/es1_sets.js"></script><script src="../../../../spain-1-al-andalus/production/es1_sets_act1.js"></script><script src="../../../../spain-1-al-andalus/production/es1_cast.js"></script>
<script src="../../../../spain-3-civil-war/production/es3_cast.js"></script>
<script src="../../../../japan-comeback/production/jp_cast.js"></script><script src="../../../../japan-comeback/production/jp_sets.js"></script>
<script src="../../sz_sets.js"></script><script src="../../sz_cast.js"></script><script src="../../sz_props.js"></script><script src="../../sz_sets2.js"></script>
<script src="timing.js"></script>
<script>
const K = KIT, E = K.E, Z = S.SZ, C = S.SZC, H1 = S.ES1H, TAU = Math.PI * 2;
const at = VP.at, seg = K.seg, lerp = K.lerp;
{ const T = window.TIMING, L = T.shots[T.shots.length - 1]; T.shots.push({ i: T.shots.length + 1, start: L.end, end: L.end + 4.8, vo_start: L.end, vo_end: L.end, text: '' }); T.dur = L.end + 4.8; }
const SUN = lt => VP.light('studio', lt, { swing: 3, set: { L: [.6, -.9], amb: '#6a5a4a', ambA: .2, rim: '#fff0d0', rimA: .8, tint: '#ffe8c0', tintA: .08 } });
const DUSK = lt => VP.light('studio', lt, { swing: 3, set: { L: [-.7, -.6], amb: '#4a3a5a', ambA: .3, rim: '#ffc890', rimA: .9, tint: '#ffb070', tintA: .14 } });
const shimmer = (c, lt, y0, y1) => { for (let k = 0; k < 18; k++) { const r = S.rng(k + 50), y = y0 + r() * (y1 - y0); c.fillStyle = S.rgba('#fff4dc', .05); c.fillRect(0, y + Math.sin(lt * 3 + k) * 2, 1280, 2); } };
// route on the parchment map: the long way round Africa, and the Suez shortcut
const LONG = [[4, 51.8], [-6, 47], [-11, 40], [-18, 28], [-19, 16], [-12, 5], [4, 0], [10, -14], [14, -30], [19, -37.5], [28, -36], [38, -26], [44, -14], [52, 0], [56, 12], [62, 17], [72, 15], [80, 6], [95, 4], [104, 1.3]];
const HEAT = lt => VP.light('studio', lt, { swing: 2, set: { L: [.2, -1], amb: '#7a5a3a', ambA: .15, rim: '#fff4d8', rimA: .9, tint: '#ffe8b0', tintA: .1 } });
const ROOM = lt => VP.light('studio', lt, { swing: 3, set: { L: [.5, -.8], amb: '#3a2a1a', ambA: .3, rim: '#ffe0b0', rimA: .8, tint: '#ffd8a0', tintA: .1 } });
const GREYL = lt => VP.light('studio', lt, { swing: 3, set: { L: [.6, -.9], amb: '#4a4a52', ambA: .3, rim: '#e0d8d0', rimA: .5, tint: '#c8c4c0', tintA: .1 } });
const crew = (c, list, lt, L, y, uu, look = [0, 0]) => list.forEach(([x, ch, k, pose, yy, u2]) => { const Y = yy ?? y, U = u2 ?? uu; S.contact(c, x, Y, U * .5, .35); VP.figure(c, [x, Y], { k: .6, sy: -.2, a: .3, blur: 3 }, cc => S.person(cc, ch, x, Y, U, pose, { blink: S.blinkAt(lt, k), look, time: lt }, L)); });
const desk = (c, x, y, w) => { c.fillStyle = 'rgba(20,10,5,.35)'; c.beginPath(); c.ellipse(x, y + 100, w * .6, 16, 0, 0, TAU); c.fill(); c.fillStyle = '#4a2a16'; c.fillRect(x - w / 2, y, w, 100); c.fillStyle = '#6a3e22'; c.fillRect(x - w / 2 - 10, y - 10, w + 20, 14); c.strokeStyle = '#2a160a'; c.lineWidth = 2; c.strokeRect(x - w / 2 + 20, y + 20, w / 2 - 30, 60); c.strokeRect(x + 10, y + 20, w / 2 - 30, 60); };
const letters = (c, x, y, n) => { for (let k = 0; k < n; k++) { const r = S.rng(6100 + k); c.save(); c.translate(x + (r() - .5) * 60, y - k * 4); c.rotate((r() - .5) * .4); c.fillStyle = k % 3 ? '#efe2c0' : '#e8d8b0'; c.fillRect(-26, -3, 52, 6); c.fillStyle = '#a82020'; if (k % 4 === 0) { c.beginPath(); c.arc(10, -1, 3, 0, TAU); c.fill(); } c.restore(); } };
const sea = c => { const g = c.createLinearGradient(0, 0, 0, 720); g.addColorStop(0, '#8aa8c8'); g.addColorStop(.45, '#d8d4c8'); g.addColorStop(.46, '#4a7a9a'); g.addColorStop(1, '#1e3a52'); c.fillStyle = g; c.fillRect(0, 0, 1280, 720); for (let k = 0; k < 60; k++) { const r = S.rng(6200 + k); c.fillStyle = S.rgba('#ffffff', .15); c.fillRect(r() * 1280, 340 + r() * 380, 20 + r() * 40, 2); } };
const warship = (c, x, y, s, dir) => { c.save(); c.translate(x, y); c.scale(s * dir, s); c.fillStyle = '#5a6068'; c.beginPath(); c.moveTo(-160, -20); c.lineTo(170, -20); c.lineTo(140, 6); c.lineTo(-150, 6); c.fill(); c.fillStyle = '#6a7078'; c.fillRect(-60, -60, 100, 40); c.fillRect(-30, -96, 40, 36); c.fillRect(-10, -130, 6, 34); c.fillStyle = '#4a5058'; c.fillRect(60, -40, 50, 20); c.fillRect(100, -34, 50, 6); c.fillRect(-120, -40, 40, 20); c.fillRect(-150, -34, 40, 6); c.restore(); };

window.SHOTS = [
  // 6.01 MED: Ismail at a desk; the pile of bank letters grows; a clerk brings one more; he rubs his temples
  { set: 'sz_office', cam: { z: [1.0, 1.15], x: [640], y: [420, 460], ease: E.io }, bed: [['clock_loop', .2]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tB = at(Sh, 'borrowed', 2.5); Sh.tK = at(Sh, 'broke', 6); Sh.tS = at(Sh, 'sold', Sh.dur - 2.4); },
    draw: (c, lt, u, Sh) => { const L = ROOM(lt), n = 4 + Math.floor(seg(lt, Sh.tB - 1, Sh.tS) * 26);
      crew(c, [[640, C.ISMAIL, 0, Object.assign(S.idle(lt, 0), { face: 1, shN: lt > Sh.tK ? 150 : 40, elN: lt > Sh.tK ? 150 : 60, shF: lt > Sh.tK ? 150 : 40, elF: lt > Sh.tK ? 150 : 60 })]], lt, L, 600, 46, [0, .4]);
      desk(c, 640, 520, 420); letters(c, 560, 516, n); letters(c, 720, 516, Math.max(0, n - 8));
      const wk = seg(lt, Sh.tB - .5, Sh.tB + 2); crew(c, [[lerp(1360, 930, E.out(wk)), C.CLERK, 1, Object.assign(wk < 1 ? H1.walk(lt * 1.1) : S.idle(lt, 1), { face: -1, shN: 80, elN: 20, holdN: wr => { c.fillStyle = '#efe2c0'; c.fillRect(wr[0] - 20, wr[1] - 6, 30, 10); } })]], lt, L, 650, 42, [-.6, 0]);
      const st = seg(lt, Sh.tS, Sh.tS + .5); if (st > 0) { c.save(); c.translate(820, 300); c.rotate(.1); c.globalAlpha = st; c.fillStyle = '#efe2c0'; c.fillRect(-90, -50, 180, 100); c.fillStyle = '#3a1a0a'; c.font = '22px Caveat'; c.textAlign = 'center'; c.fillText('176,602 shares', 0, -10); c.fillText('Suez Canal Co.', 0, 20); c.restore(); } },
    over: [(c, lt) => K.dateTag(c, '1875', lt, { at: .4 }), (c, lt, u, Sh) => K.badge(c, 'BORROWED MONEY', lt, { at: Sh.tB }), (c, lt, u, Sh) => K.card(c, 'FOR SALE: EGYPT\'S SHARES', lt, { at: Sh.tS + .3, x: 1400, y: 900, px: 50, rot: -2 })],
    sfx: [[.2, 'clock_loop', .2], ['borrowed', 'paper', .3], ['broke', 'drum', .35], ['sold', 'stamp', .45]] },

  // 6.02 MED: London; Disraeli signs; a banker thumps a heavy chest on the desk; a telegram zips out of the window
  { set: 'sz_office', cam: { z: [1.0, 1.08], x: [640], y: [400, 430], ease: E.io }, bed: [['clock_loop', .15], ['rain_loop', .08]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tD = at(Sh, 'Disraeli', 2.6); Sh.tR = at(Sh, 'Rothschild', Sh.dur - 2); Sh.tM = at(Sh, 'four million', Sh.dur - 3.5); },
    draw: (c, lt, u, Sh) => { const L = GREYL(lt);
      c.fillStyle = S.rgba('#6a7080', .25); c.fillRect(0, 0, 1280, 720);
      crew(c, [[520, C.DISRAELI, 0, Object.assign(S.idle(lt, 0), { face: 1, lean: lt > Sh.tD ? .15 : 0, shN: lt > Sh.tD ? 90 : 30, elN: 70, holdN: wr => { c.strokeStyle = '#1a1a1a'; c.lineWidth = 2; c.beginPath(); c.moveTo(wr[0], wr[1]); c.lineTo(wr[0] + 10, wr[1] - 14); c.stroke(); } })]], lt, L, 600, 44, [.4, .4]);
      desk(c, 640, 520, 420); c.fillStyle = '#efe2c0'; c.fillRect(560, 512, 80, 6);
      const wk = seg(lt, Sh.tM - 2.2, Sh.tM - .1), drop = seg(lt, Sh.tM - .1, Sh.tM + .2);
      crew(c, [[lerp(1360, 860, E.out(wk)), C.BANKER, 1, Object.assign(wk < 1 ? H1.walk(lt * 1.1) : S.idle(lt, 1), { face: -1, shN: wk < 1 ? 80 : 40, elN: 60, shF: wk < 1 ? 80 : 40, elF: 60 })]], lt, L, 650, 44, [-.6, .2]);
      if (wk > 0) { const cx = drop > 0 ? 760 : lerp(1300, 820, E.out(wk)), cy = drop > 0 ? lerp(470, 498, E.inn(drop)) : 470; c.fillStyle = '#5a3a20'; c.fillRect(cx - 40, cy - 30, 80, 46); c.fillStyle = '#c8a040'; c.fillRect(cx - 40, cy - 16, 80, 5); c.fillRect(cx - 5, cy - 30, 10, 46); c.fillStyle = '#3a2410'; c.fillRect(cx - 40, cy - 34, 80, 8); }
      const tq = seg(lt, Sh.tR + .3, Sh.tR + 1.4); if (tq > 0 && tq < 1) { c.save(); c.translate(lerp(620, 700, tq), lerp(470, 140, E.inn(tq))); c.rotate(tq * 6); c.scale(1 - tq * .7, 1 - tq * .7); c.fillStyle = '#f4e8b0'; c.fillRect(-30, -18, 60, 36); c.fillStyle = '#3a2a1a'; c.font = 'bold 10px Oswald'; c.textAlign = 'center'; c.fillText('TELEGRAM', 0, -4); c.restore(); } },
    over: [(c, lt) => K.dateTag(c, 'LONDON · NOV 1875', lt, { at: .4 }), (c, lt, u, Sh) => K.card(c, '£4,000,000 · ROTHSCHILD LOAN', lt, { at: Sh.tM + .2, x: 960, y: 180, px: 52, rot: -2 })],
    sfx: [[.2, 'clock_loop', .15], ['Disraeli', 'paper', .3], ['four million', 'thud', .55], ['Rothschild', 'coins', .4], ['Rothschild', 'whoosh', .4]] },

  // 6.03 MED: British redcoats march along the canal bank; Egyptian farmers step aside
  { set: 'sz_oldcanal', cam: { z: [1.0, 1.05], x: [640], y: [380], ease: E.io }, bed: [['drum_loop', .3], ['march', .3]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tN = at(Sh, 'no longer', Sh.dur - 2.6); },
    draw: (c, lt, u, Sh) => { const L = HEAT(lt);
      [[900, C.FELLAH, 0], [1080, C.EGWOMAN, 1]].forEach(([x, ch, k]) => { const st = seg(lt, 1 + k * .4, 2.4 + k * .4), y = lerp(670, 600, E.io(st)); crew(c, [[x + 30 * st, ch, k + 5, Object.assign(st > 0 && st < 1 ? H1.walk(lt * 1.1 + k) : S.idle(lt, k), { face: st < 1 && st > 0 ? 1 : -1, shN: 30, elN: 60 })]], lt, L, y, lerp(34, 30, st), [-.6, 0]); });
      for (let k = 0; k < 5; k++) { const x = lerp(-120 - k * 110, 1500 - k * 110, seg(lt, 0, Sh.dur + 2)); crew(c, [[x, C.REDCOAT, k, Object.assign(H1.walk(lt * 1.3), { face: 1, shF: 160, elF: 10, holdF: wr => { c.strokeStyle = '#3a2a1a'; c.lineWidth = 3; c.beginPath(); c.moveTo(wr[0], wr[1] + 30); c.lineTo(wr[0], wr[1] - 60); c.stroke(); } })]], lt, L, 680, 34, [.6, 0]); } },
    over: [(c, lt) => K.dateTag(c, '1882 · BRITAIN OCCUPIES EGYPT', lt, { at: .4 }), (c, lt, u, Sh) => K.card(c, 'DUG BY EGYPT. RUN BY BRITAIN.', lt, { at: Sh.tN + .2, x: 960, y: 190, px: 52, rot: -2 })],
    sfx: [[.2, 'march', .35], [.4, 'drum_loop', .3]] },

  // 6.04 MED: Nasser at a microphone before a huge crowd; cut: warships off the coast turn back
  { set: 'sz_cairo', cam: (lt, u, Sh) => ({ z: [lt < Sh.tI ? lerp(1.0, 1.1, seg(lt, 0, Sh.tI)) : 1.0], x: [640], y: [lt < Sh.tI ? 380 : 360] }), bed: [['crowd_loop', .4]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tT = at(Sh, 'took the canal', 3); Sh.tI = at(Sh, 'invaded', 6); Sh.tP = at(Sh, 'pulled out', Sh.dur - 1.6); },
    draw: (c, lt, u, Sh) => {
      if (lt >= Sh.tI) { sea(c); const L = GREYL(lt), turn = seg(lt, Sh.tP - 1.2, Sh.tP + .4);
        [[300, 420, .6], [700, 440, .8], [1080, 410, .5]].forEach(([x, y, s], k) => { const dir = turn > .5 ? -1 : 1, sx = Math.abs(Math.cos(turn * Math.PI)); warship(c, x + (turn > .5 ? -1 : 1) * (lt - Sh.tI) * 6, y, s * Math.max(.15, sx), dir); });
        return; }
      const L = HEAT(lt), cheer = lt > Sh.tT;
      crew(c, [[640, C.NASSER, 0, Object.assign(S.idle(lt, 0), { face: 1, shN: cheer ? 150 + 10 * Math.sin(lt * 4) : 60, elN: cheer ? 20 : 70 })]], lt, L, 326, 32, [0, .3]);
      c.fillStyle = '#2a2a2a'; c.fillRect(616, 270, 4, 40); c.beginPath(); c.arc(618, 268, 6, 0, TAU); c.fill(); c.fillRect(664, 270, 4, 40); c.beginPath(); c.arc(666, 268, 6, 0, TAU); c.fill();
      // crowd: rows of people from the back to the front
      const CR = [C.EGMAN, C.EGMAN2, C.EGWOMAN, C.FELLAH, C.FELLAH2, C.FELLAH3];
      for (let r = 0; r < 2; r++) for (let k = 0; k < 8; k++) { const x = 80 + k * 160 + (r % 2) * 80, y = 580 + r * 90, ch = CR[(k + r * 2) % 6], up = cheer && Math.sin(lt * 5 + k + r) > 0; VP.figure(c, [x, y], { k: .4, sy: -.2, a: .25, blur: 2 }, cc => S.person(cc, ch, x, y, 28 + r * 5, Object.assign(S.idle(lt, k + r), { face: -1, shN: up ? 160 : 40, elN: 20, shF: up ? 150 : 30, elF: 30 }), { blink: S.blinkAt(lt, k), smile: cheer ? 1 : 0, look: [0, -.8], time: lt }, L)); } },
    over: [(c, lt) => K.dateTag(c, 'NASSER · 26 JULY 1956', lt, { at: .4 }), (c, lt, u, Sh) => K.card(c, 'NATIONALISED', lt, { at: Sh.tT + .3, x: 960, y: 170, px: 64, rot: -3, until: Sh.tI }), (c, lt, u, Sh) => K.badge(c, 'BRITAIN · FRANCE · ISRAEL INVADE', lt, { at: Sh.tI + .2 }), (c, lt, u, Sh) => K.card(c, 'USA + USSR: GET OUT', lt, { at: Sh.tP - .8, x: 960, y: 180, px: 56, rot: 2 })],
    sfx: [[.2, 'crowd_loop', .4], ['took the canal', 'cheer', .55], ['invaded', 'horn', .45], ['pulled out', 'whoosh', .4]] },

  // 6.05 MED: a modern container ship glides past desert banks; a pilot boat; a camel on the dune blinks
  { set: 'sz_canal', cam: { z: [1.0, 1.05], x: [640], y: [380], ease: E.io }, bed: [['hum_loop', .25], ['wind_loop', .15]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tO = at(Sh, 'one in eight', 2.5); Sh.tB = at(Sh, 'billions', Sh.dur - 2); },
    draw: (c, lt, u, Sh) => { const L = HEAT(lt), q = seg(lt, 0, Sh.dur + 2), sx = lerp(1700, -500, q);
      S.szShip(c, sx, 412 + (sx / 1280) * 110, .62, .09, { name: 'MAERSK' });
      const px = sx - 520; c.save(); c.translate(px, 430 + (px / 1280) * 115); c.fillStyle = '#e8e0d0'; c.beginPath(); c.moveTo(-30, -10); c.lineTo(34, -10); c.lineTo(26, 4); c.lineTo(-26, 4); c.fill(); c.fillStyle = '#c82a2a'; c.fillRect(-10, -24, 20, 14); c.restore();
      S.szCamel(c, 1000, 690, .9, -1, 0, '#b8884e'); const bl = (lt % 3.2) < .15; if (bl) { c.fillStyle = '#b8884e'; c.fillRect(1000 - 98 * .9 - 4, 690 - 146 * .9 - 4, 8, 8); } },
    over: [(c, lt, u, Sh) => K.card(c, '~12% OF WORLD TRADE', lt, { at: Sh.tO + .3, x: 960, y: 190, px: 58, rot: -2 }), (c, lt, u, Sh) => K.badge(c, 'BILLIONS OF DOLLARS A YEAR FOR EGYPT', lt, { at: Sh.tB })],
    sfx: [[.2, 'hum_loop', .25], [.6, 'horn', .35], ['billions', 'coins', .35]] },

  // 6.06 WIDE: sunset; the granite stone on the canal bank today; a giant ship passes behind; its shadow slides over the stone
  { set: 'sz_canal', cam: { z: [1.1, 1.0], x: [520, 640], y: [440, 380], ease: E.io }, bed: [['wind_loop', .3], ['swell', .2]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tS = at(Sh, 'one ship stuck', Sh.dur - 3); },
    draw: (c, lt, u, Sh) => { const L = DUSK(lt); c.fillStyle = S.rgba('#a04020', .32); c.fillRect(0, 0, 1280, 720); VP.glow(c, 1040, 160, 360, '#ffa060', .35);
      const q = seg(lt, 0, Sh.dur), sx = lerp(1700, -400, q); S.szShip(c, sx, 410 + (sx / 1280) * 110, .7, .09, {});
      S.szStone(c, 250, 650, .8, .05, lt, {});
      const sh = 1 - Math.min(1, Math.abs(sx - 600) / 500); c.fillStyle = S.rgba('#1a0a10', .45 * sh); c.fillRect(0, 560, 1280, 160);
      const f = seg(lt, Sh.dur - 1.6, Sh.dur); c.fillStyle = S.rgba('#000000', f); c.fillRect(0, 0, 1280, 720); },
    over: [(c, lt, u, Sh) => K.card(c, '3,000 YEARS · ONE DITCH', lt, { at: 2, x: 960, y: 170, px: 56, rot: -2, until: Sh.tS }), (c, lt, u, Sh) => K.card(c, 'ONE SHIP CAN STOP THE WORLD', lt, { at: Sh.tS + .3, x: 960, y: 170, px: 54, rot: 2, until: Sh.dur - .8 })],
    sfx: [[.2, 'wind_loop', .3], [1.5, 'horn', .3], ['stuck sideways', 'thud', .35], [-2, 'swell', .4]] },
];
VP.build(); K.boot();
</script></body></html>

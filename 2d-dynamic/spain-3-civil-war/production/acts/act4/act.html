<script>
const K = KIT, E = K.E, X = S.SPX, CH = S.SPAIN, C = S.ES3, H1 = S.ES1H, TAU = Math.PI * 2;

const night = (c, a, col = '30,40,100') => { c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = `rgba(${col},${a})`; c.fillRect(0, 0, 1280, 720); c.restore(); };
// the running device: a Spanish flag on the wall with a crack through it; size and crack width animate
const flag = (c, x, y, w, h, crack, lt, o = {}) => { const cols = o.cols || ['#b8202a', '#e8b820', '#b8202a'], bands = o.bands || [.25, .5, .25];
  c.save(); c.translate(x, y); let yy = -h / 2; bands.forEach((b, i) => { c.fillStyle = cols[i]; c.fillRect(-w / 2, yy, w, b * h + 1); yy += b * h; });
  S.dabs(c, { x: -w / 2, y: -h / 2, w, h, n: 80, cols: ['#ffffff', '#000000'], r0: 4, r1: 16, a0: .03, a1: .08, seed: 7 });
  for (let i = 0; i < 4; i++) { const xx = -w / 2 + (i + .5) * w / 4 + Math.sin(lt * .8 + i) * 4; const gr = c.createLinearGradient(xx - 30, 0, xx + 30, 0); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(.5, 'rgba(0,0,0,.12)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = gr; c.fillRect(xx - 30, -h / 2, 60, h); }
  if (crack > 0) { const pts = []; for (let i = 0; i <= 12; i++) { const r = S.rng(i + 31)(); pts.push([-w * .05 + (r - .5) * w * .12 + i * w * .01, -h / 2 + i * h / 12]); }
    c.fillStyle = '#120a08'; c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0] - crack * (.6 + .4 * Math.sin(i)), p[1]) : c.moveTo(p[0] - crack, p[1])); for (let i = pts.length - 1; i >= 0; i--) c.lineTo(pts[i][0] + crack * (.6 + .4 * Math.cos(i)), pts[i][1]); c.fill();
    c.strokeStyle = S.rgba('#ffe0b0', .35); c.lineWidth = 2; c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0] + crack, p[1]) : c.moveTo(p[0] + crack, p[1])); c.stroke(); }

const biplane = (c, x, y, s, lt, prop = 1) => { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = '#e8e0cc'; c.beginPath(); c.moveTo(-90, 0); c.quadraticCurveTo(-60, -16, 40, -14); c.lineTo(80, -6); c.lineTo(80, 6); c.lineTo(-60, 8); c.fill(); c.fillStyle = '#c8b898'; c.fillRect(-20, -40, 60, 8); c.fillRect(-26, 6, 70, 8); c.strokeStyle = '#5a4a3a'; c.lineWidth = 2; for (const xx of [-10, 30]) { c.beginPath(); c.moveTo(xx, -32); c.lineTo(xx, 6); c.stroke(); }

  c.fillStyle = '#2a2a2a'; c.beginPath(); c.arc(0, 22, 7, 0, TAU); c.fill(); c.strokeStyle = '#2a2a2a'; c.beginPath(); c.moveTo(0, 14); c.lineTo(0, 22); c.stroke();
  c.fillStyle = S.rgba('#888888', .5); c.beginPath(); c.ellipse(82, 0, 3, 22 * Math.abs(Math.sin(lt * 40 * prop + .5)) + 2, 0, 0, TAU); c.fill(); c.restore(); };
const trimotor = (c, x, y, s, lt) => { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = '#5a5a52'; c.beginPath(); c.ellipse(0, 0, 90, 14, 0, 0, TAU); c.fill(); c.beginPath(); c.moveTo(-20, -6); c.lineTo(30, -70); c.lineTo(50, -70); c.lineTo(20, 0); c.lineTo(50, 70); c.lineTo(30, 70); c.lineTo(-20, 6); c.fill(); c.beginPath(); c.moveTo(-80, 0); c.lineTo(-100, -26); c.lineTo(-90, 0); c.lineTo(-100, 26); c.fill();
  c.fillStyle = S.rgba('#ffffff', .15); c.beginPath(); c.ellipse(10, -4, 70, 4, 0, 0, TAU); c.fill(); for (const [px, py] of [[92, 0], [36, -40], [36, 40]]) { c.fillStyle = '#3a3a34'; c.beginPath(); c.arc(px - 6, py, 7, 0, TAU); c.fill(); c.fillStyle = S.rgba('#c8c8c8', .45); c.beginPath(); c.ellipse(px, py, 2, 16 * Math.abs(Math.sin(lt * 30 + px)) + 2, 0, 0, TAU); c.fill(); } c.restore(); };
const crate = (c, x, y, open, lt) => { X.wood(c, x - 50, y - 40, 100, 40, '#8a6a3a', Math.round(x)); c.strokeStyle = '#4a3418'; c.lineWidth = 2; c.strokeRect(x - 50, y - 40, 100, 40); for (let k = 0; k < 5; k++) { c.strokeStyle = '#3a2a1a'; c.lineWidth = 3; c.beginPath(); c.moveTo(x - 40 + k * 18, y - 38); c.lineTo(x - 30 + k * 18, y - 60); c.stroke(); } c.save(); c.translate(x - 50, y - 40); c.rotate(-1.2 * open); X.wood(c, 0, -8, 100, 8, '#9a7a4a', 9); c.restore(); };

const plane = (c, x, y, s, lt = 0) => { c.save(); c.translate(x, y); c.scale(-s, s); c.fillStyle = '#3a3a36'; c.beginPath(); c.moveTo(46, -2); c.quadraticCurveTo(40, -9, 10, -8); c.lineTo(-38, -4); c.lineTo(-44, -18); c.lineTo(-50, -18); c.lineTo(-48, 2); c.lineTo(10, 5); c.quadraticCurveTo(40, 5, 46, -2); c.fill(); c.fillStyle = '#2a2a26'; c.fillRect(-10, -2, 34, 5); c.fillRect(0, -1, 14, 9); c.fillStyle = S.rgba('#c8d0d8', .6); c.fillRect(26, -7, 10, 3); c.fillStyle = S.rgba('#888888', .45); c.beginPath(); c.ellipse(48, -2, 2, 10 * Math.abs(Math.sin(lt * 40)) + 2, 0, 0, TAU); c.fill(); c.restore(); };

        c.fillStyle = '#3a4a3a'; c.beginPath(); c.rect(x, 450, 290, 140); for (let wi = 0; wi < 4; wi++) c.rect(x + 20 + wi * 68 + 46, 470, -46, 50); c.fill('evenodd'); c.fillStyle = '#2a3a2a'; c.fillRect(x - 6, 444, 302, 12); c.fillStyle = S.rgba('#ffe0b0', .25); c.fillRect(x, 456, 290, 3); c.fillStyle = '#d8b040'; c.fillRect(x, 540, 290, 4);
        for (const dx of [40, 250]) { c.fillStyle = '#1a1a1a'; c.beginPath(); c.arc(x + dx, 598, 16, 0, TAU); c.fill(); c.strokeStyle = '#5a5a5a'; c.lineWidth = 2; c.beginPath(); c.moveTo(x + dx, 598); c.lineTo(x + dx + 12 * Math.cos(lt * 20), 598 + 12 * Math.sin(lt * 20)); c.stroke(); } }

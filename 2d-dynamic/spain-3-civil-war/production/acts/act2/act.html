<script>
const K = KIT, E = K.E, X = S.SPX, CH = S.SPAIN, C = S.ES3, H1 = S.ES1H, TAU = Math.PI * 2;
const at = VP.at, seg = K.seg, lerp = K.lerp, pulse = H1.pulse, walk = H1.walk;
const night = (c, a, col = '30,40,100') => { c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = `rgba(${col},${a})`; c.fillRect(0, 0, 1280, 720); c.restore(); };
// the running device: a Spanish flag on the wall with a crack through it; size and crack width animate
const flag = (c, x, y, w, h, crack, lt, o = {}) => { const cols = o.cols || ['#b8202a', '#e8b820', '#b8202a'], bands = o.bands || [.25, .5, .25];
  c.save(); c.translate(x, y); let yy = -h / 2; bands.forEach((b, i) => { c.fillStyle = cols[i]; c.fillRect(-w / 2, yy, w, b * h + 1); yy += b * h; });
  S.dabs(c, { x: -w / 2, y: -h / 2, w, h, n: 80, cols: ['#ffffff', '#000000'], r0: 4, r1: 16, a0: .03, a1: .08, seed: 7 });
  for (let i = 0; i < 4; i++) { const xx = -w / 2 + (i + .5) * w / 4 + Math.sin(lt * .8 + i) * 4; const gr = c.createLinearGradient(xx - 30, 0, xx + 30, 0); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(.5, 'rgba(0,0,0,.12)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = gr; c.fillRect(xx - 30, -h / 2, 60, h); }
  if (crack > 0) { const pts = []; for (let i = 0; i <= 12; i++) { const r = S.rng(i + 31)(); pts.push([-w * .05 + (r - .5) * w * .12 + i * w * .01, -h / 2 + i * h / 12]); }
    c.fillStyle = '#120a08'; c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0] - crack * (.6 + .4 * Math.sin(i)), p[1]) : c.moveTo(p[0] - crack, p[1])); for (let i = pts.length - 1; i >= 0; i--) c.lineTo(pts[i][0] + crack * (.6 + .4 * Math.cos(i)), pts[i][1]); c.fill();
    c.strokeStyle = S.rgba('#ffe0b0', .35); c.lineWidth = 2; c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0] + crack, p[1]) : c.moveTo(p[0] + crack, p[1])); c.stroke(); }
  c.strokeStyle = S.rgba('#000000', .5); c.lineWidth = 3; c.strokeRect(-w / 2, -h / 2, w, h); c.restore(); };
const muzzle = (c, x, y, lt, t0) => { const q = seg(lt, t0, t0 + .15); if (q > 0 && q < 1) { VP.glow(c, x, y, 120, '#fff0b0', 1 - q); c.fillStyle = `rgba(255,240,180,${1 - q})`; c.beginPath(); c.moveTo(x, y); for (let k = 0; k < 8; k++) { const a = k / 8 * TAU, r = k % 2 ? 10 : 30; c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } c.fill(); } };

const paper = (cc, wr, w = 34, h = 24, rot = -.2) => { cc.save(); cc.translate(wr[0], wr[1]); cc.rotate(rot); cc.fillStyle = '#f0e8d4'; cc.fillRect(-4, -h, w, h); cc.fillStyle = S.rgba('#3a3a3a', .5); for (let k = 0; k < 4; k++) cc.fillRect(0, -h + 5 + k * 5, w - 10, 1.5); cc.restore(); };
const truck = (c, x, y, s, lt, on) => { c.fillStyle = '#1e2430'; c.fillRect(x - 120 * s, y - 90 * s, 150 * s, 80 * s); c.fillStyle = '#2a3040'; c.beginPath(); c.moveTo(x + 30 * s, y - 70 * s); c.lineTo(x + 80 * s, y - 70 * s); c.lineTo(x + 100 * s, y - 40 * s); c.lineTo(x + 100 * s, y - 10 * s); c.lineTo(x + 30 * s, y - 10 * s); c.fill(); c.fillStyle = '#4a5a6a'; c.fillRect(x + 40 * s, y - 64 * s, 34 * s, 22 * s);
  for (const dx of [-80, 60]) { c.fillStyle = '#0a0a0a'; c.beginPath(); c.arc(x + dx * s, y - 8 * s, 18 * s, 0, TAU); c.fill(); c.fillStyle = '#4a4a4a'; c.beginPath(); c.arc(x + dx * s, y - 8 * s, 6 * s, 0, TAU); c.fill(); }
  if (on) { c.save(); c.globalCompositeOperation = 'lighter'; const g = c.createLinearGradient(x + 100 * s, 0, x + 500 * s, 0); g.addColorStop(0, 'rgba(255,240,190,.5)'); g.addColorStop(1, 'rgba(255,240,190,0)'); c.fillStyle = g; c.beginPath(); c.moveTo(x + 100 * s, y - 34 * s); c.lineTo(x + 520 * s, y - 80 * s); c.lineTo(x + 520 * s, y + 40 * s); c.lineTo(x + 100 * s, y - 22 * s); c.fill(); c.restore(); VP.glow(c, x + 100 * s, y - 28 * s, 30 * s, '#fff0c0', .9); } };
const dyn = (cc, wr, lt, k) => { cc.save(); cc.translate(wr[0], wr[1]); cc.rotate(-.5); cc.fillStyle = '#b8302a'; cc.fillRect(-3, -18, 7, 22); cc.strokeStyle = '#3a2a1a'; cc.lineWidth = 1.2; cc.beginPath(); cc.moveTo(0, -18); cc.quadraticCurveTo(4, -26, 2, -30); cc.stroke(); cc.restore(); };

window.SHOTS = [
  // 2.01 MED: the new Cortes votes the constitution; a woman casts her first ballot in the foreground
  { set: 'cortes', cam: { z: [1.25, 1.35], x: [640, 680], y: [440, 450], ease: E.io }, bed: [['crowd_loop', .12]],
    init: Sh => { Sh.tC = at(Sh, 'constitution', 2); Sh.tS = at(Sh, 'separated', 4); Sh.tW = at(Sh, 'women', 6); Sh.tL = at(Sh, 'land', Sh.dur - 2); Sh.dur = Sh.end - Sh.start; },
    draw: (c, lt, u, Sh) => {

  // 2.02 MED: Azaña signs law after law; an officer reads the news, angry; a priest at the window
  { set: 'office', cam: { z: [1.15, 1.25], x: [640, 640], y: [400, 410], ease: E.io }, bed: [['office_loop', .12]],

      const oq = E.out(seg(lt, Sh.tA - .2, Sh.tA + .6)); if (oq > 0) { const x = lerp(1340, 1080, oq); VP.figure(c, [x, 680], sh, cc => S.person(cc, C.OFFICER, x, 680, 44, Object.assign(S.idle(lt, 4), { face: -1, shN: 35, elN: 100, shF: 35, elF: 100, holdN: wr => paper(cc, wr, 60, 40, .1) }), { blink: S.blinkAt(lt, 5), angry: .8 * seg(lt, Sh.tA + .6, Sh.tA + 1.2), look: [-.2, .5], time: lt }, L)); }

    over: [(c, lt) => coinFlag(c, lt, 8, REP), (c, lt, u, Sh) => K.card(c, 'MANUEL AZAÑA', lt, { at: .8, x: 1520, y: 180, px: 50, rot: 3, until: Sh.tK }), (c, lt, u, Sh) => K.card(c, 'FEWER OFFICERS', lt, { at: Sh.tA + .3, x: 1540, y: 340, px: 40, rot: -2 }), (c, lt, u, Sh) => K.card(c, 'RELIGIOUS SCHOOLS SHUT', lt, { at: Sh.tR + .3, x: 400, y: 340, px: 40, rot: 2 }), (c, lt, u, Sh) => K.card(c, 'CATALONIA SELF-RULE', lt, { at: Sh.tK + .3, x: 960, y: 160, px: 46 })],

  { set: 'parish', cam: (lt, u, Sh) => ({ z: [lerp(1.1, 1.35, E.io(seg(lt, 0, Sh.dur)))], x: [640], y: [lerp(380, 450, E.io(seg(lt, 0, Sh.dur)))], shake: lt > Sh.tS ? 1.2 : .2 }), bed: [['fire_loop', .3], ['night_loop', .1]],

      VP.glow(c, 640, 380, 520, '#ff7a30', (.25 + .1 * f) * burn);
      H1.fire(c, 640, 520, 1.6 * burn, lt, 1); H1.fire(c, 500, 400, .9 * burn, lt, 2); H1.fire(c, 760, 400, .9 * burn, lt, 3); H1.fire(c, 640, 300, .7 * burn, lt, 4);
      H1.smoke(c, 640, 220, 1.6, lt, '40,30,30'); H1.smoke(c, 880, 120, 1.2, lt + 3, '40,30,30');
      const fight = seg(lt, Sh.tS - .6, Sh.tS);
      if (fight < 1) { c.save(); c.globalAlpha = 1 - fight; for (let k = 0; k < 5; k++) { const x = [120, 300, 880, 1040, 1180][k], y = 690 - (k % 2) * 16; VP.figure(c, [x, y], sh, cc => S.person(cc, [C.WOMAN, C.WORKER, C.LABOURER2, C.PRIEST, C.WORKER][k], x, y, 34, Object.assign(S.idle(lt, k), { face: k < 2 ? 1 : -1, shN: k === 3 ? 90 : 20, elN: 60 }), { blink: S.blinkAt(lt, k), worry: .8, look: [k < 2 ? .5 : -.5, -.5], time: lt }, L)); } c.restore(); }
      if (fight > 0) { c.save(); c.globalAlpha = fight; for (let k = 0; k < 6; k++) { const left = k % 2 === 0, x = 300 + Math.floor(k / 2) * 280 + (left ? 0 : 120), y = 690 - (k % 3) * 12, sw = Math.sin(lt * 7 + k * 1.3); VP.figure(c, [x, y], sh, cc => S.person(cc, left ? [C.WORKER, C.MILITIA, C.MINER2][k / 2] : [C.FALANGIST, C.FALANGIST2, C.FALANGIST][(k - 1) / 2], x, y, 36, Object.assign(S.idle(lt, k), { face: left ? 1 : -1, lean: 8 + 6 * sw, shN: 90 + 40 * sw, elN: 20 + 40 * Math.max(0, -sw), shF: 60, elF: 100 }), { blink: S.blinkAt(lt, k), angry: 1, look: [left ? .8 : -.8, 0], time: lt }, L)); } c.restore(); }
      VP.motes(c, lt, 300, 100, 700, 500, { n: 50, a: .5, col: '#ffb070' });
    },
    over: [(c, lt) => coinFlag(c, lt, 10, REP), (c, lt, u, Sh) => K.card(c, 'TOO SLOW', lt, { at: Sh.tL + .2, x: 360, y: 200, px: 46, rot: -3, until: Sh.tS }), (c, lt, u, Sh) => K.card(c, 'AN ATTACK ON SPAIN', lt, { at: Sh.tL + 2.4, x: 1540, y: 200, px: 42, rot: 3, until: Sh.tS })],
    sfx: [[.1, 'fire_loop', .3], ['burned', 'whoosh', .4], ['strikes', 'hit', .5], ['strikes', 'run_steps', .4], ['normal', 'hit', .4]] },

  // 2.04 WIDE: Asturias 1934: miners rise up; troops march up the valley; Franco studies a map
  { set: 'asturias', cam: (lt, u, Sh) => ({ z: [lerp(1.15, 1.3, E.io(seg(lt, 0, Sh.dur)))], x: [lerp(560, 720, E.io(seg(lt, 0, Sh.dur)))], y: [420] }), bed: [['wind_loop', .2]],
    init: Sh => { Sh.tR = at(Sh, 'right', 1); Sh.tM = at(Sh, 'miners', 3); Sh.tA = at(Sh, 'army', 7); Sh.tF = at(Sh, 'franco', Sh.dur - 2); Sh.dur = Sh.end - Sh.start; },
    draw: (c, lt, u, Sh) => {
      const L = VP.light('studio', lt, { swing: 5, set: { L: [-.5, -1] } }), sh = VP.shadowOf(L, 1.1, .3, .12);

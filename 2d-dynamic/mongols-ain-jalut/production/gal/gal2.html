const NAMES=['mg_steppe','mg_camp','mg_ainjalut','mg_baghdad','mg_bab','mg_island','mg_alley','mg_square','mg_iwan','np_parch','np_berezina','MAP','CAST'];
window.draw=t=>{const c=document.getElementById('c').getContext('2d');c.setTransform(1.5,0,0,1.5,0,0);c.fillStyle='#000';c.fillRect(0,0,1280,720);try{ if(NAMES[t]==='MAP'){S.mgAsia(c,{fill:cc=>S.mgTide(cc,1,[[S.mgPlaces.steppe,0,300],[S.mgPlaces.bukhara,0,250],[S.mgPlaces.baghdad,0,200]])});for(const k in S.mgPlaces)S.mgDot(c,S.mgPlaces[k],k,1,1,16);S.mgPaiza(c,1100,600,1,.2,.5);}
 else if(NAMES[t]==='CAST'){VP.drawSet(c,'mg_steppe');const ks=Object.keys(S.MGC);ks.forEach((k,i)=>{const x=40+(i%14)*88,y=330+Math.floor(i/14)*190;S.person(c,S.MGC[k],x,y,26,{face:1},{time:0},VP.light('studio',0));c.fillStyle='#000';c.font='12px sans-serif';c.fillText(k,x-30,y+14)})}
 else VP.drawSet(c,NAMES[t])}catch(e){c.fillStyle='#f00';c.fillText(e.message,20,40);console.error(e.stack)}c.fillStyle='#000';c.fillRect(0,0,300,60);c.fillStyle='#ff0';c.font='40px sans-serif';c.fillText(NAMES[t],10,45)};

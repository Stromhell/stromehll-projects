<!doctype html><html><head><meta charset="utf-8"><title>MG act 2</title>
<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/vp/engine.js"></script><script src="../../../../shared/vp/cast.js"></script><script src="../../../../shared/vp/scenes.js"></script><script src="../../../../shared/vp/spain.js"></script>
<script src="../../../../shared/kit.js"></script><script src="../../../../shared/vp.js"></script>
<script src="../../../../spain-1-al-andalus/production/es1_sets.js"></script><script src="../../../../spain-1-al-andalus/production/es1_sets_act1.js"></script><script src="../../../../spain-1-al-andalus/production/es1_sets_act2.js"></script><script src="../../../../spain-1-al-andalus/production/es1_sets_act3.js"></script><script src="../../../../spain-1-al-andalus/production/es1_sets_act4.js"></script><script src="../../../../spain-1-al-andalus/production/es1_sets_act5.js"></script><script src="../../../../spain-1-al-andalus/production/es1_cast.js"></script>
<script src="../../../../spain-2-empire/production/es2_sets.js"></script><script src="../../../../spain-2-empire/production/es2_sets_act2.js"></script>
<script src="../../../../spain-3-civil-war/production/es3_sets.js"></script><script src="../../../../spain-3-civil-war/production/es3_sets_act4b.js"></script><script src="../../../../spain-3-civil-war/production/es3_sets_act5b.js"></script><script src="../../../../spain-3-civil-war/production/es3_cast.js"></script>
<script src="../../../../japan-comeback/production/jp_cast.js"></script><script src="../../../../japan-comeback/production/jp_sets.js"></script>
<script src="../../../../suez-canal/production/sz_sets.js"></script><script src="../../../../suez-canal/production/sz_sets2.js"></script><script src="../../../../suez-canal/production/sz_cast.js"></script><script src="../../../../suez-canal/production/sz_props.js"></script>
<script src="../../../../napoleon/production/np_sets.js"></script><script src="../../../../napoleon/production/np_cast.js"></script><script src="../../../../napoleon/production/np_props.js"></script>
<script src="../../mg_sets.js"></script><script src="../../mg_cast.js"></script><script src="../../mg_props.js"></script>
<script src="timing.js"></script>
<script>
const K = KIT, E = K.E, C = S.MGC, NPC = S.NPC, SZC = S.SZC, H1 = S.ES1H, PL = S.mgPlaces, MX = S.MGX, TAU = Math.PI * 2;
const at = VP.at, seg = K.seg, lerp = K.lerp;
const SUN = lt => VP.light('studio', lt, { swing: 3, set: { L: [.6, -.9], amb: '#6a5a4a', ambA: .2, rim: '#fff0d0', rimA: .8, tint: '#ffe8c0', tintA: .08 } });
const DUSK = lt => VP.light('studio', lt, { swing: 3, set: { L: [-.7, -.6], amb: '#4a3a5a', ambA: .3, rim: '#ffc890', rimA: .9, tint: '#ffb070', tintA: .14 } });
const DAWN = lt => VP.light('studio', lt, { swing: 3, set: { L: [.7, -.5], amb: '#5a5a7a', ambA: .25, rim: '#ffd0a0', rimA: .9, tint: '#ffc8a0', tintA: .1 } });
const COLD = lt => VP.light('studio', lt, { swing: 2, set: { L: [.3, -.9], amb: '#6a7a8a', ambA: .3, rim: '#e8f0ff', rimA: .7, tint: '#c8d8f0', tintA: .12 } });
const GREY = lt => VP.light('studio', lt, { swing: 2, set: { L: [.4, -.9], amb: '#5a5a5a', ambA: .3, rim: '#f0f0f0', rimA: .6, tint: '#d0d0c8', tintA: .1 } });
const NIGHT = lt => VP.light('studio', lt, { swing: 2, set: { L: [-.6, -.7], amb: '#2a3050', ambA: .45, rim: '#a8b8e8', rimA: .8, tint: '#4a5a9a', tintA: .2 } });
const CANDLE = lt => VP.light('studio', lt, { swing: 6, set: { L: [-.8, -.4], amb: '#2a1a10', ambA: .45, rim: '#ffb050', rimA: 1, tint: '#ff9a40', tintA: .16 } });
const FIRE = lt => VP.light('studio', lt, { swing: 8, set: { L: [.8, -.3], amb: '#3a1a10', ambA: .4, rim: '#ff8a30', rimA: 1, tint: '#ff7a30', tintA: .2 } });
const fig = (c, ch, x, y, uu, pose, lt, k, L, f = {}) => { S.contact(c, x, y, uu * .5, .35); VP.figure(c, [x, y], { k: .5, sy: -.2, a: .3, blur: 3 }, cc => S.person(cc, ch, x, y, uu, pose, Object.assign({ blink: S.blinkAt(lt, k), time: lt }, f), L)); };
const pose = (lt, k, o) => Object.assign(S.idle(lt, k), o);
const walk = (lt, k, o) => Object.assign(H1.walk(lt * 1.1 + k), o);
const musket = (cc, a = -1.2) => wr => S.npMusket(cc, wr[0], wr[1], a, .9);
const ride = (c, ch, x, y, uu, col, lt, ph, wk, L, po = {}, f = {}, face = 1) => VP.figure(c, [x, y], { k: .5, sy: -.2, a: .3, blur: 3 }, cc => VP.rider(cc, ch, x, y, uu, uu * 5, { face, ph, walk: wk, t: lt, col, tack: f.tack || { cloth: ['#7a2a22', '#3c1410'], trim: '#c8a040' } }, Object.assign({ lean: 2 }, po), Object.assign({ blink: S.blinkAt(lt, 3), time: lt }, f), L));
const WHITEH = ['#e8e4dc', '#a8a49c'], BAY = ['#6a3a1e', '#3a1e0e'], GREYH = ['#8a8a8a', '#4a4a4a'];
const PX = S.mgPX;
const CITIES = [['BUKHARA', PL.bukhara, 'bukhara', 30, -40], ['SAMARKAND', PL.samarkand, 'samarkand', -16, 50], ['URGENCH', PL.urgench, 'urgench', -16, -30], ['NISHAPUR', PL.nishapur, 'nishapur', 32, 0]];
const HOME = [[PL.steppe, 0, 180], [PX(90, 44), 0, 160], [PL.otrar, 0, 80]];
const WAVE = HOME.concat([[PL.beijing, .0, 130], [PX(108, 33), .1, 110], [PL.samarkand, 0, 120], [PL.urgench, 0, 90], [PL.nishapur, 0, 90], [PL.sarai, .2, 150], [PL.kiev, .45, 130], [PX(22, 51), .65, 110], [PX(20, 47.5), .8, 90]]);
const coffin = (c, x, y, s, lt) => { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = S.rgba('#000000', .25); c.beginPath(); c.ellipse(0, 4, 110, 10, 0, 0, TAU); c.fill();
  c.strokeStyle = '#3a2410'; c.lineWidth = 7; for (const wx of [-60, 60]) { c.beginPath(); c.arc(wx, -28, 26, 0, TAU); c.stroke(); for (let k = 0; k < 6; k++) { const a = k / 6 * TAU + lt; c.lineWidth = 2; c.beginPath(); c.moveTo(wx, -28); c.lineTo(wx + Math.cos(a) * 26, -28 + Math.sin(a) * 26); c.stroke(); } c.lineWidth = 7; }
  c.fillStyle = '#5a3a1e'; c.fillRect(-100, -66, 200, 18); c.fillStyle = '#e8e4dc'; c.beginPath(); c.moveTo(-90, -66); c.quadraticCurveTo(0, -150, 90, -66); c.fill(); c.strokeStyle = '#b8b0a0'; c.lineWidth = 2; c.stroke();
  c.fillStyle = '#c8a040'; c.fillRect(-90, -76, 180, 8); c.strokeStyle = '#5a3a1e'; c.lineWidth = 5; c.beginPath(); c.moveTo(100, -50); c.lineTo(170, -40); c.stroke(); c.restore(); };

window.SHOTS = [
  // 2.01 MED: the map; Silk Road cities light up and go dark one after another
  { set: 'np_parch', cam: { z: [1.25, 1.32], x: [560, 540], y: [300, 300], ease: E.io }, bed: [['drone', .2]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tC = CITIES.map((d, k) => at(Sh, d[2], .4 + k * 1.2)); Sh.tE = at(Sh, 'emptied', Sh.dur - 1.6); },
    draw: (c, lt, u, Sh) => {
      S.mgAsia(c, { fill: cc => { S.mgTide(cc, 1, HOME); CITIES.forEach((d, k) => S.mgTide(cc, seg(lt, Sh.tC[k] + .3, Sh.tC[k] + 1.2), [[d[1], 0, 70, 1]], '#3a3a40', .5)); } });
      CITIES.forEach((d, k) => { const on = seg(lt, Sh.tC[k] - .2, Sh.tC[k] + .1), off = lt > Sh.tC[k] + .6 ? 0 : 1; S.mgDot(c, d[1], d[0], on, off, 22, d[3], d[4]); });
      S.mgArrow(c, PL.otrar, PL.bukhara, E.io(seg(lt, Sh.tC[0] - 1, Sh.tC[0])), S.rgba('#3a3a40', .8), 12, .1);
      S.mgArrow(c, PL.bukhara, PL.nishapur, E.io(seg(lt, Sh.tC[2], Sh.tC[3] + .4)), S.rgba('#3a3a40', .8), 12, -.1); },
    over: [(c, lt) => K.dateTag(c, '1220–1221', lt, { at: .4 }), (c, lt, u, Sh) => K.card(c, 'REFUSE = EMPTIED', lt, { at: Sh.tE, x: 1360, y: 160, px: 50, rot: -2 })],
    sfx: [[.2, 'drone', .2], ['bukhara', 'drum', .4], ['samarkand', 'drum', .4], ['urgench', 'drum', .4], ['nishapur', 'drum', .4], ['emptied', 'wind_loop', .3]] },

  // 2.02 MED: a lonely island hut by a grey sea; the sick shah under a blanket; one servant
  { set: 'mg_island', cam: { z: [1.15, 1.25], x: [900, 960], y: [470, 480], ease: E.io }, bed: [['ocean_loop', .35], ['wind_loop', .2]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tH = at(Sh, 'hunted', Sh.dur - 1.5); },
    draw: (c, lt, u, Sh) => { const L = GREY(lt);
      c.fillStyle = '#6a5a3a'; c.fillRect(900, 590, 170, 14); // mat
      fig(c, C.SHAHSICK, 960, 592, 32, Object.assign(VP.sit(C.SHAHSICK, lt * .2, 1, { seat: 0 }), { face: 1, lean: 14, shN: 30, elN: 90, shF: 26, elF: 90 }), lt, 0, L, { worry: 1, look: [.3, .5], blink: .4 });
      c.fillStyle = '#5a6a7a'; c.beginPath(); c.roundRect(940, 560, 120, 36, 10); c.fill(); c.strokeStyle = '#3a4a5a'; c.lineWidth = 2; c.stroke(); // blanket over the legs
      fig(c, C.SCRIBE, 1140, 610, 32, pose(lt, 2, { face: -1, shN: 20, elN: 70, lean: 6 }), lt, 2, L, { worry: 1, look: [-.7, .3] });
      for (let k = 0; k < 3; k++) { const x = (lt * 30 + k * 400) % 1400 - 60, y = 160 + k * 30 + Math.sin(lt + k) * 8; c.strokeStyle = '#3a3a3a'; c.lineWidth = 2; c.beginPath(); c.moveTo(x - 10, y); c.quadraticCurveTo(x - 5, y - 6 * Math.abs(Math.sin(lt * 4 + k)), x, y); c.quadraticCurveTo(x + 5, y - 6 * Math.abs(Math.sin(lt * 4 + k)), x + 10, y); c.stroke(); } },
    over: [(c, lt, u, Sh) => K.card(c, 'CASPIAN SEA · 1220/21', lt, { at: .6, x: 480, y: 150, px: 46, rot: -2 })],
    sfx: [[.2, 'ocean_loop', .35], [.3, 'wind_loop', .2], ['hunted', 'heartbeat', .3]] },

  // 2.03 MED: a funeral cart crosses the steppe with riders, heads bowed; then the map, grey spreading into Europe and China
  { set: 'mg_steppe', cam: (lt, u, Sh) => lt < Sh.tK ? { z: [lerp(1.0, 1.05, seg(lt, 0, Sh.tK))], x: [640], y: [400] } : { z: [1.0], x: [640], y: [360] }, bed: [['wind_loop', .3]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tK = at(Sh, 'kept going', 2.6); Sh.tW = ['china', 'russia', 'poland', 'hungary'].map((w, k) => at(Sh, w, 3 + k * .8)); },
    draw: (c, lt, u, Sh) => {
      if (lt < Sh.tK) { const L = GREY(lt); c.fillStyle = S.rgba('#3a4050', .2); c.fillRect(0, 0, 1280, 720); const x = lerp(260, 620, lt / Sh.tK);
        S.mgTug(c, x + 260, 640, 150, lt, '#1a1a1e'); coffin(c, x, 640, 1, lt * .5);
        ride(c, C.MONGOL3, x - 260, 650, 28, BAY, lt, lt * .6, .5, L, { shN: 10, elN: 40, lean: 14 }, { look: [.3, .6], worry: 1 }, 1);
        fig(c, C.MONGOL4, x + 380, 660, 30, walk(lt * .6, 1, { face: 1, lean: 10 }), lt, 1, L, { look: [.3, .6], worry: 1 });
        return; }
      VP.drawSet(c, 'np_parch'); const q = seg(lt, Sh.tK, Sh.dur - .6);
      S.mgAsia(c, { fill: cc => S.mgTide(cc, q, WAVE) });
      [['CHINA', PX(110, 33)], ['RUSSIA', PX(40, 53)], ['POLAND', PX(22, 52.5)], ['HUNGARY', PX(22, 46)]].forEach(([t, p], k) => S.mgLabel(c, t, p[0], p[1], seg(lt, Sh.tW[k], Sh.tW[k] + .4), 30, '#2a2a34')); },
    over: [(c, lt) => K.dateTag(c, '1227', lt, { at: .4 })],
    sfx: [[.2, 'wind_loop', .3], [.4, 'drum', .25], ['kept going', 'whoosh', .35], ['china', 'drum', .3], ['russia', 'drum', .3], ['poland', 'drum', .3], ['hungary', 'drum', .3]] },

  // 2.04 MED: in a grand tent the Great Khan Mongke hands his brother Hulagu a golden tablet
  { set: 'tent', cam: { z: [1.1, 1.2], x: [640, 640], y: [470, 480], ease: E.io }, bed: [['fire_loop', .15], ['drone', .15]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tB = at(Sh, 'brother', 3.5); Sh.tO = at(Sh, 'orders', 5); },
    draw: (c, lt, u, Sh) => { const L = CANDLE(lt), w = E.io(seg(lt, .3, Sh.tB)), g = E.io(seg(lt, Sh.tO, Sh.tO + 1.4));
      c.fillStyle = '#5a1a14'; c.beginPath(); c.roundRect(380, 650, 140, 26, 8); c.fill();
      fig(c, C.MONGKE, 450, 652, 36, Object.assign(VP.sit(C.MONGKE, lt * .3, 1, { seat: .2 }), { face: 1, shN: 30 + 40 * g, elN: 40 - 30 * g }), lt, 0, L, { look: [.7, 0] });
      const hx = lerp(1300, 760, w); fig(c, C.HULAGU, hx, 690, 38, w < 1 ? walk(lt, 1, { face: -1 }) : pose(lt, 1, { face: -1, shN: 30 + 40 * g, elN: 40 - 30 * g, lean: 4 * g }), lt, 1, L, { look: [-.7, 0] });
      const px = lerp(520, 640, g), py = 560 - 20 * Math.sin(g * Math.PI); S.mgPaiza(c, px, py, .4, .2, .3 + .5 * g, false);
      fig(c, C.MONGOL2, 220, 690, 34, pose(lt, 3, { face: 1, holdN: S.mgSpear(c, -1.45) }), lt, 3, L, { look: [.6, 0] });
      VP.glow(c, 1080, 480, 160, '#ffc070', .35); },
    over: [(c, lt) => K.card(c, 'HULAGU · 1253', lt, { at: .8, x: 1360, y: 150, px: 52, rot: 2 }), (c, lt, u, Sh) => K.card(c, 'GREAT KHAN MÖNGKE', lt, { at: .5, x: 520, y: 150, px: 44, rot: -2 })],
    sfx: [[.2, 'fire_loop', .15], [.3, 'drone', .15], [.5, 'footsteps', .3], ['orders', 'chime', .4]] },
];
VP.build(); K.boot();
</script></body></html>

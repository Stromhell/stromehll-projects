<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/vp/engine.js"></script><script src="../../../../shared/vp/cast.js"></script><script src="../../../../shared/vp/scenes.js"></script><script src="../../../../shared/vp/spain.js"></script>
<script src="../../../../shared/kit.js"></script><script src="../../../../shared/vp.js"></script>
<script src="../../../../spain-1-al-andalus/production/es1_sets.js"></script><script src="../../../../spain-1-al-andalus/production/es1_sets_act1.js"></script><script src="../../../../spain-1-al-andalus/production/es1_sets_act2.js"></script><script src="../../../../spain-1-al-andalus/production/es1_sets_act3.js"></script><script src="../../../../spain-1-al-andalus/production/es1_sets_act4.js"></script><script src="../../../../spain-1-al-andalus/production/es1_sets_act5.js"></script><script src="../../../../spain-1-al-andalus/production/es1_cast.js"></script>
<script src="../../../../spain-2-empire/production/es2_sets.js"></script><script src="../../../../spain-2-empire/production/es2_sets_act2.js"></script>
<script src="../../../../spain-3-civil-war/production/es3_sets.js"></script><script src="../../../../spain-3-civil-war/production/es3_sets_act4b.js"></script><script src="../../../../spain-3-civil-war/production/es3_sets_act5b.js"></script><script src="../../../../spain-3-civil-war/production/es3_cast.js"></script>
<script src="../../../../japan-comeback/production/jp_cast.js"></script><script src="../../../../japan-comeback/production/jp_sets.js"></script>
<script src="../../../../suez-canal/production/sz_sets.js"></script><script src="../../../../suez-canal/production/sz_sets2.js"></script><script src="../../../../suez-canal/production/sz_cast.js"></script><script src="../../../../suez-canal/production/sz_props.js"></script>

<script src="../../mg_geo.js"></script><script src="../../mg_sets.js"></script><script src="../../mg_detail.js"></script><script src="../../mg_cast.js"></script><script src="../../mg_props.js"></script>
<script src="timing.js"></script>
<script>
KIT.xfade = 0; // QA 5 Nov: hard cuts, dissolves ghosted figures
const K = KIT, E = K.E, C = S.MGC, NPC = S.NPC, SZC = S.SZC, H1 = S.ES1H, PL = S.mgPlaces, MX = S.MGX, TAU = Math.PI * 2;
const at = VP.at, seg = K.seg, lerp = K.lerp;
const SUN = lt => VP.light('studio', lt, { swing: 3, set: { L: [.6, -.9], amb: '#6a5a4a', ambA: .2, rim: '#fff0d0', rimA: .8, tint: '#ffe8c0', tintA: .08 } });
const DUSK = lt => VP.light('studio', lt, { swing: 3, set: { L: [-.7, -.6], amb: '#4a3a5a', ambA: .3, rim: '#ffc890', rimA: .9, tint: '#ffb070', tintA: .14 } });
const DAWN = lt => VP.light('studio', lt, { swing: 3, set: { L: [.7, -.5], amb: '#5a5a7a', ambA: .25, rim: '#ffd0a0', rimA: .9, tint: '#ffc8a0', tintA: .1 } });
const COLD = lt => VP.light('studio', lt, { swing: 2, set: { L: [.3, -.9], amb: '#6a7a8a', ambA: .3, rim: '#e8f0ff', rimA: .7, tint: '#c8d8f0', tintA: .12 } });
const GREY = lt => VP.light('studio', lt, { swing: 2, set: { L: [.4, -.9], amb: '#5a5a5a', ambA: .3, rim: '#f0f0f0', rimA: .6, tint: '#d0d0c8', tintA: .1 } });
const NIGHT = lt => VP.light('studio', lt, { swing: 2, set: { L: [-.6, -.7], amb: '#2a3050', ambA: .45, rim: '#a8b8e8', rimA: .8, tint: '#4a5a9a', tintA: .2 } });
const CANDLE = lt => VP.light('studio', lt, { swing: 6, set: { L: [-.8, -.4], amb: '#2a1a10', ambA: .45, rim: '#ffb050', rimA: 1, tint: '#ff9a40', tintA: .16 } });
const FIRE = lt => VP.light('studio', lt, { swing: 8, set: { L: [.8, -.3], amb: '#3a1a10', ambA: .4, rim: '#ff8a30', rimA: 1, tint: '#ff7a30', tintA: .2 } });
const fig = (c, ch, x, y, uu, pose, lt, k, L, f = {}) => { S.contact(c, x, y, uu * .5, .35); VP.figure(c, [x, y], { k: .5, sy: -.2, a: .3, blur: 3 }, cc => S.person(cc, ch, x, y, uu, pose, Object.assign({ blink: S.blinkAt(lt, k), time: lt }, f), L)); };
const pose = (lt, k, o) => Object.assign(S.idle(lt, k), o);
const walk = (lt, k, o) => Object.assign(H1.walk(lt * 1.1 + k), o);
const musket = (cc, a = -1.2) => wr => S.npMusket(cc, wr[0], wr[1], a, .9);
const ride = (c, ch, x, y, uu, col, lt, ph, wk, L, po = {}, f = {}, face = 1) => VP.figure(c, [x, y], { k: .5, sy: -.2, a: .3, blur: 3 }, cc => VP.rider(cc, ch, x, y, uu, uu * 5, { face, ph, walk: wk, t: lt, col, tack: f.tack || { cloth: ['#7a2a22', '#3c1410'], trim: '#c8a040' } }, Object.assign({ lean: 2 }, po), Object.assign({ blink: S.blinkAt(lt, 3), time: lt }, f), L));
// rideG: gait driven by ground distance, so legs move only while the horse travels and stop when it stops.
// xf(lt) = screen x; gf(lt) = ground x (defaults to xf; pass xf + background scroll when the set pans).
const rideG = (c, ch, xf, y, uu, col, lt, L, po = {}, f = {}, face = 1, k = 0, gf = xf, amp = 1) => {
  const x = xf(lt), g = gf(lt), v = Math.abs(gf(lt + .05) - gf(lt - .05)) / .1;
  ride(c, ch, x, y, uu, col, lt, face * g / (uu * 4) + k, amp * K.clamp(v / (uu * 3)), L, po, f, face); };
// mgPan: draw a set scrolled left by off px, tiled with a mirrored copy so there is no seam.
S.mgPan = (c, name, off) => { const s = VP.bg(name), w = s.w, o = Math.round(((off % (2 * w)) + 2 * w) % (2 * w)), I = s.img, sw = I.width - 8, sh = I.height;
  const D = x => c.drawImage(I, 4, 0, sw, sh, x, 0, w + 1, s.h); // trim the set's light edge columns so tiles meet cleanly
  D(-o); c.save(); c.translate(2 * w - o + 1, 0); c.scale(-1, 1); D(0); c.restore(); if (o > w) D(2 * w - o); };
const WHITEH = ['#e8e4dc', '#a8a49c'], BAY = ['#6a3a1e', '#3a1e0e'], GREYH = ['#8a8a8a', '#4a4a4a'];
const PX = S.mgPX;
const MON = [C.MONGOL, C.MONGOL2, C.MONGOL3, C.MONGOL4], MAM = [C.MAMLUK, C.MAMLUK2, C.MAMLUK3];
const cushion = (c, x, y) => { c.fillStyle = '#7a1a1a'; c.beginPath(); c.roundRect(x - 90, y - 18, 180, 26, 10); c.fill(); c.fillStyle = '#c8a040'; c.fillRect(x - 90, y - 4, 180, 4); };
const castle = (c, x, y, s, a) => { if (a <= 0) return; c.save(); c.translate(x, y); c.scale(s * a, s * a); c.fillStyle = '#8a6a3a'; c.strokeStyle = '#3a2410'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(-20, 0); c.lineTo(-20, -24); for (let k = 0; k < 5; k++) { c.lineTo(-20 + k * 10, -30); c.lineTo(-20 + k * 10 + 5, -30); c.lineTo(-20 + k * 10 + 5, -24); c.lineTo(-20 + k * 10 + 10, -24); } c.lineTo(20, 0); c.closePath(); c.fill(); c.stroke(); c.restore(); };
const GOLD = [[PL.cairo, 0, 90], [PL.damascus, 0, 60], [PL.aleppo, 0, 55], [PX(35.5, 33), 0, 55]];
const GREYE = [[PL.tabriz, 0, 120], [PL.baghdad, 0, 110], [PX(50, 52), 0, 140], [PL.sarai, 0, 150], [PL.samarkand, 0, 150]];

window.SHOTS = [
  // 6.01 MED: a hunting party in the desert; officers close around Qutuz; then Baybars crowned in Cairo
  { set: 'sz_dunes', cam: (lt, u, Sh) => lt < Sh.tS ? { z: [lerp(1.16, 1.04, E.io(seg(lt, Sh.t2, Sh.t2 + 1.4)))], x: [640], y: [lerp(440, 410, E.io(seg(lt, Sh.t2, Sh.t2 + 1.4)))] } : { z: [1.1], x: [640], y: [450] }, bed: [['wind_loop', .3]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tO = at(Sh, 'officers', 3.2); Sh.tS = at(Sh, 'became', Sh.dur - 2.8); Sh.t1 = Sh.tO - .3; Sh.t2 = Sh.tO + 1.4;
      // ground scroll: the party rides home at a steady pace, then slows to a halt as the officers close in
      const V = 105, d = Sh.t2 - Sh.t1; Sh.off = l => l < Sh.t1 ? V * l : l < Sh.t2 ? V * (Sh.t1 + (l - Sh.t1) - (l - Sh.t1) * (l - Sh.t1) / (2 * d)) : V * (Sh.t1 + d / 2); },
    draw: (c, lt, u, Sh) => {
      if (lt < Sh.tS) { const L = SUN(lt), cl = E.io(seg(lt, Sh.t1, Sh.t2)), CL = l => E.io(seg(l, Sh.t1, Sh.t2)), G = xf => l => xf(l) + Sh.off(l);
        S.mgPan(c, 'sz_dunes', Sh.off(lt) * .8);
        // the two officers ahead rein in early, so Qutuz rides up between them while Baybars closes from behind (nobody walks backwards)
        const e = (Sh.t2 - Sh.t1) / 3, gM = l => 105 * (l < Sh.t1 ? l : l < Sh.t1 + e ? Sh.t1 + (l - Sh.t1) - (l - Sh.t1) * (l - Sh.t1) / (2 * e) : Sh.t1 + e / 2);
        const XB = l => lerp(260, 470, CL(l)), XQ = () => 640, XM1 = l => 880 + gM(l) - Sh.off(l), XM2 = l => 1090 + gM(l) - Sh.off(l);
        rideG(c, MAM[2], XM2, 560, 23, BAY, lt, L, { shN: 20, elN: 60 }, { look: [cl > .3 ? -.7 : .7, 0] }, 1, 3, l => 1090 + gM(l));
        rideG(c, C.QUTUZ, XQ, 600, 26, WHITEH, lt, L, { shN: 20, elN: 60 }, { look: [cl > .5 ? -.6 : .7, 0], worry: cl > .6 ? 1 : 0 }, 1, 0, G(XQ));
        rideG(c, C.BAYBARS, XB, 590, 25, BAY, lt, L, { shN: 20, elN: 60 }, { look: [.7, 0], angry: cl > .5 ? 1 : 0 }, 1, 1, G(XB));
        rideG(c, MAM[1], XM1, 610, 25, GREYH, lt, L, { shN: 20, elN: 60 }, { look: [cl > .3 ? -.7 : .7, 0], angry: cl > .5 ? 1 : 0 }, 1, 2, l => 880 + gM(l));
        S.mgDust(c, lt, 200, 640, 1000, .2 * (1 - cl));
        c.fillStyle = S.rgba('#1a0a08', .55 * seg(lt, Sh.tO + 1.6, Sh.tS)); c.fillRect(0, 0, 1280, 720); return; }
      const L = CANDLE(lt), bw = E.io(seg(lt, Sh.tS + .4, Sh.tS + 1.4)); VP.drawSet(c, 'throne'); cushion(c, 640, 600);
      fig(c, C.BAYBARSK, 640, 600, 34, Object.assign(VP.sit(C.BAYBARSK, lt * .3, 2, { seat: .2 }), { face: 1, shN: 20, elN: 30 }), lt, 0, L, { look: [.3, .1] });
      [[330, 1], [460, 1], [840, -1], [970, -1]].forEach(([x, f], k) => fig(c, k % 2 ? C.COURTIER : MAM[k % 3], x, 670, 32, pose(lt, k + 2, { face: f, lean: 26 * bw, shN: 20, elN: 60 }), lt, k + 2, L, { look: [f * .5, .4 * bw] })); },
    over: [(c, lt) => K.dateTag(c, 'OCTOBER 1260', lt, { at: .4 }), (c, lt, u, Sh) => K.card(c, 'SULTAN BAYBARS', lt, { at: Sh.tS + .5, x: 1360, y: 150, px: 52, rot: 2 })],
    sfx: [[.2, 'wind_loop', .3], [.3, 'hooves', .3], ['officers', 'tension', .35], ['officers', 'heartbeat', .3], ['became', 'swell', .35], ['became', 'bell', .3]] },

  // 6.02 MED: Baybars rides along ranks of Mamluk cavalry; then the map, castles rising and Egypt and Syria staying gold
  { set: 'mg_square', cam: (lt, u, Sh) => lt < Sh.tM ? { z: [lerp(1.0, 1.06, seg(lt, 0, Sh.tM))], x: [640], y: [400] } : { z: [1.6], x: [330], y: [330] }, bed: [['march_loop', .25]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tM = at(Sh, 'strongest', 5); Sh.tA = at(Sh, 'again', Sh.dur - 3); },
    draw: (c, lt, u, Sh) => {
      if (lt < Sh.tM) { const L = SUN(lt);
        for (let i = 0; i < 5; i++) ride(c, MAM[i % 3], 430 + i * 180, 540, 18, i % 2 ? BAY : GREYH, lt, lt + i, 0, L, { shN: 10, elN: 40, holdN: S.mgSpear(c, -1.12) }, { look: [-.3, 0] }, -1);
        const w = seg(lt, .2, Sh.tM), bx = lerp(1360, 260, w); ride(c, C.BAYBARSK, bx, 640, 26, WHITEH, lt, lt * 1.1, w < 1 ? .6 : 0, L, { shN: 20, elN: 60 }, { look: [-.5, -.2] }, -1); return; }
      VP.drawSet(c, 'np_parch');
      S.mgAsia(c, { fill: cc => { S.mgTide(cc, 1, GREYE); S.mgRegion(cc, S.mgBounds.MAMLUK_SY, '#e8b830', .5); } });
      [[PX(37.2, 37.6), 0], [PX(36.2, 34.2), .4], [PX(34.6, 31.4), .8], [PX(39.6, 35.4), 1.2]].forEach(([p, d]) => castle(c, p[0], p[1], .55, E.out(seg(lt, Sh.tM + .6 + d, Sh.tM + 1.2 + d))));
      [0, 1, 2].forEach(k => { const q = seg(lt, Sh.tA + k * .5, Sh.tA + k * .5 + .6); if (q > 0 && q < 1) { const p = PX(39 - k * .8, 35.5 - k * .6); VP.glow(c, p[0], p[1], 40, '#ffd860', .6 * Math.sin(q * Math.PI)); } });
      S.mgDot(c, PL.cairo, 'CAIRO', 1, 1, 20, 30); },
    over: [(c, lt) => K.card(c, '1260–1277', lt, { at: .6, x: 480, y: 150, px: 50, rot: -2 })],
    sfx: [[.2, 'march_loop', .25], [.4, 'hooves', .3], ['strongest', 'whoosh', .35], ['strongest', 'clank', .3], ['again', 'drum', .4]] },

  // 6.03 MED: two Mongol armies face each other across a frozen river; Berke in a turban over his fur hat
  { set: 'mg_steppe', cam: { z: [1.0, 1.08], x: [640, 640], y: [410, 420], ease: E.io }, bed: [['wind_loop', .35]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tB = at(Sh, 'berke', 3); Sh.tW = at(Sh, 'war', Sh.dur - 3.2); },
    draw: (c, lt, u, Sh) => { const L = COLD(lt);
      { const g = c.createLinearGradient(0, 400, 0, 720); g.addColorStop(0, '#9ab8c8'); g.addColorStop(1, '#4a7a92'); c.fillStyle = g; c.beginPath(); c.moveTo(610, 400); c.quadraticCurveTo(560, 560, 560, 720); c.lineTo(780, 720); c.quadraticCurveTo(720, 560, 670, 400); c.closePath(); c.fill(); c.strokeStyle = S.rgba('#3a5a3a', .6); c.lineWidth = 4; c.stroke();
      c.strokeStyle = S.rgba('#ffffff', .5); c.lineWidth = 2; for (let k = 0; k < 9; k++) { const yy = 430 + k * 34, xx = 625 + k * 2 + Math.sin(lt * 1.5 + k) * 10, w = 14 + k * 5; c.beginPath(); c.moveTo(xx - w / 2, yy); c.quadraticCurveTo(xx, yy - 4, xx + w / 2, yy); c.stroke(); } }
      for (const i of [0, 2, 1, 3]) { const x = 90 + i * 120 + (i % 2) * 20, y = (i % 2) ? 575 : 500; ride(c, i === 3 ? C.BERKE : MON[i % 4], x, y, i === 3 ? 24 : (i % 2 ? 21 : 17), i % 2 ? BAY : GREYH, lt, lt + i, 0, L, { shN: 10, elN: 40 }, { look: [.8, 0], angry: lt > Sh.tW ? 1 : 0 }, 1); }
      for (const i of [0, 2, 1, 3]) { const x = 840 + i * 120 + (i % 2) * 20, y = (i % 2) ? 575 : 500; ride(c, i === 1 ? C.HULAGUH : MON[(i + 1) % 4], x, y, i === 1 ? 24 : (i % 2 ? 21 : 17), i % 2 ? GREYH : BAY, lt, lt + i + 2, 0, L, { shN: 10, elN: 40 }, { look: [-.8, 0], angry: lt > Sh.tW ? 1 : 0 }, -1); }
      S.mgTug(c, 70, 600, 150, lt, '#e8e4dc'); S.mgTug(c, 1230, 600, 150, lt + 1, '#1a1a1e');
      VP.motes(c, lt, 0, 0, 1280, 500, { n: 14 }); },
    over: [(c, lt) => K.card(c, 'MONGOL VS MONGOL · 1262', lt, { at: .5, x: 960, y: 130, px: 54, rot: -2 }), (c, lt, u, Sh) => K.card(c, 'BERKE · GOLDEN HORDE', lt, { at: Sh.tB, x: 520, y: 280, px: 40, rot: -2 }), (c, lt, u, Sh) => K.card(c, 'HULAGU', lt, { at: Sh.tW, x: 1440, y: 280, px: 40, rot: 2 })],
    sfx: [[.2, 'wind_loop', .35], [.4, 'drone', .2], ['berke', 'chime', .3], ['war', 'horn', .45], ['war', 'drum', .4]] },

  // 6.04 MED: a Persian court; Ghazan Khan in rich robes; scholars and courtiers bow
  { set: 'mg_iwan', cam: { z: [1.08, 1.18], x: [640, 640], y: [450, 450], ease: E.io }, bed: [['drone', .15]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tG = at(Sh, 'ghazan', 4.5); Sh.tF = at(Sh, 'followed', Sh.dur - 2); },
    draw: (c, lt, u, Sh) => { const L = SUN(lt), bw = E.io(seg(lt, Sh.tF - .4, Sh.tF + .8));
      fig(c, C.GHAZAN, 640, 650, 38, pose(lt, 0, { face: 1, shN: 30, elN: 70 }), lt, 0, L, { look: [.2, .1] });
      [[330, 1, C.SCHOLAR], [460, 1, C.COURTIER], [830, -1, C.SCHOLAR2], [960, -1, C.SCRIBE]].forEach(([x, f, ch], k) => {
        const w = seg(lt, .2 + k * .3, 2 + k * .3), xx = lerp(f > 0 ? -80 - k * 60 : 1360 + k * 60, x, E.out(w));
        fig(c, ch, xx, 670, 32, w < 1 ? walk(lt, k + 1, { face: f }) : pose(lt, k + 1, { face: f, lean: 30 * bw, shN: 20, elN: 70 }), lt, k + 1, L, { look: [f * .5, .4 * bw] }); });
      VP.motes(c, lt, 300, 260, 680, 300, { n: 10 }); },
    over: [(c, lt, u, Sh) => K.card(c, 'GHAZAN KHAN · 1295', lt, { at: Sh.tG, x: 1360, y: 150, px: 52, rot: 2 })],
    sfx: [[.2, 'drone', .15], [.3, 'footsteps', .25], ['ghazan', 'chime', .4], ['followed', 'swell', .3]] },

  // 6.05 WIDE: the valley at sunset; the golden tablet in the grass by the spring
  { set: 'mg_ainjalut', cam: { z: [1.0, 1.4], x: [640, 420], y: [380, 520], ease: E.io }, bed: [['wind_loop', .25], ['drone', .15]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tS = at(Sh, 'slaves', Sh.dur - 5); },
    draw: (c, lt, u, Sh) => { c.fillStyle = S.rgba('#e07830', .28); c.fillRect(0, 0, 1280, 720); c.fillStyle = S.rgba('#3a1a3a', .12 + .1 * seg(lt, 0, Sh.dur)); c.fillRect(0, 0, 1280, 720);
      S.mgPaiza(c, 400, 600, .55, -.5, .35 + .3 * Math.sin(lt * 1.5), false); VP.glow(c, 400, 600, 90, '#ffc070', .3);
      S.mgWind(c, lt, 520, 700, .1); S.mgBirds(c, lt, 900, 170, 6, -1, 35); VP.motes(c, lt, 200, 300, 700, 300, { n: 12 }); },
    over: [],
    sfx: [[.2, 'wind_loop', .25], [.3, 'drone', .15], ['slaves', 'swell', .35], ['conquered', 'chime', .35]] },
];
VP.build(); K.boot();
</script></body></html>

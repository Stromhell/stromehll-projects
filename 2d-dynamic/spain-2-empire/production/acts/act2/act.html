const rain = (c, lt, a = .35) => { c.save(); c.strokeStyle = `rgba(200,215,255,${a})`; c.lineWidth = 1.4; for (let k = 0; k < 160; k++) { const r = S.rng(k + 700), x = (r() * 1400 + lt * 90) % 1400 - 60, y = (r() * 760 + lt * (700 + r() * 200)) % 760 - 20; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 8, y + 26); c.stroke(); } c.restore(); };
const canoe = (c, x, y, s, t, k) => { const bob = Math.sin(t * 1.5 + k) * 1.5 * s; c.fillStyle = '#5a3a20'; c.beginPath(); c.moveTo(x - 30 * s, y + bob); c.quadraticCurveTo(x, y + 8 * s + bob, x + 30 * s, y + bob); c.lineTo(x + 26 * s, y + 4 * s + bob); c.lineTo(x - 26 * s, y + 4 * s + bob); c.fill(); c.fillStyle = '#e8dcc2'; c.fillRect(x - 3 * s, y - 12 * s + bob, 6 * s, 12 * s); c.fillStyle = '#a86a44'; c.beginPath(); c.arc(x, y - 15 * s + bob, 3 * s, 0, TAU); c.fill(); c.strokeStyle = '#3a2410'; c.lineWidth = 1.2 * s; c.beginPath(); c.moveTo(x + 4 * s, y - 10 * s + bob); c.lineTo(x + 14 * s + Math.sin(t * 2 + k) * 4 * s, y + 6 * s + bob); c.stroke(); };

const heap = (c, x0, x1, base, top, lt, col = ['#f0c040', '#a87a14', '#fff0a0'], seed = 0) => { if (top >= base) return; c.save(); c.beginPath(); c.moveTo(x0, base); for (let x = x0; x <= x1; x += 20) c.lineTo(x, top + 14 * Math.sin(x * .05 + seed) + 10 * Math.sin(x * .13 + seed)); c.lineTo(x1, base); c.closePath(); c.fillStyle = col[1]; c.fill(); c.clip();
  for (let k = 0; k < 260; k++) { const r = S.rng(k + 800 + seed), x = x0 + r() * (x1 - x0), y = top + r() * (base - top + 20); c.fillStyle = r() < .5 ? col[0] : S.mix(col[0], col[1], .5); c.beginPath(); c.ellipse(x, y, 9 + r() * 8, 5 + r() * 3, r() * 3, 0, TAU); c.fill(); }
  for (let k = 0; k < 30; k++) { const r = S.rng(k + 900 + seed), x = x0 + r() * (x1 - x0), y = top + r() * 60, tw = Math.max(0, Math.sin(lt * 3 + k * 1.7)); c.fillStyle = S.rgba(col[2], .8 * tw); c.beginPath(); c.arc(x, y, 2 + 3 * tw, 0, TAU); c.fill(); } c.restore(); };
const cathedral = (c, x, y, q, L) => { if (q <= 0) return; c.save(); c.beginPath(); c.rect(x - 200, y - 260 * q, 400, 260 * q + 4); c.clip(); const wall = '#e8dcc6', sh = '#a89a80';
  for (const dx of [-110, 110]) { c.fillStyle = wall; c.fillRect(x + dx - 34, y - 220, 68, 220); c.fillStyle = sh; c.fillRect(x + dx + 10, y - 220, 24, 220); c.fillStyle = '#5a4a3a'; c.fillRect(x + dx - 10, y - 190, 20, 30); c.fillStyle = wall; c.beginPath(); c.moveTo(x + dx - 30, y - 220); c.quadraticCurveTo(x + dx, y - 270, x + dx + 30, y - 220); c.fill(); c.fillStyle = '#d8b040'; c.fillRect(x + dx - 2, y - 270, 4, 18); c.fillRect(x + dx - 7, y - 264, 14, 4); }

  c.fillStyle = '#3a2a1a'; c.beginPath(); c.moveTo(x - 22, y); c.lineTo(x - 22, y - 50); c.arc(x, y - 50, 22, Math.PI, 0); c.lineTo(x + 22, y); c.fill(); c.fillStyle = '#3a2a1a'; c.beginPath(); c.arc(x, y - 110, 14, 0, TAU); c.fill();
  c.fillStyle = S.rgba(L.rim || '#ffe0a0', .35); c.fillRect(x - 76, y - 160, 6, 160); c.fillRect(x - 144, y - 220, 5, 220); c.restore(); };

  // 2.01 WIDE: Tenochtitlan on its lake under the volcanoes; canoes cross, cloud shadows drift

  { set: 'caribbean', cam: { z: [1.2, 1.45], x: [600, 700], y: [430, 440], ease: E.io }, bed: [['ocean_loop', .3], ['wind_loop', .1]],

      VP.motes(c, lt, 0, 300, 1280, 400, { n: 25, a: .35 });
    },
    over: [(c, lt) => coinCorner(c, lt, { shine: .55 }), (c, lt) => K.dateTag(c, 'MEXICO · 1519', lt, { at: .4 }), (c, lt, u, Sh) => K.card(c, 'HERNÁN CORTÉS', lt, { at: 1.2, x: 1540, y: 200, px: 52, rot: 3 }), (c, lt, u, Sh) => K.card(c, '~500 MEN', lt, { at: Sh.tF + .2, x: 1540, y: 860, px: 56, rot: -3 }), (c, lt, u, Sh) => K.badge(c, 'NO WAY BACK', lt, { at: Sh.tB })],
    sfx: [['five hundred', 'pop', .3], ['sank', 'creak', .45], ['sank', 'whoosh', .3], ['go back', 'thud', .4]] },

  // 2.03 MED: Malintzin stands between Cortes and Nahua envoys and translates; words pass through her
  { set: 'valley', cam: { z: [1.55, 1.75], x: [640, 640], y: [470, 480], ease: E.sine }, bed: [['wind_loop', .15]],
    init: Sh => { Sh.tW = at(Sh, 'secret weapon', 1); Sh.tN = at(Sh, 'malintzin', 3); Sh.tM = at(Sh, 'maya', 5); Sh.tS = at(Sh, 'spanish', 6.5); Sh.tI = at(Sh, 'interpreter', Sh.dur - 2); Sh.dur = Sh.end - Sh.start; },
    draw: (c, lt, u, Sh) => {

      VP.clouds(c, lt, { n: 3, y0: 500, y1: 720, a: .2 });

      const turn = Math.sin(lt * .9) > 0 ? 1 : -1;
      VP.figure(c, [640, 650], sh, cc => S.person(cc, C.MALINTZIN, 640, 650, 40, Object.assign(S.idle(lt, 1), { face: turn, shN: 40 + 30 * Math.abs(Math.sin(lt * 2)), elN: 60 }), { blink: S.blinkAt(lt, 1), smile: .3, open: talk(1, lt > Sh.tN), look: [turn * .8, 0], time: lt }, L));
      for (const [x, k] of [[810, 2], [900, 3]]) VP.figure(c, [x, 650], sh, cc => S.person(cc, C.NAHUA, x, 650, 40, Object.assign(S.idle(lt, k), { face: -1, shN: 20, elN: 50 }), { blink: S.blinkAt(lt, k), open: talk(k, k === 2 && Math.sin(lt * .9) < 0), look: [-.8, 0], time: lt }, L));
      // words flowing through her: three languages

    sfx: [['secret weapon', 'riser', .3], ['malintzin', 'pop', .3], ['maya', 'pop', .3], ['spanish', 'pop', .3], ['interpreter', 'chime', .3]] },

  // 2.04 WIDE: a column of Tlaxcalan warriors marches beside a few Spanish horsemen
  { set: 'valley', cam: { z: [1.1, 1.3], x: [560, 720], y: [440, 450], ease: E.io }, bed: [['wind_loop', .15], ['crowd_loop', .12]],
    init: Sh => { Sh.tH = at(Sh, 'hated', 2.5); Sh.tT = at(Sh, 'tens of thousands', 5); Sh.dur = Sh.end - Sh.start; },

      for (let rank = 0; rank < 3; rank++) { const y = 556 + rank * 18, uu = 11 + rank * 1.6, gap = 52 + rank * 6, sp = rank === 0 ? 22 + 60 * seg(lt, Sh.tT - 1, Sh.tT + 3) : 22; for (let i = 0; i < 26; i++) { const x = -1300 + i * gap + rank * 26 + lt * 22 + (rank === 0 ? 700 * E.out(seg(lt, Sh.tT - 1, Sh.tT + 3)) : 0); if (x < -40 || x > 1320) continue; const ch = VP.vary(C.TLAX, 500 + rank * 30 + i); S.person(c, ch, x, y, uu, Object.assign(walk(lt * .9 + i * .3 + rank), { face: 1, shN: 40, elN: 50, holdN: wr => { c.strokeStyle = '#4a3420'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(wr[0], wr[1] + uu * 2); c.lineTo(wr[0] + 3, wr[1] - uu * 4.5); c.stroke(); } }), { time: lt }, L); } }
      for (const [k, x0] of [[0, 380], [1, 760]]) { const x = x0 + lt * 22, y = 612; VP.figure(c, [x, y], sh, cc => VP.rider(cc, k ? C.CONQ : C.CORTES, x, y, 21, 104, { face: 1, ph: lt * .9 + k, walk: .7, t: lt, col: k ? GREY : BAY, tack: CTACK }, { lean: 2 }, { blink: S.blinkAt(lt, k), look: [.8, 0], time: lt }, L)); }
      for (const [x, k] of [[100, 0], [220, 1], [540, 2], [620, 3], [1000, 4]]) { const xx = x + lt * 22, y = 690; VP.figure(c, [xx, y], sh, cc => S.person(cc, C.TLAX, xx, y, 30, Object.assign(walk(lt * .9 + k * .3), { face: 1, holdF: wr => { cc.strokeStyle = '#4a3420'; cc.lineWidth = 3; cc.beginPath(); cc.moveTo(wr[0], wr[1] + 40); cc.lineTo(wr[0] + 6, wr[1] - 90); cc.stroke(); cc.fillStyle = '#2a2a30'; cc.beginPath(); cc.moveTo(wr[0] + 2, wr[1] - 90); cc.lineTo(wr[0] + 6, wr[1] - 108); cc.lineTo(wr[0] + 10, wr[1] - 90); cc.fill(); } }), { blink: S.blinkAt(lt, k), angry: .3, look: [.8, 0], time: lt }, L)); }

    },

    sfx: [['hated', 'tension', .3], ['tens of thousands', 'crowd_cheer', .3], [.5, 'footsteps', .25]] },

  // 2.05 MED: Moctezuma in his feather crown greets Cortes; then guards close in: hostage
  { set: 'tenoch', cam: (lt, u, Sh) => ({ z: [lerp(2.1, 2.5, E.io(seg(lt, Sh.tH - 1, Sh.tH + 1)))], x: [640], y: [560] }), bed: [['crowd_loop', .12]],

      c.fillStyle = '#d8c8a0'; c.fillRect(0, 560, 1280, 160); S.dabs(c, { x: 0, y: 560, w: 1280, h: 160, n: 120, cols: ['#e8d8b0', '#b8a880'], r0: 4, r1: 12, a0: .2, a1: .4, seed: 55 }); S.glow(c, 640, 560, 260, '#fff0d0', .1);
      for (const [x0, k] of [[-70, 5], [-10, 6]]) { const x = lerp(x0, k === 5 ? 700 : 822, E.io(hq)), y = 638 + (k - 5) * 4; VP.figure(c, [x, y], sh, cc => S.person(cc, k === 5 ? C.CONQ : C.CONQ2, x, y, 36, Object.assign(hq > 0 && hq < 1 ? walk(lt) : S.idle(lt, k), { face: 1, shN: 70 * hq, elN: 20 }), { blink: S.blinkAt(lt, k), angry: .5, look: [.8, 0], time: lt }, L)); }

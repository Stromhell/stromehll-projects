<script>
const K = KIT, E = K.E, X = S.SPX, CH = S.SPAIN, C = S.ES2, H1 = S.ES1H, H = S.ES2H, TAU = Math.PI * 2;
const at = VP.at, seg = K.seg, lerp = K.lerp, pulse = H1.pulse, walk = H1.walk;
const coinCorner = (c, lt, o = {}) => H.coin(c, 150, 150, 62, lt, Object.assign({ shine: .6 }, o));
const WLL = X.WLL, wp = X.wpoly;
const BAY = ['#7a4a2e', '#3a2014'], GREY = ['#8a847c', '#4a4440'], CTACK = { cloth: ['#b8282a', '#5a1010'], trim: '#d8b060', reins: 1 };
const DAY = (lt, o = {}) => VP.light('golden', lt, Object.assign({ swing: 5, set: { L: [-.6, -1] } }, o));
const mapCandle = (c, lt) => { const f = VP.flicker(lt, 3); c.save(); c.globalCompositeOperation = 'multiply'; const vg = c.createRadialGradient(640, 360, 220, 640, 360, 820); vg.addColorStop(0, 'rgba(255,255,255,0)'); vg.addColorStop(1, `rgba(60,30,10,${.5 - .1 * f})`); c.fillStyle = vg; c.fillRect(0, 0, 1280, 720); c.restore(); VP.glow(c, 500 + 60 * Math.sin(lt * .4), 260, 520, '#ffcf80', .12 + .08 * f); };
const night = (c, a, col = '30,40,100') => { c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = `rgba(${col},${a})`; c.fillRect(0, 0, 1280, 720); c.restore(); };
const route = (c, pts, q, col, w = 5) => { const P = pts.map(p => WLL(p[0], p[1])); let tot = 0; const L = []; for (let i = 1; i < P.length; i++) { const d = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); L.push(d); tot += d; }
  let rem = tot * q; c.save(); c.strokeStyle = col; c.lineWidth = w; c.setLineDash([10, 7]); c.lineCap = 'round'; c.beginPath(); c.moveTo(P[0][0], P[0][1]); let end = P[0];
  for (let i = 1; i < P.length && rem > 0; i++) { const f = Math.min(1, rem / L[i - 1]); end = [lerp(P[i - 1][0], P[i][0], f), lerp(P[i - 1][1], P[i][1], f)]; c.lineTo(end[0], end[1]); rem -= L[i - 1]; } c.stroke(); c.restore(); return end; };
const rain = (c, lt, a = .35) => { c.save(); c.strokeStyle = `rgba(200,215,255,${a})`; c.lineWidth = 1.4; for (let k = 0; k < 160; k++) { const r = S.rng(k + 700), x = (r() * 1400 + lt * 90) % 1400 - 60, y = (r() * 760 + lt * (700 + r() * 200)) % 760 - 20; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 8, y + 26); c.stroke(); } c.restore(); };
const puff = (c, x, y, lt, t0) => { const q = seg(lt, t0, t0 + 2.2); if (q <= 0 || q >= 1) return; if (q < .06) VP.glow(c, x, y, 90, '#fff0b0', .9 * (1 - q / .06)); for (let k = 0; k < 6; k++) { const r = S.rng(k + Math.round(x)), rad = (14 + 50 * q) * (.7 + r() * .6), px = x + (r() - .5) * 60 * q + 40 * q, py = y - 30 * q * r(); const g = c.createRadialGradient(px, py, 0, px, py, rad); g.addColorStop(0, `rgba(230,225,215,${.65 * (1 - q)})`); g.addColorStop(1, 'rgba(230,225,215,0)'); c.fillStyle = g; c.beginPath(); c.arc(px, py, rad, 0, TAU); c.fill(); } };
const stampBox = (c, txt, x, y, q, col = '#b8282a', rot = -.12, px = 48) => { if (q <= 0) return; c.save(); c.translate(x, y); c.rotate(rot); c.scale(1 + 1.4 * (1 - q), 1 + 1.4 * (1 - q)); c.globalAlpha = q; c.font = `${px}px Anton`; const w = c.measureText(txt).width + 40; c.strokeStyle = col; c.lineWidth = 6; c.strokeRect(-w / 2, -px * .8, w, px * 1.5); c.fillStyle = col; c.textAlign = 'center'; c.fillText(txt, 0, px * .32); c.restore(); };
const steel = (c, x, y, s, lt, k, col = '#5a6068', o = {}) => { const bob = Math.sin(lt * 1.2 + k) * 2 * s; c.save(); c.translate(x, y + bob); if (o.flip) c.scale(-1, 1);
  c.fillStyle = col; c.beginPath(); c.moveTo(-160 * s, -14 * s); c.lineTo(170 * s, -14 * s); c.lineTo(150 * s, 12 * s); c.lineTo(-150 * s, 12 * s); c.fill(); c.fillStyle = S.mix(col, '#ffffff', .25); c.fillRect(-150 * s, -14 * s, 300 * s, 3 * s);
  c.fillStyle = S.mix(col, '#000000', .15); c.fillRect(-70 * s, -40 * s, 120 * s, 26 * s); c.fillRect(-120 * s, -26 * s, 30 * s, 12 * s); c.fillRect(90 * s, -26 * s, 30 * s, 12 * s); c.strokeStyle = S.mix(col, '#000000', .3); c.lineWidth = 3 * s; c.beginPath(); c.moveTo(-90 * s, -22 * s); c.lineTo(-140 * s, -26 * s); c.moveTo(120 * s, -22 * s); c.lineTo(160 * s, -26 * s); c.stroke();
  c.fillStyle = '#d8b040'; for (const dx of [-30, 10]) { c.fillStyle = '#c8b090'; c.fillRect(dx * s, -76 * s, 16 * s, 36 * s); c.fillStyle = '#2a2a2a'; c.fillRect(dx * s, -80 * s, 16 * s, 6 * s); }
  c.strokeStyle = '#3a3a3a'; c.lineWidth = 2 * s; c.beginPath(); c.moveTo(-50 * s, -40 * s); c.lineTo(-50 * s, -110 * s); c.stroke(); c.restore();
  if (o.smoke !== false) H1.smoke(c, x + (o.flip ? -8 : 8) * s * 3, y - 80 * s, s * .8, lt + k, '70,70,74'); };

    over: [(c, lt) => coinCorner(c, lt, { shine: .3, chips: 4 }), (c, lt, u, Sh) => K.card(c, 'WHAT WAS LEFT', lt, { at: Sh.tI, x: 380, y: 200, px: 56, rot: -3 }), (c, lt, u, Sh) => K.card(c, 'CUBA: SUGAR', lt, { at: Sh.tJ + .2, x: 1540, y: 200, px: 52, rot: 3 }), (c, lt, u, Sh) => K.badge(c, 'CUBANS WANTED FREEDOM', lt, { at: Sh.tW })],
    sfx: [['islands', 'paper', .3], ['cuba', 'pop', .3], ['puerto rico', 'pop', .3], ['philippines', 'pop', .3], ['jewel', 'chime', .35]] },

      VP.figure(c, [560, 660], sh, cc => S.person(cc, Object.assign({}, C.SAILOR, { build: 'kid', headwear: null, shirt: ['#e8e4dc', '#a8a49c'] }), 560, 660, 30, Object.assign(S.idle(lt, 0), { face: 1, shN: 140 + 20 * Math.sin(lt * 5), elN: 20, holdN: wr => { cc.fillStyle = '#efe8d8'; cc.fillRect(wr[0] - 14, wr[1] - 28, 30, 36); cc.fillStyle = '#2a2420'; cc.fillRect(wr[0] - 10, wr[1] - 22, 22, 4); } }), { blink: S.blinkAt(lt, 0), open: .5 * Math.abs(Math.sin(lt * 7)), smile: .4, look: [.8, -.2], time: lt }, L));
      for (const [x, ch, k] of [[700, S.ES1.TOWNSMAN, 1], [780, C.BANKER, 2], [860, CH.aisha, 3]]) VP.figure(c, [x, 660], sh, cc => S.person(cc, ch, x, 660, 36, Object.assign(S.idle(lt, k), { face: -1, shN: 30, elN: 90 }), { blink: S.blinkAt(lt, k), worry: .4 * seg(lt, Sh.tN, Sh.tN + 1), look: [-.6, .3], time: lt }, L));

    over: [(c, lt) => coinCorner(c, lt, { shine: .3, chips: 4 }), (c, lt, u, Sh) => K.dateTag(c, 'CUBA REVOLTS · 1895', lt, { at: Sh.tR }), (c, lt, u, Sh) => K.card(c, 'USA · 90 MILES AWAY', lt, { at: Sh.tU + .2, x: 380, y: 200, px: 48, rot: -3 }),
      (c, lt, u, Sh) => { headline(c, 'SPANISH\nCRUELTY!', lt, Sh.tN, 1560, 330, .08); headline(c, 'CUBA\nIN FLAMES!', lt, Sh.tN + 1, 1330, 520, -.1); headline(c, 'WAR\nNOW?', lt, Sh.tS - .3, 1600, 700, .05); }],
    sfx: [['revolt', 'hit', .35], ['united states', 'pop', .3], ['newspapers', 'paper', .4], ['every day', 'paper', .35], ['sell', 'paper', .35]] },

    init: Sh => { Sh.tM = at(Sh, 'maine', 2); Sh.tB = at(Sh, 'blew up', 3.5); Sh.tD = at(Sh, 'died', 6); Sh.tS = at(Sh, 'blamed spain', Sh.dur - 1); Sh.dur = Sh.end - Sh.start; },

  // 6.04 WIDE: grey American steel ships fire on wooden Spanish ships in Manila Bay; then Cuba
  { set: 'ocean', cam: (lt, u, Sh) => ({ z: [1.3], x: [640], y: [430], shake: lt > Sh.tM ? .7 : 0 }), bed: [['ocean_loop', .3], ['fire_loop', .15]],

      for (let k = 0; k < 3; k++) { const x = 900 + k * 120, y = 450 + k * 16; steel(c, x, y, .6, lt, k, '#6a7078', { flip: true }); for (let j = 0; j < 4; j++) { const t0 = Sh.tM - .5 + j * 1.3 + k * .4; const q = seg(lt, t0, t0 + .3); if (q > 0 && q < 1) { VP.glow(c, x - 70, y - 14, 60 * (1 - q), '#fff0b0', 1); puff(c, x - 80, y - 14, lt, t0); } } }

  { set: 'study', cam: { z: [1.45, 1.6], x: [640, 660], y: [440, 450], ease: E.sine }, bed: [['drone', .2]],
    init: Sh => { Sh.tT = at(Sh, 'treaty of paris', 1); Sh.tG = at(Sh, 'gave up', 3.5); Sh.tM = at(Sh, 'twenty million', Sh.dur - 2.5); Sh.dur = Sh.end - Sh.start; },
    draw: (c, lt, u, Sh) => {
      const L = { L: [-1, -.6], amb: '#3a3a4a', ambA: .35, rim: '#e0e8f0', rimA: .8, tint: '#c8d0e0', tintA: .08, sw: .3, rw: .05 }, f = VP.flicker(lt, 3);

      VP.figure(c, [860, 660], { k: -.5, sy: -.2, a: .3, blur: 2 }, cc => S.person(cc, Object.assign({}, C.BANKER, { shirt: ['#2a2a3a', '#14141e'] }), 860, 660, 42, Object.assign(S.idle(lt, 1), { face: -1, shN: 20, elN: 60 }), { blink: S.blinkAt(lt, 1), smile: .3, look: [-.8, .3], time: lt }, L));
      c.fillStyle = '#4a2a14'; c.fillRect(420, 590, 480, 20); c.fillRect(440, 610, 14, 80); c.fillRect(866, 610, 14, 80); c.fillStyle = '#f0e6d0'; c.fillRect(600, 578, 120, 12);

    },

      (c, lt, u, Sh) => { ['CUBA', 'PUERTO RICO', 'GUAM', 'PHILIPPINES'].forEach((t, k) => { const q = seg(lt, Sh.tG + k * .5, Sh.tG + k * .5 + .3); if (q <= 0) return; const y = 300 + k * 90; c.save(); c.globalAlpha = q; c.fillStyle = '#f4ead4'; c.fillRect(1400, y - 36, 380, 66); c.font = '42px Anton'; c.fillStyle = '#2a1a10'; c.textAlign = 'center'; c.fillText(t, 1590, y + 12); const s = seg(lt, Sh.tG + k * .5 + .4, Sh.tG + k * .5 + .7); c.strokeStyle = '#b8282a'; c.lineWidth = 7; c.beginPath(); c.moveTo(1410, y - 4); c.lineTo(1410 + 360 * s, y - 4); c.stroke(); c.restore(); }); },

    sfx: [['treaty of paris', 'paper', .35], ['gave up', 'scrape', .3], ['guam', 'scrape', .3], ['philippines', 'scrape', .3], ['twenty million', 'coins', .4]] },

  // 6.06 WIDE: sunset sea; the silver coin finally topples and falls flat; EL DESASTRE
  { set: 'goldsea', cam: { z: [1.15, 1.3], x: [640, 640], y: [400, 390], ease: E.io }, bed: [['ocean_loop', .3], ['drone', .2]],
    init: Sh => { Sh.tD = at(Sh, 'disaster', 1.5); Sh.tC = at(Sh, 'columbus', 4); Sh.tG = at(Sh, 'gone', Sh.dur - 1); Sh.dur = Sh.end - Sh.start; },
    draw: (c, lt, u, Sh) => {

      c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = `rgba(80,40,60,${.35 * seg(lt, Sh.tD, Sh.dur)})`; c.fillRect(0, 0, 1280, 720); c.restore();
      VP.motes(c, lt, 0, 200, 1280, 400, { n: 25, a: .35, col: '#ffd090' });

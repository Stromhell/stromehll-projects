  c.save(); c.clip(); c.fillStyle = '#d8c090'; for (let k = 0; k < 5; k++) { const ph = ((rot + k * 1.3) % TAU) - Math.PI, cx = Math.sin(ph) * r * .8; if (Math.cos(ph) < 0) continue; c.beginPath(); c.ellipse(cx, (k % 2 ? -.2 : .25) * r, r * .22 * Math.cos(ph), r * .3, 0, 0, TAU); c.fill(); } c.restore();

  { set: 'world', cam: { z: [1.05, 1.15], x: [600, 620], y: [360, 360], ease: E.io }, bed: [['drone', .2]], sub: 'bottom',

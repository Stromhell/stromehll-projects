<!doctype html><html><head><meta charset="utf-8"><title>ES2 act 3 - The Silver Mountain</title>
<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/vp/engine.js"></script><script src="../../../../shared/vp/cast.js"></script><script src="../../../../shared/vp/scenes.js"></script><script src="../../../../shared/vp/spain.js"></script>
<script src="../../../../shared/kit.js"></script><script src="../../../../shared/vp.js"></script>
<script src="../../../../spain-1-al-andalus/production/es1_sets.js"></script><script src="../../../../spain-1-al-andalus/production/es1_sets_act1.js"></script><script src="../../../../spain-1-al-andalus/production/es1_sets_act2.js"></script><script src="../../../../spain-1-al-andalus/production/es1_sets_act3.js"></script><script src="../../../../spain-1-al-andalus/production/es1_sets_act4.js"></script><script src="../../../../spain-1-al-andalus/production/es1_sets_act5.js"></script><script src="../../../../spain-1-al-andalus/production/es1_cast.js"></script>
<script src="../../es2_sets.js"></script><script src="../../es2_cast.js"></script><script src="../../es2_sets_act1.js"></script><script src="../../es2_sets_act2.js"></script>
<script src="timing.js"></script>
<script>
const K = KIT, E = K.E, X = S.SPX, CH = S.SPAIN, C = S.ES2, H1 = S.ES1H, H = S.ES2H, TAU = Math.PI * 2;
const at = VP.at, seg = K.seg, lerp = K.lerp, pulse = H1.pulse, walk = H1.walk;
const coinCorner = (c, lt, o = {}) => H.coin(c, 150, 150, 62, lt, Object.assign({ shine: .6 }, o));
const WLL = X.WLL, wp = X.wpoly;
const BAY = ['#7a4a2e', '#3a2014'], GREY = ['#8a847c', '#4a4440'], CTACK = { cloth: ['#b8282a', '#5a1010'], trim: '#d8b060', reins: 1 };
const DAY = (lt, o = {}) => VP.light('golden', lt, Object.assign({ swing: 5, set: { L: [-.6, -1] } }, o));
const mapCandle = (c, lt) => { const f = VP.flicker(lt, 3); c.save(); c.globalCompositeOperation = 'multiply'; const vg = c.createRadialGradient(640, 360, 220, 640, 360, 820); vg.addColorStop(0, 'rgba(255,255,255,0)'); vg.addColorStop(1, `rgba(60,30,10,${.5 - .1 * f})`); c.fillStyle = vg; c.fillRect(0, 0, 1280, 720); c.restore(); VP.glow(c, 500 + 60 * Math.sin(lt * .4), 260, 520, '#ffcf80', .12 + .08 * f); };
const night = (c, a, col = '30,40,100') => { c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = `rgba(${col},${a})`; c.fillRect(0, 0, 1280, 720); c.restore(); };
const route = (c, pts, q, col, w = 5) => { const P = pts.map(p => WLL(p[0], p[1])); let tot = 0; const L = []; for (let i = 1; i < P.length; i++) { const d = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); L.push(d); tot += d; }
  let rem = tot * q; c.save(); c.strokeStyle = col; c.lineWidth = w; c.setLineDash([10, 7]); c.lineCap = 'round'; c.beginPath(); c.moveTo(P[0][0], P[0][1]); let end = P[0];
  for (let i = 1; i < P.length && rem > 0; i++) { const f = Math.min(1, rem / L[i - 1]); end = [lerp(P[i - 1][0], P[i][0], f), lerp(P[i - 1][1], P[i][1], f)]; c.lineTo(end[0], end[1]); rem -= L[i - 1]; } c.stroke(); c.restore(); return end; };
const MINER2 = Object.assign({}, C.MINER, { shirt: ['#8a5a3a', '#4a2a1a'] });
const fleetShip = (c, x, y, s, lt, k, sail = '#f4ead4', cross = true) => { const bob = Math.sin(lt * 1.2 + k) * 3 * s; c.save(); c.translate(x, y + bob); c.rotate(Math.sin(lt * 1.1 + k) * .03); X.ship(c, 0, 0, s, sail, cross); c.restore(); c.fillStyle = S.rgba('#ffffff', .35); c.fillRect(x - 120 * s, y + 16 * s + bob, 70 * s, 3); };

window.SHOTS = [
  // 3.01 WIDE: Cerro Rico above Potosi; a line of miners climbs into the thin air
  { set: 'potosi', cam: { z: [1.1, 1.4], x: [560, 520], y: [380, 330], ease: E.io }, bed: [['wind_loop', .3]],
    init: Sh => { Sh.tS = at(Sh, 'silver', 4); Sh.tF = at(Sh, 'four thousand', 6); Sh.dur = Sh.end - Sh.start; },
    draw: (c, lt, u, Sh) => {
      VP.glow(c, 900, 120, 500, '#ffd8a0', .22); VP.rays(c, 1000, 60, lt, { ang: 2.4, spread: .5, n: 9, len: 1000, a: .05, w1: 120 });
      VP.clouds(c, lt, { n: 4, y0: 200, y1: 600, a: .25, speed: 18 });
      for (let k = 0; k < 18; k++) { const ph = (lt * .02 + k / 18) % 1, side = k % 2 ? 1 : -1, y = 500 - ph * 300, x = 520 + side * (y - 150) * .7 * (1 - ph * .3); H1.tiny(c, x, y, 1.2, '#6a3a24', lt, k, { helm: '#3a2414', pike: false, walk: true, sk: 2 }); }
      const sv = seg(lt, Sh.tS - .3, Sh.tS + .8); if (sv > 0) for (let i = 0; i < 30; i++) { const r = S.rng(i + 700), y = 200 + r() * 290, x = 520 + (r() - .5) * (y - 140) * 1.5, tw = .5 + .5 * Math.sin(lt * 6 + i * 2); VP.glow(c, x, y, 10, '#ffffff', .8 * sv * tw); }
      VP.motes(c, lt, 0, 200, 1280, 400, { n: 30, a: .35 });
    },
    over: [(c, lt) => coinCorner(c, lt, { shine: .6 }), (c, lt) => K.dateTag(c, 'POTOSÍ · 1545', lt, { at: .4 }), (c, lt, u, Sh) => K.card(c, 'A MOUNTAIN\nOF SILVER', lt, { at: Sh.tS + .2, x: 380, y: 200, px: 52, rot: -3 }), (c, lt, u, Sh) => K.card(c, '~4,000 M UP', lt, { at: Sh.tF + .2, x: 1540, y: 200, px: 56, rot: 3 })],
    sfx: [[.3, 'swell', .3], ['silver', 'chime', .45], ['four thousand', 'wind_loop', .2]] },

  // 3.02 MED: the mita; men leave a village with their families watching, then the dark mine mouth swallows the line
  { set: 'potosi', cam: { z: [1.5, 1.7], x: [560, 600], y: [520, 510], ease: E.sine }, bed: [['wind_loop', .2], ['drone', .15]],
    init: Sh => { Sh.tF = at(Sh, 'forced', 1); Sh.tM = at(Sh, 'mita', 4); Sh.tN = at(Sh, 'never came home', Sh.dur - 1.5); Sh.dur = Sh.end - Sh.start; },
    draw: (c, lt, u, Sh) => {
      const L = VP.light('golden', lt, { swing: 5, set: { L: [-.7, -.8] } }), sh = VP.shadowOf(L, 1.2, .3, .12), dim = seg(lt, Sh.tN - 1, Sh.tN + 1);
      // the mine mouth: a dark timbered arch in the red slope
      const mx = 720, my = 470; c.fillStyle = '#1a0e0a'; c.beginPath(); c.moveTo(mx - 50, my); c.lineTo(mx - 50, my - 70); c.quadraticCurveTo(mx, my - 110, mx + 50, my - 70); c.lineTo(mx + 50, my); c.fill();
      c.fillStyle = '#5a3a20'; c.fillRect(mx - 58, my - 80, 12, 80); c.fillRect(mx + 46, my - 80, 12, 80); c.fillRect(mx - 62, my - 88, 124, 12); VP.glow(c, mx, my - 30, 60, '#ff9a40', .25 + .1 * VP.flicker(lt, 3));
      for (let k = 0; k < 5; k++) { const p = ((lt * .07 + k * .2) % 1), x = lerp(400, mx, p), y = lerp(660, my, p), a = p > .85 ? (1 - p) / .15 : 1; c.save(); c.globalAlpha = a; VP.figure(c, [x, y], sh, cc => S.person(cc, k % 2 ? MINER2 : C.MINER, x, y, 24 - 6 * p, Object.assign(walk(lt * .8 + k), { face: 1, holdN: null }), { blink: S.blinkAt(lt, k), worry: .5, time: lt }, L)); c.restore(); }
      for (const [x, ch, k, uu] of [[330, C.NAHUAW, 7, 26], [290, Object.assign({}, C.NAHUA, { build: 'kid' }), 8, 20]]) VP.figure(c, [x, 660], sh, cc => S.person(cc, ch, x, 660, uu, Object.assign(S.idle(lt, k), { face: 1, shN: k === 7 ? 120 + 20 * Math.sin(lt * 4) : 20, elN: 20 }), { blink: S.blinkAt(lt, k), worry: .8, look: [.8, -.1], time: lt }, L));
      if (dim > 0) night(c, .4 * dim, '60,40,50');
      VP.motes(c, lt, 300, 450, 600, 200, { n: 20, a: .35, col: '#e8b090' });
    },
    over: [(c, lt) => coinCorner(c, lt, { shine: .4 }), (c, lt, u, Sh) => K.card(c, 'THE MITA', lt, { at: Sh.tM + .2, x: 380, y: 200, px: 64, rot: -3 }), (c, lt, u, Sh) => K.badge(c, 'FORCED LABOUR', lt, { at: Sh.tF + .5, until: Sh.tN - .3 }), (c, lt, u, Sh) => K.badge(c, 'MANY NEVER CAME HOME', lt, { at: Sh.tN })],
    sfx: [['forced', 'tension', .35], ['mita', 'pop', .3], ['never came home', 'drone', .35]] },

  // 3.03 WIDE: the treasure fleet sails in convoy, warships on the flanks; coins stamp in; a pirate sail appears
  { set: 'ocean', cam: { z: [1.05, 1.25], x: [600, 680], y: [400, 410], ease: E.io }, bed: [['ocean_loop', .35], ['wind_loop', .2]],
    init: Sh => { Sh.tM = at(Sh, 'melted', .6); Sh.tC = at(Sh, 'coins', 2); Sh.tF = at(Sh, 'treasure fleets', 4.5); Sh.tP = at(Sh, 'pirates', Sh.dur - 1); Sh.dur = Sh.end - Sh.start; },
    draw: (c, lt, u, Sh) => {
      const fl = E.out(seg(lt, Sh.tF - 1.5, Sh.tF + 1));
      for (const [k, x0, y, s] of [[0, 300, 430, .45], [1, 520, 440, .55], [2, 720, 432, .45], [3, 420, 470, .7], [4, 660, 480, .75], [5, 880, 465, .6]]) { if (k > 1 && fl <= (k - 1) * .2) continue; fleetShip(c, x0 + lt * 6 - (1 - fl) * 60, y, s, lt, k); }
      const p = seg(lt, Sh.tP - 1, Sh.tP + 2); if (p > 0) { c.save(); c.globalAlpha = p; fleetShip(c, 1150 - p * 120, 420, .38, lt, 9, '#2a2626', false); c.fillStyle = '#1a1a1a'; c.fillRect(1150 - p * 120 - 4, 420 - 40, 22, 14); c.restore(); }
      VP.glow(c, 640 + 60 * Math.sin(lt * .3), 200, 560, '#ffe8c0', .15);
      c.strokeStyle = 'rgba(40,40,50,.7)'; c.lineWidth = 2; for (let k = 0; k < 3; k++) { const gx = 200 + lt * 20 + k * 40, gy = 180 + k * 14, ff = Math.sin(lt * 7 + k) * 5; c.beginPath(); c.moveTo(gx - 9, gy - ff); c.quadraticCurveTo(gx, gy - 2, gx + 9, gy - ff); c.stroke(); }
    },
    over: [(c, lt) => coinCorner(c, lt, { shine: .7 }), (c, lt, u, Sh) => { for (let i = 0; i < 5; i++) { const q = seg(lt, Sh.tC + i * .25, Sh.tC + i * .25 + .3); if (q <= 0) continue; const sc = 1 + 1.5 * (1 - E.out(q)); H.coin(c, 560 + i * 200, 790, 56 * sc, lt + i, { shine: .8, spin: 0 }); } }, (c, lt, u, Sh) => K.card(c, 'TREASURE FLEET', lt, { at: Sh.tF + .3, x: 380, y: 200, px: 56, rot: -3 }), (c, lt, u, Sh) => K.card(c, 'PIRATES!', lt, { at: Sh.tP + .3, x: 1560, y: 200, px: 60, rot: 4 })],
    sfx: [['melted', 'fire_loop', .25], ['coins', 'stamp', .4], ['coins', 'coins', .35], ['treasure fleets', 'swell', .35], ['pirates', 'tension', .4]] },

  // 3.04 MAP: the Manila galleon route crosses the Pacific; silver goes west, silk and porcelain come back
  { set: 'world', cam: { z: [1.0, 1.05], x: [640, 640], y: [360, 350], ease: E.io }, bed: [['drone', .2], ['ocean_loop', .12]], sub: 'bottom',
    init: Sh => { Sh.tW = at(Sh, 'west', 1); Sh.tG = at(Sh, 'manila', 2.5); Sh.tP = at(Sh, 'philippines', 6); Sh.tS = at(Sh, 'silk', Sh.dur - 2); Sh.dur = Sh.end - Sh.start; },
    draw: (c, lt, u, Sh) => {
      // the map spans -180..180; draw the Pacific crossing as two legs that wrap around the edge
      const q = seg(lt, Sh.tG, Sh.tP + .5), back = seg(lt, Sh.tS - .5, Sh.dur);
      const a = route(c, [[-100, 17], [-120, 15], [-150, 14], [-179, 13]], Math.min(1, q * 2), '#c8ced6', 6);
      if (q > .5) { const b = route(c, [[179, 13], [160, 13], [135, 13], [121, 14.5]], (q - .5) * 2, '#c8ced6', 6); c.save(); c.translate(b[0], b[1]); X.ship(c, 0, 0, .12, '#f4ead4', true); c.restore(); } else if (q > 0) { c.save(); c.translate(a[0], a[1]); X.ship(c, 0, 0, .12, '#f4ead4', true); c.restore(); }
      if (back > 0) { route(c, [[121, 14.5], [140, 30], [170, 38], [179, 39]], Math.min(1, back * 2), '#c8282a', 4); if (back > .5) route(c, [[-179, 39], [-150, 38], [-125, 30], [-100, 17]], (back - .5) * 2, '#c8282a', 4); }
      const ac = WLL(-100, 17), ma = WLL(121, 14.5), cn = WLL(118, 26); H1.stamp(c, 'Acapulco', ac[0], ac[1], lt, Sh.tW + .3, { px: 18 }); H1.stamp(c, 'Manila', ma[0], ma[1], lt, Sh.tP, { px: 18, dy: 22 }); H1.stamp(c, 'China', cn[0], cn[1], lt, Sh.tS - .5, { px: 18 });
      mapCandle(c, lt);
    },
    over: [(c, lt) => coinCorner(c, lt, { shine: .6 }), (c, lt, u, Sh) => K.dateTag(c, 'FROM 1565', lt, { at: Sh.tG }), (c, lt, u, Sh) => K.card(c, 'MANILA GALLEONS', lt, { at: Sh.tG + .3, x: 380, y: 200, px: 54, rot: -3 }), (c, lt, u, Sh) => K.card(c, 'SILVER → \n← SILK + PORCELAIN', lt, { at: Sh.tS, x: 1500, y: 860, px: 44, rot: 3 })],
    sfx: [['west', 'whoosh_soft', .3], ['manila', 'pop', .35], ['philippines', 'pop', .35], ['silk', 'chime', .35]] },

  // 3.05 CU: the piece of eight spins big in the middle; the world lights up where it was spent; it becomes the dollar
  { set: 'world', cam: { z: [1.0, 1.08], x: [640, 640], y: [360, 360], ease: E.sine }, bed: [['drone', .2]], sub: 'bottom',
    init: Sh => { Sh.tE = at(Sh, 'piece of eight', 2); Sh.tC = at(Sh, 'china', 4); Sh.tG = at(Sh, 'global', 6.5); Sh.tD = at(Sh, 'dollar', Sh.dur - 1.5); Sh.dur = Sh.end - Sh.start; },
    draw: (c, lt, u, Sh) => {
      c.fillStyle = 'rgba(30,20,10,.35)'; c.fillRect(0, 0, 1280, 720);
      const g = seg(lt, Sh.tC - .3, Sh.tG + .5);
      for (const [i, lon, lat] of [[0, 116, 39], [1, 121, 14], [2, 0, 45], [3, -3, 40], [4, 28, 41], [5, 72, 19], [6, -74, 41], [7, -77, -12], [8, -99, 19], [9, 18, -33]]) { const q = seg(lt, Sh.tC - .3 + i * .3, Sh.tC + i * .3); if (q <= 0) continue; const p = WLL(lon, lat); VP.glow(c, p[0], p[1], 40, '#e8eef8', .6 * q * (.7 + .3 * Math.sin(lt * 4 + i))); c.fillStyle = '#e8eef8'; c.beginPath(); c.arc(p[0], p[1], 4 * q, 0, TAU); c.fill(); }
      mapCandle(c, lt);
    },
    over: [(c, lt) => coinCorner(c, lt, { shine: .6 }), (c, lt, u, Sh) => { const q = E.out(seg(lt, Sh.tE - .6, Sh.tE + .4)); if (q > 0) H.coin(c, 960, 520, 220 * q, lt, { shine: .9, spin: lt * 1.2 }); }, (c, lt, u, Sh) => K.card(c, 'PIECE OF EIGHT', lt, { at: Sh.tE + .3, x: 960, y: 200, px: 56 }), (c, lt, u, Sh) => K.badge(c, 'ONE OF THE FIRST GLOBAL CURRENCIES', lt, { at: Sh.tG, until: Sh.tD - .3 }), (c, lt, u, Sh) => K.card(c, '$ = THE SPANISH DOLLAR', lt, { at: Sh.tD + .2, x: 960, y: 880, px: 56, rot: -2 })],
    sfx: [['piece of eight', 'coins', .4], ['china', 'pop', .3], ['global', 'chime', .35], ['dollar', 'stamp', .45]] },

  // 3.06 MED: a Spanish market; prices climb on a board while coins pour in; a merchant shrugs at empty workshops
  { set: 'market', cam: { z: [1.35, 1.55], x: [620, 660], y: [440, 460], ease: E.sine }, bed: [['crowd_loop', .2]],
    init: Sh => { Sh.tP = at(Sh, 'prices', 2.5); Sh.tC = at(Sh, 'century', 4.5); Sh.tB = at(Sh, 'build', Sh.dur - 1.2); Sh.dur = Sh.end - Sh.start; },
    draw: (c, lt, u, Sh) => {
      const L = VP.light('golden', lt, { swing: 5, set: { L: [-.6, -1] } }), sh = VP.shadowOf(L, 1.2, .3, .12);
      // the price board
      const p = E.io(seg(lt, Sh.tP - .5, Sh.tC + 1)), price = Math.round(lerp(1, 4, p) * 10) / 10;
      c.fillStyle = '#3a2a1a'; c.fillRect(560, 340, 200, 130); c.fillStyle = '#2a3a2a'; c.fillRect(570, 350, 180, 110); c.font = '22px Caveat'; c.fillStyle = '#f0f0e0'; c.textAlign = 'center'; c.fillText('BREAD', 660, 380); c.font = '44px Anton'; c.fillStyle = p > .6 ? '#ff8a6a' : '#f0f0e0'; c.fillText('×' + price.toFixed(1), 660, 435);
      c.strokeStyle = '#ff8a6a'; c.lineWidth = 4; c.beginPath(); for (let i = 0; i <= 20; i++) { const x = 580 + i * 8, y = 452 - 40 * Math.pow(i / 20, 1.3) * p; i ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke();
      for (let k = 0; k < 14; k++) { const r = S.rng(k + 80), ph = (lt * .8 + r()) % 1, x = 300 + r() * 120, y = 300 + ph * 330; c.fillStyle = S.rgba('#d8dce4', 1 - ph * .3); c.beginPath(); c.ellipse(x, y, 7, 7 * Math.abs(Math.cos(lt * 6 + k)) + 1, 0, 0, TAU); c.fill(); }
      c.fillStyle = '#9aa0a8'; c.beginPath(); c.ellipse(360, 640, 90, 22, 0, 0, TAU); c.fill(); S.dabs(c, { x: 270, y: 618, w: 180, h: 40, n: 40, cols: ['#d8dce4', '#7a808c'], r0: 4, r1: 9, a0: .6, a1: 1, seed: 81 });
      const shrug = seg(lt, Sh.tB - .5, Sh.tB + .3);
      VP.figure(c, [880, 660], sh, cc => S.person(cc, Object.assign({}, C.BANKER), 880, 660, 40, Object.assign(S.idle(lt, 0), { face: -1, shN: 30 + 60 * shrug, elN: 90 * shrug + 20, shF: 30 + 60 * shrug, elF: 90 * shrug + 20 }), { blink: S.blinkAt(lt, 0), worry: .5 * p, look: [-.8, -.2], time: lt }, L));
      for (const [x, k] of [[1000, 1], [1080, 2]]) VP.figure(c, [x, 670], sh, cc => S.person(cc, k === 1 ? CH.aisha : C.SAILOR, x, 670, 34, Object.assign(S.idle(lt, k), { face: -1 }), { blink: S.blinkAt(lt, k), angry: .5 * p, look: [-.8, -.3], time: lt }, L));
      VP.motes(c, lt, 0, 300, 1280, 400, { n: 25, a: .3 });
    },
    over: [(c, lt) => coinCorner(c, lt, { shine: .5 }), (c, lt, u, Sh) => K.badge(c, 'PRICES ROSE FOR 100 YEARS', lt, { at: Sh.tC, until: Sh.tB - .5 }), (c, lt, u, Sh) => K.card(c, 'RICH, BUT\nBUILT LITTLE', lt, { at: Sh.tB, x: 1540, y: 200, px: 52, rot: 3 })],
    sfx: [['prices', 'tick', .3], ['century', 'riser', .3], ['build', 'thud', .35]] },
];
VP.build(); K.boot();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><title>JP act 4 - The Plan and the Piggy Bank</title>
<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/vp/engine.js"></script><script src="../../../../shared/vp/cast.js"></script><script src="../../../../shared/vp/scenes.js"></script><script src="../../../../shared/vp/spain.js"></script>
<script src="../../../../shared/kit.js"></script><script src="../../../../shared/vp.js"></script>
<script src="../../../../spain-1-al-andalus/production/es1_sets.js"></script><script src="../../../../spain-1-al-andalus/production/es1_sets_act1.js"></script><script src="../../../../spain-1-al-andalus/production/es1_cast.js"></script>
<script src="../../../../spain-3-civil-war/production/es3_cast.js"></script>
<script src="../../jp_cast.js"></script><script src="../../jp_sets.js"></script><script src="../../jp_sets_act1.js"></script><script src="../../jp_sets_act2.js"></script><script src="../../jp_sets_act3.js"></script><script src="../../jp_sets_act4.js"></script>
<script src="timing.js"></script>
<script>
const K = KIT, E = K.E, J = S.JP, JX = S.JPX, H1 = S.ES1H, TAU = Math.PI * 2;
const at = VP.at, seg = K.seg, lerp = K.lerp;
const GREY = lt => VP.light('studio', lt, { swing: 3, set: { L: [.6, -.9], amb: '#4a4a52', ambA: .35, rim: '#e0d8d0', rimA: .5, tint: '#c8c4c0', tintA: .12 } });
const DUSK = lt => VP.light('studio', lt, { swing: 3, set: { L: [-.8, -.4], amb: '#3a2a3a', ambA: .4, rim: '#ffa060', rimA: .9, tint: '#ff9a60', tintA: .12 } });
const BULB = lt => VP.light('studio', lt, { swing: 6, set: { L: [.2, -1], amb: '#2a2018', ambA: .45, rim: '#ffd890', rimA: .9, tint: '#ffc870', tintA: .14 } });
const DAY = lt => VP.light('studio', lt, { swing: 3, set: { L: [.7, -.8], amb: '#6a7a8a', ambA: .18, rim: '#fff8e8', rimA: .7, tint: '#fff4e0', tintA: .05 } });
const night = (c, a, col) => { c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = `rgba(${col},${a})`; c.fillRect(0, 0, 1280, 720); c.restore(); };
const fig = (c, ch, x, y, uu, pose, face, L, k = 0) => { S.contact(c, x, y, uu * .9, .35); VP.figure(c, [x, y], { k: .6, sy: -.2, a: .3, blur: 3 }, cc => S.person(cc, ch, x, y, uu, pose, Object.assign({ blink: S.blinkAt(face.time || 0, k) }, face), L)); };
const hold = (fn) => fn;
const WARM = lt => VP.light('studio', lt, { swing: 3, set: { L: [.5, -.8], amb: '#3a2a20', ambA: .25, rim: '#ffe0b0', rimA: .8, tint: '#ffd8a0', tintA: .1 } });
const NITE = lt => VP.light('studio', lt, { swing: 3, set: { L: [.3, -1], amb: '#1a2238', ambA: .5, rim: '#ffd890', rimA: .9, tint: '#ffc870', tintA: .12 } });
const AS = JX.ASIA, AL = JX.AL;
// the income line on the chart board of jp_podium: x 800..1150, y 350 (1x) .. 130 (2x)
const plan = (c, q, fast, col = '#c82020') => { c.save(); c.strokeStyle = S.rgba('#2a2a2a', .5); c.setLineDash([8, 6]); c.lineWidth = 2; c.beginPath(); c.moveTo(800, 150); c.lineTo(1150, 150); c.stroke(); c.setLineDash([]); c.fillStyle = '#2a2a2a'; c.font = 'bold 18px Oswald'; c.fillText('×2', 1110, 142); c.fillText('1960', 790, 372); c.fillText('1970', 1120, 372);
  c.strokeStyle = col; c.lineWidth = 6; c.lineCap = 'round'; c.beginPath(); const end = fast ? .7 : 1; for (let i = 0; i <= 40; i++) { const f = i / 40 * end; if (f > q * end) break; const x = 800 + f * 350, y = 320 - 170 * Math.min(1, f / end) * (fast ? 1 : 1) + 4 * Math.sin(i * 1.3); i ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke(); c.restore(); };
const coin = (c, x, y, r = 7) => { c.fillStyle = '#d8b040'; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); c.strokeStyle = '#8a6a1a'; c.lineWidth = 1.5; c.beginPath(); c.arc(x, y, r * .6, 0, TAU); c.stroke(); };
const ltrain = (c, x, y, s, cars = 4) => { c.save(); c.translate(x, y); c.scale(s, s); for (let k = 0; k < cars; k++) { const x0 = -k * 250; c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(x0 - 240, 0, 236, 8); c.fillStyle = k ? '#c86a2a' : '#c86a2a'; c.fillRect(x0 - 240, -120, 236, 112); c.fillStyle = '#e8c890'; c.fillRect(x0 - 240, -60, 236, 14); c.fillStyle = '#3a2a1a'; c.fillRect(x0 - 240, -8, 236, 8);
    for (let w = 0; w < 6; w++) { c.fillStyle = '#c8dce4'; c.fillRect(x0 - 228 + w * 38, -108, 28, 36); c.fillStyle = S.rgba('#2a2a2a', .5); c.beginPath(); c.arc(x0 - 214 + w * 38, -84, 7, 0, TAU); c.fill(); } for (const wx of [x0 - 210, x0 - 40]) { c.fillStyle = '#1a1a1a'; c.beginPath(); c.arc(wx, 0, 14, 0, TAU); c.fill(); } }
  c.fillStyle = '#f4ecd8'; c.fillRect(-230, -150, 210, 26); c.fillStyle = '#c82020'; c.font = 'bold 18px Oswald'; c.fillText('集団就職 列車 · FOR TOKYO', -224, -131); c.restore(); };

window.SHOTS = [
  // 4.01 Ikeda at the podium; the chart behind him: incomes doubled in ten years
  { set: 'jp_podium', cam: { z: [1.05, 1.15], x: [700, 760], y: [360, 340], ease: E.io }, bed: [['crowd_loop', .06]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tD = at(Sh, 'double', 3); Sh.tF = at(Sh, 'fantasy', Sh.dur - 1.2); },
    draw: (c, lt, u, Sh) => {
      plan(c, E.io(seg(lt, Sh.tD - .2, Sh.tD + 3)), false);
      const L = WARM(lt); fig(c, J.IKEDA, 520, 600, 44, Object.assign(S.idle(lt * .3, 0), { face: 1, shN: 40 + 25 * Math.max(0, Math.sin(lt * 2)), elN: 60 }), { look: [-.2, .1], open: .25 + .2 * Math.sin(lt * 9), time: lt }, L, 0);
      c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(520, 628, 100, 12, 0, 0, TAU); c.fill(); JX.wood(c, 440, 480, 160, 146, '#6a4428', 41); c.fillStyle = '#4a2c18'; c.fillRect(428, 470, 184, 16); c.fillStyle = '#c8a040'; c.beginPath(); c.arc(520, 540, 18, 0, TAU); c.fill(); c.strokeStyle = '#8a6a1a'; c.lineWidth = 2; c.beginPath(); c.arc(520, 540, 11, 0, TAU); c.stroke();
      if (lt > Sh.tF - .3) { fig(c, J.SALARY2, 340, 690, 46, Object.assign(S.idle(lt * .3, 1), { face: 1, shN: 10, elN: 20 }), { look: [.6, -.3], worry: .3, raise: .6, time: lt }, L, 1); }
    },
    over: [(c, lt) => K.dateTag(c, 'DECEMBER 1960', lt, { at: .3 }), (c, lt) => K.card(c, 'HAYATO IKEDA', lt, { at: 1, x: 380, y: 200, px: 44, rot: -3 }), (c, lt, u, Sh) => K.badge(c, 'INCOME-DOUBLING PLAN', lt, { at: Sh.tD }), (c, lt, u, Sh) => K.card(c, 'CRITICS: "A FANTASY"', lt, { at: Sh.tF, x: 420, y: 330, px: 40, rot: 2 })],
    sfx: [[.2, 'crowd_loop', .08], ['double', 'riser', .35], ['fantasy', 'scrape', .3]] },

  // 4.02 schools: a lab of students with test tubes, then a packed engineering lecture
  { set: 'jp_lab', cam: { z: [1.05, 1.15], x: [640, 640], y: [380, 400], ease: E.io }, bed: [['office_loop', .08]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tS = at(Sh, 'schools', 3); Sh.tU = at(Sh, 'universities', 5); },
    draw: (c, lt, u, Sh) => {
      const L = DAY(lt); JX.wood(c, 200, 560, 880, 24, '#4a3424', 43); c.fillStyle = '#2a1a10'; c.fillRect(220, 584, 16, 90); c.fillRect(1044, 584, 16, 90);
      for (let k = 0; k < 6; k++) { const x = 260 + k * 140; c.fillStyle = S.rgba(['#a8e0c0', '#f0c890', '#c8a8e8'][k % 3], .85); c.fillRect(x, 520, 14, 40); c.fillStyle = S.rgba('#ffffff', .6); c.fillRect(x + 2, 522, 3, 30); if (lt > Sh.tS && k % 2) { const q = ((lt * .8 + k) % 1); c.fillStyle = `rgba(255,255,255,${.5 * (1 - q)})`; c.beginPath(); c.arc(x + 7, 516 - q * 30, 4 + q * 6, 0, TAU); c.fill(); } }
      [[J.STUDENT, 330], [J.SCHOOLGIRL, 500], [J.STUDENT, 690], [J.SCHOOLGIRL2, 860], [J.TEEN, 1010]].forEach(([ch, x], k) => fig(c, ch, x, 690, 44, Object.assign(S.idle(lt * .3, k), { face: k % 2 ? -1 : 1, shN: 40 + 10 * Math.sin(lt * 2 + k), elN: 70, holdN: k % 2 ? null : wr => { c.fillStyle = S.rgba('#a8d0e8', .9); c.fillRect(wr[0] - 3, wr[1] - 20, 7, 22); } }), { look: [k % 2 ? -.4 : .4, .5], smile: .3, time: lt }, L, k));
    },
    over: [(c, lt, u, Sh) => K.badge(c, 'ROADS · PORTS · RAILWAYS · SCHOOLS', lt, { at: .8, until: Sh.tU }), (c, lt, u, Sh) => K.card(c, 'SCIENCE + ENGINEERING PLACES GROW FAST', lt, { at: Sh.tU + .2, x: 960, y: 200, px: 40, rot: -2 })],
    sfx: [['roads', 'tick', .25], ['schools', 'chime', .3], ['universities', 'paper', .3]] },

  // 4.03 Hana in her sailor uniform walks through the school gate with friends
  { set: 'jp_gate', cam: (lt, u, Sh) => ({ z: [lerp(1.0, 1.12, E.io(seg(lt, 0, Sh.dur)))], x: [lerp(560, 680, E.io(seg(lt, 0, Sh.dur)))], y: [380] }), bed: [['birds_loop', .12]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.t50 = at(Sh, 'fewer than half', 2); Sh.t75 = at(Sh, 'nine in ten', 6); },
    draw: (c, lt, u, Sh) => {
      const L = DAY(lt); [[J.SCHOOLGIRL, -100], [J.SCHOOLGIRL2, -230], [J.STUDENT, -360]].forEach(([ch, x0], k) => { const x = x0 + lt * 95; fig(c, ch, x, 650 + k * 8, 44, Object.assign(H1.walk(lt * 1.0 + k * .3), { face: 1 }), { smile: .6, look: [.8, 0], time: lt }, L, k); });
    },
    over: [(c, lt, u, Sh) => K.badge(c, 'HIGH SCHOOL · 1950: ~43%', lt, { at: Sh.t50, until: Sh.t75 }), (c, lt, u, Sh) => K.card(c, 'MID-1970s: ~92%', lt, { at: Sh.t75, x: 1420, y: 220, px: 56, rot: -3 })],
    sfx: [[.2, 'birds_loop', .1], [.5, 'footsteps', .3], ['nine in ten', 'chime', .4]] },

  // 4.04 the "golden eggs": a train from the rice country; Kenji with a small suitcase, his mother waves
  { set: 'jp_platform', cam: { z: [1.05, 1.12], x: [640, 620], y: [400, 410], ease: E.io }, bed: [['wind_loop', .08]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tB = at(Sh, 'trains', 2.5); Sh.tG = at(Sh, 'golden eggs', Sh.dur - 1.5); },
    draw: (c, lt, u, Sh) => {
      const q = E.io(seg(lt, 0, Sh.tB + .5)); ltrain(c, lerp(1900, 1180, q), 474, 1, 5);
      const L = DAY(lt), board = E.io(seg(lt, Sh.tB + .8, Sh.tB + 2.4));
      fig(c, J.TEEN, lerp(560, 760, board), lerp(660, 640, board), 42, Object.assign(board > 0 && board < 1 ? H1.walk(lt) : S.idle(lt * .3, 0), { face: 1, holdF: wr => { c.fillStyle = '#7a5a3a'; c.fillRect(wr[0] - 18, wr[1] - 2, 36, 26); c.fillStyle = '#4a3020'; c.fillRect(wr[0] - 6, wr[1] - 6, 12, 4); } }), { look: [-.6, 0], worry: .3, time: lt }, L, 0);
      fig(c, J.MOTHER64, 380, 676, 42, Object.assign(S.idle(lt * .3, 1), { face: 1, shN: 150, elN: 40 + 25 * Math.sin(lt * 7) }), { smile: .3, worry: .5, look: [.8, 0], time: lt }, L, 1);
    },
    over: [(c, lt) => K.dateTag(c, 'TOHOKU · 1960s', lt, { at: .3 }), (c, lt, u, Sh) => K.card(c, '"GOLDEN EGGS"', lt, { at: Sh.tG, x: 420, y: 230, px: 60, rot: -3 })],
    sfx: [[.2, 'run_steps', .2], ['trains', 'whoosh', .35], ['factories', 'footsteps', .25], ['golden eggs', 'chime', .45]] },

  // 4.05 the mother counts coins at the low table and puts them in a post office savings book
  { set: 'jp_home', cam: { z: [1.3, 1.4], x: [520, 540], y: [460, 470], ease: E.io }, bed: [['night_loop', .08]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tO = at(Sh, 'no oil', 3.5); Sh.tF = at(Sh, 'families', Sh.dur - 1); },
    draw: (c, lt, u, Sh) => {
      const L = WARM(lt); c.fillStyle = '#7a3a3a'; c.fillRect(500, 640, 120, 22); fig(c, J.MOTHER64, 560, 694, 46, Object.assign(VP.sit(J.MOTHER64, lt * .3, 0), { face: -1, shN: 60 + 15 * Math.sin(lt * 3), elN: 80 }), { look: [-.3, .7], smile: lt > Sh.tF ? .5 : .1, time: lt }, L, 0);
      c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(500, 668, 190, 12, 0, 0, TAU); c.fill(); JX.wood(c, 330, 600, 340, 22, '#5a3a20', 45); c.fillStyle = '#3a2414'; c.fillRect(346, 622, 14, 44); c.fillRect(640, 622, 14, 44);
      for (let k = 0; k < 6; k++) { const t0 = .5 + k * .6, gone = lt > t0 + 3; if (!gone) coin(c, 560 + (k % 3) * 18, 592 - Math.floor(k / 3) * 6, 7); }
      c.fillStyle = '#3a6a9a'; c.fillRect(420, 580, 70, 18); c.fillStyle = '#f4ecd8'; c.fillRect(424, 582, 62, 14); c.fillStyle = '#c82020'; c.font = 'bold 9px Oswald'; c.fillText('〒 貯金', 436, 593);
    },
    over: [(c, lt, u, Sh) => K.badge(c, 'NO OIL · NO COLONIES', lt, { at: Sh.tO, until: Sh.tF - .2 }), (c, lt, u, Sh) => K.card(c, 'FAMILIES', lt, { at: Sh.tF, x: 1420, y: 220, px: 64, rot: 2 })],
    sfx: [[.5, 'coins', .3], [2.5, 'coins', .25], ['families', 'chime', .4]] },

  // 4.06 coins flow out of homes into the post office, then along pipes into factories
  { set: 'jp_board', cam: { z: [1.0, 1.05], x: [640, 640], y: [360, 350], ease: E.io }, bed: [['hum_loop', .08]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tP = at(Sh, 'twenty percent', 4); Sh.tB = at(Sh, 'Banks', 6.5); },
    draw: (c, lt, u, Sh) => {
      const house = (x, y) => { c.fillStyle = '#c8a878'; c.fillRect(x - 26, y - 30, 52, 30); c.fillStyle = '#5a4a3a'; c.beginPath(); c.moveTo(x - 34, y - 28); c.lineTo(x, y - 54); c.lineTo(x + 34, y - 28); c.fill(); c.fillStyle = '#ffd870'; c.fillRect(x - 8, y - 22, 14, 12); };
      const H = []; for (let k = 0; k < 12; k++) { const x = 230 + (k % 3) * 90, y = 170 + Math.floor(k / 3) * 110; H.push([x, y]); house(x, y); }
      c.fillStyle = '#c84020'; c.fillRect(560, 250, 160, 130); c.fillStyle = '#f4ecd8'; c.font = 'bold 22px Oswald'; c.textAlign = 'center'; c.fillText('〒 POST', 640, 290); c.fillText('OFFICE', 640, 318); c.fillText('+ BANKS', 640, 346); c.textAlign = 'left';
      for (const [k, y] of [[0, 180], [1, 330], [2, 480]]) { c.fillStyle = '#5a5a60'; c.fillRect(960, y - 60, 150, 70); c.fillRect(1070, y - 110, 18, 60); c.fillStyle = '#ffd870'; for (let w = 0; w < 4; w++) c.fillRect(972 + w * 30, y - 40, 18, 14); if (lt > Sh.tB + 1) H1.smoke(c, 1079, y - 116, .6, lt + k, '200,196,190'); }
      c.strokeStyle = '#8a8a90'; c.lineWidth = 10; for (const y of [180, 330, 480]) { c.beginPath(); c.moveTo(720, 315); c.bezierCurveTo(840, 315, 840, y - 25, 960, y - 25); c.stroke(); }
      H.forEach(([x, y], k) => { for (let j = 0; j < 2; j++) { const q = ((lt * .35 + k * .13 + j * .5) % 1); if (lt < .5) return; coin(c, lerp(x, 600, E.io(q)), lerp(y - 15, 315, E.io(q)) - Math.sin(q * Math.PI) * 40, 6); } });
      if (lt > Sh.tB) for (const y of [180, 330, 480]) for (let j = 0; j < 4; j++) { const q = ((lt - Sh.tB) * .4 + j / 4) % 1, t = q, x = (1 - t) ** 3 * 720 + 3 * (1 - t) ** 2 * t * 840 + 3 * (1 - t) * t * t * 840 + t ** 3 * 960, yy = (1 - t) ** 3 * 315 + 3 * (1 - t) ** 2 * t * 315 + 3 * (1 - t) * t * t * (y - 25) + t ** 3 * (y - 25); coin(c, x, yy, 5); }
    },
    over: [(c, lt, u, Sh) => K.badge(c, 'HOUSEHOLD SAVINGS: 20%+', lt, { at: Sh.tP }), (c, lt, u, Sh) => K.card(c, 'LENT TO THE FACTORIES', lt, { at: Sh.tB + .4, x: 1420, y: 640, px: 40, rot: 2 })],
    sfx: [[.4, 'coins_cascade', .25], ['twenty percent', 'chime', .3], ['Banks', 'hum_loop', .15], ['factories', 'coins', .3]] },

  // 4.07 the line hits ×2 after seven years; Ikeda and the salarymen clap
  { set: 'jp_podium', cam: { z: [1.05, 1.12], x: [760, 800], y: [380, 370], ease: E.io }, bed: [['crowd_loop', .1]],
    init: Sh => { Sh.dur = Sh.end - Sh.start; Sh.tS = at(Sh, 'seven years', 2); },
    draw: (c, lt, u, Sh) => {
      const q = E.io(seg(lt, .2, Sh.tS + .4)); plan(c, q, true, '#2a8a3a'); if (q >= 1) { c.save(); c.translate(1045, 150); c.rotate(-.1); c.strokeStyle = '#c82020'; c.lineWidth = 4; c.beginPath(); c.ellipse(0, 0, 50, 26, 0, 0, TAU); c.stroke(); c.restore(); c.fillStyle = '#c82020'; c.font = 'bold 22px Oswald'; c.fillText('1967', 1020, 196); }
      const L = WARM(lt), cl = lt > Sh.tS ? 95 + 30 * Math.abs(Math.sin(lt * 9)) : 20;
      [[J.IKEDA, 640], [J.SALARY, 520], [J.SALARY2, 760]].forEach(([ch, x], k) => fig(c, ch, x, 660, 40, Object.assign(S.idle(lt * .3, k), { face: 1, shN: lt > Sh.tS ? 25 : 5, elN: cl, shF: lt > Sh.tS ? 25 : 5, elF: cl }), { smile: lt > Sh.tS ? .9 : .3, look: [.6, -.4], time: lt }, L, k));
    },
    over: [(c, lt, u, Sh) => K.card(c, 'DONE IN ABOUT 7 YEARS, NOT 10', lt, { at: Sh.tS + .3, x: 420, y: 200, px: 44, rot: -2 })],
    sfx: [['seven years', 'chime', .45], ['not ten', 'crowd_cheer', .3]] },
];
VP.build(); K.boot();
</script></body></html>

<script>
const K = KIT, E = K.E, X = S.SPX, CH = S.SPAIN, C = S.ES1, H = S.ES1H, TAU = Math.PI * 2;

const turb = (b, s, r) => X.turban({ base: '#f2ecdc', shade: '#aca288', rim: '#ffffff' }, { base: b, shade: s, rim: r });

const SULTAN = Object.assign({}, CH.boabdil, { name: 'Abu al-Hasan', build: 'elder', hairCol: X.HR.grey, beard: true, shirt: ['#7a2a3a', '#3a1018'], long: true, mundu: false, headwear: turb('#7a2a3a', '#3a1018', '#e0a0b0') });

const BLACK = ['#2c2424', '#0e0a0a'], WHITE = ['#ece6dc', '#a8a096'], BAY = ['#7a4a2e', '#3a2014'];
const NTACK = { cloth: ['#2f6b4a', '#173a28'], trim: '#d8b060', reins: 1 }, CTACK = { cloth: ['#b8282a', '#5a1010'], trim: '#d8b060', reins: 1 };

const sword = (cc, wr, uu, ang = -.4) => { cc.save(); cc.translate(wr[0], wr[1]); cc.rotate(ang); cc.fillStyle = '#d8dce4'; cc.fillRect(-uu * .04, -uu * 1.6, uu * .08, uu * 1.6); cc.fillStyle = '#8a6a2a'; cc.fillRect(-uu * .2, -uu * .05, uu * .4, uu * .08); cc.restore(); };
const P = (lo, la) => X.LL(lo, la);
const mapCandle = (c, lt) => { const f = VP.flicker(lt, 3); VP.glow(c, 420 + 80 * Math.sin(lt * .35), 260 + 30 * Math.sin(lt * .5), 520, '#ffcf80', .14 + .1 * f);
  c.save(); c.globalCompositeOperation = 'multiply'; const vg = c.createRadialGradient(640, 380, 200, 640, 380, 820); vg.addColorStop(0, 'rgba(255,255,255,0)'); vg.addColorStop(1, `rgba(60,30,10,${.5 - .1 * f})`); c.fillStyle = vg; c.fillRect(0, 0, 1280, 720); c.restore(); };
const GRANADA_POLY = [[-5.4, 36.15], [-4.4, 36.7], [-3.5, 36.7], [-2.2, 36.75], [-1.7, 37.2], [-2.3, 37.6], [-3.1, 37.6], [-3.8, 37.4], [-4.6, 37.2], [-5.2, 36.8]];

window.SHOTS = [
  // 1 MAP: one small green patch left in the south; the counter ticks to 1250
  { set: 'map', cam: { z: [1.1, 1.8], x: [600, 470], y: [400, 560], ease: E.io }, bed: [['drone', .25]], sub: 'bottom',
    init: Sh => { Sh.tG = at(Sh, 'emirate of granada', 3); },
    draw: (c, lt, u, Sh) => {
      c.save(); c.clip(S.poly(X.IBERIA, false)); c.fillStyle = S.rgba('#b8282a', .25); c.fillRect(0, 0, 1280, 720); c.restore();
      const gp = S.poly(GRANADA_POLY.map(q => P(q[0], q[1])), false), pul = .5 + .1 * Math.sin(lt * 3);
      c.fillStyle = S.rgba('#2f7a3a', pul); c.fill(gp); c.strokeStyle = '#1e5a2a'; c.lineWidth = 3; c.stroke(gp);
      VP.glow(c, P(-3.6, 37.18)[0], P(-3.6, 37.18)[1], 90, '#8aff9a', .2 * seg(lt, Sh.tG - .5, Sh.tG + .5));

    over: [(c, lt) => { c.save(); c.globalAlpha = seg(lt, .2, .6); K.outlined(c, '1250', 1640, 150, 120, { fill: '#ffd27a' }); K.outlined(c, 'AD', 1640, 238, 40, { fam: 'Oswald' }); c.restore(); }, (c, lt, u, Sh) => K.card(c, 'EMIRATE OF\nGRANADA', lt, { at: Sh.tG + .2, x: 1540, y: 460, px: 54, rot: -3 })],
    sfx: [[.2, 'paper', .4], ['emirate of granada', 'chime', .45]] },

  // 2 WIDE: the Alhambra under the snowy Sierra Nevada; a cut into the Court of the Lions, the fountain running
  { set: 'dawn', cam: { z: [1.85, 1.45], x: [420, 600], y: [800, 790], ease: E.io }, bed: [['wind_loop', .2], ['birds_loop', .2]],

        VP.motes(c, lt, 0, 820, 1280, 400, { n: 30, a: .4 }); return; }

      c.save(); c.globalCompositeOperation = 'screen'; const x = 200 + lt * 10; const g = c.createLinearGradient(x, 0, x + 400, 0); g.addColorStop(0, 'rgba(255,240,200,0)'); g.addColorStop(.5, 'rgba(255,240,200,.18)'); g.addColorStop(1, 'rgba(255,240,200,0)'); c.fillStyle = g; c.fillRect(0, 100, 1280, 400); c.restore();
      VP.motes(c, lt, 0, 200, 1280, 500, { n: 40, a: .45 });
    },
    over: [(c, lt, u, Sh) => K.card(c, '~250 YEARS', lt, { at: .5, x: 1540, y: 200, px: 60, rot: 3, until: Sh.tB }), (c, lt, u, Sh) => K.badge(c, 'PAID TRIBUTE TO CASTILE', lt, { at: Sh.tT, until: Sh.tB }), (c, lt, u, Sh) => K.card(c, 'THE ALHAMBRA', lt, { at: Sh.tB + .3, x: 1540, y: 200, px: 64, rot: -3 })],
    sfx: [[.2, 'swell', .3], ['tribute', 'coins', .35], ['built the alhambra', 'chime', .45]] },

  // 3 MED: a small candlelit wedding in secret. Isabella, 18, and Ferdinand, 17, exchange rings
  { set: 'church', cam: { z: [1.6, 2.0], x: [640, 640], y: [420, 380], ease: E.sine }, bed: [['drone', .15]],
    init: Sh => { Sh.tS = at(Sh, 'in secret', 1.5); Sh.tI = at(Sh, 'isabella', 3); Sh.tF = at(Sh, 'ferdinand', 5); Sh.tT = at(Sh, 'together', Sh.dur - 2.5); Sh.dur = Sh.end - Sh.start; },
    draw: (c, lt, u, Sh) => {

      const f = VP.flicker(lt, 4); for (const [x, y, i] of [[560, 456, 0], [720, 456, 1], [640, 440, 2]]) { H.fire(c, x, y, .12, lt, i + 20); c.fillStyle = '#f0e6d0'; c.fillRect(x - 4, y, 8, 30); }

      const L = { L: [.45, -.9], amb: '#3a2a40', ambA: .28, rim: '#ffc880', rimA: 1, tint: '#ffa050', tintA: .14, sw: .2, rw: .05 }, ring = seg(lt, Sh.tF + .5, Sh.tF + 1.5);
      S.person(c, PRIEST, 640, 600, 38, Object.assign(S.idle(lt, 2), { face: 1, shN: 60, elN: 50 }), { blink: S.blinkAt(lt, 2), time: lt }, L);
      VP.figure(c, [530, 650], { k: -.3, sy: -.2, a: .4, blur: 3 }, cc => S.person(cc, ISABELLA, 530, 650, 50, Object.assign(S.idle(lt, 0), { face: 1, shN: 40 + 40 * ring, elN: 40 }), { blink: S.blinkAt(lt, 0), smile: .4, look: [.8, 0], time: lt }, L));
      VP.figure(c, [750, 650], { k: .3, sy: -.2, a: .4, blur: 3 }, cc => S.person(cc, FERDINAND, 750, 650, 50, Object.assign(S.idle(lt, 1), { face: -1, shN: 40 + 40 * ring, elN: 40 }), { blink: S.blinkAt(lt, 1), smile: .4, look: [-.8, 0], time: lt }, L));
      if (ring > 0) VP.glow(c, 640, 470, 30, '#ffe08a', .7 * pulse(lt, Sh.tF + 1, 1.4));
      // a guard at the door keeps watch: it is a secret
      c.fillStyle = S.rgba('#ffd090', .15 * (.6 + .4 * f)); c.fillRect(1000, 250, 120, 350);
      VP.motes(c, lt, 400, 300, 500, 300, { n: 30, a: .5 });
    },
    over: [(c, lt) => K.dateTag(c, 'VALLADOLID · 1469', lt, { at: .4 }), (c, lt, u, Sh) => K.card(c, 'ISABELLA · 18\nHEIR TO CASTILE', lt, { at: Sh.tI + .2, x: 330, y: 220, px: 42, rot: -3 }), (c, lt, u, Sh) => K.card(c, 'FERDINAND · 17\nHEIR TO ARAGON', lt, { at: Sh.tF + .2, x: 1560, y: 220, px: 42, rot: 3 }), (c, lt, u, Sh) => K.card(c, 'CASTILE + ARAGON', lt, { at: Sh.tT, x: 960, y: 880, px: 56, rot: -2 })],
    sfx: [['in secret', 'whoosh_soft', .3], ['isabella', 'pop', .35], ['ferdinand', 'pop', .35], ['together', 'chime', .45]] },

  // 4 MED: inside the Alhambra, Boabdil argues with his father the sultan; guards draw swords
  { set: 'nasrid', cam: (lt, u, Sh) => ({ z: [lerp(1.4, 1.7, E.io(u))], x: [640], y: [440], shake: pulse(lt, Sh.tR + .2, .5) * 3 }), bed: [['tension', .25]],
    init: Sh => { Sh.tW = at(Sh, 'war', 1.5); Sh.tS = at(Sh, 'split', 4); Sh.tR = at(Sh, 'rebelled', 6.5); Sh.dur = Sh.end - Sh.start; },
    draw: (c, lt, u, Sh) => {
      const L = DAYL({ L: [.2, -1], tint: '#ffd8a0' }), draw_ = seg(lt, Sh.tR - .2, Sh.tR + .4), talk = k => .4 * Math.abs(Math.sin(lt * 10 + k)) * (Math.sin(lt * 1.6 + k * 3) > 0);
      c.save(); c.globalCompositeOperation = 'screen'; const g = c.createLinearGradient(600, 200, 700, 640); g.addColorStop(0, 'rgba(255,240,200,.35)'); g.addColorStop(1, 'rgba(255,240,200,0)'); c.fillStyle = g; c.beginPath(); c.moveTo(580, 190); c.lineTo(700, 190); c.lineTo(820, 640); c.lineTo(520, 640); c.fill(); c.restore();
      VP.figure(c, [500, 640], { k: -.4, sy: -.22, a: .35, blur: 2 }, cc => S.person(cc, BOABDIL, 500, 640, 48, Object.assign(S.idle(lt, 0), { face: 1, lean: 6, shN: 60 + 30 * Math.sin(lt * 2), elN: 50 }), { blink: S.blinkAt(lt, 0), angry: .8, open: talk(0), look: [.8, 0], time: lt }, L));
      VP.figure(c, [780, 640], { k: .4, sy: -.22, a: .35, blur: 2 }, cc => S.person(cc, SULTAN, 780, 640, 48, Object.assign(S.idle(lt, 1), { face: -1, shN: 80 + 20 * Math.sin(lt * 2.4), elN: 30 }), { blink: S.blinkAt(lt, 1), angry: .9, open: talk(1), look: [-.8, 0], time: lt }, L));
      for (const [x, k, ch] of [[300, 2, GRANADAN], [980, 3, C.BERBER]]) VP.figure(c, [x, 650], { k: x < 640 ? -.5 : .5, sy: -.22, a: .35, blur: 2 }, cc => S.person(cc, ch, x, 650, 44, Object.assign(S.idle(lt, k), { face: x < 640 ? 1 : -1, shN: 40 + 70 * draw_, elN: 40 - 30 * draw_, holdN: wr => sword(cc, wr, 44, x < 640 ? .9 - 1.2 * draw_ : -.9 + 1.2 * draw_) }), { angry: .6, blink: S.blinkAt(lt, k), time: lt }, L));
    },
    over: [(c, lt) => K.dateTag(c, 'THE GRANADA WAR · 1482', lt, { at: .4 }), (c, lt, u, Sh) => K.card(c, 'SON vs FATHER', lt, { at: Sh.tR + .2, x: 1540, y: 200, px: 60, rot: 3 })],
    sfx: [['war', 'hit', .4], ['split', 'paper_tear', .4], ['rebelled', 'scrape', .5]] },

  // 5 MED: Boabdil in chains before Ferdinand; then freed, riding home with a Castilian escort while towns fall one by one
  { set: 'tent', cam: (lt, u, Sh) => lt < Sh.tG ? { z: [1.45], x: [640], y: [420] } : { z: [1.1], x: [640], y: [400] }, bed: [['wind_loop', .2]],
    init: Sh => { Sh.tC = at(Sh, 'captured', 1); Sh.tG = at(Sh, 'let him go', 3.5); Sh.tW = at(Sh, 'civil war', 6); Sh.tT = at(Sh, 'one by one', Sh.dur - 1); Sh.dur = Sh.end - Sh.start; },
    draw: (c, lt, u, Sh) => {
      if (lt < Sh.tG) { const L = { L: [1, -.6], amb: '#3a2a3a', ambA: .4, rim: '#fff0d0', rimA: .9, tint: '#ffd8a0', tintA: .12, sw: .3, rw: .05 };
        VP.figure(c, [760, 640], { k: -.4, sy: -.22, a: .35, blur: 2 }, cc => S.person(cc, FERDINAND_K, 760, 640, 48, Object.assign(S.idle(lt, 0), { face: -1, shN: 40, elN: 50 }), { blink: S.blinkAt(lt, 0), smile: .3, look: [-.8, .2], time: lt }, L));
        VP.figure(c, [480, 650], { k: -.4, sy: -.22, a: .35, blur: 2 }, cc => S.person(cc, BOABDIL, 480, 650, 46, Object.assign(S.idle(lt, 1), { face: 1, tilt: 8, lean: 6, shN: 10, elN: 80, shF: 10, elF: 80 }), { blink: S.blinkAt(lt, 1), worry: .9, look: [.6, .5], time: lt }, L));
        c.strokeStyle = '#5a5a60'; c.lineWidth = 4; c.beginPath(); for (let k = 0; k < 8; k++) { const x = 490 + k * 6, y = 470 + Math.sin(k + lt) * 3; k ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke();
        for (const x of [380, 870]) S.person(c, CASTILIAN, x, 650, 42, Object.assign(S.idle(lt, x), { face: x < 640 ? 1 : -1, shN: 30, elN: 40, holdN: wr => { c.strokeStyle = '#3a2a1a'; c.lineWidth = 3; c.beginPath(); c.moveTo(wr[0], wr[1] + 40); c.lineTo(wr[0], wr[1] - 120); c.stroke(); } }), { time: lt }, L);
        return; }
      VP.drawSet(c, 'santafe'); const L = VP.light('golden', lt, { swing: 4 }), q = seg(lt, Sh.tG, Sh.dur + 1);
      // Boabdil rides back toward Granada with Castilian riders; behind, small towns flip red one by one
      for (const [ch, col, tack, dx, uu] of [[CASTILIAN, BAY, CTACK, -150, 16], [BOABDIL, BLACK, NTACK, 0, 18], [CASTILIAN, BAY, CTACK, 150, 16]]) { const x = lerp(200, 900, q) + dx, y = 620 - Math.abs(dx) * .12; VP.figure(c, [x, y], { k: -.4, sy: -.2, a: .3, blur: 2 }, cc => VP.rider(cc, ch, x, y, uu, uu * 5, { face: 1, ph: lt * .8 + dx, walk: .8, t: lt, col, tack }, { lean: 2 }, { time: lt, worry: ch === BOABDIL ? .6 : 0 }, L)); }
      for (let k = 0; k < 5; k++) { const x = 820 + k * 90, y = 330 + (k % 2) * 8, fl = seg(lt, Sh.tW + k * .5, Sh.tW + k * .5 + .3); c.fillStyle = fl > 0 ? '#b8282a' : '#2f8a5a'; c.fillRect(x, y - 30, 3, 30); c.fillRect(x + 3, y - 30, 16 * (fl > 0 ? 1 : 1), 10); if (fl > 0 && fl < 1) VP.glow(c, x, y - 20, 30, '#ffb060', .6 * (1 - fl)); }
    },
    over: [(c, lt, u, Sh) => K.card(c, 'CAPTURED', lt, { at: Sh.tC + .2, x: 1540, y: 200, px: 60, rot: 3, until: Sh.tG }), (c, lt, u, Sh) => K.card(c, 'FREED, FOR A PRICE', lt, { at: Sh.tG + .4, x: 1520, y: 200, px: 50, rot: -3 }), (c, lt, u, Sh) => K.badge(c, 'GRANADA IN CIVIL WAR', lt, { at: Sh.tW })],
    sfx: [['captured', 'thud', .45], ['let him go', 'whoosh', .4], ['one by one', 'thud', .35]] },

  // 6 WIDE: Santa Fe, a whole stone town built on the plain; Isabella on horseback inspects it
  { set: 'santafe', cam: { z: [1.1, 1.5], x: [700, 420], y: [400, 470], ease: E.io }, bed: [['wind_loop', .2], ['city_loop', .1]],
    init: Sh => { Sh.tS = at(Sh, 'stone', 3); Sh.tN = at(Sh, 'santa fe', Sh.dur - 2.5); Sh.dur = Sh.end - Sh.start; },
    draw: (c, lt, u, Sh) => {
      const L = VP.light('golden', lt, { swing: 5 }), sh = VP.shadowOf(L, 1.4, .3, .12);
      // tents of the army around the town
      for (let k = 0; k < 12; k++) { const x = 70 + k * 100 + (k % 2) * 30, y = 570 + (k % 3) * 26, red = k % 3 === 0, s = .9 + (y - 570) / 120, tw = 34 * s, th = 40 * s;
        c.fillStyle = S.rgba('#3a2a14', .25); c.beginPath(); c.ellipse(x + 8, y + 2, tw * 1.1, 5 * s, 0, 0, TAU); c.fill();
        c.fillStyle = red ? '#b8282a' : '#ece2cc'; c.beginPath(); c.moveTo(x - tw, y); c.quadraticCurveTo(x - tw * .3, y - th * .55, x, y - th); c.quadraticCurveTo(x + tw * .3, y - th * .55, x + tw, y); c.fill();
        c.fillStyle = red ? '#7a1414' : '#b8ac94'; c.beginPath(); c.moveTo(x, y - th); c.quadraticCurveTo(x + tw * .3, y - th * .55, x + tw, y); c.lineTo(x + tw * .25, y); c.fill();
        if (!red) { c.fillStyle = S.rgba('#b8282a', .8); for (const f of [.35, .7]) c.fillRect(x - tw * (1 - f) , y - th * f - 2 * s, tw * 2 * (1 - f), 3 * s); }
        c.fillStyle = '#3a2418'; c.beginPath(); c.moveTo(x - 6 * s, y); c.lineTo(x, y - th * .45); c.lineTo(x + 6 * s, y); c.fill();
        c.strokeStyle = '#4a3a2a'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x, y - th); c.lineTo(x, y - th - 14 * s); c.stroke(); c.fillStyle = red ? '#e8c040' : '#b8282a'; c.beginPath(); c.moveTo(x, y - th - 14 * s); c.lineTo(x + 12 * s + 2 * Math.sin(lt * 3 + k), y - th - 11 * s); c.lineTo(x, y - th - 8 * s); c.fill();
        c.strokeStyle = S.rgba('#6a5a40', .6); c.lineWidth = 1; c.beginPath(); c.moveTo(x - tw * .5, y - th * .4); c.lineTo(x - tw * 1.4, y + 2); c.moveTo(x + tw * .5, y - th * .4); c.lineTo(x + tw * 1.4, y + 2); c.stroke(); }

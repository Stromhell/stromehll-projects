<!doctype html><html><head><meta charset="utf-8"><title>ES1 act 1 - Seven Thousand Men</title>
<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/vp/engine.js"></script><script src="../../../../shared/vp/cast.js"></script><script src="../../../../shared/vp/scenes.js"></script><script src="../../../../shared/vp/spain.js"></script>
<script src="../../../../shared/kit.js"></script><script src="../../../../shared/vp.js"></script><script src="../../es1_sets.js"></script><script src="../../es1_sets_act1.js"></script><script src="../../es1_cast.js"></script>
<script src="timing.js"></script>
<script>
const K = KIT, E = K.E, X = S.SPX, CH = S.SPAIN, C = S.ES1, H = S.ES1H, TAU = Math.PI * 2;
const at = VP.at, seg = K.seg, lerp = K.lerp, pulse = H.pulse, walk = H.walk;
const BLACK = ['#2c2424', '#0e0a0a'], GREY = ['#a49a90', '#5a524a'], BAY = ['#7a4a2e', '#3a2014'];
const GOTH_TACK = { cloth: ['#7a1e1a', '#3a0e0a'], trim: '#d8b060', reins: 1 };
const RODERIC_K = Object.assign({}, C.RODERIC, { headwear: X.crown });
// a parchment wash clipped to Iberia
const iberiaWash = (c, col, a, clip) => { c.save(); c.clip(S.poly(X.IBERIA, false)); if (clip) c.clip(clip); c.fillStyle = S.rgba(col, a); c.fillRect(0, 0, 1280, 720); S.dabs(c, { x: 0, y: 0, w: 1280, h: 720, n: 140, cols: [col, '#ffffff', '#3a2412'], r0: 10, r1: 34, sq: .5, a0: .08, a1: .22, seed: 7 }); c.restore(); };
const candle = (c, lt, x, y, a = .5, i = 0) => { const f = VP.flicker(lt, i); VP.glow(c, x, y - 8, 380, '#ffb860', (.2 + .1 * f) * a); VP.glow(c, x, y - 6, 18, '#fff2c0', .9);
  c.save(); c.globalCompositeOperation = 'multiply'; const vg = c.createRadialGradient(x, y, 120, x, y, 900); vg.addColorStop(0, 'rgba(255,255,255,0)'); vg.addColorStop(1, `rgba(40,20,10,${.6 - .08 * f})`); c.fillStyle = vg; c.fillRect(-200, -200, 1680, 1120); c.restore(); };
const torches = (c, lt, pts, dim = 1) => pts.map(([x, y], i) => { const f = VP.flicker(lt, i + 3); H.fire(c, x, y + 4, .35, lt, i); VP.glow(c, x, y + 30, 260, '#ff9a40', (.22 + .1 * f) * dim); return [x, y, f]; });
const lightFrom = (x, y, px, py, o = {}) => Object.assign({ L: [K.clamp((px - x) / 300, -1.5, 1.5), -1], amb: '#3a2a3a', ambA: .4, rim: '#ffc880', rimA: .9, tint: '#ff9a50', tintA: .14, sw: .3, rw: .05 }, o);
const sh2 = (px, x, a = .38) => ({ k: K.clamp((x - px) / 160, -2.5, 2.5), sy: -.22, a, blur: 2 });
const arrow = (c, pts, q, col, w) => { if (q <= 0) return; const n = pts.length - 1, s = q * n, i = Math.min(n - 1, Math.floor(s)), f = s - i; const tip = [lerp(pts[i][0], pts[i + 1][0], f), lerp(pts[i][1], pts[i + 1][1], f)];
  c.save(); c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let k = 1; k <= i; k++) c.lineTo(pts[k][0], pts[k][1]); c.lineTo(tip[0], tip[1]); c.stroke();
  const d = Math.atan2(tip[1] - pts[i][1], tip[0] - pts[i][0]); c.fillStyle = col; c.translate(tip[0], tip[1]); c.rotate(d); c.beginPath(); c.moveTo(w * 1.8, 0); c.lineTo(-w * 1.2, -w * 1.6); c.lineTo(-w * 1.2, w * 1.6); c.fill(); c.restore(); return tip; };
const mapCandle = (c, lt, x0, y0) => { const f = VP.flicker(lt, 3); VP.glow(c, x0 + 80 * Math.sin(lt * .35), y0 + 30 * Math.sin(lt * .5), 520, '#ffcf80', .14 + .1 * f);
  c.save(); c.globalCompositeOperation = 'multiply'; const vg = c.createRadialGradient(640, 380, 200, 640, 380, 820); vg.addColorStop(0, 'rgba(255,255,255,0)'); vg.addColorStop(1, `rgba(60,30,10,${.5 - .1 * f})`); c.fillStyle = vg; c.fillRect(0, 0, 1280, 720); c.restore(); };
const ink = (c, txt, x, y, a, px = 28) => { if (a <= 0) return; c.save(); c.globalAlpha = Math.min(1, a); c.font = `${px}px Caveat`; c.fillStyle = '#3a2412'; c.textAlign = 'center'; c.fillText(txt, x, y); c.restore(); };
const TOL = X.LL(-4.02, 39.86), COR = X.LL(-4.78, 37.88), SEV = X.LL(-5.98, 37.39), MER = X.LL(-6.34, 38.92), GIB = X.LL(-5.35, 36.14), COV = X.LL(-5.07, 43.31);

window.SHOTS = [
  // 1 MAP: Iberia around 700. Roman roads fade, an ochre Visigoth wash spreads, a crown drops onto Toledo
  { set: 'map', cam: { z: [1.05, 1.32], x: [640, 560], y: [380, 330], ease: E.io }, bed: [['drone', .22]], sub: 'bottom',
    init: Sh => { Sh.tV = at(Sh, 'visigoths', 4); Sh.tR = at(Sh, 'roman', 7); },
    draw: (c, lt, u, Sh) => {
      // Roman roads: dashed red lines that fade when the Visigoths arrive
      const ra = 1 - seg(lt, Sh.tR, Sh.tR + 2) * .8, roads = [[[-9.1, 38.7], [-6.34, 38.92], [-4.02, 39.86], [-3.7, 40.4], [2.17, 41.38]], [[-5.98, 37.39], [-4.78, 37.88], [-1.13, 37.98], [-0.37, 39.47], [2.17, 41.38]], [[-6.34, 38.92], [-5.66, 40.96], [-5.6, 42.6], [-8.4, 43.3]]];
      c.save(); c.globalAlpha = .75 * ra; c.strokeStyle = '#9a2a1a'; c.lineWidth = 2.5; c.setLineDash([6, 7]); c.lineDashOffset = -lt * 10; for (const r of roads) { c.beginPath(); r.forEach((q, i) => { const [x, y] = X.LL(q[0], q[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke(); } c.restore();
      const g = E.io(seg(lt, Sh.tV - .4, Sh.tV + 2.4)); if (g > 0) { const cl = new Path2D(); cl.ellipse(TOL[0], TOL[1], 900 * g, 700 * g, 0, 0, TAU); iberiaWash(c, '#c8862a', .42, cl); }
      // the crown falls on Toledo and bounces once
      const d = seg(lt, Sh.tV + 1.2, Sh.tV + 1.9), land = lt > Sh.tV + 1.9, b = land ? Math.abs(Math.sin((lt - Sh.tV - 1.9) * 9)) * Math.exp(-(lt - Sh.tV - 1.9) * 4) : 0;
      if (d > 0) { const y = land ? TOL[1] - 24 - b * 30 : lerp(-80, TOL[1] - 24, d * d); c.fillStyle = S.rgba('#2a1408', .3 * d); c.beginPath(); c.ellipse(TOL[0], TOL[1] + 4, 26, 6, 0, 0, TAU); c.fill();
        c.save(); c.translate(TOL[0], y); X.crown(c, 40, {}, S.LIGHT.golden, { tone: (col) => col, celT: (cc, p, t) => { cc.fillStyle = t.base; cc.fill(p); cc.strokeStyle = t.shade; cc.lineWidth = 2; cc.stroke(p); }, front: true }); c.restore();
        if (land) VP.glow(c, TOL[0], TOL[1] - 40, 70, '#ffe08a', .5 * pulse(lt, Sh.tV + 1.9, 1.2)); }
      ink(c, 'Toledo', TOL[0] + 4, TOL[1] + 34, seg(lt, Sh.tV + 2, Sh.tV + 2.6));
      ink(c, 'Atlantic', 170, 400, .7, 24); ink(c, 'Mediterranean', 1000, 560, .7, 24); ink(c, 'AFRICA', 640, 690, .7, 24);
      mapCandle(c, lt, 360, 220);
    },
    over: [(c, lt) => K.dateTag(c, 'AROUND AD 700', lt, { at: .5 }), (c, lt, u, Sh) => K.card(c, 'THE VISIGOTHS', lt, { at: Sh.tV + .2, x: 1540, y: 220, px: 60, rot: -3 })],
    sfx: [[.2, 'paper', .45], ['visigoths', 'whoosh_soft', .35], [6.2, 'thud', .3]] },

  // 2 WIDE -> MED: Toledo on its rock; cut inside the hall where nobles argue round an empty throne
  { cam: (lt, u, Sh) => lt < Sh.tK ? { z: [1.02 + .06 * lt / Sh.tK], x: [640], y: [360 - 20 * lt / Sh.tK] } : { z: [1.1 + .25 * E.sine(seg(lt, Sh.tK, Sh.dur))], x: [640], y: [450] },
    init: Sh => { Sh.tK = at(Sh, 'but the kingdom', 5); Sh.tF = at(Sh, 'fought', Sh.tK + 2); Sh.tM = at(Sh, 'murdered', Sh.tK + 4.5); Sh.dur = Sh.end - Sh.start; },
    bed: [['wind_loop', .2]],
    draw: (c, lt, u, Sh) => {
      if (lt < Sh.tK) { VP.drawSet(c, 'toledo'); VP.light('golden', lt, { swing: 6 });
        VP.clouds(c, lt, { y0: 40, y1: 260, a: .2, speed: 18, n: 4, seed: 11 });
        // cloud shadows sliding over the rock
        c.save(); c.globalCompositeOperation = 'multiply'; for (let k = 0; k < 3; k++) { const x = ((lt * 40 + k * 520) % 1700) - 300; const g = c.createRadialGradient(x, 420, 20, x, 420, 260); g.addColorStop(0, 'rgba(70,60,80,.35)'); g.addColorStop(1, 'rgba(70,60,80,0)'); c.fillStyle = g; c.fillRect(x - 300, 200, 600, 460); } c.restore();
        VP.glow(c, 1100, 120, 420, '#ffe0a0', .2); VP.rays(c, 1100, 100, lt, { ang: 2.4, spread: .12, n: 7, len: 1100, a: .04 });
        VP.banner(c, 572, 182, 30, 22, ['#8a1e1a', '#3a0a08'], lt, { Lt: S.LIGHT.golden, ph: 0 }); VP.banner(c, 726, 182, 30, 22, ['#8a1e1a', '#3a0a08'], lt, { Lt: S.LIGHT.golden, ph: 1 });
        VP.motes(c, lt, 0, 300, 1280, 400, { n: 30, a: .3 }); return; }
      const lt2 = lt - Sh.tK; VP.drawSet(c, 'hall');
      c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = S.rgba('#2a2040', .45); c.fillRect(0, 0, 1280, 720); c.restore();
      const T = torches(c, lt, VP.HALL_TORCHES, lt > Sh.tM ? .7 : 1);
      const bang = pulse(lt, Sh.tF, .5), shake = bang * 4 * Math.sin(lt * 60);
      const nob = [[C.NOBLE1, 420, 1, 0], [C.NOBLE2, 560, 1, 1], [C.NOBLE3, 760, -1, 2], [C.RODERIC, 900, -1, 3]];
      for (const [ch, x, face, i] of nob) { const y = 640, near = T.reduce((b, t) => Math.abs(t[0] - x) < Math.abs(b[0] - x) ? t : b), L = lightFrom(x, y, near[0], near[1]);
        const talk = (Math.sin(lt * 1.3 + i * 2) > .2) ? .4 * Math.abs(Math.sin(lt * 10 + i)) : 0, angry = .5 + .4 * Math.sin(lt * .7 + i);
        const fist = i === 2 && lt > Sh.tF - .5 && lt < Sh.tF + 1.4;
        const pose = Object.assign(S.idle(lt, i), { face, lean: 6 + 4 * Math.sin(lt + i), shN: fist ? 80 - 70 * seg(lt, Sh.tF - .4, Sh.tF) : 30 + 20 * Math.sin(lt * 2 + i), elN: fist ? 30 : 60 + 20 * Math.sin(lt * 1.6 + i) });
        VP.figure(c, [x, y], sh2(near[0], x), cc => S.person(cc, ch, x, y + shake * (i === 2 ? 0 : .3), 50, pose, { blink: S.blinkAt(lt, i), angry, open: talk, look: [face * .6, .1], time: lt }, L)); }
      // the table in front of them, with cups; one cup tips over on the bang
      c.fillStyle = '#4a2a18'; c.fillRect(260, 588 + shake, 760, 26); c.fillStyle = S.rgba('#ffd8a0', .25); c.fillRect(260, 588 + shake, 760, 4); c.fillStyle = '#2a1810'; c.fillRect(290, 614, 16, 90); c.fillRect(974, 614, 16, 90);
      for (const [x, k] of [[480, 0], [640, 1], [820, 2]]) { const tip = k === 1 ? E.out(seg(lt, Sh.tF, Sh.tF + .4)) : 0; c.save(); c.translate(x, 588 + shake); c.rotate(-tip * 1.4); c.fillStyle = '#c8962a'; c.fillRect(-9, -26, 18, 26); c.fillStyle = S.rgba('#fff0c0', .5); c.fillRect(-9, -26, 4, 26); c.restore();
        if (tip > .3) { c.fillStyle = S.rgba('#6a0e14', .8); c.beginPath(); c.ellipse(x - 30 - 50 * tip, 590 + shake, 50 * tip, 5, 0, 0, TAU); c.fill(); } }
      // on 'murdered', a red wash and the empty throne in focus
      const m = seg(lt, Sh.tM, Sh.tM + .8); if (m > 0) { c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = S.rgba('#8a2020', .35 * m); c.fillRect(0, 0, 1280, 720); c.restore(); VP.glow(c, 640, 380, 140, '#ffcf80', .25 * m); }
      VP.motes(c, lt, 0, 200, 1280, 500, { n: 40, a: .35 });
      void lt2;
    },
    over: [(c, lt) => K.card(c, 'TOLEDO', lt, { at: .6, x: 300, y: 150, px: 60, rot: -3 }), (c, lt, u, Sh) => K.card(c, 'MOST KINGS\nMURDERED OR\nOVERTHROWN', lt, { at: Sh.tM + .3, x: 1560, y: 230, px: 44, rot: 3 })],
    sfx: [['but the kingdom', 'whoosh', .4], ['fought', 'thud', .55], ['murdered', 'hit', .45]] },

  // 3 MED: the coronation. A shaft of light through the high window; the bishop lowers the crown onto Roderic, rivals watch from the dark
  { set: 'church', cam: (lt, u, Sh) => lt < Sh.tN ? { z: [1.25 + .25 * E.sine(K.clamp(lt / Sh.tN))], x: [640], y: [400 - 40 * K.clamp(lt / Sh.tN)] } : { z: [1.6], x: [lerp(640, 300, E.io(seg(lt, Sh.tN, Sh.tN + 2)))], y: [380] },
    init: Sh => { Sh.tC = at(Sh, 'seized', 1.5); Sh.tN = at(Sh, 'never accepted', 4); }, bed: [['drone', .2]],
    draw: (c, lt, u, Sh) => {
      const beam = (a) => { c.save(); c.globalCompositeOperation = 'screen'; const g = c.createLinearGradient(250, 150, 640, 640); g.addColorStop(0, S.rgba('#ffe8b0', .5 * a)); g.addColorStop(1, S.rgba('#ffe8b0', .05 * a)); c.fillStyle = g; c.beginPath(); c.moveTo(225, 110); c.lineTo(275, 110); c.lineTo(760, 660); c.lineTo(520, 660); c.closePath(); c.fill(); c.restore(); };
      c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = S.rgba('#3a2a4a', .4); c.fillRect(0, 0, 1280, 720); c.restore();
      beam(.8 + .2 * Math.sin(lt * .6));
      for (const [x, y, i] of [[560, 456, 0], [720, 456, 1]]) { H.fire(c, x, y, .12, lt, i + 20); c.fillStyle = '#f0e6d0'; c.fillRect(x - 4, y, 8, 30); }
      const L = { L: [.7, -1], amb: '#2a2040', ambA: .45, rim: '#ffe8b0', rimA: 1, tint: '#ffd080', tintA: .12, sw: .3, rw: .05 };
      const down = E.io(seg(lt, Sh.tC - .6, Sh.tC + 1.2)), crowned = down >= 1;
      // rivals in the shadows on the left
      const Ld = { L: [1, -.6], amb: '#1a1428', ambA: .65, rim: '#ffb070', rimA: .5, tint: '#2a2040', tintA: .2, sw: .2, rw: .04 };
      for (const [ch, x, i] of [[C.NOBLE1, 150, 0], [C.NOBLE3, 250, 1]]) S.person(c, ch, x, 640, 46, Object.assign(S.idle(lt, i + 4), { face: 1, lean: -2 }), { blink: S.blinkAt(lt, i + 2), angry: .4 + .4 * seg(lt, Sh.tN, Sh.tN + 1), look: [.9, 0], time: lt }, Ld);
      VP.figure(c, [600, 650], { k: .6, sy: -.2, a: .4, blur: 3 }, cc => S.person(cc, crowned ? RODERIC_K : C.RODERIC, 600, 650, 54, Object.assign(S.idle(lt, 0), { face: 1, tilt: -4 * (1 - down) + 2, lean: 4 * (1 - down) }), { blink: S.blinkAt(lt, 1), smile: crowned ? .5 : 0, look: [.3, crowned ? 0 : -.5], time: lt }, L));
      VP.figure(c, [730, 650], { k: .6, sy: -.2, a: .4, blur: 3 }, cc => S.person(cc, C.BISHOP, 730, 650, 52, Object.assign(S.idle(lt, 1), { face: -1, shN: crowned ? 20 : 142 - 14 * down, elN: crowned ? 20 : 10, shF: crowned ? 15 : 136 - 14 * down, elF: crowned ? 20 : 10,
        holdN: crowned ? null : (wr) => { cc.save(); cc.translate(wr[0] - 4, wr[1] + 10); X.crown(cc, 32, {}, L, { tone: col => col, celT: (q, p, t) => { q.fillStyle = t.base; q.fill(p); q.strokeStyle = t.shade; q.lineWidth = 2; q.stroke(p); }, front: true }); cc.restore(); } }), { blink: S.blinkAt(lt, 2), look: [-.6, .2], time: lt }, L));
      if (crowned) VP.glow(c, 600, 340, 90, '#ffe08a', .4 * pulse(lt, Sh.tC + 1.2, 1.4));
      // dust in the beam
      c.save(); c.beginPath(); c.moveTo(225, 110); c.lineTo(275, 110); c.lineTo(760, 660); c.lineTo(520, 660); c.closePath(); c.clip(); VP.motes(c, lt, 200, 100, 600, 560, { n: 70, a: .7 }); c.restore();
      // the camera lands on the rivals: their faces darken
      const n = seg(lt, Sh.tN, Sh.tN + 1.5); if (n > 0) { VP.glow(c, 200, 470, 160, '#ff8a40', .12 * n); }
    },
    over: [(c, lt, u, Sh) => K.card(c, 'RODERIC', lt, { at: Sh.tC + .3, x: 1520, y: 200, px: 70, rot: 3, until: Sh.tN }), (c, lt, u, Sh) => K.dateTag(c, 'TOLEDO · 710', lt, { at: .4 }),
      (c, lt, u, Sh) => K.card(c, 'THE OLD KING\'S FAMILY', lt, { at: Sh.tN + .8, x: 1500, y: 860, px: 44, rot: -3 })],
    sfx: [[.2, 'swell', .3], ['seized', 'chime', .4], ['never accepted', 'whoosh_soft', .35]] },

  // 4 MAP: the Umayyad green pours out of Arabia, along North Africa, all the way to the Atlantic
  { set: 'mapwide', cam: { z: [1.0, 1.1], x: [700, 520], y: [380, 400], ease: E.io }, bed: [['drone', .22]], sub: 'bottom',
    init: Sh => { Sh.tD = at(Sh, 'damascus', 2); Sh.tA = at(Sh, 'arabia', Sh.tD + 1); Sh.tN = at(Sh, 'north africa', Sh.tA + 2); Sh.tC = at(Sh, 'century', Sh.dur - 1); },
    draw: (c, lt, u, Sh) => {
      const PATH = [[39.8, 21.4], [39.6, 24.5], [38, 30], [36.3, 33.5], [33.5, 31], [31.2, 30], [25, 31.2], [20, 31.5], [13, 32.5], [10.2, 35.5], [5, 36], [-1, 35], [-6, 33.8], [-8, 31]];
      const q = E.io(seg(lt, Sh.tD + .3, Sh.tC + .3)) * (PATH.length - 1);
      // green spreads as overlapping brush blots along the path, never over the sea
      const sea = new Path2D(); sea.rect(0, 0, 1280, 720); for (const L of [X.MED]) sea.addPath(S.poly(L.map(p => X.LW(p[0], p[1])), false));
      c.save(); c.clip(sea, 'evenodd'); c.fillStyle = S.rgba('#2f7a3a', .45);
      for (let i = 0; i <= Math.floor(q); i++) { const f = i === Math.floor(q) ? q - i : 1, a = PATH[i], b = PATH[Math.min(PATH.length - 1, i + 1)]; for (let k = 0; k <= 6; k++) { const s = Math.min(f, k / 6), [x, y] = X.LW(lerp(a[0], b[0], s), lerp(a[1], b[1], s)), r = 46 + 10 * Math.sin(i * 3 + k); c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); } }
      c.restore();
      const [dx, dy] = X.LW(36.3, 33.5); H.stamp(c, 'Damascus', dx, dy, lt, Sh.tD, { dx: 40, dy: -12 });
      const [mx, my] = X.LW(39.8, 21.4); ink(c, 'ARABIA', mx + 50, my + 30, seg(lt, Sh.tA - .5, Sh.tA + .3), 30);
      ink(c, 'NORTH AFRICA', X.LW(10, 30)[0], X.LW(10, 30)[1], seg(lt, Sh.tN, Sh.tN + .8), 40);
      const [ix, iy] = X.LW(-4, 40); ink(c, 'Iberia', ix, iy, .8, 28);
      // a front line arrow riding ahead of the green
      const tip = Math.min(PATH.length - 1, q + .3); if (q > 0) { const pts = []; for (let i = 0; i <= Math.ceil(tip); i++) { const p = PATH[Math.min(i, PATH.length - 1)]; pts.push(X.LW(p[0], p[1] - 3.2)); } arrow(c, pts, tip / Math.ceil(tip), S.rgba('#1e5a2a', .85), 5); }
      mapCandle(c, lt, 900, 250);
    },
    over: [(c, lt, u, Sh) => K.card(c, 'THE UMAYYAD\nCALIPHATE', lt, { at: .4, x: 1560, y: 200, px: 54, rot: 3 }), (c, lt, u, Sh) => K.card(c, 'LESS THAN\n100 YEARS', lt, { at: Sh.tC - .2, x: 1540, y: 820, px: 48, rot: -3 })],
    sfx: [[.1, 'paper', .4], ['damascus', 'thud', .4], ['arabia', 'whoosh_soft', .35], ['century', 'hit', .35]] },

  // 5 MED: Musa's tent. The old governor points at the map, Tariq nods and walks out into the light
  { set: 'tent', cam: (lt, u, Sh) => lt < Sh.tT ? { z: [1.5], x: [lerp(560, 600, lt / Sh.tT)], y: [420] } : { z: [lerp(1.5, 1.3, E.io(seg(lt, Sh.tT, Sh.tT + 2)))], x: [lerp(600, 820, E.io(seg(lt, Sh.tT, Sh.dur)))], y: [420] },
    init: Sh => { Sh.tM = at(Sh, 'musa', .8); Sh.tT = at(Sh, 'tariq', 3.5); Sh.tS = at(Sh, 'seven thousand', 6); Sh.tB = at(Sh, 'berbers', Sh.tS + 2); Sh.dur = Sh.end - Sh.start; }, bed: [['wind_loop', .15]],
    draw: (c, lt, u, Sh) => {

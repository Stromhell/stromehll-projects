<!doctype html><html><head><meta charset="utf-8"><title>ES1 act 0 - cold open</title>
<style>@font-face{font-family:Anton;src:url(../../../../shared/fonts/Anton.ttf)}@font-face{font-family:Oswald;src:url(../../../../shared/fonts/Oswald.ttf)}@font-face{font-family:Caveat;src:url(../../../../shared/fonts/Caveat.ttf)}body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../../../../shared/vp/engine.js"></script><script src="../../../../shared/vp/cast.js"></script><script src="../../../../shared/vp/scenes.js"></script><script src="../../../../shared/vp/spain.js"></script>
<script src="../../../../shared/kit.js"></script><script src="../../../../shared/vp.js"></script><script src="../../es1_sets.js"></script>
<script src="timing.js"></script>
<script>
const K = KIT, E = K.E, X = S.SPX, CH = S.SPAIN, TAU = Math.PI * 2;
// the title card has no narration: give it its own shot after the last line
{ const T = window.TIMING, L = T.shots[T.shots.length - 1]; T.shots.push({ i: T.shots.length + 1, start: L.end, end: L.end + 4.6, vo_start: L.end, vo_end: L.end, text: '' }); T.dur = L.end + 4.6; }

// ---------- cast for this act ----------
const turb = (b, s, r) => X.turban({ base: '#efe6d2', shade: '#a99c82', rim: '#ffffff' }, { base: b, shade: s, rim: r });
const moor = (shirt, band, extra = {}) => Object.assign({}, CH.boabdil, { mustache: true, beard: true, shirt, headwear: turb(...band) }, extra);
const ATT1 = moor(['#7a5a3a', '#3a2a1a'], ['#8a2a22', '#4a1410', '#ffb0a0']);
const ATT2 = moor(['#e8dcc2', '#a89a7c'], ['#2f5a8a', '#15304a', '#a0d0ff'], { skin: X.SK.andean });
const SCHOLAR = moor(['#f0e8d8', '#b0a48c'], ['#2f8a5a', '#15402a', '#9ef0c0'], { hairCol: X.HR.grey, mundu: true });
const BERBER = moor(['#c8b490', '#8a7454'], ['#3a3a5a', '#1a1a2a', '#a0a0d0'], { skin: X.SK.andean, mundu: false, pants: ['#8a7454', '#4a3a24'] });
const WOMAN = Object.assign({}, CH.aisha, { shirt: ['#2f6b8a', '#173a4a'], pants: ['#2f6b8a', '#173a4a'], dupatta: ['#e8c070', '#a8803a'] });
const PEASANT = Object.assign({}, CH.farmer, { shirt: ['#5a5048', '#2a2420'], pants: ['#4a4038', '#22201a'], stoop: 16, headwear: null });
const BLACK = ['#2c2424', '#0e0a0a'], GREY = ['#a49a90', '#5a524a'], BAY = ['#7a4a2e', '#3a2014'];
const TACK = { cloth: ['#2f6b4a', '#173a28'], trim: '#d8b060', reins: 1 };

// ---------- helpers ----------
const at = VP.at, seg = K.seg, lerp = K.lerp;
const pulse = (lt, a, d) => { const v = (lt - a) / d; return v < 0 || v > 1 ? 0 : Math.sin(v * Math.PI); };
const bez = (P, q) => { const m = 1 - q; return [m * m * m * P[0][0] + 3 * m * m * q * P[1][0] + 3 * m * q * q * P[2][0] + q * q * q * P[3][0], m * m * m * P[0][1] + 3 * m * m * q * P[1][1] + 3 * m * q * q * P[2][1] + q * q * q * P[3][1]]; };
// walk from the run cycle: arms hang and swing gently against the legs, knees soften, little bounce
const walk = (p, k = .32) => { const r = S.run(p, k), a = p * TAU; r.lean = 2; r.bob *= .4; r.shN = -14 * Math.sin(a); r.shF = -14 * Math.sin(a + Math.PI); r.elN = 14 + 12 * Math.max(0, Math.sin(a)); r.elF = 14 + 12 * Math.max(0, Math.sin(a + Math.PI)); r.kneeN = 8 + (r.kneeN - 8) * .55; r.kneeF = 8 + (r.kneeF - 8) * .55; return r; };
// tiny distant soldier (for the army on the plain)
const tiny = (c, x, y, s, col, t, i) => {
  c.fillStyle = S.rgba('#2a1a10', .3); c.beginPath(); c.ellipse(x + 6 * s, y, 7 * s, 1.4 * s, 0, 0, TAU); c.fill();
  c.fillStyle = col; c.fillRect(x - 2 * s, y - 9 * s, 4 * s, 7 * s); c.fillStyle = '#2a2018'; c.fillRect(x - 2 * s, y - 2.4 * s, 1.6 * s, 2.4 * s); c.fillRect(x + .4 * s, y - 2.4 * s, 1.6 * s, 2.4 * s);
  c.fillStyle = '#d0a080'; c.beginPath(); c.arc(x, y - 11 * s, 1.8 * s, 0, TAU); c.fill(); c.fillStyle = '#a8a8b0'; c.beginPath(); c.arc(x, y - 11.6 * s, 2.1 * s, Math.PI, 0); c.fill();
  c.fillStyle = S.rgba('#ffe0b0', .5); c.fillRect(x - 2 * s, y - 9 * s, 1 * s, 7 * s);
  c.strokeStyle = '#3a2a1a'; c.lineWidth = .5 * s; c.beginPath(); c.moveTo(x + 2.6 * s, y); c.lineTo(x + 2.6 * s + Math.sin(t * .8 + i) * .4 * s, y - 24 * s); c.stroke(); c.fillStyle = '#c8c8d0'; c.fillRect(x + 2.2 * s, y - 26 * s, .9 * s, 2.4 * s);
};
const castle = (c, x, y, bh) => { c.fillStyle = '#f0c040'; const s = bh * .3; c.fillRect(x - s, y - s * .4, s * 2, s * 1.1); c.fillRect(x - s * 1.1, y - s * .9, s * .5, s * .6); c.fillRect(x - s * .25, y - s * 1.1, s * .5, s * .8); c.fillRect(x + s * .6, y - s * .9, s * .5, s * .6); };
const sunSweep = (c, x, y0, y1, w, a, col = '#ffcf8a') => { c.save(); c.globalCompositeOperation = 'soft-light'; const g = c.createLinearGradient(x - w, 0, x + w, 0); g.addColorStop(0, S.rgba(col, 0)); g.addColorStop(.5, S.rgba(col, a)); g.addColorStop(1, S.rgba(col, 0)); c.fillStyle = g; c.fillRect(x - w, y0, w * 2, y1 - y0); c.restore(); };
const ROAD = [[470, 1014], [540, 1074], [700, 1102], [930, 1114]];

window.SHOTS = [
  // 1 WIDE: dawn over the Alhambra, crane down from the Sierra Nevada; the king's small procession leaves the gate
  { set: 'dawn', cam: { z: [1, 1.14], x: [640, 610], y: [420, 935], ease: E.io }, bed: [['wind_loop', .25], ['birds_loop', .2]],
    draw: (c, lt, u, Sh) => {
      const L = VP.light('golden', lt, { swing: 6, breathe: .25, set: { L: [-1, -.25], tint: '#ffc890', tintA: .16 } });
      // the sun clears the mountains: glow grows, rays fan out, a band of light sweeps over the walls
      const rise = E.io(u);
      VP.glow(c, 250, 650 - 60 * rise, 420 + 120 * rise, '#ffcf90', .25 + .25 * rise); VP.glow(c, 250, 640 - 60 * rise, 110, '#fff6dc', .3 + .4 * rise);
      VP.rays(c, 250, 630 - 50 * rise, lt, { ang: .35, spread: .1, n: 9, len: 1300, a: .035 + .04 * rise, w1: 160 });
      sunSweep(c, -300 + rise * 1900, 700, 1300, 420, .55);
      // banners on the towers
      VP.banner(c, 330, 722, 34, 26, ['#2f8a5a', '#15402a'], lt, { Lt: L, ph: 0 }); VP.banner(c, 600, 756, 30, 22, ['#2f8a5a', '#15402a'], lt, { Lt: L, ph: 1 }); VP.banner(c, 470, 862, 44, 32, ['#2f8a5a', '#15402a'], lt, { Lt: L, ph: 2 });
      // the waiting army: tents painted, soldiers in ranks, Castile banners
      for (let i = 0; i < 70; i++) { const r = S.rng(i + 400), x = 880 + r() * 360, y = 1030 + r() * 70; tiny(c, x, y, 1 + (y - 1030) / 140, r() < .5 ? '#9a2a22' : '#c8b080', lt, i); }
      for (const [x, y, p] of [[920, 1040, 0], [1030, 1030, 1], [1140, 1045, 2], [1230, 1035, 3]]) VP.banner(c, x, y, 44, 26, ['#b8282a', '#5a1010'], lt, { Lt: L, ph: p, dir: -1, emblem: (cc, ex, ey, bh) => castle(cc, ex, ey, bh) });
      // the procession: the king on a black horse, two men on foot, one rider behind
      const q0 = K.clamp((lt - .4) * .055), sh = VP.shadowOf(L, 1.8, .22 + .18 * rise, .12);
      const who = [[q0 - .1, 'rider', ATT1, GREY], [q0 - .06, 'foot', ATT2], [q0 - .03, 'foot', ATT1], [q0, 'king', CH.boabdil, BLACK]];
      for (const [q, kind, ch, col] of who) { if (q <= 0) continue; const [x, y] = bez(ROAD, q), s = 1 + q * .5, uu = 8.6 * s, ph = lt * .7 + q * 3;
        if (kind === 'foot') VP.figure(c, [x, y], sh, cc => S.person(cc, ch, x, y, uu, walk(ph * 1.4), { time: lt }, L));
        else VP.figure(c, [x, y], sh, cc => { const r = VP.rider(cc, ch, x, y, uu, uu * 5, { face: 1, ph, walk: .7, t: lt, col, tack: TACK }, { lean: kind === 'king' ? 8 : 2 }, { time: lt, worry: .6 }, L); VP._m = r.muzzle; });
        if (kind !== 'foot' && VP._m) VP.breath(c, VP._m.x, VP._m.y, lt + q * 9, { dx: 14, rise: 8, size: 6, a: .3 }); }
      VP.motes(c, lt, 0, 820, 1280, 400, { n: 40, a: .4 });
      // birds over the valley
      c.strokeStyle = 'rgba(40,24,30,.7)'; c.lineWidth = 1.6; c.lineCap = 'round'; for (let k = 0; k < 7; k++) { const x = 620 + lt * 26 + k * 30 + Math.sin(k * 2) * 18, y = 600 + Math.sin(k * 1.3) * 30 + Math.sin(lt * 2 + k) * 3, f = Math.sin(lt * 9 + k) * 4; c.beginPath(); c.moveTo(x - 6, y - f); c.quadraticCurveTo(x - 2, y - 2, x, y); c.quadraticCurveTo(x + 2, y - 2, x + 6, y - f); c.stroke(); }
    },
    over: [(c, lt) => K.dateTag(c, 'GRANADA · 2 JAN 1492', lt, { at: 1.2 })],
    sfx: [[.1, 'swell', .35], [4.5, 'footsteps', .25]] },

  // 2 MED: Boabdil on his black horse at the gate, turning the heavy iron key; push in on his face
  { set: 'gate', cam: { z: [1, 2.05], x: [640, 650], y: [360, 236] }, bed: [['wind_loop', .22]], sub: 'bottom',
    init: Sh => { Sh.tB = at(Sh, 'boabdil', 3); Sh.tM = at(Sh, 'muhammad', 1); Sh.tL = at(Sh, 'last muslim', 5); },
    draw: (c, lt, u, Sh) => {
      const L = VP.light('golden', lt, { swing: 10, speed: .5, breathe: .3, set: { L: [-1, -.3] } });
      const x = 560, y = 805, uu = 72, h = 360;
      const ang = -.7 + .45 * Math.sin(lt * .75), gl = Math.max(pulse(lt, 2.4, .7), pulse(lt, Sh.tL - .2, .8));
      const draw = cc => { const r = VP.rider(cc, CH.boabdil, x, y, uu, h, { face: 1, ph: .1, walk: 0, t: lt, col: BLACK, tack: TACK, headUp: .3 },
        { lean: 4, shN: 34, elN: 78, shF: 18, elF: 66, tilt: -4 + 2 * Math.sin(lt * .6), holdN: (wr, a2) => { cc.save(); cc.translate(wr[0], wr[1]); cc.rotate(ang); X.key(cc, uu * 1.25, L, gl); cc.restore(); } },
        { blink: S.blinkAt(lt, 1), worry: .75, look: [.35, .55], time: lt, sway: Math.sin(lt * 1.1) * .03 }, L); VP._m = r.muzzle; };
      // the low sun throws his shadow up onto the red wall
      VP.wallShadow(c, 120, -26, .32, 5, draw, (() => { const p = new Path2D(); p.rect(300, 0, 980, 640); return p; })());
      VP.rays(c, -120, 60, lt, { ang: .38, spread: .05, n: 5, len: 1500, a: .05, w1: 120 });
      c.save(); draw(c); c.restore();
      VP.breath(c, VP._m.x, VP._m.y, lt, { dx: 30, rise: 18, size: 14, a: .32 });
      VP.motes(c, lt, 0, 0, 1280, 720, { n: 60, a: .5 });
      sunSweep(c, 300 + 300 * Math.sin(lt * .4), 0, 720, 500, .25);
    },
    over: [(c, lt, u, Sh) => K.badge(c, 'MUHAMMAD XII', lt, { at: Sh.tM }), (c, lt, u, Sh) => K.card(c, 'BOABDIL', lt, { at: Sh.tB, x: 1540, y: 250, px: 74, rot: 4 }),
      (c, lt, u, Sh) => K.card(c, 'LAST MUSLIM RULER\nIN WESTERN EUROPE', lt, { at: Sh.tL, x: 1500, y: 520, px: 42, rot: -3 })],
    sfx: [['boabdil', 'pop', .45], ['last muslim', 'pop', .4], [2.4, 'chime', .25]] },

  // 3 CU: the mountain pass. He looks back at Granada and weeps; the mother's line lands on a hard cut to her face
  { set: 'sigh', bed: [['wind_loop', .45]],
    init: Sh => { Sh.tW = at(Sh, 'wept', 4.5); Sh.tC = at(Sh, 'weep like', 6.3); Sh.tE = at(Sh, 'like a man', 9) + .6; },
    cam: (lt, u, Sh) => lt < Sh.tC ? { z: [lerp(1.05, 1.75, E.sine(lt / Sh.tC))], x: [lerp(760, 880, E.sine(lt / Sh.tC))], y: [lerp(400, 300, E.sine(lt / Sh.tC))] }
      : { z: [2.9 + .2 * seg(lt, Sh.tC, Sh.tC + 4)], x: [1000], y: [292] },
    draw: (c, lt, u, Sh) => {
      const L = VP.light('golden', lt, { swing: 7, breathe: .3 }), sh = VP.shadowOf(L, 1.4, .34, .14);
      VP.glow(c, 300, 330, 300 + 40 * Math.sin(lt * .8), '#ffd090', .22); VP.rays(c, 300, 330, lt, { ang: .3, spread: .11, n: 8, len: 1100, a: .045 });
      VP.clouds(c, lt, { y0: 420, y1: 640, a: .22, speed: 22, n: 4, seed: 3 });
      const sway = .05 + .05 * Math.sin(lt * 1.7), talk = lt > Sh.tC && lt < Sh.tE ? .35 * Math.abs(Math.sin(lt * 11)) : 0;
      VP.figure(c, [990, 640], sh, cc => S.person(cc, CH.aisha, 990, 640, 62, Object.assign(S.idle(lt, 2), { face: -1, elN: 30, elF: 20 }), { blink: S.blinkAt(lt, 3), angry: lt > Sh.tC ? .8 : .4, look: lt > Sh.tC ? [-.9, .1] : [-.6, 0], open: talk, time: lt, sway }, L));
      VP.figure(c, [870, 646], sh, cc => S.person(cc, CH.boabdil, 870, 646, 66, Object.assign(S.idle(lt, 0), { face: -1, tilt: -6 - 4 * seg(lt, Sh.tW - 1, Sh.tW + 1), lean: 4 }), { blink: S.blinkAt(lt, 1), worry: .85, look: [-.85, .1], tears: seg(lt, Sh.tW - 1.5, Sh.tW), streak: seg(lt, Sh.tW, Sh.tW + 2.5), time: lt, sway }, L));
      // dust blowing across the pass
      c.save(); for (let k = 0; k < 40; k++) { const r = S.rng(k + 77), x = ((r() * 1400 + lt * (120 + r() * 80)) % 1400) - 60, y = 520 + r() * 200 + Math.sin(lt * 2 + k) * 8; c.fillStyle = S.rgba('#f0c890', .25 + .25 * r()); c.beginPath(); c.ellipse(x, y, 2.5 + r() * 3, 1, .2, 0, TAU); c.fill(); } c.restore();
      VP.glow(c, 300, 330, 520, '#ffb070', .1);
    },
    over: [(c, lt, u, Sh) => K.card(c, '"THE MOOR\'S LAST SIGH"\n(LEGEND)', lt, { at: .6, x: 1520, y: 170, px: 44, rot: 3, until: Sh.tC - .1 })],
    sfx: [['wept', 'breath', .4], ['weep like', 'hit', .55]] },

  // 4 MAP: the green of Al-Andalus grows back through time, then drains south to one point at Gibraltar; counter spins 1492 -> 711
  { set: 'map', cam: { z: [1.02, 1.16], x: [620, 520], y: [380, 430] }, bed: [['drone', .22]], sub: 'bottom',
    init: Sh => { Sh.tA = at(Sh, 'africa', 6) ; Sh.tS = at(Sh, 'seven hundred', 2); },
    draw: (c, lt, u, Sh) => {
      const GR = X.LL(-3.6, 37.18), GB = X.LL(-5.35, 36.14), top = X.LL(0, 41.4)[1];
      const g1 = E.io(seg(lt, .3, Sh.tS + .3)), g2 = E.io(seg(lt, Sh.tS + .6, Sh.tA - .3));
      const cx = lerp(GR[0], GB[0], g2), cy = lerp(GR[1], GB[1], g2), R = g2 > 0 ? lerp(620, 7, g2) : lerp(26, 620, g1);
      const ib = S.poly(X.IBERIA, false), clip = new Path2D(); clip.ellipse(cx, cy, R, R * .8, 0, 0, TAU);
      c.save(); c.clip(ib); c.clip(clip); if (R > 60) { const nb = new Path2D(); nb.rect(0, top - 20 * (1 - g2), 1280, 720); c.clip(nb); }
      c.fillStyle = S.rgba('#3f8a4a', .55); c.fillRect(0, 0, 1280, 720); S.dabs(c, { x: 0, y: 0, w: 1280, h: 720, n: 160, cols: ['#2f7a3a', '#5aa060', '#1e5a2a'], r0: 10, r1: 34, sq: .5, a0: .15, a1: .35, seed: 5 }); c.restore();
      // the edge of the green as a brush line
      c.save(); c.clip(ib); c.strokeStyle = S.rgba('#1e5a2a', .8); c.lineWidth = 3; c.beginPath(); c.ellipse(cx, cy, R, R * .8, 0, 0, TAU); c.stroke(); c.restore();
      // ink labels
      c.save(); c.font = '30px Caveat'; c.fillStyle = '#3a2412'; c.textAlign = 'center';
      c.globalAlpha = 1 - seg(lt, Sh.tS, Sh.tS + .6); c.fillText('Granada', GR[0] + 6, GR[1] - 16); c.beginPath(); c.arc(GR[0], GR[1], 5, 0, TAU); c.fill();
      c.globalAlpha = seg(lt, Sh.tA - 1.2, Sh.tA - .4); c.fillText('Gibraltar', GB[0] - 70, GB[1] + 4); c.beginPath(); c.arc(GB[0], GB[1], 5, 0, TAU); c.fill();
      c.globalAlpha = .7; c.font = '24px Caveat'; c.fillText('AFRICA', 640, 690); c.fillText('Atlantic', 170, 400); c.fillText('Mediterranean', 1000, 560); c.restore();
      // small boats crossing the strait at the end
      const b = seg(lt, Sh.tA - 1.4, Sh.tA + 1.2); if (b > 0) { const A0 = X.LL(-5.8, 35.62), B0 = X.LL(-5.4, 36.08); for (let k = 0; k < 4; k++) { const q = K.clamp(b * 1.3 - k * .1), x = lerp(A0[0], B0[0], q) + k * 9 - 12, y = lerp(A0[1], B0[1], q) + (k % 2) * 7;
        c.fillStyle = '#4a2a14'; c.beginPath(); c.moveTo(x - 7, y); c.lineTo(x + 7, y); c.lineTo(x + 4, y + 4); c.lineTo(x - 4, y + 4); c.fill(); c.fillStyle = '#f4ead4'; c.beginPath(); c.moveTo(x, y - 1); c.lineTo(x, y - 14); c.lineTo(x + 8, y - 2); c.fill(); }
        c.strokeStyle = S.rgba('#8a2a1a', .8); c.lineWidth = 2.5; c.setLineDash([7, 6]); c.beginPath(); c.moveTo(A0[0] - 40, A0[1] + 30); c.quadraticCurveTo(A0[0] - 30, B0[1] + 4, lerp(A0[0], B0[0], b) - 12, lerp(A0[1] + 30, B0[1], b)); c.stroke(); c.setLineDash([]); }
      // candlelight drifting over the parchment
      const f = VP.flicker(lt, 3); VP.glow(c, 360 + 80 * Math.sin(lt * .35), 220 + 30 * Math.sin(lt * .5), 520, '#ffcf80', .16 + .1 * f);
      c.save(); c.globalCompositeOperation = 'multiply'; const vg = c.createRadialGradient(560, 380, 200, 560, 380, 820); vg.addColorStop(0, 'rgba(255,255,255,0)'); vg.addColorStop(1, `rgba(60,30,10,${.55 - .1 * f})`); c.fillStyle = vg; c.fillRect(0, 0, 1280, 720); c.restore();
    },
    over: [(c, lt, u, Sh) => { const g1 = E.io(seg(lt, .3, Sh.tS + .3)), g2 = E.io(seg(lt, Sh.tS + .6, Sh.tA - .3)); const y = Math.round(g2 > 0 ? lerp(1000, 711, g2) : lerp(1492, 1000, g1));
        c.save(); c.globalAlpha = seg(lt, .2, .6); K.outlined(c, String(y), 1640, 150, 120, { fill: y === 711 ? '#ffd27a' : '#fffaf0' }); K.outlined(c, 'AD', 1640, 238, 40, { fam: 'Oswald' }); c.restore(); },
      (c, lt, u, Sh) => K.card(c, '711 → 1492', lt, { at: Sh.tA + .3, x: 1560, y: 420, px: 52, rot: -4 })],
    sfx: [[.2, 'paper', .5], ['seven hundred', 'tick', .3], ['africa', 'whoosh_soft', .4]] },

  // 5 MED: split frame. Lamps light one by one along a Cordoba street; a dark, muddy northern town in the rain
  { draw: (c, lt, u, Sh) => {
      const tE = Sh.tE, wp = E.io(seg(lt, tE - .5, tE + .4)), div = lerp(1920, 960, wp), z = 1.5;
      // ---- Cordoba ----
      c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.beginPath(); c.rect(0, 0, div, 1080); c.clip();
      const push = 1 + .05 * u; c.setTransform(z * push, 0, 0, z * push, lerp(0, -480, wp) - 1920 * (push - 1) / 2 * (1 - wp), -1080 * (push - 1) / 2);
      VP.drawSet(c, 'cordoba');
      c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = S.rgba('#3a3a6a', .42); c.fillRect(0, 0, 1280, 720); c.restore();
      const lit = VP.CORDOBA_LAMPS.map((p, i) => [p[0], p[1], E.out(seg(lt, Sh.tL + i * .32, Sh.tL + i * .32 + .4)) * VP.flicker(lt, i)]);
      for (const [x, y, a] of lit) if (a > 0) { VP.glow(c, x, y + 6, 26, '#fff2c0', .9 * a); VP.glow(c, x, y + 10, 150, '#ffb860', .5 * a); c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = .28 * a; const g = c.createRadialGradient(x, 620, 0, x, 620, 150); g.addColorStop(0, '#ffb860'); g.addColorStop(1, 'rgba(255,184,96,0)'); c.fillStyle = g; c.save(); c.translate(x, 620); c.scale(1, .3); c.translate(-x, -620); c.fillRect(x - 150, 470, 300, 300); c.restore(); c.restore(); }
      const near = x => { let best = null; for (const L0 of lit) if (L0[2] > .2 && (!best || Math.abs(L0[0] - x) < Math.abs(best[0] - x))) best = L0; return best; };
      const Lc = VP.light('door', lt, { swing: 6 });

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden}
body{font-family:Urbane,sans-serif;color:#eaf4fb;background:#0d1928;position:relative}
.bg{position:absolute;inset:0;background:

.node.o .ic{background:#fdeee3}
.node.dim{opacity:.45;box-shadow:0 8px 20px rgba(20,60,100,.06)}
.tag{display:inline-block;font-family:'Geist Mono',monospace;font-size:17px;padding:6px 12px;border-radius:8px;background:rgba(67,164,220,.15);color:#2f6f97;margin-right:8px}

.step .t{font-size:44px;font-weight:700}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(67,164,220,.35);transform:translate(-50%,-50%)}
.streak{position:absolute;height:5px;border-radius:3px;background:linear-gradient(90deg,rgba(67,164,220,0),#43a4dc);box-shadow:0 0 18px #43a4dc}

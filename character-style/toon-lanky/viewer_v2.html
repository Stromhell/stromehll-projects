<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toon Lanky Rig</title>
<style>
:root{--bg:#efeae2;--panel:#fffdf9;--ink:#1b1b1f;--muted:#6b6660;--acc:#c8232c;--line:#d9d2c7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1c1f;--panel:#28272b;--ink:#f1eee9;--muted:#a49f98;--acc:#ff5a5f;--line:#3a383d}}
:root[data-theme="dark"]{--bg:#1d1c1f;--panel:#28272b;--ink:#f1eee9;--muted:#a49f98;--acc:#ff5a5f;--line:#3a383d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}
header{padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 12px 0 0}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
button.on{background:var(--ink);color:var(--bg)}
main{display:grid;grid-template-columns:1fr 320px;height:calc(100vh - 58px)}
#stage{position:relative;min-height:420px}canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;display:grid}
#labels span{align-self:end;justify-self:center;margin-bottom:8px;font-size:12px;letter-spacing:.08em;color:var(--muted)}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px 16px}
details{border-bottom:1px solid var(--line);padding:6px 0}summary{cursor:pointer;font-weight:600}
label{display:grid;grid-template-columns:22px 1fr 40px;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
input[type=range]{width:100%}.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
@media (max-width:760px){main{grid-template-columns:1fr;height:auto}#stage{height:70vh}aside{border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<header><h1>Toon Lanky rig · sample "Kai"</h1>
<button data-v="orbit" class="on">360 orbit</button><button data-v="turn">Turnaround</button>
<button data-v="front">Front</button><button data-v="side">Side</button><button data-v="back">Back</button><button data-v="q34">3/4</button>
<button data-v="top">Top</button><button data-v="bottom">Bottom</button><button id="spin">Auto-spin</button></header>
<main><div id="stage"><canvas id="c"></canvas><div id="labels"></div></div>
<aside>
<div class="row" id="poses"></div><div class="row" id="faces"></div>
<div class="row"><button id="reset">Reset all joints</button></div>
<div id="joints"></div>
<p style="font-size:12px;color:var(--muted)">Drag to orbit, scroll/pinch to zoom. Every joint has X/Y/Z rotation sliders (degrees).</p>
</aside></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== STYLE TOKENS (Toon Lanky, from Pushpam's 6 pins) =====
const S={skin:0xe8a878,skinShade:0.62,hair:0x16161c,shirt:0xc8232c,sleeve:0xf4f1ea,pants:0x262a33,shoe:0xc8232c,sole:0xf4f1ea,eyeW:0xffffff,pupil:0x111111,ink:0x111111,outline:0.035};
const grad=(()=>{const d=new Uint8Array([90,90,90,255,255,255]);const t=new THREE.DataTexture(d,2,1,THREE.LuminanceFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t})();
const M=c=>new THREE.MeshToonMaterial({color:c,gradientMap:grad});
const inkMat=new THREE.MeshBasicMaterial({color:S.ink,side:THREE.BackSide});
function part(geo,color,parent,pos=[0,0,0],rot=[0,0,0],scl=[1,1,1],outline=true){
  const m=new THREE.Mesh(geo,M(color));m.position.set(...pos);m.rotation.set(...rot);m.scale.set(...scl);parent.add(m);
  if(outline){const o=new THREE.Mesh(geo,inkMat);const k=1+S.outline/Math.max(0.05,Math.min(...scl.map((s,i)=>s*(geo.boundingSphere||(geo.computeBoundingSphere(),geo.boundingSphere)).radius)))*0.6;o.scale.setScalar(Math.min(k,1.25));m.add(o)}
  return m}
const J={};function joint(name,parent,pos){const j=new THREE.Group();j.name=name;j.position.set(...pos);parent.add(j);J[name]=j;return j}
const cap=(r,l)=>new THREE.CylinderGeometry(r,r*0.85,l,20,1);
const sph=r=>new THREE.SphereGeometry(r,32,24);

// ===== BUILD CHARACTER (8 heads tall, lanky, small torso, long legs) =====
const root=new THREE.Group();
const hips=joint('hips',root,[0,4.6,0]);
part(new THREE.BoxGeometry(1.05,0.55,0.55),S.pants,hips,[0,0,0]);
const spine=joint('spine',hips,[0,0.3,0]);
part(cap(0.42,0.9),S.sleeve,spine,[0,0.45,0],[0,0,0],[1.05,1,0.62]);
const chest=joint('chest',spine,[0,0.9,0]);
part(cap(0.55,0.95),S.shirt,chest,[0,0.4,0],[0,0,0],[1,1,0.6]);
part(new THREE.BoxGeometry(0.62,0.7,0.05),S.sleeve,chest,[0,0.4,0.33],[0,0,0],[1,1,1],false); // white front panel
const neck=joint('neck',chest,[0,0.9,0]);part(cap(0.13,0.4),S.skin,neck,[0,0.18,0]);
const head=joint('head',neck,[0,0.38,0]);head.scale.setScalar(1.3);
// head: tall rounded oval with soft jaw
part(sph(0.5),S.skin,head,[0,0.45,0],[0,0,0],[0.92,1.12,0.9]);
part(sph(0.12),S.skin,head,[0.47,0.42,0],[0,0,0],[0.6,1,0.8]);part(sph(0.12),S.skin,head,[-0.47,0.42,0],[0,0,0],[0.6,1,0.8]);
// nose
part(new THREE.ConeGeometry(0.06,0.16,12),S.skin,head,[0,0.4,0.46],[Math.PI/2.4,0,0]);
// eyes: big white ovals touching, black dot pupils, ink lids
const eyes={};
[['L',0.15],['R',-0.15]].forEach(([s,x])=>{const e=new THREE.Group();e.position.set(x,0.55,0.38);head.add(e);
  const w=part(sph(0.15),S.eyeW,e,[0,0,0],[0,0,0],[0.8,1.15,0.5]);
  const p=part(sph(0.05),S.pupil,e,[0,0,0.07],[0,0,0],[1,1.2,0.6],false);
  const lid=part(new THREE.BoxGeometry(0.3,0.04,0.12),S.ink,e,[0,0.17,0.02],[0,0,0],[1,1,1],false);
  const brow=part(new THREE.BoxGeometry(0.22,0.045,0.05),S.hair,head,[x,0.8,0.42],[0,0,0],[1,1,1],false);
  eyes[s]={e,w,p,lid,brow}});
// mouth: thin ink curve
const mouth=new THREE.Mesh(new THREE.TorusGeometry(0.11,0.017,8,24,Math.PI),new THREE.MeshBasicMaterial({color:S.ink}));
mouth.position.set(0,0.2,0.45);mouth.rotation.z=Math.PI;head.add(mouth);
// hair: angular spiky blocky cap (graphic shapes, like pin 3/5)
part(sph(0.53),S.hair,head,[0,0.62,-0.04],[0,0,0],[0.97,0.85,0.95]);
const spikes=[[0,1.06,0.05,0.28,0.4,0.1],[0.28,1.0,0,0.24,0.34,-0.5],[-0.3,1.0,0,0.24,0.34,0.6],[0.15,0.92,0.36,0.2,0.3,-0.2],[-0.18,0.92,0.36,0.2,0.32,0.35],[0,0.85,-0.45,0.3,0.4,0]];
spikes.forEach(([x,y,z,r,h,rz])=>part(new THREE.ConeGeometry(r,h,4),S.hair,head,[x,y,z],[z>0.3?0.8:z<-0.3?-0.9:0,0.4,rz]));
part(new THREE.BoxGeometry(0.85,0.18,0.25),S.hair,head,[0,0.86,0.33],[0.3,0,0.08]); // fringe block
// arms
function arm(s,x){const sh=joint('shoulder'+s,chest,[x*0.62,0.78,0]);
  part(sph(0.17),S.shirt,sh,[0,0,0]);part(cap(0.15,0.55),S.shirt,sh,[0,-0.28,0]);
  const el=joint('elbow'+s,sh,[0,-0.82,0]);part(cap(0.1,0.8),S.sleeve,el,[0,-0.38,0]);
  const wr=joint('wrist'+s,el,[0,-0.82,0]);
  part(new THREE.BoxGeometry(0.2,0.24,0.09),S.skin,wr,[0,-0.13,0]);
  [-0.07,-0.023,0.023,0.07].forEach((fx,i)=>{const f=joint('finger'+s+i,wr,[fx,-0.25,0]);part(cap(0.025,0.17),S.skin,f,[0,-0.08,0],[0,0,0],[1,1,1],false)});
  const th=joint('thumb'+s,wr,[x*-0.11,-0.1,0.03]);part(cap(0.03,0.14),S.skin,th,[0,-0.07,0],[0,0,x*0.6],[1,1,1],false);
  sh.rotation.z=x*0.08}
arm('L',1);arm('R',-1);
// legs: long, baggy cargo pants, chunky sneakers
function leg(s,x){const h=joint('hip'+s,hips,[x*0.28,-0.15,0]);part(cap(0.24,1.9),S.pants,h,[0,-0.95,0]);
  part(new THREE.BoxGeometry(0.1,0.28,0.2),S.pants,h,[x*0.25,-1.05,0]); // cargo pocket
  const k=joint('knee'+s,h,[0,-1.9,0]);part(cap(0.22,1.8),S.pants,k,[0,-0.9,0],[0,0,0],[1.05,1,1.05]);
  const a=joint('ankle'+s,k,[0,-1.95,0]);
  part(new THREE.BoxGeometry(0.34,0.24,0.62),S.shoe,a,[0,-0.08,0.12]);part(new THREE.BoxGeometry(0.36,0.08,0.66),S.sole,a,[0,-0.22,0.12]);
  part(sph(0.17),S.sole,a,[0,-0.12,0.42],[0,0,0],[1.05,0.6,0.5])}
leg('L',1);leg('R',-1);

// ===== SCENE =====
const cv=document.getElementById('c');const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio));
const scene=new THREE.Scene();scene.add(root);
scene.add(new THREE.HemisphereLight(0xffffff,0x888888,0.55));const sun=new THREE.DirectionalLight(0xffffff,0.75);sun.position.set(4,8,6);scene.add(sun);
const floor=new THREE.Mesh(new THREE.CircleGeometry(2.4,48),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.12}));floor.rotation.x=-Math.PI/2;floor.position.y=0.42;scene.add(floor);
const cam=new THREE.PerspectiveCamera(30,1,0.1,100);const tgt=new THREE.Vector3(0,4.6,0);
let az=0.5,el=0.1,dist=19,mode='orbit',spin=false;
function place(c,a,e,d){c.position.set(tgt.x+d*Math.sin(a)*Math.cos(e),tgt.y+d*Math.sin(e),tgt.z+d*Math.cos(a)*Math.cos(e));c.up.set(0,1,0);if(Math.abs(e)>1.5)c.up.set(0,0,e>0?-1:1);c.lookAt(tgt)}
const presets={front:[0,0],side:[Math.PI/2,0],back:[Math.PI,0],q34:[Math.PI/4,0.08],top:[0,1.5707],bottom:[0,-1.5707]};
const lab=document.getElementById('labels');
function setMode(m){mode=m;document.querySelectorAll('header [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===m));
  if(presets[m]){[az,el]=presets[m]}
  lab.innerHTML=m==='turn'?['FRONT','3/4','SIDE','BACK'].map(t=>`<span>${t}</span>`).join(''):'';lab.style.gridTemplateColumns=m==='turn'?'repeat(4,1fr)':'1fr'}
document.querySelectorAll('header [data-v]').forEach(b=>b.onclick=()=>setMode(b.dataset.v));
document.getElementById('spin').onclick=e=>{spin=!spin;e.target.classList.toggle('on',spin)};
let drag=null;cv.onpointerdown=e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);if(mode==='turn')setMode('orbit')};
cv.onpointermove=e=>{if(!drag)return;az-=(e.clientX-drag[0])*0.01;el=Math.max(-1.5707,Math.min(1.5707,el+(e.clientY-drag[1])*0.01));drag=[e.clientX,e.clientY];document.querySelectorAll('header [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==='orbit'));mode='orbit'};
cv.onpointerup=()=>drag=null;cv.onwheel=e=>{e.preventDefault();dist=Math.max(6,Math.min(40,dist+e.deltaY*0.01))};
function size(){const r=cv.parentElement.getBoundingClientRect();R.setSize(r.width,r.height,false)}
addEventListener('resize',size);size();
function bg(){return getComputedStyle(document.body).backgroundColor}
function loop(t){requestAnimationFrame(loop);const w=cv.clientWidth,h=cv.clientHeight;R.setClearColor(new THREE.Color(bg()));
  if(spin&&mode!=='turn')az+=0.008;
  // idle breathing + blink
  chest.scale.y=1+Math.sin(t*0.002)*0.01;const bl=(t%3800)<120?0.1:1;Object.values(eyes).forEach(o=>o.w.scale.y=1.15*bl*blinkMul);
  R.setScissorTest(true);
  if(mode==='turn'){const vw=w/4;[[0,0],[Math.PI/4,0],[Math.PI/2,0],[Math.PI,0]].forEach(([a,e],i)=>{cam.aspect=vw/h;cam.updateProjectionMatrix();place(cam,a,e,dist*0.95);R.setViewport(i*vw,0,vw,h);R.setScissor(i*vw,0,vw,h);R.render(scene,cam)})}
  else{cam.aspect=w/h;cam.updateProjectionMatrix();place(cam,az,el,dist);R.setViewport(0,0,w,h);R.setScissor(0,0,w,h);R.render(scene,cam)}}
let blinkMul=1;

// ===== JOINT CONTROLS =====
const groups={Body:['hips','spine','chest','neck','head'],'Left arm':['shoulderL','elbowL','wristL','thumbL','fingerL0','fingerL1','fingerL2','fingerL3'],'Right arm':['shoulderR','elbowR','wristR','thumbR','fingerR0','fingerR1','fingerR2','fingerR3'],'Left leg':['hipL','kneeL','ankleL'],'Right leg':['hipR','kneeR','ankleR']};
const base={};Object.entries(J).forEach(([n,j])=>base[n]=j.rotation.toArray().slice(0,3));
const inputs={};const jd=document.getElementById('joints');
Object.entries(groups).forEach(([g,list],gi)=>{const d=document.createElement('details');if(gi<2)d.open=true;d.innerHTML=`<summary>${g}</summary>`;
  list.forEach(n=>{const h=document.createElement('div');h.innerHTML=`<div style="margin-top:6px;font-size:12px">${n}</div>`;
    ['x','y','z'].forEach((ax,i)=>{const l=document.createElement('label');const v=Math.round(base[n][i]*57.3);
      l.innerHTML=`<b>${ax.toUpperCase()}</b><input type=range min=-180 max=180 value=${v}><output>${v}</output>`;
      const inp=l.querySelector('input');inp.oninput=()=>{J[n].rotation[ax]=inp.value/57.3;l.querySelector('output').textContent=inp.value};
      inputs[n+ax]=inp;h.appendChild(l)});d.appendChild(h)});jd.appendChild(d)});
function setJ(n,ax,deg){J[n].rotation[ax]=deg/57.3;if(inputs[n+ax]){inputs[n+ax].value=deg;inputs[n+ax].nextSibling.textContent=Math.round(deg)}}
function reset(){Object.entries(base).forEach(([n,r])=>['x','y','z'].forEach((a,i)=>setJ(n,a,r[i]*57.3)))}
document.getElementById('reset').onclick=reset;
const poses={'T-pose':{shoulderL:[0,0,90],shoulderR:[0,0,-90]},
 'Hands in pockets':{shoulderL:[0,0,12],elbowL:[-20,0,25],shoulderR:[0,0,-12],elbowR:[-20,0,-25],hips:[0,0,0]},
 'Wave':{shoulderR:[0,0,-150],elbowR:[0,0,-40],wristR:[0,0,-10],head:[0,-10,8]},
 'Hand on hip (pin 1)':{shoulderL:[0,0,30],elbowL:[0,0,100],shoulderR:[-20,0,-55],elbowR:[0,0,-60],wristR:[0,0,-30],hipL:[0,0,4],hipR:[0,0,-6],chest:[0,0,-4],head:[0,0,-8]},
 'Arms crossed (pin 6)':{shoulderL:[-50,0,20],elbowL:[0,-100,0],shoulderR:[-50,0,-20],elbowR:[0,100,0]},
 'Walk':{hipL:[25,0,0],kneeL:[-5,0,0],hipR:[-25,0,0],kneeR:[-30,0,0],shoulderL:[-20,0,8],shoulderR:[20,0,-8],elbowL:[-15,0,0],elbowR:[-15,0,0]}};
const pd=document.getElementById('poses');Object.entries(poses).forEach(([n,p])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{reset();Object.entries(p).forEach(([j,r])=>['x','y','z'].forEach((a,i)=>setJ(j,a,r[i])))};pd.appendChild(b)});
// expressions (pin 5 eye sheet subset)
const faces={Normal:{p:[0,0],lid:0.17,brow:0,m:1,mul:1},Happy:{p:[0,0],lid:0.17,brow:0.04,m:1.3,mul:0.55},'Half lid':{p:[0.02,-0.02],lid:0.04,brow:-0.03,m:0.7,mul:1},Surprised:{p:[0,0],lid:0.2,brow:0.08,m:-0.8,mul:1.15},'Side glance':{p:[0.06,0],lid:0.1,brow:-0.02,m:0.6,mul:1},Serious:{p:[0,0],lid:0.08,brow:-0.05,m:0.2,mul:1}};
const fd=document.getElementById('faces');Object.entries(faces).forEach(([n,f])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{blinkMul=f.mul;
  Object.values(eyes).forEach(o=>{o.p.position.x=f.p[0];o.p.position.y=f.p[1];o.lid.position.y=f.lid;o.brow.position.y=0.8+f.brow});
  mouth.scale.set(Math.abs(f.m),Math.abs(f.m),1);mouth.rotation.z=f.m<0?0:Math.PI;mouth.position.y=f.m<0?0.16:0.2};fd.appendChild(b)});
setMode('orbit');requestAnimationFrame(loop);
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toon Lanky 2D-Feel Rig</title>
<style>
:root{--bg:#efeae2;--panel:#fffdf9;--ink:#1b1b1f;--muted:#6b6660;--acc:#c8232c;--line:#d9d2c7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1c1f;--panel:#28272b;--ink:#f1eee9;--muted:#a49f98;--acc:#ff5a5f;--line:#3a383d}}
:root[data-theme="dark"]{--bg:#1d1c1f;--panel:#28272b;--ink:#f1eee9;--muted:#a49f98;--acc:#ff5a5f;--line:#3a383d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}
header{padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 12px 0 0}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
button.on{background:var(--ink);color:var(--bg)}
main{display:grid;grid-template-columns:1fr 320px;height:calc(100vh - 58px)}
#stage{position:relative;min-height:420px}#stage::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.35;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .45  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;display:grid}
#labels span{align-self:end;justify-self:center;margin-bottom:8px;font-size:12px;letter-spacing:.08em;color:var(--muted)}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px 16px}
details{border-bottom:1px solid var(--line);padding:6px 0}summary{cursor:pointer;font-weight:600}
label{display:grid;grid-template-columns:22px 1fr 40px;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
input[type=range]{width:100%}.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
@media (max-width:760px){main{grid-template-columns:1fr;height:auto}#stage{height:70vh}aside{border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<header><h1>Toon Lanky 3D · 2D-feel v9 · emotions · "Kai"</h1>
<button data-v="orbit" class="on">360 orbit</button><button data-v="turn">Turnaround</button>
<button data-v="front">Front</button><button data-v="side">Side</button><button data-v="back">Back</button><button data-v="q34">3/4</button>
<button data-v="top">Top</button><button data-v="bottom">Bottom</button><button id="spin">Auto-spin</button><button id="sheetB">Expression sheet</button><button id="twos" class="on">Animate on twos</button><button id="hatchB" class="on">Hatching</button><label style="display:flex;gap:6px;width:auto;color:var(--muted)">Ink<input id="lw" type=range min=0 max=6 step=0.1 value=3.2 style="width:90px"></label></header>
<main><div id="stage"><canvas id="c"></canvas><div id="labels"></div></div>
<aside>
<div class="row" id="poses"></div><div class="row" id="faces"></div>
<div class="row"><button id="reset">Reset all joints</button></div>
<div id="joints"></div>
<p style="font-size:12px;color:var(--muted)">Drag to orbit, scroll/pinch to zoom. Every joint has X/Y/Z rotation sliders (degrees).</p>
</aside></main>
<script src="three.min.js"></script>
<script>window.SPEC=JSON.parse(decodeURIComponent(location.hash.slice(1)||'{}'));
// ===== STYLE TOKENS v4: 3D model, 2D feel (hard cel, hand-painted texture, ink lines, on-twos) =====
const S={skin:'#e9a77a',skinSh:'#cf8564',hair:'#1a1a22',hairSh:'#07070b',shirt:'#c8232c',shirtSh:'#7e1430',sleeve:'#f3eee4',sleeveSh:'#b9adc0',pants:'#2b3142',pantsSh:'#151827',shoe:'#c8232c',shoeSh:'#7e1430',sole:'#f3eee4',soleSh:'#b9adc0',metal:'#c9c9cf',metalSh:'#6c6c78',eyeW:'#ffffff',eyeWSh:'#d8d2e6',ink:'#121218'};
Object.assign(S,window.SPEC.S||{});
const U={time:{value:0},lineW:{value:3.2},res:{value:new THREE.Vector2(1,1)},hatch:{value:1}};
// ---- hand-painted canvas textures (brush grain, fabric, fold lines) ----
function rnd(s){return()=>(s=Math.sin(s)*10000,s-Math.floor(s))}
function tex(kind){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const r=rnd(kind.length*7.3);
  g.fillStyle='#fff';g.fillRect(0,0,256,256);
  // dry-brush grain
  for(let i=0;i<900;i++){g.fillStyle=`rgba(0,0,0,${r()*0.05})`;g.save();g.translate(r()*256,r()*256);g.rotate(r()*0.4-0.2);g.fillRect(0,0,6+r()*28,1+r()*2);g.restore()}
  g.strokeStyle='rgba(18,18,24,.55)';g.lineCap='round';
  if(kind==='denim'){for(let i=0;i<256;i+=3){g.fillStyle=`rgba(255,255,255,${0.03+r()*0.04})`;g.fillRect(0,i,256,1)}
    g.lineWidth=2.2;[[40,80],[150,95],[90,170],[210,190]].forEach(([x,y])=>{g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+18,y+6,x+34,y-4);g.stroke()});
    g.lineWidth=1.4;g.setLineDash([5,4]);g.beginPath();g.moveTo(128,0);g.lineTo(128,256);g.stroke();g.setLineDash([])}
  if(kind==='shirt'){g.lineWidth=2;[[30,200],[180,210],[100,60]].forEach(([x,y])=>{g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+12,y-14,x+30,y-10);g.stroke()})}
  if(kind==='knit'){for(let i=0;i<256;i+=8){g.fillStyle='rgba(0,0,0,.06)';g.fillRect(0,i,256,3)}g.lineWidth=3;g.beginPath();g.moveTo(0,232);g.lineTo(256,232);g.stroke()}
  if(kind==='skin'){g.fillStyle='rgba(255,80,90,.0)';}
  if(kind==='hair'){g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=2;for(let i=0;i<14;i++){const x=r()*256;g.beginPath();g.moveTo(x,0);g.quadraticCurveTo(x+20,128,x-10,256);g.stroke()}}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
const TX={plain:tex('plain'),denim:tex('denim'),shirt:tex('shirt'),knit:tex('knit'),hair:tex('hair'),skin:tex('skin')};
// ---- cel material: camera-locked key light, hard 2-tone step, screen-space hatching in shadow, rim line ----
const celV=`varying vec3 vN;varying vec2 vUv;varying vec3 vV;void main(){vUv=uv;vec4 mv=modelViewMatrix*vec4(position,1.);vV=-mv.xyz;vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*mv;}`;
const celF=`uniform vec3 lit;uniform vec3 shd;uniform sampler2D map;uniform vec2 rep;uniform float hatch;uniform float time;varying vec3 vN;varying vec2 vUv;varying vec3 vV;
void main(){vec3 n=normalize(vN);vec3 L=normalize(vec3(-.45,.65,.6));float d=dot(n,L);
 float g=texture2D(map,vUv*rep).r;float t=.08+(g-.9)*.6;
 float lm=smoothstep(t-.015,t+.015,d);vec3 c=mix(shd,lit,lm);
 // second tiny highlight band
 float hi=smoothstep(.9,.92,d);c=mix(c,mix(lit,vec3(1.),.22),hi*.6);
 // hatching in shadow (screen space, 2D feel)
 vec2 fc=gl_FragCoord.xy;float h=step(.78,fract((fc.x+fc.y)/7.));c=mix(c,shd*.72,h*(1.-lm)*.55*hatch);
 // paint grain
 c*=mix(.9,1.03,g);
 // rim
 float rim=1.-max(dot(n,normalize(vV)),0.);c=mix(c,lit*1.08,smoothstep(.72,.74,rim)*lm*.5);
 gl_FragColor=vec4(c,1.);}`;
function M(lit,shd,map='plain',rep=[1,1]){return new THREE.ShaderMaterial({vertexShader:celV,fragmentShader:celF,uniforms:{lit:{value:new THREE.Color(lit)},shd:{value:new THREE.Color(shd)},map:{value:TX[map]},rep:{value:new THREE.Vector2(...rep)},hatch:U.hatch,time:U.time}})}
// ---- ink outline: clip-space extrusion = constant pixel width, with boiling (line wobble on twos) ----
const inkMat=new THREE.ShaderMaterial({side:THREE.BackSide,uniforms:U,
 vertexShader:`uniform float lineW;uniform vec2 res;uniform float time;void main(){vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.);vec3 n=normalize(normalMatrix*normal);vec2 dir=normalize((projectionMatrix*vec4(n,0.)).xy+1e-5);
 float boil=.8+.45*sin(dot(position,vec3(13.1,7.7,5.3))+floor(time*12.)*1.7);p.xy+=dir*lineW*boil*2./res*p.w;p.z+=.0006*p.w;gl_Position=p;}`,
 fragmentShader:`void main(){gl_FragColor=vec4(${'0.07,0.07,0.094'},1.);}`});
const mats={};function mat(k){if(mats[k])return mats[k];const P={skin:[S.skin,S.skinSh,'skin'],hair:[S.hair,S.hairSh,'hair',[2,1]],shirt:[S.shirt,S.shirtSh,'shirt'],sleeve:[S.sleeve,S.sleeveSh,'knit',[1,1]],pants:[S.pants,S.pantsSh,'denim'],shoe:[S.shoe,S.shoeSh],sole:[S.sole,S.soleSh],metal:[S.metal,S.metalSh],eye:[S.eyeW,S.eyeWSh]}[k];return mats[k]=M(...P)}
const flat=c=>new THREE.MeshBasicMaterial({color:c});
function part(geo,k,parent,pos=[0,0,0],rot=[0,0,0],scl=[1,1,1],outline=true){
  const m=new THREE.Mesh(geo,typeof k==='string'?mat(k):k);m.position.set(...pos);m.rotation.set(...rot);m.scale.set(...scl);parent.add(m);
  if(outline){const o=new THREE.Mesh(geo,inkMat);m.add(o)}return m}
const J={};function joint(name,parent,pos){const j=new THREE.Group();j.name=name;j.position.set(...pos);parent.add(j);J[name]=j;return j}
// tapered smooth limb (lathe) from radius r1 at top to r2 at bottom, length l, hanging down
function cLimb(r1,r2,l,bulge=0.04){const pts=[];for(let i=0;i<=8;i++){const a=Math.PI/2*(i/8);pts.push(new THREE.Vector2(Math.sin(a)*r1+0.0005,Math.cos(a)*r1))}for(let i=1;i<14;i++){const t=i/14;pts.push(new THREE.Vector2(r1+(r2-r1)*t+Math.sin(t*Math.PI)*bulge*r1,-l*t))}for(let i=0;i<=8;i++){const a=Math.PI/2*(i/8);pts.push(new THREE.Vector2(Math.cos(a)*r2+0.0005,-l-Math.sin(a)*r2))}return new THREE.LatheGeometry(pts.reverse(),28)}
function limb(r1,r2,l,bulge=0.06){const pts=[];const N=14;pts.push(new THREE.Vector2(0.001,0));for(let i=0;i<=N;i++){const t=i/N;const r=r1+(r2-r1)*t+Math.sin(t*Math.PI)*bulge*r1;pts.push(new THREE.Vector2(r*(t<.06?.7+t*5:t>.94?.7+(1-t)*5:1),-l*t))}pts.push(new THREE.Vector2(0.001,-l));return new THREE.LatheGeometry(pts.reverse(),24)}
const sph=(r,w=28,h=20)=>new THREE.SphereGeometry(r,w,h);
const tor=(r,t,arc=Math.PI*2)=>new THREE.TorusGeometry(r,t,10,32,arc);
const inkLine=(r,t,arc)=>new THREE.Mesh(tor(r,t,arc),flat(S.ink));

// ===== BUILD "KAI" (detailed) =====
const root=new THREE.Group();
const hips=joint('hips',root,[0,4.6,0]);
part(sph(0.56),'pants',hips,[0,-0.02,0],[0,0,0],[1,0.55,0.62]);
const belt=part(tor(0.52,0.06),flat(S.ink),hips,[0,0.2,0],[Math.PI/2,0,0],[1,0.62,1],false);
part(new THREE.BoxGeometry(0.16,0.12,0.04),'metal',hips,[0,0.2,0.33]);
const spine=joint('spine',hips,[0,0.22,0]);
part(limb(0.42,0.46,0.95,0.04),'sleeve',spine,[0,0.95,0],[0,0,0],[1.08,1,0.66]); // long-sleeve under-layer / torso
const chest=joint('chest',spine,[0,0.9,0]);
part(limb(0.74,0.5,1.0,0.12),'shirt',chest,[0,0.98,0],[0,0,0],[1,1,0.7]);part(sph(0.34),'shirt',chest,[0.22,0.62,0.25],[0,0,0],[1,0.75,0.5],false);part(sph(0.34),'shirt',chest,[-0.22,0.62,0.25],[0,0,0],[1,0.75,0.5],false);part(sph(0.3),'shirt',chest,[0,0.95,-0.05],[0,0,0],[1.9,0.5,0.9],false); // pecs + traps
// white chest panel (curved, smooth)
part(new THREE.CylinderGeometry(0.78,0.62,0.62,24,1,true,-0.45,0.9),'sleeve',chest,[0,0.5,0],[0,0,0],[1.01,1,0.76],false);
part(tor(0.17,0.045),'shirt',chest,[0,0.98,0],[Math.PI/2,0,0],[1,0.7,1]); // collar
const neck=joint('neck',chest,[0,0.95,0]);part(limb(0.18,0.22,0.42,0),'skin',neck,[0,0.4,0]);
// necklace + tag (pin 2)
const nl=part(tor(0.2,0.012,Math.PI*1.1),flat('#8d8d98'),neck,[0,0.02,0.04],[1.2,0,Math.PI*-0.05+Math.PI],[1,1,1],false);
part(new THREE.BoxGeometry(0.07,0.13,0.02),'metal',chest,[0,0.68,0.39],[0.2,0,0]);
const head=joint('head',neck,[0,0.4,0]);head.scale.setScalar(1.32);
part(sph(0.5,36,28),'skin',head,[0,0.46,0],[0,0,0],[0.9,1.1,0.9]);
part(sph(0.3),'skin',head,[0,0.2,0.12],[0,0,0],[1,0.8,1]); // jaw
[1,-1].forEach(x=>{const ear=part(sph(0.11),'skin',head,[x*0.45,0.42,-0.02],[0,0,0],[0.45,1,0.75]);const il=inkLine(0.05,0.008,Math.PI);il.position.set(x*0.02,0,0.03);il.rotation.set(0,x*1.2,Math.PI/2*x);ear.add(il)});
part(sph(0.06,12,10),'skin',head,[0,0.38,0.46],[0,0,0],[0.8,1,1.2]); // nose
const eyes={};
[['L',0.155],['R',-0.155]].forEach(([s,x])=>{const e=new THREE.Group();e.position.set(x,0.56,0.375);e.rotation.y=x*0.5;head.add(e);
  const w=part(sph(0.15),'eye',e,[0,0,0],[0,0,0],[0.82,1.15,0.45]);
  const p=new THREE.Mesh(sph(0.055,16,12),flat(S.ink));p.position.set(0,0,0.06);p.scale.set(1,1.25,0.15);e.add(p);
  const hl=new THREE.Mesh(sph(0.016,8,6),flat('#ffffff'));hl.position.set(0.02,0.03,0.03);p.add(hl);
  const lid=new THREE.Group();lid.scale.set(0.85,1.19,0.47);e.add(lid);
  part(new THREE.SphereGeometry(0.158,28,14,0,Math.PI*2,0,Math.PI/2),'skin',lid,[0,0,0],[0,0,0],[1,1,1],false);
  const lash=inkLine(0.158,0.022,Math.PI);lash.rotation.x=Math.PI/2;lid.add(lash);
  
  // brow = arc that wraps the skull surface (never floats in front of the eye from any angle)
  const brow=new THREE.Group();brow.position.set(0,0.8,0);head.add(brow);
  const bArc=new THREE.Mesh(new THREE.TorusGeometry(0.372,0.028,8,24,0.5),flat(S.hair));bArc.rotation.x=Math.PI/2;
  const yaw=new THREE.Group();yaw.rotation.y=0.25-Math.acos(x/0.372);yaw.add(bArc);brow.add(yaw);brow.userData.side=x>0?1:-1;
  eyes[s]={e,w,p,lid,brow,yaw,c:0}});
const mouth=inkLine(0.1,0.016,Math.PI);mouth.position.set(0,0.2,0.43);mouth.rotation.z=Math.PI;head.add(mouth);
// hair: base cap + many graphic locks (smooth cones, ink outlined)
part(sph(0.53,32,24),'hair',head,[0,0.86,-0.2],[0,0,0],[0.97,0.8,0.94]);
const locks=[[0,1.12,0,0.2,0.48,0,0],[0.24,1.06,0.02,0.18,0.42,0,-0.55],[-0.26,1.06,0.02,0.18,0.42,0,0.6],[0.42,0.9,-0.05,0.15,0.36,0,-1.1],[-0.44,0.9,-0.05,0.15,0.36,0,1.1],
 [0.12,1.1,0.24,0.15,0.36,0.9,-0.25],[-0.14,1.08,0.26,0.15,0.38,0.9,0.3],[0.32,1.0,0.2,0.13,0.3,0.9,-0.7],[-0.34,1.0,0.18,0.13,0.3,0.9,0.75],
 [0,0.95,-0.42,0.22,0.42,-1.1,0],[0.25,0.85,-0.38,0.18,0.36,-1.2,-0.5],[-0.25,0.85,-0.38,0.18,0.36,-1.2,0.5],[0,0.6,-0.48,0.2,0.32,-2.2,0]];
locks.forEach(([x,y,z,r,h,rx,rz])=>part(new THREE.ConeGeometry(r,h,14,1),'hair',head,[x,y,z],[rx,0,rz],[1,1,0.7]));
part(sph(0.3),'hair',head,[0.0,1.1,0.2],[0.5,0,0],[1.5,0.35,0.6]); // fringe
// arms
function arm(s,x){const sh=joint('shoulder'+s,chest,[x*0.78,0.82,0]);
  part(sph(0.25),'shirt',sh,[0,-0.06,0],[0,0,0],[1,1,1]);part(limb(0.26,0.22,0.5),'shirt',sh,[0,0,0]); // tee sleeve
  part(tor(0.21,0.03),'shirt',sh,[0,-0.5,0],[Math.PI/2,0,0]);
  part(cLimb(0.16,0.13,0.82,0.3),'sleeve',sh,[0,0,0]);
  const el=joint('elbow'+s,sh,[0,-0.82,0]);
  part(cLimb(0.13,0.09,0.8,0.22),'sleeve',el,[0,0,0]);part(tor(0.095,0.028),'sleeve',el,[0,-0.74,0],[Math.PI/2,0,0]); // cuff
  const wr=joint('wrist'+s,el,[0,-0.82,0]);
  part(cLimb(0.05,0.05,0.06,0),'skin',wr,[0,0.02,0]);part(sph(0.13),'skin',wr,[0,-0.12,0],[0,0,0],[0.85,1,0.45]);
  [-0.075,-0.026,0.024,0.072].forEach((fx,i)=>{const f=joint('finger'+s+i,wr,[fx,-0.22,0]);const L=i===0||i===3?0.09:0.11;part(limb(0.026,0.024,L,0),'skin',f,[0,0,0]);
    const f2=joint('finger'+s+i+'tip',f,[0,-L,0]);part(limb(0.024,0.02,L*0.85,0),'skin',f2,[0,0,0])});
  const th=joint('thumb'+s,wr,[x*-0.09,-0.1,0.04]);th.rotation.z=x*0.5;part(limb(0.03,0.026,0.13,0),'skin',th,[0,0,0]);
  sh.rotation.order='ZXY';sh.rotation.z=x*0.08}
arm('L',1);arm('R',-1);
// legs: baggy cargo, chunky sneakers
function leg(s,x){const h=joint('hip'+s,hips,[x*0.27,-0.1,0]);h.rotation.order='ZXY';part(cLimb(0.28,0.23,1.92,0.08),'pants',h,[0,0,0]);
  part(sph(0.14),'pants',h,[x*0.25,-1.1,0.02],[0,0,0],[0.45,1.2,1]); // cargo pocket
  part(new THREE.BoxGeometry(0.02,0.04,0.2),flat(S.ink),h,[x*0.31,-0.92,0.02],[0,0,0],[1,1,1],false);
  const k=joint('knee'+s,h,[0,-1.92,0]);
  part(cLimb(0.23,0.25,1.86,0.03),'pants',k,[0,0,0]);
  const w1=inkLine(0.12,0.01,Math.PI*0.6);w1.position.set(0,-1.5,0.2);w1.rotation.z=-1.3;k.add(w1); // fold line
  const a=joint('ankle'+s,k,[0,-1.95,0]);
  part(sph(0.22),'shoe',a,[0,-0.06,0.1],[0,0,0],[0.85,0.62,1.55]);
  part(sph(0.15),'sole',a,[0,-0.08,0.37],[0,0,0],[1.05,0.7,0.8]); // toe cap
  part(limb(0.23,0.25,0.09,0),'sole',a,[0,-0.15,0.1],[0,0,0],[0.85,1,1.55]); // sole
  [0.05,0.15,0.25].forEach(z=>{const l=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.018,0.02),flat(S.sole));l.position.set(0,0.07-z*0.25,z);l.rotation.x=-0.4;a.add(l)});
  part(tor(0.17,0.035),'sole',a,[0,0.1,0.02],[Math.PI/2,0,0])}
leg('L',1);leg('R',-1);

// ===== SCENE =====
const cv=document.getElementById('c');const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(2,devicePixelRatio));
const scene=new THREE.Scene();scene.add(root);
const shadowDisc=new THREE.Mesh(new THREE.CircleGeometry(1.4,48),new THREE.MeshBasicMaterial({color:0x2a2440,transparent:true,opacity:0.22}));shadowDisc.rotation.x=-Math.PI/2;shadowDisc.position.y=0.35;shadowDisc.scale.set(1,0.55,1);scene.add(shadowDisc);
const cam=new THREE.PerspectiveCamera(22,1,0.1,100);const tgt=new THREE.Vector3(0,4.7,0);
